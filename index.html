        :root {

            display: none;
            height: 100vh;
            overflow: hidden;
        }

        .app-layout {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
        }

        .nav-section {
            padding: 16px 0 8px 0;
        }

        .nav-section-title {
            padding: 0 16px 8px 16px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-item {
            display: block;
            padding: 8px 16px;
            margin: 0 8px;
            border-radius: 6px;
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
            background: none;
            width: calc(100% - 16px);
            text-align: left;
        }

        .nav-item:hover {
            background: var(--bg-card);
            color: var(--text);
        }

        .nav-item.aivic-active {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .page-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quick-action-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .quick-action-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .quick-action-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .quick-action-btn.primary:hover {
            background: var(--primary-hover);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .emergency-section {
            border-top: 1px solid var(--border);
            margin-top: auto;
            padding: 12px 8px;
        }

        .emergency-btn {
            width: 100%;
            padding: 10px 16px;
            border-radius: 6px;
            border: 1px solid var(--error);
            background: var(--bg-card);
            color: var(--error);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .emergency-btn:hover {
            background: var(--error);
            color: white;
        }

        .panel-container {
            height: 100%;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .card-header {
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .user-menu {
            position: relative;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -220px;
                z-index: 100;
                transition: left 0.3s ease;
            }

            .sidebar.open {
                left: 0;
            }

            .main-content {
                width: 100%;
            }

            .content-area {
                padding: 12px 16px;
            }
        }

        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
            font-size: 12px;
        }
    </style>

            const titleElement = document.getElementById('current-page-title');
            if (titleElement && pageTitles[screenId]) {
                titleElement.textContent = pageTitles[screenId];
            }
        };

        document.addEventListener('DOMContentLoaded', function() {
            const sidebar = document.querySelector('.sidebar');
            const toggleBtn = document.createElement('button');
            toggleBtn.innerHTML = '☰';
            toggleBtn.className = 'mobile-menu-btn';
            toggleBtn.style.cssText = 'display:none;position:fixed;top:10px;left:10px;z-index:200;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;padding:8px;cursor:pointer;';
            
            if (window.innerWidth <= 768) {
                toggleBtn.style.display = 'block';
                document.body.appendChild(toggleBtn);
            }

            toggleBtn.addEventListener('click', function() {
                sidebar.classList.toggle('open');
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth <= 768) {
                    toggleBtn.style.display = 'block';
                } else {
                    toggleBtn.style.display = 'none';
                    sidebar.classList.remove('open');
                }
            });

            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768 && !sidebar.contains(e.target) && !toggleBtn.contains(e.target)) {
                    sidebar.classList.remove('open');
                }
            });
        });

    <script>
(function() {
  // 設定（HTML 側で定義した値を読み取る）
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // ── 通知 helper ──
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // ── CRUD API（生成 panel が呼ぶ。fetch 直叩き禁止）──
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // ── 画面分割 API（lazy load 方式）──
  // 各画面の HTML と initJs は panels/<screenId>.json に分離されている。
  // showScreen(id) が初回呼ばれた時に fetch して該当 panel コンテナに inject する。
  // これで index.html が肥大化せず、画面追加・修正の影響範囲も 1 ファイルに局所化される。
  var initialized = {};
  var panelCache = {};
  function fetchPanel(screenId) {
    if (panelCache[screenId]) return panelCache[screenId];
    panelCache[screenId] = fetch("./panels/" + encodeURIComponent(screenId) + ".json")
      .then(function(r) {
        if (!r.ok) throw new Error("panel fetch failed: " + r.status);
        return r.json();
      })
      .catch(function(e) {
        console.error("[aivic] panel fetch error:", screenId, e);
        panelCache[screenId] = null;
        return null;
      });
    return panelCache[screenId];
  }
  window.showScreen = function(screenId) {
    document.querySelectorAll('[data-aivic-panel]').forEach(function(el) {
      el.style.display = (el.getAttribute("data-aivic-panel") === screenId) ? "" : "none";
    });
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === screenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });
    if (initialized[screenId]) return;
    var container = document.querySelector('[data-aivic-panel="' + screenId + '"]');
    if (!container) return;
    initialized[screenId] = true;
    fetchPanel(screenId).then(function(panelData) {
      if (!panelData || !container) return;
      // パネル HTML を container に挿入
      container.innerHTML = panelData.html || "";
      // initJs は関数文字列なので Function コンストラクタで評価する
      var initFn = null;
      try {
        initFn = (new Function("return (" + panelData.initJs + ")"))();
      } catch(e) {
        console.error("[aivic] initJs compile error:", screenId, e);
        return;
      }
      if (typeof initFn !== "function") return;
      Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      })).then(function(tables) {
        try { initFn(container, API_URL, tables); } catch(e) { console.error("[aivic] initFn error:", screenId, e); }
      });
    });
  };

  // ── 初回マウント時のサンプルデータ投入 ──
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: 最初の panel を表示 ──
  document.addEventListener("DOMContentLoaded", function() {
    var firstPanel = document.querySelector('[data-aivic-panel]');
    if (!firstPanel) return;
    var firstScreenId = firstPanel.getAttribute("data-aivic-panel");
    seedAllIfEmpty().then(function() { window.showScreen(firstScreenId); });
  });
})();

</script>
