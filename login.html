<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>現場作業員向け工数記録アプリの開発 - ログイン画面</title>
  <style>
:root {
  --primary: #2196f3;
  --primary-hover: #1976d2;
  --bg-main: #f8fafe;
  --bg-card: #ffffff;
  --bg-sidebar: #f0f7ff;
  --border: #e3f2fd;
  --text: #1a1a1a;
  --text-muted: #424242;
  --top-bar-bg: #ffffff;
  --top-bar-border: #bbdefb;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 0; background: var(--bg-main); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.login-card { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.10); border-radius: 12px; padding: 32px; width: 380px; max-width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
.login-card .app-name { font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 6px; }
.login-card h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; color: var(--text); }
.login-card .subtitle { font-size: 12px; color: var(--text-muted); margin: 0 0 24px; }
.login-card label { display: block; font-size: 11px; color: var(--text-muted); margin: 12px 0 4px; }
.login-card input { width: 100%; padding: 8px 12px; border: 1px solid rgba(255,255,255,0.18); border-radius: 6px; background: rgba(0,0,0,0.25); color: var(--text); font-size: 13px; line-height: 1.4; }
.login-card input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(255,255,255,0.06); }
.login-card .actions { margin-top: 20px; }
.login-card button.primary { width: 100%; padding: 10px; background: var(--primary); color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
.login-card button.primary:hover { background: var(--primary-hover); }
.login-card .footnote { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 16px; line-height: 1.5; }
.login-card .footnote a { color: var(--primary); text-decoration: none; }
.login-card .footnote a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <form class="login-card" id="login-form" autocomplete="on">
    <p class="app-name">現場作業員向け工数記録アプリの開発</p>
    <h1>ログイン画面</h1>
    <p class="subtitle">アカウント情報を入力してください</p>
    <label for="login-username">ユーザー名</label>
    <input type="text" id="login-username" name="username" autocomplete="username" autofocus>
    <label for="login-password">パスワード</label>
    <input type="password" id="login-password" name="password" autocomplete="current-password">
    <div class="actions">
      <button type="submit" class="primary" id="login-btn">ログイン</button>
    </div>
    <p class="footnote">サンプル実装ではどの入力でもログインできます。<br>パスワードを忘れた方は管理者にお問い合わせください。</p>
  </form>
  <script>
    (function() {
      var form = document.getElementById('login-form');
      function goToApp(e) {
        if (e && e.preventDefault) e.preventDefault();
        // サンプル実装: 入力内容に関わらずメインアプリへ遷移する
        window.location.href = './index.html';
      }
      form.addEventListener('submit', goToApp);
      document.getElementById('login-btn').addEventListener('click', goToApp);
    })();
  </script>
</body>
</html>
