<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現場作業員向け工数記録アプリの開発 - ログイン画面</title>
    <style>
        :root {
            --primary: #cc1f1f;
            --primary-hover: #a61a1a;
            --bg-main: #0d0d0d;
            --bg-card: #1a1010;
            --bg-sidebar: #151111;
            --border: #331a1a;
            --text: #e6e6e6;
            --text-muted: #999999;
            --top-bar-bg: #1f1515;
            --top-bar-border: #2d1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(204, 31, 31, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(204, 31, 31, 0.05) 0%, transparent 50%);
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px 32px;
            box-shadow: 
                0 4px 20px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(204, 31, 31, 0.1);
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(204, 31, 31, 0.3);
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(204, 31, 31, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .login-button {
            width: 100%;
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .login-button:hover {
            background: var(--primary-hover);
            box-shadow: 0 4px 12px rgba(204, 31, 31, 0.3);
        }

        .login-button:active {
            transform: translateY(1px);
        }

        .login-footer {
            margin-top: 32px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
                margin: 0 16px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1 class="login-title" data-testid="login-title">ログイン</h1>
            <p class="login-subtitle">現場作業員向け工数記録アプリ</p>
        </div>

        <form data-testid="login-form" id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">ユーザー名</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username"
                    class="form-input" 
                    data-testid="username"
                    placeholder="ユーザー名を入力"
                    required
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="password">パスワード</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    class="form-input" 
                    data-testid="password"
                    placeholder="パスワードを入力"
                    required
                >
            </div>

            <button 
                type="submit" 
                class="login-button" 
                data-testid="login-button"
            >
                ログイン
            </button>
        </form>

        <div class="login-footer">
            サンプル実装ではどの入力でもログインできます
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = './index.html';
        });
    </script>
</body>
</html>
