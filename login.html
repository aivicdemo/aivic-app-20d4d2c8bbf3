<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現場作業員向け工数記録アプリの開発 - ログイン画面</title>
  <style>
    :root {
      --primary: #2196f3;
      --primary-hover: #1976d2;
      --bg-main: #f8fafe;
      --bg-card: #ffffff;
      --bg-sidebar: #f0f7ff;
      --border: #e3f2fd;
      --text: #1a1a1a;
      --text-muted: #424242;
      --top-bar-bg: #ffffff;
      --top-bar-border: #bbdefb;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg-main) 0%, #e8f4fd 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      line-height: 1.6;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .login-card {
      background: var(--bg-card);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(33, 150, 243, 0.08);
      border: 1px solid var(--border);
      padding: 40px 32px;
      backdrop-filter: blur(10px);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-title {
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.2s ease;
      background: var(--bg-card);
      color: var(--text);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
    }

    .form-input::placeholder {
      color: var(--text-muted);
    }

    .login-button {
      width: 100%;
      padding: 14px 24px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .login-button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(33, 150, 243, 0.3);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      padding: 16px;
      background: rgba(33, 150, 243, 0.03);
      border-radius: 8px;
      border: 1px solid rgba(33, 150, 243, 0.1);
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 16px;
      }
      
      .login-card {
        padding: 32px 24px;
      }
      
      .login-title {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1 class="login-title" data-testid="login-title">ログイン</h1>
        <p class="login-subtitle">現場作業員向け工数記録アプリの開発</p>
      </div>
      
      <form data-testid="login-form">
        <div class="form-group">
          <label class="form-label" for="username">ユーザー名</label>
          <input 
            type="text" 
            id="username" 
            name="username"
            class="form-input" 
            data-testid="username"
            placeholder="ユーザー名を入力"
            required
          >
        </div>
        
        <div class="form-group">
          <label class="form-label" for="password">パスワード</label>
          <input 
            type="password" 
            id="password" 
            name="password"
            class="form-input" 
            data-testid="password"
            placeholder="パスワードを入力"
            required
          >
        </div>
        
        <button type="submit" class="login-button" data-testid="login-button">
          ログイン
        </button>
      </form>
      
      <div class="login-footer">
        サンプル実装ではどの入力でもログインできます
      </div>
    </div>
  </div>

  <script>
    document.querySelector('[data-testid="login-form"]').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = './index.html';
    });
  </script>
</body>
</html>
