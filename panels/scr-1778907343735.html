Selector('#input-net-time').value = `${netHours}時間${netMins}分`;\n    } else {\n      container.querySelector('#input-net-time').value = '';\n    }\n  }\n\n  // バリデーション関数\n  function validateForm() {\n    hideMessages();\n\n    const recordId = container.querySelector('#select-work-record').value;\n    if (!recordId) {\n      showError('修正対象の作業記録を選択してください');\n      return false;\n    }\n\n    const startTime = container.querySelector('#input-start-time').value;\n    const endTime = container.querySelector('#input-end-time').value;\n    const breakTime = parseInt(container.querySelector('#input-break-time').value) || 0;\n    const correctionReason = container.querySelector('#input-correction-reason').value.trim();\n\n    if (!startTime || !endTime) {\n      showError('作業開始時刻と終了時刻を入力してください');\n      return false;\n    }\n\n    const start = new Date(`2000-01-01 ${startTime}`);\n    let end = new Date(`2000-01-01 ${endTime}`);\n    \n    if (end <= start) {\n      end.setDate(end.getDate() + 1);\n    }\n\n    if (start.getTime() === end.getTime()) {\n      showError('作業時間が0分です。開始時刻と終了時刻を確認してください。');\n      return false;\n    }\n\n    const totalMinutes = (end - start) / (1000 * 60);\n    \n    if (breakTime > totalMinutes) {\n      showError('中断時間が作業時間を超過しています');\n      return false;\n    }\n\n    if (!correctionReason) {\n      showError('修正理由を入力してください');\n      return false;\n    }\n\n    // 異常値チェック\n    if (totalMinutes > 16 * 60) { // 16時間超過\n      showWarning('作業時間が異常です。16時間を超える作業時間が入力されています。');\n    }\n\n    return true;\n  }\n\n  // 作業記録選択ドロップダウンの更新\n  function updateWorkRecordSelect() {\n    const select = container.querySelector('#select-work-record');\n    select.innerHTML = '<option value=\"\">選択してください</option>';\n    \n    workRecords.forEach(record => {\n      const option = document.createElement('option');\n      option.value = record.作業記録ID;\n      const workDate = new Date(record.作業日).toLocaleDateString('ja-JP');\n      option.textContent = `${workDate} kDate);\n      const [startHour, startMin] = startTime.split(':');\n      startDateTime.setHours(parseInt(startHour), parseInt(startMin), 0, 0);\n\n      const endDateTime = new Date(workDate);\n      const [endHour, endMin] = endTime.split(':');\n      endDateTime.setHours(parseInt(endHour), parseInt(endMin), 0, 0);\n      if (endDateTime <= startDateTime) {\n        endDateTime.setDate(endDateTime.getDate() + 1);\n      }\n\n      const updateData = {\n        作業開始時刻: startDateTime.toISOString(),\n        作業終了時刻: endDateTime.toISOString(),\n        作業時間: totalMinutes,\n        作業内容: workDetail,\n        更新日時: new Date().toISOString()\n      };\n\n      const updated = await window.aivicApi.update(1, recordId, updateData);\n      if (updated) {\n        // 異常値検出ログを記録\n        if (totalMinutes > 16 * 60) {\n          await window.aivicApi.save(4, {\n            異常値検出ログID: crypto.randomUUID(),\n            検出対象テーブル: '作業記録',\n            検出対象レコードID: recordId,\n            ユーザーID: selectedRecord.作業員ID,\n            異常値種別: '長時間作業',\n            検出項目: '作業時間',\n            検出値: `${totalMinutes}分`,\n            閾値: '960分',\n            重要度: '高',\n            確認状況: '未確認',\n            通知送信フラグ: false,\n            検出日時: new Date().toISOString(),\n            作成日時: new Date().toISOString(),\n            更新日時: new Date().toISOString()\n          });\n        }\n\n        alert('工数修正が完了しました');\n        window.showScreen(\"scr-1778907367889\");\n      }\n    } catch (error) {\n      showError('保存に失敗しました');\n    }\n  });\n\n  // 元データ参照ボタン\n  container.querySelector('#btn-view-original').addEventListener('click', function() {\n    if (!originalData) {\n      showError('修正対象の作業記録を選択してください');\n      return;\n    }\n\n    const modal = container.querySelector('#original-data-modal');\n    const content = container.querySelector('#original-data-content');\n    \n    const startTime = new Date(originalData.作業開始時刻).toLocaleString('ja-JP');\n    const endTime = originalData.作業終了時刻 ? new Date(originalData.作業終了時刻).toLocaleString('ja-JP') : '未設定';\n    const workDate = new Date(originalData.作業日).toLocaleDateString('ja-JP');\n    \n    content.innerHTML = `\n      <div style=\"margin-bottom: 8px;\"><strong>作業日:</strong> ${workDate}</div>\n      <div style=\"margin-bottom: 8px;\"><strong>開始時刻:</strong> ${startTime}</div>\n      <div style=\"margin-bottom: 8px;\"><strong>終了時刻:</strong> ${endTime}</div>\n      <div style=\"margin-bottom: 8px;\"><strong>作業時間:</strong> ${originalData.作業時間 || 0}分</div>\n      <div style=\"margin-bottom: 8px;\"><strong>プロジェクト名:</strong> ${originalData.プロジェクト名 || ''}</div>\n      <div style=\"margin-bottom: 8px;\"><strong>作業種別:</strong> ${originalData.作業種別 || ''}</div>\n      <div style=\"margin-bottom: 8px;\"><strong>作業内容:</strong> ${originalData.作業内容 || ''}</div>\n    `;\n    \n    modal.style.display = 'block';\n  });\n\n  // モーダル閉じるボタン\n  container.querySelector('#btn-close-modal').addEventListener('click', function() {\n    container.querySelector('#original-data-modal').style.display = 'none';\n  });\n\n  // キャンセルボタン\n  container.querySelector('#btn-cancel').addEventListener('click', function() {\n    window.showScreen(\"scr-1778907367889\");\n  });\n\n  // 初期データ読み込み\n  async function loadInitialData() {\n    try {\n      workRecords = await window.aivicApi.list(1) || [];\n      workItems = await window.aivicApi.list(3) || [];\n      \n      updateWorkRecordSelect();\n      updateWorkItemSelect();\n    } catch (error) {\n      console.error('データ読み込みエラー:', error);\n    }\n  }\n\n  loadInitialData();\n}";

      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
