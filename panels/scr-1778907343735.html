window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentRecord = null;\n  let originalRecord = null;\n  let workItems = [];\n\n  // 作業項目マスタを取得\n  async function loadWorkItems() {\n    const items = await window.aivicApi.list(3); // 作業項目マスタ\n    if (items) {\n      workItems = items.filter(item => item.有効フラグ);\n      const workItemSelect = container.querySelector(\"#work-item\");\n      workItemSelect.innerHTML = '<option value=\"\">選択してください</option>';\n      workItems.forEach(item => {\n        workItemSelect.innerHTML += `<option value=\"${item.作業項目ID}\">${item.作業項目名}</option>`;\n      });\n    }\n  }\n\n  // 作業記録一覧を取得してドロップダウンに設定\n  async function loadWorkRecords() {\n    const records = await window.aivicApi.list(1); // 作業記録\n    if (records) {\n      const targetSelect = container.querySelector(\"#target-record\");\n      targetSelect.innerHTML = '<option value=\"\">選択してください</option>';\n      records.forEach(record => {\n        const workDate = new Date(record.作業日).toLocaleDateString('ja-JP');\n        const projectName = record.プロジェクト名 || '';\n        const workType = record.作業種別 || '';\n        targetSelect.innerHTML += `<option value=\"${record.作業記録ID}\">${workDate} - ${projectName} - ${workType}</option>`;\n      });\n    }\n  }\n\n  // 時間計算関数\n  function calculateWorkTime() {\n    const startTime = container.querySelector(\"#start-time\").value;\n    const endTime = container.querySelector(\"#end-time\").value;\n    const breakTime = parseInt(container.querySelector(\"#break-time\").value) || 0;\n\n    if (!startTime || !endTime) {\n      container.querySelector(\"#total-work-time\").value = \"\";\n      container.querySelector(\"#net-work-time\").value = \"\";\n      return;\n    }\n\n    const start = new Date(`2000-01-01 ${startTime}`);\n    let end = new Date(`2000-01-01 ${endTime}`);\n    \n    // 24時間跨ぎの場合\n    if (end <= start) {\n      end.setDate(end.getDate() + 1);\n    }\n\n    const totalMinutes = (end - start) / (1000 * 60);\n    const netMinutes = Math.max(0, totalMinutes - breakTime);\n\n    const totalHours = Math.floor(totalMinutes / 60);\n    const totalMins = totalMinutes % 60;\n    const netHours = Math.floor(netMinutes / 60);\n    const netMins = netMinutes % 60;\n\n    container.querySelector(\"#total-work-time\").value = `${totalHours}時間${totalMins}分`;\n    container.querySelector(\"#net-work-time\").value = `${netHours}時間${netMins}分`;\n\n    // 異常値チェック\n    checkAbnormalValues(totalMinutes, breakTime);\n  }\n\n  // 異常値チェック\n  function checkAbnormalValues(totalMinutes, breakTime) {\n    const warningArea = container.querySelector(\"#warning-area\");\n    let warnings = [];\n\n    if (totalMinutes === 0) {\n      warnings.push(\"作業時間が0分です。開始時刻と終了時刻を確認してください。\");\n    }\n    if (totalMinutes > 12 * 60) { // 12時間超過\n      warnings.push(\"作業時間が12時間を超えています。異常な値の可能性があります。\");\n    }\n    if (breakTime > totalMinutes) {\n      warnings.push(\"中断時間が作業時間を超過しています。\");\n    }\n\n    if (warnings.length > 0) {\n      warningArea.innerHTML = warnings.join('<br>');\n      warningArea.style.display = 'block';\n    } else {\n      warningArea.style.display = 'none';\n    }\n  }\n\n  // エラー表示\n  function showError(message) {\n    const errorArea = container.querySelector(\"#error-area\");\n    errorArea.innerHTML = message;\n    errorArea.style.display = 'block';\n  }\n\n  function hideError() {\n    container.querySelector(\"#error-area\").style.display = 'none';\n  }\n\n  // バリデーション\n  function validateForm() {\n    hideError();\n    \n    const targetRecord = container.querySelector(\"#target-record\").value;\n    const startTime = container.querySelector(\"#start-time\").value;\n    const endTime = container.querySelector(\"#end-time\").value;\n    const correctionReason = container.querySelector(\"#correction-reason\").value.trim();\n\n    if (!targetRecord) {\n      showError(\"修正対象の作業記録を選択してください。\");\n      return false;\n    }\n\n    if (!startTime || !endTime) {\n      showError(\"作業開始時刻と終了時刻を入力してください。\");\n      return false;\n    }\n\n    const start = new Date(`2000-01-01 ${startTime}`);\n    let end = new Date(`2000-01-01 ${endTime}`);\n    if (end <= start) {\n      end.setDate(end.getDate() + 1);\n    }\n\n    const totalMinutes = (end - start) / (1000 * 60);\n    if (totalMinutes === 0) {\n      showError(\"作業開始時刻と終了時刻が同じです。正しい時刻を入力してください。\");\n      return false;\n    }\n\n    const breakTime = parseInt(container.querySelector(\"#break-time\").value) || 0;\n    if (breakTime > totalMinutes) {\n      showError(\"中断時間が作業時間を超過しています。\");\n      return false;\n    }\n\n    if (!correctionReason) {\n      showError(\"修正理由を入力してください。\");\n      return false;\n    }\n\n    if (correctionReason.length > 500) {\n      showError(\"修正理由は500文字以内で入力してください。\");\n      return false;\n    }\n\n    const workDetail = container.querySelector(\"#work-detail\").value;\n    if (workDetail.length > 1000) {\n      showError(\"作業内容詳細は1000文字以内で入力してください。\");\n      return false;\n    }\n\n    return true;\n  }\n\n  // 作業記録選択時の処理\n  container.querySelector(\"#target-record\").addEventListener(\"change\", async function() {\n    const recordId = this.value;\n    if (!recordId) {\n      currentRecord = null;\n      originalRecord = null;\n      // フォームクリア\n      container.querySelector(\"#work-date\").value = \"\";\n      container.querySelector(\"#start-time\").value = \"\";\n      container.querySelector(\"#end-time\").value = \"\";\n      container.querySelector(\"#break-time\").value = \"\";\n      container.querySelector(\"#work-item\").value = \"\";\n      container.querySelector(\"#work-detail\").value = \"\";\n      container.querySelector(\"#correction-reason\").value = \"\";\n      calculateWorkTime();\n      return;\n    }\n\n    const records = await window.aivicApi.list(1);\n    if (records) {\n      currentRecord = records.find(r => r.作業記録ID === recordId);\n      originalRecord = { ...currentRecord }; // 元データ保存\n      \n      if (currentRecord) {\n        // フォームに値設定\n        const workDate = new Date(currentRecord.作業日).toLocaleDateString('ja-JP');\n        container.querySelector(\"#work-date\").value = workDate;\n        \n        const startTime = new Date(currentRecord.作業開始時刻);\n        const endTime = currentRecord.作業終了時刻? new Date(currentRecord.作業終了時刻) : null;\n        \n        container.querySelector(\"#start-time\").value = startTime.toTimeString().slice(0, 5);\n        if (endTime) {\n          container.querySelector(\"#end-time\").value = endTime.toTimeString().slice(0, 5);\n        }\n\n        // 中断時間を計算（中断記録から）\n        const breakRecords = await window.aivicApi.list(2); // 中断記録\n        if (breakRecords) {\n          const totalBreakTime = breakRecords\n            .filter(br => br.作業記録ID === recordId && br.中断時間)\n            .reduce((sum, br) => sum + br.中断時間, 0);\n          container.querySelector(\"#break-time\").value = totalBreakTime || 0;\n        }\n\n        container.querySelector(\"#work-item\").value = currentRecord.作業項目ID || \"\";\n        container.querySelector(\"#work-detail\").value = currentRecord.作業内容 || \"\";\n        \n        calculateWorkTime();\n      }\n    }\n  });\n\n  // 時間入力時の計算\n  container.querySelector(\"#start-time\").addEventListener(\"input\", calculateWorkTime);\n  container.querySelector(\"#end-time\").addEventListener(\"input\", calculateWorkTime);\n  container.querySelector(\"#break-time\").addEventListener(\"input\", calculateWorkTime);\n\n  // 元データ参照ボタン\n  container.querySelector(\"#btn-view-original\").addEventListener(\"click\", function() {\n    if (!originalRecord) {\n      showError(\"修正対象の作業記録を選択してください。\");\n      return;\n    }\n\n    const modal = container.querySelector(\"#original-data-modal\");\n    const content = container.querySelector(\"#original-data-content\");\n    \n    const startTime = new Date(originalRecord.作業開始時刻).toLocaleString('ja-JP');\n    const endTime = originalRecord.作業終了時刻 ? new Date(originalRecord.作業終了時刻).toLocaleString('ja-JP') : '未設定';\n    \n    content.innerHTML = `\n      <div><strong>作業日:</strong> ${new Date(originalRecord.作業日).toLocaleDateString('ja-JP')}</div>\n      <div><strong>開始時刻:</strong> ${startTime}</div>\n      <div><strong>終了時刻:</strong> ${endTime}</div>\n      <div><strong>プロジェクト名:</strong> ${originalRecord.プロジェクト名 || ''}</div>\n      <div><strong>作業場所:</strong> ${originalRecord.作業場所 || ''}</div>\n      <div><strong>作業種別:</strong> ${originalRecord.作業種別 || ''}</div>\n      <div><strong>作業内容:</strong> ${originalRecord.作業内容 || ''}</div>\n      <div><strong>進捗状況:</strong> ${originalRecord.進捗状況 || ''}</div>\n      <div><strong>備考:</strong> ${originalRecord.備考 || ''}</div>\n    `;\n    \n    modal.style.display = 'block';\n  });\n\n  // モーダル閉じる\n  container.querySelector(\"#btn-close-modal\").addEventListener(\"click\", function() {\n    container.querySelector(\"#original-data-modal\").style.display = 'none';\n  });\n\n  // 修正完了ボタン\n  container.querySelector(\"#btn-save\").addEventListener(\"click\", async function() {\n    if (!validateForm()) return;\n\n    const startTime = container.querySelector(\"#start-time\").value;\n    const endTime = container.querySelector(\"#end-time\").value;\n    const breakTime = parseInt(container.querySelector(\"#break-time\").value) || 0;\n    const workItem = container.querySelector(\"#work-item\").value;\n    const workDetail = container.querySelector(\"#work-detail\").value;\n    const correctionReason = container.querySelector(\"#correction-reason\").value;\n\n    // 作業開始・終了時刻を更新\n    const workDate = new Date(currentRecord.作業日).toISOString().split('T')[0];\n    const startDateTime = new Date(`${workDate}T${startTime}:00`).toISOString();\n    const endDateTime = new Date(`${workDate}T${endTime}:00`).toISOString();\n\n    // 24時間跨ぎの場合の調整\n    if (endTime <= startTime) {\n      const endDate = new Date(`${workDate}T${endTime}:00`);\n      endDate.setDate(endDate.getDate() + 1);\n      endDateTime = endDate.toISOString();\n    }\n\n    const totalMinutes = (new Date(endDateTime) - new Date(startDateTime)) / (1000 * 60);\n\n    const updateData = {\n      作業開始時刻: startDateTime,\n      作業終了時刻: endDateTime,\n      作業時間: Math.max(0, totalMinutes - breakTime),\n      作業内容: workDetail,\n      更新日時: new Date().toISOString()\n    };\n\n    const updated = await window.aivicApi.update(1, currentRecord.作業記録ID, updateData);\n    if (updated) {\n      // 中断記録も更新（簡略化のため既存を削除して新規作成）\n      if (breakTime > 0) {\n        const breakRecords = await window.aivicApi.list(2);\n        if (breakRecords) {\n          const existingBreaks = breakRecords.filter(br => br.作業記録ID === currentRecord.作業記録ID);\n          for (const br of existingBreaks) {\n            await window.aivicApi.delete(2, br.中断記録ID);\n          }\n        }\n\n        await window.aivicApi.save(2, {\n          中断記録ID: crypto.randomUUID(),\n          作業記録ID: currentRecord.作業記録ID,\n          中断開始日時: startDateTime,\n          中断終了日時: startDateTime,\n          中断理由区分: '修正による調整',\n          中断理由詳細: correctionReason,\n          中断時間: breakTime,\n          影響度: '軽微',\n          対応状況: '解決済み',\n          記録者ID: currentRecord.作業員ID,\n          作成日時: new Date().toISOString(),\n          更新日時: new Date().toISOString()\n        });\n      }\n\n      alert('工数修正が完了しました。');\n      window.showScreen(\"scr-1778907367889\");\n    }\n  });\n\n  // 初期化\n  loadWorkItems();\n  loadWorkRecords();\n}";

      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
