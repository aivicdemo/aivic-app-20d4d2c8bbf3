ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": rrorDiv) errorDiv.style.display = 'none';\n    if (warningDiv) warningDiv.style.display = 'none';\n    if (validationError) validationError.style.display = 'none';\n  }\n\n  function showSuccess(message) {\n    const successDiv = container.querySelector('.success-message');\n    if (successDiv) {\n      successDiv.textContent = message;\n      successDiv.style.display = 'block';\n    }\n    window.aivicNotify?.success(message);\n  }\n\n  function showValidationError(message) {\n    const validationDiv = container.querySelector('.validation-error');\n    if (validationDiv) {\n      validationDiv.textContent = message;\n      validationDiv.style.display = 'block';\n    }\n    window.aivicNotify?.error(message);\n  }\n\n  // 時刻計算関数\n  function calculateWorkTime() {\n    const startTimeInput = container.querySelector('#start-time-input');\n    const endTimeInput = container.querySelector('#end-time-input');\n    const breakTimeInput = container.querySelector('#break-time-input');\n    const netTimeDisplay = container.querySelector('#net-work-time');\n\n    if (!startTimeInput || !endTimeInput) return;\n\n    const startTime = startTimeInput.value;\n    const endTime = endTimeInput.value;\n    const breakTime = parseInt(breakTimeInput?.value) || 0;\n\n    if (!startTime || !endTime) {\n      if (netTimeDisplay) netTimeDisplay.textContent = '';\n      return;\n    }\n\n    // 業務ロジックを使用して作業時間を計算\n    if (calculateWorkDuration) {\n      try {\n        const duration = calculateWorkDuration(startTime, endTime, breakTime);\n        if (netTimeDisplay) {\n          const hours = Math.floor(duration / 60);\n          const minutes = duration % 60;\n          netTimeDisplay.textContent = `${hours}時間${minutes}分`;\n        }\n      } catch (error) {\n        showError('時間計算でエラーが発生しました: ' + error.message);\n      }\n    }\n  }\n\n  // データ読み込み\n  async function loadWorkRecords() {\n    try {\n      const response = await window.aivicApi.list('work_records');\n      workRecords = response.data || [];\n      renderWorkRecordList();\n    } catch (error) {\n      showError('作業記録の読み込みに失敗しました');\n    }\n  }\n\n  async function loadWorkItems() {\n    try {\n      const response = await window.aivicApi.list('work_items');\n      workItems = response.data || [];\n      renderWorkItemSelect();\n    } catch (error) {\n      showError('作業項目の読み込みに失敗しました');\n    }\n  }\n\n  // 作業記録リスト表示\n  function renderWorkRecordList() {\n    const listContainer = container.querySelector('.work-record-list');\n    if (!listContainer) return;\n\n    listContainer.innerHTML = '';\n    workRecords.forEach((record, index) => {\n      const item = document.createElement('div');\n      item.className = 'work-record-item';\n      item.style.cssText = 'padding: 8px; border: 1px solid #ddd; margin-bottom: 4px; cursor: pointer;';\n      item.innerHTML = `\n        <div>${record.work_date || ''} - ${record.work_item_name || ''}</div>\n        <div style=\"font-size: 12px; color: #666;\">${record.start_time || ''} - ${record.end_time || ''} (${record.work_hours || 0}h)</div>\n      `;\n      item.addEventListener('click', () => selectWorkRecord(record));\n      listContainer.appendChild(item);\n    });\n  }\n\n  // 作業項目セレクト表示\n  function renderWorkItemSelect() {\n    const select = container.querySelector('#work-item-select');\n    if (!select) return;\n\n    select.innerHTML = '<option value=\"\">選択してください</option>';\n    workItems.forEach(item => {\n      const option = document.createElement('option');\n      option.value = item.id;\n      option.textContent = item.name;\n      select.appendChild(option);\n    });\n  }\n\n  // 作業記録選択\n  function selectWorkRecord(record) {\n    selectedRecord = record;\n    originalData = { ...record };\n    \n    // フォームに値を設定\n    const startTimeInput = container.querySelector('#start-time-input');\n    const endTimeInput = container.querySelector('#end-time-input');\n    const breakTimeInput = container.querySelector('#break-time-input');\n    const workHoursInput = container.querySelector('#work-hours-input');\n    const workItemSelect = container.querySelector('#work-item-select');\n    const workDetailTextarea = container.querySelector('#work-detail-textarea');\n\n    if (startTimeInput) startTimeInput.value = record.start_time || '';\n    if (endTimeInput) endTimeInput.value = record.end_time || '';\n    if (breakTimeInput) breakTimeInput.value = record.break_time || '';\n    if (workHoursInput) workHoursInput.value = record.work_hours || '';\n    if (workItemSelect) workItemSelect.value = record.work_item_id || '';\n    if (workDetailTextarea) workDetailTextarea.value = record.work_detail || '';\n\n    calculateWorkTime();\n    hideMessages();\n\n    // 選択状態を視覚的に表示\n    container.querySelectorAll('.work-record-item').forEach(item => {\n      item.style.backgroundColor = '';\n    });\n    event.currentTarget.style.backgroundColor = '#e3f2fd';\n  }\n\n  // バリデーション\n  function validateForm() {\n    const startTime = container.querySelector('#start-time-input')?.value;\n    const endTime = container.querySelector('#end-time-input')?.value;\n    const breakTime = parseInt(container.querySelector('#break-time-input')?.value) || 0;\n    const workHours = parseFloat(container.querySelector('#work-hours-input')?.value) || 0;\n    const modificationReason = container.querySelector('#modification-reason-textarea')?.value;\n\n    // 必須フィールドチェック\n    if (validateRequiredFields) {\n      const requiredFields = {\n        start_time: startTime,\n        end_time: endTime,\n        work_hours: workHours,\n        modification_reason: modificationReason\n      };\n      \n      const validation = validateRequiredFields(requiredFields);\n      if (!validation.isValid) {\n        showValidationError(`必須項目が入力されていません: ${validation.missingFields.join(', ')}`);\n        return false;\n      }\n    }\n\n    // 時刻順序チェック\n    if (validateTimeSequence && startTime && endTime) {\n      const timeValidation = validateTimeSequence(startTime, endTime);\n      if (!timeValidation.isValid) {\n        showError('作業開始時刻は終了時刻より前の時刻を入力してください');\n        return false;\n      }\n    }\n\n    // 中断時間チェック\n    if (calculateWorkDuration && startTime && endTime) {\n      try {\n        const totalMinutes = calculateWorkDuration(startTime, endTime, 0);\n        if (breakTime > totalMinutes) {\n          showError('中断時間が作業時間を超過しています');\n          return false;\n        }\n      } catch (error) {\n        showError('時間の検証でエラーが発生しました');\n        return false;\n      }\n    }\n\n    return true;\n  }\n\n  // 保存処理\n  async function saveModification() {\n    if (!selectedRecord) {\n      showError('修正対象の作業記録を選択してください');\n      return;\n    }\n\n    if (!validateForm()) {\n      return;\n    }\n\n    try {\n      const formData = {\n        id: selectedRecord.id,\n        start_time: container.querySelector('#start-time-input')?.value,\n        end_time: container.querySelector('#end-time-input')?.value,\n        break_time: parseInt(container.querySelector('#break-time-input')?.value) || 0,\n        work_hours: parseFloat(container.querySelector('#work-hours-input')?.value) || 0,\n        work_item_id: container.querySelector('#work-item-select')?.value,\n        work_detail: container.querySelector('#work-detail-textarea')?.value,\n        modification_reason: container.querySelector('#modification-reason-textarea')?.value,\n        modified_at: new Date().toISOString(),\n        original_data: JSON.stringify(originalData)\n      };\n\n      // 異常検知\n      if (performComprehensiveAnomalyDetection) {\n        const anomalyResult = performComprehensiveAnomalyDetection(formData);\n        if (anomalyResult.hasAnomalies) {\n          const confirmDialog = container.querySelector('.confirm-dialog');\n          if (confirmDialog) {\n            confirmDialog.style.display = 'block';\n            const confirmOk = container.querySelector('#confirm-ok');\n            const confirmCancel = container.querySelector('#confirm-cancel');\n            \n            return new Promise((resolve) => {\n              confirmOk.onclick = async () => {\n                confirmDialog.style.display = 'none';\n                await performSave(formData);\n                resolve();\n              };\n              confirmCancel.onclick = () => {\n                confirmDialog.style.display = 'none';\n                resolve();\n              };\n            });\n          }\n        }\n      }\n\n      await performSave(formData);\n    } catch (error) {\n      showError('保存処理でエラーが発生しました: ' + error.message);\n    }\n  }\n\n  async function performSave(formData) {\n    try {\n      await window.aivicApi.update('work_records', formData.id, formData);\n      showSuccess('作業記録を修正しました');\n      \n      // リストを再読み込み\n      await loadWorkRecords();\n      \n      // フォームをクリア\n      clearForm();\n    } catch (error) {\n      showError('保存に失敗しました: ' + error.message);\n    }\n  }\n\n  // 修正完了処理\n  async function completeModification() {\n    if (!selectedRecord) {\n      showError('修正対象の作業記録を選択してください');\n      return;\n    }\n\n    const modificationReason = container.querySelector('#modification-reason-textarea')?.value;\n    if (!modificationReason) {\n      showValidationError('修正理由を入力してください');\n      return;\n    }\n\n    await saveModification();\n  }\n\n  // 元データ参照\n  function viewOriginalData() {\n    if (!originalData) {\n      showError('元データがありません');\n      return;\n    }\n\n    const modal = container.querySelector('.original-data-modal');\n    if (modal) {\n      modal.style.display = 'block';\n      \n      const originalWorkHours = container.querySelector('#original-work-hours');\n      const originalStartTime = container.querySelector('#original-start-time');\n      const originalEndTime = container.querySelector('#original-end-time');\n      \n      if (originalWorkHours) originalWorkHours.textContent = originalData.work_hours || '';\n      if (originalStartTime) originalStartTime.textContent = originalData.start_time || '';\n      if (originalEndTime) originalEndTime.textContent = originalData.end_time || '';\n    }\n  }\n\n  // フォームクリア\n  function clearForm() {\n    const inputs = container.querySelectorAll('input, select, textarea');\n    inputs.forEach(input => {\n      if (input.type === 'checkbox' || input.type === 'radio') {\n        input.checked = false;\n      } else {\n        input.value = '';\n      }\n    });\n    \n    const netTimeDisplay = container.querySelector('#net-work-time');\n    if (netTimeDisplay) netTimeDisplay.textContent = '';\n    \n    selectedRecord = null;\n    originalData = null;\n    hideMessages();\n  }\n\n  // イベントハンドラー設定\n  function setupEventHandlers() {\n    // 時刻入力の変更イベント\n    const startTimeInput = container.querySelector('#start-time-input');\n    const endTimeInput = container.querySelector('#end-time-input');\n    const breakTimeInput = container.querySelector('#break-time-input');\n    \n    if (startTimeInput) startTimeInput.addEventListener('change', calculateWorkTime);\n    if (endTimeInput) endTimeInput.addEventListener('change', calculateWorkTime);\n    if (breakTimeInput) breakTimeInput.addEventListener('change', calculateWorkTime);\n\n    // ボタンイベント\n    const saveButton = container.querySelector('#save-button');\n    const modifyButton = container.querySelector('#modify-button');\n    const completeButton = container.querySelector('#complete-modification-button');\n    const viewOriginalButton = container.querySelector('#view-original-data-button');\n\n    if (saveButton) saveButton.addEventListener('click', saveModification);\n    if (modifyButton) modifyButton.addEventListener('click', saveModification);\n    if (completeButton) completeButton.addEventListener('click', completeModification);\n    if (viewOriginalButton) viewOriginalButton.addEventListener('click', viewOriginalData);\n\n    // モーダル閉じるボタン\n    const modalCloseButton = container.querySelector('.original-data-modal .close-button');\n    if (modalCloseButton) {\n      modalCloseButton.addEventListener('click', () => {\n        const modal = container.querySelector('.original-data-modal');\n        if (modal) modal.style.display = 'none';\n      });\n    }\n  }\n\n  // 初期化\n  async function initialize() {\n    try {\n      await Promise.all([\n        loadWorkRecords(),\n        loadWorkItems()\n      ]);\n      \n      setupEventHandlers();\n      hideMessages();\n      \n    } catch (error) {\n      showError('初期化に失敗しました: ' + error.message);\n    }\n  }\n\n  // 初期化実行\n  initialize();\n}";

      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
