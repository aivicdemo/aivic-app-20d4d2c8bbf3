window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentRecord = null;\n  let originalData = null;\n  let workItems = [];\n\n  // 作業項目マスタを取得\n  async function loadWorkItems() {\n    const items = await window.aivicApi.list(3); // 作業項目マスタ\n    if (items) {\n      workItems = items.filter(item => item.有効フラグ);\n      const workItemSelect = container.querySelector('#work-item');\n      workItemSelect.innerHTML = '<option value=\"\">選択してください</option>';\n      workItems.forEach(item => {\n        workItemSelect.innerHTML += `<option value=\"${item.作業項目ID}\">${item.作業項目名}</option>`;\n      });\n    }\n  }\n\n  // 作業記録一覧を読み込み\n  async function loadWorkRecords() {\n    const records = await window.aivicApi.list(1); // 作業記録\n    if (records) {\n      const select = container.querySelector('#work-record-select');\n      select.innerHTML = '<option value=\"\">選択してください</option>';\n      records.forEach(record => {\n        const date = new Date(record.作業日).toLocaleDateString('ja-JP');\n        const project = record.プロジェクト名 || '';\n        const workType = record.作業種別 || '';\n        select.innerHTML += `<option value=\"${record.作業記録ID}\">${date} - ${project} - ${workType}</option>`;\n      });\n    }\n  }\n\n  // 時間計算\n  function calculateTime() {\n    const startTime = container.querySelector('#start-time').value;\n    const endTime = container.querySelector('#end-time').value;\n    const breakTime = parseInt(container.querySelector('#break-time').value) || 0;\n\n    if (!startTime || !endTime) {\n      container.querySelector('#total-work-time').value = '';\n      container.querySelector('#net-work-time').value = '';\n      return;\n    }\n\n    const start = new Date(`2000-01-01T${startTime}`);\n    let end = new Date(`2000-01-01T${endTime}`);\n    \n    // 24時間跨ぎの処理\n    if (end <= start) {\n      end.setDate(end.getDate() + 1);\n    }\n\n    const totalMinutes = (end - start) / (1000 * 60);\n    const netMinutes = Math.max(0, totalMinutes - breakTime);\n\n    const totalHours = Math.floor(totalMinutes / 60);\n    const totalMins = totalMinutes % 60;\n    const netHours = Math.floor(netMinutes / 60);\n    const netMins = netMinutes % 60;\n\n    container.querySelector('#total-work-time').value = `${totalHours}時間${totalMins}分`;\n    container.querySelector('#net-work-time').value = `${netHours}時間${netMins}分`;\n\n    validateInput();\n  }\n\n  // バリデーション\n  function validateInput() {\n    const errorArea = container.querySelector('#error-area');\n    const warningArea = container.querySelector('#warning-area');\n    const saveBtn = container.querySelector('#save-btn');\n    \n    errorArea.style.display = 'none';\n    warningArea.style.display = 'none';\n\n    const recordId = container.querySelector('#work-record-select').value;\n    const startTime = container.querySelector('#start-time').value;\n    const endTime = container.querySelector('#end-time').value;\n    const breakTime = parseInt(container.querySelector('#break-time').value) || 0;\n    const reason = container.querySelector('#correction-reason').value.trim();\n\n    // 必須チェック\n    if (!recordId) {\n      showError('修正対象の作業記録を選択してください');\n      saveBtn.disabled = true;\n      return;\n    }\n\n    if (!reason) {\n      showError('修正理由を入力してください');\n      saveBtn.disabled = true;\n      return;\n    }\n\n    // 時刻チェック\n    if (startTime && endTime) {\n      const start = new Date(`2000-01-01T${startTime}`);\n      let end = new Date(`2000-01-01T${endTime}`);\n      \n      if (end <= start && startTime === endTime) {\n        showError('作業時間が0分です。開始時刻と終了時刻を確認してください。');\n        saveBtn.disabled = true;\n        return;\n      }\n\n      if (end <= start) {\n        end.setDate(end.getDate() + 1);\n      }\n\n      const totalMinutes = (end - start) / (1000 * 60);\n      \n      // 中断時間チェック\n      if (breakTime > totalMinutes) {\n        showError('中断時間が作業時間を超過しています');\n        saveBtn.disabled = true;\n        return;\n      }\n\n      // 異常値警告\n      if (totalMinutes > 12 * 60) { // 12時間超過\n        showWarning('作業時間が12時間を超えています。確認してください。');\n      }\n    }\n\n    saveBtn.disabled = false;\n  }\n\n  function showError(message) {\n    const errorArea = container.querySelector('#error-area');\n    const errorMessage = container.querySelector('#error-message');\n    errorMessage.textContent = message;\n    errorArea.style.display = 'block';\n  }\n\n  function showWarning(message) {\n    const warningArea = container.querySelector('#warning-area');\n    const warningMessage = container.querySelector('#warning-message');\n    warningMessage.textContent = message;\n    warningArea.style.display = 'block';\n  }\n\n  // 文字数カウント\n  function updateCharCount(textareaId, countId) {\n    const textarea = container.querySelector(`#${textareaId}`);\n    const counter = container.querySelector(`#${countId}`);\n    counter.textContent = textarea.value.length;\n  }\n\n  // 作業記録選択時の処理\n  container.querySelector('#work-record-select').addEventListener('change', async function() {\n    const recordId = this.value;\n    if (!recordId) {\n      currentRecord = null;\n      originalData = null;\n      clearForm();\n      return;\n    }\n\n    const records = await window.aivicApi.list(1);\n    if (records) {\n      currentRecord = records.find(r => r.作業記録ID === recordId);\n      originalData = { ...currentRecord };\n      \n      if (currentRecord) {\n        // フォームに値を設定\n        const workDate = new Date(currentRecord.作業日).toLocaleDateString('ja-JP');\n        container.querySelector('#work-date').value = workDate;\n        \n        if (currentRecord.作業開始時刻) {\n          const startTime = new Date(currentRecord.作業開始時刻);\n          container.querySelector('#start-time').value = startTime.toTimeString().slice(0, 5);\n        }\n        \n        if (currentRecord.作業終了時刻) {\n          const endTime = new Date(currentRecord.作業終了時刻);\n          container.querySelector('#end-time').value = endTime.toTimeString().slice(0, 5);\n        }\n\n        // 中断時間を取得\n        const breakRecords = await window.aivicApi.list(2); // 中断記録\n        if (breakRecords) {\n          const totalBreakTime = breakRecords\n            .filter(br => br.作業記録ID === recordId)\n            .reduce((sum, br) => sum + (br.中断時間 || 0), 0);\n          container.querySelector('#break-time').value = totalBreakTime;\n        }\n\n        container.querySelector('#work-item').value = currentRecord.作業項目ID || '';\n        container.querySelector('#work-content').value = currentRecord.作業内容 || '';\n        \n        calculateTime();\n        container.querySelector('#view-original-btn').disabled = false;\n      }\n    }\n  });\n\n  function clearForm() {\n    container.querySelector('#work-date').value = '';\n    container.querySelector('#start-time').value = '';\n    container.querySelector('#end-time').value = '';\n    container.querySelector('#break-time').value = '';\n    container.querySelector('#total-work-time').value = '';\n    container.querySelector('#net-work-time').value = '';\n    container.querySelector('#work-item').value = '';\n    container.querySelector('#work-content').value = '';\n    container.querySelector('#correction-reason').value = '';\n    container.querySelector('#view-original-btn').disabled = true;\n    container.querySelector('#save-btn').disabled = true;\n    container.querySelector('#error-area').style.display = 'none';\n    container.querySelector('#warning-area').style.display = 'none';\n    updateCharCount('work-content', 'content-count');\n    updateCharCount('correction-reason', 'reason-count');\n  }\n\n  // イベントリスナー\n  container.querySelector('#start-time').addEventListener('change', calculateTime);\n  container.querySelector('#end-time').addEventListener('change', calculateTime);\n  container.querySelector('#break-time').addEventListener('input', calculateTime);\n  container.querySelector('#correction-reason').addEventListener('input', () => {\n    updateCharCount('correction-reason', 'reason-count');\n    validateInput();\n  });\n  container.querySelector('#work-content').addEventListener('input', () => {\n    updateCharCount('work-content', 'content-count');\n  });\n\n  // 元データ参照\n  container.querySelector('#view-original-btn').addEventListener('click', function() {\n    if (!originalData) return;\n    \n    const modal = container.querySelector('#original-data-modal');\n    const content = container.querySelector('#original-data-content');\n    \n    const startTime = originalData.作業開始時刻 ? new Date(originalData.作業開始時刻).toLocaleString('ja-JP') : '未設定';\n    const endTime = originalData.作業終了時刻 ? new Date(originalData.作業終了時刻).toLocaleString('ja-JP') : '未設定';\n    const workDate = new Date(originalData.作業日).toLocaleDateString('ja-JP');\n    \n    content.innerHTML = `\n      <div style=\"margin-bottom: 12px;\"><strong>作業日:</strong> ${workDate}</div>\n      <div style=\"margin-bottom: 12px;\"><strong>開始時刻:</strong> ${startTime}</div>\n      <div style=\"margin-bottom: 12px;\"><strong>終了時刻:</strong> ${endTime}</div>\n      <div style=\"margin-bottom: 12px;\"><strong>プロジェクト名:</strong> ${originalData.プロジェクト名 || ''}</div>\n      <div style=\"margin-bottom: 12px;\"><strong>作業種別:</strong> ${originalData.作業種別 || ''}</div>\n      <div style=\"margin-bottom: 12px;\"><strong>作業内容:</strong> ${originalData.作業内容 || ''}</div>\n      <div style=\"margin-bottom: 12px;\"><strong>進捗状況:</strong> ${originalData.進捗状況 || ''}</div>\n    `;\n    \n    modal.style.display = 'block';\n  });\n\n  container.querySelector('#close-modal-btn').addEventListener('click', function() {\n    container.querySelector('#original-data-modal').style.display = 'none';\n  });\n\n  // 保存処理\n  container.querySelector('#save-btn').addEventListener('click', async function() {\n    if (!currentRecord) return;\n\n    const startTime = container.querySelector('#start-time').value;\n    const endTime = container.querySelector('#end-time').value;\n    const breakTime = parseInt(container.querySelector('#break-time').value) || 0;\n    const workItemId = container.querySelector('#work-item').value;\n    const workContent = container.querySelector('#work-content').value;\n    const reason = container.querySelector('#correction-reason').value.trim();\n\n    // 作業時間計算\n    let workTimeMinutes = null;\n    if (startTime && endTime) {\n      const start = new Date(`2000-01-01T${startTime}`);\n      let end = new Date(`2000-01-01T${endTime}`);\n      if (end <= start) {\n        end.setDate(end.getDate() + 1);\n      }\n      workTimeMinutes = Math.max(0, (end - start) / (1000 * 60) - breakTime);\n    }\n\n    const updateData = {\n      作業開始時刻: startTime ? new Date(`${new Date(currentRecord.作業日).toISOString().split('T')[0]}T${startTime}`).toISOString() : currentRecord.作業開始時刻,\n      作業終了時刻: endTime ? new Date(`${new Date(currentRecord.作業日).toISOString().split('T')[0]}T${endTime}`).toISOString() : currentRecord.作業終了時刻,\n      作業時間: workTimeMinutes,\n      作業項目ID: workItemId || currentRecord.作業項目ID,\n      作業内容: workContent,\n      更新日時: new Date().toISOString()\n    };\n\n    const updated = await window.aivicApi.update(1, currentRecord.作業記録ID, updateData);\n    if (updated) {\n      // 異常値検出ログの記録\n      if (workTimeMinutes && workTimeMinutes > 12 * 60) {\n        await window.aivicApi.save(4, {\n          異常値検出ログID: crypto.randomUUID(),\n          検出対象テーブル: '作業記録',\n          検出対象レコードID: currentRecord.作業記録ID,\n          ユーザーID: currentRecord.作業員ID,\n          異常値種別: '長時間作業',\n          検出項目: '作業時間',\n          検出値: `${Math.floor(workTimeMinutes / 60)}時間${workTimeMinutes % 60}分`,\n          閾値: '12時間',\n          重要度: '中',\n          確認状況: '未確認',\n          通知送信フラグ: false,\n          検出日時: new Date().toISOString(),\n          作成日時: new Date().toISOString(),\n          更新日時: new Date().toISOString()\n        });\n      }\n\n      alert('工数修正が完了しました');\n      window.showScreen(\"scr-1778907367889\");\n    }\n  });\n\n  // キャンセル\n  container.querySelector('#cancel-btn').addEventListener     <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
