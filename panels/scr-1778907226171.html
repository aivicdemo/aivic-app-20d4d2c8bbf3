    <style>
        :root {
            --primary: #4a9eff;
            --primary-hover: #3a8eef;
            --bg-main: #0f0f0f;
            --bg-card: #1a1a1a;
            --bg-sidebar: #141414;
            --border: #2a2a2a;
            --text: #e8e8e8;
            --text-muted: #9a9a9a;
            --top-bar-bg: #161616;

            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            height: 52px;
        }

        .logo {
            width: 24px;
            height: 24px;
            background: var(--primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: white;
        }

        .app-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-section {
            padding: 16px 12px 8px;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            padding: 0 8px;

            color: var(--text-muted);
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 400;
            margin-bottom: 2px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        .nav-item.aivic-active {
            background: var(--primary);
            color: white;
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .breadcrumb-current {
            color: var(--text);
            font-weight: 500;
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .logout-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: color 0.15s ease;
        }

        .logout-link:hover {
            color: var(--text);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quick-action-btn {
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .quick-action-btn:hover {
            border-color: var(--primary);
            background: rgba(74, 158, 255, 0.1);
        }

        .quick-action-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .quick-action-btn.primary:hover {
            background: var(--primary-hover);
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-height: 400px;
            padding: 0;
        }

        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .nav-emergency {
            margin-top: auto;
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        .emergency-btn {
            width: 100%;
            padding: 10px 12px;
            background: var(--error);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        .emergency-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
            
            .quick-actions {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  const tbody = container.querySelector(\"#records-tbody\");\n  const emptyState = container.querySelector(\"#empty-state\");\n  const tableWrap = container.querySelector(\".table-wrap\");\n  const detailModal = container.querySelector(\"#detail-modal\");\n  const detailContent = container.querySelector(\"#detail-content\");\n  \n  let currentRecords = [];\n  let breakRecords = [];\n  let workItems = [];\n  let anomalyLogs = [];\n\n  // 初期データの取得\n  if (tables && tables.length > 0) {\n    currentRecords = tables[1]?.records || []; // 作業記録\n    breakRecords = tables[2]?.records || []; // 中断記録\n    workItems = tables[3]?.records || []; // 作業項目マスタ\n    anomalyLogs = tables[4]?.records || []; // 異常値検出ログ\n  }\n\n  // 今日の日付を設定\n  const today = new Date().toISOString().split('T')[0];\n  container.querySelector(\"#input-date\").value = today;\n\n  // 時間フォーマット関数\n  function formatTime(timestamp) {\n    if (!timestamp) return '';\n    const date = new Date(timestamp);\n    return date.toTimeString().slice(0, 5);\n  }\n\n  // 日付フォーマット関数\n  function formatDate(timestamp) {\n    if (!timestamp) return '';\n    const date = new Date(timestamp);\n    return date.toISOString().split('T')[0];\n  }\n\n  // 作業時間計算（分）\n  function calculateWorkTime(startTime, endTime) {\n    if (!startTime || !endTime) return 0;\n    const start = new Date(startTime);\n    const end = new Date(endTime);\n    return Math.floor((end - start) / (1000 * 60));\n  }\n\n  // 中断時間計算\n  function calculateBreakTime(recordId) {\n    const breaks = breakRecords.filter(b => b.作業記録ID === recordId);\n    return breaks.reduce((total, b) => {\n      if (b.中断時間) return total + b.中断時間;\n      if (b.中断開始日時 && b.中断終了日時) {\n        const start = new Date(b.中断開始日時);\n        const end = new Date(b.中断終了日時);\n        return total + Math.floor((end - start) / (1000 * 60));\n      }\n      return total;\n    }, 0);\n  }\n\n  // 作業項目名取得\n  function getWorkItemName(recordId) {\n    const record = currentRecords.find(r => r.作業記録ID === recordId);\n    if (!record) return '';\n    const workItem = workItems.find(w => w.作業項目名 === record.作業種別);\n    return workItem ? workItem.作業項目名 : record.作業種別 || '';\n  }\n\n  // 異常値チェック\n  function hasAnomaly(recordId) {\n    return anomalyLogs.some(log => log.検出対象レコードID === recordId && log.確認状況 === '未確認');\n  }\n\n  // 時間表示フォーマット\n  function formatDuration(minutes) {\n    if (!minutes || minutes === 0) return '0分';\n    const hours = Math.floor(minutes / 60);\n    const mins = minutes % 60;\n    if (hours === 0) return `${mins}分`;\n    if (mins === 0) return `${hours}時間`;\n    return `${hours}時間${mins}分`;\n  }\n\n  // 再描画関数\n  function renderRows(records) {\n    if (!records || records.length === 0) {\n      tbody.innerHTML = '';\n      emptyState.classList.remove('hidden');\n      tableWrap.style.display = 'none';\n      return;\n    }\n\n    emptyState.classList.add('hidden');\n    tableWrap.style.display = 'block';\n\n    tbody.innerHTML = records.map(record => {\n      const workTime = calculateWorkTime(record.作業開始時刻, record.作業終了時刻);\n      const breakTime = calculateBreakTime(record.作業記録ID);\n      const workItemName = getWorkItemName(record.作業記録ID);\n      const hasAnomalyFlag = hasAnomaly(record.作業記録ID);\n      const isApproved = record.承認状態 === '承認済み';\n      \n      // 異常値警告（24時間超過、終了時刻が開始時刻より早い、中断時間が作業時間を超過）\n      const isAbnormalTime = workTime > 1440 || workTime < 0 || breakTime > workTime;\n      const showWarning = hasAnomalyFlag || isAbnormalTime;\n\n      return `\n        <tr data-id=\"${record.作業記録ID}\">\n          <td>${formatDate(record.作業日)}</td>\n          <td>\n            ${workItemName}\n            ${showWarning ? '<span style=\"color: #ff6a00; margin-left: 4px;\" title=\"異常値が検出されました\">⚠️</span>' : ''}\n          </td>\n          <td>${formatTime(record.作業開始時刻)}</td>\n          <td>${formatTime(record.作業終了時刻)}</td>\n          <td>${formatDuration(workTime)}</td>\n          <td>${formatDuration(breakTime)}</td>\n          <td>${record.作業場所 || ''}</td>\n          <td>\n            <span style=\"padding: 2px 6px; border-radius: 4px; font-size: 11px; \n              ${record.進捗状況 === '完了' ? 'background: rgba(34, 197, 94, 0.2); color: #22c55e;' : \n                record.進捗状況 === '作業中' ? 'background: rgba(59, 130, 246, 0.2); color: #3b82f6;' : \n                'background: rgba(156, 163, 175, 0.2); color: #9ca3af;'}\">\n              ${record.進捗状況}\n            </span>\n          </td>\n          <td>\n            <span style=\"padding: 2px 6px; border-radius: 4px; font-size: 11px;\n              ${record.承認状態 === '承認済み' ? 'background: rgba(34, 197, 94, 0.2); color: #22c55e;' : \n                record.承認状態 === '差し戻し' ? 'background: rgba(239, 68, 68, 0.2); color: #ef4444;' : \n                'background: rgba(251, 191, 36, 0.2); color: #fbbf24;'}\">\n              ${record.承認状態}\n            </span>\n          </td>\n          <td>\n            <button class=\"action-btn secondary detail-btn\" data-id=\"${record.作業記録ID}\" style=\"margin-right: 4px;\">詳細</button>\n            ${!isApproved ? `<button class=\"action-btn secondary edit-btn\" data-id=\"${record.作業記録ID}\" style=\"margin-right: 4px;\">修正</button>` : ''}\n            ${!isApproved ? `<button class=\"action-btn secondary delete-btn\" data-id=\"${record.作業記録ID}\">削除</button>` : ''}\n          </td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // 詳細表示\n  function showDetail(recordId) {\n    const record = currentRecords.find(r => r.作業記録ID === recordId);\n    if (!record) return;\n\n    const workTime = calculateWorkTime(record.作業開始時刻, record.作業終了時刻);\n    const breakTime = calculateBreakTime(record.作業記録ID);\n    const breaks = breakRecords.filter(b => b.作業記録ID === recordId);\n\n    detailContent.innerHTML = `\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px;\">\n        <div>\n          <h4 style=\"font-size: 13px; font-weight: 600; color: var(--text); margin: 0 0 8px 0;\">基本情報</h4>\n          <div style=\"font-size: 13px; line-height: 1.6;\">\n            <div><strong>作業日:</strong> ${formatDate(record.作業日)}</div>\n            <div><strong>プロジェクト:</strong> ${record.プロジェクト名 || ''}</div>\n            <div><strong>作業場所:</strong> ${record.作業場所 || ''}</div>\n            <div><strong>作業種別:</strong> ${record.作業種別 || ''}</div>\n            <div><strong>進捗状況:</strong> ${record.進捗状況 || ''}</div>\n            <div><strong>承認状態:</strong> ${record.承認状態 || ''}</div>\n          </div>\n        </div>\n        <div>\n          <h4 style=\"font-size: 13px; font-weight: 600; color: var(--text); margin: 0 0 8px 0;\">時間情報</h4>\n          <div style=\"font-size: 13px; line-height: 1.6;\">\n            <div><strong>開始時刻:</strong> ${formatTime(record.作業開始時刻)}</div>\n            <div><strong>終了時刻:</strong> ${formatTime(record.作業終了時刻)}</div>\n            <div><strong>作業時間:</strong> ${formatDuration(workTime)}</div>\n            <div><strong>中断時間:</strong> ${formatDuration(breakTime)}</div>\n            <div><strong>実働時間:</strong> ${formatDuration(workTime - breakTime)}</div>\n          </div>\n        </div>\n      </div>\n      \n      <div style=\"margin-top: 16px;\">\n        <h4 style=\"font-size: 13px; font-weight: 600; color: var(--text); margin: 0 0 8px 0;\">作業内容</h4>\n        <div style=\"background: rgba(0,0,0,0.25); padding: 8px; border-radius: 6px; font-size: 13px; line-height: 1.4;\">\n          ${record.作業内容 || ''}\n        </div>\n      </div>\n\n      ${record.備考 ? `\n        <div style=\"margin-top: 16px;\">\n          <h4 style=\"font-size: 13px; font-weight: 600; color: var(--text); margin: 0 0 8px 0;\">備考</h4>\n          <div style=\"background: rgba(0,0,0,0.25); padding: 8px; border-radius: 6px; font-size: 13px; line-height: 1.4;\">\n            ${record.備考}\n          </div>\n        </div>\n      ` : ''}\n\n      ${breaks.length > 0 ? `\n        <div style=\"margin-top: 16px;\">\n          <h4 style=\"font-size: 13px; font-weight: 600; color: var(--text); margin: 0 0 8px 0;\">中断記録</h4>\n          ${breaks.map(b => `\n            <div style=\"background: rgba(0,0,0,0.25); padding: 8px; border-radius: 6px; margin-bottom: 8px; font-size: 13px;\">\n              <div><strong>中断時間:</strong> ${formatTime(b.中断開始日時)} - ${formatTime(b.中断終了日時)} (${formatDuration(b.中断時間)})</div>\n              <div><strong>理由:</strong> ${b.中断理由区分} ${b.中断理由詳細 ? '- ' + b.中断理由詳細 : ''}</div>\n            </div>\n          `).join('')}\n        </div>\n      ` : ''}\n    `;\n\n    detailModal.classList.remove('hidden');\n  }\n\n  // CSVエクスポート\n  function exportCSV() {\n    const headers = ['日付', '作業項目', '開始時刻', '終了時刻', '作業時間', '中断時間', '作業場所', '進捗状況', '承認状態', '作業内容', '備考'];\n    const csvContent = '\\uFEFF' + [\n      headers.join(','),\n      ...currentRecords.map(record => {\n        const workTime = calculateWorkTime(record.作業開始時刻, record.作業終了時刻);\n        const breakTime = calculateBreakTime(record.作業記録ID);\n        const workItemName = getWorkItemName(record.作業記録ID);\n        \n        return [\n          formatDate(record.作業日),\n          `\"${workItemName}\"`,\n          formatTime(record.作業開始時刻),\n          formatTime(record.作業終了時刻),\n          formatDuration(workTime),\n          formatDuration(breakTime),\n          `\"${record.作業場所 || ''}\"`,\n          record.進捗状況 || '',\n          record.承認状態 || '',\n          `\"${record.作業内容 || ''}\"`,\n          `\"${record.備考 || ''}\"`\n        ].join(',');\n      })\n    ].join('\\n');\n\n    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `work_records_${new Date().toISOString().split('T')[0]}.csv`;\n    link.click();\n  }\n\n  // フィルタリング\n  function filterRecords() {\n    const selectedDate = container.querySelector(\"#input-date\").value;\n    const startDate = container.querySelector(\"#input-start-date\").value;\n    const endDate = container.querySelector(\"#input-end-date\").value;\n\n    let filtered = [...currentRecords];\n\n    if (selectedDate) {\n      filtered = filtered.filter(record => {\n        const recordDate = formatDate(record.作業日);\n        return recordDate === selectedDate;\n      });\n    } else if (startDate && endDate) {\n      if (startDate > endDate) {\n        alert('開始日は終了日より前の日付を指定してください');\n        return;\n      }\n      filtered = filtered.filter(record => {\n        const recordDate = formatDate(record.作業日);\n        return recordDate >= startDate && recordDate <= endDate;\n      });\n    } else if (startDate) {\n      filtered = filtered.filter(record => {\n        const recordDate = formatDate(record.作業日);\n        return recordDate >= startDate;\n      });\n    } else if (endDate) {\n      filtered = filtered.filter(record => {\n        const recordDate = formatDate(record.作業日);\n        return recordDate <= endDate;\n      });\n    }\n\n    renderRows(filtered);\n  }\n\n  // 初期データ読み込み\n  async function loadData() {\n    try {\n      const records = await window.aivicApi.list(1); // 作業記録\n      if (records) {\n        currentRecords = records;\n        filterRecords();\n      }\n    } catch (error) {\n      console.error('データ読み込みエラー:', error);\n      renderRows(currentRecords);\n    }\n  }\n\n  // イベントリスナー\n  container.querySelector(\"#btn-menu\").addEventListener(\"click\", () => {\n    window.showScreen(\"scr-1778907133295\");\n  });\n\n  container.querySelector(\"#btn-filter\").addEventListener(\"click\", filterRecords);\n\n  container.querySelector(\"#input-date\").addEventListener(\"change\", () => {\n    // 日付選択時は期間をクリア\n    container.querySelector(\"#input-start-date\").value = '';\n    container.querySelector(\"#input-end-date\").value = '';\n    filterRecords();\n  });\n\n  container.querySelector(\"#input-start-date\").addEventListener(\"change\", () => {\n    // 期間選択時は日付をクリア\n    container.querySelector(\"#input-date\").value = '';\n  });\n\n  container.querySelector(\"#input-end-date\").addEventListener(\"change\", () => {\n    // 期間選択時は日付をクリア\n    container.querySelector(\"#input-date\").value = '';\n  });\n\n  container.querySelector(\"#btn-csv-export\").addEventListener(\"click\", exportCSV);\n\n  container.querySelector(\"#btn-close-modal\").addEventListener(\"click\", () => {\n    detailModal.classList.add('hidden');\n  });\n\n  // イベントデリゲーション\n  container.addEventListener(\"click\", async (e) => {\n    const detailBtn = e.target.closest(\".detail-btn\");\n    const editBtn = e.target.closest(\".edit-btn\");\n    const deleteBtn = e.target.closest(\".delete-btn\");\n\n    if (detailBtn) {\n      showDetail(detailBtn.dataset.id);\n    }\n\n    if (editBtn) {\n      // 編集画面に遷移（記録IDをセッションストレージに保存）\n      sessionStorage.setItem('editRecordId', editBtn.dataset.id);\n      window.showScreen(\"scr-1778907343735\");\n    }\n\n    if (deleteBtn) {\n      if (!confirm(\"この記録を削除しますか？\")) return;\n      \n      try {\n        await window.aivicApi.delete(1, deleteBtn.dataset.id);\n        await loadData(); // 削除後にデータを再読み込み\n      } catch (error) {\n        console.error('削除エラー:', error);\n        alert('削除に失敗しました');\n      }\n    }\n  });\n\n  // モーダル外クリックで閉じる\n  detailModal.addEventListener(\"click\", (e) => {\n    if (e.target === detailModal) {\n      detailModal.classList.add('hidden');\n    }\n  });\n\n  // 初期表示\n  loadData();\n}";

        const screenTitles = {

            'scr-1778907145716': '作業履歴一覧',
            'scr-1778907170814': '異常値検出ログ',
            'scr-1778907187615': '工数記録開始',
            'scr-1778907199709': '工数記録終了',
            'scr-1778907212862': 'データ自動保存処理',
            'scr-1778907226171': '記録確認',

            'scr-1778907309324': '異常値検出処理',

        window.addEventListener('aivic:screen-changed', function(e) {
            const title = screenTitles[e.detail.screenId];
            if (title) {
                document.getElementById('current-screen-title').textContent = title;

        // 初期画面表示
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof window.showScreen === 'function') {
                window.showScreen('scr-1778907133295');

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
