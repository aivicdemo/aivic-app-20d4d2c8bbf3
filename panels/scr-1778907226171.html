ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックのインポート\n  const { calculateWorkDuration, detectWorkTimeAnomaly, calculateInterruptionDuration } = window.workRecordCalc || {};\n  const { validateTimeConsistency, isLongWorkAnomaly, validateWorkRecordCompleteness } = window.workValidation || {};\n  const { detectOvertimeAnomaly, detectTimeSequenceAnomaly, calculateAnomalyScore } = window.anomalyDetection || {};\n  const { aggregateMonthlyHours, calculateEfficiencyRate } = window.dataAggregation || {};\n  const { \n    validateWorkRecord, \n    detectAnomalousValue, \n    calculateInterruptionTime, \n    saveWorkData,\n    checkDataIntegrity,\n    aggregateDailyWorkData,\n    analyzeWorkPerformance,\n    generateWeeklyReport\n  } = window.featureLogic || {};\n\n  // 利用可能な業務ロジックモジュールをインポート\n  const { \n    startWorkRecord, \n    endWorkRecord, \n    calculateWorkTime, \n    validateRequiredFields, \n    recordInterruption,\n    analyzeWorkEfficiency,\n    saveWorkDataToCloud,\n    syncLocalDataOnReconnection,\n    generatePersonnelReallocation\n  } = window.feature || {};\n\n  const {\n    detectAbnormalWorkTime,\n    validateWorkTimeRange,\n    checkShortWorkTime,\n    notifyAbnormalValueToManager,\n    showConfirmationDialog\n  } = window.abnormalWorkTimeDetection || {};\n\n  const {\n    calculateProgress,\n    calculateEfficiency,\n    predictEmergencyWorkload,\n    aggregateRealTimeData,\n    optimizePersonnelAllocation\n  } = window.allLogic || {};\n\n  let currentRecords = [];\n  let deleteTargetId = null;\n  let filteredRecords = [];\n\n  // DOM要素の取得\n  const dateInput = container.querySelector('input[type=\"date\"]');\n  const startDateInput = container.querySelector('input[name=\"startDate\"]');\n  const endDateInput = container.querySelector('input[name=\"endDate\"]');\n  const filterButton = container.querySelector('button[data-testid=\"filter-button\"]') || \n                      container.querySelector('button:contains(\"絞り込み\")') ||\n                      Array.from(container.querySelectorAll('button')).find(btn => btn.textContent.includes('絞り込み'));\n  const recordsTable = container.querySelector('table[data-testid=\"record-list\"]') || container.querySelector('table');\n  const recordsTbody = container.querySelector('#records-tbody') || container.querySelector('tbody');\n  const emptyMessage = container.querySelector('#empty-message');\n  const detailModal = container.querySelector('#detail-modal');\n  const deleteModal = container.querySelector('#delete-modal');\n  const emergencyAlert = container.querySelector('#emergency-alert');\n\n  // data-testid属性を設定\n  if (dateInput) dateInput.setAttribute('data-testid', 'date-filter');\n  if (startDateInput) startDateInput.setAttribute('data-testid', 'start-date');\n  if (endDateInput) endDateInput.setAttribute('data-testid', 'end-date');\n  if (recordsTable) recordsTable.setAttribute('data-testid', 'record-list');\n  if (filterButton) filterButton.setAttribute('data-testid', 'filter-button');\n\n  // 時間フォーマット関数\n  function formatTime(timestamp) {\n    if (!timestamp) return '';\n    const date = new Date(timestamp);\n    return date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });\n  }\n\n  // 日付フォーマット関数\n  function formatDate(timestamp) {\n    if (!timestamp) return '';\n    const date = new Date(timestamp);\n    return date.toLocaleDateString('ja-JP');\n  }\n\n  // 工数フォーマット関数\n  function formatDuration(minutes) {\n    if (!minutes) return '0分';\n    const hours = Math.floor(minutes / 60);\n    const mins = minutes % 60;\n    if (hours > 0) {\n      return mins > 0 ? `${hours}時間${mins}分` : `${hours}時間0分`;\n    }\n    return `${mins}分`;\n  }\n\n  // 異常値検出\n  function detectAnomalies(record) {\n    const anomalies = [];\n    \n    if (detectAbnormalWorkTime && record.startTime && record.endTime) {\n      const result = detectAbnormalWorkTime(record.startTime, record.endTime);\n      if (result.isAbnormal) {\n        anomalies.push(result.reason);\n      }\n    }\n\n    if (validateWorkTimeRange && record.workDuration) {\n      const validation = validateWorkTimeRange(record.workDuration);\n      if (!validation.isValid) {\n        anomalies.push(validation.message);\n      }\n    }\n\n    if (checkShortWorkTime && record.workDuration) {\n      const shortTimeCheck = checkShortWorkTime(record.workDuration);\n      if (shortTimeCheck.isShort) {\n        anomalies.push('短時間作業');\n      }\n    }\n\n    return anomalies;\n  }\n\n  // レコード表示\n  function renderRecords(records) {\n    if (!recordsTbody) return;\n\n    if (!records || records.length === 0) {\n      recordsTbody.innerHTML = '';\n      if (emptyMessage) {\n        emptyMessage.style.display = 'block';\n      }\n      return;\n    }\n\n    if (emptyMessage) {\n      emptyMessage.style.display = 'none';\n    }\n\n    recordsTbody.innerHTML = records.map(record => {\n      const anomalies = detectAnomalies(record);\n      const hasAnomalies = anomalies.length > 0;\n      const isApproved = record.status === 'approved';\n      \n      return `\n        <tr data-record-id=\"${record.id}\">\n          <td>${formatDate(record.workDate)}</td>\n          <td>${formatTime(record.startTime)}</td>\n          <td>${formatTime(record.endTime)}</td>\n          <td>${record.workContent || ''}</td>\n          <td>${record.workLocation || ''}</td>\n          <td>${formatDuration(record.workDuration)}</td>\n          <td>${record.notes || ''}</td>\n          <td>\n            ${hasAnomalies ? `<button class=\"warning-btn\" title=\"${anomalies.join(', ')}\">⚠</button>` : ''}\n            <button class=\"detail-btn\" data-id=\"${record.id}\">詳細</button>\n            <button class=\"edit-btn\" data-id=\"${record.id}\" ${isApproved ? 'disabled' : ''}>編集</button>\n            <button class=\"delete-btn\" data-id=\"${record.id}\" ${isApproved ? 'disabled' : ''}>削除</button>\n            <button class=\"approve-btn\" data-id=\"${record.id}\" ${isApproved ? 'disabled' : ''}>承認</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n\n    // イベントリスナーを追加\n    attachRecordEventListeners();\n  }\n\n  // レコードイベントリスナー\n  function attachRecordEventListeners() {\n    // 詳細ボタン\n    container.querySelectorAll('.detail-btn').forEach(btn => {\n      btn.addEventListener('click', (e) => {\n        const recordId = e.target.dataset.id;\n        showRecordDetail(recordId);\n      });\n    });\n\n    // 編集ボタン\n    container.querySelectorAll('.edit-btn').forEach(btn => {\n      btn.addEventListener('click', (e) => {\n        const recordId = e.target.dataset.id;\n        if (!e.target.disabled) {\n          editRecord(recordId);\n        }\n      });\n    });\n\n    // 削除ボタン\n    container.querySelectorAll('.delete-btn').forEach(btn => {\n      btn.addEventListener('click', (e) => {\n        const recordId = e.target.dataset.id;\n        if (!e.target.disabled) {\n          deleteRecord(recordId);\n        }\n      });\n    });\n\n    // 承認ボタン\n    container.querySelectorAll('.approve-btn').forEach(btn => {\n      btn.addEventListener('click', (e) => {\n        const recordId = e.target.dataset.id;\n        if (!e.target.disabled) {\n          approveRecord(recordId);\n        }\n      });\n    });\n\n    // 警告ボタン\n    container.querySelectorAll('.warning-btn').forEach(btn => {\n      btn.addEventListener('click', (e) => {\n        const message = e.target.title;\n        if (notifyAbnormalValueToManager) {\n          notifyAbnormalValueToManager(message);\n        }\n        window.aivicNotify?.warning(message);\n      });\n    });\n  }\n\n  // 詳細表示\n  function showRecordDetail(recordId) {\n    const record = currentRecords.find(r => r.id == recordId);\n    if (!record || !detailModal) return;\n\n    const detailContent = detailModal.querySelector('#detail-content');\n    if (detailContent) {\n      detailContent.innerHTML = `\n        <h3>作業記録詳細</h3>\n        <div class=\"detail-row\">\n          <label>作業日:</label>\n          <span>${formatDate(record.workDate)}</span>\n        </div>\n        <div class=\"detail-row\">\n          <label>開始時刻:</label>\n          <span>${formatTime(record.startTime)}</span>\n        </div>\n        <div class=\"detail-row\">\n          <label>終了時刻:</label>\n          <span>${formatTime(record.endTime)}</span>\n        </div>\n        <div class=\"detail-row\">\n          <label>作業内容:</label>\n          <span>${record.workContent || ''}</span>\n        </div>\n        <div class=\"detail-row\">\n          <label>作業場所:</label>\n          <span>${record.workLocation || ''}</span>\n        </div>\n        <div class=\"detail-row\">\n          <label>工数:</label>\n          <span>${formatDuration(record.workDuration)}</span>\n        </div>\n        <div class=\"detail-row\">\n          <label>備考:</label>\n          <span>${record.notes || ''}</span>\n        </div>\n      `;\n    }\n\n    detailModal.style.display = 'block';\n  }\n\n  // 編集画面遷移\n  function editRecord(recordId) {\n    const record = currentRecords.find(r => r.id == recordId);\n    if (!record) return;\n\n    if (record.status === 'approved') {\n      window.aivicNotify?.error('承認済みの記録は編集できません');\n      return;\n    }\n\n    // 編集画面に遷移\n    window.location.href = `/panels/scr-1778907296658.html?id=${recordId}`;\n  }\n\n  // 削除処理\n  function deleteRecord(recordId) {\n    const record = currentRecords.find(r => r.id == recordId);\n    if (!record) return;\n\n    if (record.status === 'approved') {\n      window.aivicNotify?.error('承認済みの記録は削除できません');\n      return;\n    }\n\n    deleteTargetId = recordId;\n    if (deleteModal) {\n      deleteModal.style.display = 'block';\n    }\n  }\n\n  // 削除確認\n  function confirmDelete() {\n    if (!deleteTargetId) return;\n\n    window.aivicApi.delete('work_records', deleteTargetId)\n      .then(() => {\n        window.aivicNotify?.success('記録を削除しました');\n        loadRecords();\n        if (deleteModal) {\n          deleteModal.style.display = 'none';\n        }\n        deleteTargetId = null;\n      })\n      .catch(error => {\n        window.aivicNotify?.error('削除に失敗しました: ' + error.message);\n      });\n  }\n\n  // 承認処理\n  function approveRecord(recordId) {\n    const record = currentRecords.find(r => r.id == recordId);\n    if (!record) return;\n\n    if (record.status === 'approved') {\n      window.aivicNotify?.error('既に承認済みです');\n      return;\n    }\n\n    if (showConfirmationDialog) {\n      const confirmed = showConfirmationDialog('この記録を承認しますか？');\n      if (!confirmed) return;\n    }\n\n    window.aivicApi.update('work_records', recordId, { status: 'approved' })\n      .then(() => {\n        window.aivicNotify?.success('記録を承認しました');\n        loadRecords();\n      })\n      .catch(error => {\n        window.aivicNotify?.error('承認に失敗しました: ' + error.message);\n      });\n  }\n\n  // データ読み込み\n  function loadRecords(filters = {}) {\n    const params = new URLSearchParams();\n    \n    if (filters.date) {\n      params.append('workDate', filters.date);\n    }\n    if (filters.startDate) {\n      params.append('startDate', filters.startDate);\n    }\n    if (filters.endDate) {\n      params.append('endDate', filters.endDate);\n    }\n\n    window.aivicApi.list('work_records', params.toString())\n      .then(records => {\n        currentRecords = records || [];\n        \n        // 業務ロジックによる検証\n        if (validateWorkRecord) {\n          currentRecords = currentRecords.map(record => {\n            const validation = validateWorkRecord(record);\n            return { ...record, validation };\n          });\n        }\n\n        // 異常値検出\n        if (detectAnomalousValue) {\n          currentRecords = currentRecords.map(record => {\n            const anomalies = detectAnomalousValue(record);\n            return { ...record, anomalies };\n          });\n        }\n\n        filteredRecords = currentRecords;\n        renderRecords(filteredRecords);\n      })\n      .catch(error => {\n        window.aivicNotify?.error('データの読み込みに失敗しました: ' + error.message);\n        currentRecords = [];\n        renderRecords([]);\n      });\n  }\n\n  // フィルター処理\n  function applyFilters() {\n    const filters = {};\n    \n    if (dateInput && dateInput.value) {\n      filters.date = dateInput.value;\n    }\n    \n    if (startDateInput && endDateInput) {\n      const startDate = startDateInput.value;\n      const endDate = endDateInput.value;\n      \n      if (startDate && endDate) {\n        if (startDate > endDate) {\n          window.aivicNotify?.error('開始日は終了日より前の日付を指定してください');\n          return;\n        }\n        filters.startDate = startDate;\n        filters.endDate = endDate;\n      }\n    }\n\n    loadRecords(filters);\n  }\n\n  // イベントリスナー設定\n  if (filterButton) {\n    filterButton.addEventListener('click', applyFilters);\n  }\n\n  if (dateInput) {\n    dateInput.addEventListener('change', applyFilters);\n  }\n\n  // モーダル関連のイベントリスナー\n  if (detailModal) {\n    const closeBtn = detailModal.querySelector('.close');\n    if (closeBtn) {\n      closeBtn.addEventListener('click', () => {\n        detailModal.style.display = 'none';\n      });\n    }\n  }\n\n  if (deleteModal) {\n    const confirmBtn = deleteModal.querySelector('#btn-confirm-delete');\n    const cancelBtn = deleteModal.querySelector('.cancel');\n    \n    if (confirmBtn) {\n      confirmBtn.addEventListener('click', confirmDelete);\n    }\n    \n    if (cancelBtn) {\n      cancelBtn.addEventListener('click', () => {\n        deleteModal.style.display = 'none';\n        deleteTargetId = null;\n      });\n    }\n  }\n\n  // 初期データ読み込み\n  loadRecords();\n\n  // 定期的なデータ同期\n  if (syncLocalDataOnReconnection) {\n    setInterval(() => {\n      syncLocalDataOnReconnection();\n    }, 30000);\n  }\n}";

      color: var(--primary);

      content: "";
      position: absolute;

      top: 0;
      bottom: 0;
      width: 3px;

      flex-direction: column;

      font-size: 13px;

      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(0, 170, 68, 0.1);
      color: var(--accent-green);
      border: 1px solid rgba(0, 170, 68, 0.2);

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 12px;

    .user-menu {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 6px;
      background: var(--bg-card);

        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
