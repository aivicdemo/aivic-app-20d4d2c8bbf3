<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --primary: #4a9eff;
            --primary-hover: #3a8eef;
            --bg-main: #0f0f0f;
            --bg-card: #1a1a1a;
            --bg-sidebar: #141414;
            --border: #2a2a2a;
            --text: #e8e8e8;
            --text-muted: #9a9a9a;
            --top-bar-bg: #161616;
            --top-bar-border: #252525;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            height: 52px;
        }

        .logo {
            width: 24px;
            height: 24px;
            background: var(--primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: white;
        }

        .app-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-section {
            padding: 16px 12px 8px;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            padding: 0 8px;
        }

        .nav-item {
            display: block;
            padding: 8px 12px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 400;
            margin-bottom: 2px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        .nav-item.aivic-active {
            background: var(--primary);
            color: white;
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .breadcrumb-current {
            color: var(--text);
            font-weight: 500;
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .logout-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: color 0.15s ease;
        }

        .logout-link:hover {
            color: var(--text);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quick-action-btn {
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .quick-action-btn:hover {
            border-color: var(--primary);
            background: rgba(74, 158, 255, 0.1);
        }

        .quick-action-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .quick-action-btn.primary:hover {
            background: var(--primary-hover);
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-height: 400px;
            padding: 0;
        }

        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .nav-emergency {
            margin-top: auto;
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        .emergency-btn {
            width: 100%;
            padding: 10px 12px;
            background: var(--error);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        .emergency-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
            
            .quick-actions {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>

ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": dleWorkSelection(workId, interruptId) {\n    const workRecords = tables[1].records || [];\n    const interruptRecords = tables[2].records || [];\n    \n    selectedWorkRecord = workRecords.find(w => w.作業記録ID === workId);\n    selectedInterruptRecord = interruptRecords.find(i => i.中断記録ID === interruptId);\n    \n    if (selectedWorkRecord) {\n      container.querySelector(\"#selected-work-name\").value = `${selectedWorkRecord.作業内容} (${selectedWorkRecord.プロジェクト名})`;\n      container.querySelector(\"#resume-form\").classList.remove(\"hidden\");\n      setCurrentTime();\n    }\n  }\n\n  // 文字数カウント更新\n  function updateCharCount() {\n    const textarea = container.querySelector(\"#resume-reason-detail\");\n    const counter = container.querySelector(\"#reason-char-count\");\n    counter.textContent = textarea.value.length;\n  }\n\n  // 初期データ読み込み\n  async function loadInitialData() {\n    try {\n      const [workRecords, interruptRecords] = await Promise.all([\n        window.aivicApi.list(1), // 作業記録\n        window.aivicApi.list(2)  // 中断記録\n      ]);\n      \n      if (workRecords && interruptRecords) {\n        renderSuspendedWorks(workRecords, interruptRecords);\n      } else {\n        renderSuspendedWorks(tables[1].records || [], tables[2].records || []);\n      }\n    } catch (error) {\n      console.error(\"データ読み込みエラー:\", error);\n      renderSuspendedWorks(tables[1].records || [], tables[2].records || []);\n    }\n  }\n\n  // 作業再開処理\n  async function resumeWork() {\n    if (!selectedWorkRecord || !selectedInterruptRecord) {\n      alert(\"作業が選択されていません\");\n      return;\n    }\n\n    const resumeTime = container.querySelector(\"#resume-time\").value;\n    const reasonDetail = container.querySelector(\"#resume-reason-detail\").value.trim();\n    const reasonCategory = container.querySelector(\"#resume-reason-category\").value;\n\n    if (!reasonDetail && !reasonCategory) {\n      alert(\"再開理由を入力してください\");\n      return;\n    }\n\n    if (reasonDetail.length > 500) {\n      alert(\"再開理由は500文字以内で入力してください\");\n      return;\n    }\n\n    try {\n      // 中断記録を更新（中断終了日時を設定）\n      const updatedInterrupt = await window.aivicApi.update(2, selectedInterruptRecord.中断記録ID, {\n        中断終了日時: resumeTime,\n        中断時間: Math.floor((new Date(resumeTime) - new Date(selectedInterruptRecord.中断開始日時)) / (1000 * 60))\n      });\n\n      // 作業記録を更新（進捗状況を「作業中」に変更）\n      const updatedWork = await window.aivicApi.update(1, selectedWorkRecord.作業記録ID, {\n        進捗状況: '作業中',\n        備考: `${selectedWorkRecord.備考 || ''}\\n[${new Date(resumeTime).toLocaleString()}] 作業再開: ${reasonCategory || reasonDetail}`.trim()\n      });\n\n      if (updatedInterrupt && updatedWork) {\n        alert(\"作業を再開しました\");\n        window.showScreen(\"scr-1778907296658\"); // 工数入力画面へ遷移\n      } else {\n        alert(\"作業再開の記録に失敗しました\");\n      }\n    } catch (error) {\n      console.error(\"作業再開エラー:\", error);\n      alert(\"作業再開の記録に失敗しました\");\n    }\n  }\n\n  // 確認ダイアログ表示\n  function showConfirmDialog() {\n    if (!selectedWorkRecord) {\n      alert(\"作業が選択されていません\");\n      return;\n    }\n\n    const reasonDetail = container.querySelector(\"#resume-reason-detail\").value.trim();\n    const reasonCategory = container.querySelector(\"#resume-reason-category\").value;\n\n    if (!reasonDetail && !reasonCategory) {\n      alert(\"再開理由を入力してください\");\n      return;\n    }\n\n    if (reasonDetail.length > 500) {\n      alert(\"再開理由は500文字以内で入力してください\");\n      return;\n    }\n\n    const confirmDetails = container.querySelector(\"#confirm-work-details\");\n    confirmDetails.innerHTML = `\n      <div><strong>作業項目:</strong> ${selectedWorkRecord.作業内容}</div>\n      <div><strong>プロジェクト:</strong> ${selectedWorkRecord.プロジェクト名}</div>\n      <div><strong>再開時刻:</strong> ${new Date(container.querySelector(\"#resume-time\").value).toLocaleString()}</div>\n      <div><strong>再開理由:</strong> ${reasonCategory || reasonDetail}</div>\n    `;\n\n    container.querySelector(\"#resume-confirm-dialog\").classList.remove(\"hidden\");\n  }\n\n  // イベントリスナー設定\n  loadInitialData();\n\n  // 戻るボタン\n  container.querySelector(\"#btn-back\").addEventListener(\"click\", () => {\n    history.back();\n  });\n\n  // 作業選択\n  container.addEventListener(\"change\", (e) => {\n    if (e.target.name === \"selected-work\") {\n      const row = e.target.closest(\"tr\");\n      const workId = row.dataset.workId;\n      const interruptId = row.dataset.interruptId;\n      handleWorkSelection(workId, interruptId);\n    }\n  });\n\n  // 行クリックでラジオボタン選択\n  container.addEventListener(\"click\", (e) => {\n    const row = e.target.closest(\"tr[data-work-id]\");\n    if (row && !e.target.matches('input[type=\"radio\"]')) {\n      const radio = row.querySelector('input[type=\"radio\"]');\n      if (radio) {\n        radio.checked = true;\n        radio.dispatchEvent(new Event(\"change\"));\n      }\n    }\n  });\n\n  // 文字数カウント\n  container.querySelector(\"#resume-reason-detail\").addEventListener(\"input\", updateCharCount);\n\n  // フォームボタン\n  container.querySelector(\"#btn-cancel-resume\").addEventListener(\"click\", () => {\n    container.querySelector(\"#resume-form\").classList.add(\"hidden\");\n    selectedWorkRecord = null;\n    selectedInterruptRecord = null;\n    // ラジオボタンの選択を解除\n    const radios = container.querySelectorAll('input[name=\"selected-work\"]');\n    radios.forEach(radio => radio.checked = false);\n  });\n\n  container.querySelector(\"#btn-confirm-resume\").addEventListener(\"click\", showConfirmDialog);\n\n  // 確認ダイアログ\n  container.querySelector(\"#btn-dialog-cancel\").addEventListener(\"click\", () => {\n    container.querySelector(\"#resume-confirm-dialog\").classList.add(\"hidden\");\n  });\n\n  container.querySelector(\"#btn-dialog-ok\").addEventListener(\"click\", () => {\n    container.querySelector(\"#resume-confirm-dialog\").classList.add(\"hidden\");\n    resumeWork();\n  });\n\n  // 初期時刻設定\n  setCurrentTime();\n}";

        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
