<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工数記録システム</title>
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-hover: #0284c7;
            --primary-light: #e0f2fe;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-sidebar: #f1f5f9;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --text: #1e293b;
            --text-muted: #475569;
            --text-light: #64748b;
            --top-bar-bg: #ffffff;
            --top-bar-border: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: "⏱";
            font-size: 18px;
        }

        .nav-section {
            padding: 16px 0 8px 0;
        }

        .nav-section-title {
            padding: 0 16px 8px 16px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: block;
            padding: 8px 16px;
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: var(--bg-card);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: var(--primary-light);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 500;
        }

        .nav-item.nav-emergency {
            color: var(--danger);
            font-weight: 500;
        }

        .nav-item.nav-emergency:hover {
            background: #fef2f2;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .logout-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.15s ease;
        }

        .logout-link:hover {
            background: var(--border-light);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quick-action-btn {
            padding: 10px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quick-action-btn:hover {
            background: var(--primary-hover);
        }

        .quick-action-btn.secondary {
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .quick-action-btn.secondary:hover {
            background: var(--border-light);
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-height: 400px;
        }

        .nav-group {
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 4px;
            padding-bottom: 4px;
        }

        .nav-group:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
            
            .quick-actions {
                flex-wrap: wrap;
            }
        }

        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
            font-size: 12px;
        }
    </style>

ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let selectedWorkRecord = null;\n  let selectedSuspendRecord = null;\n\n  // 現在時刻を設定\n  function setCurrentTime() {\n    const now = new Date();\n    const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);\n    container.querySelector(\"#resume-time\").value = localDateTime;\n  }\n\n  // 中断中作業一覧を描画\n  function renderSuspendedWorks(workRecords, suspendRecords) {\n    const tbody = container.querySelector(\"#suspended-works-tbody\");\n    const noWorksDiv = container.querySelector(\"#no-suspended-works\");\n    \n    // 中断中の作業記録を抽出（進捗状況が「中断」のもの）\n    const suspendedWorks = workRecords.filter(work => work.進捗状況 === \"中断\");\n    \n    if (suspendedWorks.length === 0) {\n      tbody.innerHTML = \"\";\n      noWorksDiv.classList.remove(\"hidden\");\n      return;\n    }\n\n    noWorksDiv.classList.add(\"hidden\");\n    \n    tbody.innerHTML = suspendedWorks.map(work => {\n      // 対応する中断記録を検索\n      const suspendRecord = suspendRecords.find(s => s.作業記録ID === work.作業記録ID && !s.中断終了日時);\n      const suspendTime = suspendRecord ? new Date(suspendRecord.中断開始日時).toLocaleString() : \"-\";\n      const suspendReason = suspendRecord ? suspendRecord.中断理由詳細 || suspendRecord.中断理由区分 : \"-\";\n      \n      return `\n        <tr data-work-id=\"${work.作業記録ID}\" data-suspend-id=\"${suspendRecord?.中断記録ID || ''}\" style=\"cursor: pointer;\">\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${work.作業内容 || work.プロジェクト名}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${suspendTime}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${suspendReason}</td>\n          <td style=\"padding: 6px 10px;\">\n            <button class=\"select-work-btn action-btn\" data-work-id=\"${work.作業記録ID}\" data-suspend-id=\"${suspendRecord?.中断記録ID || ''}\"\n                    style=\"background: var(--primary); color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer;\">\n              選択\n            </button>\n          </td>\n        </tr>\n      `;\n    }).join(\"\");\n  }\n\n  // 選択された作業の詳細を表示\n  function showSelectedWork(workRecord, suspendRecord) {\n    selectedWorkRecord = workRecord;\n    selectedSuspendRecord = suspendRecord;\n    \n    container.querySelector(\"#selected-work-name\").textContent = workRecord.作業内容 || workRecord.プロジェクト名;\n    container.querySelector(\"#selected-suspend-time\").textContent = suspendRecord ? \n      new Date(suspendRecord.中断開始日時).toLocaleString() : \"-\";\n    \n    container.querySelector(\"#selected-work-area\").classList.remove(\"hidden\");\n    container.querySelector(\"#resume-form-area\").classList.remove(\"hidden\");\n    \n    setCurrentTime();\n  }\n\n  // 文字数カウント更新\n  function updateCharCount() {\n    const textarea = container.querySelector(\"#resume-reason-detail\");\n    const charCount = container.querySelector(\"#char-count\");\n    charCount.textContent = textarea.value.length;\n  }\n\n  // バリデーション\n  function validateForm() {\n    const reasonDetail = container.querySelector(\"#resume-reason-detail\").value.trim();\n    const errorDiv = container.querySelector(\"#reason-error\");\n    \n    if (!reasonDetail) {\n      errorDiv.textContent = \"再開理由は必須入力です\";\n      errorDiv.classList.remove(\"hidden\");\n      return false;\n    }\n    \n    if (reasonDetail.length > 500) {\n      errorDiv.textContent = \"再開理由は500文字以内で入力してください\";\n      errorDiv.classList.remove(\"hidden\");\n      return false;\n    }\n    \n    errorDiv.classList.add(\"hidden\");\n    return true;\n  }\n\n  // 作業再開処理\n  async function resumeWork() {\n    if (!validateForm()) return;\n    \n    const resumeTime = container.querySelector(\"#resume-time\").value;\n    const reasonSelect = container.querySelector(\"#resume-reason-select\").value;\n    const reasonDetail = container.querySelector(\"#resume-reason-detail\").value.trim();\n    \n    try {\n      // 作業記録を「作業中」に更新\n      const updatedWork = await window.aivicApi.update(1, selectedWorkRecord.作業記録ID, {\n        進捗状況: \"作業中\",\n        更新日時: new Date().toISOString()\n      });\n      \n      if (!updatedWork) {\n        alert(\"作業記録の更新に失敗しました\");\n        return;\n      }\n      \n      // 中断記録を終了\n      if (selectedSuspendRecord) {\n        await window.aivicApi.update(2, selectedSuspendRecord.中断記録ID, {\n          中断終了日時: resumeTime,\n          対応状況: \"解決済み\",\n          更新日時: new Date().toISOString()\n        });\n      }\n      \n      // 新しい中断記録として再開理由を記録（再開記録として）\n      await window.aivicApi.save(2, {\n        作業記録ID: selectedWorkRecord.作業記録ID,\n        中断開始日時: resumeTime,\n        中断理由区分: reasonSelect || \"その他\",\n        中断理由詳細: reasonDetail,\n        中断時間: 0,\n        対応状況: \"解決済み\",\n        記録者ID: selectedWorkRecord.作業員ID,\n        作成日時: new Date().toISOString(),\n        更新日時: new Date().toISOString()\n      });\n      \n      alert(\"作業を再開しました\");\n      window.showScreen(\"scr-1778907296658\"); // 工数入力画面へ遷移\n      \n    } catch (error) {\n      console.error(\"作業再開エラー:\", error);\n      alert(\"作業再開に失敗しました\");\n    }\n  }\n\n  // 初期データ読み込みと描画\n  async function loadData() {\n    try {\n      const workRecords = await window.aivicApi.list(1) || tables[1]?.records || [];\n      const suspendRecords = await window.aivicApi.list(2) || tables[2]?.records || [];\n      renderSuspendedWorks(workRecords, suspendRecords);\n    } catch (error) {\n      console.error(\"データ読み込みエラー:\", error);\n      renderSuspendedWorks(tables[1]?.records || [], tables[2]?.records || []);\n    }\n  }\n\n  // イベントリスナー設定\n  \n  // 作業選択\n  container.addEventListener(\"click\", async (e) => {\n    const selectBtn = e.target.closest(\".select-work-btn\");\n    if (selectBtn) {\n      const workId = selectBtn.dataset.workId;\n      const suspendId = selectBtn.dataset.suspendId;\n      \n      try {\n        const             }
        });

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
