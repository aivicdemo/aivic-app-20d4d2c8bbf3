ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let selectedWorkRecord = null;\n  let suspendedWorks = [];\n\n  // 現在時刻を設定\n  function setCurrentTime() {\n    const now = new Date();\n    const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);\n    container.querySelector('#resume-time').value = localDateTime;\n  }\n\n  // 中断中作業の再描画\n  function renderSuspendedWorks(works) {\n    const tbody = container.querySelector('#suspended-works-tbody');\n    const noMessage = container.querySelector('#no-suspended-message');\n    const tableWrap = container.querySelector('#suspended-works-table-wrap');\n\n    if (!works || works.length === 0) {\n      noMessage.classList.remove('hidden');\n      tableWrap.style.display = 'none';\n      return;\n    }\n\n    noMessage.classList.add('hidden');\n    tableWrap.style.display = 'block';\n\n    tbody.innerHTML = works.map(work => {\n      const suspendTime = work.中断開始日時 ? new Date(work.中断開始日時).toLocaleString() : '';\n      return `\n        <tr data-id=\"${work.作業記録ID}\" style=\"cursor: pointer; height: 36px;\" class=\"work-row\">\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.05);\">${work.プロジェクト名 || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.05);\">${suspendTime}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.05);\">${work.中断理由詳細 || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.05);\">\n            <button class=\"action-btn select-work-btn\" data-id=\"${work.作業記録ID}\" \n                    style=\"background: var(--primary); color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer;\">\n              選択\n            </button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // 中断中作業を取得\n  async function loadSuspendedWorks() {\n    try {\n      const workRecords = await window.aivicApi.list(1); // 作業記録テーブル\n      const suspendRecords = await window.aivicApi.list(2); // 中断記録テーブル\n      \n      if (!workRecords || !suspendRecords) {\n        renderSuspendedWorks([]);\n        return;\n      }\n\n      // 中断中の作業を抽出（進捗状況が「中断」で中断終了日時がnullのもの）\n      const suspended = workRecords.filter(work => \n        work.進捗状況 === '中断' && \n        suspendRecords.some(suspend => \n          suspend.作業記録ID === work.作業記録ID && !suspend.中断終了日時\n        )\n      );\n\n      // 中断記録の詳細を付加\n      const suspendedWithDetails = suspended.map(work => {\n        const suspendRecord = suspendRecords.find(s => \n          s.作業記録ID === work.作業記録ID && !s.中断終了日時\n        );\n        return {\n          ...work,\n          中断開始日時: suspendRecord?.中断開始日時,\n          中断理由詳細: suspendRecord?.中断理由詳細,\n          中断記録ID: suspendRecord?.中断記録ID\n        };\n      });\n\n      suspendedWorks = suspendedWithDetails;\n      renderSuspendedWorks(suspendedWorks);\n    } catch (error) {\n      console.error('中断中作業の取得に失敗:', error);\n      renderSuspendedWorks([]);\n    }\n  }\n\n  // 作業選択\n  function selectWork(workId) {\n    selectedWorkRecord = suspendedWorks.find(w => w.作業記録ID === workId);\n    if (!selectedWorkRecord) return;\n\n    // 選択された作業の詳細を表示\n    container.querySelector('#selected-work-name').textContent = selectedWorkRecord.プロジェクト名 || '';\n    container.querySelector('#selected-suspend-time').textContent = \n      selectedWorkRecord.中断開始日時 ? new Date(selectedWorkRecord.中断開始日時).toLocaleString() : '';\n    \n    container.querySelector('#selected-work-details').classList.remove('hidden');\n    container.querySelector('#resume-form').classList.remove('hidden');\n    \n    setCurrentTime();\n  }\n\n  // 文字数カウント更新\n  function updateCharCount() {\n    const textarea = container.querySelector('#resume-reason-detail');\n    const charCount = container.querySelector('#char-count');\n    charCount.textContent = textarea.value.length;\n  }\n\n  // バリデーション\n  function validateForm() {\n    const reasonDetail = container.querySelector('#resume-reason-detail').value.trim();\n    const errorDiv = container.querySelector('#resume-reason-error');\n    \n    if (!reasonDetail) {\n      errorDiv.textContent = '再開理由は必須です';\n      errorDiv.classList.remove('hidden');\n      return false;\n    }\n    \n    if (reasonDetail.length > 500) {\n      errorDiv.textContent = '再開理由は500文字以内で入力してください';\n      errorDiv.classList.remove('hidden');\n      return false;\n    }\n    \n    errorDiv.classList.add('hidden');\n    return true;\n  }\n\n  // 作業再開処理\n  async function resumeWork() {\n    if (!selectedWorkRecord || !validateForm()) return;\n\n    const reasonSelect = container.querySelector('#resume-reason-select').value;\n    const reasonDetail = container.querySelector('#resume-reason-detail').value.trim();\n    const resumeTime = container.querySelector('#resume-time').value;\n\n    try {\n      // 作業記録を「作業中」に更新\n      const updatedWork = await window.aivicApi.update(1, selectedWorkRecord.作業記録ID, {\n        進捗状況: '作業中',\n        更新日時: new Date().toISOString()\n      });\n\n      if (!updatedWork) {\n        alert('作業記録の更新に失敗しました');\n        return;\n      }\n\n      // 中断記録に終了時刻を設定\n      if (selectedWorkRecord.中断記録ID) {\n        await window.aivicApi.update(2, selectedWorkRecord.中断記録ID, {\n          中断終了日時: new Date(resumeTime).toISOString(),\n          対応状況: '解決済み',\n          更新日時: new Date().toISOString()\n        });\n      }\n\n      alert('作業を再開しました');\n      \n      // 工数入力画面に遷移\n      window.showScreen(\"scr-1778907296658\");\n      \n    } catch (error) {\n      console.error('作業再開処理でエラー:', error);\n      alert('作業再開に失敗しました');\n    }\n  }\n\n  // ダイアログ表示\n  function showConfirmDialog() {\n    container.querySelector('#resume-confirm-dialog').classList.remove('hidden');\n  }\n\n  function hideConfirmDialog() {\n    container.querySelector('#resume-confirm-dialog').classList.add('hidden');\n  }\n\n  // フォームリセット\n  function resetForm() {\n    selectedWorkRecord = null;\n    container.querySelector('#selected-work-details').classList.add('hidden');\n    container.querySelector('#resume-form').classList.add('hidden');\n    container.querySelector('#resume-reason-select').value = '';\n    container.querySelector('#resume-reason-detail').value = '';\n    container.querySelector('#resume-reason-error').classList.add('hidden');\n    updateCharCount();\n  }\n\n  // 初期化\n  setCurrentTime();\n  loadSuspendedWorks();\n\n  // イベントリスナー\n  container.addEventListener('click', (e) => {\n    // 作業選択\n    const selectBtn = e.target.closest('.select-work-btn');\n    if (selectBtn) {\n      const workId = selectBtn.dataset.id;\n      selectWork(workId);\n      return;\n    }\n\n    // 行クリックでも選択\n    const workRow = e.target.closest('.work-row');\n    if (workRow && !e.target.closest('button')) {\n      const workId = workRow.dataset.id;\n      selectWork(workId);\n      return;\n    }\n  });\n\n  // 再開理由選択時の自動入力\n  container.querySelector('#resume-reason-select').addEventListener('change', (e) => {\n    const selected = e.target.value;\n    const detailTextarea = container.querySelector('#resume-reason-detail');\n    \n    if (selected && selected !== 'その他') {\n      detailTextarea.value = selected;\n      updateCharCount();\n    }\n  });\n\n  // 文字数カウント\n  container.querySelector('#resume-reason-detail').addEventListener('input', updateCharCount);\n\n  // 作業再開ボタン\n  container.querySelector('#btn-resume').addEventListener('click', () => {\n    if (validateForm()) {\n      showConfirmDialog();\n    }\n  });\n\n  // キャンセルボタン\n  container.querySelector('#btn-cancel').addEventListener('click', resetForm);\n\n  // 戻るボタン\n  container.querySelector('#btn-back').addEventListener('click', () => {\n    window.showScreen(\"scr-1778907296658\");\n  });\n\n  // ダイアログのOK/キャンセル\n  container.querySelector('#dialog-ok').addEventListener('click', () => {\n    hideConfirmDialog();\n    resumeWork();\n  });\n\n  container.querySelector('#dialog-cancel').addEventListener('click', hideConfirmDialog);\n\n  // ダイアログ背景クリックで閉じる\n  container.querySelector('#resume-confirm-dialog').addEventListener('click', (e) => {\n    if (e.target === e.currentTarget) {\n      hideConfirmDialog();\n    }\n  });\n}";
</script>

    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
