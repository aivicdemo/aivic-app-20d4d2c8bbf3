ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let selectedWorkRecord = null;\n  let selectedInterruptRecord = null;\n\n  // 中断中作業一覧の再描画\n  function renderSuspendedWorks(workRecords, interruptRecords) {\n    const tbody = container.querySelector('#suspended-work-tbody');\n    const noWorkDiv = container.querySelector('#no-suspended-work');\n    \n    // 中断中の作業を抽出（進捗状況が「中断」で、対応する中断記録が未終了）\n    const suspendedWorks = workRecords.filter(work => \n      work.進捗状況 === '中断' && \n      interruptRecords.some(interrupt => \n        interrupt.作業記録ID === work.作業記録ID && !interrupt.中断終了日時\n      )\n    );\n\n    if (suspendedWorks.length === 0) {\n      tbody.innerHTML = '';\n      noWorkDiv.classList.remove('hidden');\n      container.querySelector('.table-wrap').classList.add('hidden');\n      return;\n    }\n\n    noWorkDiv.classList.add('hidden');\n    container.querySelector('.table-wrap').classList.remove('hidden');\n\n    tbody.innerHTML = suspendedWorks.map(work => {\n      const interrupt = interruptRecords.find(i => \n        i.作業記録ID === work.作業記録ID && !i.中断終了日時\n      );\n      \n      const suspendTime = interrupt ? new Date(interrupt.中断開始日時).toLocaleString('ja-JP') : '-';\n      const suspendReason = interrupt ? (interrupt.中断理由詳細 || interrupt.中断理由区分 || '-') : '-';\n      \n      return `\n        <tr data-work-id=\"${work.作業記録ID}\" data-interrupt-id=\"${interrupt?.中断記録ID || ''}\" style=\"cursor: pointer;\">\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${work.作業内容 || work.プロジェクト名 || '-'}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${suspendTime}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${suspendReason}</td>\n          <td style=\"padding: 6px 10px;\">\n            <button class=\"action-btn select-work-btn\" data-work-id=\"${work.作業記録ID}\" data-interrupt-id=\"${interrupt?.中断記録ID || ''}\" style=\"font-size: 12px; padding: 4px 8px;\">選択</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // 現在時刻を設定\n  function setCurrentTime() {\n    const now = new Date();\n    const timeInput = container.querySelector('#resume-time');\n    timeInput.value = now.toISOString().slice(0, 16);\n  }\n\n  // 選択した作業の詳細を表示\n  function showWorkDetails(workRecord, interruptRecord) {\n    selectedWorkRecord = workRecord;\n    selectedInterruptRecord = interruptRecord;\n    \n    const nameDiv = container.querySelector('#selected-work-name');\n    const detailsDiv = container.querySelector('#selected-work-details');\n    const resumeForm = container.querySelector('#resume-form');\n    \n    nameDiv.textContent = workRecord.作業内容 || workRecord.プロジェクト名 || '作業項目';\n    detailsDiv.textContent = `プロジェクト: ${workRecord.プロジェクト名 || '-'} | 場所: ${workRecord.作業場所 || '-'}`;\n    \n    setCurrentTime();\n    resumeForm.classList.remove('hidden');\n  }\n\n  // 文字数カウンター更新\n  function updateCharCount() {\n    const textarea = container.querySelector('#resume-reason-detail');\n    const counter = container.querySelector('#char-count');\n    counter.textContent = textarea.value.length;\n  }\n\n  // バリデーション\n  function validateForm() {\n    const reasonDetail = container.querySelector('#resume-reason-detail').value.trim();\n    const errorDiv = container.querySelector('#reason-error');\n    \n    if (!reasonDetail) {\n      errorDiv.textContent = '再開理由の詳細は必須です';\n      errorDiv.classList.remove('hidden');\n      return false;\n    }\n    \n    if (reasonDetail.length > 500) {\n      errorDiv.textContent = '再開理由は500文字以内で入力してください';\n      errorDiv.classList.remove('hidden');\n      return false;\n    }\n    \n    errorDiv.classList.add('hidden');\n    return true;\n  }\n\n  // 作業再開処理\n  async function resumeWork() {\n    if (!selectedWorkRecord || !selectedInterruptRecord) return;\n    \n    if (!validateForm()) return;\n    \n    const resumeTime = container.querySelector('#resume-time').value;\n    const reasonSelect = container.querySelector('#resume-reason-select').value;\n    const reasonDetail = container.querySelector('#resume-reason-detail').value.trim();\n    \n    try {\n      // 中断記録を終了\n      const updatedInterrupt = await window.aivicApi.update(2, selectedInterruptRecord.中断記録ID, {\n        中断終了日時: new Date(resumeTime).toISOString(),\n        中断時間: Math.floor((new Date(resumeTime) - new Date(selectedInterruptRecord.中断開始日時)) / 60000),\n        対応状況: '解決済み'\n      });\n      \n      if (!updatedInterrupt) {\n        alert('中断記録の更新に失敗しました');\n        return;\n      }\n      \n      // 作業記録を作業中に更新\n      const updatedWork = await window.aivicApi.update(1, selectedWorkRecord.作業記録ID, {\n        進捗状況: '作業中',\n        備考: `${selectedWorkRecord.備考 || ''}\\n[再開] ${new Date(resumeTime).toLocaleString('ja-JP')}: ${reasonSelect || ''}${reasonDetail ? ' - ' + reasonDetail : ''}`.trim()\n      });\n      \n      if (!updatedWork) {\n        alert('作業記録の更新に失敗しました');\n        return;\n      }\n      \n      alert('作業を再開しました');\n      \n      // 画面をリセット\n      container.querySelector('#resume-form').classList.add('hidden');\n      selectedWorkRecord = null;\n      selectedInterruptRecord = null;\n      \n      // 一覧を再読み込み\n      loadData();\n      \n      // 工数入力画面に遷移\n      window.showScreen(\"scr-1778907296658\");\n      \n    } catch (error) {\n      console.error('作業再開エラー:', error);\n      alert('作業再開に失敗しました');\n    }\n  }\n\n  // データ読み込み\n  async function loadData() {\n    try {\n      const [workRecords, interruptRecords] = await Promise.all([\n        window.aivicApi.list(1), // 作業記録\n        window.aivicApi.list(2)  // 中断記録\n      ]);\n      \n      if (workRecords && interruptRecords) {\n        renderSuspendedWorks(workRecords, interruptRecords);\n      }\n    } catch (error) {\n      console.error('データ読み込みエラー:', error);\n    }\n  }\n\n  // 初期データ表示\n  renderSuspendedWorks(tables[1]?.records || [], tables[2]?.records || []);\n\n  // イベントリスナー設定\n  \n  // 作業選択\n  container.addEventListener('click', async (e) => {\n    const selectBtn = e.target.closest('.select-work-btn');\n    if (selectBtn) {\n      const workId = selectBtn.dataset.workId;\n      const interruptId = selectBtn.dataset.interruptId;\n      \n      const workRecords = await window.aivicApi.list(1);\n      const interruptRecords = await window.aivicApi.list(2);\n      \n      if (workRecords && interruptRecords) {\n        const workRecord = workRecords.find(w => w.作業記録ID === workId);\n        const interruptRecord = interruptRecords.find(i => i.中断記録ID === interruptId);\n        \n        if (workRecord && interruptRecord) {\n          showWorkDetails(workRecord, interruptRecord);\n        }\n      }\n    }\n  });\n\n  // 再開理由選択時の自動入力\n  container.querySelector('#resume-reason-select').addEventListener('change', (e) => {\n    const textarea = container.querySelector('#resume-reason-detail');\n    if (e.target.value && !textarea.value.trim()) {\n      textarea.value = e.target.value;\n      updateCharCount();\n    }\n  });\n\n  // 文字数カウンター\n  container.querySelector('#resume-reason-detail').addEventListener('input', updateCharCount);\n\n  // 作業再開ボタン\n  container.querySelector('#btn-resume').addEventListener('click', () => {\n    if (validateForm()) {\n      container.querySelector('#confirm-dialog').classList.remove('hidden');\n    }\n  });\n\n  // キャンセルボタン\n  container.querySelector('#btn-cancel').addEventListener('click', () => {\n    container.querySelector('#resume-form').classList.add('hidden');\n    selectedWorkRecord = null;\n    selectedInterruptRecord = null;\n  });\n\n  // 確認ダイアログ - OK\n  container.querySelector('#btn-confirm-ok').addEventListener('click', () => {\n    container.querySelector('#confirm-dialog').classList.add('hidden');\n    resumeWork();\n  });\n\n  // 確認ダイアログ - キャンセル\n  container.querySelector('#btn-confirm-cancel').addEventListener('click', () => {\n    container.querySelector('#confirm-dialog').classList.add('hidden');\n  });\n\n  // 戻るボタン\n  container.querySelector('#btn-back').addEventListener('click', () => {\n    history.back();\n  });\n\n  // 初期時刻設定\n  setCurrentTime();\n  \n  // データ読み込み\n  loadData();\n}";
</script>

    }

      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");

    function q(i) {

      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";

      list: async function(tableIndex) {

        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }

    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
