<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>工数記録システム</title>
    <style>
        :root {
            --primary: #cc1f1f;
            --primary-hover: #a61a1a;
            --bg-main: #0d0d0d;
            --bg-card: #1a1010;
            --bg-sidebar: #151111;
            --border: #331a1a;
            --text: #e6e6e6;
            --text-muted: #999999;
            --top-bar-bg: #1f1515;
            --top-bar-border: #2d1a1a;
            --warning: #ff6b35;
            --error: #ff3333;
            --success: #28a745;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: "⚠";
            font-size: 18px;
        }

        .nav-section {
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }

        .nav-section:last-child {
            border-bottom: none;
            flex: 1;
        }

        .nav-title {
            padding: 0 16px 8px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: block;
            padding: 8px 16px;
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: rgba(204, 31, 31, 0.1);
            color: var(--primary);
        }

            color: var(--primary);
            border-left-color: var(--primary);

            margin-left: 220px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
        }

        .current-time {
            font-size: 12px;
            font-weight: 500;
            color: var(--primary);
            font-family: 'Courier New', monospace;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text);
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .user-menu:hover {
            background: var(--bg-sidebar);
            border-color: var(--primary);
        }

        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            min-height: calc(100vh - 132px);
        }

        .emergency-banner {
            background: linear-gradient(135deg, var(--error), var(--warning));
            color: white;
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            animation: flash 3s infinite;
        }

        @keyframes flash {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.7; }
        }

        .quick-actions {
            padding: 12px 16px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }

        .quick-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            margin-right: 8px;
            transition: all 0.15s ease;
        }

        .quick-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .quick-btn.secondary {
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
        }

        .quick-btn.secondary:hover {
            background: var(--border);
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .content-area {
                padding: 12px;
            }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(13, 13, 13, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let selectedWorkRecord = null;\n  let selectedInterruptRecord = null;\n\n  // DOM要素の取得\n  const suspendedWorkTbody = container.querySelector('#suspended-work-tbody');\n  const noSuspendedWork = container.querySelector('#no-suspended-work');\n  const resumeForm = container.querySelector('#resume-form');\n  const resumeTime = container.querySelector('#resume-time');\n  const resumeReasonSelect = container.querySelector('#resume-reason-select');\n  const resumeReasonDetail = container.querySelector('#resume-reason-detail');\n  const charCount = container.querySelector('#char-count');\n  const resumeReasonError = container.querySelector('#resume-reason-error');\n  const confirmDialog = container.querySelector('#resume-confirm-dialog');\n\n  // 現在時刻を再開時刻に設定\n  function setCurrentTime() {\n    const now = new Date();\n    const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);\n    resumeTime.value = localDateTime;\n  }\n\n  // 中断中作業一覧の描画\n  function renderSuspendedWorks(workRecords, interruptRecords) {\n    // 中断中の作業記録を抽出（進捗状況が「中断」のもの）\n    const suspendedWorks = workRecords.filter(work => work.進捗状況 === '中断');\n    \n    if (suspendedWorks.length === 0) {\n      suspendedWorkTbody.innerHTML = '';\n      noSuspendedWork.classList.remove('hidden');\n      return;\n    }\n\n    noSuspendedWork.classList.add('hidden');\n    \n    suspendedWorkTbody.innerHTML = suspendedWorks.map(work => {\n      // 対応する中断記録を検索\n      const interrupt = interruptRecords.find(int => int.作業記録ID === work.作業記録ID && !int.中断終了日時);\n      const suspendTime = interrupt ? new Date(interrupt.中断開始日時).toLocaleString() : '-';\n      const suspendReason = interrupt ? interrupt.中断理由詳細 || interrupt.中断理由区分 : '-';\n      \n      return `\n        <tr data-work-id=\"${work.作業記録ID}\" data-interrupt-id=\"${interrupt?.中断記録ID || ''}\" style=\"cursor: pointer;\">\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.05);\">${work.作業内容 || work.プロジェクト名}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.05);\">${suspendTime}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.05);\">${suspendReason}</td>\n          <td style=\"padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,0.05);\">\n            <button class=\"action-btn resume-work-btn\" data-work-id=\"${work.作業記録ID}\" data-interrupt-id=\"${interrupt?.中断記録ID || ''}\" \n                    style=\"background: #dc2626; color: #fff; font-size: 12px; padding: 4px 8px;\">再開</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // 選択された作業情報の表示\n  function showSelectedWorkInfo(workRecord, interruptRecord) {\n    container.querySelector('#selected-work-name').textContent = workRecord.作業内容 || workRecord.プロジェクト名;\n    \n    if (interruptRecord) {\n      container.querySelector('#selected-suspend-time').textContent = new Date(interruptRecord.中断開始日時).toLocaleString();\n      container.querySelector('#selected-suspend-reason').textContent = interruptRecord.中断理由詳細 || interruptRecord.中断理由区分;\n    }\n    \n    setCurrentTime();\n    resumeForm.classList.remove('hidden');\n  }\n\n  // 文字数カウント更新\n  function updateCharCount() {\n    const count = resumeReasonDetail.value.length;\n    charCount.textContent = count;\n    \n    if (count > 500) {\n      charCount.style.color = '#dc2626';\n      resumeReasonError.textContent = '再開理由は500文字以内で入力してください';\n      resumeReasonError.classList.remove('hidden');\n    } else {\n      charCount.style.color = 'var(--text-muted)';\n      resumeReasonError.classList.add('hidden');\n    }\n  }\n\n  // バリデーション\n  function validateForm() {\n    let isValid = true;\n    \n    if (!resumeReasonDetail.value.trim()) {\n      resumeReasonError.textContent = '再開理由の入力は必須です';\n      resumeReasonError.classList.remove('hidden');\n      isValid = false;\n    } else if (resumeReasonDetail.value.length > 500) {\n      resumeReasonError.textContent = '再開理由は500文字以内で入力してください';\n      resumeReasonError.classList.remove('hidden');\n      isValid = false;\n    } else {\n      resumeReasonError.classList.add('hidden');\n    }\n    \n    return isValid;\n  }\n\n  // 作業再開処理\n  async function resumeWork() {\n    if (!validateForm()) return;\n    \n    try {\n      // 作業記録の更新（進捗状況を「作業中」に変更）\n      const updatedWork = await window.aivicApi.update(1, selectedWorkRecord.作業記録ID, {\n        進捗状況: '作業中',\n        更新日時: new Date().toISOString()\n      });\n      \n      if (!updatedWork) {\n        alert('作業記録の更新に失敗しました');\n        return;\n      }\n\n      // 中断記録の更新（中断終了日時を設定）\n      if (selectedInterruptRecord) {\n        await window.aivicApi.update(2, selectedInterruptRecord.中断記録ID, {\n          中断終了日時: resumeTime.value,\n          中断時間: Math.floor((new Date(resumeTime.value) - new Date(selectedInterruptRecord.中断開始日時)) / (1000 * 60)),\n          対応状況: '解決済み',\n          更新日時: new Date().toISOString()\n        });\n      }\n\n      // 新しい中断記録として再開記録を作成（再開理由を記録）\n      const resumeReason = resumeReasonSelect.value || 'その他';\n      await window.aivicApi.save(2, {\n        作業記録ID: selectedWorkRecord.作業記録ID,\n        中断開始日時: resumeTime.value,\n        中断終了日時: resumeTime.value,\n        中断理由区分: '作業再開',\n        中断理由詳細: `再開理由: ${resumeReason} - ${resumeReasonDetail.value}`,\n        中断時間: 0,\n        影響度: '軽微',\n        対応状況: '解決済み',\n        記録者ID: 'current-user-id'\n      });\n\n      alert('作業を再開しました');\n      \n      // 工数入力画面に遷移\n      window.showScreen(\"scr-1778907296658\");\n      \n    } catch (error) {\n      console.error('作業再開エラー:', error);\n      alert('作業再開に失敗しました');\n    }\n  }\n\n  // 初期データの読み込みと描画\n  async function loadData() {\n    try {\n      const workRecords = await window.aivicApi.list(1) || tables[1]?.records || [];\n      const interruptRecords = await window.aivicApi.list(2) || tables[2]?.records || [];\n      renderSuspendedWorks(workRecords, interruptRecords);\n    } catch (error) {\n      console.error('データ読み込みエラー:', error);\n      renderSuspendedWorks(tables[1]?.records || [], tables[2]?.records || []);\n    }\n  }\n\n  // イベントリスナーの設定\n  \n  // 戻るボタン\n  container.querySelector('#btn-back').addEventListener('click', () => {\n    history.back();\n  });\n\n  // 再開ボタンクリック（行レベル）\n  container.addEventListener('click', async (e) => {\n    const resumeBtn = e.target.closest('.resume-work-btn');\n    if (resumeBtn) {\n      const workId = resumeBtn.dataset.workId;\n      const interruptId = resumeBtn.dataset.interruptId;\n      \n      // 作業記録と中断記録を取得\n      const workRecords = await window.aivicApi.list(1) || [];\n      const interruptRecords = await window.aivicApi.list(2) || [];\n      \n      selectedWorkRecord = workRecords.find(w => w.作業記録ID === workId);\n      selectedInterruptRecord = interruptRecords.find(i => i.中断記録ID === interruptId);\n      \n      if (selectedWorkRecord) {\n        showSelectedWorkInfo(selectedWorkRecord, selectedInterruptRecord);\n      }\n    }\n  });\n\n  // 再開理由選択の変更\n  resumeReasonSelect.addEventListener('change', (e) => {\n    if (e.target.value && e.target.value !== 'その他') {\n      resumeReasonDetail.value = e.target.value;\n      updateCharCount();\n    }\n  });\n\n  // 文字数カウント\n  resumeReasonDetail.addEventListener('input', updateCharCount);\n\n  // キャンセルボタン\n  container.querySelector('#btn-cancel-resume').addEventListener('click', () => {\n    resumeForm.classList.add('hidden');\n    selectedWorkRecord = null;\n    selectedInterruptRecord = null;\n    resumeReasonDetail.value = '';\n    resumeReasonSelect.value = '';\n    updateCharCount();\n  });\n\n  // 作業再開ボタン\n  container.querySelector('#btn-resume-work').addEventListener('click', () => {\n    if (validateForm()) {\n      confirmDialog.classList.remove('hidden');\n    }\n  });\n\n       c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
