window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let selectedWorkRecord = null;\n  let selectedSuspendRecord = null;\n\n  // 現在時刻を取得してフォーマット\n  function getCurrentDateTime() {\n    const now = new Date();\n    const year = now.getFullYear();\n    const month = String(now.getMonth() + 1).padStart(2, '0');\n    const day = String(now.getDate()).padStart(2, '0');\n    const hours = String(now.getHours()).padStart(2, '0');\n    const minutes = String(now.getMinutes()).padStart(2, '0');\n    return `${year}-${month}-${day}T${hours}:${minutes}`;\n  }\n\n  // 日時フォーマット関数\n  function formatDateTime(dateStr) {\n    if (!dateStr) return '-';\n    const date = new Date(dateStr);\n    return date.toLocaleString('ja-JP', {\n      year: 'numeric',\n      month: '2-digit',\n      day: '2-digit',\n      hour: '2-digit',\n      minute: '2-digit'\n    });\n  }\n\n  // 中断中作業一覧の再描画\n  function renderSuspendedWorks(workRecords, suspendRecords) {\n    const tbody = container.querySelector('#suspended-work-tbody');\n    const noWorkDiv = container.querySelector('#no-suspended-work');\n    \n    // 中断中の作業記録を抽出（進捗状況が「中断」のもの）\n    const suspendedWorks = workRecords.filter(work => work.進捗状況 === '中断');\n    \n    if (suspendedWorks.length === 0) {\n      tbody.innerHTML = '';\n      noWorkDiv.classList.remove('hidden');\n      return;\n    }\n\n    noWorkDiv.classList.add('hidden');\n    \n    tbody.innerHTML = suspendedWorks.map(work => {\n      // この作業に関連する最新の中断記録を取得\n      const relatedSuspends = suspendRecords.filter(suspend => \n        suspend.作業記録ID === work.作業記録ID && !suspend.中断終了日時\n      );\n      const latestSuspend = relatedSuspends.length > 0 ? relatedSuspends[relatedSuspends.length - 1] : null;\n      \n      return `\n        <tr data-work-id=\"${work.作業記録ID}\" data-suspend-id=\"${latestSuspend?.中断記録ID || ''}\" style=\"cursor: pointer;\">\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${work.プロジェクト名 || ''} - ${work.作業種別 || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${formatDateTime(latestSuspend?.中断開始日時)}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${latestSuspend?.中断理由区分 || ''}</td>\n          <td style=\"padding: 6px 10px;\">\n            <button class=\"action-btn resume-btn\" data-work-id=\"${work.作業記録ID}\" data-suspend-id=\"${latestSuspend?.中断記録ID || ''}\" style=\"padding: 4px 8px; font-size: 12px;\">\n              再開\n            </button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // 作業再開フォームを表示\n  function showResumeForm(workRecord, suspendRecord) {\n    selectedWorkRecord = workRecord;\n    selectedSuspendRecord = suspendRecord;\n    \n    const resumeForm = container.querySelector('#resume-form');\n    const workNameDiv = container.querySelector('#selected-work-name');\n    const suspendTimeDiv = container.querySelector('#selected-suspend-time');\n    const resumeTimeInput = container.querySelector('#resume-time');\n    \n    workNameDiv.textContent = `${workRecord.プロジェクト名 || ''} - ${workRecord.作業種別 || ''}`;\n    suspendTimeDiv.textContent = formatDateTime(suspendRecord?.中断開始日時);\n    resumeTimeInput.value = getCurrentDateTime();\n    \n    resumeForm.classList.remove('hidden');\n    \n    // エラーメッセージをクリア\n    hideError();\n  }\n\n  // エラー表示\n  function showError(message) {\n    const errorDiv = container.querySelector('#resume-error');\n    errorDiv.textContent = message;\n    errorDiv.classList.remove('hidden');\n  }\n\n  function hideError() {\n    const errorDiv = container.querySelector('#resume-error');\n    errorDiv.classList.add('hidden');\n  }\n\n  // バリデーション\n  function validateResumeForm() {\n    const resumeTime = container.querySelector('#resume-time').value;\n    const reasonSelect = container.querySelector('#resume-reason-select').value;\n    const reasonDetail = container.querySelector('#resume-reason-detail').value.trim();\n    \n    if (!resumeTime) {\n      showError('再開時刻を入力してください');\n      return false;\n    }\n    \n    if (!reasonSelect && !reasonDetail) {\n      showError('再開理由を選択するか詳細を入力してください');\n      return false;\n    }\n    \n    if (reasonDetail.length > 500) {\n      showError('再開理由は500文字以内で入力してください');\n      return false;\n    }\n    \n    return true;\n  }\n\n  // 確認ダイアログを表示\n  function showConfirmationDialog() {\n    if (!validateResumeForm()) return;\n    \n    const dialog = container.querySelector('#resume-confirmation-dialog');\n    const workInfo = container.querySelector('#confirmation-work-info');\n    const reasonSelect = container.querySelector('#resume-reason-select').value;\n    const reasonDetail = container.querySelector('#resume-reason-detail').value.trim();\n    \n    const reason = reasonSelect || reasonDetail || '未入力';\n    \n    workInfo.innerHTML = `\n      作業項目: ${selectedWorkRecord.プロジェクト名} - ${selectedWorkRecord.作業種別}<br>\n      再開理由: ${reason}\n    `;\n    \n    dialog.classList.remove('hidden');\n  }\n\n  // 確認ダイアログを非表示\n  function hideConfirmationDialog() {\n    const dialog = container.querySelector('#resume-confirmation-dialog');\n    dialog.classList.add('hidden');\n  }\n\n  // 作業再開処理\n  async function resumeWork() {\n    try {\n      const resumeTime = container.querySelector('#resume-time').value;\n      const reasonSelect = container.querySelector('#resume-reason-select').value;\n      const reasonDetail = container.querySelector('#resume-reason-detail').value.trim();\n      \n      const resumeReason = reasonSelect || reasonDetail;\n      \n      // 1. 中断記録を終了\n      if (selectedSuspendRecord) {\n        await window.aivicApi.update(2, selectedSuspendRecord.中断記録ID, {\n          中断終了日時: resumeTime,\n          対応状況: '解決済み'\n        });\n      }\n      \n      // 2. 作業記録の進捗状況を「作業中」に更新\n      await window.aivicApi.update(1, selectedWorkRecord.作業記録ID, {\n        進捗状況: '作業中',\n        備考: `${selectedWorkRecord.備考 || ''}\\n[${formatDateTime(resumeTime)}] 作業再開: ${resumeReason}`.trim()\n      });\n      \n      // 3. 画面をリセット\n      hideConfirmationDialog();\n      container.querySelector('#resume-form').classList.add('hidden');\n      container.querySelector('#resume-reason-select').value = '';\n      container.querySelector('#resume-reason-detail').value = '';\n      \n      // 4. 一覧を再読み込み\n      loadData();\n      \n      alert('作業を再開しました');\n      \n    } catch (error) {\n      console.error('作業再開エラー:', error);\n      showError('作業再開に失敗しました');\n    }\n  }\n\n  // データ読み込み\n  async function loadData() {\n    try {\n      const [workRecords, suspendRecords] = await Promise.all([\n        window.aivicApi.list(1), // 作業記録\n        window.aivicApi.list(2)  // 中断記録\n      ]);\n      \n      renderSuspendedWorks(workRecords || [], suspendRecords || []);\n    } catch (error) {\n      console.error('データ読み込みエラー:', error);\n      renderSuspendedWorks([], []);\n    }\n  }\n\n  // 文字数カウント更新\n  function updateCharCount() {\n    const textarea = container.querySelector('#resume-reason-detail');\n    const countSpan = container.querySelector('#reason-char-count');\n    countSpan.textContent = textarea.value.length;\n  }\n\n  // イベントリスナー設定\n  \n  // 戻るボタン\n  container.querySelector('#btn-back').addEventListener('click', () => {\n    window.showScreen('scr-1778907296658'); // 工数入力画面\n  });\n\n  // 再開ボタンクリック（行レベル）\n  container.addEventListener('click', async (e) => {\n    const resumeBtn = e.target.closest('.resume-btn');\n    if (resumeBtn) {\n      const workId = resumeBtn.dataset.workId;\n      const suspendId = resumeBtn.dataset.suspendId;\n      \n      try {\n        const [workRecords, suspendRecords] = await Promise.all([\n          window.aivicApi.list(1),\n          window.aivicApi.list(2)\n        ]);\n        \n        const workRecord = workRecords.find(w => w.作業記録ID === workId);\n        const suspendRecord = suspendRecords.find(s => s.中断記録ID === suspendId);\n        \n        if (workRecord) {\n          showResumeForm(workRecord, suspendRecord);\n        }\n      } catch (error) {\n        console.error('作業データ取得エラー:', error);\n        showError('作業データの取得に失敗しました');\n      }\n    }\n  });\n\n  // 再開理由選択時の詳細フィールド連動\n  container.querySelector('#resume-reason-select').addEventListener('change', (e) => {\n    const detailField = container.querySelector('#resume-reason-detail');\n    if (e.target.value && e.target.value !== 'その他') {\n      detailField.value = e.target.value;\n      updateCharCount();\n    }\n  });\n\n  // 文字数カウント\n  container.querySelector('#resume-reason-detail').addEventListener('input', updateCharCount);\n\n  // キャンセルボタン\n  container.querySelector('#btn-cancel-resume').addEventListener('click', () => {\n    container.querySelector('#resume-form').classList.add('hidden');\n    selectedWorkRecord = null;\n    selectedSuspendRecord = null;\n  });\n\n  // 作業再開ボタン\n  container.querySelector('#btn-confirm-resume').addEventListener('click', showConfirmationDialog);\n\n  // ダイアログのキャンセル\n  container.querySelector('#btn-dialog-cancel').addEventListener('click', hideConfirmationDialog);\n\n  // ダイアログのOK\n  container.querySelector('#btn-dialog-ok').addEventListener('click', resumeWork);\n\n  // 初期データ読み込み\n  loadData();\n}";
</script>

      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
