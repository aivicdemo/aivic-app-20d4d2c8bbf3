window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックのインポート\n  const { validateRequiredFields, checkActiveWorkRecord, updateWorkStatus, saveWorkData, showConfirmationDialog } = window.workValidation || {};\n  const { startWorkRecord, recordInterruption, calculateWorkTime, getGPSLocation } = window.feature || {};\n\n  let selectedWorkRecord = null;\n  let selectedSuspendRecord = null;\n\n  // 現在時刻を設定\n  function setCurrentTime() {\n    const now = new Date();\n    const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);\n    const resumeTimeInput = container.querySelector('#resume-time') || container.querySelector('[data-testid=\"resume-time\"]');\n    if (resumeTimeInput) {\n      resumeTimeInput.value = localDateTime;\n    }\n  }\n\n  // 中断中作業一覧を描画\n  function renderSuspendedWorks(workRecords, suspendRecords) {\n    const tbody = container.querySelector('#suspended-work-tbody');\n    const noWorkDiv = container.querySelector('#no-suspended-work');\n    const suspendedWorkList = container.querySelector('[data-testid=\"suspended-work-list\"]') || container.querySelector('.suspended-work-list');\n    \n    // 中断中の作業記録を抽出\n    const suspendedWorks = workRecords.filter(work => work.進捗状況 === '中断');\n    \n    if (suspendedWorks.length === 0) {\n      if (tbody) tbody.innerHTML = '';\n      if (noWorkDiv) {\n        noWorkDiv.classList.remove('hidden');\n        noWorkDiv.style.display = 'block';\n        noWorkDiv.textContent = '中断中の作業はありません';\n      }\n      if (suspendedWorkList) suspendedWorkList.style.display = 'block';\n      return;\n    }\n\n    if (noWorkDiv) {\n      noWorkDiv.classList.add('hidden');\n      noWorkDiv.style.display = 'none';\n    }\n    if (suspendedWorkList) suspendedWorkList.style.display = 'block';\n    \n    if (tbody) {\n      tbody.innerHTML = suspendedWorks.map(work => {\n        const suspendRecord = suspendRecords.find(s => s.作業記録ID === work.作業記録ID && !s.中断終了日時);\n        const suspendTime = suspendRecord ? new Date(suspendRecord.中断開始日時).toLocaleString() : '-';\n        const suspendReason = suspendRecord ? (suspendRecord.中断理由詳細 || suspendRecord.中断理由区分 || '-') : '-';\n        \n        return `\n          <tr class=\"work-item\" data-work-id=\"${work.作業記録ID}\" data-suspend-id=\"${suspendRecord?.中断記録ID || ''}\" style=\"cursor: pointer;\">\n            <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${work.作業内容 || work.プロジェクト名 || '-'}</td>\n            <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${suspendTime}</td>\n            <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${suspendReason}</td>\n            <td style=\"padding: 6px 10px;\">\n              <button class=\"action-btn select-work-btn\" data-work-id=\"${work.作業記録ID}\" data-suspend-id=\"${suspendRecord?.中断記録ID || ''}\" style=\"padding: 4px 8px; font-size: 12px;\">選択</button>\n            </td>\n            <td><span class=\"work-status\">${work.進捗状況}</span></td>\n          </tr>\n        `;\n      }).join('');\n\n      // 行クリックイベント\n      tbody.querySelectorAll('tr.work-item').forEach(row => {\n        row.addEventListener('click', function() {\n          // 既存の選択状態をクリア\n          tbody.querySelectorAll('tr.work-item').forEach(r => r.classList.remove('selected'));\n          // 新しい選択状態を設定\n          this.classList.add('selected');\n          selectedWorkRecord = this.dataset.workId;\n          selectedSuspendRecord = this.dataset.suspendId;\n        });\n      });\n\n      // 選択ボタンクリックイベント\n      tbody.querySelectorAll('.select-work-btn').forEach(btn => {\n        btn.addEventListener('click', function(e) {\n          e.stopPropagation();\n          const workId = this.dataset.workId;\n          const suspendId = this.dataset.suspendId;\n          \n          // 既存の選択状態をクリア\n          tbody.querySelectorAll('tr.work-item').forEach(r => r.classList.remove('selected'));\n          // 対応する行を選択状態にする\n          const row = this.closest('tr');\n          if (row) {\n            row.classList.add('selected');\n          }\n          \n          selectedWorkRecord = workId;\n          selectedSuspendRecord = suspendId;\n        });\n      });\n    }\n  }\n\n  // データ読み込み\n  async function loadData() {\n    try {\n      const [workRecords, suspendRecords] = await Promise.all([\n        window.aivicApi.list('作業記録'),\n        window.aivicApi.list('中断記録')\n      ]);\n      \n      renderSuspendedWorks(workRecords, suspendRecords);\n    } catch (error) {\n      console.error('データ読み込みエラー:', error);\n      if (window.aivicNotify) {\n        window.aivicNotify.error('データの読み込みに失敗しました');\n      }\n    }\n  }\n\n  // 作業再開処理\n  async function handleResumeWork() {\n    try {\n      // 選択された作業の確認\n      if (!selectedWorkRecord) {\n        if (window.aivicNotify) {\n          window.aivicNotify.error('再開する作業を選択してください');\n        }\n        return;\n      }\n\n      // フォーム値取得\n      const resumeTimeInput = container.querySelector('[data-testid=\"resume-time\"]');\n      const resumeReasonSelect = container.querySelector('[data-testid=\"resume-reason-select\"]');\n      const resumeReasonDetail = container.querySelector('[data-testid=\"resume-reason-detail\"]');\n\n      const resumeTime = resumeTimeInput ? resumeTimeInput.value : '';\n      const resumeReason = resumeReasonSelect ? resumeReasonSelect.value : '';\n      const resumeReasonDetailValue = resumeReasonDetail ? resumeReasonDetail.value : '';\n\n      // バリデーション\n      const requiredFields = [\n        { value: resumeTime, name: '再開時刻' },\n        { value: resumeReason || resumeReasonDetailValue, name: '再開理由' }\n      ];\n\n      if (validateRequiredFields) {\n        const validation = validateRequiredFields(requiredFields);\n        if (!validation.isValid) {\n          // エラー表示\n          const errorElement = container.querySelector('#resume-reason-error');\n          if (errorElement) {\n            errorElement.style.display = 'block';\n            errorElement.textContent = validation.message || '再開理由を入力してください';\n          }\n          if (window.aivicNotify) {\n            window.aivicNotify.error(validation.message || '必須項目を入力してください');\n          }\n          return;\n        }\n      }\n\n      // エラー表示をクリア\n      const errorElement = container.querySelector('#resume-reason-error');\n      if (errorElement) {\n        errorElement.style.display = 'none';\n      }\n\n      // 確認ダイアログ表示\n      const confirmDialog = container.querySelector('#resume-confirm-dialog');\n      if (confirmDialog) {\n        confirmDialog.style.display = 'block';\n        return;\n      }\n\n      // 確認ダイアログがない場合は直接実行\n      await executeResumeWork();\n\n    } catch (error) {\n      console.error('作業再開エラー:', error);\n      if (window.aivicNotify) {\n        window.aivicNotify.error('作業再開に失敗しました');\n      }\n    }\n  }\n\n  // 作業再開実行\n  async function executeResumeWork() {\n    try {\n      const resumeTimeInput = container.querySelector('[data-testid=\"resume-time\"]');\n      const resumeReasonSelect = container.querySelector('[data-testid=\"resume-reason-select\"]');\n      const resumeReasonDetail = container.querySelector('[data-testid=\"resume-reason-detail\"]');\n\n      const resumeTime = resumeTimeInput ? resumeTimeInput.value : '';\n      const resumeReason = resumeReasonSelect ? resumeReasonSelect.value : '';\n      const resumeReasonDetailValue = resumeReasonDetail ? resumeReasonDetail.value : '';\n\n      // GPS位置情報取得\n      let gpsLocation = null;\n      if (getGPSLocation) {\n        try {\n          gpsLocation = await getGPSLocation();\n        } catch (gpsError) {\n          console.warn('GPS取得エラー:', gpsError);\n        }\n      }\n\n      // 中断記録を終了\n      if (selectedSuspendRecord) {\n        await window.aivicApi.update('中断記録', selectedSuspendRecord, {\n          中断終了日時: resumeTime,\n          再開理由区分: resumeReason,\n          再開理由詳細: resumeReasonDetailValue,\n          再開位置情報: gpsLocation ? `${gpsLocation.latitude},${gpsLocation.longitude}` : null\n        });\n      }\n\n      // 作業記録のステータスを更新\n      if (updateWorkStatus) {\n        await updateWorkStatus(selectedWorkRecord, '作業中');\n      } else {\n        await window.aivicApi.update('作業記録', selectedWorkRecord, {\n          進捗状況: '作業中',\n          再開日時: resumeTime\n        });\n      }\n\n      // 成功メッセージ表示\n      const successMessage = container.querySelector('.success-message');\n      if (successMessage) {\n        successMessage.style.display = 'block';\n        successMessage.textContent = '作業再開が記録されました';\n      }\n\n      if (window.aivicNotify) {\n        window.aivicNotify.success('作業再開が記録されました');\n      }\n\n      // 確認ダイアログを閉じる\n      const confirmDialog = container.querySelector('#resume-confirm-dialog');\n      if (confirmDialog) {\n        confirmDialog.style.display = 'none';\n      }\n\n      // データを再読み込み\n      await loadData();\n\n      // フォームをリセット\n      if (resumeReasonSelect) resumeReasonSelect.value = '';\n      if (resumeReasonDetail) resumeReasonDetail.value = '';\n      selectedWorkRecord = null;\n      selectedSuspendRecord = null;\n\n      // 選択状態をクリア\n      const tbody = container.querySelector('#suspended-work-tbody');\n      if (tbody) {\n        tbody.querySelectorAll('tr.work-item').forEach(r => r.classList.remove('selected'));\n      }\n\n    } catch (error) {\n      console.error('作業再開実行エラー:', error);\n      if (window.aivicNotify) {\n        window.aivicNotify.error('作業再開の記録に失敗しました');\n      }\n    }\n  }\n\n  // 戻るボタン処理\n  function handleBack() {\n    if (window.history && window.history.length > 1) {\n      window.history.back();\n    } else {\n      window.location.href = '/';\n    }\n  }\n\n  // イベントリスナー設定\n  function setupEventListeners() {\n    // 戻るボタン\n    const backButton = container.querySelector('[data-testid=\"back-button\"]') || container.querySelector('#btn-back');\n    if (backButton) {\n      backButton.addEventListener('click', handleBack);\n    }\n\n    // 作業再開ボタン\n    const resumeButton = container.querySelector('[data-testid=\"resume-button\"]');\n    if (resumeButton) {\n      resumeButton.addEventListener('click', handleResumeWork);\n    }\n\n    // 確認ダイアログのOKボタン\n    const dialogOkButton = container.querySelector('[data-testid=\"dialog-ok-button\"]');\n    if (dialogOkButton) {\n      dialogOkButton.addEventListener('click', async () => {\n        await executeResumeWork();\n      });\n    }\n\n    // 確認ダイアログのキャンセルボタン\n    const dialogCancelButton = container.querySelector('[data-testid=\"dialog-cancel-button\"]');\n    if (dialogCancelButton) {\n      dialogCancelButton.addEventListener('click', () => {\n        const confirmDialog = container.querySelector('#resume-confirm-dialog');\n        if (confirmDialog) {\n          confirmDialog.style.display = 'none';\n        }\n      });\n    }\n\n    // 再開理由詳細入力時のエラークリア\n    const resumeReasonDetail = container.querySelector('[data-testid=\"resume-reason-detail\"]');\n    if (resumeReasonDetail) {\n      resumeReasonDetail.addEventListener('input', () => {\n        const errorElement = container.querySelector('#resume-reason-error');\n        if (errorElement && resumeReasonDetail.value.trim()) {\n          errorElement.style.display = 'none';\n        }\n      });\n    }\n\n    // 再開理由選択時のエラークリア\n    const resumeReasonSelect = container.querySelector('[data-testid=\"resume-reason-select\"]');\n    if (resumeReasonSelect) {\n      resumeReasonSelect.addEventListener('change', () => {\n        const errorElement = container.querySelector('#resume-reason-error');\n        if (errorElement && resumeReasonSelect.value) {\n          errorElement.style.display = 'none';\n        }\n      });\n    }\n  }\n\n  // 初期化処理\n  async function initialize() {\n    try {\n      // 現在時刻を設定\n      setCurrentTime();\n      \n      // イベントリスナー設定\n      setupEventListeners();\n      \n      // データ読み込み\n      await loadData();\n      \n    } catch (error) {\n      console.error('初期化エラー:', error);\n      if (window.aivicNotify) {\n        window.aivicNotify.error('画面の初期化に失敗しました');\n      }\n    }\n  }\n\n  // 初期化実行\n  initialize();\n}";

      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
