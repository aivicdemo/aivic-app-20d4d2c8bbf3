window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let selectedWorkRecord = null;\n  let selectedInterruptRecord = null;\n\n  // DOM要素の取得\n  const suspendedWorkTbody = container.querySelector('#suspended-work-tbody');\n  const noSuspendedWork = container.querySelector('#no-suspended-work');\n  const resumeForm = container.querySelector('#resume-form');\n  const resumeTimeInput = container.querySelector('#resume-time');\n  const resumeReasonSelect = container.querySelector('#resume-reason-select');\n  const resumeReasonDetail = container.querySelector('#resume-reason-detail');\n  const charCount = container.querySelector('#char-count');\n  const resumeReasonError = container.querySelector('#resume-reason-error');\n  const confirmDialog = container.querySelector('#resume-confirm-dialog');\n\n  // 中断中作業一覧の描画\n  function renderSuspendedWorks() {\n    // 作業記録テーブル（tableIndex: 1）と中断記録テーブル（tableIndex: 2）を取得\n    Promise.all([\n      window.aivicApi.list(1), // 作業記録\n      window.aivicApi.list(2)  // 中断記録\n    ]).then(([workRecords, interruptRecords]) => {\n      if (!workRecords || !interruptRecords) return;\n\n      // 中断中の作業を抽出（進捗状況が「中断」で、対応する中断記録の終了日時がnull）\n      const suspendedWorks = workRecords.filter(work => \n        work.進捗状況 === '中断'\n      ).map(work => {\n        const interrupt = interruptRecords.find(int => \n          int.作業記録ID === work.作業記録ID && !int.中断終了日時\n        );\n        return { work, interrupt };\n      }).filter(item => item.interrupt);\n\n      if (suspendedWorks.length === 0) {\n        suspendedWorkTbody.innerHTML = '';\n        noSuspendedWork.classList.remove('hidden');\n        resumeForm.classList.add('hidden');\n        return;\n      }\n\n      noSuspendedWork.classList.add('hidden');\n      \n      suspendedWorkTbody.innerHTML = suspendedWorks.map(({ work, interrupt }) => `\n        <tr data-work-id=\"${work.作業記録ID}\" data-interrupt-id=\"${interrupt.中断記録ID}\" style=\"cursor: pointer;\">\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${work.作業内容 || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${interrupt.中断開始日時 ? new Date(interrupt.中断開始日時).toLocaleString() : ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${interrupt.中断理由詳細 || interrupt.中断理由区分 || ''}</td>\n          <td style=\"padding: 6px 10px;\">\n            <button class=\"action-btn select-work-btn\" data-work-id=\"${work.作業記録ID}\" data-interrupt-id=\"${interrupt.中断記録ID}\" style=\"padding: 4px 8px; font-size: 12px;\">選択</button>\n          </td>\n        </tr>\n      `).join('');\n    });\n  }\n\n  // 作業選択時の処理\n  function selectWork(workId, interruptId) {\n    Promise.all([\n      window.aivicApi.list(1), // 作業記録\n      window.aivicApi.list(2)  // 中断記録\n    ]).then(([workRecords, interruptRecords]) => {\n      if (!workRecords || !interruptRecords) return;\n\n      selectedWorkRecord = workRecords.find(w => w.作業記録ID === workId);\n      selectedInterruptRecord = interruptRecords.find(i => i.中断記録ID === interruptId);\n\n      if (!selectedWorkRecord || !selectedInterruptRecord) return;\n\n      // 選択された作業の詳細を表示\n      container.querySelector('#selected-work-name').textContent = selectedWorkRecord.作業内容 || '';\n      container.querySelector('#selected-suspend-time').textContent = selectedInterruptRecord.中断開始日時 ? \n        new Date(selectedInterruptRecord.中断開始日時).toLocaleString() : '';\n      container.querySelector('#selected-suspend-reason').textContent = selectedInterruptRecord.中断理由詳細 || selectedInterruptRecord.中断理由区分 || '';\n\n      // 再開時刻を現在時刻に設定\n      const now = new Date();\n      const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);\n      resumeTimeInput.value = localDateTime;\n\n      // フォームをクリア\n      resumeReasonSelect.value = '';\n      resumeReasonDetail.value = '';\n      charCount.textContent = '0';\n      resumeReasonError.classList.add('hidden');\n\n      resumeForm.classList.remove('hidden');\n    });\n  }\n\n  // 文字数カウント\n  resumeReasonDetail.addEventListener('input', () => {\n    const length = resumeReasonDetail.value.length;\n    charCount.textContent = length;\n    \n    if (length > 500) {\n      resumeReasonError.textContent = '再開理由は500文字以内で入力してください';\n      resumeReasonError.classList.remove('hidden');\n    } else {\n      resumeReasonError.classList.add('hidden');\n    }\n  });\n\n  // 再開理由選択時の処理\n  resumeReasonSelect.addEventListener('change', () => {\n    if (resumeReasonSelect.value && resumeReasonSelect.value !== 'その他') {\n      resumeReasonDetail.value = resumeReasonSelect.value;\n      charCount.textContent = resumeReasonDetail.value.length;\n    }\n  });\n\n  // バリデーション\n  function validateForm() {\n    const reasonDetail = resumeReasonDetail.value.trim();\n    \n    if (!reasonDetail) {\n      resumeReasonError.textContent = '再開理由は必須です';\n      resumeReasonError.classList.remove('hidden');\n      return false;\n    }\n    \n    if (reasonDetail.length > 500) {\n      resumeReasonError.textContent = '再開理由は500文字以内で入力してください';\n      resumeReasonError.classList.remove('hidden');\n      return false;\n    }\n    \n    resumeReasonError.classList.add('hidden');\n    return true;\n  }\n\n  // 作業再開処理\n  function resumeWork() {\n    if (!selectedWorkRecord || !selectedInterruptRecord) return;\n    \n    const resumeTime = new Date(resumeTimeInput.value).toISOString();\n    \n    // 中断記録を更新（終了日時を設定）\n    window.aivicApi.update(2, selectedInterruptRecord.中断記録ID, {\n      中断終了日時: resumeTime\n    }).then(updatedInterrupt => {\n      if (!updatedInterrupt) return;\n      \n      // 作業記録を更新（進捗状況を「作業中」に変更）\n      return window.aivicApi.update(1, selectedWorkRecord.作業記録ID, {\n        進捗状況: '作業中'\n      });\n    }).then(updatedWork => {\n      if (!updatedWork) return;\n      \n      // 成功メッセージ表示\n      alert('作業を再開しました');\n      \n      // フォームをリセット\n      resumeForm.classList.add('hidden');\n      selectedWorkRecord = null;\n      selectedInterruptRecord = null;\n      \n      // 一覧を再描画\n      renderSuspendedWorks();\n      \n      // 工数入力画面に遷移\n      window.showScreen(\"scr-1778907296658\");\n    });\n  }\n\n  // イベントリスナー\n  container.addEventListener('click', (e) => {\n    // 作業選択\n    const selectBtn = e.target.closest('.select-work-btn');\n    if (selectBtn) {\n      const workId = selectBtn.dataset.workId;\n      const interruptId = selectBtn.dataset.interruptId;\n      selectWork(workId, interruptId);\n      return;\n    }\n  });\n\n  // 戻るボタン\n  container.querySelector('#btn-back').addEventListener('click', () => {\n    history.back();\n  });\n\n  // キャンセルボタン\n  container.querySelector('#btn-cancel').addEventListener('click', () => {\n    resumeForm.classList.add('hidden');\n    selectedWorkRecord = null;\n    selectedInterruptRecord = null;\n  });\n\n  // 作業再開ボタン\n  container.querySelector('#btn-resume').addEventListener('click', () => {\n    if (!validateForm()) return;\n    confirmDialog.classList.remove('hidden');\n  });\n\n  // 確認ダイアログのキャンセル\n  container.querySelector('#btn-dialog-cancel').addEventListener('click', () => {\n    confirmDialog.classList.add('hidden');\n  });\n\n  // 確認ダイアログのOK\n  container.querySelector('#btn-dialog-ok').addEventListener('click', () => {\n    confirmDialog.classList.add('hidden');\n    resumeWork();\n  });\n\n  // 初期データ読み込み\n  renderSuspendedWorks();\n}";
</script>

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();
