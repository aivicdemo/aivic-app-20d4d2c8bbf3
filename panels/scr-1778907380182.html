window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  // 現在のユーザー情報を設定\n  const currentUser = { name: \"田中太郎\", id: \"user-001\" };\n  container.querySelector(\"#worker-name\").value = currentUser.name;\n  \n  // 今日の日付を設定\n  const today = new Date().toISOString().split('T')[0];\n  container.querySelector(\"#work-date\").value = today;\n  \n  let totalBreakMinutes = 0;\n  \n  // 作業項目マスタを読み込み\n  async function loadWorkItems() {\n    try {\n      const workItems = await window.aivicApi.list(3); // 作業項目マスタ\n      const workItemSelect = container.querySelector(\"#work-item\");\n      workItemSelect.innerHTML = '<option value=\"\">選択してください</option>';\n      \n      if (workItems) {\n        workItems.forEach(item => {\n          const option = document.createElement('option');\n          option.value = item.作業項目名 || item.name || '';\n          option.textContent = item.作業項目名 || item.name || '';\n          workItemSelect.appendChild(option);\n        });\n      }\n    } catch (error) {\n      console.error('作業項目の読み込みに失敗:', error);\n    }\n  }\n  \n  // 工数計算関数\n  function calculateWorkHours() {\n    const startTime = container.querySelector(\"#start-time\").value;\n    const endTime = container.querySelector(\"#end-time\").value;\n    \n    if (!startTime || !endTime) {\n      container.querySelector(\"#total-work-time\").textContent = \"0:00\";\n      container.querySelector(\"#net-work-time\").textContent = \"0:00\";\n      container.querySelector(\"#work-hours\").textContent = \"0.0h\";\n      return;\n    }\n    \n    const start = new Date(`2000-01-01T${startTime}`);\n    const end = new Date(`2000-01-01T${endTime}`);\n    \n    if (end <= start) {\n      showError(\"開始時刻が終了時刻より後になっています\");\n      return;\n    }\n    \n    const totalMinutes = (end - start) / (1000 * 60);\n    const netMinutes = Math.max(0, totalMinutes - totalBreakMinutes);\n    \n    if (totalMinutes > 24 * 60) {\n      showError(\"24時間以上の作業時間は入力できません\");\n      return;\n    }\n    \n    if (totalBreakMinutes > totalMinutes) {\n      showError(\"中断時間は作業時間を超過できません\");\n      return;\n    }\n    \n    const totalHours = Math.floor(totalMinutes / 60);\n    const totalMins = totalMinutes % 60;\n    const netHours = Math.floor(netMinutes / 60);\n    const netMins = netMinutes % 60;\n    \n    container.querySelector(\"#total-work-time\").textContent = `${totalHours}:${String(totalMins).padStart(2, '0')}`;\n    container.querySelector(\"#net-work-time\").textContent = `${netHours}:${String(netMins).padStart(2, '0')}`;\n    container.querySelector(\"#work-hours\").textContent = `${(netMinutes / 60).toFixed(1)}h`;\n    \n    clearErrors();\n  }\n  \n  // エラー表示関数\n  function showError(message) {\n    const errorDiv = container.querySelector(\"#error-messages\");\n    errorDiv.innerHTML = `<div style=\"background: rgba(220, 38, 38, 0.1); border: 1px solid rgba(220, 38, 38, 0.3); border-radius: 6px; padding: 8px; color: #fca5a5; font-size: 12px;\">${message}</div>`;\n  }\n  \n  function clearErrors() {\n    container.querySelector(\"#error-messages\").innerHTML = \"\";\n  }\n  \n  // バリデーション関数\n  function validateForm() {\n    const workDate = container.querySelector(\"#work-date\").value;\n    const startTime = container.querySelector(\"#start-time\").value;\n    const endTime = container.querySelector(\"#end-time\").value;\n    const workDetails = container.querySelector(\"#work-details\").value;\n    const projectName = container.querySelector(\"#project-name\").value;\n    const workLocation = container.querySelector(\"#work-location\").value;\n    const workType = container.querySelector(\"#work-type\").value;\n    \n    if (!workDate || !startTime || !workDetails || !projectName || !workLocation || !workType) {\n      showError(\"必須項目が入力されていません\");\n      return false;\n    }\n    \n    // 未来日付チェック\n    const selectedDate = new Date(workDate);\n    const today = new Date();\n    today.setHours(0, 0, 0, 0);\n    \n    if (selectedDate > today) {\n      showError(\"未来日付は選択できません\");\n      return false;\n    }\n    \n    // 時刻チェック\n    if (endTime) {\n      const start = new Date(`2000-01-01T${startTime}`);\n      const end = new Date(`2000-01-01T${endTime}`);\n      \n      if (end <= start) {\n        showError(\"開始時刻が終了時刻より後になっています\");\n        return false;\n      }\n      \n      const totalMinutes = (end - start) / (1000 * 60);\n      if (totalMinutes > 24 * 60) {\n        showError(\"24時間以上の作業時間は入力できません\");\n        return false;\n      }\n      \n      if (totalBreakMinutes > totalMinutes) {\n        showError(\"中断時間は作業時間を超過できません\");\n        return false;\n      }\n    }\n    \n    return true;\n  }\n  \n  // フォームクリア関数\n  function clearForm() {\n    container.querySelector(\"#work-date\").value = today;\n    container.querySelector(\"#project-name\").value = \"\";\n    container.querySelector(\"#work-item\").value = \"\";\n    container.querySelector(\"#work-location\").value = \"\";\n    container.querySelector(\"#work-type\").value = \"\";\n    container.querySelector(\"#start-time\").value = \"\";\n    container.querySelector(\"#end-time\").value = \"\";\n    container.querySelector(\"#break-minutes\").value = \"\";\n    container.querySelector(\"#work-details\").value = \"\";\n    totalBreakMinutes = 0;\n    container.querySelector(\"#total-break-time\").textContent = \"合計: 0分\";\n    container.querySelector(\"#total-break-display\").textContent = \"0:00\";\n    container.querySelector(\"#char-count\").textContent = \"0\";\n    calculateWorkHours();\n    clearErrors();\n  }\n  \n  // 初期化\n  loadWorkItems();\n  \n  // イベントリスナー\n  container.querySelector(\"#start-time\").addEventListener(\"change\", calculateWorkHours);\n  container.querySelector(\"#end-time\").addEventListener(\"change\", calculateWorkHours);\n  \n  // 中断時間追加\n  container.querySelector(\"#add-break-btn\").addEventListener(\"click\", () => {\n    const breakMinutes = parseInt(container.querySelector(\"#break-minutes\").value) || 0;\n    if (breakMinutes > 0) {\n      totalBreakMinutes += breakMinutes;\n      container.querySelector(\"#total-break-time\").textContent = `合計: ${totalBreakMinutes}分`;\n      const breakHours = Math.floor(totalBreakMinutes / 60);\n      const breakMins = totalBreakMinutes % 60;\n      container.querySelector(\"#total-break-display\").textContent = `${breakHours}:${String(breakMins).padStart(2, '0')}`;\n      container.querySelector(\"#break-minutes\").value = \"\";\n      calculateWorkHours();\n    }\n  });\n  \n  // 文字数カウント\n  container.querySelector(\"#work-details\").addEventListener(\"input\", (e) => {\n    const count = e.target.value.length;\n    container.querySelector(\"#char-count\").textContent = count;\n    if (count > 1000) {\n      showError(\"作業内容詳細は1000文字以内で入力してください\");\n    } else {\n      clearErrors();\n    }\n  });\n  \n  // キャンセルボタン\n  container.querySelector(\"#cancel-btn\").addEventListener(\"click\", () => {\n    if (confirm(\"入力内容をクリアしますか？\")) {\n      clearForm();\n    }\n  });\n  \n  // 一時保存ボタン\n  container.querySelector(\"#temp-save-btn\").addEventListener(\"click\", async () => {\n    if (!validateForm()) return;\n    \n    const formData = {\n      作業員ID: currentUser.id,\n      作業日: container.querySelector(\"#work-date\").value,\n      作業開始時刻: `${container.querySelector(\"#work-date\").value}T${container.querySelector(\"#start-time\").value}`,\n      作業終了時刻: container.querySelector(\"#end-time\").value ? `${container.querySelector(\"#work-date\").value}T${container.querySelector(\"#end-time\").value}` : null,\n      作業時間: container.querySelector(\"#end-time\").value ? parseInt(container.querySelector(\"#net-work-time\").textContent.split(':')[0]) * 60 + parseInt(container.querySelector(\"#net-work-time\").textContent.split(':')[1]) : null,\n      プロジェクト名: container.querySelector(\"#project-name\").value,\n      作業場所: container.querySelector(\"#work-location\").value,\n      作業種別: container.querySelector(\"#work-type\").value,\n      作業内容: container.querySelector(\"#work-details\").value,\n      進捗状況: \"作業中\",\n      承認状態: \"未承認\",\n      作成日時: new Date().toISOString(),\n      更新日時: new Date().toISOString(),\n      作成者ID: currentUser.id\n    };\n    \n    try {\n      const result = await window.aivicApi.save(1, formData); // 作業記録テーブル\n      if (result) {\n        alert(\"一時保存が完了しました\");\n      }\n    } catch (error) {\n      showError(\"一時保存に失敗しました\");\n    }\n  });\n  \n  // 記録確定ボタン\n  container.querySelector(\"#save-btn\").addEventListener(\"click\", async () => {\n    if (!validateForm()) return;\n    \n    if (!container.querySelector(\"#end-time\").value) {\n      showError(\"記録確定には終了時刻の入力が必要です\");\n      return;\n    }\n    \n    if (!confirm(\"工数記録を確定しますか？\")) return;\n    \n    const netWorkTime = container.querySelector(\"#net-work-time\").textContent;\n    const [hours, minutes] = netWorkTime.split(':').map(Number);\n    const totalMinutes = hours * 60 + minutes;\n    \n    const formData = {\n      作業員ID: currentUser.id,\n      作業日: container.querySelector(\"#work-date\").value,\n      作業開始時刻: `${container.querySelector(\"#work-date\").value}T${container.querySelector(\"#start-time\").value}`,\n      作業終了時刻: `${container.querySelector(\"#work-date\").value}T${container.querySelector(\"#end-time\").value}`,\n      作業時間: totalMinutes,\n      プロジェクト名: container.querySelector(\"#project-name\").value,\n      作業場所: container.querySelector(\"#work-location\").value,\n      作業種別: container.querySelector(\"#work-type\").value,\n      作業内容: container.querySelector(\"#work-details\").value,\n      進捗状況: \"完了\",\n      承認状態: \"未承認\",\n      作成日時: new Date().toISOString(),\n      更新日時: new Date().toISOString(),\n      作成者ID: currentUser.id\n    };\n    \n    try {\n      const result = await window.aivicApi.save(1, formData); // 作業記録テーブル\n      if (result) {\n        alert(\"工数記録が正常に登録されました\");\n        clearForm();\n        // 作業履歴一覧画面に遷移\n        window.showScreen(\"scr-1778907145716\");\n      }\n    } catch (error) {\n      showError(\"工数記録の登録に失敗しました\");\n    }\n  });\n}";

                'scr-1778907367889': { title: '工数記録確認', breadcrumb: '確認・履歴' },

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
