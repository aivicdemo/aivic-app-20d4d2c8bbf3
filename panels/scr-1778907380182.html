            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .breadcrumb-current {
            color: var(--text);
            font-weight: 500;
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

            text-decoration: none;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: color 0.15s ease;
        }

        .logout-link:hover {
            color: var(--text);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quick-action-btn {
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .quick-action-btn:hover {
            border-color: var(--primary);
            background: rgba(74, 158, 255, 0.1);
        }

        .quick-action-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .quick-action-btn.primary:hover {
            background: var(--primary-hover);
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-height: 400px;
            padding: 0;
        }

        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .nav-emergency {
            margin-top: auto;
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        .emergency-btn {
            width: 100%;
            padding: 10px 12px;
            background: var(--error);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        .emergency-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
            
            .quick-actions {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let breakRecords = [];\n  let tempSaveData = null;\n\n  // 今日の日付を設定\n  const today = new Date().toISOString().split('T')[0];\n  container.querySelector('#input-work-date').value = today;\n\n  // 作業項目マスタの読み込み\n  async function loadWorkItems() {\n    const workItems = await window.aivicApi.list(3); // 作業項目マスタ\n    const select = container.querySelector('#select-work-item');\n    select.innerHTML = '<option value=\"\">選択してください</option>';\n    if (workItems) {\n      workItems.filter(item => item.有効フラグ).forEach(item => {\n        const option = document.createElement('option');\n        option.value = item.作業項目ID;\n        option.textContent = `${item.作業項目コード} - ${item.作業項目名}`;\n        select.appendChild(option);\n      });\n    }\n  }\n\n  // 工数時間の自動計算\n  function calculateHours() {\n    const startTime = container.querySelector('#input-start-time').value;\n    const endTime = container.querySelector('#input-end-time').value;\n    const breakTime = parseInt(container.querySelector('#input-break-time').value) || 0;\n\n    if (startTime && endTime) {\n      const start = new Date(`2000-01-01T${startTime}`);\n      const end = new Date(`2000-01-01T${endTime}`);\n      \n      if (end <= start) {\n        container.querySelector('#calculated-hours').textContent = 'エラー';\n        return 0;\n      }\n\n      const diffMs = end - start;\n      const totalMinutes = Math.floor(diffMs / (1000 * 60));\n      const workMinutes = Math.max(0, totalMinutes - breakTime);\n      \n      // 中断記録の時間も差し引く\n      const totalBreakMinutes = breakRecords.reduce((sum, record) => {\n        if (record.中断開始日時 && record.中断終了日時) {\n          const breakStart = new Date(`2000-01-01T${record.中断開始日時.split('T')[1]}`);\n          const breakEnd = new Date(`2000-01-01T${record.中断終了日時.split('T')[1]}`);\n          return sum + Math.floor((breakEnd - breakStart) / (1000 * 60));\n        }\n        return sum;\n      }, 0);\n\n      const finalMinutes = Math.max(0, workMinutes - totalBreakMinutes);\n      const hours = (finalMinutes / 60).toFixed(1);\n      container.querySelector('#calculated-hours').textContent = `${hours}h`;\n      return finalMinutes;\n    }\n\n    container.querySelector('#calculated-hours').textContent = '0.0h';\n    return 0;\n  }\n\n  // 文字数カウント\n  function updateCharCount() {\n    const textarea = container.querySelector('#input-work-detail');\n    const count = textarea.value.length;\n    container.querySelector('#char-count').textContent = count;\n    \n    if (count > 1000) {\n      container.querySelector('#char-count').style.color = '#ef4444';\n    } else {\n      container.querySelector('#char-count').style.color = 'var(--text-muted)';\n    }\n  }\n\n  // バリデーション\n  function validateForm() {\n    const errors = [];\n    const workDate = container.querySelector('#input-work-date').value;\n    const project = container.querySelector('#select-project').value;\n    const workItem = container.querySelector('#select-work-item').value;\n    const workLocation = container.querySelector('#select-work-location').value;\n    const workType = container.querySelector('#select-work-type').value;\n    const startTime = container.querySelector('#input-start-time').value;\n    const endTime = container.querySelector('#input-end-time').value;\n    const workDetail = container.querySelector('#input-work-detail').value;\n    const breakTime = parseInt(container.querySelector('#input-break-time').value) || 0;\n\n    // 必須項目チェック\n    if (!workDate) errors.push('作業日付は必須です');\n    if (!project) errors.push('プロジェクト名は必須です');\n    if (!workItem) errors.push('作業項目は必須です');\n    if (!workLocation) errors.push('作業場所は必須です');\n    if (!workType) errors.push('作業種別は必須です');\n    if (!startTime) errors.push('開始時刻は必須です');\n    if (!endTime) errors.push('終了時刻は必須です');\n    if (!workDetail.trim()) errors.push('作業内容詳細は必須です');\n\n    // 日付チェック\n    if (workDate && new Date(workDate) > new Date(today)) {\n      errors.push('未来日付は選択できません');\n    }\n\n    // 時刻チェック\n    if (startTime && endTime) {\n      const start = new Date(`2000-01-01T${startTime}`);\n      const end = new Date(`2000-01-01T${endTime}`);\n      \n      if (end <= start) {\n        errors.push('開始時刻が終了時刻より後になっています');\n      } else {\n        const diffMs = end - start;\n        const totalMinutes = Math.floor(diffMs / (1000 * 60));\n        \n        if (totalMinutes >= 24 * 60) {\n          errors.push('24時間以上の作業時間は入力できません');\n        }\n        \n        if (breakTime > totalMinutes) {\n          errors.push('中断時間は作業時間を超過できません');\n        }\n      }\n    }\n\n    // 文字数チェック\n    if (workDetail.length > 1000) {\n      errors.push('作業内容詳細は1000文字以内で入力してください');\n    }\n\n    return errors;\n  }\n\n  // エラー表示\n  function showErrors(errors) {\n    const errorDiv = container.querySelector('#error-messages');\n    const errorList = container.querySelector('#error-list');\n    \n    if (errors.length > 0) {\n      errorList.innerHTML = errors.map(error => `<li>${error}</li>`).join('');\n      errorDiv.style.display = 'block';\n    } else {\n      errorDiv.style.display = 'none';\n    }\n  }\n\n  // 中断記録の追加\n  function addBreakRecord() {\n    const breakStart = prompt('中断開始時刻を入力してください (HH:MM)');\n    if (!breakStart || !/^\\d{2}:\\d{2}$/.test(breakStart)) return;\n    \n    const breakEnd = prompt('中断終了時刻を入力してください (HH:MM)');\n    if (!breakEnd || !/^\\d{2}:\\d{2}$/.test(breakEnd)) return;\n    \n    const reason = prompt('中断理由を入力してください');\n    if (!reason) return;\n\n    const breakRecord = {\n      中断記録ID: `break_${Date.now()}`,\n      中断開始日時: `${container.querySelector('#input-work-date').value}T${breakStart}`,\n      中断終了日時: `${container.querySelector('#input-work-date').value}T${breakEnd}`,\n      中断理由区分: '休憩',\n      中断理由詳細: reason,\n      対応状況: '解決済み'\n    };\n\n    breakRecords.push(breakRecord);\n    renderBreakRecords();\n    calculateHours();\n  }\n\n  // 中断記録の表示\n  function renderBreakRecords() {\n    const tbody = container.querySelector('#break-records-tbody');\n    const recordsDiv = container.querySelector('#break-records');\n    \n    if (breakRecords.length > 0) {\n      recordsDiv.style.display = 'block';\n      tbody.innerHTML = breakRecords.map((record, index) => {\n        const startTime = record.中断開始日時.split('T')[1];\n        const endTime = record.中断終了日時.split('T')[1];\n        const start = new Date(`2000-01-01T${startTime}`);\n        const end = new Date(`2000-01-01T${endTime}`);\n        const minutes = Math.floor((end - start) / (1000 * 60));\n        \n        return `\n          <tr>\n            <td style=\"padding: 6px 8px; font-size: 12px;\">${startTime}</td>\n            <td style=\"padding: 6px 8px; font-size: 12px;\">${endTime}</td>\n            <td style=\"padding: 6px 8px; font-size: 12px;\">${record.中断理由詳細}</td>\n            <td style=\"padding: 6px 8px; font-size: 12px;\">${minutes}分</td>\n            <td style=\"padding: 6px 8px;\">\n              <button class=\"action-btn secondary delete-break-btn\" data-index=\"${index}\" style=\"font-size: 11px; padding: 2px 6px;\">削除</button>\n            </td>\n          </tr>\n        `;\n      }).join('');\n    } else {\n      recordsDiv.style.display = 'none';\n    }\n  }\n\n  // フォームクリア\n  function clearForm() {\n    container.querySelector('#input-work-date').value = today;\n    container.querySelector('#select-project').value = '';\n    container.querySelector('#select-work-item').value = '';\n    container.querySelector('#select-work-location').value = '';\n    container.querySelector('#select-work-type').value = '';\n    container.querySelector('#input-start-time').value = '';\n    container.querySelector('#input-end-time').value = '';\n    container.querySelector('#input-break-time').value = '';\n    container.querySelector('#input-work-detail').value = '';\n    container.querySelector('#input-remarks').value = '';\n    breakRecords = [];\n    renderBreakRecords();\n    calculateHours();\n    updateCharCount();\n    showErrors([]);\n  }\n\n  // フォームデータ収集\n  function getFormData() {\n    return {\n      作業員ID: 'user_001', // 現在のユーザーID（実際は認証情報から取得）\n      作業日: container.querySelector('#input-work-date').value,\n      作業開始時刻: `${container.querySelector('#input-work-date').value}T${container.querySelector('#input-start-time').value}`,\n      作業終了時刻: `${container.querySelector('#input-work-date').value}T${container.querySelector('#input-end-time').value}`,\n      作業時間: calculateHours(),\n      プロジェクト名: container.querySelector('#select-project').value,\n      作業場所: container.querySelector('#select-work-location').value,\n      作業種別: container.querySelector('#select-work-type').value,\n      作業内容: container.querySelector('#input-work-detail').value,\n      進捗状況: '完了',\n      備考: container.querySelector('#input-remarks').value,\n      承認状態: '未承認',\n      作成者ID: 'user_001'\n    };\n  }\n\n  // イベントリスナー設定\n  container.querySelector('#input-start-time').addEventListener('change', calculateHours);\n  container.querySelector('#input-end-time').addEventListener('change', calculateHours);\n  container.querySelector('#input-break-time').addEventListener('input', calculateHours);\n  container.querySelector('#input-work-detail').addEventListener('input', updateCharCount);\n\n  // 中断記録追加\n  container.querySelector('#btn-add-break').addEventListener('click', addBreakRecord);\n\n  // 中断記録削除\n  container.addEventListener('click', (e) => {\n    const deleteBtn = e.target.closest('.delete-break-btn');\n    if (deleteBtn) {\n      const index = parseInt(deleteBtn.dataset.index);\n      breakRecords.splice(index, 1);\n      renderBreakRecords();\n      calculateHours();\n    }\n  });\n\n  // 一時保存\n  container.querySelector('#btn-temp-save').addEventListener('click', async () => {\n    const errors = validateForm();\n    if (errors.length > 0) {\n      showErrors(errors);\n      return;\n    }\n\n    tempSaveData = getFormData();\n    tempSaveData.承認状態 = '一時保存';\n    \n    const saved = await window.aivicApi.save(1, tempSaveData); // 作業記録テーブル\n    if (saved) {\n      alert('一時保存しました');\n      showErrors([]);\n    }\n  });\n\n  // 記録確定\n  container.querySelector('#btn-save').addEventListener('click', async () => {\n    const errors = validateForm();\n    if (errors.length > 0) {\n      showErrors(errors);\n      return;\n    }\n\n    if (!confirm('工数記録を確定しますか？')) return;\n\n    const formData = getFormData();\n    const saved = await window.aivicApi.save(1, formData); // 作業記録テーブル\n    \n    if (saved) {\n      // 中断記録も保存\n      for (const breakRecord of breakRecords) {\n        breakRecord.作業記録ID = saved.作業記録ID;\n        breakRecord.記録者ID = 'user_001';\n        await window.aivicApi.save(2, breakRecord); // 中断記録テーブル\n      }\n      \n      alert('工数記録を登録しました');\n      clearForm();\n    }\n  });\n\n  // キャンセル\n  container.querySelector('#btn-cancel').addEventListener('click', () => {\n    if (confirm('入力内容をクリアしますか？')) {\n      clearForm();\n    }\n  });\n\n  // 画面遷移\n  container.querySelector('#btn-history').addEventListener('click', () => {\n    window.showScreen('scr-1778907145716'); // 作業履歴一覧画面\n  });\n\n  container.querySelector('#btn-anomaly').addEventListener('click', () => {\n    window.showScreen('scr-1778907170814'); // 異常値検出ログ画面\n  });\n\n  // 初期化\n  loadWorkItems();\n  updateCharCount();\n}";

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
