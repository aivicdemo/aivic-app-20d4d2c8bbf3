    <style>
        :root {

            --top-bar-border: #cbd5e1;

            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: "⏱";
            font-size: 18px;
        }

        .nav-section {
            padding: 16px 0 8px 0;
        }

        .nav-section-title {

            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: block;
            padding: 8px 16px;
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: var(--bg-card);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: var(--primary-light);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 500;
        }

        .nav-item.nav-emergency {
            color: var(--danger);
            font-weight: 500;
        }

        .nav-item.nav-emergency:hover {
            background: #fef2f2;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .logout-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.15s ease;
        }

        .logout-link:hover {
            background: var(--border-light);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quick-action-btn {
            padding: 10px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quick-action-btn:hover {
            background: var(--primary-hover);
        }

        .quick-action-btn.secondary {
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .quick-action-btn.secondary:hover {
            background: var(--border-light);
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-height: 400px;
        }

        .nav-group {
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 4px;
            padding-bottom: 4px;
        }

        .nav-group:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
            
            .quick-actions {
                flex-wrap: wrap;
            }
        }

        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
            font-size: 12px;
        }
    </style>

ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  // 現在のユーザー情報（実際の実装では認証から取得）\n  const currentUser = { id: 'user-001', name: '田中太郎' };\n  \n  // 作業項目マスタの読み込み\n  async function loadWorkItems() {\n    const workItems = await window.aivicApi.list(3); // 作業項目マスタ\n    const workItemSelect = container.querySelector('#work-item');\n    workItemSelect.innerHTML = '<option value=\"\">選択してください</option>';\n    if (workItems) {\n      workItems.forEach(item => {\n        const option = document.createElement('option');\n        option.value = item.作業項目ID;\n        option.textContent = item.作業項目名;\n        workItemSelect.appendChild(option);\n      });\n    }\n  }\n\n  // 工数計算\n  function calculateHours() {\n    const startTime = container.querySelector('#start-time').value;\n    const endTime = container.querySelector('#end-time').value;\n    const breakTime = parseInt(container.querySelector('#break-time').value) || 0;\n    \n    if (!startTime || !endTime) {\n      container.querySelector('#total-hours').textContent = '0:00';\n      container.querySelector('#break-hours').textContent = '0:00';\n      container.querySelector('#net-hours').textContent = '0:00';\n      return { totalMinutes: 0, breakMinutes: 0, netMinutes: 0 };\n    }\n    \n    const start = new Date(`2000-01-01T${startTime}`);\n    const end = new Date(`2000-01-01T${endTime}`);\n    \n    // 終了時刻が開始時刻より前の場合は翌日とみなす\n    if (end < start) {\n      end.setDate(end.getDate() + 1);\n    }\n    \n    const totalMinutes = (end - start) / (1000 * 60);\n    const breakMinutes = breakTime;\n    const netMinutes = Math.max(0, totalMinutes - breakMinutes);\n    \n    container.querySelector('#total-hours').textContent = formatMinutes(totalMinutes);\n    container.querySelector('#break-hours').textContent = formatMinutes(breakMinutes);\n    container.querySelector('#net-hours').textContent = formatMinutes(netMinutes);\n    \n    return { totalMinutes, breakMinutes, netMinutes };\n  }\n  \n  function formatMinutes(minutes) {\n    const hours = Math.floor(minutes / 60);\n    const mins = Math.floor(minutes % 60);\n    return `${hours}:${mins.toString().padStart(2, '0')}`;\n  }\n  \n  // バリデーション\n  function validateForm() {\n    const errors = [];\n    const workDate = container.querySelector('#work-date').value;\n    const projectName = container.querySelector('#project-name').value;\n    const workItem = container.querySelector('#work-item').value;\n    const startTime = container.querySelector('#start-time').value;\n    const endTime = container.querySelector('#end-time').value;\n    const workLocation = container.querySelector('#work-location').value;\n    const workContent = container.querySelector('#work-content').value;\n    const breakTime = parseInt(container.querySelector('#break-time').value) || 0;\n    \n    // 必須項目チェック\n    if (!workDate) errors.push('作業日付は必須です');\n    if (!projectName) errors.push('プロジェクト名は必須です');\n    if (!workItem) errors.push('作業項目は必須です');\n    if (!startTime) errors.push('作業開始時刻は必須です');\n    if (!endTime) errors.push('作業終了時刻は必須です');\n    if (!workLocation) errors.push('作業場所は必須です');\n    if (!workContent.trim()) errors.push('作業内容詳細は必須です');\n    \n    // 未来日付チェック\n    if (workDate) {\n      const today = new Date().toISOString().split('T')[0];\n      if (workDate > today) {\n        errors.push('未来日付は選択できません');\n      }\n    }\n    \n    // 時刻チェック\n    if (startTime && endTime) {\n      const start = new Date(`2000-01-01T${startTime}`);\n      const end = new Date(`2000-01-01T${endTime}`);\n      \n      // 同日で終了時刻が開始時刻より前の場合はエラー\n      if (end <= start && !(endTime === '00:00' || endTime < startTime)) {\n        errors.push('開始時刻が終了時刻より後になっています');\n      }\n      \n      // 24時間以上の作業時間チェック\n      let totalMinutes = (end - start) / (1000 * 60);\n      if (end < start) {\n        totalMinutes = (24 * 60) - ((start - end) / (1000 * 60));\n      }\n      \n      if (totalMinutes >= 24 * 60) {\n        errors.push('24時間以上の作業時間は入力できません');\n      }\n      \n      // 中断時間が作業時間を超過するかチェック\n      if (breakTime > 0 && breakTime >= totalMinutes) {\n        errors.push('中断時間は作業時間を超過できません');\n      }\n    }\n    \n    // 文字数制限チェック\n    if (workContent.length > 1000) {\n      errors.push('作業内容詳細は1000文字以内で入力してください');\n    }\n    \n    return errors;\n  }\n  \n  function showErrors(errors) {\n    const errorDiv = container.querySelector('#error-messages');\n    const errorList = container.querySelector('#error-list');\n    \n    if (errors.length > 0) {\n      errorList.innerHTML = errors.map(error => `<li>${error}</li>`).join('');\n      errorDiv.style.display = 'block';\n    } else {\n      errorDiv.style.display = 'none';\n    }\n  }\n  \n  function showSuccess(message) {\n    const successDiv = container.querySelector('#success-message');\n    successDiv.textContent = message;\n    successDiv.style.display = 'block';\n    setTimeout(() => {\n      successDiv.style.display = 'none';\n    }, 3000);\n  }\n  \n  function clearForm() {\n    container.querySelector('#work-record-form').reset();\n    container.querySelector('#work-content').value = '';\n    container.querySelector('#char-count').textContent = '0';\n    calculateHours();\n    showErrors([]);\n  }\n  \n  async function saveRecord(isTemp = false) {\n    const errors = validateForm();\n    if (errors.length > 0) {\n      showErrors(errors);\n      return;\n    }\n    \n    const { totalMinutes, netMinutes } = calculateHours();\n    const workDate = container.querySelector('#work-date').value;\n    const startTime = container.querySelector('#start-time').value;\n    const endTime = container.querySelector('#end-time').value;\n    \n    const recordData = {\n      作業員ID: currentUser.id,\n      作業日: new Date(`${workDate}T${startTime}`).toISOString(),\n      作業開始時刻: new Date(`${workDate}T${startTime}`).toISOString(),\n      作業終了時刻: new Date(`${workDate}T${endTime}`).toISOString(),\n      作業時間: Math.floor(netMinutes),\n      プロジェクト名: container.querySelector('#project-name').value,\n      作業場所: container.querySelector('#work-location').value,\n      作業種別: container.querySelector('#work-item option:checked').textContent,\n      作業内容: container.querySelector('#work-content').value,\n      進捗状況: isTemp ? '一時保存' : '完了',\n      備考: '',\n      承認状態: '未承認',\n      作成者ID: currentUser.id\n    };\n    \n    const saved = await window.aivicApi.save(1, recordData); // 作業記録テーブル\n    if (saved) {\n      showSuccess(isTemp ? '一時保存しました' : '工数記録を登録しました');\n      if (!isTemp) {\n        clearForm();\n        // 作業履歴一覧画面に遷移\n        setTimeout(() => {\n          window.showScreen('scr-1778907145716');\n        }, 1500);\n      }\n    }\n  }\n  \n  // 初期設定\n  loadWorkItems();\n  \n  // 今日の日付を初期値に設定\n  const today = new Date().toISOString().split('T')[0];\n  container.querySelector('#work-date').value = today;\n  \n  // 文字数カウント\n  container.querySelector('#work-content').addEventListener('input', (e) => {\n    container.querySelector('#char-count').textContent = e.target.value.length;\n  });\n  \n  // 時刻変更時の自動計算\n  container.querySelector('#start-time').addEventListener('change', calculateHours);\n  container.querySelector('#end-time').addEventListener('change', calculateHours);\n  container.querySelector('#break-time').addEventListener('input', calculateHours);\n  \n  // 工数計算ボタン\n  container.querySelector('#btn-calc-hours').addEventListener('click', calculateHours);\n  \n  // 一時保存ボタン\n  container.querySelector('#btn-temp-save').addEventListener('click', () => {\n    saveRecord(true);\n  });\n  \n  // 記録確定ボタン\n  container.querySelector('#btn-save').addEventListener('click', () => {\n    if (confirm('工数記録を確定しますか？')) {\n      saveRecord(false);\n    }\n  });\n  \n  // キャンセルボタン\n  container.querySelector('#btn-cancel').addEventListener('click', () => {\n    if (confirm('入力内容をクリアしますか？')) {\n      clearForm();\n    }\n  });\n  \n  // 中断記録モーダル\n  const breakModal = container.querySelector('#break-modal');\n  \n  container.querySelector('#btn-add-         const screenTitles = {
            'scr-1778907133295': '工数記録',
            'scr-1778907145716': '作業履歴一覧',
            'scr-1778907170814': '異常値検出ログ',
            'scr-1778907187615': '工数記録開始',
            'scr-1778907199709': '工数記録終了',
            'scr-1778907212862': 'データ自動保存処理',
            'scr-1778907226171': '記録確認',

            'scr-1778907251446': '作業再開記録',
            'scr-1778907263518': '入力チェック機能',
            'scr-1778907278416': 'エラー表示',
            'scr-1778907287126': 'データ検証処理',
            'scr-1778907296658': '工数入力',
            'scr-1778907309324': '異常値検出処理',
            'scr-1778907319067': '修正入力',
            'scr-1778907330826': '緊急報告',

        window.addEventListener('aivic:screen-changed', function(e) {
            const titleElement = document.getElementById('current-screen-title');
            if (titleElement && screenTitles[e.detail.screenId]) {
                titleElement.textContent = screenTitles[e.detail.screenId];

        document.addEventListener('DOMContentLoaded', function() {
            if (typeof showScreen === 'function') {
                showScreen('scr-1778907133295');

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
