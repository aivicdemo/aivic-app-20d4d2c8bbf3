ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type":"text","required":false,"description":"管理者による対応内容や備考"},{"name":"検出日時","type":"timestamp","required":true,"description":"異常値が検出された日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  // 現在のユーザーID（実際の実装では認証から取得）\n  const currentUserId = 'user-001';\n  \n  // 作業項目マスタの読み込み\n  async function loadWorkItems() {\n    const workItems = await window.aivicApi.list(3); // 作業項目マスタ\n    const select = container.querySelector('#work-item');\n    select.innerHTML = '<option value=\"\">選択してください</option>';\n    \n    if (workItems) {\n      workItems\n        .filter(item => item.有効フラグ)\n        .sort((a, b) => (a.表示順序 || 0) - (b.表示順序 || 0))\n        .forEach(item => {\n          const option = document.createElement('option');\n          option.value = item.作業項目名;\n          option.textContent = `${item.作業項目コード} - ${item.作業項目名}`;\n          option.dataset.standardHours = item.標準工数時間 || 0;\n          select.appendChild(option);\n        });\n    }\n  }\n\n  // 工数時間の自動計算\n  function calculateWorkHours() {\n    const startTime = container.querySelector('#start-time').value;\n    const endTime = container.querySelector('#end-time').value;\n    const breakTime = parseInt(container.querySelector('#break-time').value) || 0;\n    const calculatedField = container.querySelector('#calculated-hours');\n\n    if (!startTime || !endTime) {\n      calculatedField.value = '';\n      return;\n    }\n\n    const start = new Date(`2000-01-01T${startTime}:00`);\n    let end = new Date(`2000-01-01T${endTime}:00`);\n    \n    // 終了時刻が開始時刻より前の場合は翌日とみなす\n    if (end <= start) {\n      end = new Date(`2000-01-02T${endTime}:00`);\n    }\n\n    const diffMs = end.getTime() - start.getTime();\n    const diffMinutes = Math.floor(diffMs / (1000 * 60));\n    const workMinutes = Math.max(0, diffMinutes - breakTime);\n    const workHours = (workMinutes / 60).toFixed(1);\n    \n    calculatedField.value = `${workHours}h`;\n  }\n\n  // バリデーション\n  function validateForm() {\n    const errors = [];\n    const workDate = container.querySelector('#work-date').value;\n    const projectName = container.querySelector('#project-name').value;\n    const workItem = container.querySelector('#work-item').value;\n    const workLocation = container.querySelector('#work-location').value;\n    const startTime = container.querySelector('#start-time').value;\n    const endTime = container.querySelector('#end-time').value;\n    const breakTime = parseInt(container.querySelector('#break-time').value) || 0;\n    const workContent = container.querySelector('#work-content').value.trim();\n\n    // 必須項目チェック\n    if (!workDate) errors.push('作業日付を選択してください');\n    if (!projectName) errors.push('プロジェクト名を選択してください');\n    if (!workItem) errors.push('作業項目を選択してください');\n    if (!workLocation) errors.push('作業場所を入力してください');\n    if (!startTime) errors.push('開始時刻を入力してください');\n    if (!endTime) errors.push('終了時刻を入力してください');\n    if (!workContent) errors.push('作業内容詳細を入力してください');\n\n    // 未来日付チェック\n    if (workDate) {\n      const today = new Date();\n      const selectedDate = new Date(workDate);\n      today.setHours(0, 0, 0, 0);\n      selectedDate.setHours(0, 0, 0, 0);\n      if (selectedDate > today) {\n        errors.push('未来日付は選択できません');\n      }\n    }\n\n    // 時刻チェック\n    if (startTime && endTime) {\n      const start = new Date(`2000-01-01T${startTime}:00`);\n      let end = new Date(`2000-01-01T${endTime}:00`);\n      \n      // 同日内での開始時刻 > 終了時刻チェック\n      if (end <= start && workDate) {\n        const workDateObj = new Date(workDate);\n        const today = new Date();\n        today.setHours(0, 0, 0, 0);\n        workDateObj.setHours(0, 0, 0, 0);\n        \n        // 当日の場合のみエラー（日付跨ぎは許可）\n        if (workDateObj.getTime() === today.getTime()) {\n          errors.push('開始時刻が終了時刻より後になっています');\n        }\n      }\n\n      // 24時間以上チェック\n      if (end <= start) {\n        end = new Date(`2000-01-02T${endTime}:00`);\n      }\n      const diffMs = end.getTime() - start.getTime();\n      const diffHours = diffMs / (1000 * 60 * 60);\n      if (diffHours >= 24) {\n        errors.push('24時間以上の作業時間は入力できません');\n      }\n\n      // 中断時間チェック\n      const workMinutes = Math.floor(diffMs / (1000 * 60));\n      if (breakTime >= workMinutes) {\n        errors.push('中断時間は作業時間を超過できません');\n      }\n    }\n\n    // 文字数チェック\n    if (workContent.length > 1000) {\n      errors.push('作業内容詳細は1000文字以内で入力してください');\n    }\n\n    return errors;\n  }\n\n  // エラー表示\n  function showErrors(errors) {\n    const errorContainer = container.querySelector('#error-messages');\n    const errorList = container.querySelector('#error-list');\n    \n    if (errors.length > 0) {\n      errorList.innerHTML = errors.map(error => `<li>${error}</li>`).join('');\n      errorContainer.style.display = 'block';\n    } else {\n      errorContainer.style.display = 'none';\n    }\n  }\n\n  // 成功メッセージ表示\n  function showSuccess() {\n    const successContainer = container.querySelector('#success-message');\n    successContainer.style.display = 'block';\n    setTimeout(() => {\n      successContainer.style.display = 'none';\n    }, 3000);\n  }\n\n  // フォームクリア\n  function clearForm() {\n    container.querySelector('#work-record-form').reset();\n    container.querySelector('#worker-name').value = '田中太郎';\n    container.querySelector('#calculated-hours').value = '';\n    container.querySelector('#content-counter').textContent = '0';\n    showErrors([]);\n  }\n\n  // 作業記録保存\n  async function saveWorkRecord(isDraft = false) {\n    const errors = validateForm();\n    if (errors.length > 0) {\n      showErrors(errors);\n      return false;\n    }\n\n    const workDate = container.querySelector('#work-date').value;\n    const startTime = container.querySelector('#start-time').value;\n    const endTime = container.querySelector('#end-time').value;\n    const breakTime = parseInt(container.querySelector('#break-time').value) || 0;\n\n    // 作業時間計算\n    const start = new Date(`${workDate}T${startTime}:00`);\n    let end = new Date(`${workDate}T${endTime}:00`);\n    if (end <= start) {\n      end = new Date(start.getTime() + 24 * 60 * 60 * 1000);\n      end.setHours(parseInt(endTime.split(':')[0]), parseInt(endTime.split(':')[1]), 0, 0);\n    }\n    const workMinutes = Math.floor((end.getTime() - start.getTime()) / (1000 * 60)) - breakTime;\n\n    const recordData = {\n      作業員ID: currentUserId,\n      作業日: new Date(workDate).toISOString(),\n      作業開始時刻: start.toISOString(),\n      作業終了時刻: end.toISOString(),\n      作業時間: workMinutes,\n      プロジェクト名: container.querySelector('#project-name').value,\n      作業場所: container.querySelector('#work-location').value,\n      作業種別: container.querySelector('#work-item').value,\n      作業内容: container.querySelector('#work-content').value.trim(),\n      進捗状況: isDraft ? '一時保存' : '完了',\n      備考: container.querySelector('#work-notes').value.trim(),\n      承認状態: '未承認',\n      作成日時: new Date().toISOString(),\n      更新日時: new Date().toISOString(),\n      作成者ID: currentUserId\n    };\n\n    const saved = await window.aivicApi.save(1, recordData); // 作業記録テーブル\n    if (saved) {\n      showSuccess();\n      if (!isDraft) {\n        clearForm();\n      }\n      return true;\n    }\n    return false;\n  }\n\n  // 初期化\n  loadWorkItems();\n  \n  // 今日の日付を初期値に設定\n  const today = new Date();\n  container.querySelector('#work-date').value = today.toISOString().split('T')[0];\n\n  // イベントリスナー\n  container.querySelector('#start-time').addEventListener('change', calculateWorkHours);\n  container.querySelector('#end-time').addEventListener('change', calculateWorkHours);\n  container.querySelector('#break-time').addEventListener('input', calculateWorkHours);\n\n  // 文字数カウンター\n  container.querySelector('#work-content').addEventListener('input', function() {\n    const counter = container.querySelector('#content-counter');\n    counter.textContent = this.value.length;\n  });\n\n  // フォーム送信\n  container.querySelector('#work-record-form').addEventListener('submit', async function(e) {\n    e.preventDefault();\n    await saveWorkRecord(false);\n  });\n\n  // 一時保存ボタン\n  container.querySelector('#btn-temp-save').addEventListener('click', async function() {\n    await saveWorkRecord(true);\n  });\n\n  // キャンセルボタン\n  container.querySelector('#btn-cancel').addEventListener('click', function() {\n    if (confirm('入力内容をクリアしますか？')) {\n      clearForm();\n    }\n  });\n\n  // 中断時間記録ボタン\n  container.querySelector('#btn-add-break').addEventListener('click', function() {\n    window.showScreen('scr-1778907238439'); // 中断記録入力画面\n  });\n\n  // ボタンホバー効果\n  container.querySelector('#btn-register').addEventListener('mouseenter', function() {\n    this.style.background = 'var(--primary-hover)';\n  });\n  container.querySelector('#btn-register').addEventListener('mouseleave', function() {\n    this.style.background = 'var(--primary)';\n  });\n\n  const secondaryButtons = container.querySelectorAll('.action-btn.secondary');\n  secondaryButtons.forEach(btn => {\n    btn.addEventListener('mouseenter', function() {\n      this.style.background = 'rgba(255,255,255,0.05)';\n    });\n    btn.addEventListener('mouseleave', function() {\n      this.style.background = 'transparent';\n    });\n  });\n\n  // フォーカス効果\n  const inputs = container.querySelectorAll('.input');\n  inputs.forEach(input => {\n    input.addEventListener('focus', function() {\n      this.style.outline = 'none';\n      this.style.borderColor = 'var(--primary)';\n      this.style.boxShadow = '0 0 0 2px rgba(255,255,255,0.08)';\n    });\n    input.addEventListener('blur', function() {\n      this.style.borderColor = 'rgba(255,255,255,0.18)';\n      this.style.boxShadow = 'none';\n    });\n  });\n}";
</script>

        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
