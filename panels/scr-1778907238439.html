ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let mediaRecorder = null;\n  let audioChunks = [];\n  let recordedAudioBlob = null;\n  let currentAudio = null;\n\n  // 作業項目マスタの読み込み\n  async function loadWorkItems() {\n    const workItems = await window.aivicApi.list(3); // 作業項目マスタ\n    const select = container.querySelector('#input-work-item');\n    if (workItems) {\n      workItems.forEach(item => {\n        const option = document.createElement('option');\n        option.value = item.作業項目ID || item.id;\n        option.textContent = `${item.作業項目コード || ''} ${item.作業項目名 || ''}`.trim();\n        select.appendChild(option);\n      });\n    }\n  }\n\n  // 中断時間の自動計算\n  function calculateDuration() {\n    const startTime = container.querySelector('#input-start-time').value;\n    const endTime = container.querySelector('#input-end-time').value;\n    const display = container.querySelector('#duration-display');\n    \n    if (startTime && endTime) {\n      const start = new Date(startTime);\n      const end = new Date(endTime);\n      const diffMs = end - start;\n      \n      if (diffMs > 0) {\n        const hours = Math.floor(diffMs / (1000 * 60 * 60));\n        const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));\n        display.textContent = `${hours}時間${minutes}分`;\n      } else {\n        display.textContent = '無効な時間範囲';\n      }\n    } else {\n      display.textContent = '自動計算されます';\n    }\n  }\n\n  // 文字数カウント\n  function updateCharCount() {\n    const textarea = container.querySelector('#input-details');\n    const counter = container.querySelector('#char-count');\n    counter.textContent = textarea.value.length;\n  }\n\n  // 影響範囲の全選択・全解除\n  function setupImpactSelection() {\n    const selectAll = container.querySelector('#select-all-impact');\n    const impactCheckboxes = container.querySelectorAll('input[name=\"impact\"]');\n    \n    selectAll.addEventListener('change', () => {\n      impactCheckboxes.forEach(cb => cb.checked = selectAll.checked);\n    });\n    \n    impactCheckboxes.forEach(cb => {\n      cb.addEventListener('change', () => {\n        const allChecked = Array.from(impactCheckboxes).every(c => c.checked);\n        const noneChecked = Array.from(impactCheckboxes).every(c => !c.checked);\n        selectAll.checked = allChecked;\n        selectAll.indeterminate = !allChecked && !noneChecked;\n      });\n    });\n  }\n\n  // 写真添付\n  function setupPhotoUpload() {\n    const fileInput = container.querySelector('#input-photo');\n    const photoBtn = container.querySelector('#btn-photo');\n    const preview = container.querySelector('#photo-preview');\n    const previewImg = container.querySelector('#preview-image');\n    const removeBtn = container.querySelector('#btn-remove-photo');\n    \n    photoBtn.addEventListener('click', () => fileInput.click());\n    \n    fileInput.addEventListener('change', (e) => {\n      const file = e.target.files[0];\n      if (!file) return;\n      \n      // ファイル形式チェック\n      if (!file.type.startsWith('image/')) {\n        showError('対応外のファイル形式です。画像ファイルを選択してください。');\n        return;\n      }\n      \n      // ファイルサイズチェック（10MB）\n      if (file.size > 10 * 1024 * 1024) {\n        showError('ファイルサイズが上限（10MB）を超えています。');\n        return;\n      }\n      \n      const reader = new FileReader();\n      reader.onload = (e) => {\n        previewImg.src = e.target.result;\n        preview.style.display = 'block';\n      };\n      reader.readAsDataURL(file);\n    });\n    \n    removeBtn.addEventListener('click', () => {\n      fileInput.value = '';\n      preview.style.display = 'none';\n      previewImg.src = '';\n    });\n  }\n\n  // 音声録音\n  function setupAudioRecording() {\n    const recordBtn = container.querySelector('#btn-record');\n    const stopBtn = container.querySelector('#btn-stop-record');\n    const playBtn = container.querySelector('#btn-play');\n    const status = container.querySelector('#recording-status');\n    \n    recordBtn.addEventListener('click', async () => {\n      try {\n        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });\n        mediaRecorder = new MediaRecorder(stream);\n        audioChunks = [];\n        \n        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);\n        mediaRecorder.onstop = () => {\n          recordedAudioBlob = new Blob(audioChunks, { type: 'audio/wav' });\n          playBtn.style.display = 'inline-block';\n          status.textContent = '録音完了';\n        };\n        \n        mediaRecorder.start();\n        recordBtn.style.display = 'none';\n        stopBtn.style.display = 'inline-block';\n        status.textContent = '録音中...';\n      } catch (error) {\n        showError('録音に失敗しました。マイクへのアクセスを許可してください。');\n      }\n    });\n    \n    stopBtn.addEventListener('click', () => {\n      if (mediaRecorder && mediaRecorder.state === 'recording') {\n        mediaRecorder.stop();\n        mediaRecorder.stream.getTracks().forEach(track => track.stop());\n        recordBtn.style.display = 'inline-block';\n        stopBtn.style.display = 'none';\n      }\n    });\n    \n    playBtn.addEventListener('click', () => {\n      if (recordedAudioBlob) {\n        if (currentAudio) currentAudio.pause();\n        currentAudio = new Audio(URL.createObjectURL(recordedAudioBlob));\n        currentAudio.play();\n      }\n    });\n  }\n\n  // エラー表示\n  function showError(message) {\n    const errorDiv = container.querySelector('#error-message');\n    errorDiv.textContent = message;\n    errorDiv.style.display = 'block';\n    setTimeout(() => errorDiv.style.display = 'none', 5000);\n  }\n\n  // 成功表示\n  function showSuccess(message) {\n    const successDiv = container.querySelector('#success-message');\n    successDiv.textContent = message;\n    successDiv.style.display = 'block';\n    setTimeout(() => successDiv.style.display = 'none', 3000);\n  }\n\n  // バリデーション\n  function validateForm() {\n    const startTime = container.querySelector('#input-start-time').value;\n    const reason = container.querySelector('#input-reason').value;\n    const details = container.querySelector('#input-details').value;\n    \n    if (!startTime) {\n      showError('中断開始時刻は必須です。');\n      return false;\n    }\n    \n    if (!reason) {\n      showError('中断理由は必須です。');\n      return false;\n    }\n    \n    // 未来時刻チェック\n    const now = new Date();\n    const start = new Date(startTime);\n    if (start > now) {\n      showError('未来の時刻は入力できません。');\n      return false;\n    }\n    \n    // 文字数チェック\n    if (details.length > 1000) {\n      showError('中断詳細は1000文字以内で入力してください。');\n      return false;\n    }\n    \n    return true;\n  }\n\n  // フォームデータ収集\n  function collectFormData() {\n    const startTime = container.querySelector('#input-start-time').value;\n    const endTime = container.querySelector('#input-end-time').value;\n    const reason = container.querySelector('#input-reason').value;\n    const location = container.querySelector('#input-location').value;\n    const workItem = container.querySelector('#input-work-item').value;\n    const details = container.querySelector('#input-details').value;\n    const urgency = container.querySelector('input[name=\"urgency\"]:checked')?.value || '中';\n    const impacts = Array.from(container.querySelectorAll('input[name=\"impact\"]:checked')).map(cb => cb.value);\n    \n    // 中断時間計算\n    let duration = null;\n    if (startTime && endTime) {\n      const start = new Date(startTime);\n      const end = new Date(endTime);\n      const diffMs = end - start;\n      if (diffMs > 0) {\n        duration = Math.floor(diffMs / (1000 * 60)); // 分単位\n      }\n    }\n    \n    return {\n      作業記録ID: workItem || null,\n      中断開始日時: startTime ? new Date(startTime).toISOString() : null,\n      中断終了日時: endTime ? new Date(endTime).toISOString() : null,\n      中断理由区分: reason,\n      中断理由詳細: details,\n      中断時間: duration,\n      影響度: urgency,\n      対応状況: '対応中',\n      記録者ID: 'current-user-id', // 実際の実装では認証情報から取得\n      作成日時: new Date().toISOString(),\n      更新日時: new Date().toISOString()\n    };\n  }\n\n  // 一時保存\n  async function tempSave() {\n    const formData = collectFormData();\n    localStorage.setItem('temp_interruption_record', JSON.stringify(formData));\n    showSuccess('一時保存しました。');\n  }\n\n  // 一時保存データの復元\n  function restoreTempData() {\n    const tempData = localStorage.getItem('temp_interruption_record');\n    if (tempData) {\n      try {\n        const data = JSON.parse(tempData);\n        if (data.中断開始日時) {\n          container.querySelector('#input-start-time').value = new Date(data.中断開始日時).toISOString().slice(0, 16);\n        }\n        if (data.中断終了日時) {\n          container.querySelector('#input-end-time').value = new Date(data.中断終了日時).toISOString().slice(0, 16);\n        }\n        if (data.中断理由区分) {\n          container.querySelector('#input-reason').value = data.中断理由区分;\n        }\n        if (data.中断理由詳細) {\n          container.querySelector('#input-details').value = data.中断理由詳細;\n        }\n        if (data.影響度) {\n          const urgencyRadio = container.querySelector(`input[name=\"urgency\"][value=\"${data.影響度}\"]`);\n          if (urgencyRadio) urgencyRadio.checked = true;\n        }\n        calculateDuration();\n        updateCharCount();\n      } catch (error) {\n        console.error('一時保存データの復元に失敗:', error);\n      }\n    }\n  }\n\n  // 記録完了\n  async function completeRecord() {\n    if (!validateForm()) return;\n    \n    try {\n      const formData = collectFormData();\n      const saved = await window.aivicApi.save(2, formData); // 中断記録テーブル\n      \n      if (saved) {\n        localStorage.removeItem('temp_interruption_record');\n        showSuccess('中断記録を保存しました。');\n        setTimeout(() => {\n          window.showScreen(\"scr-1778907251446\"); // 作業再開記録画面\n        }, 1500);\n      } else {\n        showError('ネットワークに接続できません。後でもう一度お試しください。');\n      }\n    } catch (error) {\n      showError('記録の保存に失敗しました。');\n    }\n  }\n\n  // イベントリスナー設定\n  container.querySelector('#input-start-time').addEventListener('change', calculateDuration);\n  container.querySelector('#input-end-time').addEventListener('change', calculateDuration);\n  container.querySelector('#input-details').addEventListener('input', updateCharCount);\n  container.querySelector('#btn-temp-save').addEventListener('click', tempSave);\n  container.querySelector('#btn-complete').addEventListener('click', completeRecord);\n\n  // 初期化\n  loadWorkItems();\n  setupImpactSelection();\n  setupPhotoUpload();\n  setupAudioRecording();\n  restoreTempData();\n  \n  // 現在時刻を中断開始時刻にセット\n  const now = new Date();\n  now.setSeconds(0, 0); // 秒とミリ秒を0にセット\n  container.querySelector('#input-start-time').value = now.toISOString().slice(0, 16);\n  calculateDuration();\n}";
</script>

    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
