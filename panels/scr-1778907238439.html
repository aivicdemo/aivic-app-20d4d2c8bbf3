<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --primary: #0ea5e9;
            --primary-hover: #0284c7;
            --primary-light: #e0f2fe;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-sidebar: #f1f5f9;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --text: #1e293b;
            --text-muted: #475569;
            --text-light: #64748b;
            --top-bar-bg: #ffffff;
            --top-bar-border: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: "⏱";
            font-size: 18px;
        }

        .nav-section {
            padding: 16px 0 8px 0;
        }

        .nav-section-title {
            padding: 0 16px 8px 16px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: block;
            padding: 8px 16px;
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: var(--bg-card);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: var(--primary-light);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 500;
        }

        .nav-item.nav-emergency {
            color: var(--danger);
            font-weight: 500;
        }

        .nav-item.nav-emergency:hover {
            background: #fef2f2;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .logout-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.15s ease;
        }

        .logout-link:hover {
            background: var(--border-light);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quick-action-btn {
            padding: 10px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quick-action-btn:hover {
            background: var(--primary-hover);
        }

        .quick-action-btn.secondary {
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .quick-action-btn.secondary:hover {
            background: var(--border-light);
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-height: 400px;
        }

        .nav-group {
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 4px;
            padding-bottom: 4px;
        }

        .nav-group:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
            
            .quick-actions {
                flex-wrap: wrap;
            }
        }

        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
            font-size: 12px;
        }
    </style>

ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let mediaRecorder = null;\n  let audioChunks = [];\n  let isRecording = false;\n  let selectedPhoto = null;\n  let recordedAudio = null;\n\n  // 現在時刻を中断開始時刻にセット\n  const now = new Date();\n  const startTimeInput = container.querySelector('#start-time');\n  startTimeInput.value = now.toISOString().slice(0, 16);\n\n  // 作業項目マスタの読み込み\n  async function loadWorkItems() {\n    const workItemSelect = container.querySelector('#work-item');\n    try {\n      const workItems = await window.aivicApi.list(3); // 作業項目マスタ\n      if (workItems) {\n        workItems.forEach(item => {\n          const option = document.createElement('option');\n          option.value = item.作業項目ID;\n          option.textContent = `${item.作業項目コード} - ${item.作業項目名}`;\n          workItemSelect.appendChild(option);\n        });\n      }\n    } catch (error) {\n      console.error('作業項目の読み込みに失敗しました:', error);\n    }\n  }\n\n  // 中断時間の自動計算\n  function updateDuration() {\n    const startTime = container.querySelector('#start-time').value;\n    const endTime = container.querySelector('#end-time').value;\n    const durationDisplay = container.querySelector('#duration-display');\n\n    if (startTime && endTime) {\n      const start = new Date(startTime);\n      const end = new Date(endTime);\n      const diffMs = end - start;\n\n      if (diffMs > 0) {\n        const hours = Math.floor(diffMs / (1000 * 60 * 60));\n        const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));\n        durationDisplay.textContent = `${hours}時間${minutes}分`;\n      } else {\n        durationDisplay.textContent = '終了時刻が開始時刻より前です';\n      }\n    } else {\n      durationDisplay.textContent = '自動計算されます';\n    }\n  }\n\n  // 文字数カウント\n  function updateCharCount() {\n    const details = container.querySelector('#details');\n    const charCount = container.querySelector('#char-count');\n    charCount.textContent = `(${details.value.length}/1000)`;\n  }\n\n  // 影響範囲の全選択・全解除\n  function handleSelectAllImpact() {\n    const selectAll = container.querySelector('#select-all-impact');\n    const impactCheckboxes = container.querySelectorAll('input[name=\"impact\"]');\n\n    selectAll.addEventListener('change', () => {\n      impactCheckboxes.forEach(cb => {\n        cb.checked = selectAll.checked;\n      });\n    });\n\n    impactCheckboxes.forEach(cb => {\n      cb.addEventListener('change', () => {\n        const allChecked = Array.from(impactCheckboxes).every(checkbox => checkbox.checked);\n        const noneChecked = Array.from(impactCheckboxes).every(checkbox => !checkbox.checked);\n        selectAll.checked = allChecked;\n        selectAll.indeterminate = !allChecked && !noneChecked;\n      });\n    });\n  }\n\n  // 写真アップロード処理\n  function handlePhotoUpload() {\n    const photoBtn = container.querySelector('#photo-btn');\n    const photoUpload = container.querySelector('#photo-upload');\n    const photoPreview = container.querySelector('#photo-preview');\n    const previewImg = container.querySelector('#preview-img');\n    const removePhoto = container.querySelector('#remove-photo');\n\n    photoBtn.addEventListener('click', () => {\n      photoUpload.click();\n    });\n\n    photoUpload.addEventListener('change', (e) => {\n      const file = e.target.files[0];\n      if (file) {\n        // ファイルサイズチェック (10MB)\n        if (file.size > 10 * 1024 * 1024) {\n          showError('ファイルサイズが10MBを超えています');\n          return;\n        }\n\n        // ファイル形式チェック\n        if (!file.type.startsWith('image/')) {\n          showError('画像ファイルのみアップロード可能です');\n          return;\n        }\n\n        selectedPhoto = file;\n        const reader = new FileReader();\n        reader.onload = (e) => {\n          previewImg.src = e.target.result;\n          photoPreview.style.display = 'block';\n        };\n        reader.readAsDataURL(file);\n      }\n    });\n\n    removePhoto.addEventListener('click', () => {\n      selectedPhoto = null;\n      photoPreview.style.display = 'none';\n      photoUpload.value = '';\n    });\n  }\n\n  // 音声録音処理\n  function handleVoiceRecording() {\n    const voiceBtn = container.querySelector('#voice-btn');\n    const voicePreview = container.querySelector('#voice-preview');\n    const previewAudio = container.querySelector('#preview-audio');\n    const removeVoice = container.querySelector('#remove-voice');\n\n    voiceBtn.addEventListener('click', async () => {\n      if (!isRecording) {\n        try {\n          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });\n          mediaRecorder = new MediaRecorder(stream);\n          audioChunks = [];\n\n          mediaRecorder.ondataavailable = (event) => {\n            audioChunks.push(event.data);\n          };\n\n          mediaRecorder.onstop = () => {\n            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });\n            recordedAudio = audioBlob;\n            const audioUrl = URL.createObjectURL(audioBlob);\n            previewAudio.src = audioUrl;\n            voicePreview.style.display = 'block';\n            stream.getTracks().forEach(track => track.stop());\n          };\n\n          mediaRecorder.start();\n          isRecording = true;\n          voiceBtn.textContent = '🛑 録音停止';\n        } catch (error) {\n          showError('マイクへのアクセスが拒否されました');\n        }\n      } else {\n        mediaRecorder.stop();\n        isRecording = false;\n        voiceBtn.textContent = '🎤 録音開始';\n      }\n    });\n\n    removeVoice.addEventListener('click', () => {\n      recordedAudio = null;\n      voicePreview.style.display = 'none';\n      if (previewAudio.src) {\n        URL.revokeObjectURL(previewAudio.src);\n      }\n    });\n  }\n\n  // エラー表示\n  function showError(message) {\n    const errorDiv = container.querySelector('#error-message');\n    errorDiv.textContent = message;\n    errorDiv.style.display = 'block';\n    setTimeout(() => {\n      errorDiv.style.display = 'none';\n    }, 5000);\n  }\n\n  // バリデーション\n  function validateForm() {\n    const startTime = container.querySelector('#start-time').value;\n    const reason = container.querySelector('#reason').value;\n    const endTime = container.querySelector('#end-time').value;\n    const details = container.querySelector('#details').value;\n\n    if (!startTime) {\n      showError('中断開始時刻は必須です');\n      return false;\n    }\n\n    if (!reason) {\n      showError('中断理由は必須です');\n      return false;\n    }\n\n    // 未来時刻チェック\n    const now = new Date();\n    const startDateTime = new Date(startTime);\n    if (startDateTime > now) {\n      showError('未来の時刻は入力できません');\n      return false;\n    }\n\n    if (endTime) {\n      const endDateTime = new Date(endTime);\n      if (endDateTime > now) {\n        showError('未来の時刻は入力できません');\n        return false;\n      }\n      if (endDateTime <= startDateTime) {\n        showError('終了時刻は開始時刻より後に設定してください');\n        return false;\n      }\n    }\n\n    // 文字数チェック\n    if (details.length > 1000) {\n      showError('中断詳細は1000文字以内で入力してください');\n      return false;\n    }\n\n    return true;\n  }\n\n  // フォームデータ収集\n  function collectFormData() {\n    const startTime = container.querySelector('#start-time').value;\n    const endTime = container.querySelector('#end-time').value;\n    const reason = container.querySelector('#reason').value;\n    const location = container.querySelector('#location').value;\n    const details = container.querySelector('#details').value;\n    const workItem = container.querySelector('#work-item').value;\n    const urgency = container.querySelector('input[name=\"urgency\"]:checked')?.value || '';\n    \n    const impactCheckboxes = container.querySelectorAll('input[name=\"impact\"]:checked');\n    const impact = Array.from(impactCheckboxes).map(cb => cb.value).join(', ');\n\n    // 中断時間計算\n    let duration = null;\n    if (startTime && endTime) {\n      const start = new Date(startTime);\n      const end = new Date(endTime);\n      duration = Math.floor((end - start) / (1000 * 60)); // 分単位\n    }\n\n    return {\n      中断記録ID: crypto.randomUUID(),\n      作業記録ID: workItem || null,\n      中断開始日時: startTime,\n      中断終了日時: endTime || null,\n      中断理由区分: reason,\n      中断理由詳細: details,\n      中断時間: duration,\n      影響度: urgency,\n      対応状況: '対応中',\n      記録者ID: 'current-user-id', // 実際の実装では認証情報から取得\n      作成日時: new Date().toISOString(),\n      更新日時: new Date().toISOString()\n    };\n  }\n\n  // 一時保存\n  async function tempSave() {\n    const formData = collectFormData();\n    localStorage.setItem('interruption_temp_data', JSON.stringify(formData));\n    \n    // 成功メッセージ表示\n    const errorDiv = container.querySelector('#error-message');\n    errorDiv.textContent = '一時保存しました';\n    errorDiv.style.background = 'rgba(34, 197, 94, 0.1)';\n    errorDiv.style.borderColor = 'rgba(34, 197, 94, 0.3)';\n    errorDiv.style.color = '#86efac';\n    errorDiv.style.display = 'block';\n    setTimeout(() => {\n      errorDiv.style.display = 'none';\n      errorDiv.style.background = 'rgba(220, 38, 38, 0.1)';\n      errorDiv.style.borderColor = 'rgba(220, 38, 38, 0.3)';\n      errorDiv.style.color = '#fca5a5';\n    }, 3000);\n  }\n\n  // 記録完了\n  async function completeRecord() {\n    if (!validateForm()) return;\n\n    const formData = collectFormData();\n    \n    try {\n      const saved = await window.aivicApi.save(2, formData); // 中断記録テーブル\n      if (saved) {\n        // 一時保存データを削除\n        localStorage.removeItem('interruption_temp_data');\n        \n        // 作業再開記録画面に遷移\n        window.showScreen(\"scr-1778907251446\");\n      } else {\n        showError('記録の保存に失敗しました');\n      }\n    } catch (error) {\n      showError('ネットワークエラーが発生しました');\n    }\n  }\n\n  // 一時保存データの復元\n  function restoreTempData() {\n    const tempData = localStorage.getItem('interruption_temp_data');\n    if (tempData) {\n      try {\n        const data = JSON.parse(tempData);\n        if (data.中断開始日時) container.querySelector('#start-t     <script>
        const screenTitles = {
            'scr-1778907133295': '工数記録',
            'scr-1778907145716': '作業履歴一覧',
            'scr-1778907170814': '異常値検出ログ',
            'scr-1778907187615': '工数記録開始',
            'scr-1778907199709': '工数記録終了',
            'scr-1778907212862': 'データ自動保存処理',
            'scr-1778907226171': '記録確認',

            'scr-1778907251446': '作業再開記録',
            'scr-1778907263518': '入力チェック機能',
            'scr-1778907278416': 'エラー表示',
            'scr-1778907287126': 'データ検証処理',
            'scr-1778907296658': '工数入力',
            'scr-1778907309324': '異常値検出処理',
            'scr-1778907319067': '修正入力',
            'scr-1778907330826': '緊急報告',
            'scr-1778907343735': '工数修正',
            'scr-1778907353387': '工数記録データ抽出',
            'scr-1778907367889': '工数記録確認',
            'scr-1778907380182': '工数記録入力'
        };

        window.addEventListener('aivic:screen-changed', function(e) {
            const titleElement = document.getElementById('current-screen-title');
            if (titleElement && screenTitles[e.detail.screenId]) {
                titleElement.textContent = screenTitles[e.detail.screenId];
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            if (typeof showScreen === 'function') {
                showScreen('scr-1778907133295');

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
