window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックのインポート\n  const { recordInterruption, validateRequiredFields, calculateInterruptionTime, saveWorkData, getGPSLocation, detectAnomalousValue } = window.workRecordCalc || {};\n  \n  // 利用可能な業務ロジックモジュールから必要な関数をインポート\n  const { \n    recordWorkInterruption, \n    validateWorkRecord, \n    calculateWorkDuration, \n    saveToLocalStorage, \n    syncPendingRecords,\n    detectAnomalousValues,\n    saveWorkRecord,\n    verifyDataIntegrity\n  } = window.workLogicModules || {};\n\n  let mediaRecorder = null;\n  let audioChunks = [];\n  let isRecording = false;\n  let selectedFile = null;\n  let audioBlob = null;\n\n  // DOM要素の取得\n  const form = container.querySelector('#interruption-form');\n  const startTimeInput = container.querySelector('[data-testid=\"start-time\"]');\n  const endTimeInput = container.querySelector('[data-testid=\"end-time\"]');\n  const reasonSelect = container.querySelector('[data-testid=\"interruption-reason\"]');\n  const locationInput = container.querySelector('[data-testid=\"interruption-location\"]');\n  const detailsTextarea = container.querySelector('[data-testid=\"interruption-details\"]');\n  const durationDiv = container.querySelector('#interruption-duration');\n  const charCountSpan = container.querySelector('#char-count');\n  const photoUpload = container.querySelector('[data-testid=\"photo-upload\"]');\n  const photoBtn = container.querySelector('[data-testid=\"photo-btn\"]');\n  const photoPreview = container.querySelector('#photo-preview');\n  const recordBtn = container.querySelector('[data-testid=\"record-btn\"]');\n  const recordingStatus = container.querySelector('#recording-status');\n  const audioPlayback = container.querySelector('#audio-playback');\n  const selectAllCheckbox = container.querySelector('#select-all');\n  const impactCheckboxes = container.querySelectorAll('input[name=\"impact\"]');\n  const tempSaveBtn = container.querySelector('[data-testid=\"save-button\"]');\n  const completeBtn = container.querySelector('[data-testid=\"complete-btn\"]');\n  const errorMessage = container.querySelector('#error-message');\n  const successMessage = container.querySelector('.success-message');\n  const urgencyHighCheckbox = container.querySelector('[data-testid=\"urgency-high\"]');\n  const impactTeamCheckbox = container.querySelector('[data-testid=\"impact-team\"]');\n\n  // 初期化\n  if (startTimeInput) {\n    const now = new Date();\n    startTimeInput.value = now.toTimeString().slice(0, 5);\n  }\n\n  // 中断理由の選択肢を設定\n  if (reasonSelect) {\n    const reasons = ['機械故障', '材料不足', '天候', '休憩', '点検', 'その他'];\n    reasonSelect.innerHTML = '<option value=\"\">選択してください</option>';\n    reasons.forEach(reason => {\n      const option = document.createElement('option');\n      option.value = reason;\n      option.textContent = reason;\n      reasonSelect.appendChild(option);\n    });\n  }\n\n  // デフォルトの時間計算関数\n  function calculateDefaultDuration(startTime, endTime) {\n    const start = new Date(`2000-01-01 ${startTime}`);\n    const end = new Date(`2000-01-01 ${endTime}`);\n    const diffMs = end - start;\n    return Math.round(diffMs / (1000 * 60));\n  }\n\n  // 時間入力の変更イベント\n  function updateDuration() {\n    if (startTimeInput && endTimeInput && startTimeInput.value && endTimeInput.value) {\n      try {\n        const duration = calculateInterruptionTime ? \n          calculateInterruptionTime(startTimeInput.value, endTimeInput.value) :\n          calculateDefaultDuration(startTimeInput.value, endTimeInput.value);\n        \n        if (durationDiv) {\n          durationDiv.textContent = `中断時間: ${duration}分`;\n        }\n\n        // 異常値検知\n        if (detectAnomalousValues && duration > 480) { // 8時間以上\n          if (errorMessage) {\n            errorMessage.textContent = '中断時間が異常に長い可能性があります';\n            errorMessage.style.display = 'block';\n          }\n        }\n      } catch (error) {\n        console.error('Duration calculation error:', error);\n      }\n    }\n  }\n\n  // 文字数カウント更新\n  function updateCharCount() {\n    if (detailsTextarea && charCountSpan) {\n      const count = detailsTextarea.value.length;\n      charCountSpan.textContent = count;\n      if (count > 500) {\n        charCountSpan.style.color = 'red';\n      } else {\n        charCountSpan.style.color = '';\n      }\n    }\n  }\n\n  // フォームデータ収集\n  function collectFormData() {\n    const formData = {\n      startTime: startTimeInput?.value || '',\n      endTime: endTimeInput?.value || '',\n      reason: reasonSelect?.value || '',\n      location: locationInput?.value || '',\n      details: detailsTextarea?.value || '',\n      urgencyHigh: urgencyHighCheckbox?.checked || false,\n      impactTeam: impactTeamCheckbox?.checked || false,\n      impacts: Array.from(impactCheckboxes).filter(cb => cb.checked).map(cb => cb.value),\n      photo: selectedFile,\n      audio: audioBlob,\n      timestamp: new Date().toISOString()\n    };\n    return formData;\n  }\n\n  // 記録保存処理\n  async function saveInterruptionRecord(isComplete = false) {\n    try {\n      const formData = collectFormData();\n      \n      // 必須フィールド検証\n      const requiredFields = ['reason'];\n      if (validateRequiredFields) {\n        const validation = validateRequiredFields(formData, requiredFields);\n        if (!validation.isValid) {\n          if (errorMessage) {\n            errorMessage.textContent = validation.message || '必須項目を入力してください';\n            errorMessage.style.display = 'block';\n          }\n          return false;\n        }\n      } else if (!formData.reason) {\n        if (errorMessage) {\n          errorMessage.textContent = '中断理由を選択してください';\n          errorMessage.style.display = 'block';\n        }\n        return false;\n      }\n\n      // 業務ロジックで中断記録を処理\n      let result;\n      if (recordWorkInterruption) {\n        result = await recordWorkInterruption(formData);\n      } else if (recordInterruption) {\n        result = await recordInterruption(formData);\n      } else {\n        // フォールバック処理\n        result = { success: true, data: formData };\n      }\n\n      if (result && result.success) {\n        // ローカルストレージに保存\n        if (saveToLocalStorage) {\n          await saveToLocalStorage('interruption_records', formData);\n        }\n\n        // クラウドに同期\n        if (window.aivicApi && window.aivicApi.save) {\n          try {\n            await window.aivicApi.save('interruption_records', formData);\n          } catch (apiError) {\n            console.warn('API save failed, data saved locally:', apiError);\n          }\n        }\n\n        // 成功メッセージ表示\n        if (errorMessage) {\n          errorMessage.textContent = '記録が完了しました';\n          errorMessage.style.display = 'block';\n          errorMessage.style.color = 'green';\n        }\n\n        // フォームリセット\n        if (isComplete && form) {\n          form.reset();\n          selectedFile = null;\n          audioBlob = null;\n          if (photoPreview) photoPreview.style.display = 'none';\n          if (audioPlayback) audioPlayback.style.display = 'none';\n          if (durationDiv) durationDiv.textContent = '';\n        }\n\n        return true;\n      } else {\n        throw new Error(result?.message || '記録の保存に失敗しました');\n      }\n    } catch (error) {\n      console.error('Save interruption record error:', error);\n      if (window.aivicNotify && window.aivicNotify.error) {\n        window.aivicNotify.error('記録の保存に失敗しました: ' + error.message);\n      }\n      if (errorMessage) {\n        errorMessage.textContent = '記録の保存に失敗しました: ' + error.message;\n        errorMessage.style.display = 'block';\n        errorMessage.style.color = 'red';\n      }\n      return false;\n    }\n  }\n\n  // 音声録音処理\n  async function toggleRecording() {\n    if (!isRecording) {\n      try {\n        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });\n        mediaRecorder = new MediaRecorder(stream);\n        audioChunks = [];\n\n        mediaRecorder.ondataavailable = (event) => {\n          audioChunks.push(event.data);\n        };\n\n        mediaRecorder.onstop = () => {\n          audioBlob = new Blob(audioChunks, { type: 'audio/wav' });\n          if (audioPlayback) {\n            const audioUrl = URL.createObjectURL(audioBlob);\n            audioPlayback.innerHTML = `<audio controls><source src=\"${audioUrl}\" type=\"audio/wav\"></audio>`;\n            audioPlayback.style.display = 'block';\n          }\n          if (recordingStatus) {\n            recordingStatus.style.display = 'none';\n          }\n        };\n\n        mediaRecorder.start();\n        isRecording = true;\n        \n        if (recordBtn) {\n          recordBtn.textContent = '🎤 録音停止';\n        }\n        if (recordingStatus) {\n          recordingStatus.textContent = '録音中...';\n          recordingStatus.style.display = 'block';\n        }\n      } catch (error) {\n        console.error('Recording start error:', error);\n        if (window.aivicNotify && window.aivicNotify.error) {\n          window.aivicNotify.error('録音の開始に失敗しました');\n        }\n      }\n    } else {\n      if (mediaRecorder && mediaRecorder.state === 'recording') {\n        mediaRecorder.stop();\n        mediaRecorder.stream.getTracks().forEach(track => track.stop());\n      }\n      isRecording = false;\n      if (recordBtn) {\n        recordBtn.textContent = '🎤 録音開始';\n      }\n    }\n  }\n\n  // イベントリスナー設定\n  if (startTimeInput) {\n    startTimeInput.addEventListener('change', updateDuration);\n  }\n\n  if (endTimeInput) {\n    endTimeInput.addEventListener('change', updateDuration);\n  }\n\n  if (detailsTextarea) {\n    detailsTextarea.addEventListener('input', updateCharCount);\n  }\n\n  if (photoBtn) {\n    photoBtn.addEventListener('click', () => {\n      if (photoUpload) {\n        photoUpload.click();\n      }\n    });\n  }\n\n  if (photoUpload) {\n    photoUpload.addEventListener('change', (event) => {\n      const file = event.target.files[0];\n      if (file) {\n        selectedFile = file;\n        const reader = new FileReader();\n        reader.onload = (e) => {\n          if (photoPreview) {\n            photoPreview.innerHTML = `<img src=\"${e.target.result}\" style=\"max-width: 200px; max-height: 200px;\">`;\n            photoPreview.style.display = 'block';\n          }\n        };\n        reader.readAsDataURL(file);\n      }\n    });\n  }\n\n  if (recordBtn) {\n    recordBtn.addEventListener('click', async (event) => {\n      event.preventDefault();\n      \n      // 録音ボタンが録音機能として使われる場合\n      if (recordBtn.textContent.includes('録音')) {\n        await toggleRecording();\n      } else {\n        // 記録ボタンとして使われる場合\n        await saveInterruptionRecord(false);\n      }\n    });\n  }\n\n  if (tempSaveBtn) {\n    tempSaveBtn.addEventListener('click', async (event) => {\n      event.preventDefault();\n      await saveInterruptionRecord(false);\n    });\n  }\n\n  if (completeBtn) {\n    completeBtn.addEventListener('click', async (event) => {\n      event.preventDefault();\n      await saveInterruptionRecord(true);\n    });\n  }\n\n  if (selectAllCheckbox) {\n    selectAllCheckbox.addEventListener('change', () => {\n      impactCheckboxes.forEach(checkbox => {\n        checkbox.checked = selectAllCheckbox.checked;\n      });\n    });\n  }\n\n  // エラーメッセージの初期非表示\n  if (errorMessage) {\n    errorMessage.style.display = 'none';\n  }\n\n  // 初期文字数カウント\n  updateCharCount();\n}";
</script>

  <style>

    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
