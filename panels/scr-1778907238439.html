    <style>
        :root {
            --primary: #4a9eff;
            --primary-hover: #3a8eef;
            --bg-main: #0f0f0f;
            --bg-card: #1a1a1a;
            --bg-sidebar: #141414;
            --border: #2a2a2a;
            --text: #e8e8e8;
            --text-muted: #9a9a9a;
            --top-bar-bg: #161616;
            --top-bar-border: #252525;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            height: 52px;
        }

        .logo {
            width: 24px;
            height: 24px;
            background: var(--primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: white;
        }

        .app-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-section {
            padding: 16px 12px 8px;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            padding: 0 8px;
        }

        .nav-item {

            padding: 8px 12px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 400;
            margin-bottom: 2px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        .nav-item.aivic-active {
            background: var(--primary);
            color: white;
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .breadcrumb-current {
            color: var(--text);
            font-weight: 500;
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .logout-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: color 0.15s ease;
        }

        .logout-link:hover {
            color: var(--text);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quick-action-btn {
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .quick-action-btn:hover {
            border-color: var(--primary);
            background: rgba(74, 158, 255, 0.1);
        }

        .quick-action-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .quick-action-btn.primary:hover {
            background: var(--primary-hover);
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-height: 400px;
            padding: 0;
        }

        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .nav-emergency {
            margin-top: auto;
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        .emergency-btn {
            width: 100%;
            padding: 10px 12px;
            background: var(--error);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        .emergency-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
            
            .quick-actions {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let mediaRecorder = null;\n  let audioChunks = [];\n  let recordedBlob = null;\n  let isRecording = false;\n  \n  // DOM要素の取得\n  const startTimeInput = container.querySelector('#start-time');\n  const endTimeInput = container.querySelector('#end-time');\n  const reasonSelect = container.querySelector('#reason');\n  const locationInput = container.querySelector('#location');\n  const detailsTextarea = container.querySelector('#details');\n  const charCount = container.querySelector('#char-count');\n  const durationDiv = container.querySelector('#duration');\n  const photoUpload = container.querySelector('#photo-upload');\n  const photoBtn = container.querySelector('#photo-btn');\n  const photoPreview = container.querySelector('#photo-preview');\n  const recordBtn = container.querySelector('#record-btn');\n  const playBtn = container.querySelector('#play-btn');\n  const recordStatus = container.querySelector('#record-status');\n  const errorMessage = container.querySelector('#error-message');\n  const tempSaveBtn = container.querySelector('#temp-save-btn');\n  const completeBtn = container.querySelector('#complete-btn');\n  const selectAllImpact = container.querySelector('#select-all-impact');\n  const impactCheckboxes = container.querySelectorAll('input[name=\"impact\"]');\n  \n  // 現在時刻を中断開始時刻にセット\n  const now = new Date();\n  startTimeInput.value = now.toISOString().slice(0, 16);\n  \n  // 関連作業項目の表示（現在進行中の作業があれば表示）\n  const workItemDiv = container.querySelector('#work-item');\n  if (tables[1] && tables[1].records) {\n    const activeWork = tables[1].records.find(r => r.進捗状況 === '作業中');\n    if (activeWork) {\n      workItemDiv.textContent = `${activeWork.プロジェクト名} - ${activeWork.作業種別}`;\n      workItemDiv.style.color = 'var(--text)';\n    }\n  }\n  \n  // エラー表示関数\n  function showError(message) {\n    errorMessage.textContent = message;\n    errorMessage.style.display = 'block';\n    setTimeout(() => {\n      errorMessage.style.display = 'none';\n    }, 5000);\n  }\n  \n  // 中断時間の自動計算\n  function updateDuration() {\n    const start = startTimeInput.value;\n    const end = endTimeInput.value;\n    \n    if (start && end) {\n      const startTime = new Date(start);\n      const endTime = new Date(end);\n      \n      if (endTime > startTime) {\n        const diffMs = endTime - startTime;\n        const diffMinutes = Math.floor(diffMs / (1000 * 60));\n        const hours = Math.floor(diffMinutes / 60);\n        const minutes = diffMinutes % 60;\n        durationDiv.textContent = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;\n      } else {\n        durationDiv.textContent = '--:--';\n      }\n    } else {\n      durationDiv.textContent = '--:--';\n    }\n  }\n  \n  // 文字数カウント\n  detailsTextarea.addEventListener('input', () => {\n    charCount.textContent = detailsTextarea.value.length;\n  });\n  \n  // 時刻変更時の中断時間更新\n  startTimeInput.addEventListener('change', updateDuration);\n  endTimeInput.addEventListener('change', updateDuration);\n  \n  // 写真添付\n  photoBtn.addEventListener('click', () => {\n    photoUpload.click();\n  });\n  \n  photoUpload.addEventListener('change', (e) => {\n    const file = e.target.files[0];\n    if (file) {\n      // ファイルサイズチェック（10MB）\n      if (file.size > 10 * 1024 * 1024) {\n        showError('ファイルサイズが上限（10MB）を超えています');\n        photoUpload.value = '';\n        return;\n      }\n      \n      // ファイル形式チェック\n      if (!file.type.startsWith('image/')) {\n        showError('対応していないファイル形式です。画像ファイルを選択してください');\n        photoUpload.value = '';\n        return;\n      }\n      \n      photoPreview.textContent = `📷 ${file.name} (${(file.size / 1024).toFixed(1)}KB)`;\n      photoBtn.textContent = '📷 写真を変更';\n    }\n  });\n  \n  // 音声録音\n  recordBtn.addEventListener('click', async () => {\n    if (!isRecording) {\n      try {\n        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });\n        mediaRecorder = new MediaRecorder(stream);\n        audioChunks = [];\n        \n        mediaRecorder.ondataavailable = (event) => {\n          audioChunks.push(event.data);\n        };\n        \n        mediaRecorder.onstop = () => {\n          recordedBlob = new Blob(audioChunks, { type: 'audio/wav' });\n          playBtn.disabled = false;\n          playBtn.style.background = 'rgba(0,0,0,0.25)';\n          playBtn.style.color = 'var(--text)';\n          playBtn.style.cursor = 'pointer';\n          recordStatus.textContent = `🎤 録音完了 (${(recordedBlob.size / 1024).toFixed(1)}KB)`;\n          \n          // ストリームを停止\n          stream.getTracks().forEach(track => track.stop());\n        };\n        \n        mediaRecorder.start();\n        isRecording = true;\n        recordBtn.textContent = '⏹️ 録音停止';\n        recordStatus.textContent = '🔴 録音中...';\n        \n      } catch (error) {\n        showError('マイクへのアクセスが拒否されました。ブラウザの設定を確認してください');\n      }\n    } else {\n      mediaRecorder.stop();\n      isRecording = false;\n      recordBtn.textContent = '🎤 録音開始';\n    }\n  });\n  \n  // 音声再生\n  playBtn.addEventListener('click', () => {\n    if (recordedBlob) {\n      const audio = new Audio(URL.createObjectURL(recordedBlob));\n      audio.play();\n    }\n  });\n  \n  // 影響範囲の全選択・全解除\n  selectAllImpact.addEventListener('change', () => {\n    impactCheckboxes.forEach(checkbox => {\n      checkbox.checked = selectAllImpact.checked;\n    });\n  });\n  \n  // 個別選択時の全選択チェックボックス更新\n  impactCheckboxes.forEach(checkbox => {\n    checkbox.addEventListener('change', () => {\n      const allChecked = Array.from(impactCheckboxes).every(cb => cb.checked);\n      const noneChecked = Array.from(impactCheckboxes).every(cb => !cb.checked);\n      \n      if (allChecked) {\n        selectAllImpact.checked = true;\n        selectAllImpact.indeterminate = false;\n      } else if (noneChecked) {\n        selectAllImpact.checked = false;\n        selectAllImpact.indeterminate = false;\n      } else {\n        selectAllImpact.checked = false;\n        selectAllImpact.indeterminate = true;\n      }\n    });\n  });\n  \n  // バリデーション関数\n  function validateForm() {\n    const startTime = startTimeInput.value;\n    const reason = reasonSelect.value;\n    const details = detailsTextarea.value;\n    \n    if (!startTime) {\n      showError('中断開始時刻は必須です');\n      return false;\n    }\n    \n    if (!reason) {\n      showError('中断理由は必須です');\n      return false;\n    }\n    \n    // 未来時刻チェック\n    const startDate = new Date(startTime);\n    const now = new Date();\n    if (startDate > now) {\n      showError('未来の時刻は入力できません');\n      return false;\n    }\n    \n    // 文字数チェック\n    if (details.length > 1000) {\n      showError('中断詳細は1000文字以内で入力してください');\n      return false;\n    }\n    \n    // 終了時刻が開始時刻より前でないかチェック\n    const endTime = endTimeInput.value;\n    if (endTime) {\n      const endDate = new Date(endTime);\n      if (endDate <= startDate) {\n        showError('中断終了時刻は開始時刻より後の時刻を入力してください');\n        return false;\n      }\n    }\n    \n    return true;\n  }\n  \n  // フォームデータ収集\n  function collectFormData() {\n    const urgencyRadio = container.querySelector('input[name=\"urgency\"]:checked');\n    const impactValues = Array.from(container.querySelectorAll('input[name=\"impact\"]:checked'))\n      .map(cb => cb.value);\n    \n    const startTime = startTimeInput.value;\n    const endTime = endTimeInput.value || null;\n    let duration = null;\n    \n    if (startTime && endTime) {\n      const diffMs = new Date(endTime) - new Date(startTime);\n      duration = Math.floor(diffMs / (1000 * 60)); // 分単位\n    }\n    \n    // 関連する作業記録IDを取得\n    let workRecordId = null;\n    if (tables[1] && tables[1].records) {\n      const activeWork = tables[1].records.find(r => r.進捗状況 === '作業中');\n      if (activeWork) {\n        workRecordId = activeWork.作業記録ID;\n      }\n    }\n    \n    return {\n      中断記録ID: crypto.randomUUID(),\n      作業記録ID: workRecordId,\n      中断開始日時: startTime,\n      中断終了日時: endTime,\n      中断理由区分: reasonSelect.value,\n      中断理由詳細: detailsTextarea.value || null,\n      中断時間: duration,\n      影響度: urgencyRadio ? urgencyRadio.value : '中',\n      対応状況: '対応中',\n      記録者ID: 'current-user-id', // 実際の実装では現在のユーザーIDを使用\n      作成日時: new Date().toISOString(),\n      更新日時: new Date().toISOString()\n    };\n  }\n  \n  // 一時保存\n  tempSaveBtn.addEventListener('click', async () => {\n    if (!validateForm()) return;\n    \n    const formData = collectFormData();\n    \n    try {\n      // ローカルストレージに保存\n      localStorage.setItem('interruption_temp_data', JSON.stringify(formData));\n      \n      // 成功メッセージ表示\n      const successDiv = document.createElement('div');\n      successDiv.style.cssText = 'padding: 8px 12px; margin-bottom: 12px; border-radius: 6px; background: rgba(34, 197, 94, 0.1); border-left: 3px solid #22c55e; color: #86efac; font-size: 13px;';\n      successDiv.textContent = '一時保存しました';\n      errorMessage.parentNode.insertBefore(successDiv, errorMessage);\n      \n      setTimeout(() => {\n        successDiv.remove();\n      }, 3000);\n      \n    } catch (error) {\n      showError('一時保存に失敗しました');\n    }\n  });\n  \n  // 記録完了\n  completeBtn.addEventListener('click', async () => {\n    if (!validateForm()) return;\n    \n    const formData = collectFormData();\n    \n    try {\n      const saved = await window.aivicApi.save(2, formData); // 中断記録テーブル\n      \n      if (saved) {\n        // 一時保存データを削除\n        localStorage.removeItem('interruption_temp_data');\n        \n        // 作業再開記録画面に遷移\n        window.showScreen(\"scr-1778907251446\");\n      } else {\n        showError('ネットワークに接続できません。しばらく経ってから再度お試しください');\n      }\n    } catch (error) {\n      showError('記録の保存に失敗しました');\n    }\n  });\n  \n  // 一時保存データの復元\n  const tempData = localStorage.getItem('interruption_temp_data');\n  if (tempData) {\n    try {\n      const data = JSON.parse(tempData);\n      \n      if (data.中断開始日時) startTimeInput.value = data.中断開始日時.slice(0, 16);\n      if (data.中断終了日時) endTimeInput.value = data.中断終了日時.slice(0, 16);\n      if (data.中断理由区分) reasonSelect.value = data.中断理由区分;\n      if (data.中断理由詳細) detailsTextarea.value = data.中断理由詳細;\n      if (data.影響度) {\n        const urgencyRadio = container.querySelector(`input[name=\"urgency\"][value=\"${data.影響度}\"]`);\n        if (urgencyRadio) urgencyRadio.checked = true;\n      }\n      \n      // 文字数更新\n      charCount.textContent = detailsTextarea.value.length;\n      \n      // 中断時間更新\n      updateDuration();\n      \n    } catch (error) {\n      console.error('一時保存データの復元に失敗しました:', error);\n    }\n  }\n}";

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();
