window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let mediaRecorder = null;\n  let audioChunks = [];\n  let isRecording = false;\n  let currentAudioBlob = null;\n\n  // DOM要素の取得\n  const startTimeInput = container.querySelector('#start-time');\n  const endTimeInput = container.querySelector('#end-time');\n  const reasonSelect = container.querySelector('#reason');\n  const locationInput = container.querySelector('#location');\n  const detailsTextarea = container.querySelector('#details');\n  const charCount = container.querySelector('#char-count');\n  const durationDisplay = container.querySelector('#duration-display');\n  const photoInput = container.querySelector('#photo-input');\n  const photoBtn = container.querySelector('#photo-btn');\n  const photoName = container.querySelector('#photo-name');\n  const photoPreview = container.querySelector('#photo-preview');\n  const recordBtn = container.querySelector('#record-btn');\n  const recordStatus = container.querySelector('#record-status');\n  const audioPreview = container.querySelector('#audio-preview');\n  const selectAllImpact = container.querySelector('#select-all-impact');\n  const impactCheckboxes = container.querySelectorAll('input[name=\"impact\"]');\n  const relatedWork = container.querySelector('#related-work');\n  const errorMessage = container.querySelector('#error-message');\n  const tempSaveBtn = container.querySelector('#btn-temp-save');\n  const completeBtn = container.querySelector('#btn-complete');\n\n  // 現在時刻を初期値として設定\n  const now = new Date();\n  now.setSeconds(0, 0);\n  startTimeInput.value = now.toISOString().slice(0, 16);\n\n  // 文字数カウント\n  detailsTextarea.addEventListener('input', () => {\n    const count = detailsTextarea.value.length;\n    charCount.textContent = `${count}/1000`;\n    if (count > 1000) {\n      charCount.style.color = '#fca5a5';\n    } else {\n      charCount.style.color = 'var(--text-muted)';\n    }\n  });\n\n  // 中断時間の自動計算\n  function updateDuration() {\n    const start = startTimeInput.value;\n    const end = endTimeInput.value;\n    \n    if (start && end) {\n      const startDate = new Date(start);\n      const endDate = new Date(end);\n      const diffMs = endDate - startDate;\n      \n      if (diffMs > 0) {\n        const hours = Math.floor(diffMs / (1000 * 60 * 60));\n        const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));\n        durationDisplay.textContent = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;\n      } else {\n        durationDisplay.textContent = '--:--';\n      }\n    } else {\n      durationDisplay.textContent = '--:--';\n    }\n  }\n\n  startTimeInput.addEventListener('change', updateDuration);\n  endTimeInput.addEventListener('change', updateDuration);\n\n  // 写真添付\n  photoBtn.addEventListener('click', () => {\n    photoInput.click();\n  });\n\n  photoInput.addEventListener('change', (e) => {\n    const file = e.target.files[0];\n    if (!file) return;\n\n    // ファイルサイズチェック (10MB)\n    if (file.size > 10 * 1024 * 1024) {\n      showError('ファイルサイズは10MB以下にしてください');\n      return;\n    }\n\n    // ファイル形式チェック\n    if (!file.type.startsWith('image/')) {\n      showError('画像ファイルのみ添付可能です');\n      return;\n    }\n\n    photoName.textContent = file.name;\n    \n    // プレビュー表示\n    const reader = new FileReader();\n    reader.onload = (e) => {\n      photoPreview.innerHTML = `<img src=\"${e.target.result}\" style=\"max-width: 200px; max-height: 150px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.18);\">`;\n    };\n    reader.readAsDataURL(file);\n  });\n\n  // 音声録音\n  recordBtn.addEventListener('click', async () => {\n    if (!isRecording) {\n      try {\n        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });\n        mediaRecorder = new MediaRecorder(stream);\n        audioChunks = [];\n\n        mediaRecorder.ondataavailable = (event) => {\n          audioChunks.push(event.data);\n        };\n\n        mediaRecorder.onstop = () => {\n          currentAudioBlob = new Blob(audioChunks, { type: 'audio/wav' });\n          const audioUrl = URL.createObjectURL(currentAudioBlob);\n          audioPreview.src = audioUrl;\n          audioPreview.style.display = 'block';\n          stream.getTracks().forEach(track => track.stop());\n        };\n\n        mediaRecorder.start();\n        isRecording = true;\n        recordBtn.textContent = '⏹️ 録音停止';\n        recordStatus.textContent = '録音中...';\n      } catch (error) {\n        showError('マイクへのアクセスが拒否されました。録音機能を使用するには、マイクの使用を許可してください。');\n      }\n    } else {\n      mediaRecorder.stop();\n      isRecording = false;\n      recordBtn.textContent = '🎤 録音開始';\n      recordStatus.textContent = '録音完了';\n    }\n  });\n\n  // 影響範囲の全選択・全解除\n  selectAllImpact.addEventListener('change', () => {\n    impactCheckboxes.forEach(checkbox => {\n      checkbox.checked = selectAllImpact.checked;\n    });\n  });\n\n  // 個別選択時の全選択チェックボックス連動\n  impactCheckboxes.forEach(checkbox => {\n    checkbox.addEventListener('change', () => {\n      const allChecked = Array.from(impactCheckboxes).every(cb => cb.checked);\n      const noneChecked = Array.from(impactCheckboxes).every(cb => !cb.checked);\n      \n      if (allChecked) {\n        selectAllImpact.checked = true;\n        selectAllImpact.indeterminate = false;\n      } else if (noneChecked) {\n        selectAllImpact.checked = false;\n        selectAllImpact.indeterminate = false;\n      } else {\n        selectAllImpact.checked = false;\n        selectAllImpact.indeterminate = true;\n      }\n    });\n  });\n\n  // 関連作業項目の表示（現在進行中の作業を取得）\n  async function loadRelatedWork() {\n    try {\n      const workRecords = await window.aivicApi.list(1); // 作業記録テーブル\n      if (workRecords) {\n        const activeWork = workRecords.find(record => record.進捗状況 === '作業中');\n        if (activeWork) {\n          relatedWork.textContent = `${activeWork.プロジェクト名} - ${activeWork.作業種別}`;\n        }\n      }\n    } catch (error) {\n      console.error('関連作業項目の取得に失敗:', error);\n    }\n  }\n\n  loadRelatedWork();\n\n  // エラーメッセージ表示\n  function showError(message) {\n    errorMessage.textContent = message;\n    errorMessage.style.display = 'block';\n    setTimeout(() => {\n      errorMessage.style.display = 'none';\n    }, 5000);\n  }\n\n  // バリデーション\n  function validateForm() {\n    const errors = [];\n\n    // 必須項目チェック\n    if (!startTimeInput.value) {\n      errors.push('中断開始時刻は必須です');\n    }\n    if (!reasonSelect.value) {\n      errors.push('中断理由は必須です');\n    }\n\n    // 未来時刻チェック\n    if (startTimeInput.value) {\n      const startDate = new Date(startTimeInput.value);\n      const now = new Date();\n      if (startDate > now) {\n        errors.push('中断開始時刻に未来の時刻は入力できません');\n      }\n    }\n\n    if (endTimeInput.value) {\n      const endDate = new Date(endTimeInput.value);\n      const now = new Date();\n      if (endDate > now) {\n        errors.push('中断終了時刻に未来の時刻は入力できません');\n      }\n    }\n\n    // 時刻の前後関係チェック\n    if (startTimeInput.value && endTimeInput.value) {\n      const startDate = new Date(startTimeInput.value);\n      const endDate = new Date(endTimeInput.value);\n      if (endDate <= startDate) {\n        errors.push('中断終了時刻は開始時刻より後の時刻を入力してください');\n      }\n    }\n\n    // 文字数チェック\n    if (detailsTextarea.value.length > 1000) {\n      errors.push('中断詳細は1000文字以内で入力してください');\n    }\n\n    return errors;\n  }\n\n  // フォームデータ収集\n  function collectFormData() {\n    const urgencyRadio = container.querySelector('input[name=\"urgency\"]:checked');\n    const impactValues = Array.from(container.querySelectorAll('input[name=\"impact\"]:checked')).map(cb => cb.value);\n    \n    // 中断時間計算（分単位）\n    let interruptionTime = null;\n    if (startTimeInput.value && endTimeInput.value) {\n      const startDate = new Date(startTimeInput.value);\n      const endDate = new Date(endTimeInput.value);\n      const diffMs = endDate - startDate;\n      if (diffMs > 0) {\n        interruptionTime = Math.floor(diffMs / (1000 * 60));\n      }\n    }\n\n    return {\n      中断開始日時: startTimeInput.value ? new Date(startTimeInput.value).toISOString() : null,\n      中断終了日時: endTimeInput.value ? new Date(endTimeInput.value).toISOString() : null,\n      中断理由区分: reasonSelect.value,\n      中断理由詳細: detailsTextarea.value,\n      中断時間: interruptionTime,\n      影響度: urgencyRadio ? urgencyRadio.value : null,\n      対応状況: '対応中',\n      作業記録ID: 'temp-work-id', // 実際の実装では関連する作業記録IDを設定\n      記録者ID: 'current-user-id', // 実際の実装では現在のユーザーIDを設定\n      作成日時: new Date().toISOString(),\n      更新日時: new Date().toISOString()\n    };\n  }\n\n  // 一時保存\n  tempSaveBtn.addEventListener('click', async () => {\n    try {\n      const formData = collectFormData();\n      \n      // ローカルストレージに保存\n      localStorage.setItem('interruptionDraft', JSON.stringify({\n        ...formData,\n        影響範囲: Array.from(container.querySelectorAll('input[name=\"impact\"]:checked')).map(cb => cb.value),\n        中断場所: locationInput.value,\n        写真ファイル名: photoName.textContent,\n        音声メモ有無: currentAudioBlob ? true : false\n      }));\n\n      // 成功メッセージ\n      const successMsg = container.querySelector('#error-message');\n      successMsg.style.background = 'rgba(34, 197, 94, 0.1)';\n      successMsg.style.borderColor = 'rgba(34, 197, 94, 0.3)';\n      successMsg.style.color = '#86efac';\n      successMsg.textContent = '一時保存しました';\n      successMsg.style.display = 'block';\n      \n      setTimeout(() => {\n        successMsg.style.display = 'none';\n        successMsg.style.background = 'rgba(220, 38, 38, 0.1)';\n        successMsg.style.borderColor = 'rgba(220, 38, 38, 0.3)';\n        successMsg.style.color = '#fca5a5';\n      }, 3000);\n\n    } catch (error) {\n      showError('一時保存に失敗しました');\n    }\n  });\n\n  // 記録完了\n  completeBtn.addEventListener('click', async () => {\n    const errors = validateForm();\n    if (errors.length > 0) {\n      showError(errors.join('\\n'));\n      return;\n    }\n\n    try {\n      const formData = collectFormData();\n      const saved = await window.aivicApi.save(2, formData); // 中断記録テーブル\n\n      if (saved) {\n        // 一時保存データを削除\n        localStorage.removeItem('interruptionDraft');\n        \n        // 作業再開記録画面に遷移\n        window.showScreen(\"scr-1778907251446\");\n      } else {\n        showError('記録の保存に失敗しました');\n      }\n    } catch (error) {\n      if (navigator.onLine === false) {\n        showError('ネットワークに接続できません。接続を確認してから再度お試しください。');\n      } else {\n        showError('記録の保存中にエラーが発生しました');\n      }\n    }\n  });\n\n  // 一時保存データの復元\n  function restoreDraft() {\n    const draft = localStorage.getItem('interruptionDraft');\n    if (draft) {\n      try {\n        const data = JSON.parse(draft);\n        \n        if (data.中断開始日時) {\n          startTimeInput.value = new Date(data.中断開始日時).toISOString().slice(0, 16);\n        }\n        if (data.中断終了日時) {\n          endTimeInput.value = new Date(data.中断終了日時).toISOString().slice(0, 16);\n        }\n        if (data.中断理由区分) {\n          reasonSelect.value = data.中断理由区分;\n        }\n        if (data.中断理由詳細) {\n          detailsTextarea.value = data.中断理由詳細;\n          detailsTextarea.dispatchEvent(new Event('input'));\n        }\n        if (data.中断場所) {\n          locationInput.value = data.中断場所;\n        }\n        if (data.影響度) {\n          const urgencyRadio = container.querySelector(`input[name=\"urgency\"][value=\"${data.影響度}\"]`);\n          if (urgencyRadio) urgencyRadio.checked = true;\n        }\n        if (data.影響範囲 && Array.isArray(data.影響範囲)) {\n          data.影響範囲.forEach(value => {\n            const checkbox = container.querySelector(`input[name=\"impact\"][value=\"${value}\"]`);\n            if (checkbox) checkbox.checked = true;\n          });\n          // 全選択チェックボックスの状態更新\n          impactCheckboxes[0].dispatchEvent(new Event('change'));\n        }\n        \n        updateDuration();\n      } catch (error) {\n        console.error('一時保存データの復元に失敗:', error);\n      }\n    }\n  }\n\n  // 初期化時に一時保存データを復元\n  restoreDraft();\n}";

      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
