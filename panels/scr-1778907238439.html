ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックのインポート\n  const { calculateInterruptionDuration, isLongInterruption, analyzeInterruptionFrequency, detectBottleneckFactors } = require(\"../src/logic/interruption-calc\");\n  const { validateRequiredFields, validateTimeSequence, validateWorkDuration, checkDuplicateWork } = require(\"../src/logic/validation-check\");\n  const { detectWorkTimeAnomalies, validateDataIntegrity, createAnomalyLog } = require(\"../src/logic/anomaly-detection\");\n  const { calculateWorkDuration, isWorkTimeValid, validateWorkRecordData } = require(\"../src/logic/work-record-calc\");\n  \n  let mediaRecorder = null;\n  let audioChunks = [];\n  let currentWorkRecord = null;\n  \n  // DOM要素の取得\n  const startTimeInput = container.querySelector('[data-testid=\"interrupt-start-time\"]') || container.querySelector('#start-time');\n  const endTimeInput = container.querySelector('[data-testid=\"interrupt-end-time\"]') || container.querySelector('#end-time');\n  const reasonSelect = container.querySelector('[data-testid=\"interrupt-reason\"]') || container.querySelector('#reason');\n  const locationInput = container.querySelector('[data-testid=\"interrupt-location\"]') || container.querySelector('#location');\n  const detailsTextarea = container.querySelector('[data-testid=\"interrupt-details\"]') || container.querySelector('#details');\n  const workItemDiv = container.querySelector('[data-testid=\"work-item\"]') || container.querySelector('#work-item');\n  const workItemSelect = container.querySelector('[data-testid=\"work-item\"]');\n  const workContentInput = container.querySelector('[data-testid=\"work-content\"]');\n  const reasonTextInput = container.querySelector('[data-testid=\"interrupt-reason-text\"]');\n  const urgencySelect = container.querySelector('[data-testid=\"urgency-level\"]');\n  const durationDiv = container.querySelector('#duration');\n  const photoUpload = container.querySelector('[data-testid=\"photo-upload\"]') || container.querySelector('#photo-upload');\n  const photoBtn = container.querySelector('#photo-btn');\n  const photoPreview = container.querySelector('#photo-preview');\n  const uploadedPhoto = container.querySelector('[data-testid=\"uploaded-photo\"]');\n  const recordBtn = container.querySelector('[data-testid=\"record-button\"]') || container.querySelector('#record-btn');\n  const saveBtn = container.querySelector('[data-testid=\"save-button\"]');\n  const completeBtn = container.querySelector('[data-testid=\"record-complete-button\"]') || container.querySelector('#complete-btn');\n  const voiceRecordBtn = container.querySelector('[data-testid=\"voice-record-button\"]');\n  const voiceStopBtn = container.querySelector('[data-testid=\"voice-stop-button\"]') || container.querySelector('#stop-btn');\n  const voicePlayer = container.querySelector('[data-testid=\"voice-player\"]');\n  const audioPreview = container.querySelector('#audio-preview');\n  const errorMessage = container.querySelector('#error-message');\n  const successMessage = container.querySelector('[data-testid=\"success-message\"]');\n  const completionMessage = container.querySelector('[data-testid=\"completion-message\"]');\n  const recordList = container.querySelector('[data-testid=\"record-list\"]');\n  const tempSaveBtn = container.querySelector('#temp-save-btn');\n  const charCount = container.querySelector('#char-count');\n  const selectAllImpact = container.querySelector('#select-all-impact');\n  \n  // 現在時刻を中断開始時刻にセット\n  const now = new Date();\n  if (startTimeInput) {\n    if (startTimeInput.type === 'datetime-local') {\n      startTimeInput.value = now.toISOString().slice(0, 16);\n    } else {\n      startTimeInput.value = now.toTimeString().slice(0, 5);\n    }\n  }\n  \n  // 関連作業項目を取得・表示\n  async function loadCurrentWorkRecord() {\n    try {\n      const workRecords = await window.aivicApi.list(1); // 作業記録テーブル\n      if (workRecords && workRecords.length > 0) {\n        const activeRecord = workRecords.find(r => r.進捗状況 === '作業中');\n        if (activeRecord) {\n          currentWorkRecord = activeRecord;\n          if (workItemDiv) {\n            workItemDiv.textContent = `${activeRecord.プロジェクト名} - ${activeRecord.作業種別}`;\n          }\n          // セレクトボックスがある場合は選択肢を設定\n          if (workItemSelect) {\n            const option = document.createElement('option');\n            option.value = 'assembly-line-1';\n            option.textContent = activeRecord.プロジェクト名;\n            workItemSelect.appendChild(option);\n          }\n        } else {\n          if (workItemDiv) {\n            workItemDiv.textContent = '進行中の作業がありません';\n          }\n        }\n      }\n    } catch (error) {\n      if (workItemDiv) {\n        workItemDiv.textContent = '作業項目の取得に失敗しました';\n      }\n    }\n  }\n  \n  // 中断時間の自動計算\n  function updateDuration() {\n    const start = startTimeInput?.value;\n    const end = endTimeInput?.value;\n    \n    if (start && end && durationDiv) {\n      try {\n        let startDate, endDate;\n        \n        if (startTimeInput.type === 'time') {\n          const today = new Date().toISOString().slice(0, 10);\n          startDate = new Date(`${today}T${start}:00`);\n          endDate = new Date(`${today}T${end}:00`);\n        } else {\n          startDate = new Date(start);\n          endDate = new Date(end);\n        }\n        \n        if (endDate > startDate) {\n          const duration = calculateInterruptionDuration(startDate, endDate);\n          const hours = Math.floor(duration / 60);\n          const minutes = duration % 60;\n          durationDiv.textContent = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;\n        } else {\n          durationDiv.textContent = '--:--';\n        }\n      } catch (error) {\n        durationDiv.textContent = '--:--';\n      }\n    }\n  }\n  \n  // 文字数カウント\n  function updateCharCount() {\n    if (detailsTextarea && charCount) {\n      const count = detailsTextarea.value.length;\n      charCount.textContent = count;\n      if (count > 1000) {\n        charCount.style.color = '#fca5a5';\n      } else {\n        charCount.style.color = 'var(--text-muted)';\n      }\n    }\n  }\n  \n  // エラー表示\n  function showError(message) {\n    if (errorMessage) {\n      errorMessage.textContent = message;\n      errorMessage.style.display = 'block';\n    }\n    window.aivicNotify.error(message);\n  }\n  \n  // 成功メッセージ表示\n  function showSuccess(message) {\n    if (successMessage) {\n      successMessage.textContent = message;\n      successMessage.style.display = 'block';\n    }\n    if (completionMessage) {\n      completionMessage.textContent = message;\n      completionMessage.style.display = 'block';\n    }\n    window.aivicNotify.success(message);\n  }\n  \n  // フォームデータの取得と検証\n  function getFormData() {\n    const data = {\n      開始時刻: startTimeInput?.value || '',\n      終了時刻: endTimeInput?.value || '',\n      中断理由: reasonSelect?.value || reasonTextInput?.value || '',\n      場所: locationInput?.value || '',\n      詳細: detailsTextarea?.value || '',\n      作業項目: workItemSelect?.value || workContentInput?.value || '',\n      緊急度: urgencySelect?.value || 'normal',\n      記録日時: new Date().toISOString()\n    };\n    \n    return data;\n  }\n  \n  // データ検証\n  function validateFormData(data) {\n    const requiredFields = ['開始時刻', '中断理由'];\n    const validation = validateRequiredFields(data, requiredFields);\n    \n    if (!validation.isValid) {\n      return { isValid: false, errors: validation.errors };\n    }\n    \n    // 時刻の妥当性チェック\n    if (data.開始時刻 && data.終了時刻) {\n      const timeValidation = validateTimeSequence(data.開始時刻, data.終了時刻);\n      if (!timeValidation.isValid) {\n        return { isValid: false, errors: ['終了時刻は開始時刻より後である必要があります'] };\n      }\n    }\n    \n    return { isValid: true, errors: [] };\n  }\n  \n  // 中断記録の保存\n  async function saveInterruptionRecord(data, isComplete = false) {\n    try {\n      const validation = validateFormData(data);\n      if (!validation.isValid) {\n        showError(validation.errors.join(', '));\n        return false;\n      }\n      \n      // 異常検知\n      if (data.開始時刻 && data.終了時刻) {\n        const anomalies = detectWorkTimeAnomalies([data]);\n        if (anomalies.length > 0) {\n          createAnomalyLog(anomalies[0]);\n        }\n      }\n      \n      // データ保存\n      const recordData = {\n        ...data,\n        ステータス: isComplete ? '完了' : '一時保存',\n        作業記録ID: currentWorkRecord?.ID || null\n      };\n      \n      await window.aivicApi.save(2, recordData); // 中断記録テーブル\n      \n      const message = isComplete ? '中断記録を完了しました' : '中断記録を保存しました';\n      showSuccess(message);\n      \n      // 記録リストに追加\n      if (recordList && data.開始時刻) {\n        const listItem = document.createElement('div');\n        listItem.textContent = `${data.開始時刻} - ${data.中断理由}`;\n        recordList.appendChild(listItem);\n      }\n      \n      return true;\n    } catch (error) {\n      showError('保存に失敗しました: ' + error.message);\n      return false;\n    }\n  }\n  \n  // 音声録音開始\n  async function startRecording() {\n    try {\n      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });\n      mediaRecorder = new MediaRecorder(stream);\n      audioChunks = [];\n      \n      mediaRecorder.ondataavailable = (event) => {\n        audioChunks.push(event.data);\n      };\n      \n      mediaRecorder.onstop = () => {\n        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });\n        const audioUrl = URL.createObjectURL(audioBlob);\n        \n        if (voicePlayer) {\n          voicePlayer.src = audioUrl;\n          voicePlayer.style.display = 'block';\n        }\n        if (audioPreview) {\n          audioPreview.src = audioUrl;\n          audioPreview.style.display = 'block';\n        }\n      };\n      \n      mediaRecorder.start();\n      \n      if (voiceRecordBtn) voiceRecordBtn.disabled = true;\n      if (voiceStopBtn) voiceStopBtn.disabled = false;\n      \n    } catch (error) {\n      showError('音声録音の開始に失敗しました');\n    }\n  }\n  \n  // 音声録音停止\n  function stopRecording() {\n    if (mediaRecorder && mediaRecorder.state === 'recording') {\n      mediaRecorder.stop();\n      mediaRecorder.stream.getTracks().forEach(track => track.stop());\n      \n      if (voiceRecordBtn) voiceRecordBtn.disabled = false;\n      if (voiceStopBtn) voiceStopBtn.disabled = true;\n    }\n  }\n  \n  // イベントリスナーの設定\n  if (startTimeInput) {\n    startTimeInput.addEventListener('change', updateDuration);\n  }\n  \n  if (endTimeInput) {\n    endTimeInput.addEventListener('change', updateDuration);\n  }\n  \n  if (detailsTextarea) {\n    detailsTextarea.addEventListener('input', updateCharCount);\n  }\n  \n  // 写真アップロード\n  if (photoUpload) {\n    photoUpload.addEventListener('change', (e) => {\n      const file = e.target.files[0];\n      if (file) {\n        const reader = new FileReader();\n        reader.onload = (e) => {\n          if (photoPreview) {\n            photoPreview.src = e.target.result;\n            photoPreview.style.display = 'block';\n          }\n          if (uploadedPhoto) {\n            uploadedPhoto.src = e.target.result;\n            uploadedPhoto.style.display = 'block';\n          }\n        };\n        reader.readAsDataURL(file);\n      }\n    });\n  }\n  \n  // 記録ボタン\n  if (recordBtn) {\n    recordBtn.addEventListener('click', async () => {\n      const data = getFormData();\n      await saveInterruptionRecord(data, false);\n    });\n  }\n  \n  // 保存ボタン\n  if (saveBtn) {\n    saveBtn.addEventListener('click', async () => {\n      const data = getFormData();\n      await saveInterruptionRecord(data, false);\n    });\n  }\n  \n  // 完了ボタン\n  if (completeBtn) {\n    completeBtn.addEventListener('click', async () => {\n      const data = getFormData();\n      await saveInterruptionRecord(data, true);\n    });\n  }\n  \n  // 音声録音ボタン\n  if (voiceRecordBtn) {\n    voiceRecordBtn.addEventListener('click', startRecording);\n  }\n  \n  if (voiceStopBtn) {\n    voiceStopBtn.addEventListener('click', stopRecording);\n  }\n  \n  // 一時保存ボタン\n  if (tempSaveBtn) {\n    tempSaveBtn.addEventListener('click', async () => {\n      const data = getFormData();\n      await saveInterruptionRecord(data, false);\n    });\n  }\n  \n  // 初期化処理\n  loadCurrentWorkRecord();\n  updateDuration();\n  updateCharCount();\n  \n  // エラーメッセージを初期状態で非表示\n  if (errorMessage) {\n    errorMessage.style.display = 'none';\n  }\n  if (successMessage) {\n    successMessage.style.display = 'none';\n  }\n  if (completionMessage) {\n    completionMessage.style.display = 'none';\n  }\n}";
</script>

      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
