ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let mediaRecorder = null;\n  let audioChunks = [];\n  let recordedBlob = null;\n\n  // DOM要素の取得\n  const startTimeInput = container.querySelector('#start-time');\n  const endTimeInput = container.querySelector('#end-time');\n  const reasonSelect = container.querySelector('#reason');\n  const locationInput = container.querySelector('#location');\n  const detailsTextarea = container.querySelector('#details');\n  const charCount = container.querySelector('#char-count');\n  const durationDisplay = container.querySelector('#duration-display');\n  const workItemDisplay = container.querySelector('#work-item-display');\n  const photoUpload = container.querySelector('#photo-upload');\n  const photoBtn = container.querySelector('#photo-btn');\n  const photoPreview = container.querySelector('#photo-preview');\n  const recordBtn = container.querySelector('#record-btn');\n  const stopBtn = container.querySelector('#stop-btn');\n  const recordingStatus = container.querySelector('#recording-status');\n  const audioPlayback = container.querySelector('#audio-playback');\n  const selectAllImpact = container.querySelector('#select-all-impact');\n  const impactCheckboxes = container.querySelectorAll('input[name=\"impact\"]');\n  const tempSaveBtn = container.querySelector('#btn-temp-save');\n  const completeBtn = container.querySelector('#btn-complete');\n  const errorMessage = container.querySelector('#error-message');\n  const successMessage = container.querySelector('#success-message');\n\n  // 初期化\n  function init() {\n    // 現在時刻を中断開始時刻にセット\n    const now = new Date();\n    startTimeInput.value = now.toISOString().slice(0, 16);\n    \n    // 関連作業項目の表示（現在進行中の作業を表示）\n    loadCurrentWorkItem();\n    \n    // 一時保存データの復元\n    loadTempData();\n    \n    // 中断時間の計算\n    updateDuration();\n  }\n\n  // 現在の作業項目を読み込み\n  async function loadCurrentWorkItem() {\n    try {\n      const workRecords = await window.aivicApi.list(1); // 作業記録テーブル\n      if (workRecords) {\n        const currentWork = workRecords.find(record => record.進捗状況 === '作業中');\n        if (currentWork) {\n          workItemDisplay.textContent = `${currentWork.プロジェクト名} - ${currentWork.作業種別}`;\n          workItemDisplay.dataset.workRecordId = currentWork.作業記録ID;\n        } else {\n          workItemDisplay.textContent = '進行中の作業項目がありません';\n        }\n      }\n    } catch (error) {\n      workItemDisplay.textContent = '作業項目の読み込みに失敗しました';\n    }\n  }\n\n  // 文字数カウント\n  detailsTextarea.addEventListener('input', () => {\n    const count = detailsTextarea.value.length;\n    charCount.textContent = count;\n    if (count > 1000) {\n      charCount.style.color = '#fca5a5';\n    } else {\n      charCount.style.color = 'var(--text-muted)';\n    }\n  });\n\n  // 中断時間の自動計算\n  function updateDuration() {\n    const startTime = startTimeInput.value;\n    const endTime = endTimeInput.value;\n    \n    if (startTime && endTime) {\n      const start = new Date(startTime);\n      const end = new Date(endTime);\n      const diffMs = end - start;\n      \n      if (diffMs > 0) {\n        const hours = Math.floor(diffMs / (1000 * 60 * 60));\n        const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));\n        durationDisplay.textContent = `${hours}時間${minutes}分`;\n        durationDisplay.style.color = 'var(--text)';\n      } else {\n        durationDisplay.textContent = '終了時刻が開始時刻より前です';\n        durationDisplay.style.color = '#fca5a5';\n      }\n    } else if (startTime) {\n      durationDisplay.textContent = '終了時刻を入力してください';\n      durationDisplay.style.color = 'var(--text-muted)';\n    } else {\n      durationDisplay.textContent = '自動計算されます';\n      durationDisplay.style.color = 'var(--text-muted)';\n    }\n  }\n\n  startTimeInput.addEventListener('change', updateDuration);\n  endTimeInput.addEventListener('change', updateDuration);\n\n  // 写真アップロード\n  photoBtn.addEventListener('click', () => {\n    photoUpload.click();\n  });\n\n  photoUpload.addEventListener('change', (e) => {\n    const files = Array.from(e.target.files);\n    if (files.length > 0) {\n      // ファイル形式チェック\n      const invalidFiles = files.filter(file => !file.type.startsWith('image/'));\n      if (invalidFiles.length > 0) {\n        showError('対応していないファイル形式が含まれています。画像ファイルのみ選択してください。');\n        return;\n      }\n      \n      // ファイルサイズチェック（10MB制限）\n      const oversizeFiles = files.filter(file => file.size > 10 * 1024 * 1024);\n      if (oversizeFiles.length > 0) {\n        showError('ファイルサイズが上限（10MB）を超えています。');\n        return;\n      }\n      \n      photoPreview.textContent = `${files.length}個のファイルが選択されました`;\n    } else {\n      photoPreview.textContent = '';\n    }\n  });\n\n  // 音声録音\n  recordBtn.addEventListener('click', async () => {\n    try {\n      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });\n      mediaRecorder = new MediaRecorder(stream);\n      audioChunks = [];\n\n      mediaRecorder.ondataavailable = (event) => {\n        audioChunks.push(event.data);\n      };\n\n      mediaRecorder.onstop = () => {\n        recordedBlob = new Blob(audioChunks, { type: 'audio/wav' });\n        audioPlayback.src = URL.createObjectURL(recordedBlob);\n        audioPlayback.style.display = 'block';\n        recordingStatus.textContent = '録音完了 - 再生して確認できます';\n        stream.getTracks().forEach(track => track.stop());\n      };\n\n      mediaRecorder.start();\n      recordBtn.disabled = true;\n      stopBtn.disabled = false;\n      recordingStatus.textContent = '録音中...';\n    } catch (error) {\n      showError('マイクへのアクセスが拒否されました。録音機能を使用するにはマイクの許可が必要です。');\n    }\n  });\n\n  stopBtn.addEventListener('click', () => {\n    if (mediaRecorder && mediaRecorder.state === 'recording') {\n      mediaRecorder.stop();\n      recordBtn.disabled = false;\n      stopBtn.disabled = true;\n    }\n  });\n\n  // 影響範囲の全選択・全解除\n  selectAllImpact.addEventListener('change', () => {\n    impactCheckboxes.forEach(checkbox => {\n      checkbox.checked = selectAllImpact.checked;\n    });\n  });\n\n  // 個別選択時の全選択チェックボックス連動\n  impactCheckboxes.forEach(checkbox => {\n    checkbox.addEventListener('change', () => {\n      const checkedCount = Array.from(impactCheckboxes).filter(cb => cb.checked).length;\n      selectAllImpact.checked = checkedCount === impactCheckboxes.length;\n      selectAllImpact.indeterminate = checkedCount > 0 && checkedCount < impactCheckboxes.length;\n    });\n  });\n\n  // バリデーション\n  function validateForm() {\n    const errors = [];\n    \n    // 必須項目チェック\n    if (!startTimeInput.value) {\n      errors.push('中断開始時刻は必須です');\n    }\n    if (!reasonSelect.value) {\n      errors.push('中断理由は必須です');\n    }\n    \n    // 未来時刻チェック\n    if (startTimeInput.value) {\n      const startTime = new Date(startTimeInput.value);\n      const now = new Date();\n      if (startTime > now) {\n        errors.push('中断開始時刻に未来の時刻は入力できません');\n      }\n    }\n    \n    if (endTimeInput.value) {\n      const endTime = new Date(endTimeInput.value);\n      const now = new Date();\n      if (endTime > now) {\n        errors.push('中断終了時刻に未来の時刻は入力できません');\n      }\n    }\n    \n    // 時刻の前後関係チェック\n    if (startTimeInput.value && endTimeInput.value) {\n      const start = new Date(startTimeInput.value);\n      const end = new Date(endTimeInput.value);\n      if (end <= start) {\n        errors.push('中断終了時刻は開始時刻より後の時刻を入力してください');\n      }\n    }\n    \n    // 文字数チェック\n    if (detailsTextarea.value.length > 1000) {\n      errors.push('中断詳細は1000文字以内で入力してください');\n    }\n    \n    return errors;\n  }\n\n  // エラー表示\n  function showError(message) {\n    errorMessage.textContent = message;\n    errorMessage.style.display = 'block';\n    successMessage.style.display = 'none';\n    setTimeout(() => {\n      errorMessage.style.display = 'none';\n    }, 5000);\n  }\n\n  // 成功メッセージ表示\n  function showSuccess(message) {\n    successMessage.textContent = message;\n    successMessage.style.display = 'block';\n    errorMessage.style.display = 'none';\n    setTimeout(() => {\n      successMessage.style.display = 'none';\n    }, 3000);\n  }\n\n  // フォームデータ収集\n  function collectFormData() {\n    const urgencyRadio = container.querySelector('input[name=\"urgency\"]:checked');\n    const impactValues = Array.from(container.querySelectorAll('input[name=\"impact\"]:checked')).map(cb => cb.value);\n    \n    let durationMinutes = null;\n    if (startTimeInput.value && endTimeInput.value) {\n      const start = new Date(startTimeInput.value);\n      const end = new Date(endTimeInput.value);\n      durationMinutes = Math.floor((end - start) / (1000 * 60));\n    }\n    \n    return {\n      作業記録ID: workItemDisplay.dataset.workRecordId || null,\n      中断開始日時: startTimeInput.value ? new Date(startTimeInput.value).toISOString() : null,\n      中断終了日時: endTimeInput.value ? new Date(endTimeInput.value).toISOString() : null,\n      中断理由区分: reasonSelect.value,\n      中断理由詳細: detailsTextarea.value,\n      中断時間: durationMinutes,\n      影響度: urgencyRadio ? urgencyRadio.value : '中',\n      対応状況: '対応中',\n      記録者ID: 'current-user-id', // 実際の実装では認証されたユーザーIDを使用\n      中断場所: locationInput.value,\n      影響範囲: impactValues.join(', '),\n      作成日時: new Date().toISOString(),\n      更新日時: new Date().toISOString()\n    };\n  }\n\n  // 一時保存\n  tempSaveBtn.addEventListener('click', () => {\n    const formData = collectFormData();\n    localStorage.setItem('interruption_temp_data', JSON.stringify(formData));\n    showSuccess('一時保存しました');\n  });\n\n  // 一時保存データの読み込み\n  function loadTempData() {\n    const tempData = localStorage.getItem('interruption_temp_data');\n    if (tempData) {\n      try {\n        const data = JSON.parse(tempData);\n        if (data.中断開始日時) startTimeInput.value = new Date(data.中断開始日時).toISOString().slice(0, 16);\n        if (data.中断終了日時) endTimeInput.value = new Date(data.中断終了日時).toISOString().slice(0, 16);\n        if (data.中断理由区分) reasonSelect.value = data.中断理由区分;\n        if (data.中断理由詳細) detailsTextarea.value = data.中断理由詳細;\n        if (data.中断場所) locationInput.value = data.中断場所;\n        if (data.影響度) {\n          const urgencyRadio = container.querySelector(`input[name=\"urgency\"][value=\"${data.影響度}\"]`);\n          if (urgencyRadio) urgencyRadio.checked = true;\n        }\n        updateDuration();\n        detailsTextarea.dispatchEvent(new Event('input'));\n      } catch (error) {\n        console.error('一時保存データの読み込みに失敗しました:', error);\n      }\n    }\n  }\n\n  // 記録完了\n  completeBtn.addEventListener('click', async () => {\n    const errors = validateForm();\n    if (errors.length > 0) {\n      showError(errors.join('、'));\n      return;\n    }\n\n    try {\n      const formData = collectFormData();\n      const saved = await window.aivicApi.save(2, formData); // 中断記録テーブル\n      \n      if (saved) {\n        // 一時保存データを削除\n        localStorage.removeItem('interruption_temp_data');\n        showSuccess('中断記録を保存しました');\n        \n        // 2秒後に作業再開記録画面に遷移\n        setTimeout(() => {\n          window.showScreen(\"scr-1778907251446\");\n        }, 2000);\n      } else {\n        showError('保存に失敗しました。ネットワーク接続を確認してください。');\n      }\n    } catch (error) {\n      showError('保存中にエラーが発生しました: ' + error.message);\n    }\n  });\n\n  // 初期化実行\n  init();\n}";
</script>

      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
