<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工数記録システム</title>
    <style>
        :root {
            --primary: #cc1f1f;
            --primary-hover: #a61a1a;
            --bg-main: #0d0d0d;
            --bg-card: #1a1010;
            --bg-sidebar: #151111;
            --border: #331a1a;
            --text: #e6e6e6;
            --text-muted: #999999;
            --top-bar-bg: #1f1515;
            --top-bar-border: #2d1a1a;
            --warning: #ff6b35;
            --error: #ff3333;
            --success: #28a745;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: "⚠";
            font-size: 18px;
        }

        .nav-section {
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }

        .nav-section:last-child {
            border-bottom: none;
            flex: 1;
        }

        .nav-title {
            padding: 0 16px 8px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: block;
            padding: 8px 16px;
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: rgba(204, 31, 31, 0.1);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: rgba(204, 31, 31, 0.15);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            margin-left: 220px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
        }

        .current-time {
            font-size: 12px;
            font-weight: 500;
            color: var(--primary);
            font-family: 'Courier New', monospace;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text);
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .user-menu:hover {
            background: var(--bg-sidebar);
            border-color: var(--primary);
        }

        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            min-height: calc(100vh - 132px);
        }

        .emergency-banner {
            background: linear-gradient(135deg, var(--error), var(--warning));
            color: white;
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            animation: flash 3s infinite;
        }

        @keyframes flash {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.7; }
        }

        .quick-actions {
            padding: 12px 16px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }

        .quick-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            margin-right: 8px;
            transition: all 0.15s ease;
        }

        .quick-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .quick-btn.secondary {
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
        }

        .quick-btn.secondary:hover {
            background: var(--border);
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .content-area {
                padding: 12px;
            }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(13, 13, 13, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let mediaRecorder = null;\n  let audioChunks = [];\n  let recordedBlob = null;\n  let isRecording = false;\n  \n  // DOM要素の取得\n  const form = container.querySelector('#interruption-form');\n  const startTimeInput = container.querySelector('#start-time');\n  const reasonSelect = container.querySelector('#interruption-reason');\n  const detailsTextarea = container.querySelector('#interruption-details');\n  const locationInput = container.querySelector('#interruption-location');\n  const relatedWorkSelect = container.querySelector('#related-work');\n  const durationDiv = container.querySelector('#interruption-duration');\n  const charCountSpan = container.querySelector('#char-count');\n  const photoUpload = container.querySelector('#photo-upload');\n  const photoBtn = container.querySelector('#photo-btn');\n  const photoPreview = container.querySelector('#photo-preview');\n  const recordBtn = container.querySelector('#record-btn');\n  const playBtn = container.querySelector('#play-btn');\n  const recordingStatus = container.querySelector('#recording-status');\n  const selectAllImpact = container.querySelector('#select-all-impact');\n  const impactCheckboxes = container.querySelectorAll('input[name=\"impact\"]');\n  const tempSaveBtn = container.querySelector('#temp-save-btn');\n  const completeBtn = container.querySelector('#complete-btn');\n  const errorMessage = container.querySelector('#error-message');\n  \n  // 現在時刻を設定\n  const now = new Date();\n  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());\n  startTimeInput.value = now.toISOString().slice(0, 16);\n  \n  // 関連作業項目の読み込み\n  async function loadWorkItems() {\n    try {\n      const workItems = await window.aivicApi.list(3); // 作業項目マスタ\n      if (workItems) {\n        relatedWorkSelect.innerHTML = '<option value=\"\">選択してください</option>';\n        workItems.forEach(item => {\n          const option = document.createElement('option');\n          option.value = item.作業項目ID;\n          option.textContent = `${item.作業項目コード} - ${item.作業項目名}`;\n          relatedWorkSelect.appendChild(option);\n        });\n      }\n    } catch (error) {\n      console.error('作業項目の読み込みに失敗しました:', error);\n    }\n  }\n  \n  // 文字数カウント\n  detailsTextarea.addEventListener('input', () => {\n    const count = detailsTextarea.value.length;\n    charCountSpan.textContent = count;\n    if (count > 1000) {\n      charCountSpan.style.color = '#dc2626';\n    } else {\n      charCountSpan.style.color = 'var(--text-muted)';\n    }\n  });\n  \n  // 中断時間の自動計算\n  function updateDuration() {\n    const startTime = startTimeInput.value;\n    if (startTime) {\n      const start = new Date(startTime);\n      const now = new Date();\n      const diffMs = now - start;\n      if (diffMs > 0) {\n        const hours = Math.floor(diffMs / (1000 * 60 * 60));\n        const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));\n        durationDiv.textContent = `${hours}時間${minutes}分`;\n        durationDiv.style.color = 'var(--text)';\n      } else {\n        durationDiv.textContent = '未来の時刻は設定できません';\n        durationDiv.style.color = '#dc2626';\n      }\n    } else {\n      durationDiv.textContent = '自動計算されます';\n      durationDiv.style.color = 'var(--text-muted)';\n    }\n  }\n  \n  startTimeInput.addEventListener('change', updateDuration);\n  setInterval(updateDuration, 60000); // 1分ごとに更新\n  \n  // 写真アップロード\n  photoBtn.addEventListener('click', () => {\n    photoUpload.click();\n  });\n  \n  photoUpload.addEventListener('change', (e) => {\n    const files = Array.from(e.target.files);\n    photoPreview.innerHTML = '';\n    \n    files.forEach((file, index) => {\n      if (!file.type.startsWith('image/')) {\n        showError('画像ファイルのみアップロード可能です');\n        return;\n      }\n      \n      if (file.size > 10 * 1024 * 1024) { // 10MB\n        showError('ファイルサイズは10MB以下にしてください');\n        return;\n      }\n      \n      const reader = new FileReader();\n      reader.onload = (e) => {\n        const img = document.createElement('img');\n        img.src = e.target.result;\n        img.style.cssText = 'width: 60px; height: 60px; object-fit: cover; border-radius: 4px; border: 1px solid rgba(255,255,255,0.18);';\n        photoPreview.appendChild(img);\n      };\n      reader.readAsDataURL(file);\n    });\n  });\n  \n  // 音声録音\n  recordBtn.addEventListener('click', async () => {\n    if (!isRecording) {\n      try {\n        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });\n        mediaRecorder = new MediaRecorder(stream);\n        audioChunks = [];\n        \n        mediaRecorder.ondataavailable = (event) => {\n          audioChunks.push(event.data);\n        };\n        \n        mediaRecorder.onstop = () => {\n          recordedBlob = new Blob(audioChunks, { type: 'audio/wav' });\n          playBtn.disabled = false;\n          playBtn.style.cursor = 'pointer';\n          playBtn.style.color = 'var(--text)';\n          recordingStatus.textContent = '録音完了';\n        };\n        \n        mediaRecorder.start();\n        isRecording = true;\n        recordBtn.textContent = '🛑 録音停止';\n        recordBtn.style.background = 'rgba(220, 38, 38, 0.2)';\n        recordingStatus.textContent = '録音中...';\n        \n      } catch (error) {\n        showError('マイクへのアクセスが拒否されました');\n      }\n    } else {\n      mediaRecorder.stop();\n      mediaRecorder.stream.getTracks().forEach(track => track.stop());\n      isRecording = false;\n      recordBtn.textContent = '🎤 録音開始';\n      recordBtn.style.background = 'transparent';\n    }\n  });\n  \n  playBtn.addEventListener('click', () => {\n    if (recordedBlob) {\n      const audio = new Audio(URL.createObjectURL(recordedBlob));\n      audio.play();\n    }\n  });\n  \n  // 影響範囲の全選択・全解除\n  selectAllImpact.addEventListener('change', () => {\n    impactCheckboxes.forEach(checkbox => {\n      checkbox.checked = selectAllImpact.checked;\n    });\n  });\n ncy.value : null,\n      対応状況: '対応中',\n      記録者ID: 'current-user-id', // 実際の実装では現在のユーザーIDを設定\n      作成日時: new Date().toISOString(),\n      更新日時: new Date().toISOString(),\n      中断場所: locationInput.value,\n      関連作業項目: relatedWorkSelect.value,\n      影響範囲: impactRanges.join(','),\n      写真添付: photoUpload.files.length > 0,\n      音声メモ: recordedBlob !== null\n    };\n  }\n  \n  // 一時保存\n  tempSaveBtn.addEventListener('click', () => {\n    const formData = collectFormData();\n    localStorage.setItem('interruption_temp_data', JSON.stringify(formData));\n    \n    const tempMessage = document.createElement('div');\n    tempMessage.textContent = '一時保存しました';\n    tempMessage.style.cssText = 'background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); color: #22c55e; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 12px;';\n    errorMessage.parentNode.insertBefore(tempMessage, errorMessage);\n    \n    setTimeout(() => {\n      tempMessage.remove();\n    }, 3000);\n  });\n  \n  // 一時保存データの復元\n  function restoreTempData() {\n    const tempData = localStorage.getItem('interruption_temp_data');\n    if (tempData) {\n      try {\n        const data = JSON.parse(tempData);\n        if (data.中断開始日時) {\n          const date = new Date(data.中断開始日時);\n          date.setMinutes(date.getMinutes() - date.getTimezoneOffset());\n          startTimeInput.value = date.toISOString().slice(0, 16);\n        }\n        if (data.中断理由区分) reasonSelect.value = data.中断理由区分;\n        if (data.中断理由詳細) detailsTextarea.value = data.中断理由詳細;\n        if (data.中断場所) locationInput.value = data.中断場所;\n        if (data.関連作業項目) relatedWorkSelect.value = data.関連作業項目;\n        if (data.影響度) {\n          const urgencyRadio = container.querySelector(`input[name=\"urgency\"][value=\"${data.影響度}\"]`);\n          if (urgencyRadio) urgencyRadio.checked = true;\n        }\n        if (data.影響範囲) {\n          const ranges = data.影響範囲.split(',');\n          ranges.forEach(range     <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
