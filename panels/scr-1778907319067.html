ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type":"text","required":false,"description":"管理者による対応内容や備考"},{"name":"検出日時","type":"timestamp","required":true,"description":"異常値が検出された日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let workRecords = [];\n  let breakRecords = [];\n  let workItems = [];\n  let selectedRecord = null;\n\n  // 初期データ読み込み\n  async function loadData() {\n    try {\n      workRecords = await window.aivicApi.list(1) || tables[1]?.records || [];\n      breakRecords = await window.aivicApi.list(2) || tables[2]?.records || [];\n      workItems = await window.aivicApi.list(3) || tables[3]?.records || [];\n      \n      populateTargetRecords();\n      populateWorkItems();\n    } catch (error) {\n      console.error('データ読み込みエラー:', error);\n    }\n  }\n\n  // 修正対象記録のプルダウンを設定\n  function populateTargetRecords() {\n    const select = container.querySelector('#target-record');\n    select.innerHTML = '<option value=\"\">記録を選択してください</option>';\n    \n    workRecords.forEach(record => {\n      const option = document.createElement('option');\n      option.value = record.作業記録ID || record.id;\n      const workDate = record.作業日 ? new Date(record.作業日).toLocaleDateString() : '';\n      const projectName = record.プロジェクト名 || '';\n      const workType = record.作業種別 || '';\n      option.textContent = `${workDate} - ${projectName} (${workType})`;\n      select.appendChild(option);\n    });\n  }\n\n  // 作業項目のプルダウンを設定\n  function populateWorkItems() {\n    const select = container.querySelector('#work-item');\n    select.innerHTML = '<option value=\"\">選択してください</option>';\n    \n    workItems.filter(item => item.有効フラグ).forEach(item => {\n      const option = document.createElement('option');\n      option.value = item.作業項目ID || item.id;\n      option.textContent = `${item.作業項目コード || ''} - ${item.作業項目名 || ''}`;\n      select.appendChild(option);\n    });\n  }\n\n  // 修正対象記録選択時の処理\n  container.querySelector('#target-record').addEventListener('change', function() {\n    const recordId = this.value;\n    if (!recordId) {\n      container.querySelector('#correction-form').style.display = 'none';\n      container.querySelector('#original-data').style.display = 'none';\n      selectedRecord = null;\n      return;\n    }\n\n    selectedRecord = workRecords.find(r => (r.作業記録ID || r.id) === recordId);\n    if (selectedRecord) {\n      populateForm(selectedRecord);\n      showOriginalData(selectedRecord);\n      container.querySelector('#correction-form').style.display = 'block';\n      container.querySelector('#original-data').style.display = 'block';\n    }\n  });\n\n  // フォームに既存データを設定\n  function populateForm(record) {\n    const workDate = record.作業日 ? new Date(record.作業日).toISOString().split('T')[0] : '';\n    container.querySelector('#work-date').value = workDate;\n    \n    if (record.作業開始時刻) {\n      const startTime = new Date(record.作業開始時刻);\n      container.querySelector('#start-time').value = `${startTime.getHours().toString().padStart(2, '0')}:${startTime.getMinutes().toString().padStart(2, '0')}`;\n    }\n    \n    if (record.作業終了時刻) {\n      const endTime = new Date(record.作業終了時刻);\n      container.querySelector('#end-time').value = `${endTime.getHours().toString().padStart(2, '0')}:${endTime.getMinutes().toString().padStart(2, '0')}`;\n    }\n\n    // 作業項目を設定（プロジェクト名や作業種別から推測）\n    const workItemSelect = container.querySelector('#work-item');\n    const matchingItem = workItems.find(item => \n      item.作業項目名 === record.作業種別 || item.作業項目コード === record.作業種別\n    );\n    if (matchingItem) {\n      workItemSelect.value = matchingItem.作業項目ID || matchingItem.id;\n    }\n\n    // 中断記録があれば設定\n    const breakRecord = breakRecords.find(br => br.作業記録ID === (record.作業記録ID || record.id));\n    if (breakRecord) {\n      if (breakRecord.中断開始日時) {\n        const breakTime = new Date(breakRecord.中断開始日時);\n        container.querySelector('#break-time').value = `${breakTime.getHours().toString().padStart(2, '0')}:${breakTime.getMinutes().toString().padStart(2, '0')}`;\n      }\n      container.querySelector('#break-reason').value = breakRecord.中断理由区分 || '';\n    }\n\n    calculateTimes();\n  }\n\n  // 修正前データを表示\n  function showOriginalData(record) {\n    const originalContent = container.querySelector('#original-content');\n    const workDate = record.作業日 ? new Date(record.作業日).toLocaleDateString() : '-';\n    const startTime = record.作業開始時刻 ? new Date(record.作業開始時刻).toLocaleTimeString() : '-';\n    const endTime = record.作業終了時刻 ? new Date(record.作業終了時刻).toLocaleTimeString() : '-';\n    const workTime = record.作業時間 ? `${Math.floor(record.作業時間 / 60)}時間${record.作業時間 % 60}分` : '-';\n    \n    originalContent.innerHTML = `\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px;\">\n        <div>作業日: ${workDate}</div>\n        <div>プロジェクト: ${record.プロジェクト名 || '-'}</div>\n        <div>開始時刻: ${startTime}</div>\n        <div>終了時刻: ${endTime}</div>\n        <div>作業時間: ${workTime}</div>\n        <div>作業種別: ${record.作業種別 || '-'}</div>\n      </div>\n    `;\n  }\n\n  // 時間計算\n  function calculateTimes() {\n    const startTime = container.querySelector('#start-time').value;\n    const endTime = container.querySelector('#end-time').value;\n    const breakTime = container.querySelector('#break-time').value;\n\n    if (startTime && endTime) {\n      const start = new Date(`2000-01-01T${startTime}`);\n      const end = new Date(`2000-01-01T${endTime}`);\n      \n      if (end > start) {\n        const totalMinutes = (end - start) / (1000 * 60);\n        let breakMinutes = 0;\n        \n        if (breakTime) {\n          const breakDateTime = new Date(`2000-01-01T${breakTime}`);\n          if (breakDateTime >= start && breakDateTime <= end) {\n            // 簡易的に30分の中断とする\n            breakMinutes = 30;\n          }\n        }\n        \n        const actualMinutes = totalMinutes - breakMinutes;\n        \n        container.querySelector('#break-duration').textContent = breakMinutes > 0 ? `${breakMinutes}分` : '-';\n        container.querySelector('#actual-work-time').textContent = `${Math.floor(actualMinutes / 60)}時間${actualMinutes % 60}分`;\n        \n        // 異常値チェック\n        checkAnomalies(totalMinutes, actualMinutes, breakMinutes);\n      }\n    }\n  }\n\n  // 異常値チェック\n  function checkAnomalies(totalMinutes, actualMinutes, breakMinutes) {\n    const warnings = [];\n    \n    if (actualMinutes > 12 * 60) { // 12時間超\n      warnings.push('実作業時間が12時間を超えています');\n    }\n    \n    if (totalMinutes > 24 * 60) { // 24時間超\n      warnings.push('総作業時間が24時間を超えています');\n    }\n    \n    if (breakMinutes > totalMinutes * 0.5) { // 中断時間が総時間の50%超\n      warnings.push('中断時間が総作業時間の50%を超えています');\n    }\n\n    const warningArea = container.querySelector('#warning-area');\n    if (warnings.length > 0) {\n      container.querySelector('#warning-message').textContent = warnings.join('、');\n      warningArea.style.display = 'block';\n    } else {\n      warningArea.style.display = 'none';\n    }\n  }\n\n  // バリデーション\n  function validateForm() {\n    const errors = [];\n    \n    if (!container.querySelector('#target-record').value) {\n      errors.push('修正対象記録を選択してください');\n    }\n    \n    if (!container.querySelector('#correction-reason').value.trim()) {\n      errors.push('修正理由を入力してください');\n    }\n    \n    const workDate = container.querySelector('#work-date').value;\n    if (workDate) {\n      const date = new Date(workDate);\n      const today = new Date();\n      if (date > today) {\n        errors.push('作業日付に未来の日付は入力できません');\n      }\n      if (date < new Date('1900-01-01')) {\n        errors.push('作業日付が無効です');\n      }\n    }\n    \n    const startTime = container.querySelector('#start-time').value;\n    const endTime = container.querySelector('#end-time').value;\n    if (startTime && endTime) {\n      const start = new Date(`2000-01-01T${startTime}`);\n      const end = new Date(`2000-01-01T${endTime}`);\n      if (start >= end) {\n        errors.push('開始時刻は終了時刻より前の時刻を入力してください');\n      }\n    }\n    \n    const breakTime = container.querySelector('#break-time').value;\n    if (breakTime && startTime && endTime) {\n      const breakDateTime = new Date(`2000-01-01T${breakTime}`);\n      const start = new Date(`2000-01-01T${startTime}`);\n      const end = new Date(`2000-01-01T${endTime}`);\n      if (breakDateTime < start || breakDateTime > end) {\n        errors.push('中断時刻が作業時間外です');\n      }\n    }\n\n    const errorArea = container.querySelector('#error-area');\n    if (errors.length > 0) {\n      container.querySelector('#error-message').textContent = errors.join('、');\n      errorArea.style.display = 'block';\n      return false;\n    } else {\n      errorArea.style.display = 'none';\n      return true;\n    }\n  }\n\n  // 時間入力時の計算\n  ['#start-time', '#end-time', '#break-time'].forEach(selector => {\n    container.querySelector(selector).addEventListener('change', calculateTimes);\n  });\n\n  // 修正理由の文字数カウント\n  container.querySelector('#correction-reason').addEventListener('input', function() {\n    const count = this.value.length;\n    container.querySelector('#reason-count').textContent = count;\n    \n    if (count > 200) {\n      this.value = this.value.substring(0, 200);\n      container.querySelector('#reason-count').textContent = '200';\n    }\n  });\n\n  // 保存ボタン\n  container.querySelector('#btn-save').addEventListener('click', async function() {\n    if (!validateForm()) return;\n    \n    try {\n      const recordId = container.querySelector('#target-record').value;\n      const workDate = container.querySelector('#work-date').value;\n      const startTime = container.querySelector('#start-time').value;\n      const endTime = container.querySelector('#end-time').value;\n      const workItemId = container.querySelector('#work-item').value;\n      const breakTime = container.querySelector('#break-time').value;\n      const breakReason = container.querySelector('#break-reason').value;\n      const correctionReason = container.querySelector('#correction-reason').value;\n\n      // 作業記録の更新\n      const updateData = {\n        ...selectedRecord\n      };\n\n      if (workDate) {\n        updateData.作業日 = new Date(workDate).toISOString();\n      }\n      \n      if (startTime) {\n        const startDateTime = new Date(`${workDate}T${startTime}`);\n        updateData.作業開始時刻 = startDateTime.toISOString();\n      }\n      \n      if (endTime) {\n        const endDateTime = new Date(`${workDate}T${endTime}`);\n        updateData.作業終了時刻 = endDateTime.toISOString();\n      }\n\n      if (workItemId) {\n        const workItem = workItems.find(item => (item.作業項目ID || item.id) === workItemId);\n        if (workItem) {\n          updateData.作業種別 = workItem.作業項目名;\n        }\n      }\n\n      // 作業時間を再計算\n      if (startTime && endTime) {\n        const start = new Date(`${workDate}T${startTime}`);\n        const end = new Date(`${workDate}T${endTime}`);\n        const totalMinutes = (end - start) / (1000 * 60);\n        updateData.作業時間 = Math.floor(totalMinutes);\n      }\n\n      updateData.更新日時 = new Date().toISOString();\n\n      const updated = await window.aivicApi.update(1, recordId, updateData);\n      if (updated) {\n        // 中断記録の更新/作成\n        if (breakTime && breakReason) {\n          const existingBreak = breakRecords.find(br => br.作業記録ID === recordId);\n          const breakData = {\n            作業記録ID: recordId,\n            中断開始日時: new Date(`${workDate}T${breakTime}`).toISOString(),\n            中断理由区分: breakReason,\n            中断時間: 30, // 簡易的に30分\n            対応状況: '対応中',\n            記録者ID: selectedRecord.作業員ID,\n            更新日時: new Date().toISOString()\n          };\n\n          if (existingBreak) {\n            await window.aivicApi.update(2, existingBreak.中断記録ID || existingBreak.id, breakData);\n          } else {\n            breakData.中断記録ID = crypto.randomUUID();\n            breakData.作成日時 = new Date().toISOString();\n            await window.aivicApi.save(2, breakData);\n          }\n        }\n\n        alert('修正が完了しました');\n        \n        // フォームをリセット\n        container.querySelector('#target-record').value = '';\n        container.querySelector('#correction-reason').value = '';\n        container.querySelector('#reason-count').textContent = '0';\n        container.querySelector('#correction-form').style.display = 'none';\n        container.querySelector('#original-data').style.display = 'none';\n        container.querySelector('#warning-area').style.display = 'none';\n        container.querySelector('#error-area').style.display = 'none';\n        \n        // データを再読み込み\n        await loadData();\n      }\n    } catch (error) {\n      console.error('保存エラー:', error);\n      container.querySelector('#error-message').textContent = '保存に失敗しました';\n      container.querySelector('#error-area').style.display = 'block';\n    }\n  });\n\n  // キャンセルボタン\n  container.querySelector('#btn-cancel').addEventListener('click', function() {\n    window.showScreen('scr-1778907145716'); // 作業履歴一覧画面\n  });\n\n  // 初期データ読み込み\n  loadData();\n}";
</script>

    }

      padding: 0;
      box-sizing: border-box;
    }

    body {

      background: var(--bg-main);
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
      overflow-x: hidden;
    }

    .app-shell {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 220px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      z-index: 100;
    }

    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--top-bar-bg);
    }

    .logo {
      font-size: 15px;
      font-weight: 600;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo::before {
      content: "⚡";
      font-size: 18px;
    }

    .nav-section {
      padding: 16px 0 8px 0;
    }

    .nav-section-title {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 16px 8px 16px;
    }

    .nav-item {
      display: block;
      padding: 8px 16px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 400;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      border-radius: 0;
      position: relative;
    }

    .nav-item:hover {
      background: rgba(139, 0, 0, 0.1);
      color: var(--text);
    }

    .nav-item.aivic-active {
      background: rgba(139, 0, 0, 0.15);
      color: var(--primary);
      font-weight: 500;
    }

    .nav-item.aivic-active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--primary);
    }

    .main-content {
      flex: 1;
      margin-left: 220px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .top-bar {
      height: 52px;
      background: var(--top-bar-bg);
      border-bottom: 1px solid var(--top-bar-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .breadcrumb {
      font-size: 13px;
      color: var(--text-muted);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(0, 170, 68, 0.1);
      color: var(--accent-green);
      border: 1px solid rgba(0, 170, 68, 0.2);
    }

    .status-indicator::before {
      content: "●";
      font-size: 8px;
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 12px;
    }

    .logout-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      transition: all 0.15s ease;
    }

    .logout-link:hover {
      background: var(--bg-card);
      color: var(--text);
    }

    .content-area {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
    }

    .panel-container {
      min-height: calc(100vh - 52px - 32px);
    }

    .emergency-alert {
      background: rgba(255, 68, 68, 0.1);
      border: 1px solid rgba(255, 68, 68, 0.3);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: none;
    }

    .emergency-alert.active {
      display: block;
    }

    .emergency-alert-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent-red);
      margin-bottom: 4px;
    }

    .emergency-alert-text {
      font-size: 12px;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s ease;
      }

      .sidebar.mobile-open {
        transform: translateX(0);
      }

      .main-content {
        margin-left: 0;
      }

      .top-bar {
        padding: 0 16px;
      }

      .content-area {
        padding: 12px 16px;
      }
    }

    .loading-skeleton {
      background: linear-gradient(90deg, var(--bg-card) 25%, rgba(139, 0, 0, 0.1) 50%, var(--bg-card) 75%);

      border-radius: 6px;

    @keyframes loading {

    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
