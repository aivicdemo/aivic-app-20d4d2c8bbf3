ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type":"text","required":false,"description":"管理者による対応内容や備考"},{"name":"検出日時","type":"timestamp","required":true,"description":"異常値が検出された日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let workRecords = [];\n  let breakRecords = [];\n  let workItems = [];\n  let selectedRecordId = null;\n  let originalData = null;\n\n  // 初期データ読み込み\n  async function loadInitialData() {\n    try {\n      workRecords = await window.aivicApi.list(1) || tables[1]?.records || [];\n      breakRecords = await window.aivicApi.list(2) || tables[2]?.records || [];\n      workItems = await window.aivicApi.list(3) || tables[3]?.records || [];\n      \n      populateTargetRecords();\n      populateWorkItems();\n    } catch (error) {\n      console.error('データ読み込みエラー:', error);\n    }\n  }\n\n  // 修正対象記録のドロップダウンを設定\n  function populateTargetRecords() {\n    const targetSelect = container.querySelector('#target-record');\n    targetSelect.innerHTML = '<option value=\"\">選択してください</option>';\n    \n    workRecords.forEach(record => {\n      const option = document.createElement('option');\n      option.value = record.id || record.作業記録ID;\n      const workDate = new Date(record.作業日 || record.workDate).toLocaleDateString('ja-JP');\n      const projectName = record.プロジェクト名 || record.projectName || '';\n      const workType = record.作業種別 || record.workType || '';\n      option.textContent = `${workDate} - ${projectName} - ${workType}`;\n      targetSelect.appendChild(option);\n    });\n  }\n\n  // 作業項目のドロップダウンを設定\n  function populateWorkItems() {\n    const workItemSelect = container.querySelector('#work-item');\n    workItemSelect.innerHTML = '<option value=\"\">選択してください</option>';\n    \n    workItems.forEach(item => {\n      const option = document.createElement('option');\n      option.value = item.id || item.作業項目ID;\n      option.textContent = `${item.作業項目コード || item.code || ''} - ${item.作業項目名 || item.name || ''}`;\n      workItemSelect.appendChild(option);\n    });\n  }\n\n  // 修正対象記録選択時の処理\n  container.querySelector('#target-record').addEventListener('change', function() {\n    selectedRecordId = this.value;\n    if (selectedRecordId) {\n      const record = workRecords.find(r => (r.id || r.作業記録ID) === selectedRecordId);\n      if (record) {\n        originalData = { ...record };\n        displayOriginalData(record);\n        populateFormWithRecord(record);\n        calculateTimes();\n      }\n    } else {\n      hideOriginalData();\n      clearForm();\n    }\n  });\n\n  // 修正前データ表示\n  function displayOriginalData(record) {\n    const originalDataDiv = container.querySelector('#original-data');\n    const contentDiv = container.querySelector('#original-data-content');\n    \n    const workDate = new Date(record.作業日 || record.workDate).toLocaleDateString('ja-JP');\n    const startTime = formatTime(record.作業開始時刻 || record.startTime);\n    const endTime = formatTime(record.作業終了時刻 || record.endTime);\n    const projectName = record.プロジェクト名 || record.projectName || '';\n    const workType = record.作業種別 || record.workType || '';\n    \n    contentDiv.innerHTML = `\n      <div>作業日: ${workDate}</div>\n      <div>開始時刻: ${startTime} / 終了時刻: ${endTime}</div>\n      <div>プロジェクト: ${projectName} / 作業種別: ${workType}</div>\n    `;\n    \n    originalDataDiv.style.display = 'block';\n  }\n\n  function hideOriginalData() {\n    container.querySelector('#original-data').style.display = 'none';\n  }\n\n  // フォームに記録データを設定\n  function populateFormWithRecord(record) {\n    const workDate = new Date(record.作業日 || record.workDate);\n    container.querySelector('#work-date').value = workDate.toISOString().split('T')[0];\n    \n    container.querySelector('#start-time').value = formatTimeForInput(record.作業開始時刻 || record.startTime);\n    container.querySelector('#end-time').value = formatTimeForInput(record.作業終了時刻 || record.endTime);\n    \n    // 中断記録があれば設定\n    const breakRecord = breakRecords.find(br => (br.作業記録ID || br.workRecordId) === selectedRecordId);\n    if (breakRecord) {\n      container.querySelector('#break-time').value = formatTimeForInput(breakRecord.中断開始日時 || breakRecord.startTime);\n      container.querySelector('#break-reason').value = breakRecord.中断理由区分 || breakRecord.reason || '';\n    }\n  }\n\n  function clearForm() {\n    container.querySelector('#work-date').value = '';\n    container.querySelector('#start-time').value = '';\n    container.querySelector('#end-time').value = '';\n    container.querySelector('#work-item').value = '';\n    container.querySelector('#break-time').value = '';\n    container.querySelector('#break-reason').value = '';\n    container.querySelector('#correction-reason').value = '';\n    hideWarnings();\n    hideErrors();\n  }\n\n  // 時刻フォーマット関数\n  function formatTime(timeStr) {\n    if (!timeStr) return '';\n    const date = new Date(timeStr);\n    return date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });\n  }\n\n  function formatTimeForInput(timeStr) {\n    if (!timeStr) return '';\n    const date = new Date(timeStr);\n    return date.toTimeString().slice(0, 5);\n  }\n\n  // 時間計算\n  function calculateTimes() {\n    const startTime = container.querySelector('#start-time').value;\n    const endTime = container.querySelector('#end-time').value;\n    const breakTime = container.querySelector('#break-time').value;\n    \n    if (startTime && endTime) {\n      const start = new Date(`2000-01-01T${startTime}`);\n      const end = new Date(`2000-01-01T${endTime}`);\n      \n      if (end > start) {\n        const totalMinutes = (end - start) / (1000 * 60);\n        let breakMinutes = 0;\n        \n        if (breakTime) {\n          const breakStart = new Date(`2000-01-01T${breakTime}`);\n          if (breakStart >= start && breakStart <= end) {\n            // 簡単な中断時間計算（1時間と仮定）\n            breakMinutes = 60;\n          }\n        }\n        \n        const actualMinutes = totalMinutes - breakMinutes;\n        const hours = Math.floor(actualMinutes / 60);\n        const minutes = actualMinutes % 60;\n        \n        container.querySelector('#break-duration').textContent = `${breakMinutes}分`;\n        container.querySelector('#actual-work-time').textContent = `${hours}時間${minutes}分`;\n        \n        // 異常値チェック\n        checkAbnormalValues(actualMinutes, totalMinutes);\n      }\n    }\n  }\n\n  // 異常値チェック\n  function checkAbnormalValues(actualMinutes, totalMinutes) {\n    const warnings = [];\n    \n    // 24時間を超える作業\n    if (totalMinutes > 24 * 60) {\n      warnings.push('作業時間が24時間を超えています');\n    }\n    \n    // 16時間を超える作業\n    if (actualMinutes > 16 * 60) {\n      warnings.push('実作業時間が16時間を超えています（長時間作業）');\n    }\n    \n    // 負の作業時間\n    if (actualMinutes < 0) {\n      warnings.push('作業時間が負の値になっています');\n    }\n    \n    if (warnings.length > 0) {\n      showWarnings(warnings);\n    } else {\n      hideWarnings();\n    }\n  }\n\n  function showWarnings(warnings) {\n    const warningArea = container.querySelector('#warning-area');\n    const messagesDiv = container.querySelector('#warning-messages');\n    messagesDiv.innerHTML = warnings.map(w => `<div>• ${w}</div>`).join('');\n    warningArea.style.display = 'block';\n  }\n\n  function hideWarnings() {\n    container.querySelector('#warning-area').style.display = 'none';\n  }\n\n  function showErrors(errors) {\n    const errorArea = container.querySelector('#error-area');\n    const messagesDiv = container.querySelector('#error-messages');\n    messagesDiv.innerHTML = errors.map(e => `<div>• ${e}</div>`).join('');\n    errorArea.style.display = 'block';\n  }\n\n  function hideErrors() {\n    container.querySelector('#error-area').style.display = 'none';\n  }\n\n  // バリデーション\n  function validateForm() {\n    const errors = [];\n    \n    if (!selectedRecordId) {\n      errors.push('修正対象記録を選択してください');\n    }\n    \n    const correctionReason = container.querySelector('#correction-reason').value.trim();\n    if (!correctionReason) {\n      errors.push('修正理由を入力してください');\n    }\n    \n    if (correctionReason.length > 200) {\n      errors.push('修正理由は200文字以内で入力してください');\n    }\n    \n    const workDate = container.querySelector('#work-date').value;\n    if (workDate) {\n      const date = new Date(workDate);\n      const minDate = new Date('1900-01-01');\n      const maxDate = new Date('2099-12-31');\n      if (date < minDate || date > maxDate) {\n        errors.push('作業日付は1900年1月1日から2099年12月31日の範囲で入力してください');\n      }\n    }\n    \n    const startTime = container.querySelector('#start-time').value;\n    const endTime = container.querySelector('#end-time').value;\n    if (startTime && endTime) {\n      const start = new Date(`2000-01-01T${startTime}`);\n      const end = new Date(`2000-01-01T${endTime}`);\n      if (start >= end) {\n        errors.push('開始時刻は終了時刻より前の時刻を入力してください');\n      }\n    }\n    \n    const breakTime = container.querySelector('#break-time').value;\n    if (breakTime && startTime && endTime) {\n      const breakStart = new Date(`2000-01-01T${breakTime}`);\n      const start = new Date(`2000-01-01T${startTime}`);\n      const end = new Date(`2000-01-01T${endTime}`);\n      if (breakStart < start || breakStart > end) {\n        errors.push('中断時刻が作業時間外です');\n      }\n    }\n    \n    return errors;\n  }\n\n  // 時間変更時の再計算\n  ['#start-time', '#end-time', '#break-time'].forEach(selector => {\n    container.querySelector(selector).addEventListener('change', calculateTimes);\n  });\n\n  // 保存ボタン\n  container.querySelector('#btn-save').addEventListener('click', async function() {\n    hideErrors();\n    \n    const errors = validateForm();\n    if (errors.length > 0) {\n      showErrors(errors);\n      return;\n    }\n    \n    try {\n      const updateData = {\n        作業日: container.querySelector('#work-date').value,\n        作業開始時刻: container.querySelector('#start-time').value ? `2000-01-01T${container.querySelector('#start-time').value}` : null,\n        作業終了時刻: container.querySelector('#end-time').value ? `2000-01-01T${container.querySelector('#end-time').value}` : null,\n        更新日時: new Date().toISOString()\n      };\n      \n      const result = await window.aivicApi.update(1, selectedRecordId, updateData);\n      if (result) {\n        // 中断記録も更新\n        const breakTime = container.querySelector('#break-time').value;\n        const breakReason = container.querySelector('#break-reason').value;\n        if (breakTime && breakReason) {\n          const breakRecord = breakRecords.find(br => (br.作業記録ID || br.workRecordId) === selectedRecordId);\n          if (breakRecord) {\n            await window.aivicApi.update(2, breakRecord.id || breakRecord.中断記録ID, {\n              中断開始日時: `2000-01-01T${breakTime}`,\n              中断理由区分: breakReason,\n              更新日時: new Date().toISOString()\n            });\n          }\n        }\n        \n        alert('修正が完了しました');\n        window.showScreen('scr-1778907145716'); // 作業履歴一覧画面\n      }\n    } catch (error) {\n      showErrors(['保存に失敗しました']);\n    }\n  });\n\n  // キャンセルボタン\n  container.querySelector('#btn-cancel').addEventListener('click', function() {\n    window.showScreen('scr-1778907145716'); // 作業履歴一覧画面\n  });\n\n  // 初期データ読み込み実行\n  loadInitialData();\n}";
</script>

  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
