ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックのインポート\n  const { calculateWorkDuration, validateWorkRecordData } = window.workRecordCalc || {};\n  const { validateRequiredFields, validateTimeSequence, validateWorkDuration: validateDuration } = window.validationCheck || {};\n  const { detectWorkTimeAnomalies, validateWorkRecordComprehensive } = window.anomalyDetection || {};\n  const { validateDataCompleteness, createModificationHistory } = window.qualityAssurance || {};\n\n  let currentRecord = null;\n  let workItems = [];\n  let breakRecords = [];\n\n  // DOM要素取得\n  const targetRecordSelect = container.querySelector('#target-record-select');\n  const originalDataArea = container.querySelector('#original-data-area');\n  const originalDataContent = container.querySelector('#original-data-content');\n  const editForm = container.querySelector('#edit-form');\n  const workDateInput = container.querySelector('#work-date');\n  const workItemSelect = container.querySelector('#work-item');\n  const startTimeInput = container.querySelector('#start-time');\n  const endTimeInput = container.querySelector('#end-time');\n  const breakTimeInput = container.querySelector('#break-time');\n  const breakReasonSelect = container.querySelector('#break-reason');\n  const breakDurationDiv = container.querySelector('#break-duration');\n  const actualWorkTimeDiv = container.querySelector('#actual-work-time');\n  const correctionReasonTextarea = container.querySelector('#correction-reason');\n  const reasonCharCount = container.querySelector('#reason-char-count');\n  const warningArea = container.querySelector('#warning-area');\n  const warningList = container.querySelector('#warning-list');\n  const errorArea = container.querySelector('#error-area');\n  const errorMessage = container.querySelector('#error-message');\n  const cancelBtn = container.querySelector('#cancel-btn');\n  const saveBtn = container.querySelector('#save-btn');\n\n  // 初期データ読み込み\n  async function loadInitialData() {\n    try {\n      // 作業記録一覧を取得\n      const workRecords = await window.aivicApi.list(1) || tables[1]?.records || [];\n      \n      // 作業項目マスタを取得\n      workItems = await window.aivicApi.list(3) || tables[3]?.records || [];\n      \n      // 中断記録を取得\n      breakRecords = await window.aivicApi.list(2) || tables[2]?.records || [];\n\n      // 修正対象記録のドロップダウンを更新\n      targetRecordSelect.innerHTML = '<option value=\"\">記録を選択してください</option>';\n      workRecords.forEach(record => {\n        const option = document.createElement('option');\n        option.value = record.作業記録ID || record.id;\n        option.textContent = `${record.作業日 || '未設定'} - ${record.作業内容 || '作業内容未設定'} (${record.作業員ID || 'ID未設定'})`;\n        targetRecordSelect.appendChild(option);\n      });\n\n      // 作業項目のドロップダウンを更新\n      workItemSelect.innerHTML = '<option value=\"\">選択してください</option>';\n      workItems\n        .filter(item => item.有効フラグ !== false)\n        .sort((a, b) => (a.表示順序 || 0) - (b.表示順序 || 0))\n        .forEach(item => {\n          const option = document.createElement('option');\n          option.value = item.作業項目ID || item.id;\n          option.textContent = `${item.作業項目コード || ''} - ${item.作業項目名 || ''}`;\n          workItemSelect.appendChild(option);\n        });\n\n      // 中断理由のドロップダウンを更新\n      if (breakReasonSelect) {\n        breakReasonSelect.innerHTML = '<option value=\"\">選択してください</option>';\n        const reasons = ['会議', '休憩', '移動', 'その他'];\n        reasons.forEach(reason => {\n          const option = document.createElement('option');\n          option.value = reason;\n          option.textContent = reason;\n          breakReasonSelect.appendChild(option);\n        });\n      }\n\n    } catch (error) {\n      console.error('初期データ読み込みエラー:', error);\n      if (window.aivicNotify) {\n        window.aivicNotify.error('初期データの読み込みに失敗しました');\n      }\n    }\n  }\n\n  // 修正対象記録選択時の処理\n  targetRecordSelect.addEventListener('change', async function() {\n    const recordId = this.value;\n    if (!recordId) {\n      originalDataArea.style.display = 'none';\n      editForm.style.display = 'none';\n      currentRecord = null;\n      return;\n    }\n\n    try {\n      // 選択された記録を取得\n      const workRecords = await window.aivicApi.list(1) || tables[1]?.records || [];\n      currentRecord = workRecords.find(r => (r.作業記録ID || r.id) == recordId);\n      \n      if (!currentRecord) {\n        throw new Error('記録が見つかりません');\n      }\n\n      // 元データ表示\n      displayOriginalData(currentRecord);\n      \n      // 編集フォームに値を設定\n      populateEditForm(currentRecord);\n      \n      // 表示切り替え\n      originalDataArea.style.display = 'block';\n      editForm.style.display = 'block';\n\n    } catch (error) {\n      console.error('記録取得エラー:', error);\n      if (window.aivicNotify) {\n        window.aivicNotify.error('記録の取得に失敗しました');\n      }\n    }\n  });\n\n  // 元データ表示\n  function displayOriginalData(record) {\n    const html = `\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 12px;\">\n        <div><strong>作業日:</strong> ${record.作業日 || '未設定'}</div>\n        <div><strong>作業項目:</strong> ${record.作業項目名 || '未設定'}</div>\n        <div><strong>開始時刻:</strong> ${record.開始時刻 || '未設定'}</div>\n        <div><strong>終了時刻:</strong> ${record.終了時刻 || '未設定'}</div>\n        <div><strong>中断時間:</strong> ${record.中断時間 || '0'}分</div>\n        <div><strong>実作業時間:</strong> ${record.実作業時間 || '未計算'}</div>\n      </div>\n      <div style=\"margin-top: 8px; font-size: 12px;\">\n        <strong>作業内容:</strong><br>\n        <div style=\"background: #f5f5f5; padding: 8px; border-radius: 4px; margin-top: 4px;\">\n          ${record.作業内容 || '未設定'}\n        </div>\n      </div>\n    `;\n    originalDataContent.innerHTML = html;\n  }\n\n  // 編集フォームに値を設定\n  function populateEditForm(record) {\n    if (workDateInput) workDateInput.value = record.作業日 || '';\n    if (workItemSelect) workItemSelect.value = record.作業項目ID || '';\n    if (startTimeInput) startTimeInput.value = record.開始時刻 || '';\n    if (endTimeInput) endTimeInput.value = record.終了時刻 || '';\n    if (breakTimeInput) breakTimeInput.value = record.中断時間 || '';\n    \n    const workContentTextarea = container.querySelector('textarea[placeholder=\"作業内容\"]');\n    if (workContentTextarea) workContentTextarea.value = record.作業内容 || '';\n    \n    // 実作業時間を計算・表示\n    calculateAndDisplayWorkTime();\n  }\n\n  // 実作業時間計算・表示\n  function calculateAndDisplayWorkTime() {\n    const startTime = startTimeInput?.value;\n    const endTime = endTimeInput?.value;\n    const breakMinutes = parseInt(breakTimeInput?.value || '0');\n\n    if (startTime && endTime) {\n      try {\n        // 業務ロジックを使用して作業時間を計算\n        const duration = calculateWorkDuration ? \n          calculateWorkDuration(startTime, endTime, breakMinutes) :\n          calculateWorkTimeManual(startTime, endTime, breakMinutes);\n\n        if (actualWorkTimeDiv) {\n          actualWorkTimeDiv.textContent = `${duration.hours}時間${duration.minutes}分`;\n        }\n\n        // 計算結果をdata属性として設定（テスト用）\n        const calculatedSpan = container.querySelector('span[data-calculated=\"work_hours\"]');\n        if (calculatedSpan) {\n          calculatedSpan.textContent = `${duration.hours}.${Math.round(duration.minutes / 60 * 10)}`;\n        }\n\n      } catch (error) {\n        console.error('作業時間計算エラー:', error);\n        if (actualWorkTimeDiv) {\n          actualWorkTimeDiv.textContent = '計算エラー';\n        }\n      }\n    }\n  }\n\n  // 手動計算（フォールバック）\n  function calculateWorkTimeManual(startTime, endTime, breakMinutes) {\n    const [startHour, startMin] = startTime.split(':').map(Number);\n    const [endHour, endMin] = endTime.split(':').map(Number);\n    \n    const startTotalMin = startHour * 60 + startMin;\n    const endTotalMin = endHour * 60 + endMin;\n    const workTotalMin = endTotalMin - startTotalMin - breakMinutes;\n    \n    return {\n      hours: Math.floor(workTotalMin / 60),\n      minutes: workTotalMin % 60\n    };\n  }\n\n  // 時刻入力時の自動計算\n  if (startTimeInput) {\n    startTimeInput.addEventListener('change', calculateAndDisplayWorkTime);\n  }\n  if (endTimeInput) {\n    endTimeInput.addEventListener('change', calculateAndDisplayWorkTime);\n  }\n  if (breakTimeInput) {\n    breakTimeInput.addEventListener('input', calculateAndDisplayWorkTime);\n  }\n\n  // 修正理由の文字数カウント\n  if (correctionReasonTextarea && reasonCharCount) {\n    correctionReasonTextarea.addEventListener('input', function() {\n      const count = this.value.length;\n      reasonCharCount.textContent = `${count}/500`;\n      if (count > 500) {\n        reasonCharCount.style.color = 'red';\n      } else {\n        reasonCharCount.style.color = '';\n      }\n    });\n  }\n\n  // バリデーション実行\n  function validateForm() {\n    const errors = [];\n    const warnings = [];\n\n    // 必須項目チェック\n    if (!currentRecord) {\n      errors.push('修正対象の記録が選択されていません');\n    }\n\n    const workDate = workDateInput?.value;\n    const startTime = startTimeInput?.value;\n    const endTime = endTimeInput?.value;\n    const workContent = container.querySelector('textarea[placeholder=\"作業内容\"]')?.value;\n\n    if (!workDate) errors.push('作業日を入力してください');\n    if (!startTime) errors.push('開始時刻を入力してください');\n    if (!endTime) errors.push('終了時刻を入力してください');\n    if (!workContent?.trim()) errors.push('作業内容を入力してください');\n\n    // 業務ロジックによるバリデーション\n    if (validateRequiredFields) {\n      const requiredValidation = validateRequiredFields({\n        作業日: workDate,\n        開始時刻: startTime,\n        終了時刻: endTime,\n        作業内容: workContent\n      });\n      if (!requiredValidation.isValid) {\n        errors.push(...requiredValidation.errors);\n      }\n    }\n\n    // 時刻順序チェック\n    if (startTime && endTime && validateTimeSequence) {\n      const timeValidation = validateTimeSequence(startTime, endTime);\n      if (!timeValidation.isValid) {\n        errors.push('終了時刻は開始時刻より後に設定してください');\n      }\n    }\n\n    // 異常検知\n    if (detectWorkTimeAnomalies && startTime && endTime) {\n      const anomalies = detectWorkTimeAnomalies({\n        開始時刻: startTime,\n        終了時刻: endTime,\n        中断時間: parseInt(breakTimeInput?.value || '0')\n      });\n      if (anomalies.length > 0) {\n        warnings.push(...anomalies.map(a => a.message));\n      }\n    }\n\n    return { errors, warnings };\n  }\n\n  // エラー・警告表示\n  function displayValidationResults(errors, warnings) {\n    // エラー表示\n    if (errors.length > 0) {\n      errorArea.style.display = 'block';\n      errorMessage.textContent = errors[0];\n    } else {\n      errorArea.style.display = 'none';\n    }\n\n    // 警告表示\n    if (warnings.length > 0) {\n      warningArea.style.display = 'block';\n      warningList.innerHTML = warnings.map(w => `<li>${w}</li>`).join('');\n    } else {\n      warningArea.style.display = 'none';\n    }\n  }\n\n  // 保存処理\n  async function saveRecord() {\n    try {\n      const { errors, warnings } = validateForm();\n      displayValidationResults(errors, warnings);\n\n      if (errors.length > 0) {\n        return;\n      }\n\n      // フォームデータ収集\n      const formData = {\n        作業記録ID: currentRecord.作業記録ID || currentRecord.id,\n        作業日: workDateInput?.value,\n        作業項目ID: workItemSelect?.value,\n        開始時刻: startTimeInput?.value,\n        終了時刻: endTimeInput?.value,\n        中断時間: parseInt(breakTimeInput?.value || '0'),\n        作業内容: container.querySelector('textarea[placeholder=\"作業内容\"]')?.value,\n        修正理由: correctionReasonTextarea?.value\n      };\n\n      // 実作業時間を計算\n      if (calculateWorkDuration) {\n        const duration = calculateWorkDuration(\n          formData.開始時刻, \n          formData.終了時刻, \n          formData.中断時間\n        );\n        formData.実作業時間 = `${duration.hours}:${String(duration.minutes).padStart(2, '0')}`;\n      }\n\n      // 修正履歴作成\n      if (createModificationHistory) {\n        const history = createModificationHistory(currentRecord, formData, {\n          修正者:     <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();
