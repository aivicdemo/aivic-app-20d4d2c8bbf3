ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックモジュールのインポート\n  const { \n    validateRequiredFields, \n    detectAnomalousValues, \n    calculateWorkTime,\n    saveWorkData,\n    validateWorkRecord,\n    correctWorkData,\n    approveDataCorrections,\n    calculateActualWorkHours,\n    checkDataIntegrity,\n    modifyWorkData,\n    approveModification,\n    recordModificationHistory,\n    validateApprovalProcess\n  } = window.workRecordCalc || {};\n\n  let workRecords = [];\n  let workItems = [];\n  let breakRecords = [];\n  let selectedRecord = null;\n\n  // エラーメッセージ表示\n  function showError(message) {\n    const errorDiv = container.querySelector('#error-messages');\n    if (errorDiv) {\n      errorDiv.innerHTML = `<div style=\"padding: 8px 12px; background: rgba(220, 38, 38, 0.1); border: 1px solid rgba(220, 38, 38, 0.3); border-radius: 6px; color: #fca5a5; font-size: 13px; margin-bottom: 8px;\">${message}</div>`;\n      setTimeout(() => errorDiv.innerHTML = '', 5000);\n    }\n    if (window.aivicNotify) {\n      window.aivicNotify.error(message);\n    }\n  }\n\n  // 成功メッセージ表示\n  function showSuccess(message) {\n    const errorDiv = container.querySelector('#error-messages');\n    if (errorDiv) {\n      errorDiv.innerHTML = `<div style=\"padding: 8px 12px; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); border-radius: 6px; color: #86efac; font-size: 13px; margin-bottom: 8px;\">${message}</div>`;\n      setTimeout(() => errorDiv.innerHTML = '', 3000);\n    }\n    if (window.aivicNotify) {\n      window.aivicNotify.success(message);\n    }\n  }\n\n  // 異常値警告表示\n  function showAnomalyWarnings(warnings) {\n    const warningDiv = container.querySelector('#anomaly-warnings');\n    if (!warningDiv) return;\n    \n    if (warnings.length === 0) {\n      warningDiv.innerHTML = '';\n      return;\n    }\n    \n    const warningHtml = warnings.map(warning => \n      `<div style=\"padding: 6px 10px; background: rgba(251, 146, 60, 0.1); border: 1px solid rgba(251, 146, 60, 0.3); border-radius: 4px; color: #fed7aa; font-size: 12px; margin-bottom: 4px;\">${warning}</div>`\n    ).join('');\n    warningDiv.innerHTML = warningHtml;\n  }\n\n  // 時刻計算\n  function calculateTimes() {\n    const startTimeInput = container.querySelector('[data-testid=\"start-time\"]');\n    const endTimeInput = container.querySelector('[data-testid=\"end-time\"]');\n    const breakDurationInput = container.querySelector('[data-testid=\"break-duration\"]');\n    const actualWorkTimeDisplay = container.querySelector('[data-testid=\"actual-work-time\"]');\n    \n    if (!startTimeInput || !endTimeInput) return;\n    \n    const startTime = startTimeInput.value;\n    const endTime = endTimeInput.value;\n    const breakDuration = parseInt(breakDurationInput?.value || '0');\n    \n    if (startTime && endTime) {\n      try {\n        const workData = {\n          startTime,\n          endTime,\n          breakDuration\n        };\n        \n        if (calculateActualWorkHours) {\n          const actualHours = calculateActualWorkHours(workData);\n          if (actualWorkTimeDisplay) {\n            actualWorkTimeDisplay.textContent = `${actualHours.toFixed(1)}時間`;\n          }\n        }\n        \n        // 異常値検出\n        if (detectAnomalousValues) {\n          const anomalies = detectAnomalousValues(workData);\n          showAnomalyWarnings(anomalies);\n        }\n      } catch (error) {\n        console.error('時刻計算エラー:', error);\n      }\n    }\n  }\n\n  // 修正対象記録の詳細表示\n  function displayOriginalData(record) {\n    const originalDataDiv = container.querySelector('#original-data');\n    if (!originalDataDiv || !record) return;\n\n    const originalHtml = `\n      <div style=\"padding: 12px; background: rgba(100, 116, 139, 0.1); border-radius: 6px; margin-top: 12px;\">\n        <h4 style=\"margin: 0 0 8px 0; font-size: 13px; color: var(--text-muted);\">修正前データ</h4>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; font-size: 12px;\">\n          <div>作業日: ${record.workDate || '-'}</div>\n          <div>開始: ${record.startTime || '-'}</div>\n          <div>終了: ${record.endTime || '-'}</div>\n          <div>作業項目: ${record.workItem || '-'}</div>\n          <div>中断時刻: ${record.breakTime || '-'}</div>\n          <div>中断理由: ${record.breakReason || '-'}</div>\n        </div>\n      </div>\n    `;\n    originalDataDiv.innerHTML = originalHtml;\n  }\n\n  // フォームに記録データを設定\n  function populateForm(record) {\n    if (!record) return;\n\n    const workDateInput = container.querySelector('[data-testid=\"work-date\"]');\n    const startTimeInput = container.querySelector('[data-testid=\"start-time\"]');\n    const endTimeInput = container.querySelector('[data-testid=\"end-time\"]');\n    const workItemSelect = container.querySelector('[data-testid=\"work-item\"]');\n    const breakTimeInput = container.querySelector('[data-testid=\"break-time\"]');\n    const breakReasonSelect = container.querySelector('[data-testid=\"break-reason\"]');\n    const breakDurationInput = container.querySelector('[data-testid=\"break-duration\"]');\n\n    if (workDateInput) workDateInput.value = record.workDate || '';\n    if (startTimeInput) startTimeInput.value = record.startTime || '';\n    if (endTimeInput) endTimeInput.value = record.endTime || '';\n    if (workItemSelect) workItemSelect.value = record.workItemId || '';\n    if (breakTimeInput) breakTimeInput.value = record.breakTime || '';\n    if (breakReasonSelect) breakReasonSelect.value = record.breakReason || '';\n    if (breakDurationInput) breakDurationInput.value = record.breakDuration || '';\n\n    displayOriginalData(record);\n    calculateTimes();\n  }\n\n  // データ読み込み\n  async function loadData() {\n    try {\n      // 作業記録一覧取得\n      if (window.aivicApi) {\n        const recordsResponse = await window.aivicApi.list('work_records');\n        workRecords = recordsResponse.data || [];\n\n        const itemsResponse = await window.aivicApi.list('work_items');\n        workItems = itemsResponse.data || [];\n      }\n\n      // 修正対象記録セレクトボックス更新\n      const targetRecordSelect = container.querySelector('[data-testid=\"target-record\"]');\n      if (targetRecordSelect) {\n        targetRecordSelect.innerHTML = '<option value=\"\">修正対象を選択してください</option>';\n        workRecords.forEach(record => {\n          const option = document.createElement('option');\n          option.value = record.id;\n          option.textContent = `${record.workDate} ${record.startTime}-${record.endTime} (${record.workItem})`;\n          targetRecordSelect.appendChild(option);\n        });\n      }\n\n      // 作業項目セレクトボックス更新\n      const workItemSelect = container.querySelector('[data-testid=\"work-item\"]');\n      if (workItemSelect) {\n        workItemSelect.innerHTML = '<option value=\"\">作業項目を選択</option>';\n        workItems.forEach(item => {\n          const option = document.createElement('option');\n          option.value = item.id;\n          option.textContent = item.name;\n          workItemSelect.appendChild(option);\n        });\n      }\n\n      // 中断理由セレクトボックス更新\n      const breakReasonSelect = container.querySelector('[data-testid=\"break-reason\"]');\n      if (breakReasonSelect) {\n        const reasons = ['機械故障', '材料不足', '指示待ち', '会議', 'その他'];\n        breakReasonSelect.innerHTML = '<option value=\"\">中断理由を選択</option>';\n        reasons.forEach(reason => {\n          const option = document.createElement('option');\n          option.value = reason;\n          option.textContent = reason;\n          breakReasonSelect.appendChild(option);\n        });\n      }\n\n    } catch (error) {\n      console.error('データ読み込みエラー:', error);\n      showError('データの読み込みに失敗しました');\n    }\n  }\n\n  // 修正保存処理\n  async function saveCorrection() {\n    try {\n      const targetRecordSelect = container.querySelector('[data-testid=\"target-record\"]');\n      const workDateInput = container.querySelector('[data-testid=\"work-date\"]');\n      const startTimeInput = container.querySelector('[data-testid=\"start-time\"]');\n      const endTimeInput = container.querySelector('[data-testid=\"end-time\"]');\n      const workItemSelect = container.querySelector('[data-testid=\"work-item\"]');\n      const breakTimeInput = container.querySelector('[data-testid=\"break-time\"]');\n      const breakReasonSelect = container.querySelector('[data-testid=\"break-reason\"]');\n      const breakDurationInput = container.querySelector('[data-testid=\"break-duration\"]');\n      const correctionReasonInput = container.querySelector('[data-testid=\"correction-reason\"]');\n\n      if (!targetRecordSelect?.value) {\n        showError('修正対象記録を選択してください');\n        return;\n      }\n\n      const correctionData = {\n        recordId: targetRecordSelect.value,\n        workDate: workDateInput?.value,\n        startTime: startTimeInput?.value,\n        endTime: endTimeInput?.value,\n        workItemId: workItemSelect?.value,\n        breakTime: breakTimeInput?.value,\n        breakReason: breakReasonSelect?.value,\n        breakDuration: breakDurationInput?.value,\n        correctionReason: correctionReasonInput?.value\n      };\n\n      // 必須項目検証\n      if (validateRequiredFields) {\n        const validation = validateRequiredFields(correctionData);\n        if (!validation.isValid) {\n          showError(validation.message);\n          return;\n        }\n      }\n\n      // 作業記録検証\n      if (validateWorkRecord) {\n        const recordValidation = validateWorkRecord(correctionData);\n        if (!recordValidation.isValid) {\n          showError(recordValidation.message);\n          return;\n        }\n      }\n\n      // データ整合性チェック\n      if (checkDataIntegrity) {\n        const integrityCheck = checkDataIntegrity(correctionData);\n        if (!integrityCheck.isValid) {\n          showError(integrityCheck.message);\n          return;\n        }\n      }\n\n      // 修正データ処理\n      let correctedData = correctionData;\n      if (correctWorkData) {\n        correctedData = correctWorkData(correctionData);\n      } else if (modifyWorkData) {\n        correctedData = modifyWorkData(correctionData);\n      }\n\n      // 承認プロセス検証\n      if (validateApprovalProcess) {\n        const approvalValidation = validateApprovalProcess(correctedData);\n        if (!approvalValidation.isValid) {\n          showError(approvalValidation.message);\n          return;\n        }\n      }\n\n      // 修正履歴記録\n      if (recordModificationHistory) {\n        recordModificationHistory({\n          originalRecord: selectedRecord,\n          correctedData: correctedData,\n          reason: correctionData.correctionReason,\n          timestamp: new Date().toISOString()\n        });\n      }\n\n      // データ保存\n      if (window.aivicApi) {\n        await window.aivicApi.update('work_records', correctionData.recordId, correctedData);\n      }\n\n      // 承認処理\n      if (approveDataCorrections) {\n        approveDataCorrections(correctedData);\n      } else if (approveModification) {\n        approveModification(correctedData);\n      }\n\n      showSuccess('修正完了');\n      \n      // フォームリセット\n      if (correctionReasonInput) correctionReasonInput.value = '';\n      \n      // データ再読み込み\n      await loadData();\n\n    } catch (error) {\n      console.error('修正保存エラー:', error);\n      showError('修正の保存に失敗しました');\n    }\n  }\n\n  // イベントハンドラー設定\n  function setupEventHandlers() {\n    // 修正対象記録選択\n    const targetRecordSelect = container.querySelector('[data-testid=\"target-record\"]');\n    if (targetRecordSelect) {\n      targetRecordSelect.addEventListener('change', (e) => {\n        const recordId = e.target.value;\n        selectedRecord = workRecords.find(r => r.id === recordId);\n        if (selectedRecord) {\n          populateForm(selectedRecord);\n        } else {\n          // フォームクリア\n          const inputs = container.querySelectorAll('input, select');\n          inputs.forEach(input => {\n            if (input.dataset.testid !== 'target-record') {\n              input.value = '';\n            }\n          });\n          const originalDataDiv = container.querySelector('#original-data');\n          if (originalDataDiv) originalDataDiv.innerHTML = '';\n        }\n      });\n    }\n\n    // 時刻変更時の自動計算\n    const startTimeInput = container.querySelector('[data-testid=\"start-time\"]');\n    const endTimeInput = container.querySelector('[data-testid=\"end-time\"]');\n    const breakDurationInput = container.querySelector('[data-testid=\"break-duration\"]');\n\n    if (startTimeInput) {\n      startTimeInput.addEventListener('change', calculateTimes);\n    }\n    if (endTimeInput) {\n      endTimeInput.addEventListener('change', calculateTimes);\n    }\n    if (breakDurationInput) {\n      breakDurationInput.addEventListener('change', calculateTimes);\n    }\n\n    // 保存ボタン\n    const saveButton = container.querySelector('[data-testid=\"save-button\"]');\n    if (saveButton) {\n      saveButton.addEventListener('click', saveCorrection);\n    }\n  }\n\n  // 初期化\n  async function initialize() {\n    await loadData();\n    setupEventHandlers();\n  }\n\n  // 初期化実行\n  initialize().catch(error => {\n    console.error('初期化エラー:', error);\n    showError('画面の初期化に失敗しました');\n  });\n}";
</script>

      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
