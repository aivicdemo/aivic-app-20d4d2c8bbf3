breakRecords.find(br => br.作業記録ID === record.作業記録ID);\n    \n    contentDiv.innerHTML = `\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 11px;\">\n        <div><strong>作業日:</strong> ${record.作業日?.split('T')[0] || '-'}</div>\n        <div><strong>作業項目:</strong> ${workItem?.作業項目名 || '-'}</div>\n        <div><strong>開始時刻:</strong> ${record.作業開始時刻 ? new Date(record.作業開始時刻).toLocaleTimeString('ja-JP', {hour: '2-digit', minute: '2-digit'}) : '-'}</div>\n        <div><strong>終了時刻:</strong> ${record.作業終了時刻 ? new Date(record.作業終了時刻).toLocaleTimeString('ja-JP', {hour: '2-digit', minute: '2-digit'}) : '-'}</div>\n        <div><strong>中断時刻:</strong> ${breakRecord?.中断開始日時 ? new Date(breakRecord.中断開始日時).toLocaleTimeString('ja-JP', {hour: '2-digit', minute: '2-digit'}) : '-'}</div>\n        <div><strong>中断理由:</strong> ${breakRecord?.中断理由区分 || '-'}</div>\n      </div>\n    `;\n    \n    originalDataDiv.style.display = 'block';\n  }\n\n  // フォームに値を設定\n  function populateForm(record) {\n    const workItem = workItems.find(item => item.作業項目ID === record.作業項目ID);\n    const breakRecord = breakRecords.find(br => br.作業記録ID === record.作業記録ID);\n    originalBreakRecord = breakRecord;\n    \n    container.querySelector('#work-date').value = record.作業日?.split('T')[0] || '';\n    container.querySelector('#work-item').value = record.作業項目ID || '';\n    \n    if (record.作業開始時刻) {\n      const startTime = new Date(record.作業開始時刻);\n      container.querySelector('#start-time').value = startTime.toTimeString().slice(0, 5);\n    }\n    \n    if (record.作業終了時刻) {\n      const endTime = new Date(record.作業終了時刻);\n      container.querySelector('#end-time').value = endTime.toTimeString().slice(0, 5);\n    }\n    \n    if (breakRecord?.中断開始日時) {\n      const breakTime = new Date(breakRecord.中断開始日時);\n      container.querySelector('#break-time').value = breakTime.toTimeString().slice(0, 5);\n    }\n    \n    container.querySelector('#break-reason').value = breakRecord?.中断理由区分 || '';\n    \n    calculateTimes();\n  }\n\n  // 時間計算\n  function calculateTimes() {\n    const startTime = container.querySelector('#start-time').value;\n    const endTime = container.querySelector('#end-time').value;\n    const breakTime = container.querySelector('#break-time').value;\n    \n    let breakDuration = 0;\n    let actualWorkTime = 0;\n    \n    if (startTime && endTime) {\n      const start = new Date(`2000-01-01T${startTime}:00`);\n      const end = new Date(`2000-01-01T${endTime}:00`);\n      \n      if (end > start) {\n        const totalMinutes = (end - start) / (1000 * 60);\n        \n        if (breakTime) {\n          const breakStart = new Date(`2000-01-01T${breakTime}:00`);\n          if (breakStart >= start && breakStart <= end) {\n            // 簡易的に30分の中断として計算\n            breakDuration = 30;\n          }\n        }\n        \n        actualWorkTime = totalMinutes - breakDuration;\n        \n        container.querySelector('#break-duration').textContent = breakDuration > 0 ? `${breakDuration}分` : '-';\n        container.querySelector('#actual-work-time').textContent = actualWorkTime > 0 ? `${Math.floor(actualWorkTime / 60)}時間${actualWorkTime % 60}分` : '-';\n      }\n    }\n  }\n\n  // バリデーション\n  function validateForm() {\n    const errors = [];\n    const warnings = [];\n    \n    const targetRecord = container.querySelector('#target-record').value;\n    const workDate = container.querySelector('#work-date').value;\n    const startTime = container.querySelector('#start-time').value;\n    const endTime = container.querySelector('#end-time').value;\n    const breakTime = container.querySelector('#break-time').value;\n    const correctionReason = container.querySelector('#correction-reason').value.trim();\n    \n    // 必須チェック\n    if (!targetRecord) {\n      errors.push('修正対象の記録を選択してください');\n    }\n    \n    if (!correctionReason) {\n      errors.push('修正理由を入力してください');\n    }\n    \n    // 日付チェック\n    if (workDate) {\n      const date = new Date(workDate);\n      const today = new Date();\n      const minDate = new Date('1900-01-01');\n      const maxDate = new Date('2099-12-31');\n      \n      if (date < minDate || date > maxDate) {\n        errors.push('作業日付は1900年1月1日から2099年12月31日の間で入力してください');\n      }\n      \n      if (date > today) {\n        warnings.push('未来の日付が入力されています');\n      }\n    }\n    \n    // 時刻チェック\n    if (startTime && endTime) {\n      const start = new Date(`2000-01-01T${startTime}:00`);\n      const end = new Date(`2000-01-01T${endTime}:00`);\n      \n      if (start >= end) {\n        errors.push('開始時刻は終了時刻より前の時刻を入力してください');\n      }\n      \n      const totalHours = (end - start) / (1000 * 60 * 60);\n      if (totalHours > 20) {\n        warnings.push('24時間近い作業時間が入力されています。確認してください。');\n      }\n    }\n    \n    // 中断時刻チェック\n    if (breakTime && startTime && endTime) {\n      const breakStart = new Date(`2000-01-01T${breakTime}:00`);\n      const start = new Date(`2000-01-01T${startTime}:00`);\n      const end = new Date(`2000-01-01T${endTime}:00`);\n      \n      if (breakStart < start || breakStart > end) {\n        errors.push('中断時刻が作業時間外です');\n      }\n    }\n    \n    return { errors, warnings };\n  }\n\n  // エラー・警告表示\n  function showValidationMessages(errors, warnings) {\n    const errorArea = container.querySelector('#error-area');\n    const warningArea = container.querySelector('#warning-area');\n    const errorMessages = container.querySelector('#error-messages');\n    const warningMessages = container.querySelector('#warning-messages');\n    \n    if (errors.length > 0) {\n      errorMessages.innerHTML = errors.map(err => `<div>• ${err}</div>`).join('');\n      errorArea.style.display = 'block';\n    } else {\n      errorArea.style.display = 'none';\n    }\n    \n    if (warnings.length > 0) {\n      warningMessages.innerHTML = warnings.map(warn => `<div>• ${warn}</div>`).join('');\n      warningArea.style.display = 'block';\n    } else {\n      warningArea.style.display = 'none';\n    }\n  }\n\n  // 文字数カウント\n  container.querySelector('#correction-reason').addEventListener('input', function() {\n    const charCount = container.querySelector('#char-count');\n    charCount.textContent = this.value.length;\n  });\n\n  // 修正対象記録選択\n  container.querySelector('#target-record').addEventListener('change', function() {\n    const recordId = this.value;\n    if (recordId) {\n      selectedRecord = workRecords.find(record => record.作業記録ID === recordId);\n      if (selectedRecord) {\n        showOriginalData(selectedRecord);\n        populateForm(selectedRecord);\n        container.querySelector('#edit-form').style.display = 'block';\n      }\n    } else {\n      selectedRecord = null;\n      container.querySelector('#original-data').style.display = 'none';\n      container.querySelector('#edit-form').style.display = 'none';\n    }\n  });\n\n  // 時間変更時の自動計算\n  ['#start-time', '#end-time', '#break-time'].forEach(selector => {\n    container.querySelector(selector).addEventListener('change', calculateTimes);\n  });\n\n  // 保存ボタン\n  container.querySelector('#btn-save').addEventListener('click', async function() {\n    if (!selectedRecord) {\n      showValidationMessages(['修正対象の記録を選択してください'], []);\n      return;\n    }\n    \n    const validation = validateForm();\n    showValidationMessages(validation.errors, validation.warnings);\n    \n    if (validation.errors.length > 0) {\n      return;\n    }\n    \n    try {\n      const workDate = container.querySelector('#work-date').value;\n      const workItemId = container.querySelector('#work-item').value;\n      const startTime = container.querySelector('#start-time').value;\n      const endTime = container.querySelector('#end-time').value;\n      const breakTime = container.querySelector('#break-time').value;\n      const breakReason = container.querySelector('#break-reason').value;\n      const correctionReason = container.querySelector('#correction-reason').value.trim();\n      \n      // 作業記録更新\n      const updateData = {\n        作業日: workDate ? new Date(workDate).toISOString() : selectedRecord.作業日,\n        作業項目ID: workItemId || selectedRecord.作業項目ID,\n        作業開始時刻: startTime ? new Date(`${workDate}T${startTime}:00`).toISOString() : selectedRecord.作業開始時刻,\n        作業終了時刻: endTime ? new Date(`${workDate}T${endTime}:00`).toISOString() : selectedRecord.作業終了時刻,\n        更新日時: new Date().toISOString()\n      };\n      \n      await window.aivicApi.update(1, selectedRecord.作業記録ID, updateData);\n      \n      // 中断記録の更新または作成\n      if (breakTime && breakReason) {\n        const breakData = {\n          作業記録ID: selectedRecord.作業記録ID,\n          中断開始日時: new Date(`${workDate}T${breakTime}:00`).toISOString(),\n          中断理由区分: breakReason,\n          中断理由詳細: correctionReason,\n          記録者ID: selectedRecord.作業員ID,\n          更新日時: new Date().toISOString()\n        };\n        \n        if (originalBreakRecord) {\n          await window.aivicApi.update(2, originalBreakRecord.中断記録ID, breakData);\n        } else {\n          breakData.中断記録ID = crypto.randomUUID();\n          breakData.対応状況 = '未対応';\n          breakData.作成日時 = new Date().toISOString();\n          await window.aivicApi.save(2, breakData);\n        }\n      }\n      \n      alert('修正が完了しました');\n      \n      // データ再読み込み\n      await loadData();\n      \n      // フォームリセット\n      container.querySelector('#target-record').value = '';\n      container.querySelector('#original-data').style.display = 'none';\n      container.querySelector('#edit-form').style.display = 'none';\n      container.querySelector('#correction-reason').value = '';\n      container.querySelector('#char-count').textContent = '0';\n      showValidationMessages([], []);\n      \n    } catch (error) {\n      console.error('保存エラー:', error);\n      showValidationMessages(['保存に失敗しました'], []);\n    }\n  });\n\n  // キャンセルボタン\n  container.querySelector('#btn-cancel').addEventListener('click', function() {\n    window.showScreen('scr-1778907145716'); // 作業履歴一覧画面\n  });\n\n  // 初期化\n  loadData();\n}";

      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
