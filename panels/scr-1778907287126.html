window.AIVIC_PAGE_INIT_JS = "function(container, tables) {\n  // 業務ロジックモジュールのインポート\n  const { validateRequiredFields, detectAnomalousValues, checkDataIntegrity, correctWorkData, approveDataCorrections, generateWeeklyReport, detectAnomaliesAndGaps, saveWorkData, validateWorkRecord, calculateWorkTime, updateWorkStatus } = window.workValidation || {};\n  const { detectOvertimeAnomaly, detectNegativeValue, detectExcessiveInterruption, detectStatisticalAnomaly, calculateAnomalyScore, detectShortWorkAnomaly, detectLongWorkAnomaly, detectTimeSequenceAnomaly, detectProductivityAnomaly, detectEmergencyWorkAnomaly, filterAnomalousRecords, detectPlanDeviationAnomaly, detectExtremeAnomaly } = window.anomalyDetection || {};\n  const { detectMissingData, interpolateMissingValues, validateDataCompleteness, calculateDataReliability, correctAnomalousData, generateDataQualityReport } = window.dataQuality || {};\n  \n  // 利用可能な業務ロジックモジュールからインポート\n  const { startWorkRecord, endWorkRecord, detectAnomalousValue, recordInterruption, syncOfflineData, completeWork, saveWorkRecord, verifyDataIntegrity, modifyWorkData, approveModification, analyzeWorkPerformance, determinePriority, allocatePersonnel, confirmPreviousDayData, identifyMissingData, analyzeWorkEfficiency } = window.allLogic || {};\n\n  // DOM要素の取得\n  const startDateInput = container.querySelector('#start-date') || container.querySelector('[data-testid=\"start-date\"]');\n  const endDateInput = container.querySelector('#end-date') || container.querySelector('[data-testid=\"end-date\"]');\n  const executeBtn = container.querySelector('#btn-execute') || container.querySelector('[data-testid=\"execute-validation\"]');\n  const progressArea = container.querySelector('#progress-area');\n  const progressBar = container.querySelector('[data-testid=\"progress-bar\"]');\n  const progressText = container.querySelector('#progress-text');\n  const anomalyDetectBtn = container.querySelector('button:has-text(\"異常値検出処理\")') || container.querySelector('[data-testid=\"detect-anomalies\"]');\n  const anomalyList = container.querySelector('[data-testid=\"anomaly-list\"]');\n  const anomalyTbody = container.querySelector('#anomaly-tbody');\n  const errorTypeFilter = container.querySelector('#error-type-filter') || container.querySelector('[data-testid=\"error-type-filter\"]');\n  const filterBtn = container.querySelector('#btn-filter') || container.querySelector('[data-testid=\"filter-button\"]');\n  const correctionModal = container.querySelector('#correction-modal');\n  const editWorkContent = container.querySelector('#edit-work-content') || container.querySelector('[data-testid=\"edit-work-content\"]');\n  const saveEditBtn = container.querySelector('#btn-save-edit') || container.querySelector('[data-testid=\"save-edit\"]');\n  const selectAllCheckbox = container.querySelector('#select-all') || container.querySelector('[data-testid=\"select-all\"]');\n  const bulkApproveBtn = container.querySelector('#btn-bulk-approve') || container.querySelector('[data-testid=\"bulk-approve\"]');\n  const exportLogBtn = container.querySelector('#btn-export-log') || container.querySelector('[data-testid=\"export-log\"]');\n  const reValidateBtn = container.querySelector('#btn-re-validate') || container.querySelector('[data-testid=\"re-validate\"]');\n  const notificationArea = container.querySelector('#notification-area');\n  const notificationText = container.querySelector('#notification-text');\n\n  // 状態管理\n  let isValidating = false;\n  let validationResults = [];\n  let currentEditingRecord = null;\n\n  // 初期化処理\n  function initialize() {\n    if (progressArea) progressArea.style.display = 'none';\n    if (anomalyList) anomalyList.style.display = 'none';\n    if (correctionModal) correctionModal.style.display = 'none';\n    \n    // 初期データ読み込み\n    loadInitialData();\n  }\n\n  // 初期データ読み込み\n  async function loadInitialData() {\n    try {\n      const workData = await window.aivicApi.list('work_records', {});\n      if (workData && workData.length > 0) {\n        validationResults = workData;\n      }\n    } catch (error) {\n      console.error('初期データ読み込みエラー:', error);\n    }\n  }\n\n  // 検証実行処理\n  async function executeValidation() {\n    if (isValidating) {\n      showNotification('検証処理が実行中です', 'error');\n      return;\n    }\n\n    const startDate = startDateInput?.value;\n    const endDate = endDateInput?.value;\n\n    if (!startDate || !endDate) {\n      showNotification('検証対象期間を選択してください', 'error');\n      return;\n    }\n\n    isValidating = true;\n    showProgress(true);\n    updateProgress(0, '検証を開始しています...');\n\n    try {\n      // 期間内のデータ取得\n      updateProgress(20, 'データを取得中...');\n      const workData = await window.aivicApi.list('work_records', {\n        start_date: startDate,\n        end_date: endDate\n      });\n\n      // 必須フィールド検証\n      updateProgress(40, '必須フィールドを検証中...');\n      const fieldValidation = validateRequiredFields ? validateRequiredFields(workData) : { isValid: true, errors: [] };\n\n      // データ整合性チェック\n      updateProgress(60, 'データ整合性をチェック中...');\n      const integrityCheck = checkDataIntegrity ? checkDataIntegrity(workData) : { isValid: true, errors: [] };\n\n      // 異常値検出\n      updateProgress(80, '異常値を検出中...');\n      const anomalies = detectAnomalousValues ? detectAnomalousValues(workData) : [];\n\n      // 結果をマージ\n      validationResults = [\n        ...fieldValidation.errors || [],\n        ...integrityCheck.errors || [],\n        ...anomalies || []\n      ];\n\n      updateProgress(100, '検証完了');\n      \n      setTimeout(() => {\n        showProgress(false);\n        displayValidationResults();\n        showNotification('データ検証が完了しました', 'success');\n      }, 500);\n\n    } catch (error) {\n      console.error('検証エラー:', error);\n      showNotification('検証処理中にエラーが発生しました', 'error');\n      showProgress(false);\n    } finally {\n      isValidating = false;\n    }\n  }\n\n  // 異常値検出処理\n  async function detectAnomalies() {\n    try {\n      const workData = await window.aivicApi.list('work_records', {});\n      \n      const anomalies = [];\n      \n      if (detectOvertimeAnomaly) {\n        anomalies.push(...detectOvertimeAnomaly(workData));\n      }\n      if (detectNegativeValue) {\n        anomalies.push(...detectNegativeValue(workData));\n      }\n      if (detectExcessiveInterruption) {\n        anomalies.push(...detectExcessiveInterruption(workData));\n      }\n\n      validationResults = anomalies;\n      displayValidationResults();\n      showNotification('異常値検出が完了しました', 'success');\n      \n    } catch (error) {\n      console.error('異常値検出エラー:', error);\n      showNotification('異常値検出中にエラーが発生しました', 'error');\n    }\n  }\n\n  // 検証結果表示\n  function displayValidationResults() {\n    if (!anomalyList || !anomalyTbody) return;\n\n    anomalyList.style.display = 'block';\n    anomalyTbody.innerHTML = '';\n\n    validationResults.forEach((result, index) => {\n      const row = document.createElement('tr');\n      row.innerHTML = `\n        <td><input type=\"checkbox\" data-index=\"${index}\"></td>\n        <td>${result.date || '不明'}</td>\n        <td>${result.worker || '不明'}</td>\n        <td>${result.errorType || 'エラー'}</td>\n        <td>${result.description || result.message || '詳細不明'}</td>\n        <td>\n          <button onclick=\"editRecord(${index})\" class=\"btn-edit\">修正</button>\n          <button onclick=\"approveRecord(${index})\" class=\"btn-approve\">承認</button>\n        </td>\n      `;\n      anomalyTbody.appendChild(row);\n    });\n  }\n\n  // フィルター処理\n  function filterResults() {\n    const filterValue = errorTypeFilter?.value;\n    if (!filterValue || filterValue === 'all') {\n      displayValidationResults();\n      return;\n    }\n\n    const filteredResults = validationResults.filter(result => \n      result.errorType === filterValue || result.type === filterValue\n    );\n\n    if (!anomalyTbody) return;\n    anomalyTbody.innerHTML = '';\n\n    filteredResults.forEach((result, index) => {\n      const row = document.createElement('tr');\n      row.innerHTML = `\n        <td><input type=\"checkbox\" data-index=\"${index}\"></td>\n        <td>${result.date || '不明'}</td>\n        <td>${result.worker || '不明'}</td>\n        <td>${result.errorType || result.type || 'エラー'}</td>\n        <td>${result.description || result.message || '詳細不明'}</td>\n        <td>\n          <button onclick=\"editRecord(${index})\" class=\"btn-edit\">修正</button>\n          <button onclick=\"approveRecord(${index})\" class=\"btn-approve\">承認</button>\n        </td>\n      `;\n      anomalyTbody.appendChild(row);\n    });\n  }\n\n  // レコード編集\n  window.editRecord = function(index) {\n    currentEditingRecord = validationResults[index];\n    if (!currentEditingRecord || !correctionModal) return;\n\n    if (editWorkContent) {\n      editWorkContent.value = currentEditingRecord.workContent || currentEditingRecord.description || '';\n    }\n    correctionModal.style.display = 'block';\n  };\n\n  // 編集保存\n  async function saveEdit() {\n    if (!currentEditingRecord || !editWorkContent) return;\n\n    try {\n      const updatedData = {\n        ...currentEditingRecord,\n        workContent: editWorkContent.value,\n        status: 'corrected'\n      };\n\n      if (modifyWorkData) {\n        const result = modifyWorkData(updatedData);\n        if (result.success) {\n          await window.aivicApi.update('work_records', currentEditingRecord.id, updatedData);\n          correctionModal.style.display = 'none';\n          showNotification('データが修正されました', 'success');\n          displayValidationResults();\n        }\n      } else {\n        await window.aivicApi.update('work_records', currentEditingRecord.id, updatedData);\n        correctionModal.style.display = 'none';\n        showNotification('データが修正されました', 'success');\n        displayValidationResults();\n      }\n    } catch (error) {\n      console.error('保存エラー:', error);\n      showNotification('保存中にエラーが発生しました', 'error');\n    }\n  }\n\n  // レコード承認\n  window.approveRecord = async function(index) {\n    try {\n      const record = validationResults[index];\n      if (!record) return;\n\n      if (approveModification) {\n        const result = approveModification(record);\n        if (result.success) {\n          await window.aivicApi.update('work_records', record.id, { status: 'approved' });\n          showNotification('データが承認されました', 'success');\n          displayValidationResults();\n        }\n      } else {\n        await window.aivicApi.update('work_records', record.id, { status: 'approved' });\n        showNotification('データが承認されました', 'success');\n        displayValidationResults();\n      }\n    } catch (error) {\n      console.error('承認エラー:', error);\n      showNotification('承認中にエラーが発生しました', 'error');\n    }\n  };\n\n  // 全選択/全解除\n  function toggleSelectAll() {\n    const checkboxes = container.querySelectorAll('#anomaly-tbody input[type=\"checkbox\"]');\n    const isChecked = selectAllCheckbox?.checked || false;\n    \n    checkboxes.forEach(checkbox => {\n      checkbox.checked = isChecked;\n    });\n  }\n\n  // 一括承認\n  async function bulkApprove() {\n    const checkboxes = container.querySelectorAll('#anomaly-tbody input[type=\"checkbox\"]:checked');\n    if (checkboxes.length === 0) {\n      showNotification('承認するデータを選択してください', 'error');\n      return;\n    }\n\n    if (!confirm('選択されたデータを一括承認しますか？')) return;\n\n    try {\n      const promises = Array.from(checkboxes).map(async (checkbox) => {\n        const index = parseInt(checkbox.dataset.index);\n        const record = validationResults[index];\n        if (record) {\n          return window.aivicApi.update('work_records', record.id, { status: 'approved' });\n        }\n      });\n\n      await Promise.all(promises);\n      showNotification('一括承認が完了しました', 'success');\n      displayValidationResults();\n    } catch (error) {\n      console.error('一括承認エラー:', error);\n      showNotification('一括承認中にエラーが発生しました', 'error');\n    }\n  }\n\n  // ログ出力\n  function exportLog() {\n    try {\n      const logData = validationResults.map(result => ({\n        日付: result.date || '不明',\n        作業者: result.worker || '不明',\n        エラー種別: result.errorType || result.type || 'エラー',\n        詳細: result.description || result.message || '詳細不明',\n        ステータス: result.status || '未処理'\n      }));\n\n      const csv = convertToCSV(logData);\n      downloadCSV(csv, `validation_log_${new Date().toISOString().split('T')[0]}.csv`);\n      showNotification('検証ログを出力しました', 'success');\n    } catch (error) {\n      console.error('ログ出力エラー:', error);\n      showNotification('ログ出力中にエラーが発生しました', 'error');\n    }\n  }\n\n  // 再検証\n  async function reValidate() {\n    if (!confirm('再検証を実行しますか？')) return;\n    \n    validationResults = [];\n    if (anomalyTbody) anomalyTbody.innerHTML = '';\n    await executeValidation();\n  }\n\n  // プログレス表示制御\n  function showProgress(show) {\n    if (progressArea) {\n      progressArea.style.display = show ? 'block' : 'none';\n    }\n  }\n\n  function updateProgress(percent, message) {\n    if (progressBar) {\n      progressBar.style.width = `${percent}%`;\n    }\n    if (progressText) {\n      progressText.textContent = `${message} (${percent}%)`;\n    }\n  }\n\n  // 通知表示\n  function showNotification(message, type = 'info') {\n    if (window.aivicNotify) {\n      if (type === 'error') {\n        window.aivicNotify.error(message);\n      } else if (type === 'success') {\n        window.aivicNotify.success(message);\n      } else {\n        window.aivicNotify.info(message);\n      }\n    }\n    \n    if (notificationText) {\n      notificationText.textContent = message;\n      if (notificationArea) {\n        notificationArea.style.display = 'block';\n        setTimeout(() => {\n          notificationArea.style.display = 'none';\n        }, 3000);\n      }\n    }\n  }\n\n  // CSV変換・ダウンロード\n  function convertToCSV(data) {\n    if (!data.length) return '';\n    \n    const headers = Object.keys(data[0]);\n    const csvContent = [\n      headers.join(','),\n      ...data.map(row => headers.map(header => `\"${row[header] || ''}\"`).join(','))\n    ].join('\\n');\n    \n    return csvContent;\n  }\n\n  function downloadCSV(csv, filename) {\n    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = filename;\n    link.click();\n  }\n\n  // イベントリスナー設定\n  if (executeBtn) {\n    executeBtn.addEventListener('click', executeValidation);\n  }\n\n  if (anomalyDetectBtn) {\n    anomalyDetectBtn.addEventListener('click', detectAnomalies);\n  }\n\n  if (filterBtn) {\n    filterBtn.addEventListener('click', filterResults);\n  }\n\n  if (saveEditBtn) {\n    saveEditBtn.addEventListener('click', saveEdit);\n  }\n\n  if (selectAllCheckbox) {\n    selectAllCheckbox.addEventListener('change', toggleSelectAll);\n  }\n\n  if (bulkApproveBtn) {\n    bulkApproveBtn.addEventListener('click', bulkApprove);\n  }\n\n  if (exportLogBtn) {\n    exportLogBtn.addEventListener('click', exportLog);\n  }\n\n  if (reValidateBtn) {\n    reValidateBtn.addEventListener('click', reValidate);\n  }\n\n  // モーダル閉じる処理\n  if (correctionModal) {\n    correctionModal.addEventListener('click', (e) => {\n      if (e.target === correctionModal) {\n        correctionModal.style.display = 'none';\n      }\n    });\n  }\n\n  // 初期化実行\n  initialize();\n}";

  <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
