window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックのインポート\n  const { detectWorkTimeAnomaly, detectBreakTimeAnomaly, detectFrequentBreaks, calculateAnomalyScore, isEmergencyWorkTime, detectTimeSequenceAnomaly, detectShortWorkTime, calculateAnomalySeverity, calculateCorrectionValue, isOutlier, detectSignificantVariation, validateRequiredFields, calculateDataQualityScore, performComprehensiveAnomalyDetection } = window.aivicLogic.anomalyDetection;\n  const { validateRequiredFields: validateFields, validateTimeSequence, validateDuplicateRecord, isDataIntegrityValid, detectAnomalousValues, validateInterruptionTime, validateWorkRecordComprehensive, validateMonthlyWorkData } = window.aivicLogic.workValidation;\n  const { detectMissingData, correctAnomalousData, validateDataCompleteness, calculateDataReliability, detectAnomalousValues: detectQualityAnomalies, supplementMissingData, validateWorkRecordConsistency, generateDataQualityReport } = window.aivicLogic.qualityControl;\n  const { calculateWorkDuration, calculateBreakDuration, isWorkTimeExceeded, isShortWorkTime, calculateProgressRate, calculateDeviationRate, detectWorkTimeAnomalies, isBreakTimeExceeded, isEfficiencyBelowThreshold, isBottleneckWork, hasInvestmentEffect, isInvalidTimeSequence, isInputAdoptionSuccessful, isSeasonalVariationAbnormal, calculateLaborCostRate, calculateProductivityIndex, calculateROI } = window.aivicLogic.timeRecordCalc;\n\n  let currentAnomalyData = [];\n  let allAnomalyData = [];\n  let isVerificationRunning = false;\n  let currentEditingId = null;\n  let validationProgress = 0;\n  let validationResults = [];\n  let errorLogData = [];\n  let pendingApprovalData = [];\n\n  // 初期化処理\n  function initialize() {\n    setupEventHandlers();\n    loadInitialData();\n    initializeErrorLogList();\n    initializePendingApprovalList();\n  }\n\n  // イベントハンドラーの設定\n  function setupEventHandlers() {\n    // 検証実行ボタン\n    const executeBtn = container.querySelector('#execute-validation');\n    if (executeBtn) {\n      executeBtn.addEventListener('click', handleExecuteValidation);\n    }\n\n    // 異常値検出ボタン\n    const detectBtn = container.querySelector('#detect-anomalies');\n    if (detectBtn) {\n      detectBtn.addEventListener('click', handleDetectAnomalies);\n    }\n\n    // フィルター適用ボタン\n    const filterBtn = container.querySelector('#apply-filter');\n    if (filterBtn) {\n      filterBtn.addEventListener('click', handleApplyFilter);\n    }\n\n    // 一括承認ボタン\n    const bulkApproveBtn = container.querySelector('#bulk-approve');\n    if (bulkApproveBtn) {\n      bulkApproveBtn.addEventListener('click', handleBulkApprove);\n    }\n\n    // 検証ログ出力ボタン\n    const exportLogBtn = container.querySelector('#btn-export-log');\n    if (exportLogBtn) {\n      exportLogBtn.addEventListener('click', handleExportLog);\n    }\n\n    // 再検証ボタン\n    const reValidateBtn = container.querySelector('#re-validate');\n    if (reValidateBtn) {\n      reValidateBtn.addEventListener('click', handleReValidate);\n    }\n\n    // データ検証ボタン\n    const validateDataBtn = container.querySelector('#validate-data');\n    if (validateDataBtn) {\n      validateDataBtn.addEventListener('click', handleValidateData);\n    }\n\n    // 修正ボタンのイベント委譲\n    container.addEventListener('click', function(e) {\n      if (e.target.classList.contains('correction-btn') || e.target.classList.contains('edit-button')) {\n        handleEditData(e.target.dataset.id);\n      }\n    });\n\n    // モーダル内の保存ボタン\n    const saveBtn = container.querySelector('#save-button');\n    if (saveBtn) {\n      saveBtn.addEventListener('click', handleSaveEdit);\n    }\n\n    // 承認確認ボタン\n    const confirmApproveBtn = container.querySelector('#confirm-approve');\n    if (confirmApproveBtn) {\n      confirmApproveBtn.addEventListener('click', handleConfirmApprove);\n    }\n\n    // 再検証確認ボタン\n    const confirmRevalidateBtn = container.querySelector('#confirm-revalidate');\n    if (confirmRevalidateBtn) {\n      confirmRevalidateBtn.addEventListener('click', handleConfirmRevalidate);\n    }\n\n    // ログ出力ボタン\n    const exportBtn = container.querySelector('#export-log');\n    if (exportBtn) {\n      exportBtn.addEventListener('click', handleExportLog);\n    }\n\n    // 作業保存ボタン\n    const saveWorkBtn = container.querySelector('#save-work');\n    if (saveWorkBtn) {\n      saveWorkBtn.addEventListener('click', handleSaveWork);\n    }\n  }\n\n  // 検証実行処理\n  async function handleExecuteValidation() {\n    if (isVerificationRunning) {\n      window.aivicNotify.error('検証が既に実行中です');\n      return;\n    }\n\n    const startDate = container.querySelector('#validation-start-date')?.value;\n    const endDate = container.querySelector('#validation-end-date')?.value;\n\n    if (!startDate || !endDate) {\n      window.aivicNotify.error('期間を選択してください');\n      showErrorMessage('期間を選択してください');\n      return;\n    }\n\n    isVerificationRunning = true;\n    validationProgress = 0;\n\n    try {\n      // プログレスバー表示\n      showProgressBar();\n      \n      // データ取得\n      const workRecords = await window.aivicApi.list('work_records', {\n        start_date: startDate,\n        end_date: endDate\n      });\n\n      // 検証実行\n      const totalRecords = workRecords.length;\n      validationResults = [];\n\n      for (let i = 0; i < totalRecords; i++) {\n        const record = workRecords[i];\n        \n        // 各種検証実行\n        const requiredFieldsValid = validateFields(record);\n        const timeSequenceValid = validateTimeSequence(record);\n        const duplicateCheck = validateDuplicateRecord(record, workRecords);\n        const anomalyScore = calculateAnomalyScore(record);\n        const dataQualityScore = calculateDataQualityScore(record);\n\n        const result = {\n          id: record.id,\n          workerId: record.worker_id,\n          workDate: record.work_date,\n          isValid: requiredFieldsValid && timeSequenceValid && !duplicateCheck,\n          anomalyScore: anomalyScore,\n          qualityScore: dataQualityScore,\n          errors: []\n        };\n\n        if (!requiredFieldsValid) result.errors.push('必須項目不足');\n        if (!timeSequenceValid) result.errors.push('時刻順序エラー');\n        if (duplicateCheck) result.errors.push('重複データ');\n        if (anomalyScore > 0.7) result.errors.push('異常値検出');\n\n        validationResults.push(result);\n\n        // プログレス更新\n        validationProgress = Math.round(((i + 1) / totalRecords) * 100);\n        updateProgressBar(validationProgress);\n      }\n\n      // 結果表示\n      showValidationResults();\n      showCompletionNotice('データ検証が完了しました');\n\n    } catch (error) {\n      window.aivicNotify.error('検証処理中にエラーが発生しました: ' + error.message);\n    } finally {\n      isVerificationRunning = false;\n    }\n  }\n\n  // 異常値検出処理\n  async function handleDetectAnomalies() {\n    try {\n      const workRecords = await window.aivicApi.list('work_records');\n      \n      currentAnomalyData = [];\n      \n      for (const record of workRecords) {\n        const anomalies = performComprehensiveAnomalyDetection(record);\n        const workTimeAnomaly = detectWorkTimeAnomaly(record);\n        const breakTimeAnomaly = detectBreakTimeAnomaly(record);\n        const timeSequenceAnomaly = detectTimeSequenceAnomaly(record);\n\n        if (anomalies.length > 0 || workTimeAnomaly || breakTimeAnomaly || timeSequenceAnomaly) {\n          currentAnomalyData.push({\n            id: record.id,\n            workerId: record.worker_id,\n            workDate: record.work_date,\n            workTime: record.work_time,\n            anomalies: anomalies,\n            workTimeAnomaly: workTimeAnomaly,\n            breakTimeAnomaly: breakTimeAnomaly,\n            timeSequenceAnomaly: timeSequenceAnomaly\n          });\n        }\n      }\n\n      showAnomalyResults();\n      \n    } catch (error) {\n      window.aivicNotify.error('異常値検出中にエラーが発生しました: ' + error.message);\n    }\n  }\n\n  // フィルター適用処理\n  function handleApplyFilter() {\n    const errorTypeFilter = container.querySelector('#error-type-filter')?.value;\n    \n    if (!errorTypeFilter) return;\n\n    const filteredErrors = errorLogData.filter(error => {\n      return error.type === errorTypeFilter;\n    });\n\n    updateErrorLogList(filteredErrors);\n  }\n\n  // 一括承認処理\n  function handleBulkApprove() {\n    const checkboxes = container.querySelectorAll('#pending-approval-list input[type=\"checkbox\"]:checked');\n    \n    if (checkboxes.length === 0) {\n      window.aivicNotify.error('承認するデータを選択してください');\n      return;\n    }\n\n    // 確認モーダル表示（実装は省略）\n    showBulkApproveConfirm();\n  }\n\n  // 承認確認処理\n  async function handleConfirmApprove() {\n    try {\n      const checkboxes = container.querySelectorAll('#pending-approval-list input[type=\"checkbox\"]:checked');\n      const approvalIds = Array.from(checkboxes).map(cb => cb.value);\n\n      for (const id of approvalIds) {\n        await window.aivicApi.update('work_records', id, { status: 'approved' });\n      }\n\n      showSuccessMessage('一括承認が完了しました');\n      loadPendingApprovalData();\n      \n    } catch (error) {\n      window.aivicNotify.error('承認処理中にエラーが発生しました: ' + error.message);\n    }\n  }\n\n  // ログ出力処理\n  function handleExportLog() {\n    try {\n      const logData = generateValidationLog();\n      const blob = new Blob([logData], { type: 'text/plain' });\n      const url = URL.createObjectURL(blob);\n      \n      const a = document.createElement('a');\n      a.href = url;\n      a.download = `validation_${new Date().toISOString().split('T')[0]}.log`;\n      document.body.appendChild(a);\n      a.click();\n      document.body.removeChild(a);\n      URL.revokeObjectURL(url);\n      \n    } catch (error) {\n      window.aivicNotify.error('ログ出力中にエラーが発生しました: ' + error.message);\n    }\n  }\n\n  // 再検証処理\n  function handleReValidate() {\n    if (isVerificationRunning) {\n      window.aivicNotify.error('検証が既に実行中です');\n      return;\n    }\n    \n    // 確認モーダル表示（実装は省略）\n    showRevalidateConfirm();\n  }\n\n  // 再検証確認処理\n  function handleConfirmRevalidate() {\n    handleExecuteValidation();\n  }\n\n  // データ検証処理\n  async function handleValidateData() {\n    try {\n      const workItem = container.querySelector('#work-item')?.value;\n      const startTime = container.querySelector('#start-time')?.value;\n      const endTime = container.querySelector('#end-time')?.value;\n\n      if (!workItem || !startTime || !endTime) {\n        window.aivicNotify.error('すべての項目を入力してください');\n        return;\n      }\n\n      const record = {\n        work_item: workItem,\n        start_time: startTime,\n        end_time: endTime\n      };\n\n      const validationResult = validateWorkRecordComprehensive(record);\n      \n      if (validationResult.isValid) {\n        showCompletionNotice('データ検証が完了しました');\n      } else {\n        window.aivicNotify.error('検証エラー: ' + validationResult.errors.join(', '));\n      }\n      \n    } catch (error) {\n      window.aivicNotify.error('データ検証中にエラーが発生しました: ' + error.message);\n    }\n  }\n\n  // データ編集処理\n  function handleEditData(id) {\n    currentEditingId = id;\n    const record = validationResults.find(r => r.id === id) || currentAnomalyData.find(r => r.id === id);\n    \n    if (record) {\n      showEditModal(record);\n    }\n  }\n\n  // 編集保存処理\n  async function handleSaveEdit() {\n    try {\n      const workHours = container.querySelector('#work-hours')?.value;\n      const workContent = container.querySelector('#work-content')?.value;\n\n      if (!workHours || !workContent) {\n        window.aivicNotify.error('すべての項目を入力してください');\n        return;\n      }\n\n      await window.aivicApi.update('work_records', currentEditingId, {\n        work_hours: workHours,\n        work_content: workContent\n      });\n\n      hideEditModal();\n      window.aivicNotify.success('データが更新されました');\n      \n      // 再検証実行\n      await handleDetectAnomalies();\n      \n    } catch (error) {\n      window.aivicNotify.error('保存中にエラーが発生しました: ' + error.message);\n    }\n  }\n\n  // 作業保存処理\n  async function handleSaveWork() {\n    try {\n      const workHours = container.querySelector('#work-hours')?.value;\n      \n      if (!workHours) {\n        // 空の場合はエラーログに追加\n        addErrorLog({\n          type: '入力値エラー',\n          message: '作業時間が入力されていません',\n          timestamp: new Date().toISOString()\n        });\n        return;\n      }\n\n      await window.aivicApi.save('work_records', {\n        work_hours: workHours,\n        created_at: new Date().toISOString()\n      });\n\n      window.aivicNotify.success('作業データが保存されました');\n      \n    } catch (error) {\n      window.aivicNotify.error('保存中にエラーが発生しました: ' + error.message);\n    }\n  }\n\n  // UI表示関数群\n  function showProgressBar() {\n    const progressBar = container.querySelector('#progress-bar');\n    const progressPercentage = container.querySelector('#progress-percentage');\n    \n    if (progressBar) progressBar.style.display = 'block';\n    if (progressPercentage) progressPercentage.textContent = '0%';\n  }\n\n  function updateProgressBar(percentage) {\n    const progressBar = container.querySelector('#progress-bar');\n    const progressPercentage = container.querySelector('#progress-percentage');\n    \n    if (progressBar) {\n      const progressFill = progressBar.querySelector('.progress-fill');\n      if (progressFill) progressFill.style.width = percentage + '%';\n    }\n    if (progressPercentage) progressPercentage.textContent = percentage + '%';\n  }\n\n  function showValidationResults() {\n    const resultContainer = container.querySelector('#validation-result');\n    if (resultContainer) {\n      resultContainer.style.display = 'block';\n      resultContainer.innerHTML = `\n        <h3>検証結果</h3>\n        <p>総件数: ${validationResults.length}</p>\n        <p>正常: ${validationResults.filter(r => r.isValid).length}</p>\n        <p>エラー: ${validationResults.filter(r => !r.isValid).length}</p>\n      `;\n    }\n  }\n\n  function showAnomalyResults() {\n eConfirm() {\n    // 確認モーダル表示の実装\n  }\n\n  function showRevalidateConfirm() {\n    // 再検証確認モーダル表示の実装\n  }\n\n  // データ読み込み関数群\n  async function loadInitialData() {\n    try {\n      const workRecords = await window.aivicApi.list('work_records');\n      // 初期データの処理\n    } catch (error) {\n      window.aivicNotify.error('初期データの読み込みに失敗しました: ' + error.message);\n    }\n  }\n\n  function initializeErrorLogList() {\n    errorLogData = [\n      {\n        id: 1,\n        type: '入力値エラー',\n        message: 'サンプルエラー',\n        timestamp: new Date().toISOString()\n      }\n    ];\n    updateErrorLogList(errorLogData);\n  }\n\n  function updateErrorLogList(errors) {\n    const errorList = container.querySelector('#error-log-list');\n    if (errorList) {\n      errorList.style.display = 'block';\n      \n      let html = '';\n      errors.forEach(error => {\n        html += `<div class=\"error-item\">${error.type}: ${error.message}</div>`;\n      });\n      \n      errorList.innerHTML = html;\n    }\n  }\n\n  function addErrorLog(error) {\n    errorLogData.push(error);\n    updateErrorLogList(errorLogData);\n  }\n\n  function initializePendingApprovalList() {\n    pendingApprovalData = [\n      { id: 1, workerId: 'W001', workDate: '2023-01-01', status: 'pending' },\n      { id: 2, workerId: 'W002', workDate: '2023-01-02', status: 'pending' }\n    ];\n    updatePendingApprovalList();\n  }\n\n  function updatePendingApprovalList() {\n    const approvalList = container.querySelector('#pending-approval-list');\n    if (approvalList) {\n      approvalList.style.display = 'block';\n      \n      let html = '';\n      pendingApprovalData.forEach(item => {\n        html += `\n          <div class=\"approval-item\">\n            <input type=\"checkbox\" value=\"${item.id}\">\n            <span>${item.workerId} - ${item.workDate}</span>\n          </div>\n        `;\n      });\n      \n      approvalList.innerHTML = html;\n    }\n  }\n\n  async function loadPendingApprovalData() {\n    try     <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();
