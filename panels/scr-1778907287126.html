<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工数記録システム</title>
    <style>
        :root {
            --primary: #cc1f1f;
            --primary-hover: #a61a1a;
            --bg-main: #0d0d0d;
            --bg-card: #1a1010;
            --bg-sidebar: #151111;
            --border: #331a1a;
            --text: #e6e6e6;
            --text-muted: #999999;
            --top-bar-bg: #1f1515;
            --top-bar-border: #2d1a1a;
            --warning: #ff6b35;
            --error: #ff3333;
            --success: #28a745;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: "⚠";
            font-size: 18px;
        }

        .nav-section {
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }

        .nav-section:last-child {
            border-bottom: none;
            flex: 1;
        }

        .nav-title {
            padding: 0 16px 8px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: block;
            padding: 8px 16px;
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: rgba(204, 31, 31, 0.1);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: rgba(204, 31, 31, 0.15);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            margin-left: 220px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
        }

        .current-time {
            font-size: 12px;
            font-weight: 500;
            color: var(--primary);
            font-family: 'Courier New', monospace;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text);
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .user-menu:hover {
            background: var(--bg-sidebar);
            border-color: var(--primary);
        }

        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            min-height: calc(100vh - 132px);
        }

        .emergency-banner {
            background: linear-gradient(135deg, var(--error), var(--warning));
            color: white;
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            animation: flash 3s infinite;
        }

        @keyframes flash {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.7; }
        }

        .quick-actions {
            padding: 12px 16px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }

        .quick-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            margin-right: 8px;
            transition: all 0.15s ease;
        }

        .quick-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .quick-btn.secondary {
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
        }

        .quick-btn.secondary:hover {
            background: var(--border);
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .content-area {
                padding: 12px;
            }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(13, 13, 13, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type":"text","required":false,"description":"管理者による対応内容や備考"},{"name":"検出日時","type":"timestamp","required":true,"description":"異常値が検出された日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentEditId = null;\n  let isValidating = false;\n  let allValidationResults = [];\n\n  // 重要度レベルのバッジ色\n  function getSeverityBadge(severity) {\n    const colors = {\n      '高': '#ff4757',\n      '中': '#ffa502', \n      '低': '#2ed573'\n    };\n    const color = colors[severity] || '#6c757d';\n    return `<span style=\"background: ${color}; color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 11px;\">${severity}</span>`;\n  }\n\n  // 確認状況のバッジ色\n  function getStatusBadge(status) {\n    const colors = {\n      '未確認': '#ff4757',\n      '確認済み': '#ffa502',\n      '対応済み': '#2ed573'\n    };\n    const color = colors[status] || '#6c757d';\n    return `<span style=\"background: ${color}; color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 11px;\">${status}</span>`;\n  }\n\n  // 検証結果テーブル再描画\n  function renderValidationResults(results) {\n    const tbody = container.querySelector('#validation-tbody');\n    const noResults = container.querySelector('#no-results');\n    \n    if (!results || results.length === 0) {\n      tbody.innerHTML = '';\n      noResults.classList.remove('hidden');\n      return;\n    }\n    \n    noResults.classList.add('hidden');\n    tbody.innerHTML = results.map(r => `\n      <tr data-id=\"${r.id}\" style=\"border-bottom: 1px solid rgba(255,255,255,0.05);\">\n        <td style=\"padding: 6px 10px; font-size: 13px;\">\n          <input type=\"checkbox\" class=\"row-checkbox\" data-id=\"${r.id}\" style=\"accent-color: var(--primary);\">\n        </td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${new Date(r.検出日時 || r.作成日時).toLocaleString()}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${r.ユーザー名 || 'N/A'}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${r.異常値種別 || ''}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${r.検出項目 || ''}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${r.検出値 || ''}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px;\">${getSeverityBadge(r.重要度 || '低')}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px;\">${getStatusBadge(r.確認状況 || '未確認')}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px;\">\n          <button class=\"action-btn secondary edit-btn\" data-id=\"${r.id}\" style=\"margin-right: 4px;\">修正</button>\n        </td>\n      </tr>\n    `).join('');\n  }\n\n  // 初期データ表示\n  async function loadValidationResults() {\n    try {\n      const results = await window.aivicApi.list(4); // 異常値検出ログテーブル\n      allValidationResults = results || [];\n      renderValidationResults(allValidationResults);\n    } catch (error) {\n      console.error('検証結果の読み込みに失敗しました:', error);\n      allValidationResults = tables[4]?.records || [];\n      renderValidationResults(allValidationResults);\n    }\n  }\n\n  // 検証実行\n  async function executeValidation() {\n    const startDate = container.querySelector('#start-date').value;\n    const endDate = container.querySelector('#end-date').value;\n    \n    if (!startDate || !endDate) {\n      alert('検証対象期間を選択してください');\n      return;\n    }\n\n    if (isValidating) {\n      alert('検証処理が実行中です。しばらくお待ちください。');\n      return;\n    }\n\n    isValidating = true;\n    const progressArea = container.querySelector('#progress-area');\n    const progressBar = container.querySelector('#progress-bar');\n    const progressText = container.querySelector('#progress-text');\n    const validateBtn = container.querySelector('#btn-validate');\n    \n    progressArea.classList.remove('hidden');\n    validateBtn.disabled = true;\n    validateBtn.style.opacity = '0.6';\n\n    // 進捗バーアニメーション\n    let progress = 0;\n    const progressInterval = setInterval(() => {\n      progress += Math.random() * 15;\n      if (progress > 90) progress = 90;\n      progressBar.style.width = progress + '%';\n      progressText.textContent = Math.round(progress) + '%';\n    }, 200);\n\n    try {\n      // 作業記録データを取得して検証\n      const workRecords = await window.aivicApi.list(1);\n      const filteredRecords = workRecords.filter(record => {\n        const workDate = new Date(record.作業日);\n        return workDate >= new Date(startDate) && workDate <= new Date(endDate);\n      });\n\n      // 異常値検出ロジック\n      const anomalies = [];\n      filteredRecords.forEach(record => {\n        // 長時間作業チェック\n        if (record.作業時間 && record.作業時間 > 720) { // 12時間以上\n          anomalies.push({\n            id: 'anom_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),\n            検出対象テーブル: '作業記録',\n            検出対象レコードID: record.id,\n            ユーザーID: record.作業員ID,\n            ユーザー名: record.作業員名 || 'N/A',\n            異常値種別: '時間異常',\n            検出項目: '作業時間',\n            検出値: record.作業時間 + '分',\n            閾値: '720分',\n            重要度: '高',\n            確認状況: '未確認',\n            通知送信フラグ: false,\n            検出日時: new Date().toISOString(),\n            作成日時: new Date().toISOString(),\n            更新日時: new Date().toISOString()\n          });\n        }\n\n        // 必須項目チェック\n        if (!record.作業内容 || record.作業内容.trim() === '') {\n          anomalies.push({\n            id: 'anom_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),\n            検出対象テーブル: '作業記録',\n            検出対象レコードID: record.id,\n            ユーザーID: record.作業員ID,\n            ユーザー名: record.作業員名 || 'N/A',\n            異常値種別: '必須項目',\n            検出項目: '作業内容',\n            検出値: '空白',\n            閾値: '必須',\n            重要度: '中',\n            確認状況: '未確認',\n            通知送信フラグ: false,\n            検出日時: new Date().toISOString(),\n            作成日時: new Date().toISOString(),\n            更新日時: new Date().toISOString()\n          });\n        }\n      });\n\n      // 進捗完了\n      clearInterval(progressInterval);\n      progressBar.style.width = '100%';\n      progressText.textContent = '100%';\n\n      // 異常値をデータベースに保存\n      for (const anomaly of anomalies) {\n        await window.aivicApi.save(4, anomaly);\n      }\n\n      setTimeout(() => {\n        progressArea.classList.add('hidden');\n        validateBtn.disabled = false;\n        validateBtn.style.opacity = '1';\n        isValidating = false;\n\n        // 完了通知表示\n        const notification = container.querySelector('#notification-area');\n        notification.textContent = `データ検証が完了しました。${anomalies.length}件の異常値が検出されました。`;\n        notification.classList.remove('hidden');\n        setTimeout(() => notification.classList.add('hidden'), 5000);\n\n        // 結果を再読み込み\n        loadValidationResults();\n      }, 500);\n\n    } catch (error) {\n      clearInterval(progressInterval);\n      progressArea.classList.add('hidden');\n      validateBtn.disabled = false;\n      validateBtn.style.opacity = '1';\n      isValidating = false;\n      alert('検証処理中にエラーが発生しました: ' + error.message);\n    }\n  }\n\n  // エラー種別フィルター\n  function applyErrorFilter() {\n    const filterValue = container.querySelector('#error-filter').value;\n    let filteredResults = allValidationResults;\n    \n    if (filterValue) {\n      filteredResults = allValidationResults.filter(r => r.異常値種別 === filterValue);\n    }\n    \n    renderValidationResults(filteredResults);\n  }\n\n  // 一括承認\n  async function bulkApprove() {\n    const checkboxes = container.querySelectorAll('.row-checkbox:checked');\n    \n    if (checkboxes.length === 0) {\n      alert('承認する項目を選択してください');\n      return;\n    }\n\n    if (!confirm(`${checkboxes.length}件のデータを承認しますか？`)) {\n      return;\n    }\n\n    try {\n      for (const checkbox of checkboxes) {\n        const id = checkbox.dataset.id;\n        await window.aivicApi.update(4, id, {\n          確認状況: '対応済み',\n          確認者ID: 'current_user_id',\n          確認日時: new Date().toISOString(),\n          対応メモ: '一括承認により対応済み',\n          更新日時: new Date().toISOString()\n        });\n      }\n      \n      alert('一括承認が完了しました');\n      loadValidationResults();\n    } catch (error) {\n      alert('一括承認中にエラーが発生しました: ' + error.message);\n    }\n  }\n\n  // ログ出力\n  async function exportLog() {\n    if (allValidationResults.length === 0) {\n      alert('検証結果がありません');\n      return;\n    }\n\n    try {\n      const csvHeader = '検出日時,作業員,エラー種別,検出項目,検出値,重要度,確認状況,対応メモ\\n';\n      const csvData = allValidationResults.map(r => [\n        new Date(r.検出日時 || r.作成日時).toLocaleString(),\n        r.ユーザー名 || 'N/A',\n        r.異常値種別 || '',\n        r.検出項目 || '',\n        r.検出値 || '',\n        r.重要度 || '',\n        r.確認状況 || '',\n        (r.対応メモ || '').replace(/\"/g, '\"\"')\n      ].map(field => `\"${field}\"`).join(',')).join('\\n');\n\n      const csv = '\\uFEFF' + csvHeader + csvData;\n      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });\n      const link = document.createElement('a');\n      link.href = URL.createObjectURL(blob);\n      link.download = `validation_log_${new Date().toISOString().split('T')[0]}.csv`;\n      link.click();\n    } catch (error) {\n      alert('ログ出力中にエラーが発生しました: ' + error.message);\n    }\n  }\n\n  // 再検証\n  async function revalidate() {\n    if (!confirm('再検証を実行しますか？')) {\n      return;\n    }\n    \n    executeValidation();\n  }\n\n  // 修正モーダル表示\n  function showEditModal(id) {\n    const record = allValidationResults.find(r => r.id === id);\n    if (!record) return;\n\n    currentEditId = id;\n    const modal = container.querySelector('#edit-modal');\n    \n    // 関連する作業記録を取得して初期値設定（簡略化）\n    container.querySelector('#edit-start-time').value = '';\n    container.querySelector('#edit-end-time').value = '';\n    container.querySelector('#edit-content').value = '';\n    container.querySelector('#edit-memo').value = record.対応メモ || '';\n    \n    modal.classList.remove('hidden');\n  }\n\n  // 修正保存\n  async function saveEdit() {\n    if (!currentEditId) return;\n\n    const startTime = container.querySelector('#edit-start-time').value;\n    const endTime = container.querySelector('#edit-end-time').value;\n    const content = container.querySelector('#edit-content').value;\n    const memo = container.querySelector('#edit-memo').value;\n\n    // 入力値検証\n    if (content.length > 1000) {\n      alert('作業内容は1000文字以内で入力してください');\n      return;\n    }\n\n    if (startTime && endTime && new Date(startTime) >= new Date(endTime)) {\n      alert('終了時刻は開始時刻より後の時刻を入力してください');\n      return;\n    }\n\n    try {\n      // 異常値検出ログを更新\n      await window.aivicApi.update(4, currentEditId, {\n        確認状況: '対応済み',\n        確認者ID: 'current_user_id',\n        確認日時: new Date().toISOString(),\n        対応メモ: memo,\n        更新日時: new Date().toISOString()\n      });\n\n      container.querySelector('#edit-modal').classList.add('hidden');\n      currentEditId = null;\n      loadValidationResults();\n      alert('修正が完了しました');\n    } catch (error) {\n      alert('修正保存中にエラーが発生しました: ' + error.message);\n    }\n  }\n\n  // 全選択チェックボックス\n  container.querySelector('#select-all').addEventListener('change', (e) => {\n    const checkboxes = container.querySelectorAll('.row-checkbox');\n    checkboxes.forEach(cb => cb.checked = e.target.checked);\n  });\n\n  // イベントリスナー登録\n  container.querySelector('#btn-validate').addEventListener('click', executeValidation);\n  container.querySelector('#error-filter').addEventListener('change', applyErrorFilter);\n  container.querySelector('#btn-bulk-approve').addEventListener('click', bulkApprove);\n  container.querySelector('#btn-export-log').addEventListener('click', exportLog);\n  container.querySelector('#btn-revalidate').addEventListener('click', revalidate);\n  container.querySelector('#btn-cancel-edit').addEventListener('click', () => {\n    container.querySelector('#edit-modal').classList.add('hidden');\n    currentEditId = null;\n  });\n  container.querySelector('#btn-save-edit').addEventListener('click', saveEdit);\n\n  // 行レベル操作のイベントデリゲーション\n  container.addEventListener('click', (e) => {\n    const editBtn = e.target.closest('.edit-btn');\n    if (editBtn) {\n      showEditModal(editBtn.dataset.id);\n    }\n  });\n\n  // 初期データ読み込み\n  loadValidationResults();\n}";

        // リアルタイム時計
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ja-JP', { 
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('current-time').textContent = timeStr;

        setInterval(updateTime, 1000);

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
