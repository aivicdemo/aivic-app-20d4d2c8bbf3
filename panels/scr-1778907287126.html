ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentAnomalies = [];\n  let isValidationRunning = false;\n  let selectedAnomalies = new Set();\n\n  // 異常値検出結果の再描画\n  function renderAnomalies(anomalies) {\n    const tbody = container.querySelector('#anomaly-tbody');\n    const noDataMessage = container.querySelector('#no-data-message');\n    \n    if (!anomalies || anomalies.length === 0) {\n      tbody.innerHTML = '';\n      noDataMessage.classList.remove('hidden');\n      return;\n    }\n\n    noDataMessage.classList.add('hidden');\n    tbody.innerHTML = anomalies.map(anomaly => `\n      <tr data-id=\"${anomaly.id}\" style=\"height: 36px;\">\n        <td style=\"padding: 6px 10px;\">\n          <input type=\"checkbox\" class=\"anomaly-checkbox\" data-id=\"${anomaly.id}\" style=\"accent-color: var(--primary);\">\n        </td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n          ${new Date(anomaly.検出日時).toLocaleString('ja-JP')}\n        </td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n          ${anomaly.ユーザーID || ''}\n        </td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n          ${anomaly.異常値種別 || ''}\n        </td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n          ${anomaly.検出項目 || ''}\n        </td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n          ${anomaly.検出値 || ''}\n        </td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n          ${anomaly.閾値 || ''}\n        </td>\n        <td style=\"padding: 6px 10px;\">\n          <span style=\"padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 500; \n                       background: ${getSeverityColor(anomaly.重要度)}; color: #fff;\">\n            ${anomaly.重要度 || ''}\n          </span>\n        </td>\n        <td style=\"padding: 6px 10px;\">\n          <span style=\"padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 500; \n                       background: ${getStatusColor(anomaly.確認状況)}; color: #fff;\">\n            ${anomaly.確認状況 || ''}\n          </span>\n        </td>\n        <td style=\"padding: 6px 10px;\">\n          <button class=\"action-btn secondary correction-btn\" data-id=\"${anomaly.id}\" style=\"font-size: 12px; padding: 4px 8px;\">\n            修正\n          </button>\n        </td>\n      </tr>\n    `).join('');\n  }\n\n  function getSeverityColor(severity) {\n    switch(severity) {\n      case '高': return '#ef4444';\n      case '中': return '#f59e0b';\n      case '低': return '#10b981';\n      default: return '#6b7280';\n    }\n  }\n\n  function getStatusColor(status) {\n    switch(status) {\n      case '未確認': return '#ef4444';\n      case '確認済み': return '#f59e0b';\n      case '対応済み': return '#10b981';\n      default: return '#6b7280';\n    }\n  }\n\n  // 初期データ読み込み\n  async function loadAnomalies() {\n    try {\n      const anomalies = await window.aivicApi.list(4); // 異常値検出ログテーブル\n      currentAnomalies = anomalies || [];\n      renderAnomalies(currentAnomalies);\n    } catch (error) {\n      console.error('異常値データの読み込みに失敗:', error);\n      currentAnomalies = tables[4]?.records || [];\n      renderAnomalies(currentAnomalies);\n    }\n  }\n\n  // 期間選択の監視\n  function updateExecuteButton() {\n    const startDate = container.querySelector('#input-start-date').value;\n    const endDate = container.querySelector('#input-end-date').value;\n    const executeBtn = container.querySelector('#btn-execute');\n    \n    executeBtn.disabled = !startDate || !endDate || isValidationRunning;\n  }\n\n  // 検証実行\n  async function executeValidation() {\n    const startDate = container.querySelector('#input-start-date').value;\n    const endDate = container.querySelector('#input-end-date').value;\n    \n    if (!startDate || !endDate) {\n      alert('検証期間を選択してください');\n      return;\n    }\n\n    if (isValidationRunning) {\n      alert('検証処理が実行中です。しばらくお待ちください。');\n      return;\n    }\n\n    // 期間チェック\n    const start = new Date(startDate);\n    const end = new Date(endDate);\n    const diffTime = Math.abs(end - start);\n    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));\n    \n    if (diffDays > 365) {\n      if (!confirm('1年以上の長期間が選択されています。処理に時間がかかる可能性がありますが、続行しますか？')) {\n        return;\n      }\n    }\n\n    isValidationRunning = true;\n    container.querySelector('#btn-execute').disabled = true;\n    container.querySelector('#progress-container').classList.remove('hidden');\n    container.querySelector('#validation-complete-notification').classList.add('hidden');\n\n    // 進捗バーのアニメーション\n    const progressBar = container.querySelector('#progress-bar');\n    const progressText = container.querySelector('#progress-text');\n    let progress = 0;\n\n    const progressInterval = setInterval(() => {\n      progress += Math.random() * 15;\n      if (progress > 95) progress = 95;\n      \n      progressBar.style.width = progress + '%';\n      progressText.textContent = Math.round(progress) + '%';\n    }, 200);\n\n    try {\n      // 模擬的な検証処理（実際はAPIコール）\n      await new Promise(resolve => setTimeout(resolve, 2000));\n      \n      // 完了\n      clearInterval(progressInterval);\n      progressBar.style.width = '100%';\n      progressText.textContent = '100%';\n      \n      setTimeout(() => {\n        container.querySelector('#progress-container').classList.add('hidden');\n        container.querySelector('#validation-complete-notification').classList.remove('hidden');\n        \n        // 検証結果を再読み込み\n        loadAnomalies();\n        \n        const summary = container.querySelector('#validation-summary');\n        summary.textContent = `検証期間: ${startDate} ～ ${endDate}`;\n        \n        isValidationRunning = false;\n        updateExecuteButton();\n      }, 500);\n      \n    } catch (error) {\n      clearInterval(progressInterval);\n      alert('検証処理中にエラーが発生しました');\n      container.querySelector('#progress-container').classList.add('hidden');\n      isValidationRunning = false;\n      updateExecuteButton();\n    }\n  }\n\n  // フィルタリング\n  function applyFilters() {\n    const errorTypeFilter = container.querySelector('#filter-error-type').value;\n    const severityFilter = container.querySelector('#filter-severity').value;\n    \n    let filtered = currentAnomalies;\n    \n    if (errorTypeFilter) {\n      filtered = filtered.filter(a => a.異常値種別 === errorTypeFilter);\n    }\n    \n    if (severityFilter) {\n      filtered = filtered.filter(a => a.重要度 === severityFilter);\n    }\n    \n    renderAnomalies(filtered);\n  }\n\n  // データ修正モーダル\n  function openCorrectionModal(anomalyId) {\n    const anomaly = currentAnomalies.find(a => a.id === anomalyId);\n    if (!anomaly) return;\n\n    const modal = container.querySelector('#correction-modal');\n    const form = container.querySelector('#correction-form');\n    \n    form.innerHTML = `\n      <div style=\"margin-bottom: 12px;\">\n        <label style=\"font-size: 11px; color: var(--text-muted); margin-bottom: 4px; display: block;\">異常値種別</label>\n        <input type=\"text\" id=\"modal-error-type\" value=\"${anomaly.異常値種別 || ''}\" \n               style=\"padding: 6px 10px; border: 1px solid rgba(255,255,255,0.18); border-radius: 6px; background: rgba(0,0,0,0.25); color: var(--text); font-size: 13px; width: 100%;\">\n      </div>\n      <div style=\"margin-bottom: 12px;\">\n        <label style=\"font-size: 11px; color: var(--text-muted); margin-bottom: 4px; display: block;\">検出値</label>\n        <input type=\"text\" id=\"modal-detected-value\" value=\"${anomaly.検出値 || ''}\" \n               style=\"padding: 6px 10px; border: 1px solid rgba(255,255,255,0.18); border-radius: 6px; background: rgba(0,0,0,0.25); color: var(--text); font-size: 13px; width: 100%;\">\n      </div>\n      <div style=\"margin-bottom: 12px;\">\n        <label style=\"font-size: 11px; color: var(--text-muted); margin-bottom: 4px; display: block;\">重要度</label>\n        <select id=\"modal-severity\" style=\"padding: 6px 10px; border: 1px solid rgba(255,255,255,0.18); border-radius: 6px; background: rgba(0,0,0,0.25); color: var(--text); font-size: 13px; width: 100%;\">\n          <option value=\"高\" ${anomaly.重要度 === '高' ? 'selected' : ''}>高</option>\n          <option value=\"中\" ${anomaly.重要度 === '中' ? 'selected' : ''}>中</option>\n          <option value=\"低\" ${anomaly.重要度 === '低' ? 'selected' : ''}>低</option>\n        </select>\n      </div>\n      <div style=\"margin-bottom: 12px;\">\n        <label style=\"font-size: 11px; color: var(--text-muted); margin-bottom: 4px; display: block;\">対応メモ</label>\n        <textarea id=\"modal-memo\" rows=\"3\" placeholder=\"対応内容や備考を入力してください\" \n                  style=\"padding: 6px 10px; border: 1px solid rgba(255,255,255,0.18); border-radius: 6px; background: rgba(0,0,0,0.25); color: var(--text); font-size: 13px; width: 100%; resize: vertical;\">${anomaly.対応メモ || ''}</textarea>\n      </div>\n    `;\n    \n    modal.classList.remove('hidden');\n    modal.dataset.anomalyId = anomalyId;\n  }\n\n  // データ修正保存\n  async function saveCorrectionData() {\n    const modal = container.querySelector('#correction-modal');\n    const anomalyId = modal.dataset.anomalyId;\n    \n    const errorType = container.querySelector('#modal-error-type').value.trim();\n    const detectedValue = container.querySelector('#modal-detected-value').value.trim();\n    const severity = container.querySelector('#modal-severity').value;\n    const memo = container.querySelector('#modal-memo').value.trim();\n    \n    // バリデーション\n    if (!errorType) {\n      alert('異常値種別を入力してください');\n      return;\n    }\n    \n    if (detectedValue.length > 1000) {\n      alert('検出値は1000文字以内で入力してください');\n      return;\n    }\n    \n    if (memo.length > 1000) {\n      alert('対応メモは1000文字以内で入力してください');\n      return;\n    }\n\n    try {\n      const updateData = {\n        異常値種別: errorType,\n        検出値: detectedValue,\n        重要度: severity,\n        対応メモ: memo,\n        確認状況: '対応済み',\n        確認日時: new Date().toISOString(),\n        更新日時: new Date().toISOString()\n      };\n\n      await window.aivicApi.update(4, anomalyId, updateData);\n      modal.classList.add('hidden');\n      loadAnomalies();\n      \n    } catch (error) {\n      console.error('データ修正に失敗:', error);\n      alert('データの修正に失敗しました');\n    }\n  }\n\n  // 一括承認\n  async function bulkApprove() {\n    if (selectedAnomalies.size === 0) {\n      alert('承認する項目を選択してください');\n      return;\n    }\n\n    if (!confirm(`選択した${selectedAnomalies.size}件のデータを承認しますか？`)) {\n      return;\n    }\n\n    try {\n      const promises = Array.from(selectedAnomalies).map(id => \n        window.aivicApi.update(4, id, {\n          確認状況: '対応済み',\n          確認日時: new Date().toISOString(),\n          更新日時: new Date().toISOString()\n        })\n      );\n\n      await Promise.all(promises);\n      selectedAnomalies.clear();\n      container.querySelector('#checkbox-select-all').checked = false;\n      container.querySelector('#checkbox-bulk-approve').checked = false;\n      container.querySelector('#btn-bulk-approve').disabled = true;\n      \n      loadAnomalies();\n      \n    } catch (error) {\n      console.error('一括承認に失敗:', error);\n      alert('一括承認処理に失敗しました');\n    }\n  }\n\n  // 検証ログ出力\n  function exportValidationLog() {\n    if (currentAnomalies.length === 0) {\n      alert('検証結果がありません');\n      return;\n    }\n\n    const headers = ['検出日時', '作業員ID', '異常値種別', '検出項目', '検出値', '閾値', '重要度', '確認状況', '対応メモ'];\n    const csvData = [\n      headers.join(','),\n      ...currentAnomalies.map(anomaly => [\n        new Date(anomaly.検出日時).toLocaleString('ja-JP'),\n        anomaly.ユーザーID || '',\n        anomaly.異常値種別 || '',\n        anomaly.検出項目 || '',\n        anomaly.検出値 || '',\n        anomaly.閾値 || '',\n        anomaly.重要度 || '',\n        anomaly.確認状況 || '',\n        (anomaly.対応メモ ||     <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
