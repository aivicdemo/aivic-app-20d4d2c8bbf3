<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工数記録システム</title>
    <style>
        :root {
            --primary: #cc1f1f;
            --primary-hover: #a61a1a;
            --bg-main: #0d0d0d;
            --bg-card: #1a1010;
            --bg-sidebar: #151111;
            --border: #331a1a;
            --text: #e6e6e6;
            --text-muted: #999999;
            --top-bar-bg: #1f1515;
            --top-bar-border: #2d1a1a;
            --warning: #ff6b35;
            --error: #ff3333;
            --success: #28a745;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: "⚠";
            font-size: 18px;
        }

        .nav-section {
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }

        .nav-section:last-child {
            border-bottom: none;
            flex: 1;
        }

        .nav-title {
            padding: 0 16px 8px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: block;
            padding: 8px 16px;
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: rgba(204, 31, 31, 0.1);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: rgba(204, 31, 31, 0.15);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            margin-left: 220px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
        }

        .current-time {
            font-size: 12px;
            font-weight: 500;
            color: var(--primary);
            font-family: 'Courier New', monospace;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text);
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .user-menu:hover {
            background: var(--bg-sidebar);
            border-color: var(--primary);
        }

        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            min-height: calc(100vh - 132px);
        }

        .emergency-banner {
            background: linear-gradient(135deg, var(--error), var(--warning));
            color: white;
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            animation: flash 3s infinite;
        }

        @keyframes flash {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.7; }
        }

        .quick-actions {
            padding: 12px 16px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }

        .quick-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            margin-right: 8px;
            transition: all 0.15s ease;
        }

        .quick-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .quick-btn.secondary {
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
        }

        .quick-btn.secondary:hover {
            background: var(--border);
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .content-area {
                padding: 12px;
            }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(13, 13, 13, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

witch(status) {\n      case '未確認': return '#dc2626';\n      case '確認済み': return '#f59e0b';\n      case '対応済み': return '#10b981';\n      default: return 'var(--text-muted)';\n    }\n  }\n\n  // テーブル再描画関数\n  function renderRows(logs) {\n    const startIndex = (currentPage - 1) * itemsPerPage;\n    const endIndex = startIndex + itemsPerPage;\n    const pageData = logs.slice(startIndex, endIndex);\n\n    if (pageData.length === 0) {\n      logTableBody.innerHTML = '<tr><td colspan=\"9\" style=\"text-align: center; color: var(--text-muted); padding: 20px;\">該当するデータがありません</td></tr>';\n    } else {\n      logTableBody.innerHTML = pageData.map(log => `\n        <tr data-id=\"${log.id}\" style=\"cursor: pointer;\" class=\"log-row\">\n          <td>${formatDateTime(log.検出日時)}</td>\n          <td>${log.作業員名 || ''}</td>\n          <td>${log.異常値種別 || ''}</td>\n          <td>${log.検出項目 || ''}</td>\n          <td>${log.検出値 || ''}</td>\n          <td>${log.閾値 || ''}</td>\n          <td><span style=\"color: ${getSeverityColor(log.重要度)}; font-weight: 500;\">${log.重要度 || ''}</span></td>\n          <td><span style=\"color: ${getStatusColor(log.確認状況)}; font-weight: 500;\">${log.確認状況 || ''}</span></td>\n          <td>\n            <button class=\"action-btn secondary view-detail-btn\" data-id=\"${log.id}\" style=\"font-size: 12px; padding: 4px 8px;\">詳細</button>\n          </td>\n        </tr>\n      `).join('');\n    }\n\n    // 結果件数とページネーション更新\n    resultCount.textContent = `${logs.length}件`;\n    const totalPages = Math.ceil(logs.length / itemsPerPage);\n    pageInfo.textContent = `${currentPage} / ${totalPages}`;\n    btnPrevPage.disabled = currentPage <= 1;\n    btnNextPage.disabled = currentPage >= totalPages;\n  }\n\n  // フィルター処理\n  function applyFilters() {\n    const startDate = container.querySelector('#filter-start-date').value;\n    const endDate = container.querySelector('#filter-end-date').value;\n    const anomalyType = container.querySelector('#filter-anomaly-type').value;\n    const workerName = container.querySelector('#filter-worker-name').value.toLowerCase();\n    const workItem = container.querySelector('#filter-work-item').value;\n    const status = container.querySelector('#filter-status').value;\n\n    filteredLogs = allLogs.filter(log => {\n      // 日付範囲フィルター\n      if (startDate && log.検出日時 && new Date(log.検出日時) < new Date(startDate)) return false;\n      if (endDate && log.検出日時 && new Date(log.検出日時) > new Date(endDate)) return false;\n      \n      // 異常値タイプフィルター\n      if (anomalyType && log.異常値種別 !== anomalyType) return false;\n      \n      // 作業員名検索\n      if (workerName && (!log.作業員名 || !log.作業員名.toLowerCase().includes(workerName))) return false;\n      \n      // 作業項目フィルター\n      if (workItem && log.作業項目 !== workItem) return false;\n      \n      // ステータスフィルター\n      if (status && log.確認状況 !== status) return false;\n\n      return true;\n    });\n\n    currentPage = 1;\n    renderRows(filteredLogs);\n  }\n\n  // 詳細表示\n  function showDetail(logId) {\n    const log = allLogs.find(l => l.id === logId);\n    if (!log) return;\n\n    selectedLogId = logId;\n    \n    container.querySelector('#detail-target-table').textContent = log.検出対象テーブル || '';\n    container.querySelector('#detail-target-record').textContent = log.検出対象レコードID || '';\n    container.querySelector('#detail-notification').textContent = log.通知送信フラグ ? '送信済み' : '未送信';\n    container.querySelector('#detail-confirmer').textContent = log.確認者名 || '未確認';\n    container.querySelector('#detail-memo').value = log.対応メモ || '';\n    container.querySelector('#detail-status').value = log.確認状況 || '未確認';\n    \n    updateMemoCount();\n    detailArea.style.display = 'block';\n    detailArea.scrollIntoView({ behavior: 'smooth' });\n  }\n\n  // メモ文字数カウント更新\n  function updateMemoCount() {\n    const count = memoTextarea.value.length;\n    memoCount.textContent = count;\n    memoCount.style.color = count > 1000 ? '#dc2626' : 'var(--text-muted)';\n  }\n\n  // CSVエクスポート\n  function exportCSV() {\n    if (filteredLogs.length === 0) {\n      showError('エクスポートするデータがありません');\n      return;\n    }\n\n    const headers = ['検出日時', '作業員名', '異常値タイプ', '検出項目', '検出値', '閾値', '重要度', '確認状況', '対応メモ'];\n    const csvContent = '\\uFEFF' + [\n      headers.join(','),\n      ...filteredLogs.map(log => [\n        `\"${formatDateTime(log.検出日時)}\"`,\n        `\"${log.作業員名 || ''}\"`,\n        `\"${log.異常値種別 || ''}\"`,\n        `\"${log.検出項目 || ''}\"`,\n        `\"${log.検出値 || ''}\"`,\n        `\"${log.閾値 || ''}\"`,\n        `\"${log.重要度 || ''}\"`,\n        `\"${log.確認状況 || ''}\"`,\n        `\"${(log.対応メモ || '').replace(/\"/g, '\"\"')}\"`\n      ].join(','))\n    ].join('\\n');\n\n    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `異常値検出ログ_${new Date().toISOString().slice(0, 10)}.csv`;\n    link.click();\n    \n    showSuccess('CSVファイルをダウンロードしました');\n  }\n\n  // 初期データ読み込み\n  async function loadData() {\n    try {\n      const logs = await window.aivicApi.list(4); // 異常値検出ログテーブル\n      if (logs) {\n        // 作業員名を取得してログに追加\n        const users = await window.aivicApi.list(0); // ユーザーテーブル\n        allLogs = logs.map(log => ({\n          ...log,\n          作業員名: users?.find(u => u.id === log.ユーザーID)?.氏名 || '不明'\n        }));\n        filteredLogs = [...allLogs];\n        renderRows(filteredLogs);\n      } else {\n        allLogs = tables[4]?.records || [];\n        filteredLogs = [...allLogs];\n        renderRows(filteredLogs);\n      }\n    } catch (error) {\n      console.error('データ読み込みエラー:', error);\n      allLogs = tables[4]?.records || [];\n      filteredLogs = [...allLogs];\n      renderRows(filteredLogs);\n    }\n  }\n\n  // イベントリスナー設定\n  \n  // 検索ボタン\n  container.querySelector('#btn-search').addEventListener('click', applyFilters);\n\n  // フィルタークリアボタン\n  container.querySelector('#btn-clear-filter').addEventListener('click', () => {\n    container.querySelector('#filter-start-date').value = '';\n    container.querySelector('#filter-end-date').value = '';\n    container.querySelector('#filter-anomaly-type').value = '';\n    container.querySelector('#filter-worker-name').value = '';\n    container.querySelector('#filter-work-item').value = '';\n    container.querySelector('#filter-status').value = '';\n    \n    filteredLogs = [...allLogs];\n    currentPage = 1;\n    renderRows(filteredLogs);\n  });\n\n  // エクスポートボタン\n  container.querySelector('#btn-export').addEventListener('click', exportCSV);\n\n  // ページネーション\n  btnPrevPage.addEventListener('click', () => {\n    if (currentPage > 1) {\n      currentPage--;\n      renderRows(filteredLogs);\n    }\n  });\n\n  btnNextPage.addEventListener('click', () => {\n    const totalPages = Math.ceil(filteredLogs.length / itemsPerPage);\n    if (currentPage < totalPages) {\n      currentPage++;\n      renderRows(filteredLogs);\n    }\n  });\n\n  // メモ文字数カウント\n  memoTextarea.addEventListener('input', updateMemoCount);\n\n  // 対応状況更新ボタン\n  container.querySelector('#btn-update-status').addEventListener('click', async () => {\n    if (!selectedLogId) return;\n\n    const memo = container.querySelector('#detail-memo').value;\n    const status = container.querySelector('#detail-status').value;\n\n    // 文字数チェック\n    if (memo.length > 1000) {\n      showError('コメントは1000文字以内で入力してください');\n      return;\n    }\n\n    try {\n      const updateData = {\n        確認状況: status,\n        対応メモ: memo,\n        確認日時: new Date().toISOString(),\n        確認者ID: 'current-user-id' // 実際の実装では現在のユーザーIDを使用\n      };\n\n      const result = await window.aivicApi.update(4, selectedLogId, updateData);\n      if (result) {\n        showSuccess('対応状況を更新しました');\n        await loadData(); // データを再読み込み\n      } else {\n        showError('更新に失敗しました');\n      }\n    } catch (error) {\n      console.error('更新エラー:', error);\n      showError('ネットワークエラーが発生しました');\n    }\n  });\n\n  // テーブル行クリック・詳細ボタンクリック\n  container.addEventListener('click', (e) => {\n    const detailBtn = e.target.closest('.view-detail-btn');\n    const row = e.target.closest('.log-row');\n    \n    if (detailBtn) {\n      e.stopPropagation();\n      showDetail(detailBtn.dataset.id);\n    } else if (row) {\n      showDetail(row.dataset.id);\n    }\n  });\n\n  // 初期データ読み込み\n  loadData();\n}";

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
