:"進捗状況","type":"varchar(100)","required":true,"description":"作業の進捗状態（作業中、完了、中断等）"},{"name":"備考","type":"text","required":false,"description":"特記事項や注意点等の補足情報"},{"name":"承認状態","type":"varchar(100)","required":true,"description":"記録の承認状況（未承認、承認済み、差し戻し）"},{"name":"承認者ID","type":"uuid","required":false,"description":"記録を承認した管理者のID"},{"name":"承認日時","type":"timestamp","required":false,"description":"承認が行われた日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"}]},{"tableName":"中断記録","purpose":"作業中断の発生理由、時間、影響を記録し、作業効率分析と改善に活用する","columns":[{"name":"中断記録ID","type":"uuid","required":true,"description":"中断記録の一意識別子（主キー）"},{"name":"作業記録ID","type":"uuid","required":true,"description":"中断が発生した作業記録への外部キー"},{"name":"中断開始日時","type":"timestamp","required":true,"description":"作業を中断した日時"},{"name":"中断終了日時","type":"timestamp","required":false,"description":"作業を再開した日時"},{"name":"中断理由区分","type":"varchar(100)","required":true,"description":"中断理由の分類（機械故障、材料不足、天候、休憩等）"},{"name":"中断理由詳細","type":"text","required":false,"description":"中断理由の具体的な内容"},{"name":"中断時間","type":"integer","required":false,"description":"中断時間（分）"},{"name":"影響度","type":"varchar(100)","required":false,"description":"作業への影響度（軽微、中程度、重大）"},{"name":"対応状況","type":"varchar(100)","required":true,"description":"中断への対応状況（対応中、解決済み、未対応）"},{"name":"記録者ID","type":"uuid","required":true,"description":"中断を記録した作業員のユーザーID"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]},{"tableName":"作業項目マスタ","purpose":"現場作業員が工数記録時に選択する作業項目の定義と管理を行う","columns":[{"name":"作業項目ID","type":"uuid","required":true,"description":"作業項目の一意識別子（主キー）"},{"name":"作業項目コード","type":"varchar(100)","required":true,"description":"作業項目の業務コード（検索・表示用）"},{"name":"作業項目名","type":"varchar(100)","required":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type":"text","required":false,"description":"管理者による対応内容や備考"},{"name":"検出日時","type":"timestamp","required":true,"description":"異常値が検出された日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentData = [];\n  let selectedLogId = null;\n\n  // 1. 再描画関数の定義\n  function renderRows(rows) {\n    const tbody = container.querySelector(\"#anomaly-log-tbody\");\n    const noDataMessage = container.querySelector(\"#no-data-message\");\n    \n    if (!rows || rows.length === 0) {\n      tbody.innerHTML = \"\";\n      noDataMessage.classList.remove(\"hidden\");\n      return;\n    }\n    \n    noDataMessage.classList.add(\"hidden\");\n    tbody.innerHTML = rows.map(r => {\n      const detectionTime = r.検出日時 ? new Date(r.検出日時).toLocaleString('ja-JP') : '';\n      const workerName = r.作業員名 || '';\n      const anomalyType = r.異常値種別 || '';\n      const detectionItem = r.検出項目 || '';\n      const detectionValue = r.検出値 || '';\n      const threshold = r.閾値 || '';\n      const importance = r.重要度 || '';\n      const status = r.確認状況 || '';\n      \n      let statusBadge = '';\n      if (status === '未確認') {\n        statusBadge = `<span style=\"background: #ff6a00; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px;\">${status}</span>`;\n      } else if (status === '確認済み') {\n        statusBadge = `<span style=\"background: #0066cc; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px;\">${status}</span>`;\n      } else if (status === '対応済み') {\n        statusBadge = `<span style=\"background: #00aa44; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px;\">${status}</span>`;\n      } else {\n        statusBadge = `<span style=\"color: var(--text-muted); font-size: 11px;\">${status}</span>`;\n      }\n\n      let importanceBadge = '';\n      if (importance === '高') {\n        importanceBadge = `<span style=\"background: #cc0000; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px;\">${importance}</span>`;\n      } else if (importance === '中') {\n        importanceBadge = `<span style=\"background: #ff6a00; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px;\">${importance}</span>`;\n      } else if (importance === '低') {\n        importanceBadge = `<span style=\"background: #666; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px;\">${importance}</span>`;\n      } else {\n        importanceBadge = `<span style=\"color: var(--text-muted); font-size: 11px;\">${importance}</span>`;\n      }\n      \n      return `<tr data-id=\"${r.異常値検出ログID || r.id}\" style=\"cursor: pointer;\">\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${detectionTime}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${workerName}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${anomalyType}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${detectionItem}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${detectionValue}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${threshold}</td>\n        <td style=\"padding: 6px 10px;\">${importanceBadge}</td>\n        <td style=\"padding: 6px 10px;\">${statusBadge}</td>\n        <td style=\"padding: 6px 10px;\">\n          <button class=\"action-btn secondary detail-btn\" data-id=\"${r.異常値検出ログID || r.id}\" style=\"font-size: 11px; padding: 4px 8px;\">詳細</button>\n        </td>\n      </tr>`;\n    }).join(\"\");\n  }\n\n  // 2. 初期データを即座に描画\n  currentData = tables[4]?.records || [];\n  renderRows(currentData);\n\n  // 最新データを取得して描画\n  window.aivicApi.list(4).then(rows => {\n    if (rows) {\n      currentData = rows;\n      renderRows(rows);\n    }\n  });\n\n  // 3. 検索ボタンのイベントリスナー\n  container.querySelector(\"#btn-search\").addEventListener(\"click\", async () => {\n    const startDate = container.querySelector(\"#filter-start-date\").value;\n    const endDate = container.querySelector(\"#filter-end-date\").value;\n    const anomalyType = container.querySelector(\"#filter-anomaly-type\").value;\n    const workerName = container.querySelector(\"#filter-worker-name\").value.trim();\n    const workItem = container.querySelector(\"#filter-work-item\").value;\n    const status = container.querySelector(\"#filter-status\").value;\n\n    // 日付形式チェック\n    if (startDate && !isValidDateTime(startDate)) {\n      alert(\"正しい日付形式で入力してください（YYYY-MM-DD HH:MM）\");\n      return;\n    }\n    if (endDate && !isValidDateTime(endDate)) {\n      alert(\"正しい日付形式で入力してください（YYYY-MM-DD HH:MM）\");\n      return;\n    }\n\n    const allRows = await window.aivicApi.list(4);\n    if (!allRows) return;\n\n    let filteredRows = allRows.filter(r => {\n      // 日付フィルター\n      if (startDate) {\n        const detectionTime = new Date(r.検出日時);\n        const filterStart = new Date(startDate);\n        if (detectionTime < filterStart) return false;\n      }\n      if (endDate) {\n        const detectionTime = new Date(r.検出日時);\n        const filterEnd = new Date(endDate);\n        if (detectionTime > filterEnd) return false;\n      }\n      \n      // 異常値タイプフィルター\n      if (anomalyType && r.異常値種別 !== anomalyType) return false;\n      \n      // 作業員名フィルター\n      if (workerName && !(r.作業員名 || '').includes(workerName)) return false;\n      \n      // 作業項目フィルター（検出対象レコードから推測）\n      if (workItem) {\n        // 実際の実装では作業記録テーブルとの結合が必要だが、\n        // ここでは簡易的に対応メモに含まれるかで判定\n        if (!(r.対応メモ || '').includes(workItem)) return false;\n      }\n      \n      // ステータスフィルター\n      if (status && r.確認状況 !== status) return false;\n      \n      return true;\n    });\n\n    currentData = filteredRows;\n    renderRows(filteredRows);\n  });\n\n  // フィルタークリアボタン\n  container.querySelector(\"#btn-clear-filter\").addEventListener(\"click\", () => {\n    container.querySelector(\"#filter-start-date\").value = \"\";\n    container.querySelector(\"#filter-end-date\").value = \"\";\n    container.querySelector(\"#filter-anomaly-type\").value = \"\";\n    container.querySelector(\"#filter-worker-name\").value = \"\";\n    container.querySelector(\"#filter-work-item\").value = \"\";\n    container.querySelector(\"#filter-status\").value = \"\";\n    \n    renderRows(currentData);\n  });\n\n  // CSVエクスポートボタン\n  container.querySelector(\"#btn-export\").addEventListener(\"click\", async () => {\n    const allRows = await window.aivicApi.list(4);\n    if (!allRows || allRows.length === 0) {\n      alert(\"エクスポートするデータがありません\");\n      return;\n    }\n\n    const headers = [\"検出日時\", \"作業員名\", \"異常値タイプ\", \"検出項目\", \"検出値\", \"閾値\", \"重要度\", \"確認状況\", \"対応メモ\"];\n    const csvData = [headers.join(\",\")];\n    \n    allRows.forEach(r => {\n      const row = [\n        `\"${new Date(r.検出日時).toLocaleString('ja-JP')}\"`,\n        `\"${r.作業員名 || ''}\"`,\n        `\"${r.異常値種別 || ''}\"`,\n        `\"${r.検出項目 || ''}\"`,\n        `\"${r.検出値 || ''}\"`,\n        `\"${r.閾値 || ''}\"`,\n        `\"${r.重要度 || ''}\"`,\n        `\"${r.確認状況 || ''}\"`,\n        `\"${(r.対応メモ || '').replace(/\"/g, '\"\"')}\"`\n      ];\n      csvData.push(row.join(\",\"));\n    });\n\n    const csvContent = \"\\uFEFF\" + csvData.join(\"\\n\");\n    const blob = new Blob([csvContent], { type: \"text/csv;charset=utf-8;\" });\n    const link = document.createElement(\"a\");\n    link.href = URL.createObjectURL(blob);\n    link.download = `anomaly_detection_log_${new Date().toISOString().split('T')[0]}.csv`;\n    link.click();\n  });\n\n  // 詳細表示・行クリック処理\n  container.addEventListener(\"click\", async (e) => {\n    const detailBtn = e.target.closest(\".detail-btn\");\n    const row = e.target.closest(\"tr[data-id]\");\n    \n    if (detailBtn || (row && !e.target.closest(\"button\"))) {\n      const id = detailBtn ? detailBtn.dataset.id : row.dataset.id;\n      const logData = currentData.find(r => (r.異常値検出ログID || r.id) === id);\n      \n      if (logData) {\n        selectedLogId = id;\n        showDetail(logData);\n      }\n    }\n  });\n\n  // 詳細表示関数\n  function showDetail(logData) {\n    const detailArea = container.querySelector(\"#detail-area\");\n    detailArea.classList.remove(\"hidden\");\n    \n    container.querySelector(\"#detail-detection-time\").textContent = \n      logData.検出日時 ? new Date(logData.検出日時).toLocaleString('ja-JP') : '';\n    container.querySelector(\"#detail-worker-name\").textContent = logData.作業員名 || '';\n    container.querySelector(\"#detail-anomaly-type\").textContent = logData.異常値種別 || '';\n    container.querySelector(\"#detail-detection-item\").textContent = logData.検出項目 || '';\n    container.querySelector(\"#detail-values\").textContent = \n      `${logData.検出値 || ''} / ${logData.閾値 || ''}`;\n    container.querySelector(\"#detail-importance\").textContent = logData.重要度 || '';\n    container.querySelector(\"#detail-status\").value = logData.確認状況 || '未確認';\n    container.querySelector(\"#detail-memo\").value = logData.対応メモ || '';\n    \n    updateMemoCount();\n  }\n\n  // 詳細エリアを閉じる\n  container.querySelector(\"#btn-close-detail\").addEventListener(\"click\", () => {\n    container.querySelector(\"#detail-area\").classList.add(\"hidden\");\n    selectedLogId = null;\n  });\n\n  // 対応状況更新\n  container.querySelector(\"#btn-update-status\").addEventListener(\"click\", async () => {\n    if (!selectedLogId) return;\n    \n    const newStatus = container.querySelector(\"#detail-status\").value;\n    const updateData = {\n      確認状況: newStatus,\n      確認日時: new Date().toISOString(),\n      確認者ID: \"current-user-id\" // 実際の実装では現在のユーザーIDを取得\n    };\n    \n    try {\n      const updated = await window.aivicApi.update(4, selectedLogId, updateData);\n      if (updated) {\n        alert(\"対応状況を更新しました\");\n        // データを再取得して表示を更新\n        const refreshedData = await window.aivicApi.list(4);\n        if (refreshedData) {\n          currentData = refreshedData;\n          renderRows(currentData);\n        }\n      } else {\n        alert(\"対応状況の更新に失敗しました\");\n      }\n    } catch (error) {\n      alert(\"ネットワークエラーが発生しました。再試行してください。\");\n    }\n  });\n\n  // コメント保存\n  container.querySelector(\"#btn-save-memo\").addEventListener(\"click\", async () => {\n    if (!selectedLogId) return;\n    \n    const memo = container.querySelector(\"#detail-memo\").value;\n    if (memo.length > 1000) {\n      alert(\"コメントは1000文字以内で入力してください\");\n      return;\n    }\n    \n    const updateData = {\n      対応メモ: memo,\n      更新日時: new Date().toISOString()\n    };\n    \n    const updated = await window.aivicApi.update(4, selectedLogId, updateData);\n    if (updated) {\n      alert(\"コメントを保存しました\");\n      // データを再取得して表示を更新\n      const refreshedData = await window.aivicApi.list(4);\n      if (refreshedData) {\n        currentData = refreshedData;\n        renderRows(currentData);\n      }\n    } else {\n      alert(\"コメントの保存に失敗しました\");\n    }\n  });\n\n  // メモ文字数カウント\n  function updateMemoCount() {\n    const memo = container.querySelector(\"#detail-memo\");\n    const count = container.querySelector(\"#memo-count\");\n    count.textContent = `${memo.value.length}/1000`;\n  }\n  \n  container.querySelector(\"#detail-memo\").addEventListener(\"input\", updateMemoCount);\n\n  // 日付形式チェック関数\n  function isValidDateTime(dateTimeString) {\n    const date = new Date(dateTimeString);\n    return date instanceof Date && !isNaN(date);\n  }\n}";
</script>

            'scr-1778907367889': '工数記録確認',
            'scr-1778907380182': '工数記録入力'
        };

        // パネル切り替え時にパンくずリストを更新
        window.addEventListener('aivic-screen-changed', function(event) {
            const screenId = event.detail.screenId;
            const screenNameEl = document.getElementById('current-screen-name');

        // 初期画面を設定

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
