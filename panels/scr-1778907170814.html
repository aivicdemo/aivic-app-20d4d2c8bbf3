<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --primary: #4a9eff;
            --primary-hover: #3a8eef;
            --bg-main: #0f0f0f;
            --bg-card: #1a1a1a;
            --bg-sidebar: #141414;
            --border: #2a2a2a;
            --text: #e8e8e8;
            --text-muted: #9a9a9a;
            --top-bar-bg: #161616;
            --top-bar-border: #252525;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            height: 52px;
        }

        .logo {
            width: 24px;
            height: 24px;
            background: var(--primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: white;
        }

        .app-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-section {
            padding: 16px 12px 8px;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            padding: 0 8px;
        }

        .nav-item {
            display: block;
            padding: 8px 12px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 400;
            margin-bottom: 2px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        .nav-item.aivic-active {
            background: var(--primary);
            color: white;
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .breadcrumb-current {
            color: var(--text);
            font-weight: 500;
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .logout-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: color 0.15s ease;
        }

        .logout-link:hover {
            color: var(--text);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quick-action-btn {
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .quick-action-btn:hover {
            border-color: var(--primary);
            background: rgba(74, 158, 255, 0.1);
        }

        .quick-action-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .quick-action-btn.primary:hover {
            background: var(--primary-hover);
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-height: 400px;
            padding: 0;
        }

        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .nav-emergency {
            margin-top: auto;
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        .emergency-btn {
            width: 100%;
            padding: 10px 12px;
            background: var(--error);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        .emergency-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
            
            .quick-actions {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentData = [];\n  let filteredData = [];\n  let currentPage = 1;\n  let itemsPerPage = 20;\n  let selectedLogId = null;\n\n  const tbody = container.querySelector(\"#log-table-body\");\n  const resultCount = container.querySelector(\"#result-count\");\n  const detailSection = container.querySelector(\"#detail-section\");\n  const detailContent = container.querySelector(\"#detail-content\");\n  const pageInfo = container.querySelector(\"#page-info\");\n  const btnPrev = container.querySelector(\"#btn-prev\");\n  const btnNext = container.querySelector(\"#btn-next\");\n\n  // ユーザー名マップを作成\n  const userMap = {};\n  if (tables[0]) {\n    tables[0].records.forEach(user => {\n      userMap[user.ユーザーID] = user.氏名;\n    });\n  }\n\n  function formatDateTime(dateStr) {\n    if (!dateStr) return \"\";\n    const date = new Date(dateStr);\n    return date.toLocaleString('ja-JP', {\n      year: 'numeric',\n      month: '2-digit',\n      day: '2-digit',\n      hour: '2-digit',\n      minute: '2-digit'\n    });\n  }\n\n  function getStatusBadgeStyle(status) {\n    switch (status) {\n      case \"未確認\":\n        return \"background: rgba(255, 107, 107, 0.2); color: #ff6b6b; padding: 2px 6px; border-radius: 4px; font-size: 11px;\";\n      case \"確認済み\":\n        return \"background: rgba(255, 193, 7, 0.2); color: #ffc107; padding: 2px 6px; border-radius: 4px; font-size: 11px;\";\n      case \"対応済み\":\n        return \"background: rgba(40, 167, 69, 0.2); color: #28a745; padding: 2px 6px; border-radius: 4px; font-size: 11px;\";\n      default:\n        return \"background: rgba(108, 117, 125, 0.2); color: #6c757d; padding: 2px 6px; border-radius: 4px; font-size: 11px;\";\n    }\n  }\n\n  function getPriorityBadgeStyle(priority) {\n    switch (priority) {\n      case \"高\":\n        return \"background: rgba(220, 53, 69, 0.2); color: #dc3545; padding: 2px 6px; border-radius: 4px; font-size: 11px;\";\n      case \"中\":\n        return \"background: rgba(255, 193, 7, 0.2); color: #ffc107; padding: 2px 6px; border-radius: 4px; font-size: 11px;\";\n      case \"低\":\n        return \"background: rgba(40, 167, 69, 0.2); color: #28a745; padding: 2px 6px; border-radius: 4px; font-size: 11px;\";\n      default:\n        return \"background: rgba(108, 117, 125, 0.2); color: #6c757d; padding: 2px 6px; border-radius: 4px; font-size: 11px;\";\n    }\n  }\n\n  function renderRows(rows) {\n    const startIndex = (currentPage - 1) * itemsPerPage;\n    const endIndex = startIndex + itemsPerPage;\n    const pageRows = rows.slice(startIndex, endIndex);\n\n    tbody.innerHTML = pageRows.map(row => `\n      <tr data-id=\"${row.異常値検出ログID}\" style=\"cursor: pointer;\">\n        <td style=\"padding: 6px 10px; font-size: 13px;\">${formatDateTime(row.検出日時)}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px;\">${userMap[row.ユーザーID] || \"不明\"}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px;\">${row.異常値種別 || \"\"}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px;\">${row.検出項目 || \"\"}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px;\">${row.検出値 || \"\"}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px;\">${row.閾値 || \"\"}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px;\"><span style=\"${getPriorityBadgeStyle(row.重要度)}\">${row.重要度 || \"\"}</span></td>\n        <td style=\"padding: 6px 10px; font-size: 13px;\"><span style=\"${getStatusBadgeStyle(row.確認状況)}\">${row.確認状況 || \"\"}</span></td>\n        <td style=\"padding: 6px 10px; font-size: 13px;\">\n          <button class=\"action-btn secondary detail-btn\" data-id=\"${row.異常値検出ログID}\" style=\"background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;\">詳細</button>\n        </td>\n      </tr>\n    `).join(\"\");\n\n    resultCount.textContent = `${rows.length}件`;\n    updatePagination(rows.length);\n  }\n\n  function updatePagination(totalItems) {\n    const totalPages = Math.ceil(totalItems / itemsPerPage);\n    pageInfo.textContent = `${currentPage} / ${totalPages}`;\n    btnPrev.disabled = currentPage <= 1;\n    btnNext.disabled = currentPage >= totalPages;\n  }\n\n  function showDetail(logId) {\n    const log = currentData.find(l => l.異常値検出ログID === logId);\n    if (!log) return;\n\n    selectedLogId = logId;\n    detailContent.innerHTML = `\n      <div style=\"margin-bottom: 8px;\"><strong>検出対象:</strong> ${log.検出対象テーブル || \"\"}</div>\n      <div style=\"margin-bottom: 8px;\"><strong>異常値種別:</strong> ${log.異常値種別 || \"\"}</div>\n      <div style=\"margin-bottom: 8px;\"><strong>検出項目:</strong> ${log.検出項目 || \"\"}</div>\n      <div style=\"margin-bottom: 8px;\"><strong>検出値:</strong> ${log.検出値 || \"\"} / <strong>閾値:</strong> ${log.閾値 || \"\"}</div>\n      <div style=\"margin-bottom: 8px;\"><strong>重要度:</strong> <span style=\"${getPriorityBadgeStyle(log.重要度)}\">${log.重要度 || \"\"}</span></div>\n      <div style=\"margin-bottom: 8px;\"><strong>検出日時:</strong> ${formatDateTime(log.検出日時)}</div>\n      <div style=\"margin-bottom: 8px;\"><strong>確認者:</strong> ${log.確認者ID ? userMap[log.確認者ID] || \"不明\" : \"未確認\"}</div>\n      <div><strong>対応メモ:</strong> ${log.対応メモ || \"なし\"}</div>\n    `;\n\n    container.querySelector(\"#status-update\").value = log.確認状況 || \"未確認\";\n    container.querySelector(\"#comment-input\").value = log.対応メモ || \"\";\n    detailSection.classList.remove(\"hidden\");\n  }\n\n  function applyFilters() {\n    const startDate = container.querySelector(\"#filter-start-date\").value;\n    const endDate = container.querySelector(\"#filter-end-date\").value;\n    const anomalyType = container.querySelector(\"#filter-anomaly-type\").value;\n    const workerName = container.querySelector(\"#filter-worker-name\").value.toLowerCase();\n    const workItem = container.querySelector(\"#filter-work-item\").value;\n    const status = container.querySelector(\"#filter-status\").value;\n\n    filteredData = currentData.filter(row => {\n      // 日付フィルター\n      if (startDate && row.検出日時 && new Date(row.検出日時) < new Date(startDate)) return false;\n      if (endDate && row.検出日時 && new Date(row.検出日時) > new Date(endDate)) return false;\n      \n      // 異常値タイプフィルター\n      if (anomalyType && row.異常値種別 !== anomalyType) return false;\n      \n      // 作業員名フィルター\n      if (workerName) {\n        const userName = userMap[row.ユーザーID] || \"\";\n        if (!userName.toLowerCase().includes(workerName)) return false;\n      }\n      \n      // 作業項目フィルター（検出項目で判定）\n      if (workItem && row.検出項目 && !row.検出項目.includes(workItem)) return false;\n      \n      // ステータスフィルター\n      if (status && row.確認状況 !== status) return false;\n\n      return true;\n    });\n\n    currentPage = 1;\n    renderRows(filteredData);\n  }\n\n  function exportCSV() {\n    const headers = [\"検出日時\", \"作業員名\", \"異常値種別\", \"検出項目\", \"検出値\", \"閾値\", \"重要度\", \"確認状況\", \"対応メモ\"];\n    const csvData = [headers.join(\",\")];\n    \n    filteredData.forEach(row => {\n      const csvRow = [\n        `\"${formatDateTime(row.検出日時)}\"`,\n        `\"${userMap[row.ユーザーID] || \"\"}\"`,\n        `\"${row.異常値種別 || \"\"}\"`,\n        `\"${row.検出項目 || \"\"}\"`,\n        `\"${row.検出値 || \"\"}\"`,\n        `\"${row.閾値 || \"\"}\"`,\n        `\"${row.重要度 || \"\"}\"`,\n        `\"${row.確認状況 || \"\"}\"`,\n        `\"${row.対応メモ || \"\"}\"`\n      ];\n      csvData.push(csvRow.join(\",\"));\n    });\n\n    const csvContent = \"\\uFEFF\" + csvData.join(\"\\n\");\n    const blob = new Blob([csvContent], { type: \"text/csv;charset=utf-8;\" });\n    const link = document.createElement(\"a\");\n    link.href = URL.createObjectURL(blob);\n    link.download = `異常値検出ログ_${new Date().toISOString().slice(0, 10)}.csv`;\n    link.click();\n  }\n\n  // 初期データ読み込み\n  window.aivicApi.list(4).then(rows => {\n    if (rows) {\n      currentData = rows;\n      filteredData = rows;\n      renderRows(filteredData);\n    }\n  });\n\n  // 検索ボタン\n  container.querySelector(\"#btn-search\").addEventListener(\"click\", applyFilters);\n\n  // フィルタークリアボタン\n  container.querySelector(\"#btn-clear-filter\").addEventListener(\"click\", () => {\n    container.querySelector(\"#filter-start-date\").value = \"\";\n    container.querySelector(\"#filter-end-date\").value = \"\";\n    container.querySelector(\"#filter-anomaly-type\").value = \"\";\n    container.querySelector(\"#filter-worker-name\").value = \"\";\n    container.querySelector(\"#filter-work-item\").value = \"\";\n    container.querySelector(\"#filter-status\").value = \"\";\n    filteredData = currentData;\n    currentPage = 1;\n    renderRows(filteredData);\n  });\n\n  // エクスポートボタン\n  container.querySelector(\"#btn-export\").addEventListener(\"click\", exportCSV);\n\n  // 対応状況更新ボタン\n  container.querySelector(\"#btn-update-status\").addEventListener(\"click\", async () => {\n    if (!selectedLogId) return;\n\n    const newStatus = container.querySelector(\"#status-update\").value;\n    const comment = container.querySelector(\"#comment-input\").value;\n\n    if (comment.length > 1000) {\n      alert(\"コメントは1000文字以内で入力してください。\");\n      return;\n    }\n\n    try {\n      const updated = await window.aivicApi.update(4, selectedLogId, {\n        確認状況: newStatus,\n        対応メモ: comment,\n        確認日時: new Date().toISOString()\n      });\n\n      if (updated) {\n        // データを再読み込み\n        const rows = await window.aivicApi.list(4);\n        if (rows) {\n          currentData = rows;\n          applyFilters();\n          showDetail(selectedLogId);\n        }\n        alert(\"対応状況を更新しました。\");\n      }\n    } catch (error) {\n      alert(\"ネットワークエラーが発生しました。再度お試しください。\");\n    }\n  });\n\n  // 詳細を閉じるボタン\n  container.querySelector(\"#btn-close-detail\").addEventListener(\"click\", () => {\n    detailSection.classList.add(\"hidden\");\n    selectedLogId = null;\n  });\n\n  // ページネーション\n  btnPrev.addEventListener(\"click\", () => {\n    if (currentPage > 1) {\n      currentPage--;\n      renderRows(filteredData);\n    }\n  });\n\n  btnNext.addEventListener(\"click\", () => {\n    const totalPages = Math.ceil(filteredData.length / itemsPerPage);\n    if (currentPage < totalPages) {\n      currentPage++;\n      renderRows(filteredData);\n    }\n  });\n\n  // イベントデリゲーション\n  container.addEventListener(\"click\", (e) => {\n    const detailBtn = e.target.closest(\".detail-btn\");\n    if (detailBtn) {\n      showDetail(detailBtn.dataset.id);\n      return;\n    }\n\n    const row = e.target.closest(\"tr[data-id]\");\n    if (row && !e.target.closest(\"button\")) {\n      showDetail(row.dataset.id);\n    }\n  });\n\n  // Enterキーでの検索\n  container.addEventListener(\"keypress\", (e) => {\n    if (e.key === \"Enter\" && e.target.matches(\"input\")) {\n      applyFilters();\n    }\n  });\n}";

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();
