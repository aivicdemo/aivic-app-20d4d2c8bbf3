nction loadAnomalyLogs() {\n    try {\n      const workRecords = await window.aivicApi.list('work_records');\n      const workers = await window.aivicApi.list('workers');\n      const workItems = await window.aivicApi.list('work_items');\n      \n      // 各種異常値検出を実行\n      anomalyLogs = [];\n      \n      workRecords.forEach(record => {\n        const worker = workers.find(w => w.id === record.worker_id);\n        const workItem = workItems.find(wi => wi.id === record.work_item_id);\n        \n        // 異常値検出ロジックを呼び出し\n        const anomalousValues = detectAnomalousValues(record);\n        const dataIntegrityResult = checkDataIntegrity([record]);\n        \n        if (anomalousValues.length > 0 || !dataIntegrityResult.isValid) {\n          // 工数超過の検出\n          if (record.actual_duration > record.planned_duration * 1.2) {\n            anomalyLogs.push({\n              id: `overtime_${record.id}`,\n              detection_datetime: new Date().toISOString(),\n              worker_name: worker ? worker.name : '不明',\n              anomaly_type: '工数超過',\n              anomaly_level: '警告',\n              anomaly_content: `予定工数を${Math.round((record.actual_duration / record.planned_duration - 1) * 100)}%超過`,\n              target_data: `実績: ${record.actual_duration}分, 予定: ${record.planned_duration}分`,\n              work_item: workItem ? workItem.name : '不明',\n              status: '未処理',\n              record_id: record.id\n            });\n          }\n          \n          // 工数不足の検出\n          if (record.actual_duration < record.planned_duration * 0.5) {\n            anomalyLogs.push({\n              id: `undertime_${record.id}`,\n              detection_datetime: new Date().toISOString(),\n              worker_name: worker ? worker.name : '不明',\n              anomaly_type: '工数不足',\n              anomaly_level: '注意',\n              anomaly_content: `予定工数を${Math.round((1 - record.actual_duration / record.planned_duration) * 100)}%下回る`,\n              target_data: `実績: ${record.actual_duration}分, 予定: ${record.planned_duration}分`,\n              work_item: workItem ? workItem.name : '不明',\n              status: '未処理',\n              record_id: record.id\n            });\n          }\n          \n          // データ品質異常の検出\n          if (!dataIntegrityResult.isValid) {\n            anomalyLogs.push({\n              id: `data_quality_${record.id}`,\n              detection_datetime: new Date().toISOString(),\n              worker_name: worker ? worker.name : '不明',\n              anomaly_type: 'データ品質異常',\n              anomaly_level: 'エラー',\n              anomaly_content: dataIntegrityResult.errors.join(', '),\n              target_data: JSON.stringify(record),\n              work_item: workItem ? workItem.name : '不明',\n              status: '未処理',\n              record_id: record.id\n            });\n          }\n        }\n      });\n      \n      filteredLogs = [...anomalyLogs];\n      renderAnomalyLogs();\n      updateResultCount();\n      \n    } catch (error) {\n      window.aivicNotify.error('異常値検出ログの読み込みに失敗しました: ' + error.message);\n    }\n  }\n\n  // 異常値ログの描画\n  function renderAnomalyLogs() {\n    if (!anomalyLogTbody) return;\n    \n    anomalyLogTbody.innerHTML = '';\n    \n    filteredLogs.forEach(log => {\n      const row = document.createElement('tr');\n      row.innerHTML = `\n        <td>${new Date(log.detection_datetime).toLocaleString()}</td>\n        <td>${log.worker_name}</td>\n        <td>${log.anomaly_type}</td>\n        <td><span class=\"badge badge-${getLevelClass(log.anomaly_level)}\">${log.anomaly_level}</span></td>\n        <td>${log.anomaly_content}</td>\n        <td>${log.work_item}</td>\n        <td><span class=\"badge badge-${getStatusClass(log.status)}\">${log.status}</span></td>\n      `;\n      \n      row.addEventListener('click', () => showLogDetail(log));\n      anomalyLogTbody.appendChild(row);\n    });\n  }\n\n  // レベルに応じたCSSクラスを取得\n  function getLevelClass(level) {\n    switch (level) {\n      case 'エラー': return 'danger';\n      case '警告': return 'warning';\n      case '注意': return 'info';\n      default: return 'secondary';\n    }\n  }\n\n  // ステータスに応じたCSSクラスを取得\n  function getStatusClass(status) {\n    switch (status) {\n      case '未処理': return 'danger';\n      case '対応中': return 'warning';\n      case '完了': return 'success';\n      default: return 'secondary';\n    }\n  }\n\n  // 結果件数の更新\n  function updateResultCount() {\n    if (resultCount) {\n      resultCount.textContent = `${filteredLogs.length}件の異常値を検出`;\n    }\n  }\n\n  // ログ詳細の表示\n  function showLogDetail(log) {\n    selectedLogId = log.id;\n    \n    if (detailContent) {\n      detailContent.innerHTML = `\n        <div class=\"detail-item\">\n          <label>検出日時:</label>\n          <span>${new Date(log.detection_datetime).toLocaleString()}</span>\n        </div>\n        <div class=\"detail-item\">\n          <label>作業員:</label>\n          <span>${log.worker_name}</span>\n        </div>\n        <div class=\"detail-item\">\n          <label>異常タイプ:</label>\n          <span>${log.anomaly_type}</span>\n        </div>\n        <div class=\"detail-item\">\n          <label>レベル:</label>\n          <span class=\"badge badge-${getLevelClass(log.anomaly_level)}\">${log.anomaly_level}</span>\n        </div>\n        <div class=\"detail-item\">\n          <label>異常内容:</label>\n          <span>${log.anomaly_content}</span>\n        </div>\n        <div class=\"detail-item\">\n          <label>対象データ:</label>\n          <span>${log.target_data}</span>\n        </div>\n        <div class=\"detail-item\">\n          <label>作業項目:</label>\n          <span>${log.work_item}</span>\n        </div>\n        <div class=\"detail-item\">\n          <label>現在のステータス:</label>\n          <span class=\"badge badge-${getStatusClass(log.status)}\">${log.status}</span>\n        </div>\n      `;\n    }\n    \n    if (statusUpdate) {\n      statusUpdate.value = log.status;\n    }\n    \n    if (detailModal) {\n      detailModal.style.display = 'block';\n    }\n  }\n\n  // フィルター適用\n  function applyFilters() {\n    try {\n      filteredLogs = anomalyLogs.filter(log => {\n        // 日時フィルター\n        if (startDateFilter && startDateFilter.value) {\n          const startDate = new Date(startDateFilter.value);\n          if (new Date(log.detection_datetime) < startDate) return false;\n        }\n        \n        if (endDateFilter && endDateFilter.value) {\n          const endDate = new Date(endDateFilter.value);\n          if (new Date(log.detection_datetime) > endDate) return false;\n        }\n        \n        // 異常タイプフィルター\n        if (anomalyTypeFilter && anomalyTypeFilter.value && anomalyTypeFilter.value !== '') {\n          if (log.anomaly_type !== anomalyTypeFilter.value) return false;\n        }\n        \n        // 異常レベルフィルター\n        if (anomalyLevelFilter && anomalyLevelFilter.value && anomalyLevelFilter.value !== '') {\n          if (log.anomaly_level !== anomalyLevelFilter.value) return false;\n        }\n        \n        // 作業員名検索\n        if (workerNameSearch && workerNameSearch.value) {\n          if (!log.worker_name.includes(workerNameSearch.value)) return false;\n        }\n        \n        // 作業項目フィルター\n        if (workItemFilter && workItemFilter.value && workItemFilter.value !== '') {\n          if (log.work_item !== workItemFilter.value) return false;\n        }\n        \n        // ステータスフィルター\n        if (statusFilter && statusFilter.value && statusFilter.value !== '') {\n          if (log.status !== statusFilter.value) return false;\n        }\n        \n        return true;\n      });\n      \n      renderAnomalyLogs();\n      updateResultCount();\n      \n    } catch (error) {\n      window.aivicNotify.error('フィルター適用に失敗しました: ' + error.message);\n    }\n  }\n\n  // フィルタークリア\n  function clearFilters() {\n    try {\n      if (startDateFilter) startDateFilter.value = '';\n      if (endDateFilter) endDateFilter.value = '';\n      if (anomalyTypeFilter) anomalyTypeFilter.value = '';\n      if (anomalyLevelFilter) anomalyLevelFilter.value = '';\n      if (workerNameSearch) workerNameSearch.value = '';\n      if (workItemFilter) workItemFilter.value = '';\n      if (statusFilter) statusFilter.value = '';\n      \n      filteredLogs = [...anomalyLogs];\n      renderAnomalyLogs();\n      updateResultCount();\n      \n    } catch (error) {\n      window.aivicNotify.error('フィルタークリアに失敗しました: ' + error.message);\n    }\n  }\n\n  // ステータス更新\n  async function updateLogStatus() {\n    if (!selectedLogId || !statusUpdate) return;\n    \n    try {\n      const newStatus = statusUpdate.value;\n      const logIndex = anomalyLogs.findIndex(log => log.id === selectedLogId);\n      \n      if (logIndex !== -1) {\n        anomalyLogs[logIndex].status = newStatus;\n        \n        // APIでステータス更新（実際の実装では適切なエンドポイントを使用）\n        await window.aivicApi.update('anomaly_logs', selectedLogId, {\n          status: newStatus,\n          updated_at: new Date().toISOString()\n        });\n        \n        applyFilters(); // フィルターを再適用して表示を更新\n        \n        if (detailModal) {\n          detailModal.style.display = 'none';\n        }\n        \n        window.aivicNotify.success('ステータスを更新しました');\n      }\n      \n    } catch (error) {\n      window.aivicNotify.error('ステータス更新に失敗しました: ' + error.message);\n    }\n  }\n\n  // イベントリスナーの設定\n  if (searchButton) {\n    searchButton.addEventListener('click', applyFilters);\n  }\n  \n  if (clearFiltersButton) {\n    clearFiltersButton.addEventListener('click', clearFilters);\n  }\n  \n  if (closeModal) {\n    closeModal.addEventListener('click', () => {\n      if (detailModal) {\n        detailModal.style.display = 'none';\n      }\n    });\n  }\n  \n  if (updateStatusButton) {\n    updateStatusButton.addEventListener('click', updateLogStatus);\n  }\n\n  // モーダルの外側クリックで閉じる\n  if (detailModal) {\n    detailModal.addEventListener('click', (e) => {\n      if (e.target === detailModal) {\n        detailModal.style.display     function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
