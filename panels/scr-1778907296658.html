window.AIVIC_PAGE_INIT_JS = "javascript\nfunction(container, tables) {\n  // 業務ロジックモジュールのインポート（実際の実装では適切にインポート）\n  const { calculateWorkDuration, validateWorkRecordData, isWorkTimeValid } = window.workRecordCalc || {};\n  const { calculateInterruptionDuration, analyzeInterruptionFrequency } = window.interruptionCalc || {};\n  const { validateRequiredFields, validateTimeSequence, validateWorkDuration } = window.validationCheck || {};\n  const { detectWorkTimeAnomalies, validateWorkRecordComprehensive } = window.anomalyDetection || {};\n\n  // DOM要素の取得\n  const workDateSelect = container.querySelector('#work-date');\n  const startTimeInput = container.querySelector('#start-time');\n  const endTimeInput = container.querySelector('#end-time');\n  const workContentSelect = container.querySelector('#work-content');\n  const workLocationSelect = container.querySelector('#work-location');\n  const workerNameInput = container.querySelector('#worker-name');\n  const remarksInput = container.querySelector('#remarks');\n  const registerButton = container.querySelector('#register-button');\n  const workHoursInput = container.querySelector('#work-hours');\n  const breakTimeInput = container.querySelector('#break-time');\n  const actualHoursInput = container.querySelector('#actual-hours');\n  const workStatusSelect = container.querySelector('#work-status');\n  const suspendReasonInput = container.querySelector('#suspend-reason');\n  const suspendTimeInput = container.querySelector('#suspend-time');\n  const recordButton = container.querySelector('#record-button');\n  const startWorkButton = container.querySelector('#start-work-button');\n  const suspendButton = container.querySelector('#suspend-button');\n  const resumeButton = container.querySelector('#resume-button');\n  const recordSuspendButton = container.querySelector('#record-suspend-button');\n\n  let currentWorkSession = null;\n  let suspendHistory = [];\n\n  // 作業時間自動計算\n  function calculateAndUpdateWorkHours() {\n    const startTime = startTimeInput?.value;\n    const endTime = endTimeInput?.value;\n    const breakMinutes = parseInt(breakTimeInput?.value || '0');\n\n    if (startTime && endTime) {\n      try {\n        const duration = calculateWorkDuration ? \n          calculateWorkDuration(startTime, endTime) : \n          calculateBasicDuration(startTime, endTime);\n        \n        if (workHoursInput) {\n          workHoursInput.value = formatDuration(duration);\n        }\n\n        // 休憩時間を考慮した実働時間\n        const actualMinutes = duration - breakMinutes;\n        if (actualHoursInput && actualMinutes >= 0) {\n          actualHoursInput.value = formatDuration(actualMinutes);\n        }\n      } catch (error) {\n        console.error('時間計算エラー:', error);\n      }\n    }\n  }\n\n  // 基本的な時間計算（フォールバック）\n  function calculateBasicDuration(startTime, endTime) {\n    const start = new Date(`2000-01-01 ${startTime}`);\n    const end = new Date(`2000-01-01 ${endTime}`);\n    return Math.max(0, (end - start) / (1000 * 60));\n  }\n\n  // 分を時:分形式に変換\n  function formatDuration(minutes) {\n    const hours = Math.floor(minutes / 60);\n    const mins = minutes % 60;\n    return `${hours}:${mins.toString().padStart(2, '0')}`;\n  }\n\n  // カレンダー表示/非表示\n  function toggleCalendar() {\n    let calendar = container.querySelector('.calendar');\n    if (!calendar) {\n      calendar = createCalendar();\n      container.appendChild(calendar);\n    }\n    calendar.style.display = calendar.style.display === 'none' ? 'block' : 'none';\n  }\n\n  // カレンダー作成\n  function createCalendar() {\n    const calendar = document.createElement('div');\n    calendar.className = 'calendar';\n    calendar.style.cssText = 'position: absolute; background: white; border: 1px solid #ccc; padding: 10px; z-index: 1000;';\n    \n    const today = new Date();\n    const year = today.getFullYear();\n    const month = today.getMonth();\n    \n    for (let day = 1; day <= 31; day++) {\n      const dayButton = document.createElement('button');\n      dayButton.textContent = day;\n      dayButton.setAttribute('data-date', day);\n      dayButton.style.cssText = 'margin: 2px; padding: 5px; border: 1px solid #ddd;';\n      \n      dayButton.addEventListener('click', (e) => {\n        e.preventDefault();\n        const selectedDate = `${year}-${(month + 1).toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;\n        if (workDateSelect) {\n          workDateSelect.value = selectedDate;\n        }\n        calendar.style.display = 'none';\n      });\n      \n      calendar.appendChild(dayButton);\n    }\n    \n    return calendar;\n  }\n\n  // 作業記録登録\n  async function registerWorkRecord() {\n    try {\n      const workData = {\n        workDate: workDateSelect?.value,\n        startTime: startTimeInput?.value,\n        endTime: endTimeInput?.value,\n        workContent: workContentSelect?.value,\n        workLocation: workLocationSelect?.value,\n        workerName: workerNameInput?.value,\n        remarks: remarksInput?.value,\n        breakTime: breakTimeInput?.value,\n        actualHours: actualHoursInput?.value,\n        suspendHistory: suspendHistory\n      };\n\n      // バリデーション\n      if (validateRequiredFields) {\n        const requiredValidation = validateRequiredFields(workData);\n        if (!requiredValidation.isValid) {\n          window.aivicNotify?.error(requiredValidation.message || '必須項目が入力されていません');\n          return;\n        }\n      }\n\n      if (validateTimeSequence) {\n        const timeValidation = validateTimeSequence(workData.startTime, workData.endTime);\n        if (!timeValidation.isValid) {\n          window.aivicNotify?.error(timeValidation.message || '時刻の入力に誤りがあります');\n          return;\n        }\n      }\n\n      if (validateWorkRecordComprehensive) {\n        const comprehensiveValidation = validateWorkRecordComprehensive(workData);\n        if (!comprehensiveValidation.isValid) {\n          window.aivicNotify?.error(comprehensiveValidation.message || 'データに異常が検出されました');\n          return;\n        }\n      }\n\n      // データ保存\n      const result = await window.aivicApi?.save('work_records', workData);\n      \n      if (result) {\n        showSuccessMessage();\n        clearForm();\n        suspendHistory = [];\n      }\n    } catch (error) {\n      console.error('登録エラー:', error);\n      window.aivicNotify?.error('登録に失敗しました');\n    }\n  }\n\n  // 中断記録\n  async function recordSuspension() {\n    try {\n      const suspendData = {\n        workContent: workStatusSelect?.value,\n        startTime: startTimeInput?.value,\n        suspendReason: suspendReasonInput?.value,\n        suspendTime: suspendTimeInput?.value,\n        timestamp: new Date().toISOString()\n      };\n\n      if (calculateInterruptionDuration) {\n        const duration = calculateInterruptionDuration(suspendData.startTime, suspendData.suspendTime);\n        suspendData.duration = duration;\n      }\n\n      suspendHistory.push(suspendData);\n\n      const result = await window.aivicApi?.save('work_interruptions', suspendData);\n      \n      if (result) {\n        showSuccessMessage();\n        updateSuspendHistory();\n      }\n    } catch (error) {\n      console.error('中断記録エラー:', error);\n      window.aivicNotify?.error('中断記録に失敗しました');\n    }\n  }\n\n  // 作業開始\n  function startWork() {\n    currentWorkSession = {\n      startTime: new Date().toISOString(),\n      status: 'working'\n    };\n    \n    if (startTimeInput) {\n      const now = new Date();\n      startTimeInput.value = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;\n    }\n    \n    updateWorkStatus('作業中');\n  }\n\n  // 作業中断\n  function suspendWork() {\n    if (currentWorkSession) {\n      currentWorkSession.status = 'suspended';\n      currentWorkSession.suspendTime = new Date().toISOString();\n    }\n    updateWorkStatus('中断中');\n  }\n\n  // 作業再開\n  function resumeWork() {\n    if (currentWorkSession) {\n      currentWorkSession.status = 'working';\n      currentWorkSession.resumeTime = new Date().toISOString();\n    }\n    updateWorkStatus('作業中');\n  }\n\n  // 成功メッセージ表示\n  function showSuccessMessage() {\n    let successMessage = container.querySelector('.success-message');\n    if (!successMessage) {\n      successMessage = document.createElement('div');\n      successMessage.className = 'success-message';\n      successMessage.style.cssText = 'color: green; padding: 10px; margin: 10px 0; border: 1px solid green; background: #f0fff0;';\n      container.appendChild(successMessage);\n    }\n    successMessage.textContent = '登録が完了しました';\n    successMessage.style.display = 'block';\n    \n    setTimeout(() => {\n      successMessage.style.display = 'none';\n    }, 3000);\n  }\n\n  // フォームクリア\n  function clearForm() {\n    const inputs = container.querySelectorAll('input, select, textarea');\n    inputs.forEach(input => {\n      if (input.type === 'text' || input.type === 'time' || input.tagName === 'TEXTAREA') {\n        input.value = '';\n      } else if (input.tagName === 'SELECT') {\n        input.selectedIndex = 0;\n      }\n    });\n  }\n\n  // 作業状態更新\n  function updateWorkStatus(status) {\n    let statusDisplay = container.querySelector('.work-status-display');\n    if (!statusDisplay) {\n      statusDisplay = document.createElement('div');\n      statusDisplay.className = 'work-status-display';\n      statusDisplay.style.cssText = 'padding: 10px; margin: 10px 0; font-weight: bold;';\n      container.appendChild(statusDisplay);\n    }\n    statusDisplay.textContent = `現在の状態: ${status}`;\n  }\n\n  // 中断履歴更新\n  function updateSuspendHistory() {\n    let historyContainer = container.querySelector('.suspend-history-container');\n    if (!historyContainer) {\n      historyContainer = document.createElement('div');\n      historyContainer.className = 'suspend-history-container';\n      container.appendChild(historyContainer);\n    }\n    \n    historyContainer.innerHTML = '';\n    suspendHistory.forEach((suspend, index) => {\n      const historyItem = document.createElement('div');\n      historyItem.className = 'suspend-history';\n      historyItem.textContent = `${suspend.suspendReason} (${suspend.suspendTime})`;\n      historyContainer.appendChild(historyItem);\n    });\n  }\n\n  // イベントリスナー設定\n  if (workDateSelect) {\n    workDateSelect.addEventListener('click', toggleCalendar);\n  }\n\n  if (startTimeInput) {\n    startTimeInput.addEventListener('change', calculateAndUpdateWorkHours);\n  }\n\n  if (endTimeInput) {\n    endTimeInput.addEventListener('change', calculateAndUpdateWorkHours);\n  }\n\n  if (breakTimeInput) {\n    breakTimeInput.addEventListener('input', calculateAndUpdateWorkHours);\n  }\n\n  if (registerButton) {\n    registerButton.addEventListener('click', (e) => {\n      e.preventDefault();\n      registerWorkRecord();\n    });\n  }\n\n  if (recordButton) {\n    recordButton.addEventListener('click', (e) => {\n      e.preventDefault();\n      recordSuspension();\n    });\n  }\n\n  if (startWorkButton) {\n    startWorkButton.addEventListener('click', (e) => {\n      e.preventDefault();\n      startWork();\n    });\n  }\n\n  if (suspendButton) {\n    suspendButton.addEventListener('click', (e) => {\n      e.preventDefault();\n      suspendWork();\n    });\n  }\n\n  if (resumeButton) {\n    resumeButton.addEventListener('click', (e) => {\n      e.preventDefault();\n      resumeWork();\n    });\n  }\n\n  if (recordSuspendButton) {\n    recordSuspendButton.addEventListener('click', (e) => {\n      e.preventDefault();\n      recordSuspension();\n    });\n  }\n\n  // 作業項目の初期化\n  if (workContentSelect) {\n    const workOptions = [\n      { value: '', text: '選択してください' },\n      { value: 'construction', text: '建設作業' },\n      { value: 'maintenance', text: 'メンテナンス' },\n      { value: 'inspection', text: '点検作業' }\n    ];\n    \n    workOptions.forEach(option => {\n      const optionElement = document.createElement('option');\n      optionElement.value = option.value;\n      optionElement.textContent = option.text;\n      workContentSelect.appendChild(optionElement);\n    });\n  }\n\n  // 作業場所の初期化\n  if (workLocationSelect) {\n    const locationOptions = [\n      { value: '', text: '選択してください' },\n      { value: 'site-a', text: '現場A' },\n      { value: 'site-b', text: '現場B' },\n      { value: 'site-c', text: '現場C' }\n    ];\n    \n    locationOptions.forEach(option => {\n      const optionElement = document.createElement('option');\n      option.value = option.value;\n      optionElement.textContent = option.text;\n      workLocationSelect.appendChild(optionElement);\n    });\n  }\n\n  // 作業状態の初期化\n  if (workStatusSelect) {\n    const statusOptions = [\n      { value: '', text: '選択してください' },\n      { value: 'working', text: '作業中' },\n      { value: 'suspended', text: '中断' },\n      { value: 'completed', text: '完了' }\n    ];\n    \n    statusOptions.forEach(option => {\n      const optionElement = document.createElement('option');\n      optionElement.value = option.value;\n      optionElement.textContent = option.text;\n      workStatusSelect.appendChild(optionElement);\n    });\n  }\n\n  // 中断理由の初期化\n  if (suspendReasonInput && suspendReasonInput.tagName === 'SELECT') {\n    const reasonOptions = [\n      { value: '', text: '選択してください' },\n      { value: '資材確認', text: '資材確認' },\n      { value: '打ち合わせ', text: '打ち合わせ' },\n      { value: '休憩', text: '休憩' },\n      { value: '機材確認', text: '機材確認' }\n    ];\n    \n    reasonOptions.forEach(option => {\n      const optionElement = document.createElement('option');\n      optionElement.value = option.value;\n      optionElement.textContent = option.text;\n      suspendReasonInput.appendChild(optionElement);\n    });\n  }\n\n  // 初期日付設定\n  if (workDateSelect) {\n    const today = new Date();\n    const dateOptions = [];\n    for (let i = -7; i <= 7; i++) {\n      const date = new Date(today);\n      date.setDate(today.getDate() + i);\n      const dateStr = date.toISOString().split('T')[0];\n      dateOptions.push({ value: dateStr, text: dateStr });\n    }\n    \n    dateOptions.forEach(option => {\n      const optionElement = document.createElement('option');\n      optionElement.value = option.value;\n      optionElement.textContent = option.text;\n      workDateSelect.appendChild(optionElement);\n    });\n  }\n}";

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: "⏱";
            font-size: 18px;
        }

        .nav-section {
            padding: 8px 0;
        }

        .nav-section-title {
            padding: 6px 16px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: block;
            padding: 8px 16px;
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: rgba(196, 30, 58, 0.08);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: var(--primary-light);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .breadcrumb {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .logout-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.15s ease;
        }

        .logout-link:hover {
            background: var(--border-light);
            color: var(--text);
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        .panel-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quick-action-btn {
            padding: 10px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quick-action-btn:hover {
            background: var(--primary-hover);
        }

        .quick-action-btn.secondary {
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .quick-action-btn.secondary:hover {
            background: var(--border-light);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
        }

        .stat-change {
            font-size: 11px;
            margin-top: 4px;
        }

        .stat-change.positive {
            color: var(--success);
        }

        .stat-change.negative {
            color: var(--danger);
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
            }

            .sidebar-header {
                padding: 12px 8px;
            }

            .logo {
                justify-content: center;
                font-size: 0;
            }

            .nav-section-title {
                display: none;
            }

            .nav-item {
                padding: 12px 8px;
                text-align: center;
                font-size: 0;
                position: relative;
            }

            .nav-item::before {
                font-size: 16px;
            }

            .content-area {
                padding: 12px 16px;
            }

            .quick-actions {
                flex-direction: column;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

                    <div data-aivic-panel="scr-1778907380182" style="display:none"></div>
                </div>

        </main>
    </div>

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
