ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type":"text","required":false,"description":"管理者による対応内容や備考"},{"name":"検出日時","type":"timestamp","required":true,"description":"異常値が検出された日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]}];

window.AIVIC_PAGE_INIT_JS = "javascript\nfunction(container, tables) {\n  // 業務ロジックモジュールのインポート\n  const { detectWorkTimeAnomaly, detectBreakTimeAnomaly, detectFrequentBreaks, calculateAnomalyScore, isEmergencyWorkTime, detectTimeSequenceAnomaly, detectShortWorkTime, calculateAnomalySeverity, calculateCorrectionValue, isOutlier, detectSignificantVariation, validateRequiredFields, calculateDataQualityScore, performComprehensiveAnomalyDetection } = window.aivicLogic.anomalyDetection;\n  const { calculateEfficiencyRate, detectBottleneck, analyzeBreakReasons, calculateProductivityIndex, isEfficiencyAlert } = window.aivicLogic.productivityAnalysis;\n  const { validateRequiredFields: validateFields, validateTimeSequence, validateDuplicateRecord, isDataIntegrityValid, detectAnomalousValues, validateInterruptionTime, validateWorkRecordComprehensive, validateMonthlyWorkData } = window.aivicLogic.workValidation;\n  const { aggregateMonthlyHours, aggregateByCategory, calculateSeasonalVariation, aggregateRealTimeData, detectAnomalies, calculateProgressAndDeviation, analyzeWorkEfficiency } = window.aivicLogic.dataAggregation;\n\n  // DOM要素の取得\n  const startDateInput = container.querySelector('input[type=\"date\"]:first-of-type');\n  const endDateInput = container.querySelector('input[type=\"date\"]:nth-of-type(2)');\n  const detectButton = container.querySelector('button:has-text(\"異常値検出実行\")') || \n                      Array.from(container.querySelectorAll('button')).find(btn => btn.textContent.includes('異常値検出実行'));\n  const startButton = container.querySelector('button:has-text(\"検出開始\")') || \n                     Array.from(container.querySelectorAll('button')).find(btn => btn.textContent.includes('検出開始'));\n  const cancelButton = container.querySelector('button:has-text(\"キャンセル\")') || \n                      Array.from(container.querySelectorAll('button')).find(btn => btn.textContent.includes('キャンセル'));\n  const listButton = container.querySelector('button:has-text(\"検出された異常値一覧\")') || \n                    Array.from(container.querySelectorAll('button')).find(btn => btn.textContent.includes('検出された異常値一覧'));\n  const progressBar = container.querySelector('.progress-bar');\n  const progressText = container.querySelector('.progress-text');\n  const resultsContainer = container.querySelector('.results-container');\n  const anomalyTable = container.querySelector('table');\n\n  let detectionInProgress = false;\n  let detectionCancelled = false;\n  let currentAnomalies = [];\n\n  // 進捗表示の更新\n  function updateProgress(percentage, text) {\n    if (progressBar) {\n      progressBar.style.width = `${percentage}%`;\n    }\n    if (progressText) {\n      progressText.textContent = text || `${percentage}%`;\n    }\n  }\n\n  // 結果表示の更新\n  function displayResults(anomalies) {\n    if (resultsContainer) {\n      resultsContainer.style.display = 'block';\n      const resultText = document.createElement('div');\n      resultText.textContent = '処理完了';\n      resultText.style.marginBottom = '10px';\n      resultsContainer.appendChild(resultText);\n\n      const detectionResult = document.createElement('div');\n      detectionResult.textContent = '検出結果';\n      detectionResult.style.fontWeight = 'bold';\n      resultsContainer.appendChild(detectionResult);\n    }\n  }\n\n  // 異常値テーブルの表示\n  function displayAnomalyTable(anomalies) {\n    if (!anomalyTable) return;\n\n    // テーブルヘッダーの確認・作成\n    let thead = anomalyTable.querySelector('thead');\n    if (!thead) {\n      thead = document.createElement('thead');\n      const headerRow = document.createElement('tr');\n      ['作業日時', '作業員名', '工数値', '異常種類', '重要度'].forEach(text => {\n        const th = document.createElement('th');\n        th.textContent = text;\n        headerRow.appendChild(th);\n      });\n      thead.appendChild(headerRow);\n      anomalyTable.appendChild(thead);\n    }\n\n    // テーブルボディの更新\n    let tbody = anomalyTable.querySelector('tbody');\n    if (!tbody) {\n      tbody = document.createElement('tbody');\n      anomalyTable.appendChild(tbody);\n    }\n    tbody.innerHTML = '';\n\n    anomalies.forEach((anomaly, index) => {\n      const row = document.createElement('tr');\n      row.className = 'work-record-row';\n      row.style.cursor = 'pointer';\n      \n      const cells = [\n        anomaly.record?.work_date || '-',\n        anomaly.record?.worker_name || '-',\n        anomaly.record?.work_hours || '-',\n        anomaly.type || '-',\n        anomaly.severity || 'medium'\n      ];\n\n      cells.forEach(cellText => {\n        const td = document.createElement('td');\n        td.textContent = cellText;\n        row.appendChild(td);\n      });\n\n      // 異常値アイコンの追加\n      const iconCell = document.createElement('td');\n      const icon = document.createElement('span');\n      icon.className = 'anomaly-icon';\n      icon.textContent = '⚠️';\n      icon.style.cursor = 'pointer';\n      iconCell.appendChild(icon);\n      row.appendChild(iconCell);\n\n      // 行クリックイベント\n      row.addEventListener('click', () => {\n        showAnomalyDetails(anomaly);\n      });\n\n      tbody.appendChild(row);\n    });\n\n    anomalyTable.style.display = 'table';\n  }\n\n  // 異常値詳細表示\n  function showAnomalyDetails(anomaly) {\n    let detailsContainer = container.querySelector('.anomaly-details');\n    if (!detailsContainer) {\n      detailsContainer = document.createElement('div');\n      detailsContainer.className = 'anomaly-details';\n      detailsContainer.style.cssText = 'border: 1px solid #ccc; padding: 15px; margin: 10px 0; background: #f9f9f9;';\n      container.appendChild(detailsContainer);\n    }\n\n    detailsContainer.innerHTML = `\n      <h3>異常値詳細情報</h3>\n      <p><strong>異常値の種類:</strong> ${anomaly.type}</p>\n      <p><strong>検出理由:</strong> ${anomaly.reason || '基準値を超過'}</p>\n      <p><strong>修正推奨値:</strong> ${anomaly.correctionValue || calculateCorrectionValue(anomaly.record) || '要確認'}</p>\n      <p><strong>重要度:</strong> ${anomaly.severity}</p>\n    `;\n    detailsContainer.style.display = 'block';\n  }\n\n  // 異常値検出実行ボタンのイベントハンドラ\n  if (detectButton) {\n    detectButton.addEventListener('click', async () => {\n      try {\n        const startDate = startDateInput?.value;\n        const endDate = endDateInput?.value;\n\n        if (!startDate || !endDate) {\n          window.aivicNotify.error('検出対象期間を選択してください');\n          return;\n        }\n\n        if (new Date(startDate) > new Date(endDate)) {\n          window.aivicNotify.error('開始日は終了日より前の日付を選択してください');\n          return;\n        }\n\n        detectionInProgress = true;\n        updateProgress(0, '処理開始');\n\n        // 工数データの取得\n        const workRecords = await window.aivicApi.list('work_records', {\n          start_date: startDate,\n          end_date: endDate\n        });\n\n        if (!workRecords || workRecords.length === 0) {\n          window.aivicNotify.error('指定期間にデータが見つかりません');\n          return;\n        }\n\n        updateProgress(25, 'データ検証中');\n\n        // 包括的異常検出の実行\n        const comprehensiveResult = performComprehensiveAnomalyDetection(workRecords);\n        currentAnomalies = comprehensiveResult.anomalies || [];\n\n        updateProgress(50, '異常値検出中');\n\n        // 追加の個別検出処理\n        for (let i = 0; i < workRecords.length; i++) {\n          const record = workRecords[i];\n          \n          // 作業時間異常検出\n          const timeAnomaly = detectWorkTimeAnomaly(record);\n          if (timeAnomaly.isAnomaly) {\n            currentAnomalies.push({\n              type: '作業時間異常',\n              record: record,\n              reason: timeAnomaly.reason,\n              severity: calculateAnomalySeverity(record),\n              correctionValue: calculateCorrectionValue(record)\n            });\n          }\n\n          // 休憩時間異常検出\n          const breakAnomaly = detectBreakTimeAnomaly(record);\n          if (breakAnomaly.isAnomaly) {\n            currentAnomalies.push({\n              type: '休憩時間異常',\n              record: record,\n              reason: breakAnomaly.reason,\n              severity: 'medium'\n            });\n          }\n\n          // 短時間作業検出\n          if (detectShortWorkTime(record)) {\n            currentAnomalies.push({\n              type: '短時間作業',\n              record: record,\n              reason: '作業時間が短すぎます',\n              severity: 'low'\n            });\n          }\n\n          // 効率性チェック\n          const efficiency = calculateEfficiencyRate(record);\n          if (isEfficiencyAlert(efficiency)) {\n            currentAnomalies.push({\n              type: '効率性低下',\n              record: record,\n              reason: '作業効率が基準を下回っています',\n              severity: 'medium'\n            });\n          }\n\n          updateProgress(50 + (i / workRecords.length) * 40, '検出処理中');\n        }\n\n        updateProgress(100, '検出処理完了');\n        displayResults(currentAnomalies);\n        \n        detectionInProgress = false;\n        window.aivicNotify.success(`異常値検出が完了しました。${currentAnomalies.length}件の異常を検出しました。`);\n\n      } catch (error) {\n        console.error('異常値検出エラー:', error);\n        window.aivicNotify.error('異常値検出処理中にエラーが発生しました');\n        detectionInProgress = false;\n      }\n    });\n  }\n\n  // 検出開始ボタンのイベントハンドラ\n  if (startButton) {\n    startButton.addEventListener('click', async () => {\n      if (detectionInProgress) return;\n\n      detectionInProgress = true;\n      detectionCancelled = false;\n      \n      updateProgress(0, '0%');\n      if (progressBar) progressBar.parentElement.style.display = 'block';\n      if (cancelButton) cancelButton.style.display = 'inline-block';\n\n      // 段階的な進捗表示\n      for (let i = 0; i <= 100; i += 10) {\n        if (detectionCancelled) break;\n        \n        updateProgress(i, `${i}%`);\n        await new Promise(resolve => setTimeout(resolve, 200));\n      }\n\n      if (!detectionCancelled) {\n        updateProgress(100, '100%');\n        displayResults(currentAnomalies);\n        \n        // 完了メッセージの表示\n        setTimeout(() => {\n          const completionMsg = document.createElement('div');\n          completionMsg.textContent = '検出処理完了';\n          completionMsg.style.cssText = 'color: green; font-weight: bold; margin: 10px 0;';\n          if (resultsContainer) {\n            resultsContainer.appendChild(completionMsg);\n          }\n        }, 500);\n      }\n\n      detectionInProgress = false;\n      if (cancelButton) cancelButton.style.display = 'none';\n    });\n  }\n\n  // キャンセルボタンのイベントハンドラ\n  if (cancelButton) {\n    cancelButton.addEventListener('click', () => {\n      detectionCancelled = true;\n      detectionInProgress = false;\n      updateProgress(0, 'キャンセルされました');\n      cancelButton.style.display = 'none';\n      window.aivicNotify.info('検出処理をキャンセルしました');\n    });\n  }\n\n  // 異常値一覧表示ボタンのイベントハンドラ\n  if (listButton) {\n    listButton.addEventListener('click', () => {\n      if (currentAnomalies.length === 0) {\n        window.aivicNotify.info('検出された異常値がありません');\n        return;\n      }\n      displayAnomalyTable(currentAnomalies);\n    });\n  }\n\n  // 初期化時の日付設定\n  if (startDateInput && endDateInput) {\n    const today = new Date();\n    const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);\n    const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);\n    \n    startDateInput.value = firstDay.toISOString().split('T')[0];\n    endDateInput.value = lastDay.toISOString().split('T')[0];\n  }\n\n  // 初期状態の設定\n  if (progressBar && progressBar.parentElement) {\n    progressBar.parentElement.style.display = 'none';\n  }\n  if (cancelButton) {\n    cancelButton.style.display = 'none';\n  }\n  if (resultsContainer) {\n    resultsContainer.style.display = 'none';\n  }\n}";
</script>

                    <div data-aivic-panel="scr-1778907353387" style="display:none"></div>
                    <div data-aivic-panel="scr-1778907367889" style="display:none"></div>
                    <div data-aivic-panel="scr-1778907380182" style="display:none"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
