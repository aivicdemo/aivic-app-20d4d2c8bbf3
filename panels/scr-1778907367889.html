window.AIVIC_TABLES = [{"tableName":"ユーザー","purpose":"現場作業員のアカウント情報と認証情報を管理する","columns":[{"name":"ユーザーID","type":"uuid","required":true,"description":"ユーザーの一意識別子（主キー）"},{"name":"ユーザー名","type":"varchar(100)","required":true,"description":"ログイン用のユーザー名"},{"name":"パスワードハッシュ","type":"varchar(100)","required":true,"description":"ハッシュ化されたパスワード"},{"name":"氏名","type":"varchar(100)","required":true,"description":"作業員の実名"},{"name":"所属部署","type":"varchar(100)","required":false,"description":"作業員が所属する部署名"},{"name":"職種","type":"varchar(100)","required":false,"description":"作業員の職種・役職"},{"name":"権限レベル","type":"varchar(100)","required":true,"description":"システム内での権限（一般作業員、管理者等）"},{"name":"有効フラグ","type":"boolean","required":true,"description":"アカウントの有効/無効状態"},{"name":"最終ログイン日時","type":"timestamp","required":false,"description":"最後にログインした日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者","type":"varchar(100)","required":true,"description":"レコード作成者"}]},{"tableName":"作業記録","purpose":"現場作業員の日々の作業時間と内容を記録し、工数管理と実績分析を行うためのトランザクションテーブル","columns":[{"name":"作業記録ID","type":"uuid","required":true,"description":"作業記録の一意識別子（主キー）"},{"name":"作業員ID","type":"uuid","required":true,"description":"作業を行った作業員のID（ユーザーテーブル外部キー）"},{"name":"作業日","type":"timestamp","required":true,"description":"作業を実施した日付"},{"name":"作業開始時刻","type":"timestamp","required":true,"description":"作業開始の日時"},{"name":"作業終了時刻","type":"timestamp","required":false,"description":"作業終了の日時（作業中の場合はnull）"},{"name":"作業時間","type":"integer","required":false,"description":"実際の作業時間（分単位、終了時に自動計算）"},{"name":"プロジェクト名","type":"varchar(100)","required":true,"description":"作業対象のプロジェクト名"},{"name":"作業場所","type":"varchar(100)","required":true,"description":"作業を実施した現場・場所"},{"name":"作業種別","type":"varchar(100)","required":true,"description":"作業の種類（設置、点検、修理等）"},{"name":"作業内容","type":"text","required":true,"description":"具体的な作業内容の詳細"},{"name":"進捗状況","type":"varchar(100)","required":true,"description":"作業の進捗状態（作業中、完了、中断等）"},{"name":"備考","type":"text","required":false,"description":"特記事項や注意点等の補足情報"},{"name":"承認状態","type":"varchar(100)","required":true,"description":"記録の承認状況（未承認、承認済み、差し戻し）"},{"name":"承認者ID","type":"uuid","required":false,"description":"記録を承認した管理者のID"},{"name":"承認日時","type":"timestamp","required":false,"description":"承認が行われた日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"}]},{"tableName":"中断記録","purpose":"作業中断の発生理由、時間、影響を記録し、作業効率分析と改善に活用する","columns":[{"name":"中断記録ID","type":"uuid","required":true,"description":"中断記録の一意識別子（主キー）"},{"name":"作業記録ID","type":"uuid","required":true,"description":"中断が発生した作業記録への外部キー"},{"name":"中断開始日時","type":"timestamp","required":true,"description":"作業を中断した日時"},{"name":"中断終了日時","type":"timestamp","required":false,"description":"作業を再開した日時"},{"name":"中断理由区分","type":"varchar(100)","required":true,"description":"中断理由の分類（機械故障、材料不足、天候、休憩等）"},{"name":"中断理由詳細","type":"text","required":false,"description":"中断理由の具体的な内容"},{"name":"中断時間","type":"integer","required":false,"description":"中断時間（分）"},{"name":"影響度","type":"varchar(100)","required":false,"description":"作業への影響度（軽微、中程度、重大）"},{"name":"対応状況","type":"varchar(100)","required":true,"description":"中断への対応状況（対応中、解決済み、未対応）"},{"name":"記録者ID","type":"uuid","required":true,"description":"中断を記録した作業員のユーザーID"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]},{"tableName":"作業項目マスタ","purpose":"現場作業員が工数記録時に選択する作業項目の定義と管理を行う","columns":[{"name":"作業項目ID","type":"uuid","required":true,"description":"作業項目の一意識別子（主キー）"},{"name":"作業項目コード","type":"varchar(100)","required":true,"description":"作業項目の業務コード（検索・表示用）"},{"name":"作業項目名","type":"varchar(100)","required":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type":"text","required":false,"description":"管理者による対応内容や備考"},{"name":"検出日時","type":"timestamp","required":true,"description":"異常値が検出された日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  const tbody = container.querySelector(\"#records-tbody\");\n  const emptyMessage = container.querySelector(\"#empty-message\");\n  const detailModal = container.querySelector(\"#detail-modal\");\n  const detailContent = container.querySelector(\"#detail-content\");\n  \n  // ユーザーデータをマップ化\n  const userMap = new Map();\n  if (tables[0]) {\n    (tables[0].records || []).forEach(user => {\n      userMap.set(user.ユーザーID, user.氏名 || user.ユーザー名 || '不明');\n    });\n  }\n\n  // 中断記録データをマップ化\n  const breakMap = new Map();\n  if (tables[2]) {\n    (tables[2].records || []).forEach(breakRecord => {\n      if (!breakMap.has(breakRecord.作業記録ID)) {\n        breakMap.set(breakRecord.作業記録ID, []);\n      }\n      breakMap.get(breakRecord.作業記録ID).push(breakRecord);\n    });\n  }\n\n  // 異常値検出関数\n  function detectAnomalies(record) {\n    const warnings = [];\n    \n    // 作業時間が24時間を超える場合\n    if (record.作業時間 && record.作業時間 > 1440) { // 1440分 = 24時間\n      warnings.push('24時間超過');\n    }\n    \n    // 終了時刻が開始時刻より早い場合\n    if (record.作業開始時刻 && record.作業終了時刻) {\n      const start = new Date(record.作業開始時刻);\n      const end = new Date(record.作業終了時刻);\n      if (end < start) {\n        warnings.push('時刻異常');\n      }\n    }\n    \n    // 中断時間が実働時間を超える場合\n    const breaks = breakMap.get(record.作業記録ID) || [];\n    const totalBreakTime = breaks.reduce((sum, b) => sum + (b.中断時間 || 0), 0);\n    if (record.作業時間 && totalBreakTime > record.作業時間) {\n      warnings.push('中断時間異常');\n    }\n    \n    return warnings;\n  }\n\n  // 時間フォーマット関数\n  function formatTime(dateTimeStr) {\n    if (!dateTimeStr) return '';\n    const date = new Date(dateTimeStr);\n    return date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });\n  }\n\n  // 作業時間フォーマット関数\n  function formatWorkTime(minutes) {\n    if (!minutes) return '';\n    const hours = Math.floor(minutes / 60);\n    const mins = minutes % 60;\n    return `${hours}時間${mins}分`;\n  }\n\n  // 日付フォーマット関数\n  function formatDate(dateStr) {\n    if (!dateStr) return '';\n    const date = new Date(dateStr);\n    return date.toLocaleDateString('ja-JP');\n  }\n\n  // テーブル再描画関数\n  function renderRows(rows) {\n    if (!rows || rows.length === 0) {\n      tbody.innerHTML = '';\n      emptyMessage.classList.remove('hidden');\n      return;\n    }\n    \n    emptyMessage.classList.add('hidden');\n    tbody.innerHTML = rows.map(record => {\n      const userName = userMap.get(record.作業員ID) || '不明';\n      const breaks = breakMap.get(record.作業記録ID) || [];\n      const totalBreakTime = breaks.reduce((sum, b) => sum + (b.中断時間 || 0), 0);\n      const warnings = detectAnomalies(record);\n      \n      const warningIcon = warnings.length > 0 \n        ? `<span style=\"color: #ff6b6b; font-size: 16px;\" title=\"${warnings.join(', ')}\">⚠️</span>`\n        : '';\n      \n      const statusBadge = record.承認状態 === '承認済み' \n        ? `<span style=\"background: #28a745; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px;\">承認済み</span>`\n        : record.承認状態 === '差し戻し'\n        ? `<span style=\"background: #dc3545; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px;\">差し戻し</span>`\n        : `<span style=\"background: #ffc107; color: #000; padding: 2px 6px; border-radius: 4px; font-size: 11px;\">未承認</span>`;\n\n      const canEdit = record.承認状態 !== '承認済み';\n      const editButton = canEdit \n        ? `<button class=\"action-btn secondary edit-btn\" data-id=\"${record.作業記録ID}\" style=\"margin-right: 4px;\">修正</button>`\n        : '';\n\n      return `\n        <tr data-id=\"${record.作業記録ID}\" style=\"height: 36px; border-bottom: 1px solid rgba(255,255,255,0.02);\">\n          <td style=\"padding: 6px 10px; color: var(--text);\">${formatDate(record.作業日)}</td>\n          <td style=\"padding: 6px 10px; color: var(--text);\">${userName}</td>\n          <td style=\"padding: 6px 10px; color: var(--text);\">${formatTime(record.作業開始時刻)}</td>\n          <td style=\"padding: 6px 10px; color: var(--text);\">${formatTime(record.作業終了時刻)}</td>\n          <td style=\"padding: 6px 10px; color: var(--text);\">${formatWorkTime(record.作業時間)}</td>\n          <td style=\"padding: 6px 10px; color: var(--text);\">${formatWorkTime(totalBreakTime)}</td>\n          <td style=\"padding: 6px 10px; color: var(--text); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">${record.作業内容 || ''}</td>\n          <td style=\"padding: 6px 10px;\">${statusBadge}</td>\n          <td style=\"padding: 6px 10px; text-align: center;\">${warningIcon}</td>\n          <td style=\"padding: 6px 10px; text-align: center;\">\n            ${editButton}\n            <button class=\"action-btn secondary detail-btn\" data-id=\"${record.作業記録ID}\" style=\"margin-right: 4px;\">詳細</button>\n            <button class=\"action-btn secondary delete-btn\" data-id=\"${record.作業記録ID}\">削除</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // 詳細表示関数\n  function showDetail(recordId) {\n    const record = (tables[1].records || []).find(r => r.作業記録ID === recordId);\n    if (!record) return;\n    \n    const userName = userMap.get(record.作業員ID) || '不明';\n    const breaks = breakMap.get(record.作業記録ID) || [];\n    const totalBreakTime = breaks.reduce((sum, b) => sum + (b.中断時間 || 0), 0);\n    const warnings = detectAnomalies(record);\n    \n    detailContent.innerHTML = `\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;\">\n        <div>\n          <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">作業日</label>\n          <div style=\"font-size: 13px; color: var(--text);\">${formatDate(record.作業日)}</div>\n        </div>\n        <div>\n          <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">作業者</label>\n          <div style=\"font-size: 13px; color: var(--text);\">${userName}</div>\n        </div>\n        <div>\n          <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">開始時刻</label>\n          <div style=\"font-size: 13px; color: var(--text);\">${formatTime(record.作業開始時刻)}</div>\n        </div>\n        <div>\n          <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">終了時刻</label>\n          <div style=\"font-size: 13px; color: var(--text);\">${formatTime(record.作業終了時刻)}</div>\n        </div>\n        <div>\n          <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">実働時間</label>\n          <div style=\"font-size: 13px; color: var(--text);\">${formatWorkTime(record.作業時間)}</div>\n        </div>\n        <div>\n          <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">中断時間</label>\n          <div style=\"font-size: 13px; color: var(--text);\">${formatWorkTime(totalBreakTime)}</div>\n        </div>\n        <div>\n          <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">プロジェクト名</label>\n          <div style=\"font-size: 13px; color: var(--text);\">${record.プロジェクト名 || ''}</div>\n        </div>\n        <div>\n          <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">作業場所</label>\n          <div style=\"font-size: 13px; color: var(--text);\">${record.作業場所 || ''}</div>\n        </div>\n      </div>\n      <div style=\"margin-bottom: 16px;\">\n        <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">作業内容</label>\n        <div style=\"font-size: 13px; color: var(--text); padding: 8px; background: rgba(0,0,0,0.25); border-radius: 4px; white-space: pre-wrap;\">${record.作業内容 || ''}</div>\n      </div>\n      ${record.備考 ? `\n      <div style=\"margin-bottom: 16px;\">\n        <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">備考</label>\n        <div style=\"font-size: 13px; color: var(--text); padding: 8px; background: rgba(0,0,0,0.25); border-radius: 4px; white-space: pre-wrap;\">${record.備考}</div>\n      </div>\n      ` : ''}\n      ${warnings.length > 0 ? `\n      <div style=\"margin-bottom: 16px;\">\n        <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">警告</label>\n        <div style=\"color: #ff6b6b; font-size: 13px;\">${warnings.join(', ')}</div>\n      </div>\n      ` : ''}\n    `;\n    \n    detailModal.classList.remove('hidden');\n  }\n\n  // CSVエクスポート関数\n  function exportCSV() {\n    window.aivicApi.list(1).then(rows => {\n      if (!rows || rows.length === 0) {\n        alert('エクスポートするデータがありません');\n        return;\n      }\n      \n      const headers = ['作業日', '作業者', '開始時刻', '終了時刻', '実働時間', '中断時間', '作業内容', '作業場所', '承認状態'];\n      const csvData = [headers.join(',')];\n      \n      rows.forEach(record => {\n        const userName = userMap.get(record.作業員ID) || '不明';\n        const breaks = breakMap.get(record.作業記録ID) || [];\n        const totalBreakTime = breaks.reduce((sum, b) => sum + (b.中断時間 || 0), 0);\n        \n        const row = [\n          formatDate(record.作業日),\n          userName,\n          formatTime(record.作業開始時刻),\n          formatTime(record.作業終了時刻),\n          formatWorkTime(record.作業時間),\n          formatWorkTime(totalBreakTime),\n          `\"${(record.作業内容 || '').replace(/\"/g, '\"\"')}\"`,\n          record.作業場所 || '',\n          record.承認状態 || ''\n        ];\n        csvData.push(row.join(','));\n      });\n      \n      const csv = '\\uFEFF' + csvData.join('\\n');\n      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });\n      const link = document.createElement('a');\n      link.href = URL.createObjectURL(blob);\n      link.download = `工数記録_${new Date().toISOString().split('T')[0]}.csv`;\n      link.click();\n    });\n  }\n\n  // 初期データ表示\n  renderRows(tables[1]?.records || []);\n\n  // 検索ボタンイベント\n  container.querySelector(\"#btn-search\").addEventListener(\"click\", async () => {\n    const dateValue = container.querySelector(\"#input-date\").value;\n    const startDate = container.querySelector(\"#input-start-date\").value;\n    const endDate = container.querySelector(\"#input-end-date\").value;\n    \n    // 期間チェック\n    if (startDate && endDate && new Date(startDate) > new Date(endDate)) {\n      alert('開始日は終了日より前の日付を指定してください');\n      return;\n    }\n    \n    const rows = await window.aivicApi.list(1);\n    if (!rows) return;\n    \n    let filteredRows = rows;\n    \n    // 単一日付フィルター\n    if (dateValue) {\n      filteredRows = filteredRows.filter(record => {\n        const recordDate = new Date(record.作業日).toISOString().split('T')[0];\n        return recordDate === dateValue;\n      });\n    }\n    \n    // 期間フィルター\n    if (startDate || endDate) {\n      filteredRows = filteredRows.filter(record => {\n        const recordDate = new Date(record.作業日);\n        if (startDate && recordDate < new Date(startDate)) return false;\n        if (endDate && recordDate > new Date(endDate)) return false;\n        return true;\n      });\n    }\n    \n    renderRows(filteredRows);\n  });\n\n  // CSVエクスポートボタンイベント\n  container.querySelector(\"#btn-export\").addEventListener(\"click\", exportCSV);\n\n  // 詳細モーダル閉じるボタン\n  container.querySelector(\"#btn-close-detail\").addEventListener(\"click\", () => {\n    detailModal.classList.add('hidden');\n  });\n\n  // モーダル背景クリックで閉じる\n  detailModal.addEventListener(\"click\", (e) => {\n    if (e.target === detailModal) {\n      detailModal.classList.add('hidden');\n    }\n  });\n\n  // 行レベル操作のイベントデリゲーション\n  container.addEventListener(\"click\", async (e) => {\n    // 削除ボタン\n    const deleteBtn = e.target.closest(\".delete-btn\");\n    if (deleteBtn) {\n      if (!confirm(\"この工数記録を削除しますか？\")) return;\n      \n      const success = await window.aivicApi.delete(1, deleteBtn.dataset.id);\n      if (success) {\n        const rows = await window.aivicApi.list(1);\n        renderRows(rows || []);\n      }\n      return;\n    }\n    \n    // 編集ボタン\n    const editBtn = e.target.closest(\".edit-btn\");\n    if (editBtn) {\n      window.showScreen(\"scr-1778907343735\");\n      return;\n    }\n    \n    // 詳細ボタン\n    const detailBtn = e.target.closest(\".detail-btn\");\n    if (detailBtn) {\n      showDetail(detailBtn.dataset.id);\n      return;\n    }\n  });\n}";
</script>

      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
