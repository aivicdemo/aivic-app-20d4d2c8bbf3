window.AIVIC_TABLES = [{"tableName":"ユーザー","purpose":"現場作業員のアカウント情報と認証情報を管理する","columns":[{"name":"ユーザーID","type":"uuid","required":true,"description":"ユーザーの一意識別子（主キー）"},{"name":"ユーザー名","type":"varchar(100)","required":true,"description":"ログイン用のユーザー名"},{"name":"パスワードハッシュ","type":"varchar(100)","required":true,"description":"ハッシュ化されたパスワード"},{"name":"氏名","type":"varchar(100)","required":true,"description":"作業員の実名"},{"name":"所属部署","type":"varchar(100)","required":false,"description":"作業員が所属する部署名"},{"name":"職種","type":"varchar(100)","required":false,"description":"作業員の職種・役職"},{"name":"権限レベル","type":"varchar(100)","required":true,"description":"システム内での権限（一般作業員、管理者等）"},{"name":"有効フラグ","type":"boolean","required":true,"description":"アカウントの有効/無効状態"},{"name":"最終ログイン日時","type":"timestamp","required":false,"description":"最後にログインした日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者","type":"varchar(100)","required":true,"description":"レコード作成者"}]},{"tableName":"作業記録","purpose":"現場作業員の日々の作業時間と内容を記録し、工数管理と実績分析を行うためのトランザクションテーブル","columns":[{"name":"作業記録ID","type":"uuid","required":true,"description":"作業記録の一意識別子（主キー）"},{"name":"作業員ID","type":"uuid","required":true,"description":"作業を行った作業員のID（ユーザーテーブル外部キー）"},{"name":"作業日","type":"timestamp","required":true,"description":"作業を実施した日付"},{"name":"作業開始時刻","type":"timestamp","required":true,"description":"作業開始の日時"},{"name":"作業終了時刻","type":"timestamp","required":false,"description":"作業終了の日時（作業中の場合はnull）"},{"name":"作業時間","type":"integer","required":false,"description":"実際の作業時間（分単位、終了時に自動計算）"},{"name":"プロジェクト名","type":"varchar(100)","required":true,"description":"作業対象のプロジェクト名"},{"name":"作業場所","type":"varchar(100)","required":true,"description":"作業を実施した現場・場所"},{"name":"作業種別","type":"varchar(100)","required":true,"description":"作業の種類（設置、点検、修理等）"},{"name":"作業内容","type":"text","required":true,"description":"具体的な作業内容の詳細"},{"name" ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type":"text","required":false,"description":"管理者による対応内容や備考"},{"name":"検出日時","type":"timestamp","required":true,"description":"異常値が検出された日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  // 業務ロジックモジュールのインポート（グローバル関数として利用）\n  const { \n    calculateWorkDuration, \n    detectWorkTimeAnomaly,\n    calculateProductivityStats \n  } = window.workRecordCalc || {};\n  \n  const { \n    validateTimeConsistency, \n    isLongWorkAnomaly,\n    validateWorkRecordCompleteness \n  } = window.workValidation || {};\n  \n  const { \n    detectOvertimeAnomaly,\n    detectNegativeValue,\n    calculateAnomalyScore,\n    filterAnomalousRecords \n  } = window.anomalyDetection || {};\n  \n  const { \n    aggregateMonthlyHours,\n    calculateProductivityIndex \n  } = window.dataAggregation || {};\n\n  // DOM要素の取得\n  const tbody = container.querySelector(\"#record-tbody\");\n  const emptyMessage = container.querySelector(\"#empty-message\");\n  const detailModal = container.querySelector(\"#detail-modal\");\n  const detailContent = container.querySelector(\"#detail-content\");\n  const exportBtn = container.querySelector(\"#btn-export\");\n  const filterDate = container.querySelector(\"#filter-date\");\n  const filterStatus = container.querySelector(\"#filter-status\");\n  const filterWorker = container.querySelector(\"#filter-worker\");\n  const searchInput = container.querySelector(\"#search-input\");\n  const refreshBtn = container.querySelector(\"#btn-refresh\");\n  \n  // ユーザー情報をマップ化\n  const userMap = {};\n  if (tables && tables[0]) {\n    tables[0].records.forEach(user => {\n      userMap[user.ユーザーID] = user.氏名;\n    });\n  }\n\n  // 工数記録データ\n  let workRecords = [];\n  let filteredRecords = [];\n\n  // 異常値検出関数（業務ロジック使用）\n  function detectAnomalies(record) {\n    const warnings = [];\n    \n    try {\n      // 業務ロジックを使用した異常検出\n      if (detectOvertimeAnomaly && detectOvertimeAnomaly(record.作業時間)) {\n        warnings.push(\"異常な長時間作業\");\n      }\n      \n      if (detectNegativeValue && detectNegativeValue(record.作業時間)) {\n        warnings.push(\"負の作業時間\");\n      }\n      \n      if (validateTimeConsistency && !validateTimeConsistency(record.作業開始時刻, record.作業終了時刻)) {\n        warnings.push(\"時刻の整合性エラー\");\n      }\n      \n      if (isLongWorkAnomaly && isLongWorkAnomaly(record.作業時間)) {\n        warnings.push(\"24時間を超える作業時間\");\n      }\n    } catch (error) {\n      console.warn(\"異常検出処理でエラー:\", error);\n    }\n    \n    return warnings;\n  }\n\n  // 時間フォーマット関数\n  function formatTime(timestamp) {\n    if (!timestamp) return \"-\";\n    const date = new Date(timestamp);\n    return date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });\n  }\n\n  // 作業時間フォーマット関数\n  function formatWorkTime(minutes) {\n    if (!minutes) return \"-\";\n    const hours = Math.floor(minutes / 60);\n    const mins = minutes % 60;\n    return `${hours}時間${mins}分`;\n  }\n\n  // 日付フォーマット関数\n  function formatDate(timestamp) {\n    if (!timestamp) return \"-\";\n    const date = new Date(timestamp);\n    return date.toLocaleDateString('ja-JP');\n  }\n\n  // 承認状態のスタイル\n  function getStatusStyle(status) {\n    switch (status) {\n      case \"承認済み\":\n        return \"background: rgba(34, 197, 94, 0.1); color: #22c55e; padding: 2px 6px; border-radius: 4px; font-size: 11px;\";\n      case \"未承認\":\n        return \"background: rgba(251, 191, 36, 0.1); color: #fbbf24; padding: 2px 6px; border-radius: 4px; font-size: 11px;\";\n      case \"差し戻し\":\n        return \"background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 2px 6px; border-radius: 4px; font-size: 11px;\";\n      default:\n        return \"background: rgba(156, 163, 175, 0.1); color: #9ca3af; padding: 2px 6px; border-radius: 4px; font-size: 11px;\";\n    }\n  }\n\n  // データ読み込み\n  async function loadWorkRecords() {\n    try {\n      const response = await window.aivicApi.list(\"工数記録\");\n      workRecords = response.records || [];\n      applyFilters();\n    } catch (error) {\n      console.error(\"工数記録の読み込みエラー:\", error);\n      window.aivicNotify.error(\"工数記録の読み込みに失敗しました\");\n    }\n  }\n\n  // フィルター適用\n  function applyFilters() {\n    let filtered = [...workRecords];\n    \n    // 日付フィルター\n    if (filterDate && filterDate.value) {\n      const targetDate = new Date(filterDate.value).toDateString();\n      filtered = filtered.filter(record => {\n        const recordDate = new Date(record.作業日).toDateString();\n        return recordDate === targetDate;\n      });\n    }\n    \n    // 承認状態フィルター\n    if (filterStatus && filterStatus.value) {\n      filtered = filtered.filter(record => record.承認状態 === filterStatus.value);\n    }\n    \n    // 作業員フィルター\n    if (filterWorker && filterWorker.value) {\n      filtered = filtered.filter(record => record.作業員ID === filterWorker.value);\n    }\n    \n    // 検索フィルター\n    if (searchInput && searchInput.value) {\n      const searchTerm = searchInput.value.toLowerCase();\n      filtered = filtered.filter(record => {\n        const userName = userMap[record.作業員ID] || \"\";\n        return userName.toLowerCase().includes(searchTerm) ||\n               (record.作業内容 || \"\").toLowerCase().includes(searchTerm) ||\n               (record.プロジェクト名 || \"\").toLowerCase().includes(searchTerm);\n      });\n    }\n    \n    // 業務ロジックを使用した異常レコードフィルタリング\n    try {\n      if (filterAnomalousRecords) {\n        filtered = filterAnomalousRecords(filtered);\n      }\n    } catch (error) {\n      console.warn(\"異常レコードフィルタリングでエラー:\", error);\n    }\n    \n    filteredRecords = filtered;\n    renderRows(filteredRecords);\n  }\n\n  // テーブル再描画関数\n  function renderRows(rows) {\n    if (!tbody) return;\n    \n    if (!rows || rows.length === 0) {\n      tbody.innerHTML = \"\";\n      if (emptyMessage) {\n        emptyMessage.classList.remove(\"hidden\");\n      }\n      return;\n    }\n\n    if (emptyMessage) {\n      emptyMessage.classList.add(\"hidden\");\n    }\n    \n    tbody.innerHTML = rows.map(record => {\n      const warnings = detectAnomalies(record);\n      const warningIcon = warnings.length > 0 ? \n        `<span title=\"${warnings.join(', ')}\" style=\"color: #ef4444; margin-left: 4px;\">⚠️</span>` : \"\";\n      \n      const userName = userMap[record.作業員ID] || \"不明\";\n      const canEdit = record.承認状態 !== \"承認済み\";\n      const canApprove = record.承認状態 === \"未承認\";\n      \n      return `\n        <tr data-id=\"${record.作業記録ID}\" style=\"border-bottom: 1px solid rgba(255,255,255,0.05);\">\n          <td style=\"padding: 6px 10px; color: var(--text);\">${formatDate(record.作業日)}</td>\n          <td style=\"padding: 6px 10px; color: var(--text);\">${userName}${warningIcon}</td>\n          <td style=\"padding: 6px 10px; color: var(--text);\">${record.プロジェクト名 || \"-\"}</td>\n          <td style=\"padding: 6px 10px; color: var(--text);\">${formatTime(record.作業開始時刻)} - ${formatTime(record.作業終了時刻)}</td>\n          <td style=\"padding: 6px 10px; color: var(--text);\">${formatWorkTime(record.作業時間)}</td>\n          <td style=\"padding: 6px 10px;\">\n            <span style=\"${getStatusStyle(record.承認状態)}\">${record.承認状態}</span>\n          </td>\n          <td style=\"padding: 6px 10px;\">\n            <div style=\"display: flex; gap: 4px;\">\n              <button class=\"detail-btn\" data-id=\"${record.作業記録ID}\" style=\"background: transparent; color: var(--accent); border: none; padding: 2px 6px; border-radius: 3px; font-size: 11px; cursor: pointer;\">詳細</button>\n              ${canEdit ? `<button class=\"edit-btn\" data-id=\"${record.作業記録ID}\" style=\"background: transparent; color: var(--accent); border: none; padding: 2px 6px; border-radius: 3px; font-size: 11px; cursor: pointer;\">編集</button>` : \"\"}\n              ${canApprove ? `<button class=\"approve-btn\" data-id=\"${record.作業記録ID}\" style=\"background: rgba(34, 197, 94, 0.1); color: #22c55e; border: none; padding: 2px 6px; border-radius: 3px; font-size: 11px; cursor: pointer;\">承認</button>` : \"\"}\n            </div>\n          </td>\n        </tr>\n      `;\n    }).join(\"\");\n    \n    // 行のイベントリスナー設定\n    setupRowEventListeners();\n  }\n\n  // 行のイベントリスナー設定\n  function setupRowEventListeners() {\n    // 詳細ボタン\n    container.querySelectorAll(\".detail-btn\").forEach(btn => {\n      btn.addEventListener(\"click\", (e) => {\n        const recordId = e.target.dataset.id;\n        showRecordDetail(recordId);\n      });\n    });\n    \n    // 編集ボタン\n    container.querySelectorAll(\".edit-btn\").forEach(btn => {\n      btn.addEventListener(\"click\", (e) => {\n        const recordId = e.target.dataset.id;\n        editRecord(recordId);\n      });\n    });\n    \n    // 承認ボタン\n    container.querySelectorAll(\".approve-btn\").forEach(btn => {\n      btn.addEventListener(\"click\", (e) => {\n        const recordId = e.target.dataset.id;\n        approveRecord(recordId);\n      });\n    });\n  }\n\n  // 詳細表示\n  function showRecordDetail(recordId) {\n    const record = workRecords.find(r => r.作業記録ID === recordId);\n    if (!record || !detailModal || !detailContent) return;\n    \n    const warnings = detectAnomalies(record);\n    const userName = userMap[record.作業員ID] || \"不明\";\n    \n    // 業務ロジックを使用した生産性統計計算\n    let productivityStats = {};\n    try {\n      if (calculateProductivityStats) {\n        productivityStats = calculateProductivityStats([record]);\n      }\n    } catch (error) {\n      console.warn(\"生産性統計計算でエラー:\", error);\n    }\n    \n    detailContent.innerHTML = `\n      <div style=\"padding: 16px;\">\n        <h3 style=\"margin: 0 0 16px 0; color: var(--text);\">工数記録詳細</h3>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;\">\n          <div><strong>作業日:</strong> ${formatDate(record.作業日)}</div>\n          <div><strong>作業員:</strong> ${userName}</div>\n          <div><strong>プロジェクト:</strong> ${record.プロジェクト名 || \"-\"}</div>\n          <div><strong>作業時間:</strong> ${formatWorkTime(record.作業時間)}</div>\n          <div><strong>開始時刻:</strong> ${formatTime(record.作業開始時刻)}</div>\n          <div><strong>終了時刻:</strong> ${formatTime(record.作業終了時刻)}</div>\n          <div><strong>承認状態:</strong> <span style=\"${getStatusStyle(record.承認状態)}\">${record.承認状態}</span></div>\n          <div><strong>進捗率:</strong> ${record.進捗率 || 0}%</div>\n        </div>\n        <div style=\"margin-bottom: 16px;\">\n          <strong>作業内容:</strong>\n          <div style=\"background: rgba(255,255,255,0.05); padding: 8px; border-radius: 4px; margin-top: 4px;\">\n            ${record.作業内容 || \"記載なし\"}\n          </div>\n        </div>\n        ${warnings.length > 0 ? `\n          <div style=\"background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); padding: 8px; border-radius: 4px; margin-bottom: 16px;\">\n            <strong style=\"color: #ef4444;\">⚠️ 警告:</strong>\n            <ul style=\"margin: 4px 0 0 16px; color: #ef4444;\">\n              ${warnings.map(w => `<li>${w}</li>`).join(\"\")}\n            </ul>\n          </div>\n        ` : \"\"}\n        ${productivityStats.efficiency ? `\n          <div style=\"background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); padding: 8px; border-radius: 4px;\">\n            <strong style=\"color: #22c55e;\">📊 生産性統計:</strong>\n            <div style=\"margin-top: 4px; color: #22c55e;\">効率性: ${Math.round(productivityStats.efficiency * 100)}%</div>\n          </div>\n        ` : \"\"}\n        <div style=\"display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;\">\n          <button id=\"close-detail\" style=\"background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); padding: 6px 14px; border-radius: 6px; cursor: pointer;\">閉じる</button>\n        </div>\n      </div>\n    `;\n    \n    detailModal.classList.remove(\"hidden\");\n    \n    // 閉じるボタンのイベントリスナー\n    const closeBtn = detailContent.querySelector(\"#close-detail\");\n    if (closeBtn) {\n      closeBtn.addEventListener(\"click\", () => {\n        detailModal.classList.add(\"hidden\");\n      });\n    }\n  }\n\n  // 編集処理\n  function editRecord(recordId) {\n    // 編集画面への  + csvData], { type: \"text/csv;charset=utf-8;\" });\n      const link = document.createElement(\"a\");\n      link.href = URL.createObjectURL(blob);\n      link.download = `工数記録_${new Date().toISOString().split('T')[0]}.csv`;\n      link.click();\n      \n      window.aivicNotify.success(\"CSVファイルをエクスポートしました\");\n    } catch (error) {\n      console.error(\"エクスポートエラー:\", error);\n      window.aivicNotify.error(\"エクスポートに失敗しました\");\n    }\n  }\n\n  // イベントリスナー設定\n  if (exportBtn) {\n    exportBtn.addEventListener(\"click\", exportToCSV);\n  }\n  \n  if (refreshBtn) {\n    refreshBtn.addEventListener(\"click\", loadWorkRecords);\n  }\n  \n  if (filterDate) {\n    filterDate.addEventListener(\"change\", applyFilters);\n  }\n  \n  if (filterStatus) {\n    filterStatus.addEventListener(\"change\", applyFilters);\n  }\n  \n  if (filterWorker) {\n    filterWorker.addEventListener(\"change\", applyFilters);\n  }\n  \n  if (searchInput) {\n    searchInput.addEventListener(\"input\", applyFilters);\n  }\n  \n  // モーダル外クリックで閉じる\n  if (detailModal) {\n    detailModal.addEventListener(\"click\", (e) => {\n      if (e.target === detailModal) {\n        detailModal.classList.add(\"hidden\");\n      }\n    });\n  }\n\n  // 初期データ読み込み\n  loadWorkRecords();\n}";

  <!-- 工数記録一覧 -->
  <div class="card" style="background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 14px;">
    <h2 style="font-size: 14px; font-weight: 600; margin: 0 0 12px 0; color: var(--text);">作業記録一覧</h2>
    
    <div class="table-wrap" style="overflow-x: auto;">
      <table data-testid="record-list" style="width: 100%; border-collapse: collapse; font-size: 13px;">

      工数記録がありません

  <!-- 詳細表示モーダル -->
  <div id="detail-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center;">

      </div>

    <div class="quick-actions">
      <button class="quick-action-btn" onclick="showScreen('scr-1778907187615')" title="記録開始">▶</button>
      <button class="quick-action-btn" onclick="showScreen('scr-1778907330826')" title="緊急報告">⚠</button>
    </div>
  </div>

  <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
