window.AIVIC_TABLES = [{"tableName":"ユーザー","purpose":"現場作業員のアカウント情報と認証情報を管理する","columns":[{"name":"ユーザーID","type":"uuid","required":true,"description":"ユーザーの一意識別子（主キー）"},{"name":"ユーザー名","type":"varchar(100)","required":true,"description":"ログイン用のユーザー名"},{"name":"パスワードハッシュ","type":"varchar(100)","required":true,"description":"ハッシュ化されたパスワード"},{"name":"氏名","type":"varchar(100)","required":true,"description":"作業員の実名"},{"name":"所属部署","type":"varchar(100)","required":false,"description":"作業員が所属する部署名"},{"name":"職種","type":"varchar(100)","required":false,"description":"作業員の職種・役職"},{"name":"権限レベル","type":"varchar(100)","required":true,"description":"システム内での権限（一般作業員、管理者等）"},{"name":"有効フラグ","type":"boolean","required":true,"description":"アカウントの有効/無効状態"},{"name":"最終ログイン日時","type":"timestamp","required":false,"description":"最後にログインした日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者","type":"varchar(100)","required":true,"description":"レコード作成者"}]},{"tableName":"作業記録","purpose":"現場作業員の日々の作業時間と内容を記録し、工数管理と実績分析を行うためのトランザクションテーブル","columns":[{"name":"作業記録ID","type":"uuid","required":true,"description":"作業記録の一意識別子（主キー）"},{"name":"作業員ID","type":"uuid","required":true,"description":"作業を行った作業員のID（ユーザーテーブル外部キー）"},{"name":"作業日","type":"timestamp","required":true,"description":"作業を実施した日付"},{"name":"作業開始時刻","type":"timestamp","required":true,"description":"作業開始の日時"},{"name":"作業終了時刻","type":"timestamp","required":false,"description":"作業終了の日時（作業中の場合はnull）"},{"name":"作業時間","type":"integer","required":false,"description":"実際の作業時間（分単位、終了時に自動計算）"},{"name":"プロジェクト名","type":"varchar(100)","required":true,"description":"作業対象のプロジェクト名"},{"name":"作業場所","type":"varchar(100)","required":true,"description":"作業を実施した現場・場所"},{"name":"作業種別","type":"varchar(100)","required":true,"description":"作業の種類（設置、点検、修理等）"},{"name":"作業内容","type":"text","required":true,"description":"具体的な作業内容の詳細"},{"name":"進捗状況","type":"varchar(100)","required":true,"description":"作業の進捗状態（作業中、完了、中断等）"},{"name":"備考","type":"text","required":false,"description":"特記事項や注意点等の補足情報"},{"name":"承認状態","type":"varchar(100)","required":true,"description":"記録の承認状況（未承認、承認済み、差し戻し）"},{"name":"承認者ID","type":"uuid","required":false,"description":"記録を承認した管理者のID"},{"name":"承認日時","type":"timestamp","required":false,"description":"承認が行われた日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"}]},{"tableName":"中断記録","purpose":"作業中断の発生理由、時間、影響を記録し、作業効率分析と改善に活用する","columns":[{"name":"中断記録ID","type":"uuid","required":true,"description":"中断記録の一意識別子（主キー）"},{"name":"作業記録ID","type":"uuid","required":true,"description":"中断が発生した作業記録への外部キー"},{"name":"中断開始日時","type":"timestamp","required":true,"description":"作業を中断した日時"},{"name":"中断終了日時","type":"timestamp","required":false,"description":"作業を再開した日時"},{"name":"中断理由区分","type":"varchar(100)","required":true,"description":"中断理由の分類（機械故障、材料不足、天候、休憩等）"},{"name":"中断理由詳細","type":"text","required":false,"description":"中断理由の具体的な内容"},{"name":"中断時間","type":"integer","required":false,"description":"中断時間（分）"},{"name":"影響度","type":"varchar(100)","required":false,"description":"作業への影響度（軽微、中程度、重大）"},{"name":"対応状況","type":"varchar(100)","required":true,"description":"中断への対応状況（対応中、解決済み、未対応）"},{"name":"記録者ID","type":"uuid","required":true,"description":"中断を記録した作業員のユーザーID"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]},{"tableName":"作業項目マスタ","purpose":"現場作業員が工数記録時に選択する作業項目の定義と管理を行う","columns":[{"name":"作業項目ID","type":"uuid","required":true,"description":"作業項目の一意識別子（主キー）"},{"name":"作業項目コード","type":"varchar(100)","required":true,"description":"作業項目の業務コード（検索・表示用）"},{"name":"作業項目名","type":"varchar(100)","required":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type":"text","required":false,"description":"管理者による対応内容や備考"},{"name":"検出日時","type":"timestamp","required":true,"description":"異常値が検出された日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  const tbody = container.querySelector('#records-tbody');\n  const recordCount = container.querySelector('#record-count');\n  const detailModal = container.querySelector('#detail-modal');\n  let currentRecordId = null;\n  let allRecords = [];\n  let users = [];\n  let breakRecords = [];\n  let anomalyLogs = [];\n\n  // ユーザー情報とその他データを取得\n  async function loadRelatedData() {\n    try {\n      users = await window.aivicApi.list(0) || []; // ユーザー\n      breakRecords = await window.aivicApi.list(2) || []; // 中断記録\n      anomalyLogs = await window.aivicApi.list(4) || []; // 異常値検出ログ\n    } catch (error) {\n      console.error('関連データの取得に失敗:', error);\n    }\n  }\n\n  // 時刻フォーマット関数\n  function formatTime(timestamp) {\n    if (!timestamp) return '';\n    const date = new Date(timestamp);\n    return date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });\n  }\n\n  // 日付フォーマット関数\n  function formatDate(timestamp) {\n    if (!timestamp) return '';\n    const date = new Date(timestamp);\n    return date.toLocaleDateString('ja-JP');\n  }\n\n  // 作業時間計算関数\n  function calculateWorkTime(startTime, endTime, breakTime = 0) {\n    if (!startTime || !endTime) return 0;\n    const start = new Date(startTime);\n    const end = new Date(endTime);\n    const diffMinutes = Math.floor((end - start) / (1000 * 60)) - breakTime;\n    return Math.max(0, diffMinutes);\n  }\n\n  // 時間表示フォーマット関数\n  function formatDuration(minutes) {\n    if (!minutes || minutes === 0) return '0分';\n    const hours = Math.floor(minutes / 60);\n    const mins = minutes % 60;\n    if (hours === 0) return `${mins}分`;\n    if (mins === 0) return `${hours}時間`;\n    return `${hours}時間${mins}分`;\n  }\n\n  // 異常値チェック関数\n  function hasAnomaly(recordId) {\n    return anomalyLogs.some(log => \n      log.検出対象レコードID === recordId && \n      log.確認状況 === '未確認'\n    );\n  }\n\n  // 中断時間計算関数\n  function calculateBreakTime(recordId) {\n    const breaks = breakRecords.filter(br => br.作業記録ID === recordId);\n    return breaks.reduce((total, br) => total + (br.中断時間 || 0), 0);\n  }\n\n  // ユーザー名取得関数\n  function getUserName(userId) {\n    const user = users.find(u => u.ユーザーID === userId);\n    return user ? user.氏名 : '不明';\n  }\n\n  // テーブル再描画関数\n  function renderRows(rows) {\n    allRecords = rows;\n    recordCount.textContent = `${rows.length}件`;\n    \n    if (rows.length === 0) {\n      tbody.innerHTML = '<tr><td colspan=\"10\" style=\"text-align: center; color: var(--text-muted); padding: 20px;\">記録なし</td></tr>';\n      return;\n    }\n\n    tbody.innerHTML = rows.map(record => {\n      const breakTime = calculateBreakTime(record.作業記録ID);\n      const workTime = calculateWorkTime(record.作業開始時刻, record.作業終了時刻, breakTime);\n      const hasAnomalyFlag = hasAnomaly(record.作業記録ID);\n      const userName = getUserName(record.作業員ID);\n      \n      // 承認状態に応じたボタンの表示制御\n      const isApproved = record.承認状態 === '承認済み';\n      const canEdit = !isApproved;\n      const canApprove = record.承認状態 === '未承認';\n\n      return `\n        <tr data-id=\"${record.作業記録ID}\">\n          <td>${formatDate(record.作業日)}</td>\n          <td>${userName}</td>\n          <td>${formatTime(record.作業開始時刻)}</td>\n          <td>${formatTime(record.作業終了時刻)}</td>\n          <td>${formatDuration(workTime)} ${hasAnomalyFlag ? '<span style=\"color: #ff6a00; font-weight: bold;\" title=\"異常値検出\">⚠</span>' : ''}</td>\n          <td>${formatDuration(breakTime)}</td>\n          <td style=\"max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">${record.作業内容 || ''}</td>\n          <td>${record.作業場所 || ''}</td>\n          <td>\n            <span style=\"padding: 2px 6px; border-radius: 4px; font-size: 11px; \n              ${record.承認状態 === '承認済み' ? 'background: rgba(34, 197, 94, 0.2); color: #22c562;' : \n                record.承認状態 === '差し戻し' ? 'background: rgba(239, 68, 68, 0.2); color: #ef4444;' : \n                'background: rgba(251, 191, 36, 0.2); color: #fbbf24;'}\">\n              ${record.承認状態}\n            </span>\n          </td>\n          <td>\n            <button class=\"action-btn secondary detail-btn\" data-id=\"${record.作業記録ID}\" style=\"padding: 4px 8px; font-size: 12px; margin-right: 4px;\">詳細</button>\n            ${canEdit ? `<button class=\"action-btn secondary edit-btn\" data-id=\"${record.作業記録ID}\" style=\"padding: 4px 8px; font-size: 12px; margin-right: 4px;\">修正</button>` : ''}\n            ${canApprove ? `<button class=\"action-btn approve-btn\" data-id=\"${record.作業記録ID}\" style=\"padding: 4px 8px; font-size: 12px; margin-right: 4px;\">承認</button>` : ''}\n            <button class=\"action-btn secondary delete-btn\" data-id=\"${record.作業記録ID}\" style=\"padding: 4px 8px; font-size: 12px; background: rgba(239, 68, 68, 0.1); color: #ef4444; border-color: rgba(239, 68, 68, 0.3);\">削除</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // 詳細表示関数\n  function showDetail(recordId) {\n    const record = allRecords.find(r => r.作業記録ID === recordId);\n    if (!record) return;\n\n    currentRecordId = recordId;\n    const breakTime = calculateBreakTime(recordId);\n    const workTime = calculateWorkTime(record.作業開始時刻, record.作業終了時刻, breakTime);\n    const userName = getUserName(record.作業員ID);\n\n    container.querySelector('#detail-work-date').textContent = formatDate(record.作業日);\n    container.querySelector('#detail-worker-name').textContent = userName;\n    container.querySelector('#detail-start-time').textContent = formatTime(record.作業開始時刻);\n    container.querySelector('#detail-end-time').textContent = formatTime(record.作業終了時刻);\n    container.querySelector('#detail-work-time').textContent = formatDuration(workTime);\n    container.querySelector('#detail-approval-status').textContent = record.承認状態;\n    container.querySelector('#detail-work-content').textContent = record.作業内容 || '';\n    container.querySelector('#detail-remarks').textContent = record.備考 || '';\n\n    // ボタンの表示制御\n    const isApproved = record.承認状態 === '承認済み';\n    const editBtn = container.querySelector('#btn-modal-edit');\n    const approveBtn = container.querySelector('#btn-modal-approve');\n    \n    if (isApproved) {\n      editBtn.style.display = 'none';\n      approveBtn.style.display = 'none';\n    } else {\n      editBtn.style.display = 'inline-block';\n      approveBtn.style.display = record.承認状態 === '未承認' ? 'inline-block' : 'none';\n    }\n\n    detailModal.classList.remove('hidden');\n  }\n\n  // CSVエクスポート関数\n  function exportCSV() {\n    if (allRecords.length === 0) {\n      alert('エクスポートするデータがありません');\n      return;\n    }\n\n    const headers = ['作業日', '作業者', '開始時刻', '終了時刻', '実働時間(分)', '中断時間(分)', '作業内容', '作業場所', '承認状態', '備考'];\n    const csvData = allRecords.map(record => {\n      const breakTime = calculateBreakTime(record.作業記録ID);\n      const workTime = calculateWorkTime(record.作業開始時刻, record.作業終了時刻, breakTime);\n      const userName = getUserName(record.作業員ID);\n      \n      return [\n        formatDate(record.作業日),\n        userName,\n        formatTime(record.作業開始時刻),\n        formatTime(record.作業終了時刻),\n        workTime,\n        breakTime,\n        `\"${(record.作業内容 || '').replace(/\"/g, '\"\"')}\"`,\n        `\"${(record.作業場所 || '').replace(/\"/g, '\"\"')}\"`,\n        record.承認状態,\n        `\"${(record.備考 || '').replace(/\"/g, '\"\"')}\"`\n      ];\n    });\n\n    const csvContent = '\\uFEFF' + [headers, ...csvData].map(row => row.join(',')).join('\\n');\n    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `工数記録_${new Date().toISOString().split('T')[0]}.csv`;\n    link.click();\n  }\n\n  // 初期化処理\n  async function initialize() {\n    await loadRelatedData();\n    const initialRecords = await window.aivicApi.list(1) || tables[1]?.records || [];\n    renderRows(initialRecords);\n  }\n\n  // 検索ボタンのイベントリスナー\n  container.querySelector('#btn-search').addEventListener('click', async () => {\n    const workDate = container.querySelector('#input-work-date').value;\n    const dateFrom = container.querySelector('#input-date-from').value;\n    const dateTo = container.querySelector('#input-date-to').value;\n\n    // 日付範囲の妥当性チェック\n    if (dateFrom && dateTo && new Date(dateFrom) > new Date(dateTo)) {\n      alert('開始日は終了日より前の日付を指定してください');\n      return;\n    }\n\n    try {\n      const allRows = await window.aivicApi.list(1) || [];\n      let filteredRows = allRows;\n\n      if (workDate) {\n        filteredRows = filteredRows.filter(record => {\n          const recordDate = new Date(record.作業日).toISOString().split('T')[0];\n          return recordDate === workDate;\n        });\n      }\n\n      if (dateFrom) {\n        filteredRows = filteredRows.filter(record => {\n          const recordDate = new Date(record.作業日).toISOString().split('T')[0];\n          return recordDate >= dateFrom;\n        });\n      }\n\n      if (dateTo) {\n        filteredRows = filteredRows.filter(record => {\n          const recordDate = new Date(record.作業日).toISOString().split('T')[0];\n          return recordDate <= dateTo;\n        });\n      }\n\n      renderRows(filteredRows);\n    } catch (error) {\n      console.error('検索エラー:', error);\n      alert('検索中にエラーが発生しました');\n    }\n  });\n\n  // CSVエクスポートボタンのイベントリスナー\n  container.querySelector('#btn-csv-export').addEventListener('click', exportCSV);\n\n  // モーダル関連のイベントリスナー\n  container.querySelector('#btn-close-modal').addEventListener('click', () => {\n    detailModal.classList.add('hidden');\n  });\n\n  container.querySelector('#btn-modal-close').addEventListener('click', () => {\n    detailModal.classList.add('hidden');\n  });\n\n  container.querySelector('#btn-modal-edit').addEventListener('click', () => {\n    if (currentRecordId) {\n      window.showScreen(\"scr-1778907343735\");\n    }\n  });\n\n  container.querySelector('#btn-modal-approve').addEventListener('click', async () => {\n    if (!currentRecordId) return;\n    \n    if (!confirm('この記録を承認しますか？')) return;\n\n    try {\n      await window.aivicApi.update(1, currentRecordId, {\n        承認状態: '承認済み',\n        承認者ID: 'current-user-id', // 実際の実装では現在のユーザーIDを使用\n        承認日時: new Date().toISOString()\n      });\n      \n      detailModal.classList.add('hidden');\n      const updatedRecords = await window.aivicApi.list(1);\n      renderRows(updatedRecords);\n      alert('承認が完了しました');\n    } catch (error) {\n      console.error('承認エラー:', error);\n      alert('承認中にエラーが発生しました');\n    }\n  });\n\n  // 行レベル操作のイベントデリゲーション\n  container.addEventListener('click', async (e) => {\n    const detailBtn = e.target.closest('.detail-btn');\n    const editBtn = e.target.closest('.edit-btn');\n    const approveBtn = e.target.closest('.approve-btn');\n    const deleteBtn = e.target.closest('.delete-btn');\n\n    if (detailBtn) {\n      showDetail(detailBtn.dataset.id);\n    }\n\n    if (editBtn) {\n      window.showScreen(\"scr-1778907343735\");\n    }\n\n    if (approveBtn) {\n      if (!confirm('この記録を承認しますか？')) return;\n      \n      try {\n        await window.aivicApi.update(1, approveBtn.dataset.id, {\n          承認状態: '承認済み',\n          承認者ID: 'current-user-id',\n          承認日時: new Date().toISOString()\n        });\n        \n        const updatedRecords = await window.aivicApi.list(1);\n        renderRows(updatedRecords);\n        alert('承認が完了しました');\n      } catch (error) {\n        console.error('承認エラー:', error);\n        alert('承認中にエラーが発生しました');\n      }\n    }\n\n    if (deleteBtn) {\n      if (!confirm('この記録を削除しますか？')) return;\n      \n      try {\n        await window.aivicApi.delete(1, deleteBtn.dataset.id);\n        const updatedRecords = await window.aivicApi.list(1);\n        renderRows(updatedRecords);\n        alert('記録を削除しました');\n      } catch (error) {\n        console.error('削除エラー:', error);\n        alert('削除中にエラーが発生しました');\n      }\n    }\n  });\n\n  // モーダル外クリックで閉じる\n  detailModal.addEventListener('click', (e) => {\n    if (e.target === detailModal) {\n      detailModal.classList.add('hidden');\n    }\n  });\n\n  // 初期化実行\n  initialize();\n}";
</script>

    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
