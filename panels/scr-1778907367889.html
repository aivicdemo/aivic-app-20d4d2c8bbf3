    <style>
        :root {
            --primary: #0ea5e9;
            --primary-hover: #0284c7;
            --primary-light: #e0f2fe;
            --success: #10b981;
            --warning: #f59e0b;

            --text: #1e293b;
            --text-muted: #475569;
            --text-light: #64748b;
            --top-bar-bg: #ffffff;
            --top-bar-border: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: "⏱";
            font-size: 18px;
        }

        .nav-section {
            padding: 16px 0 8px 0;
        }

        .nav-section-title {
            padding: 0 16px 8px 16px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: block;
            padding: 8px 16px;
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: var(--bg-card);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: var(--primary-light);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 500;
        }

        .nav-item.nav-emergency {
            color: var(--danger);
            font-weight: 500;
        }

        .nav-item.nav-emergency:hover {
            background: #fef2f2;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .logout-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.15s ease;
        }

        .logout-link:hover {
            background: var(--border-light);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quick-action-btn {
            padding: 10px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quick-action-btn:hover {
            background: var(--primary-hover);
        }

        .quick-action-btn.secondary {
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .quick-action-btn.secondary:hover {
            background: var(--border-light);
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-height: 400px;
        }

        .nav-group {
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 4px;
            padding-bottom: 4px;
        }

        .nav-group:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
            
            .quick-actions {
                flex-wrap: wrap;
            }
        }

        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
            font-size: 12px;
        }
    </style>

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  const tbody = container.querySelector('#records-tbody');\n  const recordCount = container.querySelector('#record-count');\n  const detailModal = container.querySelector('#detail-modal');\n  const approveModal = container.querySelector('#approve-modal');\n  let currentRecords = [];\n  let currentApproveId = null;\n\n  // 時間フォーマット関数\n  function formatTime(timeStr) {\n    if (!timeStr) return '';\n    const date = new Date(timeStr);\n    return date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });\n  }\n\n  // 日付フォーマット関数\n  function formatDate(dateStr) {\n    if (!dateStr) return '';\n    const date = new Date(dateStr);\n    return date.toLocaleDateString('ja-JP');\n  }\n\n  // 作業時間計算（分単位を時間:分に変換）\n  function formatWorkTime(minutes) {\n    if (!minutes) return '0時間0分';\n    const hours = Math.floor(minutes / 60);\n    const mins = minutes % 60;\n    return `${hours}時間${mins}分`;\n  }\n\n  // 異常値チェック\n  function checkAbnormalValues(record) {\n    const warnings = [];\n    \n    // 24時間を超える作業時間\n    if (record.作業時間 && record.作業時間 > 1440) {\n      warnings.push('24時間を超える作業時間');\n    }\n    \n    // 終了時刻が開始時刻より早い\n    if (record.作業開始時刻 && record.作業終了時刻) {\n      const start = new Date(record.作業開始時刻);\n      const end = new Date(record.作業終了時刻);\n      if (end < start) {\n        warnings.push('終了時刻が開始時刻より早い');\n      }\n    }\n    \n    // 中断時間が実働時間を超える\n    const breakTime = record.中断記録?.reduce((total, br) => total + (br.中断時間 || 0), 0) || 0;\n    if (breakTime > (record.作業時間 || 0)) {\n      warnings.push('中断時間が実働時間を超える');\n    }\n    \n    return warnings;\n  }\n\n  // 承認状態のバッジ\n  function getApprovalBadge(status) {\n    const colors = {\n      '未承認': 'background: rgba(255, 193, 7, 0.2); color: #856404; border: 1px solid rgba(255, 193, 7, 0.3);',\n      '承認済み': 'background: rgba(40, 167, 69, 0.2); color: #155724; border: 1px solid rgba(40, 167, 69, 0.3);',\n      '差し戻し': 'background: rgba(220, 53, 69, 0.2); color: #721c24; border: 1px solid rgba(220, 53, 69, 0.3);'\n    };\n    \n    return `<span style=\"padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 500; ${colors[status] || colors['未承認']}\">${status || '未承認'}</span>`;\n  }\n\n  // テーブル再描画関数\n  function renderRows(rows) {\n    currentRecords = rows;\n    recordCount.textContent = `${rows.length}件`;\n    \n    if (rows.length === 0) {\n      tbody.innerHTML = '<tr><td colspan=\"9\" style=\"padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;\">作業項目がありません</td></tr>';\n      return;\n    }\n\n    tbody.innerHTML = rows.map(record => {\n      const warnings = checkAbnormalValues(record);\n      const warningIcon = warnings.length > 0 ? \n        `<span title=\"${warnings.join(', ')}\" style=\"color: #dc3545; font-weight: bold; margin-left: 4px;\">⚠</span>` : '';\n      \n      const breakTime = record.中断記録?.reduce((total, br) => total + (br.中断時間 || 0), 0) || 0;\n      const isApproved = record.承認状態 === '承認済み';\n      \n      return `\n        <tr data-id=\"${record.作業記録ID}\" style=\"border-bottom: 1px solid rgba(255,255,255,0.02);\">\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${formatDate(record.作業日)}${warningIcon}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${record.作業者名 || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${formatTime(record.作業開始時刻)}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${formatTime(record.作業終了時刻)}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${formatWorkTime(record.作業時間)}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${formatWorkTime(breakTime)}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">${record.作業内容 || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${getApprovalBadge(record.承認状態)}</td>\n          <td style=\"padding: 6px 10px; text-align: center;\">\n            <button class=\"action-btn secondary detail-btn\" data-id=\"${record.作業記録ID}\" style=\"background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-right: 4px;\">詳細</button>\n            <button class=\"action-btn secondary edit-btn\" data-id=\"${record.作業記録ID}\" ${isApproved ? 'disabled' : ''} style=\"background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-right: 4px; ${isApproved ? 'opacity: 0.5; cursor: not-allowed;' : ''}\">修正</button>\n            <button class=\"action-btn secondary delete-btn\" data-id=\"${record.作業記録ID}\" ${isApproved ? 'disabled' : ''} style=\"background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-right: 4px; ${isApproved ? 'opacity: 0.5; cursor: not-allowed;' : ''}\">削除</button>\n            <button class=\"action-btn approve-btn\" data-id=\"${record.作業記録ID}\" ${isApproved ? 'disabled' : ''} style=\"background: var(--primary); color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; cursor: pointer; ${isApproved ? 'opacity: 0.5; cursor: not-allowed;' : ''}\">承認</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // 詳細表示\n  function showDetail(recordId) {\n    const record = currentRecords.find(r => r.作業記録ID === recordId);\n    if (!record) return;\n\n    const breakTime = record.中断記録?.reduce((total, br) => total + (br.中断時間 || 0), 0) || 0;\n    const warnings = checkAbnormalValues(record);\n\n    const detailContent = container.querySelector('#detail-content');\n    detailContent.innerHTML = `\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px;\">\n        <div>\n          <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">作業日</label>\n          <div style=\"font-size: 13px; color: var(--text);\">${formatDate(record.作業日)}</div>\n        </div>\n        <div>\n          <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">作業者</label>\n          <div style=\"font-size: 13px; color: var(--text);\">${record.作業者名 || ''}</div>\n        </div>\n        <div>\n          <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">開始時刻</label>\n          <div style=\"font-size: 13px; color: var(--text);\">${formatTime(record.作業開始時刻)}</div>\n        </div>\n        <div>\n          <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">終了時刻</label>\n          <div style=\"font-size: 13px; color: var(--text);\">${formatTime(record.作業終了時刻)}</div>\n        </div>\n        <div>\n          <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">実働時間</label>\n          <div style=\"font-size: 13px; color: var(--text);\">${formatWorkTime(record.作業時間)}</div>\n        </div>\n        <div>\n          <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">中断時間</label>\n          <div style=\"font-size: 13px; color: var(--text);\">${formatWorkTime(breakTime)}</div>\n        </div>\n        <div>\n          <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">プロジェクト名</label>\n          <div style=\"font-size: 13px; color: var(--text);\">${record.プロジェクト名 || ''}</div>\n        </div>\n        <div>\n          <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">作業場所</label>\n          <div style=\"font-size: 13px; color: var(--text);\">${record.作業場所 || ''}</div>\n        </div>\n        <div>\n          <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">作業種別</label>\n          <div style=\"font-size: 13px; color: var(--text);\">${record.作業種別 || ''}</div>\n        </div>\n        <div>\n          <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">承認状態</label>\n          <div style=\"font-size: 13px;\">${getApprovalBadge(record.承認状態)}</div>\n        </div>\n      </div>\n      <div>\n        <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">作業内容</label>\n        <div style=\"font-size: 13px; color: var(--text); padding: 8px; background: rgba(0,0,0,0.25); border-radius: 4px; min-height: 60px;\">${record.作業内容 || ''}</div>\n      </div>\n      ${record.備考 ? `\n      <div>\n        <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">備考</label>\n        <div style=\"font-size: 13px; color: var(--text); padding: 8px; background: rgba(0,0,0,0.25); border-radius: 4px;\">${record.備考}</div>\n      </div>\n      ` : ''}\n      ${warnings.length > 0 ? `\n      <div style=\"padding: 8px; background: rgba(220, 53, 69, 0.1); border: 1px solid rgba(220, 53, 69, 0.3); border-radius: 4px;\">\n        <div style=\"font-size: 12px; font-weight: 600; color: #dc3545; margin-bottom: 4px;\">⚠ 異常値検出</div>\n        <div style=\"font-size: 11px; color: #721c24;\">${warnings.join('、')}</div>\n      </div>\n      ` : ''}\n    `;\n\n    detailModal.classList.remove('hidden');\n  }\n\n  // CSVエクスポート\n  function exportCSV() {\n    if (currentRecords.length === 0) {\n      alert('エクスポートするデータがありません。');\n      return;\n    }\n\n    const headers = ['作業日', '作業者', '開始時刻', '終了時刻', '実働時間', '中断時間', '作業内容', '作業場所', '承認状態'];\n    const csvContent = '\\uFEFF' + [\n      headers.join(','),\n      ...currentRecords.map(record => {\n        const breakTime = record.中断記録?.reduce((total, br) => total + (br.中断時間 || 0), 0) || 0;\n        return [\n          formatDate(record.作業日),\n          record.作業者名 || '',\n          formatTime(record.作業開始時刻),\n          formatTime(record.作業終了時刻),\n          formatWorkTime(record.作業時間),\n          formatWorkTime(breakTime),\n          `\"${(record.作業内容 || '').replace(/\"/g, '\"\"')}\"`,\n          record.作業場所 || '',\n          record.承認状態 || '未承認'\n        ].join(',');\n      })\n    ].join('\\n');\n\n    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `工数記録_${new Date().toISOString().split('T')[0]}.csv`;\n    link.click();\n  }\n\n  // 初期データ読み込み\n  window.aivicApi.list(1).then(rows => {\n    if (rows) {\n      renderRows(rows);\n    }\n  });\n\n  // 絞り込み検索\n  container.querySelector('#btn-search').addEventListener('click', async () => {\n    const filterDate = container.querySelector('#filter-date').value;\n    const startDate = container.querySelector('#filter-start-date').value;\n    const endDate = container.querySelector('#filter-end-date').value;\n\n    // 日付範囲の妥当性チェック\n    if (startDate && endDate && startDate > endDate) {\n      alert('開始日は終了日より前の日付を指定してください');\n      return;\n    }\n\n    const rows = await window.aivicApi.list(1);\n    if (!rows) return;\n\n    let filteredRows = rows;\n\n    if (filterDate) {\n      filteredRows = filteredRows.filter(record => {\n        const recordDate = new Date(record.作業日).toISOString().split('T')[0];\n        return recordDate === filterDate;\n      });\n    }\n\n    if (startDate && endDate) {\n      filteredRows = filteredRows.filter(record => {\n        const recordDate = new Date(record.作業日).toISOString().split('T')[0];\n        return recordDate >= startDate && recordDate <= endDate;\n      });\n    }\n\n    renderRows(filteredRows);\n  });\n\n  // CSVエクスポート\n  container.querySelector('#btn-export').addEventListener('click', exportCSV);\n\n  // イベントデリゲーション\n  container.addEventListener('click', async (e) => {\n    // 詳細表示\n    const detailBtn = e.target.closest('.detail-btn');\n    if (detailBtn) {\n      showDetail(detailBtn.dataset.id);\n      return;\n    }\n\n    // 編集\n    const editBtn = e.target.closest('.edit-btn');\n    if (editBtn && !editBtn.disabled) {\n      const record = currentRecords.find(r => r.作業記録ID === editBtn.dataset.id);\n      if (record && record.承認状態 === '承認済み') {\n        alert('承認済みの記録は修正できません');\n        return;\n      }\n      window.showScreen('scr-1778907343735');\n      return;\n    }\n\n    // 削除\n    const deleteBtn = e.target.closest('.delete-btn');\n    if (deleteBtn && !deleteBtn.disabled) {\n      const record = currentRecords.find(r => r.作業記録ID === deleteBtn.dataset.id);\n      if (record && record.承認状態 === '承認済み') {\n        alert('承認済みの記録は削除できません');\n        return;\n      }\n      \n      if (!confirm('この記録を削除しますか？')) return;\n      \n      await window.aivicApi.delete(1, deleteBtn.dataset.id);\n      const rows = await window.aivicApi.list(1);\n      if (rows) renderRows(rows);\n      return;\n    }\n\n    // 承認\n    const approveBtn = e.target.closest('.approve-btn');\n    if (approveBtn && !approveBtn.disabled) {\n      currentApproveId = approveBtn.dataset.id;\n      approveModal.classList.remove('hidden');\n      return;\n    }\n\n    // 詳細モーダルを閉じる\n    if (e.target.id === 'close-detail' || e.target === detailModal) {\n      detailModal.classList.add('hidden');\n      return;\n    }\n\n    // 承認確認\n    if (e.target.id === 'confirm-approve') {\n      if (currentApproveId) {\n        await window.aivicApi.update(1, currentApproveId, { 承認状態: '承認済み', 承認日時: new Date().toISOString() });\n        const rows = await window.aivicApi.list(1);\n        if (rows) renderRows(rows);\n      }\n      approveModal.classList.add('hidden');\n      currentApproveId = null;\n      return;\n    }\n\n    // 承認キャンセル\n    if (e.target.id === 'cancel-approve' || e.target === approveModal) {\n      approveModal.classList.add('hidden');\n      currentApproveId = null;\n      return;\n    }\n  });\n\n  // 今日の日付をデフォルトで設定\n  const today = new Date().toISOString().split('T')[0];\n  container.querySelector('#filter-date').value = today;\n}";

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();
