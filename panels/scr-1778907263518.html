ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "javascript\nfunction(container, apiUrl, tables) {\n  // 業務ロジックモジュールをインポート\n  const { calculateWorkDuration, isWorkTimeExceeded, isShortWorkTime, detectWorkTimeAnomalies } = require('../src/logic/time-record-calc');\n  const { validateRequiredFields, validateTimeSequence, validateDuplicateRecord, validateWorkRecordComprehensive } = require('../src/logic/work-validation');\n  const { detectWorkTimeAnomaly, performComprehensiveAnomalyDetection, calculateAnomalyScore } = require('../src/logic/anomaly-detection');\n  const { selectNotificationMethod } = require('../src/logic/system-monitoring');\n\n  // DOM要素を取得\n  const errorLogBtn = container.querySelector('#btn-error-log');\n  const registerBtn = container.querySelector('button:has-text(\"登録\")') || \n                     Array.from(container.querySelectorAll('button')).find(btn => btn.textContent.includes('登録'));\n  const saveBtn = container.querySelector('button:has-text(\"保存\")') || \n                  Array.from(container.querySelectorAll('button')).find(btn => btn.textContent.includes('保存'));\n  const newBtn = container.querySelector('button:has-text(\"新規\")') || \n                 Array.from(container.querySelectorAll('button')).find(btn => btn.textContent.includes('新規'));\n\n  // フォームデータ取得\n  const getFormData = () => {\n    return {\n      workDate: container.querySelector('[name=\"workDate\"]')?.value || '',\n      startTime: container.querySelector('[name=\"startTime\"]')?.value || '',\n      endTime: container.querySelector('[name=\"endTime\"]')?.value || '',\n      breakTime: container.querySelector('[name=\"breakTime\"]')?.value || '',\n      workContent: container.querySelector('[name=\"workContent\"]')?.value || '',\n      workLocation: container.querySelector('[name=\"workLocation\"]')?.value || '',\n      workerName: container.querySelector('[name=\"workerName\"]')?.value || '',\n      startDateTime: container.querySelector('[name=\"startDateTime\"]')?.value || '',\n      endDateTime: container.querySelector('[name=\"endDateTime\"]')?.value || '',\n      endDay: container.querySelector('[name=\"endDay\"]')?.value || '',\n      project: container.querySelector('[name=\"project\"]')?.value || '',\n      workDateTime: container.querySelector('[name=\"workDateTime\"]')?.value || '',\n      workHours: container.querySelector('[name=\"workHours\"]')?.value || ''\n    };\n  };\n\n  // メッセージクリア\n  const clearMessages = () => {\n    const messages = container.querySelectorAll('.error-message, .success-message, .warning-message, .format-error, .alert, .warning-notification');\n    messages.forEach(msg => msg.remove());\n  };\n\n  // エラーメッセージ表示\n  const showError = (message, className = 'error-message') => {\n    clearMessages();\n    const errorDiv = document.createElement('div');\n    errorDiv.className = className;\n    errorDiv.textContent = message;\n    errorDiv.style.display = 'block';\n    container.appendChild(errorDiv);\n  };\n\n  // 成功メッセージ表示\n  const showSuccess = (message) => {\n    clearMessages();\n    const successDiv = document.createElement('div');\n    successDiv.className = 'success-message';\n    successDiv.textContent = message;\n    successDiv.style.display = 'block';\n    container.appendChild(successDiv);\n  };\n\n  // 警告メッセージ表示\n  const showWarning = (message, className = 'warning-message') => {\n    const warningDiv = document.createElement('div');\n    warningDiv.className = className;\n    warningDiv.textContent = message;\n    warningDiv.style.display = 'block';\n    container.appendChild(warningDiv);\n  };\n\n  // アラート表示\n  const showAlert = (message) => {\n    const alertDiv = document.createElement('div');\n    alertDiv.className = 'alert';\n    alertDiv.textContent = message;\n    alertDiv.style.display = 'block';\n    container.appendChild(alertDiv);\n  };\n\n  // 日時フォーマット検証\n  const validateDateTimeFormat = (dateTimeStr) => {\n    if (!dateTimeStr) return true;\n    \n    // 不正な日時パターンをチェック\n    const invalidPatterns = [\n      /\\d{4}\\/1[3-9]\\//, // 13月以上\n      /\\d{4}\\/\\d{1,2}\\/[4-9]\\d/, // 40日以上\n      /2[5-9]:\\d{2}/, // 25時以上\n      /\\d{1,2}:[6-9]\\d/, // 60分以上\n      /[a-zA-Z]/ // アルファベット\n    ];\n    \n    return !invalidPatterns.some(pattern => pattern.test(dateTimeStr));\n  };\n\n  // 時刻順序検証\n  const validateTimeOrder = (startTime, endTime) => {\n    if (!startTime || !endTime) return true;\n    \n    const start = new Date(`2000-01-01 ${startTime}`);\n    const end = new Date(`2000-01-01 ${endTime}`);\n    \n    return start < end;\n  };\n\n  // 作業時間計算と検証\n  const validateWorkDuration = (formData) => {\n    const warnings = [];\n    \n    if (formData.startTime && formData.endTime) {\n      const duration = calculateWorkDuration(formData.startTime, formData.endTime, formData.breakTime || 0);\n      \n      // 24時間超過チェック\n      if (formData.endDay === '翌日' || duration > 24) {\n        warnings.push('24時間を超過した作業時間が設定されています');\n      }\n      \n      // 異常に短い作業時間\n      if (isShortWorkTime(duration)) {\n        warnings.push('異常に短い作業時間が検出されました');\n      }\n      \n      // 異常に長い作業時間\n      if (isWorkTimeExceeded(duration)) {\n        warnings.push('作業時間が異常に長く設定されています');\n      }\n    }\n    \n    return warnings;\n  };\n\n  // 重複チェック\n  const checkDuplicateWork = async (formData) => {\n    try {\n      const existingRecords = await window.aivicApi.list('work_records', {\n        workDateTime: formData.workDateTime\n      });\n      \n      return existingRecords && existingRecords.length > 0;\n    } catch (error) {\n      console.error('重複チェックエラー:', error);\n      return false;\n    }\n  };\n\n  // 登録処理\n  const handleRegister = async () => {\n    const formData = getFormData();\n    \n    try {\n      // 必須項目チェック\n      const requiredValidation = validateRequiredFields(formData);\n      if (!requiredValidation.isValid) {\n        showError(`必須項目が入力されていません: ${requiredValidation.missingFields.join(', ')}`);\n        return;\n      }\n      \n      // 日時フォーマットチェック\n      if (!validateDateTimeFormat(formData.startDateTime) || !validateDateTimeFormat(formData.endDateTime)) {\n        showError('日時の形式が正しくありません', 'format-error');\n        return;\n      }\n      \n      // 時刻順序チェック\n      if (!validateTimeOrder(formData.startTime, formData.endTime)) {\n        showError('開始時刻は終了時刻より前に設定してください');\n        return;\n      }\n      \n      // 作業時間検証\n      const warnings = validateWorkDuration(formData);\n      warnings.forEach(warning => {\n        showWarning(warning);\n      });\n      \n      // 重複チェック\n      if (formData.workDateTime) {\n        const isDuplicate = await checkDuplicateWork(formData);\n        if (isDuplicate) {\n          showAlert('指定された日時には既に作業記録が存在します');\n          return;\n        }\n      }\n      \n      // 異常検知\n      const anomalyResult = performComprehensiveAnomalyDetection(formData);\n      if (anomalyResult.hasAnomalies) {\n        anomalyResult.anomalies.forEach(anomaly => {\n          if (anomaly.includes('短い')) {\n            showWarning('異常に短い作業時間が検出されました', 'warning-notification');\n          } else if (anomaly.includes('長い')) {\n            showWarning('作業時間が異常に長く検出されました', 'warning-notification');\n          }\n        });\n      }\n      \n      // データ保存\n      await window.aivicApi.save('work_records', formData);\n      showSuccess('作業記録が正常に登録されました');\n      \n    } catch (error) {\n      console.error('登録エラー:', error);\n      window.aivicNotify.error('登録処理中にエラーが発生しました');\n    }\n  };\n\n  // 保存処理\n  const handleSave = async () => {\n    const formData = getFormData();\n    \n    try {\n      // 日時フォーマットチェック\n      if (!validateDateTimeFormat(formData.startDateTime) || !validateDateTimeFormat(formData.endDateTime)) {\n        showError('日時の形式が正しくありません', 'format-error');\n        return;\n      }\n      \n      // 時刻順序チェック\n      if (!validateTimeOrder(formData.startTime, formData.endTime)) {\n        showError('開始時刻は終了時刻より前に設定してください');\n        return;\n      }\n      \n      // 作業時間検証\n      const warnings = validateWorkDuration(formData);\n      warnings.forEach(warning => {\n        showWarning(warning);\n      });\n      \n      // データ保存\n      await window.aivicApi.save('work_records', formData);\n      showSuccess('作業記録が保存されました');\n      \n    } catch (error) {\n      console.error('保存エラー:', error);\n      window.aivicNotify.error('保存処理中にエラーが発生しました');\n    }\n  };\n\n  // 新規処理\n  const handleNew = () => {\n    // フォームをクリア\n    const inputs = container.querySelectorAll('input, select, textarea');\n    inputs.forEach(input => {\n      input.value = '';\n    });\n    \n    clearMessages();\n    showSuccess('新規入力画面を表示しました');\n  };\n\n  // エラーログ出力\n  const handleErrorLogExport = async () => {\n    try {\n      const errorLogs = await window.aivicApi.list('error_logs');\n      \n      // CSV形式でエラーログを生成\n      const csvContent = errorLogs.map(log => \n        `${log.timestamp},${log.level},${log.message},${log.details || ''}`\n      ).join('\\n');\n      \n      // ダウンロード処理\n      const blob = new Blob([csvContent], { type: 'text/csv' });\n      const url = window.URL.createObjectURL(blob);\n      const a = document.createElement('a');\n      a.href = url;\n      a.download = `error_log_${new Date().toISOString().split('T')[0]}.csv`;\n      a.click();\n      window.URL.revokeObjectURL(url);\n      \n      showSuccess('エラーログを出力しました');\n      \n    } catch (error) {\n      console.error('エラーログ出力エラー:', error);\n      window.aivicNotify.error('エラーログの出力に失敗しました');\n    }\n  };\n\n  // イベントリスナー設定\n  if (registerBtn) {\n    registerBtn.addEventListener('click', handleRegister);\n  }\n  \n  if (saveBtn) {\n    saveBtn.addEventListener('click', handleSave);\n  }\n  \n  if (newBtn) {\n    newBtn.addEventListener('click', handleNew);\n  }\n  \n  if (errorLogBtn) {\n    errorLogBtn.addEventListener('click', handleErrorLogExport);\n  }\n\n  // 初期化完了\n  console.log('入力チェック機能パネルが初期化されました');\n}";
</script>

                    <div data-aivic-panel="scr-1778907343735" style="display:none"></div>
                    <div data-aivic-panel="scr-1778907353387" style="display:none"></div>
                    <div data-aivic-panel="scr-1778907367889" style="display:none"></div>
                    <div data-aivic-panel="scr-1778907380182" style="display:none"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
