ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentErrors = [];\n  let existingRecords = [];\n\n  // 既存レコードを取得\n  async function loadExistingRecords() {\n    try {\n      existingRecords = await window.aivicApi.list(1) || []; // 作業記録テーブル\n    } catch (error) {\n      existingRecords = tables[1]?.records || [];\n    }\n  }\n\n  // 入力チェック実行\n  function performValidation() {\n    currentErrors = [];\n    const workDate = container.querySelector('#work-date').value;\n    const startTime = container.querySelector('#start-time').value;\n    const endTime = container.querySelector('#end-time').value;\n    const breakTime = container.querySelector('#break-time').value;\n    const workContent = container.querySelector('#work-content').value;\n    const workLocation = container.querySelector('#work-location').value;\n    const workerName = container.querySelector('#worker-name').value;\n\n    // 必須項目チェック\n    const requiredErrors = [];\n    if (!workDate) requiredErrors.push('作業日は必須です');\n    if (!workContent) requiredErrors.push('作業内容は必須です');\n    if (!startTime) requiredErrors.push('作業開始時刻は必須です');\n    if (!endTime) requiredErrors.push('作業終了時刻は必須です');\n    if (!workLocation) requiredErrors.push('作業場所は必須です');\n    if (!workerName) requiredErrors.push('担当者名は必須です');\n\n    updateCheckStatus('required', requiredErrors);\n\n    // 入力形式チェック\n    const formatErrors = [];\n    if (workDate && !isValidDate(workDate)) formatErrors.push('作業日の形式が正しくありません');\n    if (startTime && !isValidTime(startTime)) formatErrors.push('開始時刻の形式が正しくありません');\n    if (endTime && !isValidTime(endTime)) formatErrors.push('終了時刻の形式が正しくありません');\n    if (breakTime && (isNaN(breakTime) || breakTime < 0)) formatErrors.push('休憩時間は正の値で入力してください');\n    if (workContent && workContent.length > 200) formatErrors.push('作業内容は200文字以内で入力してください');\n\n    updateCheckStatus('format', formatErrors);\n\n    // 日時整合性チェック\n    const datetimeErrors = [];\n    if (workDate && startTime && endTime) {\n      const startDateTime = new Date(`${workDate}T${startTime}`);\n      const endDateTime = new Date(`${workDate}T${endTime}`);\n      if (startDateTime >= endDateTime) {\n        datetimeErrors.push('開始時刻は終了時刻より前に設定してください');\n      }\n    }\n\n    updateCheckStatus('datetime', datetimeErrors);\n\n    // 作業時間妥当性チェック\n    const worktimeErrors = [];\n    if (workDate && startTime && endTime) {\n      const startDateTime = new Date(`${workDate}T${startTime}`);\n      const endDateTime = new Date(`${workDate}T${endTime}`);\n      const workMinutes = (endDateTime - startDateTime) / (1000 * 60);\n      const breakMinutes = parseInt(breakTime) || 0;\n      const actualWorkMinutes = workMinutes - breakMinutes;\n\n      if (actualWorkMinutes <= 0) {\n        worktimeErrors.push('実作業時間が0分以下です');\n      } else if (actualWorkMinutes < 5) {\n        worktimeErrors.push('作業時間が異常に短く設定されています。確認してください。');\n      } else if (actualWorkMinutes > 1440) { // 24時間\n        worktimeErrors.push('24時間を超過する作業時間が入力されました');\n      } else if (actualWorkMinutes > 720) { // 12時間\n        worktimeErrors.push('作業時間が異常に長く設定されています。確認してください。');\n      }\n    }\n\n    updateCheckStatus('worktime', worktimeErrors);\n\n    // 重複データチェック\n    const duplicateErrors = [];\n    if (workDate && startTime) {\n      const targetDateTime = `${workDate}T${startTime}`;\n      const duplicate = existingRecords.find(record => {\n        const recordDateTime = record.作業開始時刻 || record.workStartTime;\n        return recordDateTime && recordDateTime.includes(workDate) && recordDateTime.includes(startTime);\n      });\n      if (duplicate) {\n        duplicateErrors.push('指定された日時には既に作業記録が登録されています。別の日時を指定してください。');\n      }\n    }\n\n    updateCheckStatus('duplicate', duplicateErrors);\n\n    // 異常値検出\n    const anomalyErrors = [];\n    if (workContent && /^[0-9\\s\\-_]+$/.test(workContent)) {\n      anomalyErrors.push('作業内容に数値や記号のみが入力されています');\n    }\n    if (workerName && /^[0-9\\s\\-_]+$/.test(workerName)) {\n      anomalyErrors.push('担当者名に数値や記号のみが入力されています');\n    }\n\n    updateCheckStatus('anomaly', anomalyErrors);\n\n    // 入力修正提案の表示\n    showSuggestions();\n\n    // 総合ステータス更新\n    updateOverallStatus();\n  }\n\n  function updateCheckStatus(checkType, errors) {\n    const statusIcon = container.querySelector(`#${checkType}-status-icon`);\n    const errorsDiv = container.querySelector(`#${checkType}-errors`);\n    const checkDiv = container.querySelector(`#${checkType}-check`);\n\n    if (errors.length === 0) {\n      statusIcon.textContent = '✅';\n      statusIcon.style.color = '#28a745';\n      errorsDiv.textContent = 'チェック通過';\n      checkDiv.style.borderLeftColor = '#28a745';\n    } else {\n      statusIcon.textContent = '❌';\n      statusIcon.style.color = '#dc3545';\n      errorsDiv.innerHTML = errors.map(err => `• ${err}`).join('<br>');\n      checkDiv.style.borderLeftColor = '#dc3545';\n      currentErrors.push(...errors);\n    }\n  }\n\n  function showSuggestions() {\n    const suggestionArea = container.querySelector('#suggestion-area');\n    const suggestionsDiv = container.querySelector('#suggestions');\n    const suggestions = [];\n\n    const workContent = container.querySelector('#work-content').value;\n    const startTime = container.querySelector('#start-time').value;\n    const endTime = container.querySelector('#end-time').value;\n\n    if (workContent && /^[0-9\\s\\-_]+$/.test(workContent)) {\n      suggestions.push('作業内容には具体的な作業内容を文章で入力してください（例：配管工事、設備点検作業）');\n    }\n\n    if (startTime && endTime) {\n      const start = new Date(`2000-01-01T${startTime}`);\n      const end = new Date(`2000-01-01T${endTime}`);\n      if (start >= end) {\n        suggestions.push('開始時刻と終了時刻を確認し、正しい時間順序で入力してください');\n      }\n    }\n\n    if (suggestions.length > 0) {\n      suggestionsDiv.innerHTML = suggestions.map(s => `• ${s}`).join('<br>');\n      suggestionArea.style.display = 'block';\n    } else {\n      suggestionArea.style.display = 'none';\n    }\n  }\n\n  function updateOverallStatus() {\n    const overallIcon = container.querySelector('#overall-status-icon');\n    const saveStatus = container.querySelector('#save-status');\n    const registerBtn = container.querySelector('#btn-register');\n\n    if (currentErrors.length === 0) {\n      overallIcon.textContent = '✅';\n      overallIcon.style.color = '#28a745';\n      saveStatus.textContent = '保存可能';\n      saveStatus.style.color = '#28a745';\n      registerBtn.disabled = false;\n      registerBtn.style.opacity = '1';\n    } else {\n      overallIcon.textContent = '❌';\n      overallIcon.style.color = '#dc3545';\n      saveStatus.textContent = '保存不可 - エラーを修正してください';\n      saveStatus.style.color = '#dc3545';\n      registerBtn.disabled = true;\n      registerBtn.style.opacity = '0.5';\n    }\n  }\n\n  function isValidDate(dateString) {\n    const date = new Date(dateString);\n    return date instanceof Date && !isNaN(date);\n  }\n\n  function isValidTime(timeString) {\n    return /^([01]?[0-9]|2[0-3]):[0-5][0-9]$/.test(timeString);\n  }\n\n  function showGuidance(fieldName) {\n    const guidancePanel = container.querySelector('#guidance-panel');\n    const guidanceContent = container.querySelector('#guidance-content');\n    \n    const guidanceTexts = {\n      'work-date': '作業を実施した日付を選択してください。未来の日付は選択できません。',\n      'start-time': '作業開始時刻を24時間形式で入力してください（例：09:00）',\n      'end-time': '作業終了時刻を24時間形式で入力してください（例：17:00）',\n      'break-time': '休憩時間を分単位で入力してください（例：60）',\n      'work-content': '具体的な作業内容を200文字以内で入力してください（例：配管工事、設備点検作業）',\n      'work-location': '作業を実施した場所を入力してください（例：A棟1階）',\n      'worker-name': '作業を担当した作業員の氏名を入力してください'\n    };\n\n    if (guidanceTexts[fieldName]) {\n      guidanceContent.textContent = guidanceTexts[fieldName];\n      guidancePanel.style.display = 'block';\n    }\n  }\n\n  function hideGuidance() {\n    const guidancePanel = container.querySelector('#guidance-panel');\n    guidancePanel.style.display = 'none';\n  }\n\n  // イベントリスナー設定\n  const inputs = ['work-date', 'start-time', 'end-time', 'break-time', 'work-content', 'work-location', 'worker-name'];\n  inputs.forEach(inputId => {\n    const input = container.querySelector(`#${inputId}`);\n    input.addEventListener('input', performValidation);\n    input.addEventListener('focus', () => showGuidance(inputId));\n    input.addEventListener('blur', hideGuidance);\n  });\n\n  // 登録ボタン\n  container.querySelector('#btn-register').addEventListener('click', async () => {\n    if (currentErrors.length > 0) return;\n\n    const workData = {\n      作業日: container.querySelector('#work-date').value,\n      作業開始時刻: `${container.querySelector('#work-date').value}T${container.querySelector('#start-time').value}`,\n      作業終了時刻: `${container.querySelector('#work-date').value}T${container.querySelector('#end-time').value}`,\n      作業内容: container.querySelector('#work-content').value,\n      作業場所: container.querySelector('#work-location').value,\n      作業員ID: 'current-user', // 実際の実装では現在のユーザーIDを使用\n      プロジェクト名: 'デフォルトプロジェクト',\n      作業種別: '一般作業',\n      進捗状況: '完了',\n      承認状態: '未承認',\n      作成日時: new Date().toISOString(),\n      更新日時: new Date().toISOString(),\n      作成者ID: 'current-user'\n    };\n\n    try {\n      const saved = await window.aivicApi.save(1, workData);\n      if (saved) {\n        alert('工数記録が正常に登録されました');\n        // フォームリセット\n        inputs.forEach(inputId => {\n          container.querySelector(`#${inputId}`).value = '';\n        });\n        performValidation();\n      }\n    } catch (error) {\n      alert('登録に失敗しました');\n    }\n  });\n\n  // エラー詳細確認ボタン\n  container.querySelector('#btn-error-detail').addEventListener('click', () => {\n    const modal = container.querySelector('#error-detail-modal');\n    const content = container.querySelector('#error-detail-content');\n    \n    if (currentErrors.length === 0) {\n      content.innerHTML = '<p style=\"color: var(--text); font-size: 13px;\">現在エラーはありません。</p>';\n    } else {\n      content.innerHTML = currentErrors.map((error, index) => \n        `<div style=\"margin-bottom: 8px; padding: 8px; background: var(--bg-main); border-radius: 4px; border-left: 3px solid #dc3545;\">\n          <span style=\"font-size: 13px; color: var(--text);\">${index + 1}. ${error}</span>\n        </div>`\n      ).join('');\n    }\n    \n    modal.style.display = 'block';\n  });\n\n  // モーダル閉じる\n  container.querySelector('#btn-close-modal').addEventListener('click', () => {\n    container.querySelector('#error-detail-modal').style.display = 'none';\n  });\n\n  // エラーログ出力ボタン\n  container.querySelector('#btn-export-log').addEventListener('click', () => {\n    const logData = {\n      timestamp: new Date().toISOString(),\n      errors: currentErrors,\n      inputData: {\n        workDate: container.querySelector('#work-date').value,\n        startTime: container.querySelector('#start-time').value,\n        endTime: container.querySelector('#end-time').value,\n        breakTime: container.querySelector('#break-time').value,\n        workContent: container.querySelector('#work-content').value,\n        workLocation: container.querySelector('#work-location').value,\n        workerName: container.querySelector('#worker-name').value\n      }\n    };\n\n    const blob = new Blob([JSON.stringify(logData, null, 2)], { type: 'application/json' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url;\n    a.download = `error-log-${new Date().toISOString().slice(0, 10)}.json`;\n    a.click();\n    URL.revokeObjectURL(url);\n  });\n\n  // 工数記録画面へ遷移\n  container.querySelector('#btn-work-record').addEventListener('click', () => {\n    window.showScreen('scr-1778907133295');\n  });\n\n  // 初期化\n  loadExistingRecords().then(() => {\n    performValidation();\n  });\n}";
</script>

    <button class="emergency-btn" data-aivic-nav="scr-1778907330826" onclick="showScreen('scr-1778907330826')" title="緊急報告">
        ⚠
    </button>

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
