ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentErrors = [];\n  let currentWarnings = [];\n  let isDuplicateCheck = false;\n  \n  // 作業項目マスタの初期化\n  const workItemSelect = container.querySelector('#work-item');\n  const workItemMaster = tables[3]?.records || [];\n  workItemMaster.forEach(item => {\n    if (item.有効フラグ) {\n      const option = document.createElement('option');\n      option.value = item.作業項目ID;\n      option.textContent = item.作業項目名;\n      workItemSelect.appendChild(option);\n    }\n  });\n\n  // 入力フィールドの取得\n  const workDate = container.querySelector('#work-date');\n  const startTime = container.querySelector('#start-time');\n  const endTime = container.querySelector('#end-time');\n  const workContent = container.querySelector('#work-content');\n  const workLocation = container.querySelector('#work-location');\n  const workerName = container.querySelector('#worker-name');\n  \n  // ステータス表示要素\n  const statusIcon = container.querySelector('#status-icon');\n  const statusText = container.querySelector('#status-text');\n  const saveIcon = container.querySelector('#save-icon');\n  const saveText = container.querySelector('#save-text');\n  const saveBtn = container.querySelector('#save-btn');\n  \n  // エラー・警告・提案表示要素\n  const errorArea = container.querySelector('#error-area');\n  const errorList = container.querySelector('#error-list');\n  const warningArea = container.querySelector('#warning-area');\n  const warningMessage = container.querySelector('#warning-message');\n  const suggestionArea = container.querySelector('#suggestion-area');\n  const suggestionMessage = container.querySelector('#suggestion-message');\n  \n  // ガイダンスパネル\n  const guidancePanel = container.querySelector('#guidance-panel');\n  const guidanceContent = container.querySelector('#guidance-content');\n  \n  // エラー詳細モーダル\n  const errorDetailModal = container.querySelector('#error-detail-modal');\n  const errorDetailContent = container.querySelector('#error-detail-content');\n\n  // ガイダンス内容の定義\n  const guidanceData = {\n    'work-date': '作業を実施した日付を選択してください。未来の日付は選択できません。',\n    'work-item': '実施した作業の種類を選択してください。該当する項目がない場合は管理者にお問い合わせください。',\n    'start-time': '作業開始時刻を24時間形式で入力してください。例：09:00',\n    'end-time': '作業終了時刻を24時間形式で入力してください。開始時刻より後の時刻を入力してください。',\n    'work-content': '実施した作業の具体的な内容を200文字以内で入力してください。',\n    'work-location': '作業を実施した場所を入力してください。例：A棟1階、現場事務所',\n    'worker-name': '作業を実施した担当者の氏名を入力してください。'\n  };\n\n  // ステータス更新関数\n  function updateStatus(isValid) {\n    if (isValid) {\n      statusIcon.style.background = '#10b981';\n      statusIcon.innerHTML = '<span style=\"color: #fff; font-size: 12px;\">✓</span>';\n      statusText.textContent = '入力チェック通過';\n      statusText.style.color = '#10b981';\n      \n      saveIcon.style.background = '#10b981';\n      saveText.textContent = 'データ保存: 可能';\n      saveText.style.color = '#10b981';\n      saveBtn.disabled = false;\n      saveBtn.style.opacity = '1';\n    } else {\n      statusIcon.style.background = '#ef4444';\n      statusIcon.innerHTML = '<span style=\"color: #fff; font-size: 12px;\">✗</span>';\n      statusText.textContent = '入力エラーあり';\n      statusText.style.color = '#ef4444';\n      \n      saveIcon.style.background = '#ef4444';\n      saveText.textContent = 'データ保存: 不可';\n      saveText.style.color = '#ef4444';\n      saveBtn.disabled = true;\n      saveBtn.style.opacity = '0.5';\n    }\n  }\n\n  // バリデーション関数\n  function validateInput() {\n    currentErrors = [];\n    currentWarnings = [];\n    \n    const workDateValue = workDate.value;\n    const startTimeValue = startTime.value;\n    const endTimeValue = endTime.value;\n    const workContentValue = workContent.value.trim();\n    const workLocationValue = workLocation.value.trim();\n    const workerNameValue = workerName.value.trim();\n    const workItemValue = workItemSelect.value;\n\n    // 必須項目チェック\n    if (!workDateValue) currentErrors.push('作業日は必須です');\n    if (!workItemValue) currentErrors.push('作業項目は必須です');\n    if (!startTimeValue) currentErrors.push('開始時刻は必須です');\n    if (!endTimeValue) currentErrors.push('終了時刻は必須です');\n    if (!workContentValue) currentErrors.push('作業内容は必須です');\n    if (!workLocationValue) currentErrors.push('作業場所は必須です');\n    if (!workerNameValue) currentErrors.push('担当者名は必須です');\n\n    // 日付形式チェック\n    if (workDateValue) {\n      const workDateObj = new Date(workDateValue);\n      const today = new Date();\n      today.setHours(0, 0, 0, 0);\n      \n      if (workDateObj > today) {\n        currentErrors.push('作業日に未来の日付は設定できません');\n      }\n    }\n\n    // 時刻整合性チェック\n    if (startTimeValue && endTimeValue) {\n      const startMinutes = timeToMinutes(startTimeValue);\n      const endMinutes = timeToMinutes(endTimeValue);\n      \n      if (startMinutes >= endMinutes) {\n        currentErrors.push('開始時刻は終了時刻より前に設定してください');\n      } else {\n        const workMinutes = endMinutes - startMinutes;\n        \n        // 異常に短い作業時間（5分未満）\n        if (workMinutes < 5) {\n          currentWarnings.push('作業時間が異常に短く設定されています（' + workMinutes + '分）。入力内容を確認してください。');\n        }\n        \n        // 異常に長い作業時間（12時間超）\n        if (workMinutes > 720) {\n          currentWarnings.push('作業時間が異常に長く設定されています（' + Math.floor(workMinutes/60) + '時間' + (workMinutes%60) + '分）。確認してください。');\n        }\n        \n        // 24時間超過\n        if (workMinutes > 1440) {\n          currentErrors.push('作業時間が24時間を超過しています');\n        }\n      }\n    }\n\n    // 文字数チェック\n    if (workContentValue.length > 200) {\n      currentErrors.push('作業内容は200文字以内で入力してください（現在：' + workContentValue.length + '文字）');\n    }\n\n    // 重複データチェック（非同期）\n    if (workDateValue && startTimeValue && !isDuplicateCheck) {\n      checkDuplicateData(workDateValue, startTimeValue);\n    }\n\n    // 表示更新\n    updateErrorDisplay();\n    updateWarningDisplay();\n    updateSuggestionDisplay();\n    updateStatus(currentErrors.length === 0);\n  }\n\n  // 時刻を分に変換\n  function timeToMinutes(timeStr) {\n    const [hours, minutes] = timeStr.split(':').map(Number);\n    return hours * 60 + minutes;\n  }\n\n  // 重複データチェック\n  async function checkDuplicateData(date, time) {\n    isDuplicateCheck = true;\n    try {\n      const records = await window.aivicApi.list(1); // 作業記録テーブル\n      if (records) {\n        const duplicate = records.find(record => {\n          const recordDate = new Date(record.作業日).toISOString().split('T')[0];\n          const recordTime = new Date(record.作業開始時刻).toTimeString().slice(0, 5);\n          return recordDate === date && recordTime === time;\n        });\n        \n        if (duplicate) {\n          currentErrors.push('指定された日時には既に作業記録が登録されています。別の日時を指定してください。');\n          updateErrorDisplay();\n          updateStatus(false);\n        }\n      }\n    } catch (error) {\n      console.error('重複チェックエラー:', error);\n    }\n    isDuplicateCheck = false;\n  }\n\n  // エラー表示更新\n  function updateErrorDisplay() {\n    if (currentErrors.length > 0) {\n      errorList.innerHTML = currentErrors.map(error => `<li>${error}</li>`).join('');\n      errorArea.style.display = 'block';\n    } else {\n      errorArea.style.display = 'none';\n    }\n  }\n\n  // 警告表示更新\n  function updateWarningDisplay() {\n    if (currentWarnings.length > 0) {\n      warningMessage.textContent = currentWarnings.join(' ');\n      warningArea.style.display = 'block';\n    } else {\n      warningArea.style.display = 'none';\n    }\n  }\n\n  // 修正提案表示更新\n  function updateSuggestionDisplay() {\n    const suggestions = [];\n    \n    if (currentErrors.some(e => e.includes('開始時刻は終了時刻より前'))) {\n      suggestions.push('開始時刻と終了時刻を確認し、正しい時刻を入力してください。');\n    }\n    \n    if (currentErrors.some(e => e.includes('文字数'))) {\n      suggestions.push('作業内容をより簡潔にまとめて200文字以内にしてください。');\n    }\n    \n    if (currentWarnings.some(w => w.includes('異常に短い'))) {\n      suggestions.push('作業時間が短すぎる可能性があります。休憩時間を除いた実作業時間を入力してください。');\n    }\n    \n    if (suggestions.length > 0) {\n      suggestionMessage.textContent = suggestions.join(' ');\n      suggestionArea.style.display = 'block';\n    } else {\n      suggestionArea.style.display = 'none';\n    }\n  }\n\n  // 入力フィールドのイベントリスナー\n  const inputFields = [workDate, workItemSelect, startTime, endTime, workContent, workLocation, workerName];\n  \n  inputFields.forEach(field => {\n    field.addEventListener('input', validateInput);\n    field.addEventListener('blur', validateInput);\n    \n    // ガイダンス表示\n    field.addEventListener('focus', (e) => {\n      const fieldId = e.target.id;\n      if (guidanceData[fieldId]) {\n        guidanceContent.textContent = guidanceData[fieldId];\n        guidancePanel.style.display = 'block';\n      }\n    });\n    \n    field.addEventListener('blur', () => {\n      setTimeout(() => {\n        if (!container.querySelector(':focus')) {\n          guidancePanel.style.display = 'none';\n        }\n      }, 100);\n    });\n  });\n\n  // エラー詳細ボタン\n  container.querySelector('#error-detail-btn').addEventListener('click', () => {\n    let detailHtml = '<h4 style=\"margin: 0 0 8px 0; font-size: 13px;\">入力エラー詳細</h4>';\n    \n    if (currentErrors.length > 0) {\n      detailHtml += '<div style=\"margin-bottom: 12px;\"><strong>エラー項目:</strong><ul style=\"margin: 4px 0; padding-left: 16px;\">';\n      currentErrors.forEach(error => {\n        detailHtml += `<li style=\"margin-bottom: 4px; color: #ef4444;\">${error}</li>`;\n      });\n      detailHtml += '</ul></div>';\n    }\n    \n    if (currentWarnings.length > 0) {\n      detailHtml += '<div><strong>警告項目:</strong><ul style=\"margin: 4px 0; padding-left: 16px;\">';\n      currentWarnings.forEach(warning => {\n        detailHtml += `<li style=\"margin-bottom: 4px; color: #f59e0b;\">${warning}</li>`;\n      });\n      detailHtml += '</ul></div>';\n    }\n    \n    errorDetailContent.innerHTML = detailHtml;\n    errorDetailModal.style.display = 'flex';\n  });\n\n  // モーダル閉じる\n  container.querySelector('#close-modal-btn').addEventListener('click', () => {\n    errorDetailModal.style.display = 'none';\n  });\n\n  // モーダル背景クリックで閉じる\n  errorDetailModal.addEventListener('click', (e) => {\n    if (e.target === errorDetailModal) {\n      errorDetailModal.style.display = 'none';\n    }\n  });\n\n  // 登録ボタン\n  saveBtn.addEventListener('click', async () => {\n    if (currentErrors.length > 0) return;\n    \n    const workRecord = {\n      作業員ID: 'current-user-id', // 実際の実装では現在のユーザーIDを使用\n      作業日: workDate.value,\n      作業開始時刻: `${workDate.value}T${startTime.value}:00`,\n      作業終了時刻: `${workDate.value}T${endTime.value}:00`,\n      作業時間: timeToMinutes(endTime.value) - timeToMinutes(startTime.value),\n      プロジェクト名: workItemSelect.options[workItemSelect.selectedIndex]?.text || '',\n      作業場所: workLocation.value,\n      作業種別: workItemSelect.options[workItemSelect.selectedIndex]?.text || '',\n      作業内容: workContent.value,\n      進捗状況: '完了',\n      承認状態: '未承認',\n      作成者ID: 'current-user-id'\n    };\n    \n    try {\n      const saved = await window.aivicApi.save(1, workRecord);\n      if (saved) {\n        alert('工数記録を登録しました');\n        clearForm();\n        window.showScreen('scr-1778907133295'); // 工数記録画面へ\n      }\n    } catch (error) {\n      console.error('保存エラー:', error);\n      alert('保存に失敗しました');\n    }\n  });\n\n  // クリアボタン\n  container.querySelector('#clear-btn').addEventListener('click', clearForm);\n\n  function clearForm() {\n    inputFields.forEach(field => {\n      if (field.tagName === 'SELECT') {\n        field.selectedIndex = 0;\n      } else {\n        field.value = '';\n      }\n    });\n    currentErrors = [];\n    currentWarnings = [];\n    updateErrorDisplay();\n    updateWarningDisplay();\n    updateSuggestionDisplay();\n    updateStatus(false);\n    statusIcon.style.background = '#666';\n    statusIcon.innerHTML = '<span style=\"color: #fff; font-size: 12px; font-weight: 600;\">?</span>';\n    statusText.textContent = '入力チェック待機中';\n    statusText.style.color = 'var(--text)';\n  }\n\n  // エラーログ出力ボタン\n  container.querySelector('#error-log-btn').addEventListener('click', async () => {\n    try {\n      const errorLogs = await window.aivicApi.list(4); // 異常値検出ログテーブル\n      if (errorLogs) {\n        let csvContent = '\\uFEFF'; // BOM\n        csvContent += '検出日時,異常値種別,検出項目,検出値,重要度,確認状況\\n';\n        \n        errorLogs.forEach(log => {\n          csvContent += `\"${log.検出日時}\",\"${log.異常値種別}\",\"${log.検出項目}\",\"${log.検出値}\",\"${log.重要度}\",\"${log.確認状況}\"\\n`;\n        });\n        \n        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n        const link = document.createElement('a');\n        link.href = URL.createObjectURL(blob);\n        link.download = `error_log_${new Date().toISOString().split('T')[0]}.csv`;\n        link.click();\n        \n        alert('エラーログを出力しました');\n      }\n    } catch (error) {\n      console.error('エラーログ出力エラー:', error);\n      alert('エラーログの出力に失敗しました');\n    }\n  });\n\n  // 初期状態設定\n  updateStatus(false);\n}";

  <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
