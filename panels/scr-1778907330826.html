ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type":"text","required":false,"description":"管理者による対応内容や備考"},{"name":"検出日時","type":"timestamp","required":true,"description":"異常値が検出された日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let uploadedFiles = [];\n  let currentUser = null;\n  \n  // 現在のユーザー情報を取得（仮の実装）\n  async function loadCurrentUser() {\n    try {\n      const users = await window.aivicApi.list(0); // ユーザーテーブル\n      currentUser = users.find(u => u.有効フラグ) || users[0];\n      if (currentUser) {\n        container.querySelector('#reporter-name').value = currentUser.氏名 || '';\n      }\n    } catch (error) {\n      console.error('ユーザー情報の取得に失敗:', error);\n    }\n  }\n\n  // 作業項目を読み込み\n  async function loadWorkItems() {\n    try {\n      const workItems = await window.aivicApi.list(3); // 作業項目マスタ\n      const select = container.querySelector('#work-item');\n      workItems.filter(item => item.有効フラグ).forEach(item => {\n        const option = document.createElement('option');\n        option.value = item.作業項目ID;\n        option.textContent = item.作業項目名;\n        select.appendChild(option);\n      });\n    } catch (error) {\n      console.error('作業項目の取得に失敗:', error);\n    }\n  }\n\n  // 文字数カウンター\n  const contentTextarea = container.querySelector('#emergency-content');\n  const charCount = container.querySelector('#char-count');\n  \n  contentTextarea.addEventListener('input', function() {\n    const length = this.value.length;\n    charCount.textContent = `${length}/1000`;\n    if (length > 1000) {\n      charCount.style.color = '#ff4757';\n    } else {\n      charCount.style.color = 'var(--text-muted)';\n    }\n  });\n\n  // 写真アップロード処理\n  const photoUploadArea = container.querySelector('#photo-upload-area');\n  const photoInput = container.querySelector('#photo-input');\n  const photoPreview = container.querySelector('#photo-preview');\n  const photoError = container.querySelector('#photo-error');\n\n  photoUploadArea.addEventListener('click', () => photoInput.click());\n  \n  photoUploadArea.addEventListener('dragover', (e) => {\n    e.preventDefault();\n    photoUploadArea.style.borderColor = 'var(--primary)';\n  });\n  \n  photoUploadArea.addEventListener('dragleave', () => {\n    photoUploadArea.style.borderColor = 'rgba(255,255,255,0.18)';\n  });\n  \n  photoUploadArea.addEventListener('drop', (e) => {\n    e.preventDefault();\n    photoUploadArea.style.borderColor = 'rgba(255,255,255,0.18)';\n    handleFiles(e.dataTransfer.files);\n  });\n  \n  photoInput.addEventListener('change', (e) => {\n    handleFiles(e.target.files);\n  });\n\n  function handleFiles(files) {\n    photoError.style.display = 'none';\n    \n    if (uploadedFiles.length + files.length > 5) {\n      showError('photo-error', '画像は最大5枚まで添付できます');\n      return;\n    }\n\n    Array.from(files).forEach(file => {\n      if (!file.type.startsWith('image/')) {\n        showError('photo-error', 'サポートされていないファイル形式です。JPG、PNG形式のファイルをアップロードしてください。');\n        return;\n      }\n      \n      if (file.size > 5 * 1024 * 1024) {\n        showError('photo-error', 'ファイルサイズが上限を超えています。5MB以下のファイルを選択してください。');\n        return;\n      }\n\n      uploadedFiles.push(file);\n      \n      const reader = new FileReader();\n      reader.onload = (e) => {\n        const preview = document.createElement('div');\n        preview.style.cssText = 'position: relative; width: 80px; height: 80px; border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.18);';\n        \n        preview.innerHTML = `\n          <img src=\"${e.target.result}\" style=\"width: 100%; height: 100%; object-fit: cover;\">\n          <button type=\"button\" class=\"remove-photo\" data-index=\"${uploadedFiles.length - 1}\" style=\"position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,0.7); color: #fff; border: none; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;\">×</button>\n        `;\n        \n        photoPreview.appendChild(preview);\n      };\n      reader.readAsDataURL(file);\n    });\n  }\n\n  // 写真削除\n  photoPreview.addEventListener('click', (e) => {\n    if (e.target.classList.contains('remove-photo')) {\n      const index = parseInt(e.target.dataset.index);\n      uploadedFiles.splice(index, 1);\n      e.target.closest('div').remove();\n      \n      // インデックスを再設定\n      photoPreview.querySelectorAll('.remove-photo').forEach((btn, i) => {\n        btn.dataset.index = i;\n      });\n    }\n  });\n\n  // バリデーション関数\n  function showError(elementId, message) {\n    const errorElement = container.querySelector(`#${elementId}`);\n    errorElement.textContent = message;\n    errorElement.style.display = 'block';\n  }\n\n  function hideError(elementId) {\n    const errorElement = container.querySelector(`#${elementId}`);\n    errorElement.style.display = 'none';\n  }\n\n  function validateForm() {\n    let isValid = true;\n    \n    // 緊急度チェック\n    const urgency = container.querySelector('input[name=\"urgency\"]:checked');\n    if (!urgency) {\n      showError('urgency-error', '緊急度を選択してください');\n      isValid = false;\n    } else {\n      hideError('urgency-error');\n    }\n\n    // 報告種別チェック\n    const reportType = container.querySelector('#report-type').value;\n    if (!reportType) {\n      showError('report-type-error', '報告種別を選択してください');\n      isValid = false;\n    } else {\n      hideError('report-type-error');\n    }\n\n    // 発生日時チェック\n    const datetime = container.querySelector('#occurrence-datetime').value;\n    if (!datetime) {\n      showError('occurrence-datetime-error', '発生日時を入力してください');\n      isValid = false;\n    } else {\n      const selectedDate = new Date(datetime);\n      const now = new Date();\n      if (selectedDate > now) {\n        showError('occurrence-datetime-error', '発生日時に未来の日付は入力できません');\n        isValid = false;\n      } else {\n        hideError('occurrence-datetime-error');\n      }\n    }\n\n    // 発生場所チェック\n    const location = container.querySelector('#occurrence-location').value.trim();\n    if (!location) {\n      showError('occurrence-location-error', '発生場所を入力してください');\n      isValid = false;\n    } else {\n      hideError('occurrence-location-error');\n    }\n\n    // 緊急事態内容チェック\n    const content = container.querySelector('#emergency-content').value.trim();\n    if (!content) {\n      showError('emergency-content-error', '緊急事態内容を入力してください');\n      isValid = false;\n    } else if (content.length > 1000) {\n      showError('emergency-content-error', '文字数上限を超えています');\n      isValid = false;\n    } else {\n      hideError('emergency-content-error');\n    }\n\n    // 連絡先電話番号チェック\n    const phone = container.querySelector('#contact-phone').value.trim();\n    if (!phone) {\n      showError('contact-phone-error', '連絡先電話番号を入力してください');\n      isValid = false;\n    } else if (!/^0\\d{1,4}-\\d{1,4}-\\d{4}$/.test(phone)) {\n      showError('contact-phone-error', '正しい電話番号の形式で入力してください');\n      isValid = false;\n    } else {\n      hideError('contact-phone-error');\n    }\n\n    return isValid;\n  }\n\n  // フォーム送信処理\n  const form = container.querySelector('#emergency-form');\n  const submitBtn = container.querySelector('#btn-submit');\n  const draftBtn = container.querySelector('#btn-draft');\n  const completeBtn = container.querySelector('#btn-complete');\n  const successMessage = container.querySelector('#success-message');\n\n  form.addEventListener('submit', async (e) => {\n    e.preventDefault();\n    \n    if (!validateForm()) {\n      return;\n    }\n\n    try {\n      const formData = {\n        緊急度: container.querySelector('input[name=\"urgency\"]:checked').value,\n        報告種別: container.querySelector('#report-type').value,\n        発生日時: container.querySelector('#occurrence-datetime').value,\n        発生場所: container.querySelector('#occurrence-location').value,\n        作業項目ID: container.querySelector('#work-item').value || null,\n        緊急事態内容: container.querySelector('#emergency-content').value,\n        報告者名: container.querySelector('#reporter-name').value,\n        連絡先電話番号: container.querySelector('#contact-phone').value,\n        添付画像数: uploadedFiles.length,\n        報告日時: new Date().toISOString(),\n        状態: '送信済み'\n      };\n\n      // 緊急報告を保存（異常値検出ログテーブルを使用）\n      const saved = await window.aivicApi.save(4, {\n        検出対象テーブル: '緊急報告',\n        検出対象レコードID: crypto.randomUUID(),\n        ユーザーID: currentUser?.ユーザーID || crypto.randomUUID(),\n        異常値種別: formData.報告種別,\n        検出項目: '緊急報告',\n        検出値: formData.緊急事態内容,\n        閾値: formData.緊急度,\n        重要度: formData.緊急度,\n        確認状況: '未確認',\n        通知送信フラグ: true,\n        検出日時: formData.報告日時,\n        作成日時: formData.報告日時,\n        更新日時: formData.報告日時\n      });\n\n      if (saved) {\n        // 成功メッセージを表示\n        form.style.display = 'none';\n        successMessage.style.display = 'block';\n        completeBtn.style.display = 'inline-block';\n        \n        // 下書きデータをクリア\n        localStorage.removeItem('emergency_report_draft');\n      }\n    } catch (error) {\n      alert('報告の送信に失敗しました。もう一度お試しください。');\n      console.error('送信エラー:', error);\n    }\n  });\n\n  // 下書き保存\n  draftBtn.addEventListener('click', () => {\n    const draftData = {\n      urgency: container.querySelector('input[name=\"urgency\"]:checked')?.value || '',\n      reportType: container.querySelector('#report-type').value,\n      datetime: container.querySelector('#occurrence-datetime').value,\n      location: container.querySelector('#occurrence-location').value,\n      workItem: container.querySelector('#work-item').value,\n      content: container.querySelector('#emergency-content').value,\n      phone: container.querySelector('#contact-phone').value,\n      savedAt: new Date().toISOString()\n    };\n    \n    localStorage.setItem('emergency_report_draft', JSON.stringify(draftData));\n    alert('下書きを保存しました');\n  });\n\n  // 報告完了ボタン\n  completeBtn.addEventListener('click', () => {\n    window.showScreen(\"scr-1778907133295\");\n  });\n\n  // 下書きデータの復元\n  function loadDraft() {\n    const draft = localStorage.getItem('emergency_report_draft');\n    if (draft) {\n      try {\n        const data = JSON.parse(draft);\n        if (data.urgency) {\n          container.querySelector(`input[name=\"urgency\"][value=\"${data.urgency}\"]`).checked = true;\n        }\n        container.querySelector('#report-type').value = data.reportType || '';\n        container.querySelector('#occurrence-datetime').value = data.datetime || '';\n        container.querySelector('#occurrence-location').value = data.location || '';\n        container.querySelector('#work-item').value = data.workItem || '';\n        container.querySelector('#emergency-content').value = data.content || '';\n        container.querySelector('#contact-phone').value = data.phone || '';\n        \n        // 文字数カウンターを更新\n        const length = data.content?.length || 0;\n        charCount.textContent = `${length}/1000`;\n      } catch (error) {\n        console.error('下書きの復元に失敗:', error);\n      }\n    }\n  }\n\n  // 初期化処理\n  async function init() {\n    await loadCurrentUser();\n    await loadWorkItems();\n    loadDraft();\n    \n    // 現在日時を設定\n    const now = new Date();\n    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());\n    container.querySelector('#occurrence-datetime').value = now.toISOString().slice(0, 16);\n  }\n\n  init();\n}";
</script>

      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
