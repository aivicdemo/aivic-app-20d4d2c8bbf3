<html lang="ja">

    <style>
        :root {
            --primary: #4a9eff;
            --primary-hover: #3a8eef;
            --bg-main: #0f0f0f;
            --bg-card: #1a1a1a;
            --bg-sidebar: #141414;
            --border: #2a2a2a;
            --text: #e8e8e8;
            --text-muted: #9a9a9a;
            --top-bar-bg: #161616;
            --top-bar-border: #252525;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            height: 52px;
        }

        .logo {
            width: 24px;
            height: 24px;
            background: var(--primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: white;
        }

        .app-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-section {
            padding: 16px 12px 8px;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            padding: 0 8px;
        }

        .nav-item {
            display: block;
            padding: 8px 12px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 400;
            margin-bottom: 2px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        .nav-item.aivic-active {
            background: var(--primary);
            color: white;
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .breadcrumb-current {
            color: var(--text);
            font-weight: 500;
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .logout-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: color 0.15s ease;
        }

        .logout-link:hover {
            color: var(--text);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quick-action-btn {
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .quick-action-btn:hover {
            border-color: var(--primary);
            background: rgba(74, 158, 255, 0.1);
        }

        .quick-action-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .quick-action-btn.primary:hover {
            background: var(--primary-hover);
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-height: 400px;
            padding: 0;
        }

        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .nav-emergency {
            margin-top: auto;
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        .emergency-btn {
            width: 100%;
            padding: 10px 12px;
            background: var(--error);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        .emergency-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
            
            .quick-actions {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let selectedUrgency = '';\n  let uploadedPhotos = [];\n  const maxPhotos = 5;\n  const maxFileSize = 5 * 1024 * 1024; // 5MB\n  const maxContentLength = 1000;\n\n  // 現在のユーザー情報を設定（仮データ）\n  const currentUser = { name: '田中太郎', id: 'user001' };\n  container.querySelector('#reporter-name').value = currentUser.name;\n\n  // 作業項目マスタを読み込み\n  async function loadWorkItems() {\n    const workItemsTable = tables.find(t => t.tableName === '作業項目マスタ');\n    if (workItemsTable) {\n      const workItemSelect = container.querySelector('#work-item');\n      workItemsTable.records.forEach(item => {\n        const option = document.createElement('option');\n        option.value = item.作業項目ID;\n        option.textContent = `${item.作業項目コード} - ${item.作業項目名}`;\n        workItemSelect.appendChild(option);\n      });\n    }\n  }\n\n  // 緊急度ボタンの処理\n  function setupUrgencyButtons() {\n    const urgencyButtons = container.querySelectorAll('.urgency-btn');\n    urgencyButtons.forEach(btn => {\n      btn.addEventListener('click', () => {\n        urgencyButtons.forEach(b => {\n          b.style.background = 'transparent';\n          b.style.color = 'var(--text)';\n        });\n        btn.style.background = 'var(--primary)';\n        btn.style.color = '#fff';\n        selectedUrgency = btn.dataset.value;\n      });\n    });\n  }\n\n  // 文字数カウンター\n  function setupContentCounter() {\n    const textarea = container.querySelector('#emergency-content');\n    const counter = container.querySelector('#content-counter');\n    \n    textarea.addEventListener('input', () => {\n      const length = textarea.value.length;\n      counter.textContent = length;\n      if (length > maxContentLength) {\n        counter.style.color = '#fca5a5';\n        textarea.style.borderColor = 'rgba(220, 38, 38, 0.5)';\n      } else {\n        counter.style.color = 'var(--text-muted)';\n        textarea.style.borderColor = 'rgba(255,255,255,0.18)';\n      }\n    });\n  }\n\n  // 写真アップロード処理\n  function setupPhotoUpload() {\n    const uploadArea = container.querySelector('#photo-upload-area');\n    const photoInput = container.querySelector('#photo-input');\n    const photoPreview = container.querySelector('#photo-preview');\n\n    uploadArea.addEventListener('click', () => photoInput.click());\n\n    uploadArea.addEventListener('dragover', (e) => {\n      e.preventDefault();\n      uploadArea.style.borderColor = 'var(--primary)';\n      uploadArea.style.background = 'rgba(0,0,0,0.2)';\n    });\n\n    uploadArea.addEventListener('dragleave', () => {\n      uploadArea.style.borderColor = 'rgba(255,255,255,0.18)';\n      uploadArea.style.background = 'rgba(0,0,0,0.1)';\n    });\n\n    uploadArea.addEventListener('drop', (e) => {\n      e.preventDefault();\n      uploadArea.style.borderColor = 'rgba(255,255,255,0.18)';\n      uploadArea.style.background = 'rgba(0,0,0,0.1)';\n      handleFiles(e.dataTransfer.files);\n    });\n\n    photoInput.addEventListener('change', (e) => {\n      handleFiles(e.target.files);\n    });\n\n    function handleFiles(files) {\n      Array.from(files).forEach(file => {\n        if (uploadedPhotos.length >= maxPhotos) {\n          showError(['写真は最大5枚までアップロードできます。']);\n          return;\n        }\n\n        if (!file.type.startsWith('image/')) {\n          showError(['サポートされていないファイル形式です。JPG、PNG形式のファイルをアップロードしてください。']);\n          return;\n        }\n\n        if (file.size > maxFileSize) {\n          showError(['ファイルサイズが上限を超えています。5MB以下のファイルをアップロードしてください。']);\n          return;\n        }\n\n        const reader = new FileReader();\n        reader.onload = (e) => {\n          const photoData = {\n            id: Date.now() + Math.random(),\n            file: file,\n            dataUrl: e.target.result\n          };\n          uploadedPhotos.push(photoData);\n          renderPhotoPreview();\n        };\n        reader.readAsDataURL(file);\n      });\n    }\n\n    function renderPhotoPreview() {\n      photoPreview.innerHTML = uploadedPhotos.map(photo => `\n        <div style=\"position: relative; border-radius: 6px; overflow: hidden; background: rgba(0,0,0,0.2);\">\n          <img src=\"${photo.dataUrl}\" style=\"width: 100%; height: 80px; object-fit: cover;\">\n          <button class=\"remove-photo-btn\" data-id=\"${photo.id}\" style=\"position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border: none; border-radius: 50%; background: rgba(220, 38, 38, 0.8); color: #fff; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;\">×</button>\n        </div>\n      `).join('');\n    }\n\n    photoPreview.addEventListener('click', (e) => {\n      const removeBtn = e.target.closest('.remove-photo-btn');\n      if (removeBtn) {\n        const photoId = parseFloat(removeBtn.dataset.id);\n        uploadedPhotos = uploadedPhotos.filter(p => p.id !== photoId);\n        renderPhotoPreview();\n      }\n    });\n  }\n\n  // バリデーション\n  function validateForm() {\n    const errors = [];\n    \n    if (!selectedUrgency) {\n      errors.push('緊急度を選択してください。');\n    }\n    \n    if (!container.querySelector('#report-type').value) {\n      errors.push('報告種別を選択してください。');\n    }\n    \n    if (!container.querySelector('#occurrence-datetime').value) {\n      errors.push('発生日時を入力してください。');\n    } else {\n      const occurrenceDate = new Date(container.querySelector('#occurrence-datetime').value);\n      const now = new Date();\n      if (occurrenceDate > now) {\n        errors.push('発生日時に未来の日付は入力できません。');\n      }\n    }\n    \n    if (!container.querySelector('#occurrence-location').value.trim()) {\n      errors.push('発生場所を入力してください。');\n    }\n    \n    const content = container.querySelector('#emergency-content').value.trim();\n    if (!content) {\n      errors.push('緊急事態内容を入力してください。');\n    } else if (content.length > maxContentLength) {\n      errors.push('緊急事態内容は1000文字以内で入力してください。');\n    }\n    \n    if (!container.querySelector('#contact-phone').value.trim()) {\n      errors.push('連絡先電話番号を入力してください。');\n    } else {\n      const phone = container.querySelector('#contact-phone').value.trim();\n      const phonePattern = /^(\\d{2,4}-\\d{2,4}-\\d{4}|\\d{10,11})$/;\n      if (!phonePattern.test(phone)) {\n        errors.push('正しい電話番号の形式で入力してください。');\n      }\n    }\n\n    return errors;\n  }\n\n  // エラー表示\n  function showError(errors) {\n    const errorDiv = container.querySelector('#error-messages');\n    const errorList = container.querySelector('#error-list');\n    \n    if (errors.length > 0) {\n      errorList.innerHTML = errors.map(error => `• ${error}`).join('<br>');\n      errorDiv.classList.remove('hidden');\n      errorDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });\n    } else {\n      errorDiv.classList.add('hidden');\n    }\n  }\n\n  // 成功メッセージ表示\n  function showSuccess() {\n    container.querySelector('#success-message').classList.remove('hidden');\n    container.querySelector('#success-message').scrollIntoView({ behavior: 'smooth' });\n  }\n\n  // フォームリセット\n  function resetForm() {\n    selectedUrgency = '';\n    uploadedPhotos = [];\n    container.querySelectorAll('.urgency-btn').forEach(btn => {\n      btn.style.background = 'transparent';\n      btn.style.color = 'var(--text)';\n    });\n    container.querySelector('#report-type').value = '';\n    container.querySelector('#occurrence-datetime').value = '';\n    container.querySelector('#occurrence-location').value = '';\n    container.querySelector('#work-item').value = '';\n    container.querySelector('#emergency-content').value = '';\n    container.querySelector('#contact-phone').value = '';\n    container.querySelector('#content-counter').textContent = '0';\n    container.querySelector('#photo-preview').innerHTML = '';\n    showError([]);\n  }\n\n  // 緊急報告送信\n  async function submitReport(isDraft = false) {\n    if (!isDraft) {\n      const errors = validateForm();\n      if (errors.length > 0) {\n        showError(errors);\n        return;\n      }\n    }\n\n    const reportData = {\n      緊急度: selectedUrgency,\n      報告種別: container.querySelector('#report-type').value,\n      発生日時: container.querySelector('#occurrence-datetime').value,\n      発生場所: container.querySelector('#occurrence-location').value,\n      作業項目ID: container.querySelector('#work-item').value,\n      緊急事態内容: container.querySelector('#emergency-content').value,\n      報告者名: container.querySelector('#reporter-name').value,\n      連絡先電話番号: container.querySelector('#contact-phone').value,\n      添付写真数: uploadedPhotos.length,\n      下書きフラグ: isDraft,\n      報告日時: new Date().toISOString(),\n      報告者ID: currentUser.id\n    };\n\n    // 緊急報告テーブルに保存（テーブルインデックス0と仮定）\n    const saved = await window.aivicApi.save(0, reportData);\n    \n    if (saved) {\n      if (isDraft) {\n        alert('下書きが保存されました。');\n      } else {\n        showSuccess();\n        resetForm();\n      }\n    }\n  }\n\n  // イベントリスナー設定\n  container.querySelector('#btn-submit').addEventListener('click', () => submitReport(false));\n  container.querySelector('#btn-draft-save').addEventListener('click', () => submitReport(true));\n  \n  container.querySelector('#btn-back-to-work').addEventListener('click', () => {\n    window.showScreen(\"scr-1778907133295\");\n  });\n\n  // 初期化\n  loadWorkItems();\n  setupUrgencyButtons();\n  setupContentCounter();\n  setupPhotoUpload();\n}";

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
