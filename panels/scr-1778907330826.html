<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工数記録システム</title>
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-hover: #0284c7;
            --primary-light: #e0f2fe;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-sidebar: #f1f5f9;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --text: #1e293b;
            --text-muted: #475569;
            --text-light: #64748b;
            --top-bar-bg: #ffffff;
            --top-bar-border: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: "⏱";
            font-size: 18px;
        }

        .nav-section {
            padding: 16px 0 8px 0;
        }

        .nav-section-title {
            padding: 0 16px 8px 16px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: block;
            padding: 8px 16px;
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: var(--bg-card);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: var(--primary-light);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 500;
        }

        .nav-item.nav-emergency {
            color: var(--danger);
            font-weight: 500;
        }

        .nav-item.nav-emergency:hover {
            background: #fef2f2;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .logout-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.15s ease;
        }

        .logout-link:hover {
            background: var(--border-light);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quick-action-btn {
            padding: 10px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quick-action-btn:hover {
            background: var(--primary-hover);
        }

        .quick-action-btn.secondary {
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .quick-action-btn.secondary:hover {
            background: var(--border-light);
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-height: 400px;
        }

        .nav-group {
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 4px;
            padding-bottom: 4px;
        }

        .nav-group:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
            
            .quick-actions {
                flex-wrap: wrap;
            }
        }

        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
            font-size: 12px;
        }
    </style>

ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let selectedFiles = [];\n  let currentDraftId = null;\n\n  // 現在のユーザー情報を取得して報告者名に設定\n  const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');\n  const reporterNameInput = container.querySelector('#reporter-name');\n  if (currentUser.氏名) {\n    reporterNameInput.value = currentUser.氏名;\n  }\n\n  // 作業項目マスタを読み込み\n  async function loadWorkItems() {\n    const workItemSelect = container.querySelector('#work-item');\n    try {\n      const workItems = await window.aivicApi.list(3); // 作業項目マスタのテーブルインデックス\n      if (workItems) {\n        workItems.forEach(item => {\n          if (item.有効フラグ) {\n            const option = document.createElement('option');\n            option.value = item.作業項目ID;\n            option.textContent = item.作業項目名;\n            workItemSelect.appendChild(option);\n          }\n        });\n      }\n    } catch (error) {\n      console.error('作業項目の読み込みに失敗しました:', error);\n    }\n  }\n\n  // 発生日時のデフォルト値を現在時刻に設定\n  const occurrenceDatetime = container.querySelector('#occurrence-datetime');\n  const now = new Date();\n  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());\n  occurrenceDatetime.value = now.toISOString().slice(0, 16);\n\n  // 文字数カウンター\n  const emergencyContent = container.querySelector('#emergency-content');\n  const contentCounter = container.querySelector('#content-counter');\n  \n  emergencyContent.addEventListener('input', function() {\n    const length = this.value.length;\n    contentCounter.textContent = `(${length}/1000)`;\n    if (length > 1000) {\n      contentCounter.style.color = '#ff4444';\n    } else {\n      contentCounter.style.color = 'var(--text-muted)';\n    }\n  });\n\n  // 写真添付機能\n  const photoInput = container.querySelector('#photo-input');\n  const photoButton = container.querySelector('#photo-button');\n  const photoCount = container.querySelector('#photo-count');\n  const photoPreview = container.querySelector('#photo-preview');\n  const photoError = container.querySelector('#photo-error');\n\n  photoButton.addEventListener('click', () => {\n    photoInput.click();\n  });\n\n  photoInput.addEventListener('change', function(e) {\n    const files = Array.from(e.target.files);\n    \n    // ファイル数チェック\n    if (selectedFiles.length + files.length > 5) {\n      showError('photo-error', '写真は最大5枚まで添付できます');\n      return;\n    }\n\n    files.forEach(file => {\n      // ファイル形式チェック\n      if (!file.type.startsWith('image/')) {\n        showError('photo-error', 'サポートされていないファイル形式です。画像ファイルを選択してください');\n        return;\n      }\n\n      // ファイルサイズチェック (5MB)\n      if (file.size > 5 * 1024 * 1024) {\n        showError('photo-error', 'ファイルサイズは5MB以下にしてください');\n        return;\n      }\n\n      selectedFiles.push(file);\n      \n      // プレビュー表示\n      const reader = new FileReader();\n      reader.onload = function(e) {\n        const previewItem = document.createElement('div');\n        previewItem.style.cssText = 'position: relative; border-radius: 4px; overflow: hidden;';\n        previewItem.innerHTML = `\n          <img src=\"${e.target.result}\" style=\"width: 80px; height: 80px; object-fit: cover; display: block;\">\n          <button type=\"button\" class=\"remove-photo\" data-index=\"${selectedFiles.length - 1}\" style=\"position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; background: rgba(0,0,0,0.7); color: #fff; border: none; border-radius: 50%; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;\">×</button>\n        `;\n        photoPreview.appendChild(previewItem);\n      };\n      reader.readAsDataURL(file);\n    });\n\n    updatePhotoCount();\n    hideError('photo-error');\n  });\n\n  // 写真削除\n  photoPreview.addEventListener('click', function(e) {\n    if (e.target.classList.contains('remove-photo')) {\n      const index = parseInt(e.target.dataset.index);\n      selectedFiles.splice(index, 1);\n      e.target.closest('div').remove();\n      updatePhotoCount();\n      \n      // インデックスを再設定\n      const removeButtons = photoPreview.querySelectorAll('.remove-photo');\n      removeButtons.forEach((btn, i) => {\n        btn.dataset.index = i;\n      });\n    }\n  });\n\n  function updatePhotoCount() {\n    photoCount.textContent = `${selectedFiles.length}枚選択中 (最大5枚)`;\n  }\n\n  // バリデーション関数\n  function validateForm() {\n    let isValid = true;\n\n    // 緊急度チェック\n    const urgency = container.querySelector('input[name=\"urgency\"]:checked');\n    if (!urgency) {\n      showError('urgency-error', '緊急度を選択してください');\n      isValid = false;\n    } else {\n      hideError('urgency-error');\n    }\n\n    // 報告種別チェック\n    const reportType = container.querySelector('#report-type').value;\n    if (!reportType) {\n      showError('report-type-error', '報告種別を選択してください');\n      isValid = false;\n    } else {\n      hideError('report-type-error');\n    }\n\n    // 発生日時チェック\n    const occurrenceDateTime = container.querySelector('#occurrence-datetime').value;\n    if (!occurrenceDateTime) {\n      showError('occurrence-datetime-error', '発生日時を入力してください');\n      isValid = false;\n    } else {\n      const selectedDate = new Date(occurrenceDateTime);\n      const now = new Date();\n      if (selectedDate > now) {\n        showError('occurrence-datetime-error', '発生日時に未来の日付は入力できません');\n        isValid = false;\n      } else {\n        hideError('occurrence-datetime');\n      }\n    }\n\n    // 発生場所チェック\n    const location = container.querySelector('#occurrence-location').value.trim();\n    if (!location) {\n      showError('occurrence-location-error', '発生場所を入力してください');\n      isValid = false;\n    } else {\n      hideError('occurrence-location-error');\n    }\n\n    // 緊急事態内容チェック\n    const content = container.querySelector('#emergency-content').value.trim();\n    if (!content) {\n      showError('emergency-content-error', '緊急事態内容を入力してください');\n      isValid = false;\n    } else if (content.length > 1000) {\n      showError('emergency-content-error', '緊急事態内容は1000文字以内で入力してください');\n      isValid = false;\n    } else {\n      hideError('emergency-content-error');\n    }\n\n    // 連絡先電話番号チェック\n    const phone = container.querySelector('#contact-phone').value.trim();\n    if (!phone) {\n      showError('contact-phone-error', '連絡先電話番号を入力してください');\n      isValid = false;\n    } else {\n      const phonePattern = /^(\\d{2,4}-\\d{2,4}-\\d{4}|\\d{10,11})$/;\n      if (!phonePattern.test(phone)) {\n        showError('contact-phone-error', '正しい電話番号の形式で入力してください');\n        isValid = false;\n      } else {\n        hideError('contact-phone-error');\n      }\n    }\n\n    return isValid;\n  }\n\n  function showError(elementId, message) {\n    const errorElement = container.querySelector(`#${elementId}`);\n    if (errorElement) {\n      errorElement.textContent = message;\n      errorElement.style.display = 'block';\n    }\n  }\n\n  function hideError(elementId) {\n    const errorElement = container.querySelector(`#${elementId}`);\n    if (errorElement) {\n      errorElement.style.display = 'none';\n    }\n  }\n\n  // フォームデータ収集\n  function collectFormData() {\n    const urgency = container.querySelector('input[name=\"urgency\"]:checked');\n    return {\n      緊急度: urgency ? urgency.value : '',\n      報告種別: container.querySelector('#report-type').value,\n      発生日時: container.querySelector('#occurrence-datetime').value,\n      発生場所: container.querySelector('#occurrence-location').value.trim(),\n      作業項目ID: container.querySelector('#work-item').value,\n      緊急事態内容: container.querySelector('#emergency-content').value.trim(),\n      報告者名: container.querySelector('#reporter-name').value,\n      連絡先電話番号: container.querySelector('#contact-phone').value.trim(),\n      添付写真数: selectedFiles.length,\n      報告日時: new Date().toISOString(),\n      報告者ID: currentUser.ユーザーID || null,\n      状態: '報告済み'\n    };\n  }\n\n  // 下書き保存\n  container.querySelector('#draft-save-btn').addEventListener('click', async function() {\n    const formData = collectFormData();\n    formData.状態 = '下書き';\n\n    try {\n      let result;\n      if (currentDraftId) {\n        result = await window.aivicApi.update(4, currentDraftId, formData); // 異常値検出ログテーブルを緊急報告用に使用\n      } else {\n        result = await window.aivicApi.save(4, formData);\n        if (result) {\n          currentDraftId = result.id;\n        }\n      }\n\n      if (result) {\n        showSuccessMessage('下書きを保存しました');\n      }\n    } catch (error) {\n      console.error('下書き保存エラー:', error);\n      showError('photo-error', '下書きの保存に失敗しました');\n    }\n  });\n\n  // 緊急報告送信\n  container.querySelector('#submit-btn').addEventListener('click', async function() {\n    if (!validateForm()) {\n      return;\n    }\n\n    const formData = collectFormData();\n\n    try {\n      const result = await window.aivicApi.save(4, formData); // 異常値検出ログテーブルを緊急報告用に使用\n      \n      if (result) {\n        showSuccessMessage('緊急報告を送信しました。関係者に通知されます。');\n        \n        // フォームを無効化\n        const form = container.querySelector('#emergency-form');\n        const inputs = form.querySelectorAll('input, select, textarea');\n        inputs.forEach(input => input.disabled = true);\n        \n        // ボタンを切り替え\n        container.querySelector('#submit-btn').style.display = 'none';\n        container.querySelector('#draft-save-btn').style.display = 'none';\n        container.querySelector('#complete-btn').style.display = 'inline-block';\n      }\n    } catch (error) {\n      console.error('緊急報告送信エラー:', error);\n      showError('photo-error', '緊急報告の送信に失敗しました');\n    }\n  });\n\n  // 報告完了ボタン\n  container.querySelector('#complete-btn').addEventListener('click', function() {\n    window.showScreen(\"scr-1778907133295\"); // 工数記録画面\n  });\n\n  function showSuccessMessage(message) {\n    const successElement = container.querySelector('#success-message');\n    successElement.textContent = message;\n    successElement.style.display = 'block';\n    \n    setTimeout(() => {\n      successElement.style.display = 'none';\n    }, 5000);\n  }\n\n  // 初期化処理\n  loadWorkItems();\n\n  // 下書きデータの復元（ページ読み込み時）\n  async function loadDraft() {\n    try {\n      const drafts = await window.aivicApi.list(4);\n      if (drafts) {\n        const userDraft = drafts.find(d => d.状態 === '下書き' && d.報告者ID === currentUser.ユーザーID);\n        if (userDraft) {\n          currentDraftId = userDraft.id;\n          \n          // フォームに値を復元\n          if (userDraft.緊急度) {\n            const urgencyRadio = container.querySelector(`input[name=\"urgency\"][value=\"${userDraft.緊急度}\"]`);\n            if (urgencyRadio) urgencyRadio.checked = true;\n          }\n          if (userDraft.報告種別) {\n            container.querySelector('#report-type').value = userDraft.報告種別;\n          }\n          if (userDraft.発生日時) {\n            container.querySelector('#occurrence-datetime').value = userDraft.発生日時;\n          }\n          if (userDraft.発生場所) {\n            container.querySelector('#occurrence-location').value = userDraft.発生場所;\n          }\n          if (userDraft.作業項目ID) {\n            container.querySelector('#work-item').value = userDraft.作業項目ID;\n          }\n          if (userDraft.緊急事態内容) {\n            container.querySelector('#emergency-content').value = userDraft.緊急事態内容;\n            emergencyContent.dispatchEvent(new Event('input')); // 文字数カウンター更新\n          }\n          if (userDraft.連絡先電話番号) {\n            container.querySelector('#contact-phone').value = userDraft.連絡先電話番号;\n          }\n        }\n      }\n    } catch (error) {\n      console.error('下書きデータの読み込みエラー:', error);\n    }\n  }\n\n  loadDraft();\n}";
</script>

    <script>
        const screenTitles = {
            'scr-1778907133295': '工数記録',
            'scr-1778907145716': '作業履歴一覧',
            'scr-1778907170814': '異常値検出ログ',
            'scr-1778907187615': '工数記録開始',
            'scr-1778907199709': '工数記録終了',
            'scr-1778907212862': 'データ自動保存処理',
            'scr-1778907226171': '記録確認',

            'scr-1778907251446': '作業再開記録',
            'scr-1778907263518': '入力チェック機能',
            'scr-1778907278416': 'エラー表示',
            'scr-1778907287126': 'データ検証処理',
            'scr-1778907296658': '工数入力',
            'scr-1778907309324': '異常値検出処理',
            'scr-1778907319067': '修正入力',
            'scr-1778907330826': '緊急報告',
            'scr-1778907343735': '工数修正',
            'scr-1778907353387': '工数記録データ抽出',
            'scr-1778907367889': '工数記録確認',

        window.addEventListener('aivic:screen-changed', function(e) {
            const titleElement = document.getElementById('current-screen-title');
            if (titleElement && screenTitles[e.detail.screenId]) {
                titleElement.textContent = screenTitles[e.detail.screenId];
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            if (typeof showScreen === 'function') {
                showScreen('scr-1778907133295');

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
