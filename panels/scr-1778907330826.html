<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工数記録システム</title>
    <style>
        :root {
            --primary: #cc1f1f;
            --primary-hover: #a61a1a;
            --bg-main: #0d0d0d;
            --bg-card: #1a1010;
            --bg-sidebar: #151111;
            --border: #331a1a;
            --text: #e6e6e6;
            --text-muted: #999999;
            --top-bar-bg: #1f1515;
            --top-bar-border: #2d1a1a;
            --warning: #ff6b35;
            --error: #ff3333;
            --success: #28a745;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: "⚠";
            font-size: 18px;
        }

        .nav-section {
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }

        .nav-section:last-child {
            border-bottom: none;
            flex: 1;
        }

        .nav-title {
            padding: 0 16px 8px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: block;
            padding: 8px 16px;
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: rgba(204, 31, 31, 0.1);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: rgba(204, 31, 31, 0.15);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            margin-left: 220px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
        }

        .current-time {
            font-size: 12px;
            font-weight: 500;
            color: var(--primary);
            font-family: 'Courier New', monospace;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text);
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .user-menu:hover {
            background: var(--bg-sidebar);
            border-color: var(--primary);
        }

        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            min-height: calc(100vh - 132px);
        }

        .emergency-banner {
            background: linear-gradient(135deg, var(--error), var(--warning));
            color: white;
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            animation: flash 3s infinite;
        }

        @keyframes flash {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.7; }
        }

        .quick-actions {
            padding: 12px 16px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }

        .quick-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            margin-right: 8px;
            transition: all 0.15s ease;
        }

        .quick-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .quick-btn.secondary {
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
        }

        .quick-btn.secondary:hover {
            background: var(--border);
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .content-area {
                padding: 12px;
            }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(13, 13, 13, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let selectedUrgency = '';\n  let attachedFiles = [];\n  let currentUser = null;\n\n  // 現在のユーザー情報を取得\n  async function loadCurrentUser() {\n    try {\n      const users = await window.aivicApi.list(0); // ユーザーテーブル\n      if (users && users.length > 0) {\n        currentUser = users[0]; // 最初のユーザーを現在のユーザーとして使用\n        container.querySelector('#reporter-name').value = currentUser.氏名 || '';\n      }\n    } catch (error) {\n      console.error('ユーザー情報の取得に失敗:', error);\n    }\n  }\n\n  // 作業項目を読み込み\n  async function loadWorkItems() {\n    try {\n      const workItems = await window.aivicApi.list(3); // 作業項目マスタ\n      const select = container.querySelector('#work-item');\n      if (workItems) {\n        workItems.forEach(item => {\n          if (item.有効フラグ) {\n            const option = document.createElement('option');\n            option.value = item.作業項目ID;\n            option.textContent = item.作業項目名;\n            select.appendChild(option);\n          }\n        });\n      }\n    } catch (error) {\n      console.error('作業項目の取得に失敗:', error);\n    }\n  }\n\n  // 緊急度ボタンの処理\n  container.querySelectorAll('.urgency-btn').forEach(btn => {\n    btn.addEventListener('click', () => {\n      container.querySelectorAll('.urgency-btn').forEach(b => {\n        b.style.background = 'transparent';\n        b.style.color = 'var(--text)';\n      });\n      btn.style.background = 'var(--primary)';\n      btn.style.color = '#fff';\n      selectedUrgency = btn.dataset.value;\n      container.querySelector('#urgency-value').value = selectedUrgency;\n    });\n  });\n\n  // 文字数カウンター\n  const contentTextarea = container.querySelector('#emergency-content');\n  const charCount = container.querySelector('#char-count');\n  contentTextarea.addEventListener('input', () => {\n    const count = contentTextarea.value.length;\n    charCount.textContent = `(${count}/1000)`;\n    if (count > 1000) {\n      charCount.style.color = '#ef4444';\n    } else {\n      charCount.style.color = 'var(--text-muted)';\n    }\n  });\n\n  // 写真添付処理\n  const photoInput = container.querySelector('#photo-input');\n  const photoBtn = container.querySelector('#photo-btn');\n  const photoDropZone = container.querySelector('#photo-drop-zone');\n  const photoPreview = container.querySelector('#photo-preview');\n\n  photoBtn.addEventListener('click', () => {\n    photoInput.click();\n  });\n\n  photoInput.addEventListener('change', handleFiles);\n\n  // ドラッグ&ドロップ\n  photoDropZone.addEventListener('dragover', (e) => {\n    e.preventDefault();\n    photoDropZone.style.borderColor = 'var(--primary)';\n  });\n\n  photoDropZone.addEventListener('dragleave', () => {\n    photoDropZone.style.borderColor = 'rgba(255,255,255,0.18)';\n  });\n\n  photoDropZone.addEventListener('drop', (e) => {\n    e.preventDefault();\n    photoDropZone.style.borderColor = 'rgba(255,255,255,0.18)';\n    handleFiles({ target: { files: e.dataTransfer.files } });\n  });\n\n  function handleFiles(event) {\n    const files = Array.from(event.target.files);\n    \n    for (const file of files) {\n      // ファイル形式チェック\n      if (!file.type.startsWith('image/')) {\n        showError('サポートされていないファイル形式です。画像ファイルを選択してください。');\n        continue;\n      }\n      \n      // ファイルサイズチェック (10MB)\n      if (file.size > 10 * 1024 * 1024) {\n        showError('ファイルサイズが上限を超えています。10MB以下のファイルを選択してください。');\n        continue;\n      }\n      \n      // 枚数制限チェック\n      if (attachedFiles.length >= 5) {\n        showError('添付できる画像は最大5枚までです。');\n        break;\n      }\n      \n      attachedFiles.push(file);\n      \n      // プレビュー表示\n      const reader = new FileReader();\n      reader.onload = (e) => {\n        const preview = document.createElement('div');\n        preview.style.cssText = 'position: relative; display: inline-block;';\n        preview.innerHTML = `\n          <img src=\"${e.target.result}\" style=\"width: 80px; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid rgba(255,255,255,0.18);\" />\n          <button type=\"button\" class=\"remove-photo\" data-index=\"${attachedFiles.length - 1}\" style=\"position: absolute; top: -4px; right: -4px; width: 20px; height: 20px; border-radius: 50%; background: #ef4444; color: #fff; border: none; font-size: 12px; cursor: pointer;\">×</button>\n        `;\n        photoPreview.appendChild(preview);\n      };\n      reader.readAsDataURL(file);\n    }\n  }\n\n  // 写真削除\n  photoPreview.addEventListener('click', (e) => {\n    if (e.target.classList.contains('remove-photo')) {\n      const index = parseInt(e.target.dataset.index);\n      attachedFiles.splice(index, 1);\n      e.target.closest('div').remove();\n      \n      // インデックスを再設定\n      photoPreview.querySelectorAll('.remove-photo').forEach((btn, i) => {\n        btn.dataset.index = i;\n      });\n    }\n  });\n\n  // エラーメッセージ表示\n  function showError(message) {\n    const errorDiv = container.querySelector('#error-message');\n    errorDiv.textContent = message;\n    errorDiv.style.display = 'block';\n    setTimeout(() => {\n      errorDiv.style.display = 'none';\n    }, 5000);\n  }\n\n  // バリデーション\n  function validateForm() {\n    const reportType = container.querySelector('#report-type').value;\n    const occurrenceDateTime = container.querySelector('#occurrence-datetime').value;\n    const occurrenceLocation = container.querySelector('#occurrence-location').value;\n    const emergencyContent = container.querySelector('#emergency-content').value;\n    const contactPhone = container.querySelector('#contact-phone').value;\n\n    if (!selectedUrgency) {\n      showError('緊急度を選択してください。');\n      return false;\n    }\n\n    if (!reportType) {\n      showError('報告種別を選択してください。');\n      return false;\n    }\n\n    if (!occurrenceDateTime) {\n      showError('発生日時を入力してください。');\n      return false;\n    }\n\n    // 未来日付チェック\n    const occurrenceDate = new Date(occurrenceDateTime);\n    const now = new Date();\n    if (occurrenceDate > now) {\n      showError('発生日時に未来の日付は入力できません。');\n      return false;\n    }\n\n    if (!occurrenceLocation.trim()) {\n      showError('発生場所を入力してください。');\n      return false;\n    }\n\n    if (!emergencyContent.trim()) {\n      showError('緊急事態内容を入力してください。');\n      return false;\n    }\n\n    if (emergencyContent.length > 1000) {\n      showError('緊急事態内容は1000文字以内で入力してください。');\n      return false;\n    }\n\n    if (!contactPhone.trim()) {\n      showError('連絡先電話番号を入力してください。');\n      return false;\n    }\n\n    // 電話番号形式チェック\n    const phonePattern = /^(\\d{2,4}-\\d{2,4}-\\d{4}|\\d{10,11})$/;\n    if (!phonePattern.test(contactPhone.replace(/[^\\d-]/g, ''))) {\n      showError('正しい電話番号の形式で入力してください。');\n      return false;\n    }\n\n    return true;\n  }\n\n  // 下書き保存\n  container.querySelector('#draft-save-btn').addEventListener('click', async () => {\n    const formData = {\n      緊急度: selectedUrgency,\n      報告種別: container.querySelector('#report-type').value,\n      発生日時: container.querySelector('#occurrence-datetime').value,\n      発生場所: container.querySelector('#occurrence-location').value,\n      作業項目ID: container.querySelector('#work-item').value,\n      緊急事態内容: container.querySelector('#emergency-content').value,\n      報告者名: container.querySelector('#reporter-name').value,\n      連絡先電話番号: container.querySelector('#contact-phone').value,\n      状態: '下書き',\n      作成日時: new Date().toISOString(),\n      更新日時: new Date().toISOString()\n    };\n\n    try {\n      // 異常値検出ログテーブルに一時保存として記録\n      await window.aivicApi.save(4, {\n        検出対象テーブル: '緊急報告',\n        検出対象レコードID: 'draft-' + Date.now(),\n        ユーザーID: currentUser?.ユーザーID || 'unknown',\n        異常値種別: '下書き保存',\n        検出項目: '緊急報告内容',\n        検出値: JSON.stringify(formData),\n        閾値: '下書き',\n        重要度: '低',\n        確認状況: '未確認',\n        通知送信フラグ: false,\n        検出日時: new Date().toISOString(),\n        作成日時: new Date().toISOString(),\n        更新日時: new Date().toISOString()\n      });\n\n      alert('下書きが保存されました。');\n    } catch (error) {\n      showError('下書きの保存に失敗しました。');\n    }\n  });\n\n  // 緊急報告送信\n  container.querySelector('#submit-btn').addEventListener('click', async () => {\n    if (!validateForm()) return;\n\n    const formData = {\n      緊急度: selectedUrgency,\n      報告種別: container.querySelector('#report-type').value,\n      発生日時: container.querySelector('#occurrence-datetime').value,\n      発生場所: container.querySelector('#occurrence-location').value,\n      作業項目ID: container.querySelector('#work-item').value,\n      緊急事態内容: container.querySelector('#emergency-content').value,\n      報告者名: container.querySelector('#reporter-name').value,\n      連絡先電話番号: container.querySelector('#contact-phone').value,\n      添付ファイル数: attachedFiles.length,\n      状態: '送信済み',\n      作成日時: new Date().toISOString(),\n      更新日時: new Date().toISOString()\n    };\n\n    try {\n      // 異常値検出ログテーブルに緊急報告として記録\n      const saved = await window.aivicApi.save(4, {\n        検出対象テーブル: '緊急報告',\n        検出対象レコードID: 'emergency-' + Date.now(),\n        ユーザーID: currentUser?.ユーザーID || 'unknown',\n        異常値種別: '緊急報告',\n        検出項目: '緊急事態',\n        検出値: formData.緊急事態内容,\n        閾値: formData.緊急度,\n        重要度: formData.緊急度,\n        確認状況: '未確認',\n        通知送信フラグ: true,\n        検出日時: new Date().toISOString(),\n        作成日時: new Date().toISOString(),\n        更新日時: new Date().toISOString()\n      });\n\n      if (saved) {\n        alert('緊急報告が送信されました。関係者に通知が送られます。');\n        \n        // 送信完了後の表示切り替え\n        container.querySelector('#submit-btn').style.display = 'none';\n        container.querySelector('#draft-save-btn').style.display = 'none';\n        container.querySelector('#complete-btn').style.display = 'inline-block';\n        \n        // フォームを無効化\n        const form = container.querySelector('#emergency-form');\n        const inputs = form.querySelectorAll('input, select, textarea, button');\n        inputs.forEach(input => input.disabled = true);\n      } else {\n        showError('緊急報告の送信に失敗しました。');\n      }\n    } catch (error) {\n      showError('緊急報告の送信に失敗しました。');\n    }\n  });\n\n  // 報告完了ボタン\n  container.querySelector('#complete-btn').addEventListener('click', () => {\n    window.showScreen(\"scr-1778907133295\");\n  });\n\n  // 初期化\n  loadCurrentUser();\n  loadWorkItems();\n  \n  // 現在日時を設定\n  const now = new Date();\n  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());\n  container.querySelector('#occurrence-datetime').value = now.toISOString().slice(0, 16);\n}";

    <script>
        // リアルタイム時計
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ja-JP', { 
                hour12: false,

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
