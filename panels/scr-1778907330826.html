ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  // 現在のユーザー情報を取得（仮のデータ）\n  const currentUser = {\n    name: \"田中太郎\",\n    id: \"user-001\"\n  };\n\n  // 報告者名を自動設定\n  const reporterNameInput = container.querySelector(\"#reporter-name\");\n  reporterNameInput.value = currentUser.name;\n\n  // 作業項目マスタのロード\n  async function loadWorkItems() {\n    const workItemSelect = container.querySelector(\"#work-item\");\n    try {\n      const workItems = await window.aivicApi.list(3); // 作業項目マスタ\n      if (workItems) {\n        workItems.forEach(item => {\n          const option = document.createElement(\"option\");\n          option.value = item.作業項目ID;\n          option.textContent = item.作業項目名;\n          workItemSelect.appendChild(option);\n        });\n      }\n    } catch (error) {\n      console.error(\"作業項目の読み込みに失敗しました:\", error);\n    }\n  }\n\n  // 緊急度選択ボタンの処理\n  const urgencyButtons = container.querySelectorAll(\".urgency-btn\");\n  const selectedUrgencyInput = container.querySelector(\"#selected-urgency\");\n  \n  urgencyButtons.forEach(btn => {\n    btn.addEventListener(\"click\", () => {\n      // 全ボタンのスタイルをリセット\n      urgencyButtons.forEach(b => {\n        b.style.background = \"transparent\";\n        b.style.borderColor = \"rgba(255,255,255,0.18)\";\n        b.style.color = \"var(--text)\";\n      });\n      \n      // 選択されたボタンをハイライト\n      btn.style.background = \"var(--primary)\";\n      btn.style.borderColor = \"var(--primary)\";\n      btn.style.color = \"#fff\";\n      \n      selectedUrgencyInput.value = btn.dataset.urgency;\n    });\n  });\n\n  // 文字数カウンター\n  const emergencyContentTextarea = container.querySelector(\"#emergency-content\");\n  const contentCounter = container.querySelector(\"#content-counter\");\n  \n  emergencyContentTextarea.addEventListener(\"input\", () => {\n    const length = emergencyContentTextarea.value.length;\n    contentCounter.textContent = length;\n    \n    if (length > 1000) {\n      contentCounter.style.color = \"#dc2626\";\n      emergencyContentTextarea.style.borderColor = \"#dc2626\";\n    } else {\n      contentCounter.style.color = \"var(--text-muted)\";\n      emergencyContentTextarea.style.borderColor = \"rgba(255,255,255,0.18)\";\n    }\n  });\n\n  // 写真アップロード処理\n  const photoUploadArea = container.querySelector(\"#photo-upload-area\");\n  const photoInput = container.querySelector(\"#photo-input\");\n  const photoPreview = container.querySelector(\"#photo-preview\");\n  let uploadedFiles = [];\n\n  photoUploadArea.addEventListener(\"click\", () => {\n    photoInput.click();\n  });\n\n  photoUploadArea.addEventListener(\"dragover\", (e) => {\n    e.preventDefault();\n    photoUploadArea.style.borderColor = \"var(--primary)\";\n  });\n\n  photoUploadArea.addEventListener(\"dragleave\", () => {\n    photoUploadArea.style.borderColor = \"rgba(255,255,255,0.18)\";\n  });\n\n  photoUploadArea.addEventListener(\"drop\", (e) => {\n    e.preventDefault();\n    photoUploadArea.style.borderColor = \"rgba(255,255,255,0.18)\";\n    handleFiles(e.dataTransfer.files);\n  });\n\n  photoInput.addEventListener(\"change\", (e) => {\n    handleFiles(e.target.files);\n  });\n\n  function handleFiles(files) {\n    const maxFiles = 5;\n    const maxSize = 10 * 1024 * 1024; // 10MB\n    const allowedTypes = ['image/jpeg', 'image/png', 'image/gif'];\n\n    Array.from(files).forEach(file => {\n      if (uploadedFiles.length >= maxFiles) {\n        showError(`画像は最大${maxFiles}枚まで添付できます`);\n        return;\n      }\n\n      if (file.size > maxSize) {\n        showError(`ファイルサイズは10MB以下にしてください: ${file.name}`);\n        return;\n      }\n\n      if (!allowedTypes.includes(file.type)) {\n        showError(`サポートされていないファイル形式です: ${file.name}`);\n        return;\n      }\n\n      uploadedFiles.push(file);\n      displayPhotoPreview(file);\n    });\n  }\n\n  function displayPhotoPreview(file) {\n    const reader = new FileReader();\n    reader.onload = (e) => {\n      const previewItem = document.createElement(\"div\");\n      previewItem.style.cssText = \"position: relative; display: inline-block;\";\n      \n      previewItem.innerHTML = `\n        <img src=\"${e.target.result}\" style=\"width: 80px; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid rgba(255,255,255,0.18);\" />\n        <button type=\"button\" class=\"remove-photo\" data-filename=\"${file.name}\" style=\"position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: #dc2626; color: #fff; border: none; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;\">×</button>\n      `;\n      \n      photoPreview.appendChild(previewItem);\n    };\n    reader.readAsDataURL(file);\n  }\n\n  // 写真削除処理\n  photoPreview.addEventListener(\"click\", (e) => {\n    if (e.target.classList.contains(\"remove-photo\")) {\n      const filename = e.target.dataset.filename;\n      uploadedFiles = uploadedFiles.filter(f => f.name !== filename);\n      e.target.closest(\"div\").remove();\n    }\n  });\n\n  // バリデーション関数\n  function validateForm() {\n    const errors = [];\n    \n    const urgency = selectedUrgencyInput.value;\n    if (!urgency) {\n      errors.push(\"緊急度を選択してください\");\n    }\n    \n    const reportType = container.querySelector(\"#report-type\").value;\n    if (!reportType) {\n      errors.push(\"報告種別を選択してください\");\n    }\n    \n    const occurrenceDateTime = container.querySelector(\"#occurrence-datetime\").value;\n    if (!occurrenceDateTime) {\n      errors.push(\"発生日時を入力してください\");\n    } else {\n      const selectedDate = new Date(occurrenceDateTime);\n      const now = new Date();\n      if (selectedDate > now) {\n        errors.push(\"発生日時に未来の日付は入力できません\");\n      }\n    }\n    \n    const occurrenceLocation = container.querySelector(\"#occurrence-location\").value.trim();\n    if (!occurrenceLocation) {\n      errors.push(\"発生場所を入力してください\");\n    }\n    \n    const emergencyContent = emergencyContentTextarea.value.trim();\n    if (!emergencyContent) {\n      errors.push(\"緊急事態内容を入力してください\");\n    } else if (emergencyContent.length > 1000) {\n      errors.push(\"緊急事態内容は1000文字以内で入力してください\");\n    }\n    \n    const contactPhone = container.querySelector(\"#contact-phone\").value.trim();\n    if (!contactPhone) {\n      errors.push(\"連絡先電話番号を入力してください\");\n    } else {\n      const phonePattern = /^(\\d{2,4}-\\d{2,4}-\\d{4}|\\d{10,11})$/;\n      if (!phonePattern.test(contactPhone.replace(/[^\\d-]/g, ''))) {\n        errors.push(\"正しい電話番号の形式で入力してください\");\n      }\n    }\n    \n    return errors;\n  }\n\n  // エラー表示関数\n  function showError(message) {\n    const errorDiv = container.querySelector(\"#error-messages\");\n    const errorText = container.querySelector(\"#error-text\");\n    errorText.textContent = message;\n    errorDiv.classList.remove(\"hidden\");\n    \n    setTimeout(() => {\n      errorDiv.classList.add(\"hidden\");\n    }, 5000);\n  }\n\n  // 成功メッセージ表示関数\n  function showSuccess() {\n    const successDiv = container.querySelector(\"#success-message\");\n    successDiv.classList.remove(\"hidden\");\n    \n    setTimeout(() => {\n      successDiv.classList.add(\"hidden\");\n    }, 3000);\n  }\n\n  // フォーム送信処理\n  const form = container.querySelector(\"#emergency-form\");\n  form.addEventListener(\"submit\", async (e) => {\n    e.preventDefault();\n    \n    const errors = validateForm();\n    if (errors.length > 0) {\n      showError(errors.join(\"、\"));\n      return;\n    }\n    \n    const formData = {\n      緊急度: selectedUrgencyInput.value,\n      報告種別: container.querySelector(\"#report-type\").value,\n      発生日時: container.querySelector(\"#occurrence-datetime\").value,\n      発生場所: container.querySelector(\"#occurrence-location\").value,\n      作業項目ID: container.querySelector(\"#work-item\").value || null,\n      緊急事態内容: emergencyContentTextarea.value,\n      報告者ID: currentUser.id,\n      報告者名: reporterNameInput.value,\n      連絡先電話番号: container.querySelector(\"#contact-phone\").value,\n      添付ファイル数: uploadedFiles.length,\n      報告日時: new Date().toISOString(),\n      状態: \"送信済み\"\n    };\n    \n    try {\n      // 緊急報告データを保存（異常値検出ログテーブルを使用）\n      const saved = await window.aivicApi.save(4, {\n        検出対象テーブル: \"緊急報告\",\n        検出対象レコードID: crypto.randomUUID(),\n        ユーザーID: currentUser.id,\n        異常値種別: formData.報告種別,\n        検出項目: \"緊急報告\",\n        検出値: formData.緊急事態内容,\n        閾値: formData.緊急度,\n        重要度: formData.緊急度,\n        確認状況: \"未確認\",\n        通知送信フラグ: true,\n        検出日時: formData.報告日時,\n        作成日時: formData.報告日時,\n        更新日時: formData.報告日時\n      });\n      \n      if (saved) {\n        showSuccess();\n        // フォームをリセット\n        form.reset();\n        selectedUrgencyInput.value = \"\";\n        urgencyButtons.forEach(b => {\n          b.style.background = \"transparent\";\n          b.style.borderColor = \"rgba(255,255,255,0.18)\";\n          b.style.color = \"var(--text)\";\n        });\n        uploadedFiles = [];\n        photoPreview.innerHTML = \"\";\n        contentCounter.textContent = \"0\";\n        reporterNameInput.value = currentUser.name;\n        \n        // 3秒後に工数記録画面に遷移\n        setTimeout(() => {\n          window.showScreen(\"scr-1778907133295\");\n        }, 3000);\n      } else {\n        showError(\"報告の送信に失敗しました。再度お試しください。\");\n      }\n    } catch (error) {\n      console.error(\"送信エラー:\", error);\n      showError(\"報告の送信中にエラーが発生しました。\");\n    }\n  });\n\n  // 下書き保存処理\n  const draftButton = container.querySelector(\"#btn-draft\");\n  draftButton.addEventListener(\"click\", () => {\n    const draftData = {\n      緊急度: selectedUrgencyInput.value,\n      報告種別: container.querySelector(\"#report-type\").value,\n      発生日時: container.querySelector(\"#occurrence-datetime\").value,\n      発生場所: container.querySelector(\"#occurrence-location\").value,\n      作業項目ID: container.querySelector(\"#work-item\").value,\n      緊急事態内容: emergencyContentTextarea.value,\n      連絡先電話番号: container.querySelector(\"#contact-phone\").value,\n      添付ファイル数: uploadedFiles.length\n    };\n    \n    localStorage.setItem(\"emergencyReportDraft\", JSON.stringify(draftData));\n    showSuccess();\n    \n    setTimeout(() => {\n      const successDiv = container.querySelector(\"#success-message\");\n      successDiv.querySelector(\"div\").textContent = \"下書きが保存されました\";\n      successDiv.classList.remove(\"hidden\");\n      setTimeout(() => {\n        successDiv.classList.add(\"hidden\");\n        successDiv.querySelector(\"div\").textContent = \"緊急報告が正常に送信されました\";\n      }, 2000);\n    }, 100);\n  });\n\n  // 戻るボタン処理\n  const backButton = container.querySelector(\"#btn-back\");\n  backButton.addEventListener(\"click\", () => {\n    window.showScreen(\"scr-1778907133295\");\n  });\n\n  // 下書きデータの復元\n  function loadDraft() {\n    const draftData = localStorage.getItem(\"emergencyReportDraft\");\n    if (draftData) {\n      try {\n        const data = JSON.parse(draftData);\n        \n        if (data.緊急度) {\n          selectedUrgencyInput.value = data.緊急度;\n          const targetBtn = container.querySelector(`[data-urgency=\"${data.緊急度}\"]`);\n          if (targetBtn) {\n            targetBtn.style.background = \"var(--primary)\";\n            targetBtn.style.borderColor = \"var(--primary)\";\n            targetBtn.style.color = \"#fff\";\n          }\n        }\n        \n        if (data.報告種別) container.querySelector(\"#report-type\").value = data.報告種別;\n        if (data.発生日時) container.querySelector(\"#occurrence-datetime\").value = data.発生日時;\n        if (data.発生場所) container.querySelector(\"#occurrence-location\").value = data.発生場所;\n        if (data.作業項目ID) container.querySelector(\"#work-item\").value = data.作業項目ID;\n        if (data.緊急事態内容) {\n          emergencyContentTextarea.value = data.緊急事態内容;\n          contentCounter.textContent = data.緊急事態内容.length;\n        }\n        if (data.連絡先電話番号) container.querySelector(\"#contact-phone\").value = data.連絡先電話番号;\n      } catch (error) {\n        console.error(\"下書きデータの復元に失敗しました:\", error);\n      }\n    }\n  }\n\n  // 初期化処理\n  loadWorkItems();\n  loadDraft();\n\n  // 発生日時のデフォルト値を現在時刻に設定\n  const now = new Date();\n  const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);\n  container.querySelector(\"#occurrence-datetime\").value = localDateTime;\n}";
</script>

      --primary-hover: #660000;
      --bg-main: #0d0d0d;
      --bg-card: #1a1a1a;
      --bg-sidebar: #141414;
      --border: #2d2d2d;
      --text: #e0e0e0;
      --text-muted: #999999;
      --top-bar-bg: #111111;
      --top-bar-border: #333333;
      --accent-red: #ff4444;
      --accent-orange: #ff8800;
      --accent-green: #00aa44;
      --shadow-subtle: 0 1px 3px rgba(0,0,0,0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-main);
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
      overflow-x: hidden;
    }

    .app-shell {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 220px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      z-index: 100;
    }

    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--top-bar-bg);
    }

    .logo {
      font-size: 15px;
      font-weight: 600;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo::before {
      content: "⚡";
      font-size: 18px;
    }

    .nav-section {
      padding: 16px 0 8px 0;
    }

    .nav-section-title {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 16px 8px 16px;
    }

    .nav-item {
      display: block;
      padding: 8px 16px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 400;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      border-radius: 0;
      position: relative;
    }

    .nav-item:hover {
      background: rgba(139, 0, 0, 0.1);
      color: var(--text);
    }

    .nav-item.aivic-active {
      background: rgba(139, 0, 0, 0.15);
      color: var(--primary);
      font-weight: 500;
    }

    .nav-item.aivic-active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--primary);
    }

    .main-content {
      flex: 1;
      margin-left: 220px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .top-bar {
      height: 52px;
      background: var(--top-bar-bg);
      border-bottom: 1px solid var(--top-bar-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .breadcrumb {
      font-size: 13px;
      color: var(--text-muted);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(0, 170, 68, 0.1);
      color: var(--accent-green);
      border: 1px solid rgba(0, 170, 68, 0.2);
    }

    .status-indicator::before {
      content: "●";
      font-size: 8px;
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 12px;
    }

    .logout-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      transition: all 0.15s ease;
    }

    .logout-link:hover {
      background: var(--bg-card);
      color: var(--text);
    }

    .content-area {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
    }

    .panel-container {
      min-height: calc(100vh - 52px - 32px);
    }

    .emergency-alert {
      background: rgba(255, 68, 68, 0.1);
      border: 1px solid rgba(255, 68, 68, 0.3);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: none;
    }

    .emergency-alert.active {
      display: block;
    }

    .emergency-alert-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent-red);
      margin-bottom: 4px;
    }

    .emergency-alert-text {
      font-size: 12px;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s ease;
      }

      .sidebar.mobile-open {
        transform: translateX(0);
      }

      .main-content {
        margin-left: 0;
      }

      .top-bar {
        padding: 0 16px;
      }

      .content-area {
        padding: 12px 16px;
      }
    }

    .loading-skeleton {
      background: linear-gradient(90deg, var(--bg-card) 25%, rgba(139, 0, 0, 0.1) 50%, var(--bg-card) 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 6px;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .quick-actions {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 200;
    }

    .quick-action-btn {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: var(--primary);
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: var(--shadow-subtle);

    .quick-action-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);

    .sidebar-footer {
      margin-top: auto;
      padding: 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;

      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
