ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let attachedFiles = [];\n  const maxFiles = 5;\n  const maxFileSize = 5 * 1024 * 1024; // 5MB\n\n  // 現在のユーザー情報を取得して報告者名に設定\n  const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');\n  const reporterNameInput = container.querySelector('#reporter-name');\n  if (currentUser.氏名) {\n    reporterNameInput.value = currentUser.氏名;\n  }\n\n  // 作業項目マスタを読み込み\n  async function loadWorkItems() {\n    const workItemSelect = container.querySelector('#work-item');\n    try {\n      const workItems = await window.aivicApi.list(3); // 作業項目マスタのテーブルインデックス\n      if (workItems) {\n        workItems.forEach(item => {\n          const option = document.createElement('option');\n          option.value = item.作業項目ID;\n          option.textContent = item.作業項目名;\n          workItemSelect.appendChild(option);\n        });\n      }\n    } catch (error) {\n      console.error('作業項目の読み込みに失敗しました:', error);\n    }\n  }\n\n  // 下書きデータの読み込み\n  function loadDraft() {\n    const draft = JSON.parse(localStorage.getItem('emergencyReportDraft') || '{}');\n    if (Object.keys(draft).length > 0) {\n      if (draft.urgency) {\n        const urgencyRadio = container.querySelector(`input[name=\"urgency\"][value=\"${draft.urgency}\"]`);\n        if (urgencyRadio) urgencyRadio.checked = true;\n      }\n      if (draft.reportType) container.querySelector('#report-type').value = draft.reportType;\n      if (draft.occurrenceDateTime) container.querySelector('#occurrence-datetime').value = draft.occurrenceDateTime;\n      if (draft.occurrenceLocation) container.querySelector('#occurrence-location').value = draft.occurrenceLocation;\n      if (draft.workItem) container.querySelector('#work-item').value = draft.workItem;\n      if (draft.emergencyContent) {\n        const contentTextarea = container.querySelector('#emergency-content');\n        contentTextarea.value = draft.emergencyContent;\n        updateCharCount();\n      }\n      if (draft.contactPhone) container.querySelector('#contact-phone').value = draft.contactPhone;\n    }\n  }\n\n  // 文字数カウント更新\n  function updateCharCount() {\n    const textarea = container.querySelector('#emergency-content');\n    const charCount = container.querySelector('#char-count');\n    const currentLength = textarea.value.length;\n    charCount.textContent = `(${currentLength}/1000)`;\n    \n    if (currentLength > 1000) {\n      charCount.style.color = '#ff453a';\n      showError('emergency-content-error', '文字数上限を超えています（1000文字以内）');\n    } else {\n      charCount.style.color = 'var(--text-muted)';\n      hideError('emergency-content-error');\n    }\n  }\n\n  // エラーメッセージ表示\n  function showError(elementId, message) {\n    const errorElement = container.querySelector(`#${elementId}`);\n    if (errorElement) {\n      errorElement.textContent = message;\n      errorElement.style.display = 'block';\n    }\n  }\n\n  // エラーメッセージ非表示\n  function hideError(elementId) {\n    const errorElement = container.querySelector(`#${elementId}`);\n    if (errorElement) {\n      errorElement.style.display = 'none';\n    }\n  }\n\n  // 全エラーメッセージクリア\n  function clearAllErrors() {\n    const errorElements = container.querySelectorAll('.error-message');\n    errorElements.forEach(el => el.style.display = 'none');\n  }\n\n  // バリデーション\n  function validateForm() {\n    clearAllErrors();\n    let isValid = true;\n\n    // 緊急度チェック\n    const urgency = container.querySelector('input[name=\"urgency\"]:checked');\n    if (!urgency) {\n      showError('urgency-error', '緊急度を選択してください');\n      isValid = false;\n    }\n\n    // 報告種別チェック\n    const reportType = container.querySelector('#report-type').value;\n    if (!reportType) {\n      showError('report-type-error', '報告種別を選択してください');\n      isValid = false;\n    }\n\n    // 発生日時チェック\n    const occurrenceDateTime = container.querySelector('#occurrence-datetime').value;\n    if (!occurrenceDateTime) {\n      showError('occurrence-datetime-error', '発生日時を入力してください');\n      isValid = false;\n    } else {\n      const inputDate = new Date(occurrenceDateTime);\n      const now = new Date();\n      if (inputDate > now) {\n        showError('occurrence-datetime-error', '発生日時に未来の日付は入力できません');\n        isValid = false;\n      }\n    }\n\n    // 発生場所チェック\n    const occurrenceLocation = container.querySelector('#occurrence-location').value.trim();\n    if (!occurrenceLocation) {\n      showError('occurrence-location-error', '発生場所を入力してください');\n      isValid = false;\n    }\n\n    // 緊急事態内容チェック\n    const emergencyContent = container.querySelector('#emergency-content').value.trim();\n    if (!emergencyContent) {\n      showError('emergency-content-error', '緊急事態内容を入力してください');\n      isValid = false;\n    } else if (emergencyContent.length > 1000) {\n      showError('emergency-content-error', '文字数上限を超えています（1000文字以内）');\n      isValid = false;\n    }\n\n    // 連絡先電話番号チェック\n    const contactPhone = container.querySelector('#contact-phone').value.trim();\n    if (!contactPhone) {\n      showError('contact-phone-error', '連絡先電話番号を入力してください');\n      isValid = false;\n    } else {\n      const phonePattern = /^(\\d{2,4}-\\d{2,4}-\\d{4}|\\d{10,11})$/;\n      if (!phonePattern.test(contactPhone.replace(/[^\\d-]/g, ''))) {\n        showError('contact-phone-error', '正しい電話番号の形式で入力してください');\n        isValid = false;\n      }\n    }\n\n    return isValid;\n  }\n\n  // ファイル添付処理\n  function handleFileSelect(files) {\n    const fileArray = Array.from(files);\n    \n    for (const file of fileArray) {\n      // ファイル数制限チェック\n      if (attachedFiles.length >= maxFiles) {\n        showError('photo-error', `添付できる画像は最大${maxFiles}枚です`);\n        break;\n      }\n\n      // ファイル形式チェック\n      if (!file.type.startsWith('image/')) {\n        showError('photo-error', 'サポートされていないファイル形式です。jpg、png形式のファイルをアップロードしてください。');\n        continue;\n      }\n\n      // ファイルサイズチェック\n      if (file.size > maxFileSize) {\n        showError('photo-error', 'ファイルサイズ上限を超えています（5MB以内）');\n        continue;\n      }\n\n      attachedFiles.push(file);\n      hideError('photo-error');\n    }\n\n    updatePhotoPreview();\n  }\n\n  // 写真プレビュー更新\n  function updatePhotoPreview() {\n    const previewContainer = container.querySelector('#photo-preview');\n    previewContainer.innerHTML = '';\n\n    attachedFiles.forEach((file, index) => {\n      const previewItem = document.createElement('div');\n      previewItem.style.cssText = 'position: relative; border-radius: 6px; overflow: hidden; background: rgba(0,0,0,0.1);';\n\n      const img = document.createElement('img');\n      img.style.cssText = 'width: 100%; height: 80px; object-fit: cover;';\n      \n      const reader = new FileReader();\n      reader.onload = (e) => {\n        img.src = e.target.result;\n      };\n      reader.readAsDataURL(file);\n\n      const removeBtn = document.createElement('button');\n      removeBtn.innerHTML = '×';\n      removeBtn.style.cssText = 'position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border: none; border-radius: 50%; background: rgba(0,0,0,0.7); color: #fff; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;';\n      removeBtn.onclick = () => {\n        attachedFiles.splice(index, 1);\n        updatePhotoPreview();\n      };\n\n      previewItem.appendChild(img);\n      previewItem.appendChild(removeBtn);\n      previewContainer.appendChild(previewItem);\n    });\n  }\n\n  // フォームデータ収集\n  function collectFormData() {\n    const urgency = container.querySelector('input[name=\"urgency\"]:checked');\n    return {\n      緊急度: urgency ? urgency.value : '',\n      報告種別: container.querySelector('#report-type').value,\n      発生日時: container.querySelector('#occurrence-datetime').value,\n      発生場所: container.querySelector('#occurrence-location').value.trim(),\n      作業項目ID: container.querySelector('#work-item').value,\n      緊急事態内容: container.querySelector('#emergency-content').value.trim(),\n      報告者名: container.querySelector('#reporter-name').value,\n      連絡先電話番号: container.querySelector('#contact-phone').value.trim(),\n      添付ファイル数: attachedFiles.length,\n      報告日時: new Date().toISOString(),\n      状態: '報告済み'\n    };\n  }\n\n  // 下書き保存\n  function saveDraft() {\n    const formData = collectFormData();\n    localStorage.setItem('emergencyReportDraft', JSON.stringify(formData));\n    \n    const successMessage = container.querySelector('#draft-success-message');\n    successMessage.style.display = 'block';\n    setTimeout(() => {\n      successMessage.style.display = 'none';\n    }, 3000);\n  }\n\n  // 緊急報告送信\n  async function submitReport() {\n    if (!validateForm()) {\n      return;\n    }\n\n    const formData = collectFormData();\n    \n    try {\n      // 緊急報告データを保存（異常値検出ログテーブルを使用）\n      const saved = await window.aivicApi.save(4, {\n        検出対象テーブル: '緊急報告',\n        検出対象レコードID: crypto.randomUUID(),\n        ユーザーID: currentUser.ユーザーID || crypto.randomUUID(),\n        異常値種別: formData.報告種別,\n        検出項目: '緊急事態内容',\n        検出値: formData.緊急事態内容,\n        閾値: formData.緊急度,\n        重要度: formData.緊急度,\n        確認状況: '未確認',\n        通知送信フラグ: true,\n        対応メモ: `発生場所: ${formData.発生場所}, 連絡先: ${formData.連絡先電話番号}`,\n        検出日時: formData.報告日時\n      });\n\n      if (saved) {\n        // 下書きデータをクリア\n        localStorage.removeItem('emergencyReportDraft');\n        \n        // 成功メッセージ表示\n        const successMessage = container.querySelector('#success-message');\n        successMessage.style.display = 'block';\n        \n        // フォームをリセット\n        container.querySelector('#emergency-form').reset();\n        attachedFiles = [];\n        updatePhotoPreview();\n        updateCharCount();\n        \n        setTimeout(() => {\n          successMessage.style.display = 'none';\n        }, 5000);\n      }\n    } catch (error) {\n      console.error('緊急報告の送信に失敗しました:', error);\n    }\n  }\n\n  // イベントリスナー設定\n  container.querySelector('#emergency-content').addEventListener('input', updateCharCount);\n\n  container.querySelector('#btn-photo-attach').addEventListener('click', () => {\n    container.querySelector('#photo-input').click();\n  });\n\n  container.querySelector('#photo-input').addEventListener('change', (e) => {\n    handleFileSelect(e.target.files);\n  });\n\n  // ドラッグ&ドロップ\n  const dropZone = container.querySelector('#photo-drop-zone');\n  dropZone.addEventListener('dragover', (e) => {\n    e.preventDefault();\n    dropZone.style.borderColor = 'var(--primary)';\n  });\n\n  dropZone.addEventListener('dragleave', () => {\n    dropZone.style.borderColor = 'rgba(255,255,255,0.18)';\n  });\n\n  dropZone.addEventListener('drop', (e) => {\n    e.preventDefault();\n    dropZone.style.borderColor = 'rgba(255,255,255,0.18)';\n    handleFileSelect(e.dataTransfer.files);\n  });\n\n  container.querySelector('#btn-draft-save').addEventListener('click', saveDraft);\n  container.querySelector('#btn-submit').addEventListener('click', submitReport);\n\n  container.querySelector('#btn-back-to-work').addEventListener('click', () => {\n    window.showScreen(\"scr-1778907133295\");\n  });\n\n  // 初期化\n  loadWorkItems();\n  loadDraft();\n  updateCharCount();\n\n  // 現在日時を発生日時のデフォルトに設定\n  const now = new Date();\n  const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);\n  container.querySelector('#occurrence-datetime').value = localDateTime;\n}";
</script>

    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
