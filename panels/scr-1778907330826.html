ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type":"text","required":false,"description":"管理者による対応内容や備考"},{"name":"検出日時","type":"timestamp","required":true,"description":"異常値が検出された日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let attachedFiles = [];\n  let currentDraftId = null;\n\n  // 現在のユーザー情報を設定\n  const reporterNameInput = container.querySelector('#reporter-name');\n  reporterNameInput.value = '田中太郎'; // 実際の実装では認証情報から取得\n\n  // 作業項目マスタの読み込み\n  const workItemSelect = container.querySelector('#work-item');\n  if (tables[3] && tables[3].records) {\n    tables[3].records.forEach(item => {\n      const option = document.createElement('option');\n      option.value = item.作業項目ID;\n      option.textContent = item.作業項目名;\n      workItemSelect.appendChild(option);\n    });\n  }\n\n  // 文字数カウンター\n  const emergencyContent = container.querySelector('#emergency-content');\n  const charCount = container.querySelector('#char-count');\n  emergencyContent.addEventListener('input', () => {\n    const count = emergencyContent.value.length;\n    charCount.textContent = `(${count}/1000)`;\n    if (count > 1000) {\n      charCount.style.color = '#dc3545';\n    } else {\n      charCount.style.color = 'var(--text-muted)';\n    }\n  });\n\n  // 写真添付機能\n  const photoInput = container.querySelector('#photo-input');\n  const photoSelectBtn = container.querySelector('#btn-photo-select');\n  const photoDropZone = container.querySelector('#photo-drop-zone');\n  const photoPreview = container.querySelector('#photo-preview');\n\n  photoSelectBtn.addEventListener('click', () => {\n    photoInput.click();\n  });\n\n  photoInput.addEventListener('change', handleFileSelect);\n\n  // ドラッグ&ドロップ\n  photoDropZone.addEventListener('dragover', (e) => {\n    e.preventDefault();\n    photoDropZone.style.borderColor = 'var(--primary)';\n    photoDropZone.style.background = 'rgba(255,255,255,0.05)';\n  });\n\n  photoDropZone.addEventListener('dragleave', (e) => {\n    e.preventDefault();\n    photoDropZone.style.borderColor = 'rgba(255,255,255,0.18)';\n    photoDropZone.style.background = 'rgba(0,0,0,0.1)';\n  });\n\n  photoDropZone.addEventListener('drop', (e) => {\n    e.preventDefault();\n    photoDropZone.style.borderColor = 'rgba(255,255,255,0.18)';\n    photoDropZone.style.background = 'rgba(0,0,0,0.1)';\n    \n    const files = Array.from(e.dataTransfer.files);\n    handleFileSelect({ target: { files } });\n  });\n\n  function handleFileSelect(e) {\n    const files = Array.from(e.target.files);\n    const errorDiv = container.querySelector('#error-photo');\n    \n    // ファイル数チェック\n    if (attachedFiles.length + files.length > 5) {\n      showError('error-photo', '添付できる写真は最大5枚までです。');\n      return;\n    }\n\n    files.forEach(file => {\n      // ファイル形式チェック\n      if (!file.type.startsWith('image/')) {\n        showError('error-photo', 'サポートされていないファイル形式です。画像ファイルを選択してください。');\n        return;\n      }\n\n      // ファイルサイズチェック（10MB）\n      if (file.size > 10 * 1024 * 1024) {\n        showError('error-photo', 'ファイルサイズは10MB以下にしてください。');\n        return;\n      }\n\n      attachedFiles.push(file);\n      addPhotoPreview(file);\n    });\n\n    hideError('error-photo');\n  }\n\n  function addPhotoPreview(file) {\n    const reader = new FileReader();\n    reader.onload = (e) => {\n      const previewItem = document.createElement('div');\n      previewItem.style.cssText = 'position: relative; border-radius: 6px; overflow: hidden; background: var(--bg-card);';\n      \n      previewItem.innerHTML = `\n        <img src=\"${e.target.result}\" style=\"width: 100%; height: 80px; object-fit: cover;\">\n        <button type=\"button\" class=\"remove-photo\" data-filename=\"${file.name}\" style=\"position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border: none; border-radius: 50%; background: rgba(220,53,69,0.9); color: #fff; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;\">×</button>\n        <div style=\"padding: 4px; font-size: 10px; color: var(--text-muted); text-overflow: ellipsis; overflow: hidden; white-space: nowrap;\">${file.name}</div>\n      `;\n      \n      photoPreview.appendChild(previewItem);\n    };\n    reader.readAsDataURL(file);\n  }\n\n  // 写真削除\n  photoPreview.addEventListener('click', (e) => {\n    const removeBtn = e.target.closest('.remove-photo');\n    if (removeBtn) {\n      const filename = removeBtn.dataset.filename;\n      attachedFiles = attachedFiles.filter(f => f.name !== filename);\n      removeBtn.closest('div').remove();\n    }\n  });\n\n  // バリデーション関数\n  function validateForm() {\n    let isValid = true;\n\n    // 緊急度チェック\n    const urgency = container.querySelector('input[name=\"urgency\"]:checked');\n    if (!urgency) {\n      showError('error-urgency', '緊急度を選択してください。');\n      isValid = false;\n    } else {\n      hideError('error-urgency');\n    }\n\n    // 報告種別チェック\n    const reportType = container.querySelector('#report-type').value;\n    if (!reportType) {\n      showError('error-report-type', '報告種別を選択してください。');\n      isValid = false;\n    } else {\n      hideError('error-report-type');\n    }\n\n    // 発生日時チェック\n    const occurrenceDateTime = container.querySelector('#occurrence-datetime').value;\n    if (!occurrenceDateTime) {\n      showError('error-occurrence-datetime', '発生日時を入力してください。');\n      isValid = false;\n    } else {\n      const selectedDate = new Date(occurrenceDateTime);\n      const now = new Date();\n      if (selectedDate > now) {\n        showError('error-occurrence-datetime', '発生日時に未来の日付は入力できません。');\n        isValid = false;\n      } else {\n        hideError('error-occurrence-datetime');\n      }\n    }\n\n    // 発生場所チェック\n    const location = container.querySelector('#location').value.trim();\n    if (!location) {\n      showError('error-location', '発生場所を入力してください。');\n      isValid = false;\n    } else {\n      hideError('error-location');\n    }\n\n    // 緊急事態内容チェック\n    const emergencyContent = container.querySelector('#emergency-content').value.trim();\n    if (!emergencyContent) {\n      showError('error-emergency-content', '緊急事態内容を入力してください。');\n      isValid = false;\n    } else if (emergencyContent.length > 1000) {\n      showError('error-emergency-content', '文字数上限を超えています。');\n      isValid = false;\n    } else {\n      hideError('error-emergency-content');\n    }\n\n    // 連絡先電話番号チェック\n    const contactPhone = container.querySelector('#contact-phone').value.trim();\n    if (!contactPhone) {\n      showError('error-contact-phone', '連絡先電話番号を入力してください。');\n      isValid = false;\n    } else {\n      const phonePattern = /^(\\d{2,4}-\\d{2,4}-\\d{4}|\\d{10,11})$/;\n      if (!phonePattern.test(contactPhone.replace(/-/g, ''))) {\n        showError('error-contact-phone', '正しい電話番号の形式で入力してください。');\n        isValid = false;\n      } else {\n        hideError('error-contact-phone');\n      }\n    }\n\n    return isValid;\n  }\n\n  function showError(errorId, message) {\n    const errorDiv = container.querySelector(`#${errorId}`);\n    errorDiv.textContent = message;\n    errorDiv.style.display = 'block';\n  }\n\n  function hideError(errorId) {\n    const errorDiv = container.querySelector(`#${errorId}`);\n    errorDiv.style.display = 'none';\n  }\n\n  // フォームデータ収集\n  function collectFormData() {\n    const urgency = container.querySelector('input[name=\"urgency\"]:checked');\n    return {\n      緊急度: urgency ? urgency.value : '',\n      報告種別: container.querySelector('#report-type').value,\n      発生日時: container.querySelector('#occurrence-datetime').value,\n      発生場所: container.querySelector('#location').value.trim(),\n      作業項目ID: container.querySelector('#work-item').value,\n      緊急事態内容: container.querySelector('#emergency-content').value.trim(),\n      報告者名: container.querySelector('#reporter-name').value,\n      連絡先電話番号: container.querySelector('#contact-phone').value.trim(),\n      添付ファイル数: attachedFiles.length,\n      報告日時: new Date().toISOString(),\n      状態: '未対応'\n    };\n  }\n\n  // 下書き保存\n  container.querySelector('#btn-draft-save').addEventListener('click', async () => {\n    const formData = collectFormData();\n    formData.状態 = '下書き';\n\n    try {\n      let result;\n      if (currentDraftId) {\n        result = await window.aivicApi.update(4, currentDraftId, formData);\n      } else {\n        result = await window.aivicApi.save(4, formData);\n        if (result) {\n          currentDraftId = result.id;\n        }\n      }\n\n      if (result) {\n        container.querySelector('#draft-success-message').style.display = 'block';\n        setTimeout(() => {\n          container.querySelector('#draft-success-message').style.display = 'none';\n        }, 3000);\n      }\n    } catch (error) {\n      console.error('下書き保存エラー:', error);\n    }\n  });\n\n  // 緊急報告送信\n  container.querySelector('#btn-submit').addEventListener('click', async () => {\n    if (!validateForm()) {\n      return;\n    }\n\n    const formData = collectFormData();\n    formData.状態 = '送信済み';\n\n    try {\n      const result = await window.aivicApi.save(4, formData);\n      if (result) {\n        container.querySelector('#success-message').style.display = 'block';\n        container.querySelector('#completion-actions').style.display = 'block';\n        container.querySelector('#emergency-form').style.display = 'none';\n        container.querySelector('#btn-draft-save').style.display = 'none';\n        container.querySelector('#btn-submit').style.display = 'none';\n      }\n    } catch (error) {\n      console.error('送信エラー:', error);\n    }\n  });\n\n  // 報告完了ボタン\n  container.querySelector('#btn-complete').addEventListener('click', () => {\n    window.showScreen(\"scr-1778907133295\");\n  });\n\n  // 現在日時を発生日時のデフォルト値に設定\n  const now = new Date();\n  const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);\n  container.querySelector('#occurrence-datetime').value = localDateTime;\n\n  // 下書きデータの復元（実際の実装では localStorage や API から取得）\n  // 今回はサンプルとして空の状態から開始\n}";
</script>

            showScreen('scr-1778907133295');
        });
    </script>

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
