ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type":"text","required":false,"description":"管理者による対応内容や備考"},{"name":"検出日時","type":"timestamp","required":true,"description":"異常値が検出された日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let autoSaveInterval = 30; // デフォルト30秒\n  let autoSaveTimer = null;\n  let isOnline = navigator.onLine;\n  let localData = JSON.parse(localStorage.getItem('workRecords') || '[]');\n  let pendingSyncCount = localData.filter(item => !item.synced).length;\n\n  // ローカルデータ再描画関数\n  function renderLocalData() {\n    const tbody = container.querySelector('#local-data-tbody');\n    if (localData.length === 0) {\n      tbody.innerHTML = '<tr><td colspan=\"4\" style=\"padding: 12px; text-align: center; color: var(--text-muted); font-size: 13px;\">ローカルデータはありません</td></tr>';\n      return;\n    }\n    \n    tbody.innerHTML = localData.map(item => `\n      <tr data-id=\"${item.id}\">\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${item.作業日 || ''}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${(item.作業内容 || '').substring(0, 30)}${(item.作業内容 || '').length > 30 ? '...' : ''}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px;\">\n          <span style=\"color: ${item.synced ? '#22c55e' : '#f59e0b'};\">\n            ${item.synced ? '同期済み' : '未同期'}\n          </span>\n        </td>\n        <td style=\"padding: 6px 10px;\">\n          <button class=\"action-btn secondary delete-local-btn\" data-id=\"${item.id}\" style=\"background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer;\">削除</button>\n        </td>\n      </tr>\n    `).join('');\n  }\n\n  // ステータス更新\n  function updateStatus() {\n    const autoSaveIndicator = container.querySelector('#auto-save-indicator');\n    const autoSaveStatus = container.querySelector('#auto-save-status');\n    const networkIndicator = container.querySelector('#network-indicator');\n    const networkStatus = container.querySelector('#network-status');\n    const pendingSyncCountEl = container.querySelector('#pending-sync-count');\n    \n    // 自動保存ステータス\n    autoSaveIndicator.style.background = autoSaveTimer ? '#22c55e' : '#ef4444';\n    autoSaveStatus.textContent = autoSaveTimer ? '正常動作中' : '停止中';\n    \n    // ネットワークステータス\n    networkIndicator.style.background = isOnline ? '#22c55e' : '#ef4444';\n    networkStatus.textContent = isOnline ? 'オンライン' : 'オフライン';\n    \n    // 同期待ち件数\n    pendingSyncCount = localData.filter(item => !item.synced).length;\n    pendingSyncCountEl.textContent = pendingSyncCount;\n  }\n\n  // エラー表示\n  function showError(message) {\n    const errorNotification = container.querySelector('#error-notification');\n    const errorMessage = container.querySelector('#error-message');\n    errorMessage.textContent = message;\n    errorNotification.style.display = 'block';\n  }\n\n  // エラー非表示\n  function hideError() {\n    const errorNotification = container.querySelector('#error-notification');\n    errorNotification.style.display = 'none';\n  }\n\n  // 自動保存開始\n  function startAutoSave() {\n    if (autoSaveTimer) clearInterval(autoSaveTimer);\n    \n    if (autoSaveInterval < 1) {\n      showError('保存間隔は1秒以上で設定してください');\n      return;\n    }\n    \n    autoSaveTimer = setInterval(async () => {\n      try {\n        // 未同期データがあれば同期を試行\n        const unsyncedData = localData.filter(item => !item.synced);\n        if (unsyncedData.length > 0 && isOnline) {\n          await syncData();\n        }\n        \n        // 最終保存時刻更新\n        const lastSaveTime = container.querySelector('#last-save-time');\n        lastSaveTime.textContent = new Date().toLocaleString('ja-JP');\n        \n        hideError();\n      } catch (error) {\n        showError('自動保存中にエラーが発生しました: ' + error.message);\n      }\n    }, autoSaveInterval * 1000);\n    \n    updateStatus();\n  }\n\n  // データ同期\n  async function syncData() {\n    const unsyncedData = localData.filter(item => !item.synced);\n    \n    for (const item of unsyncedData) {\n      try {\n        const saved = await window.aivicApi.save(1, {\n          作業員ID: item.作業員ID,\n          作業日: item.作業日,\n          作業開始時刻: item.作業開始時刻,\n          作業終了時刻: item.作業終了時刻,\n          作業時間: item.作業時間,\n          プロジェクト名: item.プロジェクト名,\n          作業場所: item.作業場所,\n          作業種別: item.作業種別,\n          作業内容: item.作業内容,\n          進捗状況: item.進捗状況,\n          備考: item.備考,\n          承認状態: '未承認',\n          作成者ID: item.作業員ID\n        });\n        \n        if (saved) {\n          // 同期成功\n          item.synced = true;\n          item.serverId = saved.作業記録ID;\n        }\n      } catch (error) {\n        console.error('同期エラー:', error);\n        throw error;\n      }\n    }\n    \n    // ローカルストレージ更新\n    localStorage.setItem('workRecords', JSON.stringify(localData));\n    renderLocalData();\n    updateStatus();\n  }\n\n  // 手動同期\n  async function manualSync() {\n    try {\n      if (!isOnline) {\n        showError('ネットワークに接続されていません');\n        return;\n      }\n      \n      await syncData();\n      hideError();\n      \n      // 成功通知（簡易版）\n      const btn = container.querySelector('#btn-manual-sync');\n      const originalText = btn.textContent;\n      btn.textContent = '同期完了';\n      btn.style.background = '#22c55e';\n      setTimeout(() => {\n        btn.textContent = originalText;\n        btn.style.background = 'transparent';\n      }, 2000);\n      \n    } catch (error) {\n      showError('同期に失敗しました: ' + error.message);\n    }\n  }\n\n  // データ復旧チェック\n  function checkRecovery() {\n    const recoveryData = localStorage.getItem('unsavedWorkData');\n    if (recoveryData) {\n      const recoverySection = container.querySelector('#recovery-section');\n      recoverySection.style.display = 'block';\n    }\n  }\n\n  // ネットワーク状態監視\n  window.addEventListener('online', () => {\n    isOnline = true;\n    updateStatus();\n    // オンライン復旧時の自動同期\n    if (pendingSyncCount > 0) {\n      setTimeout(() => {\n        syncData().catch(error => {\n          showError('自動同期に失敗しました: ' + error.message);\n        });\n      }, 1000);\n    }\n  });\n\n  window.addEventListener('offline', () => {\n    isOnline = false;\n    updateStatus();\n  });\n\n  // 初期データ表示\n  renderLocalData();\n  updateStatus();\n  checkRecovery();\n  \n  // 保存間隔設定の初期値\n  const saveIntervalInput = container.querySelector('#save-interval');\n  saveIntervalInput.value = autoSaveInterval;\n\n  // 自動保存開始\n  startAutoSave();\n\n  // イベントリスナー登録\n  \n  // 設定保存\n  container.querySelector('#btn-save-settings').addEventListener('click', () => {\n    const newInterval = parseInt(saveIntervalInput.value);\n    \n    if (newInterval < 1) {\n      showError('保存間隔は1秒以上で設定してください');\n      return;\n    }\n    \n    if (newInterval > 86400) {\n      showError('保存間隔は86400秒以下で設定してください');\n      return;\n    }\n    \n    autoSaveInterval = newInterval;\n    localStorage.setItem('autoSaveInterval', autoSaveInterval.toString());\n    startAutoSave();\n    hideError();\n    \n    // 成功通知\n    const btn = container.querySelector('#btn-save-settings');\n    const originalText = btn.textContent;\n    btn.textContent = '保存完了';\n    setTimeout(() => {\n      btn.textContent = originalText;\n    }, 1500);\n  });\n\n  // 手動同期\n  container.querySelector('#btn-manual-sync').addEventListener('click', manualSync);\n\n  // 再試行\n  container.querySelector('#btn-retry').addEventListener('click', () => {\n    hideError();\n    manualSync();\n  });\n\n  // ローカルデータクリア\n  container.querySelector('#btn-clear-local').addEventListener('click', () => {\n    if (!confirm('ローカルデータをすべて削除しますか？未同期のデータは失われます。')) return;\n    \n    localStorage.removeItem('workRecords');\n    localData = [];\n    renderLocalData();\n    updateStatus();\n  });\n\n  // データ復旧\n  container.querySelector('#btn-recover')?.addEventListener('click', () => {\n    const recoveryData = localStorage.getItem('unsavedWorkData');\n    if (recoveryData) {\n      try {\n        const data = JSON.parse(recoveryData);\n        localData.push({\n          id: Date.now().toString(),\n          ...data,\n          synced: false\n        });\n        localStorage.setItem('workRecords', JSON.stringify(localData));\n        localStorage.removeItem('unsavedWorkData');\n        renderLocalData();\n        updateStatus();\n        container.querySelector('#recovery-section').style.display = 'none';\n      } catch (error) {\n        showError('データ復旧に失敗しました');\n      }\n    }\n  });\n\n  // データ破棄\n  container.querySelector('#btn-discard')?.addEventListener('click', () => {\n    localStorage.removeItem('unsavedWorkData');\n    container.querySelector('#recovery-section').style.display = 'none';\n  });\n\n  // ローカルデータ削除（イベントデリゲーション）\n  container.addEventListener('click', (e) => {\n    const deleteBtn = e.target.closest('.delete-local-btn');\n    if (deleteBtn) {\n      if (!confirm('このローカルデータを削除しますか？')) return;\n      \n      const id = deleteBtn.dataset.id;\n      localData = localData.filter(item => item.id !== id);\n      localStorage.setItem('workRecords', JSON.stringify(localData));\n      renderLocalData();\n      updateStatus();\n    }\n  });\n\n  // 保存間隔の設定値を復元\n  const savedInterval = localStorage.getItem('autoSaveInterval');\n  if (savedInterval) {\n    autoSaveInterval = parseInt(savedInterval);\n    saveIntervalInput.value = autoSaveInterval;\n    startAutoSave();\n  }\n}";
</script>

      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");

      warn:  function(msg) { show("⚠️ " + msg, "warn"); },

      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;

    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
