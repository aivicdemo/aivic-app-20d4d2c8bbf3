ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let autoSaveInterval = null;\n  let currentSaveInterval = 30; // デフォルト30秒\n  let localData = JSON.parse(localStorage.getItem('workRecordsLocal') || '[]');\n  let isOnline = navigator.onLine;\n  let retryCount = 0;\n  const maxRetries = 3;\n\n  // ローカルデータ再描画関数\n  function renderLocalData() {\n    const tbody = container.querySelector('#local-data-tbody');\n    if (localData.length === 0) {\n      tbody.innerHTML = `\n        <tr>\n          <td colspan=\"4\" style=\"padding: 20px; text-align: center; color: var(--text-muted); font-size: 12px;\">\n            ローカル保存データはありません\n          </td>\n        </tr>\n      `;\n    } else {\n      tbody.innerHTML = localData.map(item => `\n        <tr data-id=\"${item.id}\">\n          <td style=\"padding: 6px 10px; font-size: 12px; color: var(--text);\">${new Date(item.作業日).toLocaleString()}</td>\n          <td style=\"padding: 6px 10px; font-size: 12px; color: var(--text);\">${(item.作業内容 || '').substring(0, 30)}${(item.作業内容 || '').length > 30 ? '...' : ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 12px;\">\n            <span style=\"background: ${item.synced ? 'rgba(106,255,106,0.2)' : 'rgba(255,165,0,0.2)'}; color: ${item.synced ? '#6aff6a' : '#ffa500'}; padding: 2px 6px; border-radius: 4px; font-size: 11px;\">\n              ${item.synced ? '同期済み' : '未同期'}\n            </span>\n          </td>\n          <td style=\"padding: 6px 10px;\">\n            <button class=\"delete-local-btn\" data-id=\"${item.id}\" style=\"background: transparent; color: #ff6a6a; border: 1px solid #ff6a6a; padding: 2px 6px; border-radius: 4px; font-size: 11px; cursor: pointer;\">削除</button>\n          </td>\n        </tr>\n      `).join('');\n    }\n    updatePendingSyncCount();\n  }\n\n  // 同期待ち件数更新\n  function updatePendingSyncCount() {\n    const pendingCount = localData.filter(item => !item.synced).length;\n    container.querySelector('#pending-sync-count').textContent = `${pendingCount}件`;\n    \n    // 上限チェック（100件）\n    if (pendingCount >= 100) {\n      showError('同期待ちデータが上限（100件）に達しています。手動同期を実行してください。');\n    }\n  }\n\n  // ネットワーク状態更新\n  function updateNetworkStatus() {\n    const statusEl = container.querySelector('#network-status');\n    statusEl.textContent = isOnline ? 'オンライン' : 'オフライン';\n    statusEl.style.color = isOnline ? '#6aff6a' : '#ff6a6a';\n  }\n\n  // エラー表示\n  function showError(message) {\n    const errorEl = container.querySelector('#error-notification');\n    const messageEl = container.querySelector('#error-message');\n    messageEl.textContent = message;\n    errorEl.style.display = 'block';\n  }\n\n  // エラー非表示\n  function hideError() {\n    container.querySelector('#error-notification').style.display = 'none';\n  }\n\n  // 最終保存時刻更新\n  function updateLastSaveTime() {\n    const now = new Date();\n    container.querySelector('#last-save-time').textContent = \n      `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;\n  }\n\n  // 自動保存処理\n  function startAutoSave() {\n    if (autoSaveInterval) {\n      clearInterval(autoSaveInterval);\n    }\n    \n    autoSaveInterval = setInterval(async () => {\n      try {\n        // 未同期データがある場合は同期を試行\n        const pendingData = localData.filter(item => !item.synced);\n        if (pendingData.length > 0 && isOnline) {\n          await syncPendingData();\n        }\n        updateLastSaveTime();\n      } catch (error) {\n        console.error('Auto save error:', error);\n        showError('自動保存中にエラーが発生しました: ' + error.message);\n      }\n    }, currentSaveInterval * 1000);\n  }\n\n  // 未同期データの同期\n  async function syncPendingData() {\n    const pendingData = localData.filter(item => !item.synced);\n    let syncedCount = 0;\n    \n    for (const item of pendingData) {\n      try {\n        // ストレージ容量チェック\n        if (localStorage.length > 5000000) { // 約5MB\n          throw new Error('ストレージ容量不足');\n        }\n        \n        const result = await window.aivicApi.save(1, {\n          作業員ID: item.作業員ID,\n          作業日: item.作業日,\n          作業開始時刻: item.作業開始時刻,\n          作業終了時刻: item.作業終了時刻,\n          作業時間: item.作業時間,\n          プロジェクト名: item.プロジェクト名,\n          作業場所: item.作業場所,\n          作業種別: item.作業種別,\n          作業内容: item.作業内容,\n          進捗状況: item.進捗状況,\n          備考: item.備考,\n          承認状態: '未承認',\n          作成者ID: item.作業員ID\n        });\n        \n        if (result) {\n          // 同期成功\n          const index = localData.findIndex(d => d.id === item.id);\n          if (index !== -1) {\n            localData[index].synced = true;\n            syncedCount++;\n          }\n        }\n      } catch (error) {\n        console.error('Sync error for item:', item.id, error);\n        if (error.message.includes('容量不足')) {\n          showError('保存に失敗しました。端末の容量不足が原因の可能性があります。不要なファイルを削除してから再度お試しください。');\n        } else {\n          showError('データの同期に失敗しました: ' + error.message);\n        }\n        break;\n      }\n    }\n    \n    if (syncedCount > 0) {\n      localStorage.setItem('workRecordsLocal', JSON.stringify(localData));\n      renderLocalData();\n      hideError();\n      retryCount = 0; // 成功時はリトライカウントをリセット\n    }\n    \n    return syncedCount;\n  }\n\n  // 手動同期\n  async function manualSync() {\n    if (!isOnline) {\n      showError('オフライン状態のため同期できません。ネットワーク接続を確認してください。');\n      return;\n    }\n    \n    const btn = container.querySelector('#btn-manual-sync');\n    btn.disabled = true;\n    btn.textContent = '同期中...';\n    \n    try {\n      const syncedCount = await syncPendingData();\n      if (syncedCount > 0) {\n        alert(`${syncedCount}件のデータを同期しました。`);\n      } else {\n        alert('同期対象のデータがありません。');\n      }\n    } catch (error) {\n      showError('手動同期に失敗しました: ' + error.message);\n    } finally {\n      btn.disabled = false;\n      btn.textContent = '手動同期実行';\n    }\n  }\n\n  // データ復旧\n  function dataRecovery() {\n    const unsavedData = JSON.parse(localStorage.getItem('unsavedWorkData') || 'null');\n    if (unsavedData) {\n      if (confirm('未保存のデータが見つかりました。復旧しますか？')) {\n        // 復旧処理\n        localData.push({\n          id: Date.now().toString(),\n          ...unsavedData,\n          synced: false\n        });\n        localStorage.setItem('workRecordsLocal', JSON.stringify(localData));\n        localStorage.removeItem('unsavedWorkData');\n        renderLocalData();\n        alert('データを復旧しました。');\n      }\n    } else {\n      alert('復旧可能なデータが見つかりません。');\n    }\n  }\n\n  // 初期化\n  renderLocalData();\n  updateNetworkStatus();\n  updateLastSaveTime();\n  startAutoSave();\n\n  // 保存間隔設定\n  container.querySelector('#save-interval').value = currentSaveInterval;\n\n  // イベントリスナー\n  container.querySelector('#btn-save-settings').addEventListener('click', () => {\n    const interval = parseInt(container.querySelector('#save-interval').value);\n    const errorEl = container.querySelector('#settings-error');\n    \n    if (interval < 1) {\n      errorEl.textContent = '保存間隔は1秒以上で設定してください';\n      errorEl.style.display = 'block';\n      return;\n    }\n    \n    if (interval > 86400) {\n      errorEl.textContent = '保存間隔は86400秒以下で設定してください';\n      errorEl.style.display = 'block';\n      return;\n    }\n    \n    currentSaveInterval = interval;\n    localStorage.setItem('autoSaveInterval', interval.toString());\n    startAutoSave();\n    errorEl.style.display = 'none';\n    alert('保存間隔を更新しました。');\n  });\n\n  container.querySelector('#btn-manual-sync').addEventListener('click', manualSync);\n  container.querySelector('#btn-data-recovery').addEventListener('click', dataRecovery);\n\n  container.querySelector('#btn-retry').addEventListener('click', async () => {\n    hideError();\n    if (retryCount < maxRetries) {\n      retryCount++;\n      try {\n        await syncPendingData();\n      } catch (error) {\n        showError(`再試行に失敗しました (${retryCount}/${maxRetries}): ` + error.message);\n      }\n    } else {\n      showError('最大再試行回数に達しました。しばらく時間をおいてから手動同期をお試しください。');\n    }\n  });\n\n  container.querySelector('#btn-clear-local').addEventListener('click', () => {\n    if (confirm('ローカル保存データをすべて削除しますか？未同期のデータも削除されます。')) {\n      localData = [];\n      localStorage.setItem('workRecordsLocal', JSON.stringify(localData));\n      renderLocalData();\n    }\n  });\n\n  // ローカルデータ削除\n  container.addEventListener('click', (e) => {\n    const deleteBtn = e.target.closest('.delete-local-btn');\n    if (deleteBtn) {\n      const id = deleteBtn.dataset.id;\n      if (confirm('このデータを削除しますか？')) {\n        localData = localData.filter(item => item.id !== id);\n        localStorage.setItem('workRecordsLocal', JSON.stringify(localData));\n        renderLocalData();\n      }\n    }\n  });\n\n  // ネットワーク状態監視\n  window.addEventListener('online', () => {\n    isOnline = true;\n    updateNetworkStatus();\n    hideError();\n    // オンライン復旧時の自動同期\n    setTimeout(async () => {\n      try {\n        await syncPendingData();\n      } catch (error) {\n        showError('自動同期に失敗しました: ' + error.message);\n      }\n    }, 1000);\n  });\n\n  window.addEventListener('offline', () => {\n    isOnline = false;\n    updateNetworkStatus();\n  });\n\n  // 保存間隔の復元\n  const savedInterval = localStorage.getItem('autoSaveInterval');\n  if (savedInterval) {\n    currentSaveInterval = parseInt(savedInterval);\n    container.querySelector('#save-interval').value = currentSaveInterval;\n    startAutoSave();\n  }\n\n  // ページ離脱時の未保存データ保護\n  window.addEventListener('beforeunload', () => {\n    // 現在編集中のデータがあれば保存\n    const currentForm = document.querySelector('form');\n    if (currentForm) {\n      const formData = new FormData(currentForm);\n      const data = Object.fromEntries(formData.entries());\n      if (Object.values(data).some(value => value.trim())) {\n        localStorage.setItem('unsavedWorkData', JSON.stringify(data));\n      }\n    }\n  });\n}";
</script>

  <style>
    :root {
      --primary: #8b0000;

      border-bottom: 1px solid var(--border);

      document.body.appendChild(c);

      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");

  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
