<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工数記録システム</title>
    <style>
        :root {
            --primary: #cc1f1f;
            --primary-hover: #a61a1a;
            --bg-main: #0d0d0d;
            --bg-card: #1a1010;
            --bg-sidebar: #151111;
            --border: #331a1a;
            --text: #e6e6e6;
            --text-muted: #999999;
            --top-bar-bg: #1f1515;
            --top-bar-border: #2d1a1a;
            --warning: #ff6b35;
            --error: #ff3333;
            --success: #28a745;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: "⚠";
            font-size: 18px;
        }

        .nav-section {
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }

        .nav-section:last-child {
            border-bottom: none;
            flex: 1;
        }

        .nav-title {
            padding: 0 16px 8px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: block;
            padding: 8px 16px;
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: rgba(204, 31, 31, 0.1);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: rgba(204, 31, 31, 0.15);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            margin-left: 220px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
        }

        .current-time {
            font-size: 12px;
            font-weight: 500;
            color: var(--primary);
            font-family: 'Courier New', monospace;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text);
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .user-menu:hover {
            background: var(--bg-sidebar);
            border-color: var(--primary);
        }

        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            min-height: calc(100vh - 132px);
        }

        .emergency-banner {
            background: linear-gradient(135deg, var(--error), var(--warning));
            color: white;
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            animation: flash 3s infinite;
        }

        @keyframes flash {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.7; }
        }

        .quick-actions {
            padding: 12px 16px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }

        .quick-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            margin-right: 8px;
            transition: all 0.15s ease;
        }

        .quick-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .quick-btn.secondary {
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
        }

        .quick-btn.secondary:hover {
            background: var(--border);
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .content-area {
                padding: 12px;
            }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(13, 13, 13, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let autoSaveInterval = null;\n  let currentSaveInterval = 30;\n  let localDataCache = [];\n  let syncPendingCount = 0;\n  let isOnline = navigator.onLine;\n\n  // DOM要素の取得\n  const autoSaveStatus = container.querySelector('#auto-save-status');\n  const lastSaveTime = container.querySelector('#last-save-time');\n  const networkStatus = container.querySelector('#network-status');\n  const syncPendingCountEl = container.querySelector('#sync-pending-count');\n  const localDataCount = container.querySelector('#local-data-count');\n  const saveIntervalInput = container.querySelector('#save-interval');\n  const errorNotification = container.querySelector('#error-notification');\n  const errorMessage = container.querySelector('#error-message');\n  const localDataSection = container.querySelector('#local-data-section');\n  const localDataTbody = container.querySelector('#local-data-tbody');\n  const recoverySection = container.querySelector('#recovery-section');\n\n  // ローカルストレージキー\n  const STORAGE_KEYS = {\n    WORK_RECORDS: 'workRecords_local',\n    SAVE_INTERVAL: 'autoSaveInterval',\n    LAST_SAVE_TIME: 'lastSaveTime',\n    RECOVERY_DATA: 'recoveryData'\n  };\n\n  // 初期化\n  function init() {\n    loadSettings();\n    updateNetworkStatus();\n    loadLocalData();\n    checkRecoveryData();\n    startAutoSave();\n    \n    // ネットワーク状態の監視\n    window.addEventListener('online', handleOnline);\n    window.addEventListener('offline', handleOffline);\n  }\n\n  // 設定の読み込み\n  function loadSettings() {\n    const savedInterval = localStorage.getItem(STORAGE_KEYS.SAVE_INTERVAL);\n    if (savedInterval) {\n      currentSaveInterval = parseInt(savedInterval);\n      saveIntervalInput.value = currentSaveInterval;\n    }\n    \n    const lastSave = localStorage.getItem(STORAGE_KEYS.LAST_SAVE_TIME);\n    if (lastSave) {\n      lastSaveTime.textContent = `最終保存: ${new Date(lastSave).toLocaleString()}`;\n    }\n  }\n\n  // ネットワーク状態の更新\n  function updateNetworkStatus() {\n    if (isOnline) {\n      networkStatus.textContent = 'オンライン';\n      networkStatus.style.color = '#059669';\n    } else {\n      networkStatus.textContent = 'オフライン';\n      networkStatus.style.color = '#dc2626';\n    }\n    syncPendingCountEl.textContent = `同期待ち: ${syncPendingCount}件`;\n  }\n\n  // ローカルデータの読み込み\n  function loadLocalData() {\n    try {\n      const data = localStorage.getItem(STORAGE_KEYS.WORK_RECORDS);\n      localDataCache = data ? JSON.parse(data) : [];\n      localDataCount.textContent = `${localDataCache.length}件`;\n      \n      // 同期待ち件数の計算\n      syncPendingCount = localDataCache.filter(record => !record.synced).length;\n      updateNetworkStatus();\n    } catch (error) {\n      console.error('ローカルデータの読み込みエラー:', error);\n      localDataCache = [];\n      localDataCount.textContent = '0件';\n    }\n  }\n\n  // 復旧データのチェック\n  function checkRecoveryData() {\n    const recoveryData = localStorage.getItem(STORAGE_KEYS.RECOVERY_DATA);\n    if (recoveryData) {\n      recoverySection.style.display = 'block';\n    }\n  }\n\n  // 自動保存の開始\n  function startAutoSave() {\n    if (autoSaveInterval) {\n      clearInterval(autoSaveInterval);\n    }\n    \n    autoSaveInterval = setInterval(performAutoSave, currentSaveInterval * 1000);\n    autoSaveStatus.textContent = '動作中';\n    autoSaveStatus.style.color = '#059669';\n  }\n\n  // 自動保存の停止\n  function stopAutoSave() {\n    if (autoSaveInterval) {\n      clearInterval(autoSaveInterval);\n      autoSaveInterval = null;\n    }\n    autoSaveStatus.textContent = '停止中';\n    autoSaveStatus.style.color = '#dc2626';\n  }\n\n  // 自動保存の実行\n  async function performAutoSave() {\n    try {\n      // 現在の入力データを取得（実際の実装では工数記録画面からデータを取得）\n      const currentData = getCurrentWorkData();\n      \n      if (currentData && Object.keys(currentData).length > 0) {\n        await saveWorkRecord(currentData);\n        \n        const now = new Date().toISOString();\n        localStorage.setItem(STORAGE_KEYS.LAST_SAVE_TIME, now);\n        lastSaveTime.textContent = `最終保存: ${new Date(now).toLocaleString()}`;\n        \n        hideError();\n      }\n    } catch (error) {\n      console.error('自動保存エラー:', error);\n      showError('自動保存に失敗しました: ' + error.message);\n    }\n  }\n\n  // 現在の作業データを取得（モック）\n  function getCurrentWorkData() {\n    // 実際の実装では工数記録画面から現在の入力値を取得\n    const mockData = {\n      workDate: new Date().toISOString().split('T')[0],\n      startTime: new Date().toISOString(),\n      projectName: 'サンプルプロジェクト',\n      workLocation: 'A現場',\n      workType: '点検作業',\n      workContent: '定期点検実施',\n      progress: '作業中'\n    };\n    \n    // データが空でない場合のみ返す\n    return Math.random() > 0.7 ? mockData : null;\n  }\n\n  // 作業記録の保存\n  async function saveWorkRecord(data) {\n    const record = {\n      id: 'local_' + Date.now(),\n      ...data,\n      createdAt: new Date().toISOString(),\n      synced: false\n    };\n\n    // ローカルストレージに保存\n    localDataCache.push(record);\n    localStorage.setItem(STORAGE_KEYS.WORK_RECORDS, JSON.stringify(localDataCache));\n    \n    // オンラインの場合はサーバーにも保存を試行\n    if (isOnline) {\n      try {\n        const saved = await window.aivicApi.save(1, {\n          作業員ID: 'current_user_id',\n          作業日: data.workDate,\n          作業開始時刻: data.startTime,\n          プロジェクト名: data.projectName,\n          作業場所: data.workLocation,\n          作業種別: data.workType,\n          作業内容: data.workContent,\n          進捗状況: data.progress,\n          承認状態: '未承認',\n          作成者ID: 'current_user_id'\n        });\n        \n        if (saved) {\n          record.synced = true;\n          record.serverId = saved.id;\n          localStorage.setItem(STORAGE_KEYS.WORK_RECORDS, JSON.stringify(localDataCache));\n        }\n      } catch (error) {\n        console.error('サーバー保存エラー:', error);\n        // ローカル保存は成功しているのでエラーは表示しない\n      }\n    }\n    \n    loadLocalData();\n  }\n\n  // 手動同期の実行\n  async function performManualSync() {\n    const unsyncedRecords = localDataCache.filter(record => !record.synced);\n    \n    if (unsyncedRecords.length === 0) {\n      alert('同期待ちのデータはありません。');\n      return;\n    }\n\n    if (!isOnline) {\n      showError('オフライン状態のため同期できません。');\n      return;\n    }\n\n    let successCount = 0;\n    let failCount = 0;\n\n    for (const record of unsyncedRecords) {\n      try {\n        const saved = await window.aivicApi.save(1, {\n          作業員ID: 'current_user_id',\n          作業日: record.workDate,\n          作業開始時刻: record.startTime,\n          プロジェクト名: record.projectName,\n          作業場所: record.workLocation,\n          作業種別: record.workType,\n          作業内容: record.workContent,\n          進捗状況: record.progress,\n          承認状態: '未承認',\n          作成者ID: 'current_user_id'\n        });\n        \n        if (saved) {\n          record.synced = true;\n          record.serverId = saved.id;\n          successCount++;\n        } else {\n          failCount++;\n        }\n      } catch (error) {\n        console.error('同期エラー:', error);\n        failCount++;\n      }\n    }\n\n    localStorage.setItem(STORAGE_KEYS.WORK_RECORDS, JSON.stringify(localDataCache));\n    loadLocalData();\n    \n    if (failCount === 0) {\n      alert(`${successCount}件のデータを同期しました。`);\n      hideError();\n    } else {\n      showError(`${successCount}件同期成功、${failCount}件失敗しました。`);\n    }\n  }\n\n  // ローカルデータ一覧の表示\n  function renderLocalData() {\n    localDataTbody.innerHTML = localDataCache.map(record => `\n      <tr data-id=\"${record.id}\">\n        <td style=\"padding: 6px 10px;\">${new Date(record.createdAt).toLocaleString()}</td>\n        <td style=\"padding: 6px 10px;\">${record.workContent || '--'}</td>\n        <td style=\"padding: 6px 10px;\">\n          <span style=\"color: ${record.synced ? '#059669' : '#f59e0b'};\">\n            ${record.synced ? '同期済み' : '未同期'}\n          </span>\n        </td>\n        <td style=\"padding: 6px 10px;\">\n          <button class=\"action-btn secondary delete-local-btn\" data-id=\"${record.id}\" style=\"font-size: 11px; padding: 4px 8px;\">削除</button>\n        </td>\n      </tr>\n    `).join('');\n  }\n\n  // エラー表示\n  function showError(message) {\n    errorMessage.textContent = message;\n    errorNotification.style.display = 'block';\n  }\n\n  // エラー非表示\n  function hideError() {\n    errorNotification.style.display = 'none';\n  }\n\n  // ネットワーク接続時の処理\n  function handleOnline() {\n    isOnline = true;\n    updateNetworkStatus();\n    \n    // 自動同期を実行\n    setTimeout(() => {\n      performManualSync();\n    }, 1000);\n  }\n\n  // ネットワーク切断時の処理\n  function handleOffline() {\n    isOnline = false;\n    updateNetworkStatus();\n  }\n\n  // イベントリスナーの設定\n  container.querySelector('#btn-save-settings').addEventListener('click', () => {\n    const newInterval = parseInt(saveIntervalInput.value);\n    \n    if (newInterval < 1) {\n      showError('保存間隔は1秒以上で設定してください。');\n      return;\n    }\n    \n    if (newInterval > 86400) {\n      showError('保存間隔は86400秒以下で設定してください。');\n      return;\n    }\n    \n    currentSaveInterval = newInterval;\n    localStorage.setItem(STORAGE_KEYS.SAVE_INTERVAL, currentSaveInterval.toString());\n    \n    // 自動保存を再開\n    startAutoSave();\n    \n    alert('保存間隔を更新しました。');\n    hideError();\n  });\n\n  container.querySelector('#btn-manual-sync').addEventListener('click', performManualSync);\n\n  container.querySelector('#btn-view-local').addEventListener('click', () => {\n    renderLocalData();\n    localDataSection.style.display = 'block';\n  });\n\n  container.querySelector('#btn-hide-local').addEventListener('click', () => {\n    localDataSection.style.display = 'none';\n  });\n\n  container.querySelector('#btn-retry').addEventListener('click', performAutoSave);\n\n  container.querySelector('#btn-recover-data').addEventListener('click', () => {\n    const recoveryData = localStorage.getItem(STORAGE_KEYS.RECOVERY_DATA);\n    if (recoveryData) {\n      // 復旧データを工数記録画面に渡す（実際の実装では画面間でデータを受け渡し）\n      localStorage.removeItem(STORAGE_KEYS.RECOVERY_DATA);\n      recoverySection.style.display = 'none';\n      alert('データを復旧しました。工数記録画面で確認してください。');\n      window.showScreen('scr-1778907133295');\n    }\n  });\n\n  container.querySelector('#btn-discard-data').addEventListener('click', () => {\n    if (confirm('復旧データを破棄しますか？この操作は取り消せません。')) {\n      localStorage.removeItem(STORAGE_KEYS.RECOVERY_DATA);\n      recoverySection.style.display = 'none';\n    }\n  });\n\n  // ローカルデータの削除\n  container.addEventListener('click', (e) => {\n    const deleteBtn = e.target.closest('.delete-local-btn');\n    if (deleteBtn) {\n      const recordId = deleteBtn.dataset.id;\n      if (confirm('このローカルデータを削除しますか？')) {\n        localDataCache = localDataCache.filter(record => record.id !== recordId);\n        localStorage.setItem(STORAGE_KEYS.WORK_RECORDS, JSON.stringify(localDataCache));\n        loadLocalData();\n        renderLocalData();\n      }\n    }\n  });\n\n  // 初期化実行\n  init();\n}";

        // ローディング表示制御
        window.showLoading = function() {
            document.getElementById('loading-overlay').style.display = 'flex';
        };
        
        window.hideLoading = function() {
            document.getElementById('loading-overlay').style.display = 'none';
        };
    </script>

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
