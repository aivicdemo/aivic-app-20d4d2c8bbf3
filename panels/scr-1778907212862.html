window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックのインポート\n  const { startWorkRecord, endWorkRecord, recordInterruption, validateRequiredFields, \n    detectAnomalousValues, calculateWorkTime, saveWorkData, syncLocalData, \n    getGPSLocation, updateWorkStatus, calculateActualWorkHours, minimizeTapOperations, \n    showConfirmationDialog, checkActiveWorkRecord, validateWorkRecord, detectAnomalousValue, \n    calculateInterruptionTime, calculateProgressRate, analyzeWorkEfficiency, \n    saveWorkDataToCloud, syncLocalDataOnReconnection, checkDataIntegrity, saveToLocalStorage, \n    aggregateDailyWorkData, analyzeWorkPerformance, optimizePersonnelAllocation, \n    calculateProductivityIndicators, generateWeeklyReport, identifyDelayedTasks, \n    generateImprovementInstructions, reportEmergencyResponse, analyzeEmergencyImpact, \n    checkGlobalPersonnelStatus, generatePersonnelReallocation, executeMonthlyAggregation, \n    detectAnomaliesAndGaps, correctWorkData, approveDataCorrections, finalizeMonthlyResults, \n    generateDepartmentalReport, collectPerformanceData, crossReferenceWithSalesData, \n    analyzeProfitabilityByLocation, generateInvestmentJustification, collectMultiLocationData \n  } = window.featureLogic || {};\n\n  const { syncPendingRecords, startWorkRecording, completeWorkRecording } = window.it1Logic || {};\n  const { saveWorkDataToCloud: saveToCloud, syncLocalDataToCloud } = window.it1Br121Logic || {};\n\n  let autoSaveInterval = null;\n  let currentSaveInterval = parseInt(localStorage.getItem('autoSaveInterval') || '30');\n  let localData = JSON.parse(localStorage.getItem('workRecordsLocal') || '[]');\n  let isOnline = navigator.onLine;\n  let retryCount = 0;\n  const maxRetries = 3;\n\n  // 初期化\n  function init() {\n    updateNetworkStatus();\n    updateAutoSaveStatus();\n    updateSaveInterval();\n    updatePendingSyncCount();\n    renderLocalData();\n    startAutoSave();\n    attachEventListeners();\n    \n    // ネットワーク状態監視\n    window.addEventListener('online', handleOnline);\n    window.addEventListener('offline', handleOffline);\n  }\n\n  // イベントリスナー設定\n  function attachEventListeners() {\n    // 保存間隔設定\n    const saveIntervalInput = container.querySelector('[data-testid=\"save-interval\"]');\n    const saveSettingsBtn = container.querySelector('[data-testid=\"save-settings-button\"]');\n    const manualSyncBtn = container.querySelector('[data-testid=\"manual-sync-button\"]');\n    const dataRecoveryBtn = container.querySelector('[data-testid=\"data-recovery-button\"]');\n    \n    if (saveSettingsBtn) {\n      saveSettingsBtn.addEventListener('click', handleSaveSettings);\n    }\n    \n    if (manualSyncBtn) {\n      manualSyncBtn.addEventListener('click', handleManualSync);\n    }\n    \n    if (dataRecoveryBtn) {\n      dataRecoveryBtn.addEventListener('click', handleDataRecovery);\n    }\n\n    if (saveIntervalInput) {\n      saveIntervalInput.addEventListener('change', validateSaveInterval);\n    }\n  }\n\n  // 保存設定処理\n  function handleSaveSettings() {\n    try {\n      const saveIntervalInput = container.querySelector('[data-testid=\"save-interval\"]');\n      const newInterval = parseInt(saveIntervalInput.value);\n      \n      if (newInterval <= 0) {\n        updateSettingsError('保存間隔は1秒以上で設定してください');\n        return;\n      }\n      \n      if (newInterval > 3600) {\n        updateSettingsError('保存間隔は3600秒以下で設定してください');\n        return;\n      }\n      \n      currentSaveInterval = newInterval;\n      localStorage.setItem('autoSaveInterval', newInterval.toString());\n      \n      // 自動保存を再開\n      if (autoSaveInterval) {\n        clearInterval(autoSaveInterval);\n      }\n      startAutoSave();\n      \n      updateSettingsError('');\n      updateAutoSaveStatus('設定を更新しました');\n      \n      if (window.aivicNotify) {\n        window.aivicNotify.success('保存間隔を更新しました');\n      }\n    } catch (error) {\n      console.error('保存設定エラー:', error);\n      if (window.aivicNotify) {\n        window.aivicNotify.error('保存設定の更新に失敗しました');\n      }\n    }\n  }\n\n  // 手動同期処理\n  async function handleManualSync() {\n    try {\n      updateAutoSaveStatus('同期中...');\n      \n      if (!isOnline) {\n        updateAutoSaveStatus('オフライン - 同期できません');\n        if (window.aivicNotify) {\n          window.aivicNotify.error('ネットワークに接続されていません');\n        }\n        return;\n      }\n\n      // ローカルデータを取得\n      const pendingData = JSON.parse(localStorage.getItem('workRecordsLocal') || '[]');\n      const unsyncedData = pendingData.filter(item => !item.synced);\n      \n      if (unsyncedData.length === 0) {\n        updateAutoSaveStatus('同期するデータがありません');\n        return;\n      }\n\n      // 業務ロジックを使用して同期\n      if (syncLocalDataToCloud) {\n        const result = await syncLocalDataToCloud(unsyncedData);\n        if (result.success) {\n          // 同期済みフラグを更新\n          const updatedData = pendingData.map(item => ({\n            ...item,\n            synced: true,\n            syncedAt: new Date().toISOString()\n          }));\n          localStorage.setItem('workRecordsLocal', JSON.stringify(updatedData));\n          \n          updateAutoSaveStatus('同期完了');\n          updatePendingSyncCount();\n          renderLocalData();\n          \n          if (window.aivicNotify) {\n            window.aivicNotify.success(`${unsyncedData.length}件のデータを同期しました`);\n          }\n        } else {\n          throw new Error(result.error || '同期に失敗しました');\n        }\n      } else {\n        // フォールバック処理\n        for (const item of unsyncedData) {\n          await window.aivicApi.save('work_records', item);\n        }\n        \n        const updatedData = pendingData.map(item => ({\n          ...item,\n          synced: true,\n          syncedAt: new Date().toISOString()\n        }));\n        localStorage.setItem('workRecordsLocal', JSON.stringify(updatedData));\n        \n        updateAutoSaveStatus('同期完了');\n        updatePendingSyncCount();\n        renderLocalData();\n        \n        if (window.aivicNotify) {\n          window.aivicNotify.success(`${unsyncedData.length}件のデータを同期しました`);\n        }\n      }\n    } catch (error) {\n      console.error('手動同期エラー:', error);\n      updateAutoSaveStatus('同期エラー');\n      if (window.aivicNotify) {\n        window.aivicNotify.error('データの同期に失敗しました');\n      }\n    }\n  }\n\n  // データ復旧処理\n  async function handleDataRecovery() {\n    try {\n      if (window.aivicNotify) {\n        window.aivicNotify.info('データ復旧を開始します...');\n      }\n\n      // ローカルストレージからデータを復旧\n      const recoveryData = JSON.parse(localStorage.getItem('workRecordsBackup') || '[]');\n      \n      if (recoveryData.length === 0) {\n        if (window.aivicNotify) {\n          window.aivicNotify.warning('復旧可能なデータが見つかりません');\n        }\n        return;\n      }\n\n      // 業務ロジックを使用してデータ整合性をチェック\n      if (checkDataIntegrity) {\n        const integrityResult = checkDataIntegrity(recoveryData);\n        if (!integrityResult.valid) {\n          if (window.aivicNotify) {\n            window.aivicNotify.error('データの整合性に問題があります');\n          }\n          return;\n        }\n      }\n\n      // データを復旧\n      const currentData = JSON.parse(localStorage.getItem('workRecordsLocal') || '[]');\n      const mergedData = [...currentData, ...recoveryData];\n      localStorage.setItem('workRecordsLocal', JSON.stringify(mergedData));\n      \n      localData = mergedData;\n      renderLocalData();\n      updatePendingSyncCount();\n      \n      if (window.aivicNotify) {\n        window.aivicNotify.success(`${recoveryData.length}件のデータを復旧しました`);\n      }\n    } catch (error) {\n      console.error('データ復旧エラー:', error);\n      if (window.aivicNotify) {\n        window.aivicNotify.error('データの復旧に失敗しました');\n      }\n    }\n  }\n\n  // 保存間隔バリデーション\n  function validateSaveInterval() {\n    const saveIntervalInput = container.querySelector('[data-testid=\"save-interval\"]');\n    const value = parseInt(saveIntervalInput.value);\n    \n    if (value <= 0) {\n      updateSettingsError('保存間隔は1秒以上で設定してください');\n    } else if (value > 3600) {\n      updateSettingsError('保存間隔は3600秒以下で設定してください');\n    } else {\n      updateSettingsError('');\n    }\n  }\n\n  // 自動保存開始\n  function startAutoSave() {\n    if (autoSaveInterval) {\n      clearInterval(autoSaveInterval);\n    }\n    \n    autoSaveInterval = setInterval(async () => {\n      await performAutoSave();\n    }, currentSaveInterval * 1000);\n  }\n\n  // 自動保存実行\n  async function performAutoSave() {\n    try {\n      // 現在のフォームデータを取得\n      const formData = collectCurrentFormData();\n      \n      if (!formData || Object.keys(formData).length === 0) {\n        return;\n      }\n\n      // 業務ロジックを使用してデータを保存\n      if (saveToLocalStorage) {\n        const saveResult = saveToLocalStorage(formData);\n        if (saveResult.success) {\n          localData.push({\n            ...formData,\n            id: Date.now(),\n            timestamp: new Date().toISOString(),\n            synced: false\n          });\n          localStorage.setItem('workRecordsLocal', JSON.stringify(localData));\n          \n          updateAutoSaveStatus('保存完了');\n          updatePendingSyncCount();\n          renderLocalData();\n        }\n      } else {\n        // フォールバック処理\n        localData.push({\n          ...formData,\n          id: Date.now(),\n          timestamp: new Date().toISOString(),\n          synced: false\n        });\n        localStorage.setItem('workRecordsLocal', JSON.stringify(localData));\n        \n        updateAutoSaveStatus('保存完了');\n        updatePendingSyncCount();\n        renderLocalData();\n      }\n\n      // オンライン時は自動同期を試行\n      if (isOnline) {\n        await attemptAutoSync();\n      }\n    } catch (error) {\n      console.error('自動保存エラー:', error);\n      updateAutoSaveStatus('保存エラー');\n    }\n  }\n\n  // 現在のフォームデータを収集\n  function collectCurrentFormData() {\n    try {\n      const data = {};\n      \n      // 他の画面からデータを収集\n      const workRecordData = localStorage.getItem('currentWorkRecord');\n      if (workRecordData) {\n        Object.assign(data, JSON.parse(workRecordData));\n      }\n      \n      // セッションストレージからも収集\n      const sessionData = sessionStorage.getItem('workFormData');\n      if (sessionData) {\n        Object.assign(data, JSON.parse(sessionData));\n      }\n      \n      return data;\n    } catch (error) {\n      console.error('フォームデータ収集エラー:', error);\n      return {};\n    }\n  }\n\n  // 自動同期試行\n  async function attemptAutoSync() {\n    try {\n      const unsyncedData = localData.filter(item => !item.synced);\n      \n      if (unsyncedData.length === 0) {\n        return;\n      }\n\n      if (syncLocalDataToCloud) {\n        const result = await syncLocalDataToCloud(unsyncedData);\n        if (result.success) {\n          localData = localData.map(item => ({\n            ...item,\n            synced: true,\n            syncedAt: new Date().toISOString()\n          }));\n          localStorage.setItem('workRecordsLocal', JSON.stringify(localData));\n          \n          updateAutoSaveStatus('同期完了');\n          updatePendingSyncCount();\n          renderLocalData();\n        }\n      }\n    } catch (error) {\n      console.error('自動同期エラー:', error);\n    }\n  }\n\n  // ネットワーク状態更新\n  function updateNetworkStatus() {\n    const networkStatus = container.querySelector('[data-testid=\"network-status\"]');\n    if (networkStatus) {\n      networkStatus.textContent = isOnline ? 'オンライン' : 'オフライン';\n      networkStatus.style.color = isOnline ? 'var(--success)' : 'var(--warning)';\n    }\n  }\n\n  // 自動保存ステータス更新\n  function updateAutoSaveStatus(status = '') {\n    const autoSaveStatus = container.querySelector('[data-testid=\"auto-save-status\"]');\n    if (autoSaveStatus) {\n      if (status) {\n        autoSaveStatus.textContent = status;\n      } else {\n        const lastSave = localStorage.getItem('lastAutoSave');\n        if (lastSave) {\n          const lastSaveTime = new Date(lastSave).toLocaleTimeString();\n          autoSaveStatus.textContent = `最終保存: ${lastSaveTime}`;\n        } else {\n          autoSaveStatus.textContent = '未保存';\n        }\n      }\n    }\n  }\n\n  // 保存間隔表示更新\n  function updateSaveInterval() {\n    const saveIntervalInput = container.querySelector('[data-testid=\"save-interval\"]');\n    if (saveIntervalInput) {\n      saveIntervalInput.value = currentSaveInterval;\n    }\n  }\n\n  // 未同期件数更新\n  function updatePendingSyncCount() {\n    const pendingSyncCount = container.querySelector('[data-testid=\"pending-sync-count\"]');\n    if (pendingSyncCount) {\n      const unsyncedCount = localData.filter(item => !item.synced).length;\n      pendingSyncCount.textContent = unsyncedCount;\n    }\n  }\n\n  // ローカルデータ一覧表示\n  function renderLocalData() {\n    const localDataList = container.querySelector('[data-testid=\"local-data-list\"]');\n    if (!localDataList) return;\n\n    if (localData.length === 0) {\n      localDataList.innerHTML = '<tr><td colspan=\"4\" style=\"text-align: center; color: var(--text-muted);\">データがありません</td></tr>';\n      return;\n    }\n\n    const rows = localData.slice(-10).reverse().map(item => `\n      <tr>\n        <td>${new Date(item.timestamp).toLocaleString()}</td>\n        <td>${item.taskName || item.description || '作業記録'}</td>\n        <td>\n          <span style=\"color: ${item.synced ? 'var(--success)' : 'var(--warning)'};\">\n            ${item.synced ? '同期済み' : '未同期'}\n          </span>\n        </td>\n        <td>\n          ${!item.synced ? '<button onclick=\"syncSingleRecord(' + item.id + ')\" style=\"font-size: 11px; padding: 2px 6px;\">同期</button>' : ''}\n        </td>\n      </tr>\n    `).join('');\n\n    localDataList.innerHTML = rows;\n  }\n\n  // 設定エラー表示更新\n  function updateSettingsError(message) {\n    const settingsError = container.querySelector('[data-testid=\"settings-error\"]');\n    if (settingsError) {\n      settingsError.textContent = message;\n      settingsError.style.display = message ? 'block' : 'none';\n    }\n  }\n\n  // オンライン復帰時の処理\n  async function handleOnline() {\n    isOnline = true;\n    updateNetworkStatus();\n    updateAutoSaveStatus('ネットワーク復旧 - 同期中...');\n    \n    try {\n      await attemptAutoSync();\n    } catch (error) {\n      console.error('復旧時同期エラー:', error);\n    }\n  }\n\n  // オフライン時の処理\n  function handleOffline() {\n    isOnline = false;\n    updateNetworkStatus();\n    updateAutoSaveStatus('オフラインモード');\n  }\n\n  // 単一レコード同期（グローバル関数として定義）\n  window.syncSingleRecord = async function(recordId) {\n    try {\n      const record = localData.find(item => item.id === recordId);\n      if (!record || record.synced) {\n        return;\n      }\n\n      if (!isOnline) {\n        if (window.aivicNotify) {\n          window.aivicNotify.error('ネットワークに接続されていません');\n        }\n        return;\n      }\n\n      await window.aivicApi.save('work_records', record);\n      \n      // 同期済みフラグを更新\n      const updatedData = localData.map(item => \n        item.id === recordId ? { ...item, synced: true, syncedAt: new Date().toISOString() } : item\n      );\n      localStorage.setItem('workRecordsLocal', JSON.stringify(updatedData));\n      localData = updatedData;\n      \n      renderLocalData();\n      updatePendingSyncCount();\n      \n      if (window.aivicNotify) {\n        window.aivicNotify.success('データを同期しました');\n      }\n    } catch (error) {\n      console.error('単一レコード同期エラー:', error);\n      if (window.aivicNotify) {\n        window.aivicNotify.error('データの同期に失敗しました');\n      }\n    }\n  };\n\n  // 初期化実行\n  init();\n\n  // クリーンアップ\n  return function cleanup() {\n    if (autoSaveInterval) {\n      clearInterval(autoSaveInterval);\n    }\n    window.removeEventListener('online', handleOnline);\n    window.removeEventListener('offline', handleOffline);\n  };\n}";

  <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
