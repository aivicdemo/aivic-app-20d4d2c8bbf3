;\n    const solutionEl = container.querySelector('#solution-text');\n\n    if (errorMessageEl) errorMessageEl.textContent = errorData.message;\n    if (errorCodeEl) errorCodeEl.textContent = errorData.code;\n    if (errorTimeEl) errorTimeEl.textContent = errorData.timestamp;\n    \n    if (errorData.solution && solutionEl) {\n      solutionEl.innerHTML = errorData.solution.replace(/\\n/g, '<br>');\n    }\n  }\n\n  // システム障害検知と復旧処理\n  async function handleSystemFailure() {\n    try {\n      if (detectSystemFailure) {\n        const failureData = {\n          timestamp: new Date(),\n          errorCode: errorData.code,\n          message: errorData.message\n        };\n        \n        const isFailure = detectSystemFailure(failureData);\n        if (isFailure && calculateImpactScope) {\n          const impactScope = calculateImpactScope(failureData);\n          console.log('システム障害の影響範囲:', impactScope);\n        }\n      }\n    } catch (error) {\n      console.warn('システム障害検知処理でエラー:', error);\n    }\n  }\n\n  // エラー詳細の取得と表示\n  async function loadErrorDetails() {\n    try {\n      if (!errorData.details) {\n        await new Promise(resolve => setTimeout(resolve, 500));\n        \n        if (!navigator.onLine) {\n          throw new Error('ネットワーク接続がありません');\n        }\n        \n        errorData.details = {\n          stack: `Error: ${errorData.message}\\n    at processWorkRecord (work-record.js:45:12)\\n    at saveRecord (work-record.js:23:8)`,\n          userAgent: navigator.userAgent,\n          url: window.location.href,\n          sessionId: 'sess_' + Math.random().toString(36).substr(2, 9)\n        };\n\n        // データ整合性チェック\n        if (validateDataIntegrityDuringFailure) {\n          const integrityResult = validateDataIntegrityDuringFailure(errorData.details);\n          errorData.details.integrityStatus = integrityResult;\n        }\n      }\n      \n      const detailContent = container.querySelector('[data-testid=\"error-details\"]');\n      if (detailContent) {\n        detailContent.innerHTML = `\n          <div><strong>エラー内容:</strong> ${errorData.message}</div>\n          <div><strong>セッションID:</strong> ${errorData.details.sessionId}</div>\n          <div><strong>発生時刻:</strong> ${errorData.timestamp}</div>\n          <div><strong>URL:</strong> ${errorData.details.url}</div>\n        `;\n        detailContent.style.display = 'block';\n      }\n      \n    } catch (error) {\n      const detailsUnavailable = container.querySelector('[data-testid=\"details-unavailable\"]');\n      if (detailsUnavailable) {\n        detailsUnavailable.textContent = 'エラーの詳細情報を取得できませんでした';\n        detailsUnavailable.style.display = 'block';\n      }\n      console.error('エラー詳細の取得に失敗:', error);\n    }\n  }\n\n  // 再試行処理\n  async function handleRetry() {\n    if (isRetrying) return;\n    \n    isRetrying = true;\n    const retryButton = container.querySelector('[data-testid=\"retry-button\"]');\n    if (retryButton) {\n      retryButton.disabled = true;\n      retryButton.textContent = '再試行中...';\n    }\n\n    try {\n      // システム復旧進捗チェック\n      if (calculateRecoveryProgress) {\n        const recoveryData = {\n          startTime: new Date(Date.now() - 60000),\n          currentTime: new Date(),\n          totalSteps: 5,\n          completedSteps: 3\n        };\n        const progress = calculateRecoveryProgress(recoveryData);\n        console.log('復旧進捗:', progress);\n      }\n\n      // ネットワーク接続チェック\n      if (!navigator.onLine) {\n        throw new Error('ネットワーク接続がありません');\n      }\n\n      // 前の画面に戻る\n      if (window.history.length > 1) {\n        window.history.back();\n      } else {\n        window.location.href = '/panels/scr-main.html';\n      }\n      \n    } catch (error) {\n      const errorMessageEl = container.querySelector('[data-testid=\"error-message\"]');\n      if (errorMessageEl) {\n        errorMessageEl.textContent = '再試行に失敗しました: ' + error.message;\n      }\n      window.aivicNotify?.error('再試行に失敗しました: ' + error.message);\n    } finally {\n      isRetrying = false;\n      if (retryButton) {\n        retryButton.disabled = false;\n        retryButton.textContent = '再試行';\n      }\n    }\n  }\n\n  // 管理者連絡処理\n  async function handleContactAdmin() {\n    try {\n      // 通知方法の決定\n      let notificationMethod = 'email';\n      if (selectNotificationMethod) {\n        const notificationData = {\n          severity: 'high',\n          errorCode: errorData.code,\n          timestamp: new Date()\n        };\n        notificationMethod = selectNotificationMethod(notificationData);\n      }\n\n      const contactData = {\n        errorCode: errorData.code,\n        message: errorData.message,\n        timestamp: errorData.timestamp,\n        userAgent: navigator.userAgent,\n        url: window.location.href,\n        notificationMethod: notificationMethod\n      };\n\n      const response = await window.aivicApi.save('contact', contactData);\n      if (response.success) {\n        window.location.href = '/panels/scr-contact-success.html';\n      } else {\n        throw new Error('連絡の送信に失敗しました');\n      }\n      \n    } catch (error) {\n      const contactError = container.querySelector('[data-testid=\"contact-error\"]');\n      const alternativeContact = container.querySelector('[data-testid=\"alternative-contact\"]');\n      \n      if (contactError) {\n        contactError.textContent = '管理者への連絡に失敗しました';\n        contactError.style.display = 'block';\n      }\n      \n      if (alternativeContact) {\n        alternativeContact.innerHTML = '代替連絡先: <a href=\"tel:03-1234-5678\">03-1234-5678</a>';\n        alternativeContact.style.display = 'block';\n      }\n      \n      window.aivicNotify?.error('管理者への連絡に失敗しました: ' + error.message);\n    }\n  }\n\n  // 戻るボタン処理\n  function handleBack() {\n    if (window.history.length > 1) {\n      window.history.back();\n    } else {\n      window.location.href = '/panels/scr-main.html';\n    }\n  }\n\n  // ホームボタン処理\n  function handleHome() {\n    window.location.href = '/panels/scr-main.html';\n  }\n\n  // イベントハンドラーの設定\n  function setupEventHandlers() {\n    // 再試行ボタン\n    const retryButton = container.querySelector('[data-testid=\"retry-button\"]');\n    if (retryButton) {\n      retryButton.addEventListener('click', handleRetry);\n    }\n\n    // 戻るボタン\n    const backButton = container.querySelector('[data-testid=\"back-button\"]');\n    if (backButton) {\n      backButton.addEventListener('click', handleBack);\n    }\n\n    // ホームボタン\n    const homeButton = container.querySelector('[data-testid=\"home-button\"]');\n    if (homeButton) {\n      homeButton.addEventListener('click', handleHome);\n    }\n\n    // ホームリンク\n    const homeLink = container.querySelector('[data-testid=\"home-link\"]');\n    if (homeLink) {\n      homeLink.addEventListener('click', (e) => {\n        e.preventDefault();\n        handleHome();\n      });\n    }\n\n    // 管理者連絡ボタン\n    const contactAdminButton = container.querySelector('[data-testid=\"contact-admin-button\"]');\n    if (contactAdminButton) {\n      contactAdminButton.addEventListener('click', handleContactAdmin);\n    }\n\n    // エラー詳細表示ボタン\n    const errorDetailsButton = container.querySelector('[data-testid=\"error-details-button\"]');\n    if (errorDetailsButton) {\n      errorDetailsButton.addEventListener('click', loadErrorDetails);\n    }\n  }\n\n  // 初期化処理\n  async function initialize() {\n    try {\n      // エラー情報の表示\n      displayError();\n      \n      // イベントハンドラーの設定\n      setupEventHandlers();\n      \n      // システム障害検知\n      await handleSystemFailure();\n      \n      // オフラインモード判定\n      if (shouldEnableOfflineMode) {\n        const shouldOffline = shouldEnableOfflineMode({\n          networkStatus: navigator.onLine,\n          errorCode: errorData.code\n        });\n        \n        if (shouldOffline) {\n          console.log('オフラインモードを有効化');\n        }\n      }\n      \n    } catch (error) {\n      console.error('初期化処理でエラー:', error);\n      window.aivicNotify?.error('画面の初期化に失敗しました');\n    }\n  }\n\n  // 初期化実行\n  initialize();\n}";

(function() {

  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;

      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }

      save: async function(tableIndex, item) {

        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }

      update: async function(tableIndex, id, changes) {

        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。

  //
  // 防御層:

  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）

  var _aivicNavLastTarget = "";

    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||

    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {

      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);

    _aivicNavLastTarget = targetPath;

    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
