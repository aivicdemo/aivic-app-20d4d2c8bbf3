ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type":"text","required":false,"description":"管理者による対応内容や備考"},{"name":"検出日時","type":"timestamp","required":true,"description":"異常値が検出された日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentUser = { id: 'user-001', name: '田中太郎' };\n  let activeWorks = [];\n  let pausedWorks = [];\n  let workItems = [];\n  \n  // 現在日時更新\n  function updateCurrentDateTime() {\n    const now = new Date();\n    const dateTimeStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;\n    container.querySelector('[data-testid=\"current-datetime\"]').textContent = dateTimeStr;\n  }\n  \n  // 経過時間計算\n  function calculateElapsedTime(startTime) {\n    const now = new Date();\n    const start = new Date(startTime);\n    const diffMs = now - start;\n    const hours = Math.floor(diffMs / (1000 * 60 * 60));\n    const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));\n    return `${hours}時間${minutes}分`;\n  }\n  \n  // 進行中作業一覧描画\n  function renderActiveWorks() {\n    const tbody = container.querySelector('#active-works-tbody');\n    if (activeWorks.length === 0) {\n      tbody.innerHTML = '<tr><td colspan=\"5\" style=\"padding: 20px; text-align: center; color: var(--text-muted); font-size: 12px;\">進行中の作業はありません</td></tr>';\n      return;\n    }\n    \n    tbody.innerHTML = activeWorks.map(work => {\n      const startTime = new Date(work.作業開始時刻).toLocaleString('ja-JP', { \n        month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' \n      });\n      const elapsed = calculateElapsedTime(work.作業開始時刻);\n      return `\n        <tr data-id=\"${work.作業記録ID}\">\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${work.作業内容 || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${startTime}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${elapsed}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${work.作業場所 || ''}</td>\n          <td style=\"padding: 6px 10px; text-align: center;\">\n            <button class=\"action-btn secondary pause-btn\" data-id=\"${work.作業記録ID}\" style=\"padding: 4px 8px; font-size: 12px;\">中断</button>\n            <button class=\"action-btn end-btn\" data-id=\"${work.作業記録ID}\" style=\"padding: 4px 8px; font-size: 12px; margin-left: 4px;\">終了</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n  }\n  \n  // 中断中作業一覧描画\n  function renderPausedWorks() {\n    const tbody = container.querySelector('#paused-works-tbody');\n    if (pausedWorks.length === 0) {\n      tbody.innerHTML = '<tr><td colspan=\"5\" style=\"padding: 20px; text-align: center; color: var(--text-muted); font-size: 12px;\">中断中の作業はありません</td></tr>';\n      return;\n    }\n    \n    tbody.innerHTML = pausedWorks.map(work => {\n      const pauseTime = new Date(work.中断開始日時).toLocaleString('ja-JP', { \n        month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' \n      });\n      return `\n        <tr data-id=\"${work.中断記録ID}\">\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${work.作業内容 || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${pauseTime}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${work.中断理由詳細 || work.中断理由区分 || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${work.作業場所 || ''}</td>\n          <td style=\"padding: 6px 10px; text-align: center;\">\n            <button class=\"action-btn resume-btn\" data-id=\"${work.中断記録ID}\" data-work-id=\"${work.作業記録ID}\" style=\"padding: 4px 8px; font-size: 12px;\">再開</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n  }\n  \n  // 作業項目選択肢描画\n  function renderWorkItems() {\n    const select = container.querySelector('#work-item-select');\n    const currentOptions = select.innerHTML;\n    const newOptions = '<option value=\"\">作業項目を選択してください</option>' + \n      workItems.map(item => `<option value=\"${item.作業項目ID}\">${item.作業項目名}</option>`).join('');\n    if (currentOptions !== newOptions) {\n      select.innerHTML = newOptions;\n    }\n  }\n  \n  // エラーメッセージ表示\n  function showError(message) {\n    const errorDiv = container.querySelector('#error-message');\n    errorDiv.textContent = message;\n    errorDiv.classList.remove('hidden');\n    setTimeout(() => {\n      errorDiv.classList.add('hidden');\n    }, 5000);\n  }\n  \n  // 確認ダイアログ表示\n  function showConfirm(title, message) {\n    return new Promise((resolve) => {\n      const dialog = container.querySelector('#confirm-dialog');\n      container.querySelector('#confirm-title').textContent = title;\n      container.querySelector('#confirm-message').textContent = message;\n      dialog.classList.remove('hidden');\n      \n      const handleConfirm = (result) => {\n        dialog.classList.add('hidden');\n        container.querySelector('#confirm-ok').removeEventListener('click', okHandler);\n        container.querySelector('#confirm-cancel').removeEventListener('click', cancelHandler);\n        resolve(result);\n      };\n      \n      const okHandler = () => handleConfirm(true);\n      const cancelHandler = () => handleConfirm(false);\n      \n      container.querySelector('#confirm-ok').addEventListener('click', okHandler);\n      container.querySelector('#confirm-cancel').addEventListener('click', cancelHandler);\n    });\n  }\n  \n  // データ読み込み\n  async function loadData() {\n    try {\n      // 作業項目マスタ読み込み\n      const workItemsData = await window.aivicApi.list(3);\n      if (workItemsData) {\n        workItems = workItemsData.filter(item => item.有効フラグ);\n        renderWorkItems();\n      }\n      \n      // 作業記録読み込み（進行中）\n      const workRecords = await window.aivicApi.list(1);\n      if (workRecords) {\n        activeWorks = workRecords.filter(record => \n          record.作業員ID === currentUser.id && \n          record.進捗状況 === '作業中' && \n          !record.作業終了時刻\n        );\n        renderActiveWorks();\n      }\n      \n      // 中断記録読み込み\n      const pauseRecords = await window.aivicApi.list(2);\n      if (pauseRecords) {\n        pausedWorks = pauseRecords.filter(record => \n          record.記録者ID === currentUser.id && \n          record.対応状況 === '対応中' && \n          !record.中断終了日時\n        );\n        renderPausedWorks();\n      }\n    } catch (error) {\n      console.error('データ読み込みエラー:', error);\n    }\n  }\n  \n  // 初期化\n  updateCurrentDateTime();\n  setInterval(updateCurrentDateTime, 60000); // 1分ごとに更新\n  setInterval(() => {\n    if (activeWorks.length > 0) {\n      renderActiveWorks(); // 経過時間更新のため\n    }\n  }, 30000); // 30秒ごとに更新\n  \n  // 初期データ読み込み\n  if (tables && tables.length > 0) {\n    // 作業項目マスタ\n    if (tables[3] && tables[3].records) {\n      workItems = tables[3].records.filter(item => item.有効フラグ);\n      renderWorkItems();\n    }\n    \n    // 作業記録\n    if (tables[1] && tables[1].records) {\n      activeWorks = tables[1].records.filter(record => \n        record.作業員ID === currentUser.id && \n        record.進捗状況 === '作業中' && \n        !record.作業終了時刻\n      );\n      renderActiveWorks();\n    }\n    \n    // 中断記録\n    if (tables[2] && tables[2].records) {\n      pausedWorks = tables[2].records.filter(record => \n        record.記録者ID === currentUser.id && \n        record.対応状況 === '対応中' && \n        !record.中断終了日時\n      );\n      renderPausedWorks();\n    }\n  }\n  \n  loadData();\n  \n  // 備考文字数カウンター\n  const notesInput = container.querySelector('#work-notes-input');\n  const notesCounter = container.querySelector('#notes-counter');\n  notesInput.addEventListener('input', () => {\n    notesCounter.textContent = notesInput.value.length;\n  });\n  \n  // 作業開始ボタン\n  container.querySelector('#btn-start-work').addEventListener('click', async () => {\n    const workItemId = container.querySelector('#work-item-select').value;\n    const workLocation = container.querySelector('#work-location-input').value.trim();\n    const workNotes = container.querySelector('#work-notes-input').value.trim();\n    \n    // バリデーション\n    if (!workItemId) {\n      showError('作業項目を選択してください');\n      return;\n    }\n    \n    // 複数作業同時開始制御\n    if (activeWorks.length > 0) {\n      showError('既に実行中の作業があります。同時に複数の作業を開始することはできません。');\n      return;\n    }\n    \n    // 作業場所文字数チェック\n    if (workLocation.length > 100) {\n      showError('作業場所は100文字以内で入力してください');\n      return;\n    }\n    \n    // 備考文字数チェック\n    if (workNotes.length > 500) {\n      showError('備考は500文字以内で入力してください');\n      return;\n    }\n    \n    // 不正文字チェック\n    if (/<script|javascript:|on\\w+=/i.test(workLocation)) {\n      showError('作業場所に不正な文字が含まれています');\n      return;\n    }\n    \n    const selectedWorkItem = workItems.find(item => item.作業項目ID === workItemId);\n    if (!selectedWorkItem) {\n      showError('選択された作業項目が見つかりません');\n      return;\n    }\n    \n    const now = new Date();\n    const workRecord = {\n      作業記録ID: `work-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,\n      作業員ID: currentUser.id,\n      作業日: now,\n      作業開始時刻: now,\n      作業終了時刻: null,\n      作業時間: null,\n      プロジェクト名: selectedWorkItem.作業項目名,\n      作業場所: workLocation || null,\n      作業種別: selectedWorkItem.カテゴリ || '一般作業',\n      作業内容: selectedWorkItem.作業項目名,\n      進捗状況: '作業中',\n      備考: workNotes || null,\n      承認状態: '未承認',\n      承認者ID: null,\n      承認日時: null,\n      作成日時: now,\n      更新日時: now,\n      作成者ID: currentUser.id\n    };\n    \n    const saved = await window.aivicApi.save(1, workRecord);\n    if (saved) {\n      // フォームクリア\n      container.querySelector('#work-item-select').value = '';\n      container.querySelector('#work-location-input').value = '';\n      container.querySelector('#work-notes-input').value = '';\n      notesCounter.textContent = '0';\n      \n      // データ再読み込み\n      await loadData();\n      \n      // 工数入力画面に遷移\n      window.showScreen(\"scr-1778907296658\");\n    }\n  });\n  \n  // クリアボタン\n  container.querySelector('#btn-clear').addEventListener('click', () => {\n    container.querySelector('#work-item-select').value = '';\n    container.querySelector('#work-location-input').value = '';\n    container.querySelector('#work-notes-input').value = '';\n    notesCounter.textContent = '0';\n  });\n  \n  // 設定ボタン\n  container.querySelector('#btn-settings').addEventListener('click', () => {\n    showError('設定機能は準備中です');\n  });\n  \n  // ログアウトボタン\n  container.querySelector('#btn-logout').addEventListener('click', async () => {\n    const confirmed = await showConfirm('ログアウト', 'ログアウトしますか？');\n    if (confirmed) {\n      window.location.href = './login.html';\n    }\n  });\n  \n  // 作業操作（中断・終了・再開）\n  container.addEventListener('click', async (e) => {\n    // 中断ボタン\n    const pauseBtn = e.target.closest('.pause-btn');\n    if (pauseBtn) {\n      const workId = pauseBtn.dataset.id;\n      const confirmed = await showConfirm('作業中断', '作業を中断しますか？');\n      if (confirmed) {\n        const now = new Date();\n        const pauseRecord = {\n          中断記録ID: `pause-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,\n          作業記録ID: workId,\n          中断開始日時: now,\n          中断終了日時: null,\n          中断理由区分: '一時中断',\n          中断理由詳細: '作業員による中断',\n          中断時間: null,\n          影響度: '軽微',\n          対応状況: '対応中',\n          記録者ID: currentUser.id,\n          作成日時: now,\n          更新日時: now\n        };\n        \n        const saved = await window.aivicApi.save(2, pauseRecord);\n        if (saved) {\n          // 作業記録の進捗状況を更新\n          await window.aivicApi.update(1, workId, { 進捗状況: '中断' });\n          await loadData();\n        }\n      }\n      return;\n    }\n    \n    // 終了ボタン\n    const endBtn = e.target.closest('.end-btn');\n    if (endBtn) {\n      const workId = endBtn.dataset.id;\n      const confirmed = await showConfirm('作業終了', '作業を終了しますか？');\n      if (confirmed) {\n        const now = new Date();\n        const work = act     <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();
