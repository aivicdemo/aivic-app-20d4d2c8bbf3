window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentUser = { id: 'user-001', name: '田中 太郎' };\n  let selectedResumeWorkId = null;\n\n  // 現在日時更新\n  function updateDateTime() {\n    const now = new Date();\n    const dateStr = now.getFullYear() + '/' + \n                   String(now.getMonth() + 1).padStart(2, '0') + '/' + \n                   String(now.getDate()).padStart(2, '0') + ' ' +\n                   String(now.getHours()).padStart(2, '0') + ':' + \n                   String(now.getMinutes()).padStart(2, '0');\n    container.querySelector('[data-testid=\"current-datetime\"]').textContent = dateStr;\n  }\n\n  // 作業項目選択肢を読み込み\n  async function loadWorkItems() {\n    const workItems = await window.aivicApi.list(3); // 作業項目マスタ\n    const select = container.querySelector('#work-item-select');\n    select.innerHTML = '<option value=\"\">-- 作業項目を選択 --</option>';\n    \n    if (workItems) {\n      workItems\n        .filter(item => item.有効フラグ)\n        .sort((a, b) => (a.表示順序 || 0) - (b.表示順序 || 0))\n        .forEach(item => {\n          const option = document.createElement('option');\n          option.value = item.作業項目ID;\n          option.textContent = `${item.作業項目コード} - ${item.作業項目名}`;\n          select.appendChild(option);\n        });\n    }\n  }\n\n  // 進行中作業一覧を描画\n  function renderActiveWorks(works) {\n    const container_el = container.querySelector('#active-works-list');\n    if (!works || works.length === 0) {\n      container_el.innerHTML = '<div class=\"no-active-works\" style=\"font-size: 12px; color: var(--text-muted); text-align: center; padding: 12px;\">進行中の作業はありません</div>';\n      return;\n    }\n\n    container_el.innerHTML = works.map(work => {\n      const startTime = new Date(work.作業開始時刻);\n      const elapsed = Math.floor((Date.now() - startTime.getTime()) / 60000);\n      const elapsedStr = elapsed < 60 ? `${elapsed}分` : `${Math.floor(elapsed/60)}時間${elapsed%60}分`;\n      \n      return `\n        <div class=\"work-item\" style=\"padding: 8px; background: rgba(0,0,0,0.15); border-radius: 4px; margin-bottom: 8px; border-left: 3px solid var(--primary);\">\n          <div style=\"font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 2px;\">${work.プロジェクト名}</div>\n          <div style=\"font-size: 11px; color: var(--text-muted);\">\n            開始: ${startTime.getHours().toString().padStart(2,'0')}:${startTime.getMinutes().toString().padStart(2,'0')} | \n            経過: ${elapsedStr}\n          </div>\n          ${work.作業場所 ? `<div style=\"font-size: 11px; color: var(--text-muted);\">場所: ${work.作業場所}</div>` : ''}\n        </div>\n      `;\n    }).join('');\n  }\n\n  // 中断中作業一覧を描画\n  function renderSuspendedWorks(works) {\n    const container_el = container.querySelector('#suspended-works-list');\n    if (!works || works.length === 0) {\n      container_el.innerHTML = '<div class=\"no-suspended-works\" style=\"font-size: 12px; color: var(--text-muted); text-align: center; padding: 12px;\">中断中の作業はありません</div>';\n      return;\n    }\n\n    container_el.innerHTML = works.map(work => {\n      const startTime = new Date(work.作業開始時刻);\n      return `\n        <div class=\"work-item\" style=\"padding: 8px; background: rgba(0,0,0,0.15); border-radius: 4px; margin-bottom: 8px; border-left: 3px solid #ff9500;\">\n          <div style=\"font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 2px;\">${work.プロジェクト名}</div>\n          <div style=\"font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">\n            開始: ${startTime.getHours().toString().padStart(2,'0')}:${startTime.getMinutes().toString().padStart(2,'0')}\n          </div>\n          ${work.作業場所 ? `<div style=\"font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">場所: ${work.作業場所}</div>` : ''}\n          <button class=\"action-btn resume-btn\" data-id=\"${work.作業記録ID}\" style=\"background: #ff9500; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;\">再開</button>\n        </div>\n      `;\n    }).join('');\n  }\n\n  // 作業状況を読み込み\n  async function loadWorkStatus() {\n    const workRecords = await window.aivicApi.list(1); // 作業記録\n    if (!workRecords) return;\n\n    const activeWorks = workRecords.filter(work => \n      work.作業員ID === currentUser.id && work.進捗状況 === '作業中'\n    );\n    \n    const suspendedWorks = workRecords.filter(work => \n      work.作業員ID === currentUser.id && work.進捗状況 === '中断'\n    );\n\n    renderActiveWorks(activeWorks);\n    renderSuspendedWorks(suspendedWorks);\n  }\n\n  // エラーメッセージ表示\n  function showError(message) {\n    const errorEl = container.querySelector('#error-message');\n    errorEl.textContent = message;\n    errorEl.style.display = 'block';\n    setTimeout(() => {\n      errorEl.style.display = 'none';\n    }, 5000);\n  }\n\n  // バリデーション\n  function validateForm() {\n    const workItemId = container.querySelector('#work-item-select').value;\n    const location = container.querySelector('#work-location-input').value.trim();\n    const notes = container.querySelector('#work-notes-input').value.trim();\n\n    if (!workItemId) {\n      showError('作業項目を選択してください');\n      return false;\n    }\n\n    if (location.length > 100) {\n      showError('作業場所は100文字以内で入力してください');\n      return false;\n    }\n\n    if (notes.length > 500) {\n      showError('備考は500文字以内で入力してください');\n      return false;\n    }\n\n    // XSS対策の簡易チェック\n    if (location.includes('<script>') || notes.includes('<script>')) {\n      showError('不正な文字が含まれています');\n      return false;\n    }\n\n    return true;\n  }\n\n  // 複数作業同時開始チェック\n  async function checkActiveWorks() {\n    const workRecords = await window.aivicApi.list(1);\n    if (!workRecords) return true;\n\n    const activeWorks = workRecords.filter(work => \n      work.作業員ID === currentUser.id && work.進捗状況 === '作業中'\n    );\n\n    if (activeWorks.length > 0) {\n      showError('既に実行中の作業があります。同時に複数の作業を開始することはできません。');\n      return false;\n    }\n\n    return true;\n  }\n\n  // 作業開始処理\n  async function startWork() {\n    if (!validateForm()) return;\n    if (!await checkActiveWorks()) return;\n\n    const workItemId = container.querySelector('#work-item-select').value;\n    const location = container.querySelector('#work-location-input').value.trim();\n    const notes = container.querySelector('#work-notes-input').value.trim();\n\n    // 作業項目情報を取得\n    const workItems = await window.aivicApi.list(3);\n    const selectedWorkItem = workItems?.find(item => item.作業項目ID === workItemId);\n    \n    if (!selectedWorkItem) {\n      showError('選択された作業項目が見つかりません');\n      return;\n    }\n\n    const workRecord = {\n      作業員ID: currentUser.id,\n      作業日: new Date().toISOString().split('T')[0],\n      作業開始時刻: new Date().toISOString(),\n      作業終了時刻: null,\n      作業時間: null,\n      プロジェクト名: selectedWorkItem.作業項目名,\n      作業場所: location || '',\n      作業種別: selectedWorkItem.カテゴリ || '一般作業',\n      作業内容: notes || '',\n      進捗状況: '作業中',\n      備考: notes || '',\n      承認状態: '未承認',\n      承認者ID: null,\n      承認日時: null,\n      作成者ID: currentUser.id\n    };\n\n    const saved = await window.aivicApi.save(1, workRecord);\n    if (saved) {\n      // フォームクリア\n      container.querySelector('#work-item-select').value = '';\n      container.querySelector('#work-location-input').value = '';\n      container.querySelector('#work-notes-input').value = '';\n      container.querySelector('.char-counter').textContent = '0/500';\n      \n      // 作業状況を更新\n      await loadWorkStatus();\n      \n      // 工数入力画面に遷移\n      window.showScreen(\"scr-1778907296658\");\n    }\n  }\n\n  // 作業再開処理\n  async function resumeWork(workId) {\n    const workRecords = await window.aivicApi.list(1);\n    const work = workRecords?.find(w => w.作業記録ID === workId);\n    \n    if (!work) {\n      showError('指定された作業が見つかりません');\n      return;\n    }\n\n    if (!await checkActiveWorks()) return;\n\n    const updated = await window.aivicApi.update(1, workId, {\n      進捗状況: '作業中',\n      更新日時: new Date().toISOString()\n    });\n\n    if (updated) {\n      await loadWorkStatus();\n      // モーダルを閉じる\n      container.querySelector('#resume-modal').style.display = 'none';\n      \n      // 工数入力画面に遷移\n      window.showScreen(\"scr-1778907296658\");\n    }\n  }\n\n  // 文字数カウンター更新\n  function updateCharCounter() {\n    const textarea = container.querySelector('#work-notes-input');\n    const counter = container.querySelector('.char-counter');\n    counter.textContent = `${textarea.value.length}/500`;\n  }\n\n  // 初期化\n  updateDateTime();\n  setInterval(updateDateTime, 60000); // 1分ごとに更新\n  \n  loadWorkItems();\n  loadWorkStatus();\n\n  // イベントリスナー\n  container.querySelector('#start-work-button').addEventListener('click', startWork);\n  \n  container.querySelector('#work-notes-input').addEventListener('input', updateCharCounter);\n\n  // 設定ボタン\n  container.querySelector('[data-testid=\"settings-button\"]').addEventListener('click', () => {\n    // 設定画面への遷移（実装されていない場合の仮処理）\n    alert('設定画面は準備中です');\n  });\n\n  // ログアウトボタン\n  container.querySelector('[data-testid=\"logout-button\"]').addEventListener('click', () => {\n    if (confirm('ログアウトしますか？')) {\n      window.location.href = './login.html';\n    }\n  });\n\n  // 再開ボタンのイベントデリゲーション\n  container.addEventListener('click', (e) => {\n    const resumeBtn = e.target.closest('.resume-btn');\n    if (resumeBtn) {\n      selectedResumeWorkId = resumeBtn.dataset.id;\n      container.querySelector('#resume-modal').style.display = 'block';\n    }\n  });\n\n  // モーダルイベント\n  container.querySelector('#resume-confirm-btn').addEventListener('click', () => {\n    if (selectedResumeWorkId) {\n      resumeWork(selectedResumeWorkId);\n    }\n  });\n\n  container.querySelector('#resume-cancel-btn').addEventListener('click', () => {\n    container.querySelector('#resume-modal').style.display = 'none';\n    selectedResumeWorkId = null;\n  });\n\n  // モーダル背景クリックで閉じる\n  container.querySelector('#resume-modal').addEventListener('click', (e) => {\n    if (e.target === container.querySelector('#resume-modal')) {\n      container.querySelector('#resume-modal').style.display = 'none';\n      selectedResumeWorkId = null;\n    }\n  });\n}";
</script>

(function() {

    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
