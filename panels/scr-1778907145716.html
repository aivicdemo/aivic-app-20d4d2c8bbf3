    <style>
        :root {
            --primary: #4a9eff;
            --primary-hover: #3a8eef;
            --bg-main: #0f0f0f;
            --bg-card: #1a1a1a;

            --border: #2a2a2a;
            --text: #e8e8e8;
            --text-muted: #9a9a9a;
            --top-bar-bg: #161616;
            --top-bar-border: #252525;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            height: 52px;
        }

        .logo {
            width: 24px;
            height: 24px;
            background: var(--primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: white;
        }

        .app-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-section {
            padding: 16px 12px 8px;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            padding: 0 8px;

        .nav-item {

            padding: 8px 12px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 400;
            margin-bottom: 2px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        .nav-item.aivic-active {
            background: var(--primary);
            color: white;
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .breadcrumb-current {
            color: var(--text);
            font-weight: 500;
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .logout-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: color 0.15s ease;
        }

        .logout-link:hover {
            color: var(--text);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quick-action-btn {
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .quick-action-btn:hover {
            border-color: var(--primary);
            background: rgba(74, 158, 255, 0.1);
        }

        .quick-action-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .quick-action-btn.primary:hover {
            background: var(--primary-hover);
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-height: 400px;
            padding: 0;
        }

        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .nav-emergency {
            margin-top: auto;
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        .emergency-btn {
            width: 100%;
            padding: 10px 12px;
            background: var(--error);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        .emergency-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
            
            .quick-actions {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  const tbody = container.querySelector(\"#work-history-tbody\");\n  const noResults = container.querySelector(\"#no-results\");\n  const errorMessage = container.querySelector(\"#error-message\");\n  const workItemSelect = container.querySelector(\"#filter-work-item\");\n  \n  let allWorkRecords = [];\n  let allWorkItems = [];\n  let allInterruptions = [];\n\n  // エラーメッセージ表示関数\n  function showError(message) {\n    errorMessage.textContent = message;\n    errorMessage.classList.remove(\"hidden\");\n    setTimeout(() => {\n      errorMessage.classList.add(\"hidden\");\n    }, 5000);\n  }\n\n  // 日付バリデーション関数\n  function validateDateRange(startDate, endDate) {\n    if (!startDate || !endDate) {\n      return \"日付範囲を選択してください\";\n    }\n    \n    const start = new Date(startDate);\n    const end = new Date(endDate);\n    const today = new Date();\n    today.setHours(23, 59, 59, 999);\n    \n    if (start > today || end > today) {\n      return \"未来日付は選択できません\";\n    }\n    \n    if (start > end) {\n      return \"開始日は終了日より前の日付を入力してください\";\n    }\n    \n    const oneYear = 365 * 24 * 60 * 60 * 1000;\n    if (end - start > oneYear) {\n      return \"1年以上の期間は選択できません\";\n    }\n    \n    return null;\n  }\n\n  // 中断回数を計算する関数\n  function getInterruptionCount(workRecordId) {\n    return allInterruptions.filter(interruption => \n      interruption.作業記録ID === workRecordId\n    ).length;\n  }\n\n  // 作業時間をフォーマットする関数\n  function formatWorkTime(minutes) {\n    if (!minutes) return \"-\";\n    const hours = Math.floor(minutes / 60);\n    const mins = minutes % 60;\n    return `${hours}:${mins.toString().padStart(2, '0')}`;\n  }\n\n  // 日時フォーマット関数\n  function formatDateTime(dateTimeStr) {\n    if (!dateTimeStr) return \"-\";\n    const date = new Date(dateTimeStr);\n    return date.toLocaleString('ja-JP', {\n      year: 'numeric',\n      month: '2-digit',\n      day: '2-digit',\n      hour: '2-digit',\n      minute: '2-digit'\n    });\n  }\n\n  // 時刻フォーマット関数\n  function formatTime(dateTimeStr) {\n    if (!dateTimeStr) return \"-\";\n    const date = new Date(dateTimeStr);\n    return date.toLocaleString('ja-JP', {\n      hour: '2-digit',\n      minute: '2-digit'\n    });\n  }\n\n  // テーブル再描画関数\n  function renderRows(rows) {\n    if (rows.length === 0) {\n      tbody.innerHTML = \"\";\n      noResults.classList.remove(\"hidden\");\n      return;\n    }\n    \n    noResults.classList.add(\"hidden\");\n    tbody.innerHTML = rows.map(record => {\n      const workItem = allWorkItems.find(item => item.作業項目ID === record.作業項目ID);\n      const interruptionCount = getInterruptionCount(record.作業記録ID);\n      \n      return `\n        <tr data-id=\"${record.作業記録ID}\" style=\"height: 34px;\">\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${formatDateTime(record.作業日)}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${workItem ? workItem.作業項目名 : record.作業種別 || \"-\"}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${formatTime(record.作業開始時刻)}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${formatTime(record.作業終了時刻)}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${formatWorkTime(record.作業時間)}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); text-align: center;\">${interruptionCount}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            <span style=\"padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 500; \n              ${record.進捗状況 === '完了' ? 'background: rgba(34, 197, 94, 0.2); color: #86efac;' : \n                record.進捗状況 === '作業中' ? 'background: rgba(59, 130, 246, 0.2); color: #93c5fd;' : \n                'background: rgba(245, 158, 11, 0.2); color: #fbbf24;'}\">${record.進捗状況}</span>\n          </td>\n          <td style=\"padding: 6px 10px;\">\n            <button class=\"action-btn secondary detail-btn\" data-id=\"${record.作業記録ID}\" style=\"font-size: 11px; padding: 4px 8px;\">詳細確認</button>\n          </td>\n        </tr>\n      `;\n    }).join(\"\");\n  }\n\n  // 作業項目セレクトボックスを更新\n  function updateWorkItemSelect() {\n    workItemSelect.innerHTML = '<option value=\"\">すべて</option>';\n    allWorkItems.forEach(item => {\n      workItemSelect.innerHTML += `<option value=\"${item.作業項目ID}\">${item.作業項目名}</option>`;\n    });\n  }\n\n  // フィルタリング関数\n  function filterRecords() {\n    const startDate = container.querySelector(\"#filter-start-date\").value;\n    const endDate = container.querySelector(\"#filter-end-date\").value;\n    const workItemId = container.querySelector(\"#filter-work-item\").value;\n    const status = container.querySelector(\"#filter-status\").value;\n\n    let filtered = [...allWorkRecords];\n\n    // 日付範囲フィルター\n    if (startDate && endDate) {\n      const validation = validateDateRange(startDate, endDate);\n      if (validation) {\n        showError(validation);\n        return;\n      }\n      \n      filtered = filtered.filter(record => {\n        const recordDate = new Date(record.作業日).toISOString().split('T')[0];\n        return recordDate >= startDate && recordDate <= endDate;\n      });\n    } else if (startDate || endDate) {\n      showError(\"日付範囲を選択してください\");\n      return;\n    }\n\n    // 作業項目フィルター\n    if (workItemId) {\n      filtered = filtered.filter(record => record.作業項目ID === workItemId);\n    }\n\n    // 作業状況フィルター\n    if (status) {\n      filtered = filtered.filter(record => record.進捗状況 === status);\n    }\n\n    // 日付降順でソート\n    filtered.sort((a, b) => new Date(b.作業日) - new Date(a.作業日));\n\n    renderRows(filtered);\n  }\n\n  // CSVエクスポート関数\n  function exportCSV() {\n    const headers = ['作業日時', '作業項目名', '開始時刻', '終了時刻', '作業時間', '中断回数', '進捗状況', '作業内容', '作業場所'];\n    const csvData = [headers];\n    \n    allWorkRecords.forEach(record => {\n      const workItem = allWorkItems.find(item => item.作業項目ID === record.作業項目ID);\n      const interruptionCount = getInterruptionCount(record.作業記録ID);\n      \n      csvData.push([\n        formatDateTime(record.作業日),\n        workItem ? workItem.作業項目名 : record.作業種別 || \"\",\n        formatTime(record.作業開始時刻),\n        formatTime(record.作業終了時刻),\n        formatWorkTime(record.作業時間),\n        interruptionCount,\n        record.進捗状況 || \"\",\n        record.作業内容 || \"\",\n        record.作業場所 || \"\"\n      ]);\n    });\n\n    const csvContent = \"\\uFEFF\" + csvData.map(row => \n      row.map(field => `\"${String(field).replace(/\"/g, '\"\"')}\"`).join(\",\")\n    ).join(\"\\n\");\n\n    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement(\"a\");\n    link.href = URL.createObjectURL(blob);\n    link.download = `作業履歴一覧_${new Date().toISOString().split('T')[0]}.csv`;\n    link.click();\n  }\n\n  // 初期データ読み込み\n  async function loadInitialData() {\n    try {\n      // 作業記録データ\n      const workRecords = await window.aivicApi.list(1);\n      if (workRecords) {\n        allWorkRecords = workRecords;\n      } else {\n        allWorkRecords = tables[1]?.records || [];\n      }\n\n      // 作業項目マスタ\n      const workItems = await window.aivicApi.list(3);\n      if (workItems) {\n        allWorkItems = workItems;\n      } else {\n        allWorkItems = tables[3]?.records || [];\n      }\n\n      // 中断記録\n      const interruptions = await window.aivicApi.list(2);\n      if (interruptions) {\n        allInterruptions = interruptions;\n      } else {\n        allInterruptions = tables[2]?.records || [];\n      }\n\n      updateWorkItemSelect();\n      \n      // 日付降順でソート\n      allWorkRecords.sort((a, b) => new Date(b.作業日) - new Date(a.作業日));\n      renderRows(allWorkRecords);\n    } catch (error) {\n      console.error(\"データ読み込みエラー:\", error);\n      // フォールバック: 初期データを使用\n      allWorkRecords = tables[1]?.records || [];\n      allWorkItems = tables[3]?.records || [];\n      allInterruptions = tables[2]?.records || [];\n      updateWorkItemSelect();\n      allWorkRecords.sort((a, b) => new Date(b.作業日) - new Date(a.作業日));\n      renderRows(allWorkRecords);\n    }\n  }\n\n  // 検索ボタンイベント\n  container.querySelector(\"#btn-search\").addEventListener(\"click\", filterRecords);\n\n  // リセットボタンイベント\n  container.querySelector(\"#btn-reset\").addEventListener(\"click\", () => {\n    container.querySelector(\"#filter-start-date\").value = \"\";\n    container.querySelector(\"#filter-end-date\").value = \"\";\n    container.querySelector(\"#filter-work-item\").value = \"\";\n    container.querySelector(\"#filter-status\").value = \"\";\n    errorMessage.classList.add(\"hidden\");\n    allWorkRecords.sort((a, b) => new Date(b.作業日) - new Date(a.作業日));\n    renderRows(allWorkRecords);\n  });\n\n  // CSVエクスポートボタンイベント\n  container.querySelector(\"#btn-export\").addEventListener(\"click\", exportCSV);\n\n  // 画面遷移ボタンイベント\n  container.querySelector(\"#btn-extract\").addEventListener(\"click\", () => {\n    window.showScreen(\"scr-1778907353387\");\n  });\n\n  container.querySelector(\"#btn-back\").addEventListener(\"click\", () => {\n    window.showScreen(\"scr-1778907133295\");\n  });\n\n  // 行レベル操作のイベントデリゲーション\n  container.addEventListener(\"click\", (e) => {\n    const detailBtn = e.target.closest(\".detail-btn\");\n    if (detailBtn) {\n      window.showScreen(\"scr-1778907367889\");\n    }\n  });\n\n  // 初期データ読み込み実行\n  loadInitialData();\n}";

        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
