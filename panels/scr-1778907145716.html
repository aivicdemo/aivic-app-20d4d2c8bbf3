ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type":"text","required":false,"description":"管理者による対応内容や備考"},{"name":"検出日時","type":"timestamp","required":true,"description":"異常値が検出された日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  const tbody = container.querySelector('#work-history-tbody');\n  const resultCount = container.querySelector('#result-count');\n  const noResults = container.querySelector('#no-results');\n  const errorMessage = container.querySelector('#error-message');\n  const workItemSelect = container.querySelector('#select-work-item');\n  const workerSelect = container.querySelector('#select-worker');\n  \n  let allWorkRecords = [];\n  let allUsers = [];\n  let allWorkItems = [];\n  let allInterruptions = [];\n\n  // エラー表示関数\n  function showError(message) {\n    errorMessage.textContent = message;\n    errorMessage.classList.remove('hidden');\n    setTimeout(() => {\n      errorMessage.classList.add('hidden');\n    }, 5000);\n  }\n\n  // 日付フォーマット関数\n  function formatDate(dateStr) {\n    if (!dateStr) return '';\n    const date = new Date(dateStr);\n    return date.toLocaleDateString('ja-JP');\n  }\n\n  function formatTime(dateStr) {\n    if (!dateStr) return '';\n    const date = new Date(dateStr);\n    return date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });\n  }\n\n  function formatDuration(minutes) {\n    if (!minutes) return '';\n    const hours = Math.floor(minutes / 60);\n    const mins = minutes % 60;\n    return `${hours}:${mins.toString().padStart(2, '0')}`;\n  }\n\n  // 中断回数を計算\n  function getInterruptionCount(workRecordId) {\n    return allInterruptions.filter(i => i.作業記録ID === workRecordId).length;\n  }\n\n  // 作業項目名を取得\n  function getWorkItemName(workRecordId) {\n    const workRecord = allWorkRecords.find(w => w.作業記録ID === workRecordId);\n    if (!workRecord) return '';\n    const workItem = allWorkItems.find(w => w.作業項目名 === workRecord.作業種別);\n    return workItem ? workItem.作業項目名 : workRecord.作業種別 || '';\n  }\n\n  // 作業者名を取得\n  function getWorkerName(userId) {\n    const user = allUsers.find(u => u.ユーザーID === userId);\n    return user ? user.氏名 : '';\n  }\n\n  // ステータスバッジのスタイル\n  function getStatusBadge(status) {\n    let bgColor, textColor;\n    switch(status) {\n      case '完了':\n        bgColor = 'rgba(34, 197, 94, 0.2)';\n        textColor = '#86efac';\n        break;\n      case '作業中':\n        bgColor = 'rgba(59, 130, 246, 0.2)';\n        textColor = '#93c5fd';\n        break;\n      case '中断':\n        bgColor = 'rgba(245, 158, 11, 0.2)';\n        textColor = '#fbbf24';\n        break;\n      default:\n        bgColor = 'rgba(107, 114, 128, 0.2)';\n        textColor = '#d1d5db';\n    }\n    return `<span style=\"background: ${bgColor}; color: ${textColor}; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500;\">${status}</span>`;\n  }\n\n  // テーブル再描画関数\n  function renderRows(rows) {\n    if (!rows || rows.length === 0) {\n      tbody.innerHTML = '';\n      resultCount.textContent = '0件';\n      noResults.classList.remove('hidden');\n      return;\n    }\n\n    noResults.classList.add('hidden');\n    resultCount.textContent = `${rows.length}件`;\n\n    tbody.innerHTML = rows.map(record => {\n      const interruptionCount = getInterruptionCount(record.作業記録ID);\n      const workItemName = getWorkItemName(record.作業記録ID) || record.作業種別 || '';\n      \n      return `\n        <tr data-id=\"${record.作業記録ID}\" style=\"border-bottom: 1px solid var(--border);\">\n          <td style=\"padding: 8px 10px; color: var(--text);\">${formatDate(record.作業日)}</td>\n          <td style=\"padding: 8px 10px; color: var(--text);\">${workItemName}</td>\n          <td style=\"padding: 8px 10px; color: var(--text);\">${formatTime(record.作業開始時刻)}</td>\n          <td style=\"padding: 8px 10px; color: var(--text);\">${formatTime(record.作業終了時刻)}</td>\n          <td style=\"padding: 8px 10px; text-align: right; color: var(--text);\">${formatDuration(record.作業時間)}</td>\n          <td style=\"padding: 8px 10px; text-align: center; color: var(--text);\">${interruptionCount}</td>\n          <td style=\"padding: 8px 10px; text-align: center;\">${getStatusBadge(record.進捗状況)}</td>\n          <td style=\"padding: 8px 10px; text-align: center;\">\n            <button class=\"action-btn secondary detail-btn\" data-id=\"${record.作業記録ID}\" style=\"background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;\">詳細確認</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // フィルター処理\n  function applyFilters() {\n    const startDate = container.querySelector('#input-start-date').value;\n    const endDate = container.querySelector('#input-end-date').value;\n    const workItem = container.querySelector('#select-work-item').value;\n    const status = container.querySelector('#select-status').value;\n    const worker = container.querySelector('#select-worker').value;\n\n    // 日付バリデーション\n    if (startDate && endDate) {\n      const start = new Date(startDate);\n      const end = new Date(endDate);\n      const today = new Date();\n      today.setHours(23, 59, 59, 999);\n\n      if (start > end) {\n        showError('開始日は終了日より前の日付を入力してください');\n        return;\n      }\n\n      if (start > today || end > today) {\n        showError('未来の日付は選択できません');\n        return;\n      }\n\n      const oneYearAgo = new Date();\n      oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);\n      if (start < oneYearAgo) {\n        showError('1年以上前の期間は選択できません');\n        return;\n      }\n    }\n\n    let filteredRecords = [...allWorkRecords];\n\n    // 日付範囲フィルター\n    if (startDate || endDate) {\n      if (!startDate || !endDate) {\n        showError('日付範囲を選択してください');\n        return;\n      }\n      \n      filteredRecords = filteredRecords.filter(record => {\n        const workDate = new Date(record.作業日);\n        const start = new Date(startDate);\n        const end = new Date(endDate);\n        end.setHours(23, 59, 59, 999);\n        return workDate >= start && workDate <= end;\n      });\n    }\n\n    // 作業項目フィルター\n    if (workItem) {\n      filteredRecords = filteredRecords.filter(record => \n        record.作業種別 === workItem\n      );\n    }\n\n    // 作業状況フィルター\n    if (status) {\n      filteredRecords = filteredRecords.filter(record => \n        record.進捗状況 === status\n      );\n    }\n\n    // 作業者フィルター\n    if (worker) {\n      filteredRecords = filteredRecords.filter(record => \n        record.作業員ID === worker\n      );\n    }\n\n    // 作業日の降順でソート\n    filteredRecords.sort((a, b) => new Date(b.作業日) - new Date(a.作業日));\n\n    renderRows(filteredRecords);\n  }\n\n  // セレクトボックスの初期化\n  function initializeSelects() {\n    // 作業項目の選択肢を設定\n    const workItemOptions = [...new Set(allWorkRecords.map(r => r.作業種別).filter(Boolean))];\n    workItemSelect.innerHTML = '<option value=\"\">すべて</option>' + \n      workItemOptions.map(item => `<option value=\"${item}\">${item}</option>`).join('');\n\n    // 作業者の選択肢を設定\n    const workerOptions = allUsers.filter(u => \n      allWorkRecords.some(r => r.作業員ID === u.ユーザーID)\n    );\n    workerSelect.innerHTML = '<option value=\"\">すべて</option>' + \n      workerOptions.map(user => `<option value=\"${user.ユーザーID}\">${user.氏名}</option>`).join('');\n  }\n\n  // CSVエクスポート\n  function exportCSV() {\n    const headers = ['作業日', '作業項目', '開始時刻', '終了時刻', '作業時間', '中断回数', '状況', '作業者', '作業場所', '作業内容'];\n    const csvData = [headers];\n\n    allWorkRecords.forEach(record => {\n      const row = [\n        formatDate(record.作業日),\n        getWorkItemName(record.作業記録ID) || record.作業種別 || '',\n        formatTime(record.作業開始時刻),\n        formatTime(record.作業終了時刻),\n        formatDuration(record.作業時間),\n        getInterruptionCount(record.作業記録ID),\n        record.進捗状況 || '',\n        getWorkerName(record.作業員ID),\n        record.作業場所 || '',\n        record.作業内容 || ''\n      ];\n      csvData.push(row);\n    });\n\n    const csvContent = '\\uFEFF' + csvData.map(row => \n      row.map(cell => `\"${(cell || '').toString().replace(/\"/g, '\"\"')}\"`).join(',')\n    ).join('\\n');\n\n    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `作業履歴_${new Date().toISOString().split('T')[0]}.csv`;\n    link.click();\n  }\n\n  // 初期データの読み込み\n  async function loadInitialData() {\n    try {\n      const [workRecords, users, workItems, interruptions] = await Promise.all([\n        window.aivicApi.list(1), // 作業記録\n        window.aivicApi.list(0), // ユーザー\n        window.aivicApi.list(3), // 作業項目マスタ\n        window.aivicApi.list(2)  // 中断記録\n      ]);\n\n      allWorkRecords = workRecords || tables[1]?.records || [];\n      allUsers = users || tables[0]?.records || [];\n      allWorkItems = workItems || tables[3]?.records || [];\n      allInterruptions = interruptions || tables[2]?.records || [];\n\n      initializeSelects();\n      \n      // 作業日の降順でソート\n      const sortedRecords = [...allWorkRecords].sort((a, b) => new Date(b.作業日) - new Date(a.作業日));\n      renderRows(sortedRecords);\n    } catch (error) {\n      console.error('データ読み込みエラー:', error);\n      // フォールバック: テーブルの初期データを使用\n      allWorkRecords = tables[1]?.records || [];\n      allUsers = tables[0]?.records || [];\n      allWorkItems = tables[3]?.records || [];\n      allInterruptions = tables[2]?.records || [];\n      \n      initializeSelects();\n      const sortedRecords = [...allWorkRecords].sort((a, b) => new Date(b.作業日) - new Date(a.作業日));\n      renderRows(sortedRecords);\n    }\n  }\n\n  // イベントリスナーの登録\n  container.querySelector('#btn-search').addEventListener('click', applyFilters);\n\n  container.querySelector('#btn-reset').addEventListener('click', () => {\n    container.querySelector('#input-start-date').value = '';\n    container.querySelector('#input-end-date').value = '';\n    container.querySelector('#select-work-item').value = '';\n    container.querySelector('#select-status').value = '';\n    container.querySelector('#select-worker').value = '';\n    \n    const sortedRecords = [...allWorkRecords].sort((a, b) => new Date(b.作業日) - new Date(a.作業日));\n    renderRows(sortedRecords);\n  });\n\n  container.querySelector('#btn-export').addEventListener('click', exportCSV);\n\n  container.querySelector('#btn-back').addEventListener('click', () => {\n    window.showScreen('scr-1778907133295');\n  });\n\n  // 行レベル操作のイベントデリゲーション\n  container.addEventListener('click', (e) => {\n    const detailBtn = e.target.closest('.detail-btn');\n    if (detailBtn) {\n      const recordId = detailBtn.dataset.id;\n      // 詳細確認画面に遷移（レコードIDをパラメータとして渡す）\n      window.showScreen('scr-1778907367889', { recordId });\n    }\n  });\n\n  // データ抽出ボタンの追加（ヘッダー部分に）\n  const headerButtons = container.querySelector('div[style*=\"justify-content: space-between\"] div');\n  const extractBtn = document.createElement('button');\n  extractBtn.className = 'action-btn';\n  extractBtn.textContent = 'データ抽出';\n  extractBtn.style.cssText = 'background: var(--primary); color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; margin-right: 8px;';\n  extractBtn.addEventListener('click', () => {\n    window.showScreen('scr-1778907353387');\n  });\n  headerButtons.insertBefore(extractBtn, headerButtons.firstChild);\n\n  // 初期データ読み込み\n  loadInitialData();\n}";
</script>

  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },

  })();

  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {

      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }

      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }

      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
