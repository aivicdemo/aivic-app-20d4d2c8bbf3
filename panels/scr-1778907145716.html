window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックモジュールのインポート\n  const { calculateWorkDuration, calculateProgressRate, isWorkTimeValid, analyzeInterruptionPatterns } = window.workRecordCalc || {};\n  const { calculateInterruptionDuration, analyzeInterruptionFrequency } = window.interruptionCalc || {};\n  const { calculateEfficiencyRate, calculateProductivityIndex } = window.efficiencyAnalysis || {};\n  const { aggregateMonthlyHours, calculateSiteProductivity } = window.dataAggregation || {};\n\n  // DOM要素の取得\n  const tbody = container.querySelector('#work-history-tbody');\n  const resultCount = container.querySelector('#result-count');\n  const noResults = container.querySelector('#no-results');\n  const errorMessage = container.querySelector('#error-message');\n  const workItemFilter = container.querySelector('#filter-work-item');\n  const startDateInput = container.querySelector('[data-testid=\"start-date\"]');\n  const endDateInput = container.querySelector('[data-testid=\"end-date\"]');\n  const workTypeFilter = container.querySelector('[data-testid=\"work-type-filter\"]');\n  const statusFilter = container.querySelector('[data-testid=\"status-filter\"]');\n  const workerFilter = container.querySelector('[data-testid=\"worker-filter\"]');\n  const filterButton = container.querySelector('[data-testid=\"filter-button\"]');\n  const searchButton = container.querySelector('[data-testid=\"search-button\"]');\n  const resetButton = container.querySelector('[data-testid=\"reset-button\"]');\n  const applyFilterButton = container.querySelector('[data-testid=\"apply-filter\"]');\n  const workDateInput = container.querySelector('[data-testid=\"work-date\"]');\n  const workerNameInput = container.querySelector('[data-testid=\"worker-name\"]');\n  const workContentInput = container.querySelector('[data-testid=\"work-content\"]');\n  const workHistoryList = container.querySelector('[data-testid=\"work-history-list\"]');\n  const searchResults = container.querySelector('[data-testid=\"search-results\"]');\n\n  let allWorkRecords = [];\n  let allWorkItems = [];\n  let allBreakRecords = [];\n  let filteredRecords = [];\n\n  // 中断回数を計算する関数\n  function getBreakCount(workRecordId) {\n    return allBreakRecords.filter(br => br.作業記録ID === workRecordId).length;\n  }\n\n  // 作業時間をフォーマットする関数\n  function formatWorkTime(minutes) {\n    if (!minutes) return '-';\n    const hours = Math.floor(minutes / 60);\n    const mins = minutes % 60;\n    return hours > 0 ? `${hours}時間${mins}分` : `${mins}分`;\n  }\n\n  // 日時をフォーマットする関数\n  function formatDateTime(dateTimeStr) {\n    if (!dateTimeStr) return '-';\n    const date = new Date(dateTimeStr);\n    return date.toLocaleString('ja-JP', {\n      year: 'numeric',\n      month: '2-digit',\n      day: '2-digit',\n      hour: '2-digit',\n      minute: '2-digit'\n    });\n  }\n\n  // 時刻のみをフォーマットする関数\n  function formatTime(dateTimeStr) {\n    if (!dateTimeStr) return '-';\n    const date = new Date(dateTimeStr);\n    return date.toLocaleTimeString('ja-JP', {\n      hour: '2-digit',\n      minute: '2-digit'\n    });\n  }\n\n  // エラーメッセージを表示する関数\n  function showError(message) {\n    if (window.aivicNotify && window.aivicNotify.error) {\n      window.aivicNotify.error(message);\n    } else {\n      errorMessage.textContent = message;\n      errorMessage.style.display = 'block';\n      setTimeout(() => {\n        errorMessage.style.display = 'none';\n      }, 5000);\n    }\n  }\n\n  // テーブル再描画関数\n  function renderRows(rows) {\n    if (!rows || rows.length === 0) {\n      tbody.innerHTML = '';\n      if (resultCount) resultCount.textContent = '0';\n      if (noResults) noResults.style.display = 'block';\n      const tableWrap = container.querySelector('.table-wrap');\n      if (tableWrap) tableWrap.style.display = 'none';\n      return;\n    }\n\n    if (noResults) noResults.style.display = 'none';\n    const tableWrap = container.querySelector('.table-wrap');\n    if (tableWrap) tableWrap.style.display = 'block';\n    \n    tbody.innerHTML = rows.map(r => {\n      const breakCount = getBreakCount(r.作業記録ID);\n      const statusBadge = r.進捗状況 === '完了' ? \n        '<span style=\"background: rgba(34, 197, 94, 0.2); color: #22c55e; padding: 2px 6px; border-radius: 4px; font-size: 11px;\">完了</span>' :\n        r.進捗状況 === '進行中' ? \n        '<span style=\"background: rgba(59, 130, 246, 0.2); color: #3b82f6; padding: 2px 6px; border-radius: 4px; font-size: 11px;\">進行中</span>' :\n        '<span style=\"background: rgba(239, 68, 68, 0.2); color: #ef4444; padding: 2px 6px; border-radius: 4px; font-size: 11px;\">中断</span>';\n      \n      // 業務ロジックを使用して作業時間を計算\n      let workDuration = 0;\n      if (calculateWorkDuration && r.作業開始時刻 && r.作業終了時刻) {\n        try {\n          workDuration = calculateWorkDuration(r.作業開始時刻, r.作業終了時刻);\n        } catch (e) {\n          console.warn('作業時間計算エラー:', e);\n        }\n      }\n\n      return `\n        <tr data-id=\"${r.作業記録ID}\" style=\"border-bottom: 1px solid rgba(255,255,255,0.02);\">\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${formatDateTime(r.作業日)}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${r.作業種別 || '-'}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${formatTime(r.作業開始時刻)}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${formatTime(r.作業終了時刻)}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${formatWorkTime(workDuration)}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${statusBadge}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${breakCount}回</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${r.作業者名 || '-'}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${r.作業内容 || '-'}</td>\n        </tr>\n      `;\n    }).join('');\n\n    if (resultCount) resultCount.textContent = rows.length.toString();\n  }\n\n  // データをフィルタリングする関数\n  function applyFilters() {\n    try {\n      let filtered = [...allWorkRecords];\n\n      // 日付範囲フィルター\n      if (startDateInput && startDateInput.value) {\n        const startDate = new Date(startDateInput.value);\n        filtered = filtered.filter(r => new Date(r.作業日) >= startDate);\n      }\n      if (endDateInput && endDateInput.value) {\n        const endDate = new Date(endDateInput.value);\n        endDate.setHours(23, 59, 59, 999);\n        filtered = filtered.filter(r => new Date(r.作業日) <= endDate);\n      }\n\n      // 作業種別フィルター\n      if (workTypeFilter && workTypeFilter.value && workTypeFilter.value !== 'すべて') {\n        filtered = filtered.filter(r => r.作業種別 === workTypeFilter.value);\n      }\n\n      // 作業項目フィルター\n      if (workItemFilter && workItemFilter.value && workItemFilter.value !== 'すべて') {\n        filtered = filtered.filter(r => r.作業項目 === workItemFilter.value);\n      }\n\n      // 状況フィルター\n      if (statusFilter && statusFilter.value && statusFilter.value !== '全て') {\n        filtered = filtered.filter(r => r.進捗状況 === statusFilter.value);\n      }\n\n      // 作業者フィルター\n      if (workerFilter && workerFilter.value && workerFilter.value !== 'すべて') {\n        filtered = filtered.filter(r => r.作業者名 === workerFilter.value);\n      }\n\n      // 作業日フィルター\n      if (workDateInput && workDateInput.value) {\n        const workDate = new Date(workDateInput.value);\n        filtered = filtered.filter(r => {\n          const recordDate = new Date(r.作業日);\n          return recordDate.toDateString() === workDate.toDateString();\n        });\n      }\n\n      // 作業者名フィルター\n      if (workerNameInput && workerNameInput.value) {\n        const workerName = workerNameInput.value.toLowerCase();\n        filtered = filtered.filter(r => \n          r.作業者名 && r.作業者名.toLowerCase().includes(workerName)\n        );\n      }\n\n      // 作業内容フィルター\n      if (workContentInput && workContentInput.value) {\n        const workContent = workContentInput.value.toLowerCase();\n        filtered = filtered.filter(r => \n          r.作業内容 && r.作業内容.toLowerCase().includes(workContent)\n        );\n      }\n\n      filteredRecords = filtered;\n      renderRows(filtered);\n\n      // 結果表示エリアを表示\n      if (workHistoryList) workHistoryList.style.display = 'block';\n      if (searchResults) searchResults.style.display = 'block';\n\n    } catch (error) {\n      console.error('フィルター適用エラー:', error);\n      showError('フィルターの適用中にエラーが発生しました');\n    }\n  }\n\n  // フィルターをリセットする関数\n  function resetFilters() {\n    try {\n      if (startDateInput) startDateInput.value = '';\n      if (endDateInput) endDateInput.value = '';\n      if (workTypeFilter) workTypeFilter.value = 'すべて';\n      if (workItemFilter) workItemFilter.value = 'すべて';\n      if (statusFilter) statusFilter.value = '全て';\n      if (workerFilter) workerFilter.value = 'すべて';\n      if (workDateInput) workDateInput.value = '';\n      if (workerNameInput) workerNameInput.value = '';\n      if (workContentInput) workContentInput.value = '';\n\n      filteredRecords = [...allWorkRecords];\n      renderRows(allWorkRecords);\n    } catch (error) {\n      console.error('フィルターリセットエラー:', error);\n      showError('フィルターのリセット中にエラーが発生しました');\n    }\n  }\n\n  // データを読み込む関数\n  async function loadData() {\n    try {\n      // 作業記録データの取得\n      const workRecordsResponse = await window.aivicApi.list('作業記録');\n      if (workRecordsResponse && workRecordsResponse.data) {\n        allWorkRecords = workRecordsResponse.data;\n      }\n\n      // 作業項目データの取得\n      const workItemsResponse = await window.aivicApi.list('作業項目');\n      if (workItemsResponse && workItemsResponse.data) {\n        allWorkItems = workItemsResponse.data;\n      }\n\n      // 中断記録データの取得\n      const breakRecordsResponse = await window.aivicApi.list('中断記録');\n      if (breakRecordsResponse && breakRecordsResponse.data) {\n        allBreakRecords = breakRecordsResponse.data;\n      }\n\n      // 初期表示\n      filteredRecords = [...allWorkRecords];\n      renderRows(allWorkRecords);\n\n      // 作業項目フィルターの選択肢を設定\n      if (workItemFilter && allWorkItems.length > 0) {\n        const currentValue = workItemFilter.value;\n        workItemFilter.innerHTML = '<option value=\"すべて\">すべて</option>';\n        allWorkItems.forEach(item => {\n          const option = document.createElement('option');\n          option.value = item.作業項目名;\n          option.textContent = item.作業項目名;\n          workItemFilter.appendChild(option);\n        });\n        workItemFilter.value = currentValue;\n      }\n\n    } catch (error) {\n      console.error('データ読み込みエラー:', error);\n      showError('データの読み込み中にエラーが発生しました');\n    }\n  }\n\n  // イベントリスナーの設定\n  if (filterButton) {\n    filterButton.addEventListener('click', applyFilters);\n  }\n\n  if (searchButton) {\n    searchButton.addEventListener('click', applyFilters);\n  }\n\n  if (resetButton) {\n    resetButton.addEventListener('click', resetFilters);\n  }\n\n  if (applyFilterButton) {\n    applyFilterButton.addEventListener('click', applyFilters);\n  }\n\n  // フィルター要素の変更イベント\n  [startDateInput, endDateInput, workTypeFilter, workItemFilter, statusFilter, workerFilter].forEach(element => {\n    if (element) {\n      element.addEventListener('change', applyFilters);\n    }\n  });\n\n  // 作業項目フィルターのドロップダウン選択\n  if (workItemFilter) {\n    workItemFilter.addEventListener('change', (e) => {\n      setTimeout(applyFilters, 100);\n    });\n  }\n\n  // 状況フィルターのドロップダウン選択\n  if (statusFilter) {\n    statusFilter.addEventListener('change', (e) => {\n      setTimeout(applyFilters, 100);\n    });\n  }\n\n  // 初期データ読み込み\n  loadData();\n\n  // 結果表示エリアを初期表示\n  if (workHistoryList) workHistoryList.style.display = 'block';\n  if (searchResults) searchResults.style.display = 'block';\n}";

        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
