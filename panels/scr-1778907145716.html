<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工数記録システム</title>
    <style>
        :root {
            --primary: #cc1f1f;
            --primary-hover: #a61a1a;
            --bg-main: #0d0d0d;
            --bg-card: #1a1010;
            --bg-sidebar: #151111;
            --border: #331a1a;
            --text: #e6e6e6;
            --text-muted: #999999;
            --top-bar-bg: #1f1515;
            --top-bar-border: #2d1a1a;
            --warning: #ff6b35;
            --error: #ff3333;
            --success: #28a745;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: "⚠";
            font-size: 18px;
        }

        .nav-section {
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }

        .nav-section:last-child {
            border-bottom: none;
            flex: 1;
        }

        .nav-title {
            padding: 0 16px 8px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: block;
            padding: 8px 16px;
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: rgba(204, 31, 31, 0.1);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: rgba(204, 31, 31, 0.15);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            margin-left: 220px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
        }

        .current-time {
            font-size: 12px;
            font-weight: 500;
            color: var(--primary);
            font-family: 'Courier New', monospace;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text);
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .user-menu:hover {
            background: var(--bg-sidebar);
            border-color: var(--primary);
        }

        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            min-height: calc(100vh - 132px);
        }

        .emergency-banner {
            background: linear-gradient(135deg, var(--error), var(--warning));
            color: white;
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            animation: flash 3s infinite;
        }

        @keyframes flash {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.7; }
        }

        .quick-actions {
            padding: 12px 16px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }

        .quick-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            margin-right: 8px;
            transition: all 0.15s ease;
        }

        .quick-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .quick-btn.secondary {
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
        }

        .quick-btn.secondary:hover {
            background: var(--border);
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .content-area {
                padding: 12px;
            }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(13, 13, 13, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  const tbody = container.querySelector(\"#work-history-tbody\");\n  const resultCount = container.querySelector(\"#result-count\");\n  const noResults = container.querySelector(\"#no-results\");\n  const errorMessage = container.querySelector(\"#error-message\");\n  const workItemFilter = container.querySelector(\"#filter-work-item\");\n  \n  let allRecords = [];\n  let allWorkItems = [];\n  let interruptCounts = {};\n\n  // 作業項目マスタを取得してフィルターに設定\n  async function loadWorkItems() {\n    try {\n      const workItems = await window.aivicApi.list(3); // 作業項目マスタ\n      if (workItems) {\n        allWorkItems = workItems;\n        workItemFilter.innerHTML = '<option value=\"\">すべて</option>';\n        workItems.forEach(item => {\n          const option = document.createElement('option');\n          option.value = item.作業項目名 || item.name || '';\n          option.textContent = item.作業項目名 || item.name || '';\n          workItemFilter.appendChild(option);\n        });\n      }\n    } catch (error) {\n      console.error('作業項目の取得に失敗しました:', error);\n    }\n  }\n\n  // 中断回数を計算\n  async function loadInterruptCounts() {\n    try {\n      const interrupts = await window.aivicApi.list(2); // 中断記録\n      if (interrupts) {\n        interruptCounts = {};\n        interrupts.forEach(interrupt => {\n          const workRecordId = interrupt.作業記録ID || interrupt.workRecordId;\n          if (workRecordId) {\n            interruptCounts[workRecordId] = (interruptCounts[workRecordId] || 0) + 1;\n          }\n        });\n      }\n    } catch (error) {\n      console.error('中断記録の取得に失敗しました:', error);\n    }\n  }\n\n  function formatTime(timeStr) {\n    if (!timeStr) return '';\n    const date = new Date(timeStr);\n    return date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });\n  }\n\n  function formatDate(dateStr) {\n    if (!dateStr) return '';\n    const date = new Date(dateStr);\n    return date.toLocaleDateString('ja-JP');\n  }\n\n  function formatDuration(minutes) {\n    if (!minutes) return '';\n    const hours = Math.floor(minutes / 60);\n    const mins = minutes % 60;\n    return `${hours}:${mins.toString().padStart(2, '0')}`;\n  }\n\n  function getStatusBadge(status) {\n    const colors = {\n      '完了': '#dc2626',\n      '進行中': '#ea580c', \n      '中断': '#991b1b'\n    };\n    const color = colors[status] || '#6b7280';\n    return `<span style=\"background: ${color}; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 500;\">${status}</span>`;\n  }\n\n  function renderRows(rows) {\n    if (!rows || rows.length === 0) {\n      tbody.innerHTML = '';\n      resultCount.textContent = '0';\n      noResults.style.display = 'block';\n      container.querySelector('.table-wrap').style.display = 'none';\n      return;\n    }\n\n    noResults.style.display = 'none';\n    container.querySelector('.table-wrap').style.display = 'block';\n    resultCount.textContent = rows.length.toString();\n\n    tbody.innerHTML = rows.map(r => {\n      const workDate = formatDate(r.作業日 || r.workDate);\n      const startTime = formatTime(r.作業開始時刻 || r.startTime);\n      const endTime = formatTime(r.作業終了時刻 || r.endTime);\n      const duration = formatDuration(r.作業時間 || r.workHours);\n      const interruptCount = interruptCounts[r.作業記録ID || r.id] || 0;\n      const status = r.進捗状況 || r.status || '不明';\n      const workItem = r.作業種別 || r.workType || '';\n\n      return `\n        <tr data-id=\"${r.作業記録ID || r.id}\" style=\"border-bottom: 1px solid var(--border); height: 36px;\">\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${workDate}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${workItem}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${startTime}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${endTime}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); text-align: right;\">${duration}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); text-align: right;\">${interruptCount}</td>\n          <td style=\"padding: 6px 10px; text-align: center;\">${getStatusBadge(status)}</td>\n          <td style=\"padding: 6px 10px; text-align: center;\">\n            <button class=\"action-btn secondary detail-btn\" data-id=\"${r.作業記録ID || r.id}\" style=\"background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;\">詳細確認</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  function showError(message) {\n    errorMessage.textContent = message;\n    errorMessage.style.display = 'block';\n    setTimeout(() => {\n      errorMessage.style.display = 'none';\n    }, 5000);\n  }\n\n  function validateDateRange() {\n    const startDate = container.querySelector(\"#filter-start-date\").value;\n    const endDate = container.querySelector(\"#filter-end-date\").value;\n\n    if (startDate && endDate) {\n      const start = new Date(startDate);\n      const end = new Date(endDate);\n      const today = new Date();\n      today.setHours(23, 59, 59, 999);\n\n      if (start > end) {\n        showError('開始日は終了日より前の日付を入力してください');\n        return false;\n      }\n\n      if (start > today || end > today) {\n        showError('未来の日付は選択できません');\n        return false;\n      }\n\n      const diffTime = Math.abs(end - start);\n      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));\n      if (diffDays > 365) {\n        showError('1年以上の期間は選択できません');\n        return false;\n      }\n    }\n\n    return true;\n  }\n\n  function filterRecords() {\n    if (!validateDateRange()) {\n      return;\n    }\n\n    const startDate = container.querySelector(\"#filter-start-date\").value;\n    const endDate = container.querySelector(\"#filter-end-date\").value;\n    const workItem = container.querySelector(\"#filter-work-item\").value;\n    const status = container.querySelector(\"#filter-status\").value;\n\n    let filtered = allRecords;\n\n    if (startDate || endDate) {\n      filtered = filtered.filter(r => {\n        const workDate = new Date(r.作業日 || r.workDate);\n        const start = startDate ? new Date(startDate) : null;\n        const end = endDate ? new Date(endDate) : null;\n\n        if (start && workDate < start) return false;\n        if (end && workDate > end) return false;\n        return true;\n      });\n    }\n\n    if (workItem) {\n      filtered = filtered.filter(r => \n        (r.作業種別 || r.workType || '').includes(workItem)\n      );\n    }\n\n    if (status) {\n      filtered = filtered.filter(r => \n        (r.進捗状況 || r.status) === status\n      );\n    }\n\n    renderRows(filtered);\n  }\n\n  function resetFilters() {\n    container.querySelector(\"#filter-start-date\").value = '';\n    container.querySelector(\"#filter-end-date\").value = '';\n    container.querySelector(\"#filter-work-item\").value = '';\n    container.querySelector(\"#filter-status\").value = '';\n    errorMessage.style.display = 'none';\n    renderRows(allRecords);\n  }\n\n  function exportCSV() {\n    const startDate = container.querySelector(\"#filter-start-date\").value;\n    const endDate = container.querySelector(\"#filter-end-date\").value;\n    const workItem = container.querySelector(\"#filter-work-item\").value;\n    const status = container.querySelector(\"#filter-status\").value;\n\n    let dataToExport = allRecords;\n\n    // フィルター条件を適用\n    if (startDate || endDate || workItem || status) {\n      dataToExport = allRecords.filter(r => {\n        let match = true;\n\n        if (startDate || endDate) {\n          const workDate = new Date(r.作業日 || r.workDate);\n          const start = startDate ? new Date(startDate) : null;\n          const end = endDate ? new Date(endDate) : null;\n          if (start && workDate < start) match = false;\n          if (end && workDate > end) match = false;\n        }\n\n        if (workItem && match) {\n          match = (r.作業種別 || r.workType || '').includes(workItem);\n        }\n\n        if (status && match) {\n          match = (r.進捗状況 || r.status) === status;\n        }\n\n        return match;\n      });\n    }\n\n    const headers = ['作業日', '作業項目', '開始時刻', '終了時刻', '作業時間', '中断回数', '状況', 'プロジェクト名', '作業場所', '作業内容'];\n    const csvContent = '\\uFEFF' + [\n      headers.join(','),\n      ...dataToExport.map(r => {\n        const interruptCount = interruptCounts[r.作業記録ID || r.id] || 0;\n        return [\n          formatDate(r.作業日 || r.workDate),\n          `\"${(r.作業種別 || r.workType || '').replace(/\"/g, '\"\"')}\"`,\n          formatTime(r.作業開始時刻 || r.startTime),\n          formatTime(r.作業終了時刻 || r.endTime),\n          formatDuration(r.作業時間 || r.workHours),\n          interruptCount,\n          `\"${(r.進捗状況 || r.status || '').replace(/\"/g, '\"\"')}\"`,\n          `\"${(r.プロジェクト名 || r.projectName || '').replace(/\"/g, '\"\"')}\"`,\n          `\"${(r.作業場所 || r.workLocation || '').replace(/\"/g, '\"\"')}\"`,\n          `\"${(r.作業内容 || r.workContent || '').replace(/\"/g, '\"\"')}\"`\n        ].join(',');\n      })\n    ].join('\\n');\n\n    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `作業履歴_${new Date().toISOString().split('T')[0]}.csv`;\n    link.click();\n  }\n\n  // 初期データ読み込み\n  async function loadData() {\n    try {\n      await loadWorkItems();\n      await loadInterruptCounts();\n      \n      const records = await window.aivicApi.list(1); // 作業記録\n      if (records) {\n        allRecords = records.sort((a, b) => {\n          const dateA = new Date(a.作業日 || a.workDate);\n          const dateB = new Date(b.作業日 || b.workDate);\n          return dateB - dateA; // 新し   var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
