ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type":"text","required":false,"description":"管理者による対応内容や備考"},{"name":"検出日時","type":"timestamp","required":true,"description":"異常値が検出された日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  const tbody = container.querySelector(\"#work-history-tbody\");\n  const noResults = container.querySelector(\"#no-results\");\n  const errorMessage = container.querySelector(\"#error-message\");\n  \n  let allWorkRecords = [];\n  let allBreakRecords = [];\n  let allWorkItems = [];\n\n  // エラー表示関数\n  function showError(message) {\n    errorMessage.textContent = message;\n    errorMessage.style.display = \"block\";\n    setTimeout(() => {\n      errorMessage.style.display = \"none\";\n    }, 5000);\n  }\n\n  // 中断回数を計算する関数\n  function getBreakCount(workRecordId) {\n    return allBreakRecords.filter(br => br.作業記録ID === workRecordId).length;\n  }\n\n  // 作業時間をフォーマットする関数\n  function formatWorkTime(minutes) {\n    if (!minutes) return \"-\";\n    const hours = Math.floor(minutes / 60);\n    const mins = minutes % 60;\n    return `${hours}時間${mins}分`;\n  }\n\n  // 日付をフォーマットする関数\n  function formatDate(dateStr) {\n    if (!dateStr) return \"-\";\n    const date = new Date(dateStr);\n    return date.toLocaleDateString('ja-JP');\n  }\n\n  // 時刻をフォーマットする関数\n  function formatTime(dateStr) {\n    if (!dateStr) return \"-\";\n    const date = new Date(dateStr);\n    return date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });\n  }\n\n  // 作業項目名を取得する関数\n  function getWorkItemName(workContent) {\n    const workItem = allWorkItems.find(item => item.作業項目名 === workContent);\n    return workItem ? workItem.作業項目名 : workContent || \"-\";\n  }\n\n  // ステータスバッジのスタイルを取得\n  function getStatusBadgeStyle(status) {\n    switch(status) {\n      case \"完了\":\n        return \"background: rgba(34, 197, 94, 0.2); color: #22c55e; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500;\";\n      case \"作業中\":\n        return \"background: rgba(59, 130, 246, 0.2); color: #3b82f6; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500;\";\n      case \"中断\":\n        return \"background: rgba(245, 158, 11, 0.2); color: #f59e0b; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500;\";\n      default:\n        return \"background: rgba(107, 114, 128, 0.2); color: #6b7280; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500;\";\n    }\n  }\n\n  // テーブル再描画関数\n  function renderRows(rows) {\n    if (rows.length === 0) {\n      tbody.innerHTML = \"\";\n      noResults.style.display = \"block\";\n      return;\n    }\n\n    noResults.style.display = \"none\";\n    tbody.innerHTML = rows.map(r => {\n      const breakCount = getBreakCount(r.作業記録ID);\n      const workItemName = getWorkItemName(r.作業内容);\n      \n      return `\n        <tr data-id=\"${r.作業記録ID}\" style=\"border-bottom: 1px solid var(--border);\">\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${formatDate(r.作業日)}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${workItemName}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${formatTime(r.作業開始時刻)}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${formatTime(r.作業終了時刻)}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${formatWorkTime(r.作業時間)}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); text-align: center;\">${breakCount}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            <span style=\"${getStatusBadgeStyle(r.進捗状況)}\">${r.進捗状況 || \"-\"}</span>\n          </td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            <button class=\"action-btn secondary detail-btn\" data-id=\"${r.作業記録ID}\" style=\"background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-right: 4px;\">詳細確認</button>\n          </td>\n        </tr>\n      `;\n    }).join(\"\");\n  }\n\n  // 作業項目ドロップダウンを更新\n  function updateWorkItemFilter() {\n    const workItemFilter = container.querySelector(\"#filter-work-item\");\n    const uniqueWorkItems = [...new Set(allWorkRecords.map(r => getWorkItemName(r.作業内容)))];\n    \n    workItemFilter.innerHTML = '<option value=\"\">すべて</option>' + \n      uniqueWorkItems.map(item => `<option value=\"${item}\">${item}</option>`).join(\"\");\n  }\n\n  // フィルター処理\n  function applyFilters() {\n    const startDate = container.querySelector(\"#filter-start-date\").value;\n    const endDate = container.querySelector(\"#filter-end-date\").value;\n    const workItem = container.querySelector(\"#filter-work-item\").value;\n    const status = container.querySelector(\"#filter-status\").value;\n\n    // バリデーション\n    if (startDate && endDate && new Date(startDate) > new Date(endDate)) {\n      showError(\"開始日は終了日より前の日付を入力してください\");\n      return;\n    }\n\n    const today = new Date();\n    today.setHours(23, 59, 59, 999);\n    \n    if (startDate && new Date(startDate) > today) {\n      showError(\"未来の日付は選択できません\");\n      return;\n    }\n    \n    if (endDate && new Date(endDate) > today) {\n      showError(\"未来の日付は選択できません\");\n      return;\n    }\n\n    if (startDate && endDate) {\n      const start = new Date(startDate);\n      const end = new Date(endDate);\n      const diffTime = Math.abs(end - start);\n      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));\n      \n      if (diffDays > 365) {\n        showError(\"1年以上の期間は選択できません\");\n        return;\n      }\n    }\n\n    let filteredRows = allWorkRecords.filter(row => {\n      // 日付フィルター\n      if (startDate || endDate) {\n        const workDate = new Date(row.作業日);\n        if (startDate && workDate < new Date(startDate)) return false;\n        if (endDate && workDate > new Date(endDate)) return false;\n      }\n\n      // 作業項目フィルター\n      if (workItem && getWorkItemName(row.作業内容) !== workItem) return false;\n\n      // ステータスフィルター\n      if (status && row.進捗状況 !== status) return false;\n\n      return true;\n    });\n\n    renderRows(filteredRows);\n  }\n\n  // CSVエクスポート\n  function exportCSV() {\n    window.aivicApi.list(1).then(rows => {\n      if (!rows || rows.length === 0) {\n        showError(\"エクスポートするデータがありません\");\n        return;\n      }\n\n      const headers = [\"作業日時\", \"作業項目名\", \"開始時刻\", \"終了時刻\", \"作業時間\", \"中断回数\", \"状況\", \"作業内容\", \"作業場所\"];\n      const csvContent = \"\\uFEFF\" + [\n        headers.join(\",\"),\n        ...rows.map(row => {\n          const breakCount = getBreakCount(row.作業記録ID);\n          const workItemName = getWorkItemName(row.作業内容);\n          \n          return [\n            `\"${formatDate(row.作業日)}\"`,\n            `\"${workItemName}\"`,\n            `\"${formatTime(row.作業開始時刻)}\"`,\n            `\"${formatTime(row.作業終了時刻)}\"`,\n            `\"${formatWorkTime(row.作業時間)}\"`,\n            breakCount,\n            `\"${row.進捗状況 || \"\"}\"`,\n            `\"${(row.作業内容 || \"\").replace(/\"/g, '\"\"')}\"`,\n            `\"${(row.作業場所 || \"\").replace(/\"/g, '\"\"')}\"`\n          ].join(\",\");\n        })\n      ].join(\"\\n\");\n\n      const blob = new Blob([csvContent], { type: \"text/csv;charset=utf-8;\" });\n      const link = document.createElement(\"a\");\n      link.href = URL.createObjectURL(blob);\n      link.download = `作業履歴_${new Date().toISOString().split('T')[0]}.csv`;\n      link.click();\n    });\n  }\n\n  // 初期データ読み込み\n  Promise.all([\n    window.aivicApi.list(1), // 作業記録\n    window.aivicApi.list(2), // 中断記録\n    window.aivicApi.list(3)  // 作業項目マスタ\n  ]).then(([workRecords, breakRecords, workItems]) => {\n    allWorkRecords = workRecords || tables[1]?.records || [];\n    allBreakRecords = breakRecords || tables[2]?.records || [];\n    allWorkItems = workItems || tables[3]?.records || [];\n    \n    updateWorkItemFilter();\n    renderRows(allWorkRecords);\n  });\n\n  // 検索ボタン\n  container.querySelector(\"#btn-search\").addEventListener(\"click\", applyFilters);\n\n  // リセットボタン\n  container.querySelector(\"#btn-reset\").addEventListener(\"click\", () => {\n    container.querySelector(\"#filter-start-date\").value = \"\";\n    container.querySelector(\"#filter-end-date\").value = \"\";\n    container.querySelector(\"#filter-work-item\").value = \"\";\n    container.querySelector(\"#filter-status\").value = \"\";\n    renderRows(allWorkRecords);\n  });\n\n  // CSVエクスポートボタン\n  container.querySelector(\"#btn-csv-export\").addEventListener(\"click\", exportCSV);\n\n  // データ抽出ボタン\n  container.querySelector(\"#btn-data-extract\").addEventListener(\"click\", () => {\n    window.showScreen(\"scr-1778907353387\");\n  });\n\n  // 戻るボタン\n  container.querySelector(\"#btn-back\").addEventListener(\"click\", () => {\n    window.showScreen(\"scr-1778907133295\");\n  });\n\n  // 行レベル操作（詳細確認）\n  container.addEventListener(\"click\", (e) => {\n    const detailBtn = e.target.closest(\".detail-btn\");\n    if (detailBtn) {\n      const recordId = detailBtn.dataset.id;\n      // 詳細確認画面に遷移（レコードIDを渡す方法は実装依存）\n      window.showScreen(\"scr-1778907367889\");\n    }\n  });\n}";
</script>

        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
