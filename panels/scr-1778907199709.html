    <style>
        :root {
            --primary: #4a9eff;
            --primary-hover: #3a8eef;
            --bg-main: #0f0f0f;
            --bg-card: #1a1a1a;
            --bg-sidebar: #141414;
            --border: #2a2a2a;
            --text: #e8e8e8;
            --text-muted: #9a9a9a;
            --top-bar-bg: #161616;
            --top-bar-border: #252525;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            height: 52px;
        }

        .logo {
            width: 24px;
            height: 24px;
            background: var(--primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: white;
        }

        .app-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-section {
            padding: 16px 12px 8px;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            padding: 0 8px;
        }

        .nav-item {
            display: block;
            padding: 8px 12px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 400;
            margin-bottom: 2px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        .nav-item.aivic-active {
            background: var(--primary);
            color: white;
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .breadcrumb-current {
            color: var(--text);
            font-weight: 500;
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .logout-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: color 0.15s ease;
        }

        .logout-link:hover {
            color: var(--text);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quick-action-btn {
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .quick-action-btn:hover {
            border-color: var(--primary);
            background: rgba(74, 158, 255, 0.1);
        }

        .quick-action-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .quick-action-btn.primary:hover {
            background: var(--primary-hover);
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-height: 400px;
            padding: 0;
        }

        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .nav-emergency {
            margin-top: auto;
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        .emergency-btn {
            width: 100%;
            padding: 10px 12px;
            background: var(--error);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        .emergency-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
            
            .quick-actions {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>

ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  // 現在の作業記録データを取得（最新の未完了記録を想定）\n  let currentWorkRecord = null;\n  \n  // 初期データの設定\n  async function initializeData() {\n    try {\n      const workRecords = await window.aivicApi.list(1); // 作業記録テーブル\n      if (workRecords && workRecords.length > 0) {\n        // 最新の未完了記録を取得\n        currentWorkRecord = workRecords.find(r => !r.作業終了時刻) || workRecords[workRecords.length - 1];\n        \n        if (currentWorkRecord) {\n          // 作業項目名の設定\n          const workItems = await window.aivicApi.list(3); // 作業項目マスタ\n          const workItem = workItems?.find(item => item.作業項目ID === currentWorkRecord.作業項目ID);\n          if (workItem) {\n            container.querySelector('#work-item-name').textContent = workItem.作業項目名;\n          }\n          \n          // 開始時刻の設定\n          if (currentWorkRecord.作業開始時刻) {\n            const startTime = new Date(currentWorkRecord.作業開始時刻);\n            container.querySelector('#start-time').textContent = \n              startTime.getHours().toString().padStart(2, '0') + ':' + \n              startTime.getMinutes().toString().padStart(2, '0');\n          }\n          \n          // 終了時刻の設定（現在時刻）\n          const endTime = new Date();\n          container.querySelector('#end-time').textContent = \n            endTime.getHours().toString().padStart(2, '0') + ':' + \n            endTime.getMinutes().toString().padStart(2, '0');\n          \n          // 時間計算\n          calculateWorkTime();\n        }\n      }\n    } catch (error) {\n      console.error('データ初期化エラー:', error);\n    }\n  }\n  \n  // 作業時間計算\n  function calculateWorkTime() {\n    if (!currentWorkRecord || !currentWorkRecord.作業開始時刻) return;\n    \n    const startTime = new Date(currentWorkRecord.作業開始時刻);\n    const endTime = new Date();\n    const totalMinutes = Math.floor((endTime - startTime) / (1000 * 60));\n    \n    // 中断時間の取得\n    let breakMinutes = 0;\n    // 実際の実装では中断記録テーブルから取得\n    \n    const actualMinutes = totalMinutes - breakMinutes;\n    \n    // 表示更新\n    container.querySelector('#total-time').textContent = formatTime(totalMinutes);\n    container.querySelector('#break-time').textContent = formatTime(breakMinutes);\n    container.querySelector('#actual-work-time').textContent = formatTime(actualMinutes);\n  }\n  \n  // 時間フォーマット（分 → HH:MM）\n  function formatTime(minutes) {\n    const hours = Math.floor(minutes / 60);\n    const mins = minutes % 60;\n    return hours.toString().padStart(2, '0') + ':' + mins.toString().padStart(2, '0');\n  }\n  \n  // 文字数カウント\n  function setupCharacterCount(textareaId, countId, maxLength) {\n    const textarea = container.querySelector(`#${textareaId}`);\n    const counter = container.querySelector(`#${countId}`);\n    \n    textarea.addEventListener('input', function() {\n      const length = this.value.length;\n      counter.textContent = length;\n      \n      if (length > maxLength) {\n        counter.style.color = '#ff6a6a';\n        this.style.borderColor = '#ff6a6a';\n      } else {\n        counter.style.color = 'var(--text-muted)';\n        this.style.borderColor = 'rgba(255,255,255,0.18)';\n      }\n    });\n  }\n  \n  // 異常報告チェックボックスの制御\n  function setupIssueReporting() {\n    const hasIssueCheckbox = container.querySelector('#has-issue');\n    const issueSection = container.querySelector('#issue-content-section');\n    const issueContent = container.querySelector('#issue-content');\n    \n    hasIssueCheckbox.addEventListener('change', function() {\n      if (this.checked) {\n        issueSection.style.display = 'block';\n      } else {\n        issueSection.style.display = 'none';\n        issueContent.value = '';\n        container.querySelector('#issue-count').textContent = '0';\n      }\n    });\n  }\n  \n  // エラーメッセージ表示\n  function showError(message) {\n    const errorDiv = container.querySelector('#error-message');\n    errorDiv.textContent = message;\n    errorDiv.style.display = 'block';\n    setTimeout(() => {\n      errorDiv.style.display = 'none';\n    }, 5000);\n  }\n  \n  // バリデーション\n  function validateForm() {\n    const completionStatus = container.querySelector('#completion-status').value;\n    const hasIssue = container.querySelector('#has-issue').checked;\n    const issueContent = container.querySelector('#issue-content').value.trim();\n    const workMemo = container.querySelector('#work-memo').value;\n    const issueContentValue = container.querySelector('#issue-content').value;\n    \n    if (!completionStatus) {\n      showError('完了状況を選択してください。');\n      return false;\n    }\n    \n    if (hasIssue && !issueContent) {\n      showError('異常報告にチェックを入れた場合は、異常内容を入力してください。');\n      return false;\n    }\n    \n    if (workMemo.length > 1000) {\n      showError('作業メモは1000文字以内で入力してください。');\n      return false;\n    }\n    \n    if (issueContentValue.length > 500) {\n      showError('異常内容は500文字以内で入力してください。');\n      return false;\n    }\n    \n    return true;\n  }\n  \n  // 記録確定処理\n  async function confirmRecord() {\n    if (!validateForm()) return;\n    \n    if (!currentWorkRecord) {\n      showError('作業記録が見つかりません。');\n      return;\n    }\n    \n    try {\n      const endTime = new Date();\n      const workMemo = container.querySelector('#work-memo').value.trim();\n      const completionStatus = container.querySelector('#completion-status').value;\n      const hasIssue = container.querySelector('#has-issue').checked;\n      const issueContent = container.querySelector('#issue-content').value.trim();\n      \n      // 作業記録の更新\n      const updatedRecord = await window.aivicApi.update(1, currentWorkRecord.作業記録ID, {\n        作業終了時刻: endTime.toISOString(),\n        作業時間: Math.floor((endTime - new Date(currentWorkRecord.作業開始時刻)) / (1000 * 60)),\n        備考: workMemo,\n        進捗状況: completionStatus,\n        承認状態: '未承認'\n      });\n      \n      if (!updatedRecord) {\n        showError('記録の保存に失敗しました。');\n        return;\n      }\n      \n      // 異常報告がある場合は異常値検出ログに記録\n      if (hasIssue && issueContent) {\n        await window.aivicApi.save(4, {\n          検出対象テーブル: '作業記録',\n          検出対象レコードID: currentWorkRecord.作業記録ID,\n          ユーザーID: currentWorkRecord.作業員ID,\n          異常値種別: '作業員報告',\n          検出項目: '異常・問題報告',\n          検出値: issueContent,\n          閾値: '報告あり',\n          重要度: '中',\n          確認状況: '未確認',\n          通知送信フラグ: true,\n          検出日時: new Date().toISOString()\n        });\n      }\n      \n      alert('工数記録を確定しました。');\n      \n      // 記録確認画面に遷移\n      window.showScreen(\"scr-1778907226171\");\n      \n    } catch (error) {\n      console.error('記録確定エラー:', error);\n      showError('記録の確定中にエラーが発生しました。');\n    }\n  }\n  \n  // イベントリスナーの設定\n  function setupEventListeners() {\n    // 文字数カウント\n    setupCharacterCount('work-memo', 'memo-count', 1000);\n    setupCharacterCount('issue-content', 'issue-count', 500);\n    \n    // 異常報告制御\n    setupIssueReporting();\n    \n    // ボタンイベント\n    container.querySelector('#btn-confirm').addEventListener('click', confirmRecord);\n    \n    container.querySelector('#btn-cancel').addEventListener('click', function() {\n      if (confirm('入力内容が失われますが、キャンセルしますか？')) {\n        history.back();\n      }\n    });\n    \n    container.querySelector('#btn-record-check').addEventListener('click', function() {\n      window.showScreen(\"scr-1778907226171\");\n    });\n    \n    // ボタンホバー効果\n    const primaryBtn = container.querySelector('#btn-confirm');\n    primaryBtn.addEventListener('mouseenter', function() {\n      this.style.background = 'var(--primary-hover)';\n    });\n    primaryBtn.addEventListener('mouseleave', function() {\n      this.style.background = 'var(--primary)';\n    });\n    \n    const secondaryBtns = container.querySelectorAll('.action-btn.secondary');\n    secondaryBtns.forEach(btn => {\n      btn.addEventListener('mouseenter', function() {\n        this.style.background = 'rgba(255,255,255,0.05)';\n      });\n      btn.addEventListener('mouseleave', function()     }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
