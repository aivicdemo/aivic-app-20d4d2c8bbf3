window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  // DOM要素の取得\n  const completionStatus = container.querySelector('#completion-status');\n  const workMemo = container.querySelector('#work-memo');\n  const hasIssue = container.querySelector('#has-issue');\n  const issueContentSection = container.querySelector('#issue-content-section');\n  const issueContent = container.querySelector('#issue-content');\n  const errorMessage = container.querySelector('#error-message');\n  const memoCount = container.querySelector('#memo-count');\n  const issueCount = container.querySelector('#issue-count');\n  const btnCancel = container.querySelector('#btn-cancel');\n  const btnConfirm = container.querySelector('#btn-confirm');\n  const btnRecordCheck = container.querySelector('#btn-record-check');\n\n  // 現在の作業記録データ（実際の実装では前画面から受け取る）\n  let currentWorkRecord = {\n    id: 'work-001',\n    startTime: '09:00',\n    endTime: '17:30',\n    totalTime: '8:30',\n    breakTime: '1:00',\n    actualWorkTime: '7:30',\n    workItemName: 'システム開発作業'\n  };\n\n  // エラーメッセージ表示関数\n  function showError(message) {\n    errorMessage.textContent = message;\n    errorMessage.style.display = 'block';\n    setTimeout(() => {\n      errorMessage.style.display = 'none';\n    }, 5000);\n  }\n\n  // 文字数カウント更新\n  function updateMemoCount() {\n    memoCount.textContent = workMemo.value.length;\n  }\n\n  function updateIssueCount() {\n    issueCount.textContent = issueContent.value.length;\n  }\n\n  // 異常報告チェックボックスの制御\n  hasIssue.addEventListener('change', function() {\n    if (this.checked) {\n      issueContentSection.style.display = 'block';\n    } else {\n      issueContentSection.style.display = 'none';\n      issueContent.value = '';\n      updateIssueCount();\n    }\n  });\n\n  // 文字数カウントのイベントリスナー\n  workMemo.addEventListener('input', updateMemoCount);\n  issueContent.addEventListener('input', updateIssueCount);\n\n  // バリデーション関数\n  function validateForm() {\n    // 完了状況の必須チェック\n    if (!completionStatus.value) {\n      showError('完了状況を選択してください。');\n      return false;\n    }\n\n    // 作業メモの文字数チェック\n    if (workMemo.value.length > 1000) {\n      showError('作業メモは1000文字以内で入力してください。');\n      return false;\n    }\n\n    // 異常報告がチェックされている場合の異常内容必須チェック\n    if (hasIssue.checked && !issueContent.value.trim()) {\n      showError('異常報告にチェックが入っている場合、異常内容の入力は必須です。');\n      return false;\n    }\n\n    // 異常内容の文字数チェック\n    if (issueContent.value.length > 500) {\n      showError('異常内容は500文字以内で入力してください。');\n      return false;\n    }\n\n    return true;\n  }\n\n  // 記録確定ボタンのイベントリスナー\n  btnConfirm.addEventListener('click', async function() {\n    if (!validateForm()) {\n      return;\n    }\n\n    try {\n      // 作業記録の更新データを準備\n      const updateData = {\n        作業終了時刻: new Date(),\n        進捗状況: completionStatus.value,\n        備考: workMemo.value || null,\n        承認状態: '未承認'\n      };\n\n      // 作業記録を更新（テーブルインデックス1: 作業記録）\n      const updated = await window.aivicApi.update(1, currentWorkRecord.id, updateData);\n      \n      if (updated) {\n        // 異常報告がある場合は異常値検出ログに記録（テーブルインデックス4: 異常値検出ログ）\n        if (hasIssue.checked && issueContent.value.trim()) {\n          const issueData = {\n            検出対象テーブル: '作業記録',\n            検出対象レコードID: currentWorkRecord.id,\n            ユーザーID: 'current-user-id', // 実際の実装では現在のユーザーIDを使用\n            異常値種別: '作業員報告',\n            検出項目: '作業内容',\n            検出値: issueContent.value,\n            閾値: '手動報告',\n            重要度: '中',\n            確認状況: '未確認',\n            通知送信フラグ: false,\n            検出日時: new Date(),\n            作成日時: new Date(),\n            更新日時: new Date()\n          };\n\n          await window.aivicApi.save(4, issueData);\n        }\n\n        // 成功メッセージを表示\n        alert('工数記録が正常に確定されました。');\n        \n        // 前画面に戻る（実際の実装では適切な画面に遷移）\n        history.back();\n      } else {\n        showError('記録の保存に失敗しました。もう一度お試しください。');\n      }\n    } catch (error) {\n      console.error('記録確定エラー:', error);\n      showError('記録の保存中にエラーが発生しました。');\n    }\n  });\n\n  // キャンセルボタンのイベントリスナー\n  btnCancel.addEventListener('click', function() {\n    if (workMemo.value || issueContent.value || completionStatus.value) {\n      if (!confirm('入力内容が失われますが、よろしいですか？')) {\n        return;\n      }\n    }\n    history.back();\n  });\n\n  // 記録確認ボタンのイベントリスナー\n  btnRecordCheck.addEventListener('click', function() {\n    window.showScreen(\"scr-1778907226171\");\n  });\n\n  // ホバー効果\n  btnCancel.addEventListener('mouseenter', function() {\n    this.style.background = 'rgba(255,255,255,0.05)';\n  });\n  btnCancel.addEventListener('mouseleave', function() {\n    this.style.background = 'transparent';\n  });\n\n  btnConfirm.addEventListener('mouseenter', function() {\n    this.style.background = 'var(--primary-hover)';\n  });\n  btnConfirm.addEventListener('mouseleave', function() {\n    this.style.background = 'var(--primary)';\n  });\n\n  btnRecordCheck.addEventListener('mouseenter', function() {\n    this.style.background = 'rgba(255,255,255,0.05)';\n  });\n  btnRecordCheck.addEventListener('mouseleave', function() {\n    this.style.background = 'transparent';\n  });\n\n  // 初期化時に時刻情報を更新（実際の実装では前画面からのデータを使用）\n  container.querySelector('#work-item-name').textContent = currentWorkRecord.workItemName;\n  container.querySelector('#start-time').textContent = currentWorkRecord.startTime;\n  container.querySelector('#end-time').textContent = currentWorkRecord.endTime;\n  container.querySelector('#total-time').textContent = currentWorkRecord.totalTime;\n  container.querySelector('#break-time').textContent = currentWorkRecord.breakTime;\n  container.querySelector('#actual-work-time').textContent = currentWorkRecord.actualWorkTime;\n}";

    <style>
        :root {

            color: var(--text-light);

            background: rgba(217, 119, 6, 0.1);
            color: var(--warning);

            height: 6px;
            border-radius: 50%;

            color: white;
            font-size: 10px;
            font-weight: 600;

            overflow-y: auto;

            display: none;

            color: var(--primary);

            border-color: var(--primary);
            color: white;
        }

        @media (max-width: 768px) {

            .sidebar.open {

                margin-left: 0;
            }

            .top-bar {
                padding: 0 16px;
            }

            .content-area {

            }
        }

        /* ユーティリティ */

        .text-xs { font-size: 11px; }
        .font-medium { font-weight: 500; }
        .font-semibold { font-weight: 600; }
        .text-muted { color: var(--text-muted); }

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();

      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {

        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});

    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
