 || container.querySelector('[data-testid=\"end-record-button\"]');\n  const cancelButton = container.querySelector('[data-testid=\"cancel-button\"]');\n\n  // 作業項目選択・時間入力・作業内容等の要素\n  const workItemSelect = container.querySelector('[data-testid=\"work-item-select\"]');\n  const startTimeInput = container.querySelector('[data-testid=\"start-time-input\"]');\n  const endTimeInput = container.querySelector('[data-testid=\"end-time-input\"]');\n  const workDetailInput = container.querySelector('[data-testid=\"work-detail-input\"]');\n  const locationSelect = container.querySelector('[data-testid=\"location-select\"]');\n  const workerNameInput = container.querySelector('[data-testid=\"worker-name-input\"]');\n  const workTimeInput = container.querySelector('[data-testid=\"work-time-input\"]');\n  const workContentInput = container.querySelector('[data-testid=\"work-content-input\"]');\n\n  // 初期表示データの設定\n  const workItemNameEl = container.querySelector('#work-item-name');\n  const startTimeEl = container.querySelector('#start-time');\n  const endTimeEl = container.querySelector('#end-time');\n  const totalTimeEl = container.querySelector('#total-time');\n  const breakTimeEl = container.querySelector('#break-time');\n  const actualWorkTimeEl = container.querySelector('#actual-work-time');\n\n  if (workItemNameEl) workItemNameEl.textContent = currentWorkRecord.workItemName;\n  if (startTimeEl) startTimeEl.textContent = currentWorkRecord.startTime;\n  if (endTimeEl) endTimeEl.textContent = currentWorkRecord.endTime;\n  if (totalTimeEl) totalTimeEl.textContent = currentWorkRecord.totalTime;\n  if (breakTimeEl) breakTimeEl.textContent = currentWorkRecord.breakTime;\n  if (actualWorkTimeEl) actualWorkTimeEl.textContent = currentWorkRecord.actualWorkTime;\n\n  // エラーメッセージ表示関数\n  function showError(message) {\n    if (errorMessage) {\n      errorMessage.textContent = message;\n      errorMessage.style.display = 'block';\n      errorMessage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });\n    }\n    if (window.aivicNotify) {\n      window.aivicNotify.error(message);\n    }\n  }\n\n  // 成功メッセージ表示関数\n  function showSuccess(message) {\n    if (successMessage) {\n      successMessage.textContent = message;\n      successMessage.style.display = 'block';\n      successMessage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });\n    }\n    if (window.aivicNotify) {\n      window.aivicNotify.success(message);\n    }\n  }\n\n  // エラーメッセージ非表示関数\n  function hideError() {\n    if (errorMessage) {\n      errorMessage.style.display = 'none';\n    }\n  }\n\n  // 文字数カウント更新関数\n  function updateCharCount(input, countSpan, maxLength) {\n    if (input && countSpan) {\n      const currentLength = input.value.length;\n      countSpan.textContent = `${currentLength}/${maxLength}`;\n      \n      if (currentLength > maxLength) {\n        countSpan.style.color = 'var(--error)';\n        return false;\n      } else {\n        countSpan.style.color = 'var(--text-secondary)';\n        return true;\n      }\n    }\n    return true;\n  }\n\n  // 作業メモの文字数カウント\n  if (workMemoInput && memoCountSpan) {\n    workMemoInput.addEventListener('input', () => {\n      updateCharCount(workMemoInput, memoCountSpan, 1000);\n    });\n    updateCharCount(workMemoInput, memoCountSpan, 1000);\n  }\n\n  // 異常内容の文字数カウント\n  if (issueContentInput && issueCountSpan) {\n    issueContentInput.addEventListener('input', () => {\n      updateCharCount(issueContentInput, issueCountSpan, 1000);\n    });\n    updateCharCount(issueContentInput, issueCountSpan, 1000);\n  }\n\n  // 異常報告チェックボックスの制御\n  if (hasIssueCheckbox && issueContentSection) {\n    hasIssueCheckbox.addEventListener('change', () => {\n      if (hasIssueCheckbox.checked) {\n        issueContentSection.style.display = 'block';\n      } else {\n        issueContentSection.style.display = 'none';\n        if (issueContentInput) {\n          issueContentInput.value = '';\n        }\n      }\n    });\n  }\n\n  // フォームデータ収集関数\n  function collectFormData() {\n    return {\n      workItem: workItemSelect ? workItemSelect.value : '',\n      startTime: startTimeInput ? startTimeInput.value : currentWorkRecord.startTime,\n      endTime: endTimeInput ? endTimeInput.value : currentWorkRecord.endTime,\n      workDetail: workDetailInput ? workDetailInput.value : '',\n      location: locationSelect ? locationSelect.value : '',\n      workerName: workerNameInput ? workerNameInput.value : '',\n      workTime: workTimeInput ? workTimeInput.value : currentWorkRecord.actualWorkTime,\n      workContent: workContentInput ? workContentInput.value : '',\n      memo: workMemoInput ? workMemoInput.value : '',\n      completionStatus: completionStatusSelect ? completionStatusSelect.value : '',\n      hasIssue: hasIssueCheckbox ? hasIssueCheckbox.checked : false,\n      issueContent: issueContentInput ? issueContentInput.value : ''\n    };\n  }\n\n  // バリデーション実行関数\n  function validateForm(formData) {\n    // 必須フィールドのバリデーション\n    const requiredFields = {\n      completionStatus: formData.completionStatus\n    };\n\n    if (validateRequiredFields) {\n      const requiredValidation = validateRequiredFields(requiredFields);\n      if (!requiredValidation.isValid) {\n        return { isValid: false, message: '完了状況を選択してください' };\n      }\n    }\n\n    // 異常報告チェック時の異常内容バリデーション\n    if (formData.hasIssue && !formData.issueContent.trim()) {\n      return { isValid: false, message: '異常内容を入力してください' };\n    }\n\n    // 文字数制限チェック\n    if (formData.memo.length > 1000) {\n      return { isValid: false, message: '作業メモは1000文字以内で入力してください（文字数超過）' };\n    }\n\n    if (formData.issueContent.length > 1000) {\n      return { isValid: false, message: '異常内容は1000文字以内で入力してください（文字数超過）' };\n    }\n\n    // 時間シーケンスのバリデーション\n    if (validateTimeSequence && formData.startTime && formData.endTime) {\n      const timeValidation = validateTimeSequence(formData.startTime, formData.endTime);\n      if (!timeValidation.isValid) {\n        return { isValid: false, message: '開始時刻と終了時刻の関係が正しくありません' };\n      }\n    }\n\n    // 作業時間の異常検知\n    if (detectWorkTimeAnomaly && formData.workTime) {\n      const anomalyResult = detectWorkTimeAnomaly(formData.workTime);\n      if (anomalyResult.hasAnomaly) {\n        return { isValid: false, message: `作業時間に異常が検出されました: ${anomalyResult.message}` };\n      }\n    }\n\n    return { isValid: true };\n  }\n\n  // 記録確定処理\n  async function confirmRecord() {\n    try {\n      hideError();\n      \n      const formData = collectFormData();\n      \n      // バリデーション実行\n      const validation = validateForm(formData);\n      if (!validation.isValid) {\n        showError(validation.message);\n        return;\n      }\n\n      // 業務ロジックによる包括的バリデーション\n      if (validateWorkRecordComprehensive) {\n        const comprehensiveValidation = validateWorkRecordComprehensive(formData);\n        if (!comprehensiveValidation.isValid) {\n          showError(comprehensiveValidation.message);\n          return;\n        }\n      }\n\n      // データ品質チェック\n      if (validateDataCompleteness) {\n        const dataQuality = validateDataCompleteness(formData);\n        if (!dataQuality.isComplete) {\n          showError('入力データに不備があります');\n          return;\n        }\n      }\n\n      // 効率性分析\n      let efficiencyRate = 0;\n      if (calculateEfficiencyRate && formData.workTime) {\n        efficiencyRate = calculateEfficiencyRate(formData.workTime, formData.startTime, formData.endTime);\n      }\n\n      // 生産性指標計算\n      let productivityIndex = 0;\n      if (calculateProductivityIndex) {\n        productivityIndex = calculateProductivityIndex(formData);\n      }\n\n      // 保存データの準備\n      const recordData = {\n        ...currentWorkRecord,\n        ...formData,\n        efficiencyRate,\n        productivityIndex,\n        recordedAt: new Date().toISOString(),\n        status: 'completed'\n      };\n\n      // API経由でデータ保存\n      if (window.aivicApi && window.aivicApi.save) {\n        await window.aivicApi.save('work_records', recordData);\n      }\n\n      // 成功メッセージ表示\n      showSuccess('工数記録が正常に保存されました');\n\n      // 少し待ってから一覧画面に遷移\n      setTimeout(() => {\n        if (window.showScreen) {\n          window.showScreen('work-record-list');\n        } else {\n          window.location.href = '/panels/scr-work-record-list.html';\n        }\n      }, 1500);\n\n    } catch (error) {\n      console.error('記録確定エラー:', error);\n      showError('記録の保存中にエラーが発生しました');\n    }\n  }\n\n  // キャンセル処理\n  function cancelRecord() {\n    if (window.showScreen) {\n      window.showScreen('work-record');\n    } else {\n      window.location.href = '/panels/scr-work-record.html';\n    }\n  }\n\n  // イベントリスナーの設定\n  if (confirmButton) {\n    confirmButton.addEventListener('click', confirmRecord);\n  }\n\n  if (cancelButton) {\n    cancelButton.addEventListener('click', cancelRecord);\n  }\n\n  // 入力時のリアルタイムバリデーション\n  const inputs = [workMemoInput, completionStatusSelect, issueContentInput];\n  inputs.forEach(input => {\n    if (input) {\n      input.addEventListener('input', hideError);\n      input.addEventListener('change', hideError);\n    }\n  });\n\n  // 初期状態の設定\n  if (issueContentSection) {\n    issueContentSection.style.display = 'none';\n  }\n\n  // 初期データの読み込み\n  async function loadInitialData() {\n    try {\n      if (window.aivicApi && window.aivicApi.list) {\n        // 作業項目の読み込み\n        if (workItemSelect) {\n          const workItems = await window.aivicApi.list('work_items');\n          workItems.forEach(item => {\n            const option = document.createElement('option');\n            option.value = item.id;\n            option.textContent = item.name;\n            workItemSelect.appendChild(option);\n          });\n        }\n\n        // 作業場所の読み込み\n        if (locationSelect) {\n          const locations = await window.aivicApi.list('locations');\n          locations.forEach(location => {\n            const option = document.createElement('option');\n            option.value = location.id;\n            option.textContent = location.name;\n            locationSelect.appendChild(option);\n          });\n        }\n      }\n    } catch (error) {\n      console.error('初期データ読み込みエラー:', error);\n    }\n  }\n\n  // 初期化実行\n  loadInitialData();\n}";

  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");

      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");

  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
