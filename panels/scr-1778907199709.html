ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  // 現在の作業記録データ（実際の実装では前画面から受け取る）\n  let currentWorkRecord = {\n    id: 'current-work-001',\n    workItemName: 'システム保守作業',\n    startTime: '09:00',\n    endTime: '17:30',\n    totalTime: '8:30',\n    breakTime: '1:00',\n    actualWorkTime: '7:30'\n  };\n\n  // DOM要素の取得\n  const workMemoInput = container.querySelector('#work-memo');\n  const completionStatusSelect = container.querySelector('#completion-status');\n  const hasIssueCheckbox = container.querySelector('#has-issue');\n  const issueContentSection = container.querySelector('#issue-content-section');\n  const issueContentInput = container.querySelector('#issue-content');\n  const errorMessage = container.querySelector('#error-message');\n  const memoCountSpan = container.querySelector('#memo-count');\n  const issueCountSpan = container.querySelector('#issue-count');\n\n  // 初期表示データの設定\n  container.querySelector('#work-item-name').textContent = currentWorkRecord.workItemName;\n  container.querySelector('#start-time').textContent = currentWorkRecord.startTime;\n  container.querySelector('#end-time').textContent = currentWorkRecord.endTime;\n  container.querySelector('#total-time').textContent = currentWorkRecord.totalTime;\n  container.querySelector('#break-time').textContent = currentWorkRecord.breakTime;\n  container.querySelector('#actual-work-time').textContent = currentWorkRecord.actualWorkTime;\n\n  // エラーメッセージ表示関数\n  function showError(message) {\n    errorMessage.textContent = message;\n    errorMessage.style.display = 'block';\n    errorMessage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });\n  }\n\n  function hideError() {\n    errorMessage.style.display = 'none';\n  }\n\n  // 文字数カウント更新\n  function updateMemoCount() {\n    const count = workMemoInput.value.length;\n    memoCountSpan.textContent = count;\n    if (count > 1000) {\n      memoCountSpan.style.color = '#dc3545';\n    } else {\n      memoCountSpan.style.color = 'var(--text-muted)';\n    }\n  }\n\n  function updateIssueCount() {\n    const count = issueContentInput.value.length;\n    issueCountSpan.textContent = count;\n    if (count > 500) {\n      issueCountSpan.style.color = '#dc3545';\n    } else {\n      issueCountSpan.style.color = 'var(--text-muted)';\n    }\n  }\n\n  // バリデーション関数\n  function validateForm() {\n    hideError();\n\n    // 完了状況の必須チェック\n    if (!completionStatusSelect.value) {\n      showError('完了状況を選択してください。');\n      completionStatusSelect.focus();\n      return false;\n    }\n\n    // 作業メモの文字数チェック\n    if (workMemoInput.value.length > 1000) {\n      showError('作業メモは1000文字以内で入力してください。');\n      workMemoInput.focus();\n      return false;\n    }\n\n    // 異常報告チェック時の異常内容必須チェック\n    if (hasIssueCheckbox.checked) {\n      if (!issueContentInput.value.trim()) {\n        showError('異常内容を入力してください。');\n        issueContentInput.focus();\n        return false;\n      }\n      if (issueContentInput.value.length > 500) {\n        showError('異常内容は500文字以内で入力してください。');\n        issueContentInput.focus();\n        return false;\n      }\n    }\n\n    return true;\n  }\n\n  // 異常報告チェックボックスの変更イベント\n  hasIssueCheckbox.addEventListener('change', function() {\n    if (this.checked) {\n      issueContentSection.style.display = 'block';\n    } else {\n      issueContentSection.style.display = 'none';\n      issueContentInput.value = '';\n      updateIssueCount();\n    }\n    hideError();\n  });\n\n  // 文字数カウントイベント\n  workMemoInput.addEventListener('input', updateMemoCount);\n  issueContentInput.addEventListener('input', updateIssueCount);\n\n  // 初期文字数カウント\n  updateMemoCount();\n  updateIssueCount();\n\n  // キャンセルボタン\n  container.querySelector('#btn-cancel').addEventListener('click', function() {\n    // 前画面に戻る（実際の実装では適切な画面IDを指定）\n    history.back();\n  });\n\n  // 記録確定ボタン\n  container.querySelector('#btn-confirm').addEventListener('click', async function() {\n    if (!validateForm()) {\n      return;\n    }\n\n    try {\n      // 作業記録の更新データを準備\n      const updateData = {\n        作業終了時刻: new Date().toISOString(),\n        作業時間: calculateWorkMinutes(currentWorkRecord.actualWorkTime),\n        進捗状況: completionStatusSelect.value,\n        備考: workMemoInput.value || null,\n        承認状態: '未承認'\n      };\n\n      // 作業記録を更新\n      const updated = await window.aivicApi.update(1, currentWorkRecord.id, updateData);\n      if (!updated) {\n        showError('記録の保存に失敗しました。');\n        return;\n      }\n\n      // 異常報告がある場合は異常値検出ログに保存\n      if (hasIssueCheckbox.checked && issueContentInput.value.trim()) {\n        const anomalyData = {\n          検出対象テーブル: '作業記録',\n          検出対象レコードID: currentWorkRecord.id,\n          ユーザーID: 'current-user-id', // 実際の実装では現在のユーザーIDを取得\n          異常値種別: '作業員報告',\n          検出項目: '異常・問題報告',\n          検出値: issueContentInput.value,\n          閾値: '手動報告',\n          重要度: '中',\n          確認状況: '未確認',\n          通知送信フラグ: true,\n          検出日時: new Date().toISOString(),\n          作成日時: new Date().toISOString(),\n          更新日時: new Date().toISOString()\n        };\n\n        await window.aivicApi.save(4, anomalyData);\n      }\n\n      alert('工数記録を確定しました。');\n      // 記録一覧画面などに遷移（実際の実装では適切な画面IDを指定）\n      history.back();\n\n    } catch (error) {\n      console.error('記録確定エラー:', error);\n      showError('記録の確定中にエラーが発生しました。');\n    }\n  });\n\n  // 記録確認ボタン\n  container.querySelector('#btn-check-record').addEventListener('click', function() {\n    window.showScreen(\"scr-1778907226171\");\n  });\n\n  // 作業時間を分単位に変換する関数\n  function calculateWorkMinutes(timeString) {\n    const [hours, minutes] = timeString.split(':').map(Number);\n    return hours * 60 + minutes;\n  }\n\n  // ボタンのホバーエフェクト\n  const buttons = container.querySelectorAll('button');\n  buttons.forEach(button => {\n    button.addEventListener('mouseenter', function() {\n      if (this.style.background === 'var(--primary)') {\n        this.style.background = 'var(--primary-hover)';\n      } else if (this.style.background === 'transparent') {\n        this.style.background = 'rgba(255,255,255,0.05)';\n      }\n    });\n\n    button.addEventListener('mouseleave', function() {\n      if (this.id === 'btn-confirm') {\n        this.style.background = 'var(--primary)';\n      } else {\n        this.style.background = 'transparent';\n      }\n    });\n  });\n\n  // フォーカス時のスタイル\n  const inputs = container.querySelectorAll('input, select, textarea');\n  inputs.forEach(input => {\n    input.addEventListener('focus', function() {\n      this.style.outline = 'none';\n      this.style.borderColor = 'var(--primary)';\n      this.style.boxShadow = '0 0 0 2px rgba(255,255,255,0.08)';\n    });\n\n    input.addEventListener('blur', function() {\n      this.style.borderColor = 'rgba(255,255,255,0.18)';\n      this.style.boxShadow = 'none';\n    });\n  });\n}";
</script>

    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");

      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }

      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },

  })();

    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";

    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },

      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
