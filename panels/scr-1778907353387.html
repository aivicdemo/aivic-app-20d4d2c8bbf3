<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>工数記録システム</title>
    <style>
        :root {
            --primary: #cc1f1f;
            --primary-hover: #a61a1a;
            --bg-main: #0d0d0d;
            --bg-card: #1a1010;
            --bg-sidebar: #151111;
            --border: #331a1a;
            --text: #e6e6e6;
            --text-muted: #999999;
            --top-bar-bg: #1f1515;
            --top-bar-border: #2d1a1a;
            --warning: #ff6b35;
            --error: #ff3333;
            --success: #28a745;

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: "⚠";
            font-size: 18px;
        }

        .nav-section {
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }

        .nav-section:last-child {
            border-bottom: none;
            flex: 1;
        }

        .nav-title {
            padding: 0 16px 8px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: block;
            padding: 8px 16px;
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: rgba(204, 31, 31, 0.1);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: rgba(204, 31, 31, 0.15);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            margin-left: 220px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
        }

        .current-time {
            font-size: 12px;
            font-weight: 500;
            color: var(--primary);
            font-family: 'Courier New', monospace;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text);
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .user-menu:hover {
            background: var(--bg-sidebar);
            border-color: var(--primary);
        }

        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            min-height: calc(100vh - 132px);
        }

        .emergency-banner {
            background: linear-gradient(135deg, var(--error), var(--warning));
            color: white;
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            animation: flash 3s infinite;
        }

        @keyframes flash {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.7; }
        }

        .quick-actions {
            padding: 12px 16px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }

        .quick-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            margin-right: 8px;
            transition: all 0.15s ease;
        }

        .quick-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .quick-btn.secondary {
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
        }

        .quick-btn.secondary:hover {
            background: var(--border);
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .content-area {
                padding: 12px;
            }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(13, 13, 13, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let allWorkRecords = [];\n  let allUsers = [];\n  let allWorkItems = [];\n  let allInterruptions = [];\n  let allAnomalies = [];\n  \n  // エラー表示関数\n  function showError(message) {\n    const errorDiv = container.querySelector('#error-message');\n    errorDiv.textContent = message;\n    errorDiv.style.display = 'block';\n    setTimeout(() => {\n      errorDiv.style.display = 'none';\n    }, 5000);\n  }\n\n  // プレビューテーブル再描画関数\n  function renderPreview(records) {\n    const tbody = container.querySelector('#preview-tbody');\n    const countSpan = container.querySelector('#data-count');\n    \n    countSpan.textContent = records.length;\n    \n    if (records.length === 0) {\n      tbody.innerHTML = '<tr><td colspan=\"6\" style=\"padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;\">該当するデータが見つかりませんでした</td></tr>';\n      return;\n    }\n\n    // 最大100件まで表示\n    const displayRecords = records.slice(0, 100);\n    tbody.innerHTML = displayRecords.map(record => {\n      const user = allUsers.find(u => u.ユーザーID === record.作業員ID);\n      const workDate = new Date(record.作業日).toLocaleDateString('ja-JP');\n      const workTime = record.作業時間 ? `${Math.floor(record.作業時間 / 60)}時間${record.作業時間 % 60}分` : '未完了';\n      \n      return `\n        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05);\">\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${user?.氏名 || '不明'}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${workDate}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${workTime}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${record.作業場所 || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${record.作業内容 || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${record.進捗状況 || ''}</td>\n        </tr>\n      `;\n    }).join('');\n\n    if (records.length > 100) {\n      tbody.innerHTML += `<tr><td colspan=\"6\" style=\"padding: 8px 10px; text-align: center; color: var(--text-muted); font-size: 12px;\">※ ${records.length}件中100件を表示</td></tr>`;\n    }\n  }\n\n  // 条件プレビュー更新\n  function updateConditionPreview() {\n    const startDate = container.querySelector('#start-date').value;\n    const endDate = container.querySelector('#end-date').value;\n    const outputFormat = container.querySelector('#output-format').value;\n    const workLocation = container.querySelector('#work-location').value;\n    const includeAnomaly = container.querySelector('#include-anomaly').checked;\n    const includeInterruption = container.querySelector('#include-interruption').checked;\n    \n    const workerSelect = container.querySelector('#worker-select');\n    const selectedWorkers = Array.from(workerSelect.selectedOptions).map(opt => opt.text);\n    \n    const workItemSelect = container.querySelector('#work-item-select');\n    const selectedWorkItems = Array.from(workItemSelect.selectedOptions).map(opt => opt.text);\n\n    let preview = [];\n    \n    if (startDate && endDate) {\n      preview.push(`期間: ${startDate} ～ ${endDate}`);\n    }\n    \n    if (selectedWorkers.length > 0) {\n      preview.push(`作業員: ${selectedWorkers.join(', ')}`);\n    }\n    \n    if (selectedWorkItems.length > 0) {\n      preview.push(`作業項目: ${selectedWorkItems.join(', ')}`);\n    }\n    \n    if (workLocation) {\n      preview.push(`作業場所: ${workLocation}`);\n    }\n    \n    if (outputFormat) {\n      preview.push(`出力形式: ${outputFormat.toUpperCase()}`);\n    }\n    \n    preview.push(`異常値データ: ${includeAnomaly ? '含む' : '除外'}`);\n    preview.push(`中断記録: ${includeInterruption ? '含む' : '除外'}`);\n\n    const previewDiv = container.querySelector('#condition-preview');\n    previewDiv.textContent = preview.length > 0 ? preview.join(' | ') : '条件を設定してください';\n  }\n\n  // データフィルタリング\n  function filterData() {\n    const startDate = container.querySelector('#start-date').value;\n    const endDate = container.querySelector('#end-date').value;\n    const workLocation = container.querySelector('#work-location').value;\n    const includeAnomaly = container.querySelector('#include-anomaly').checked;\n    const includeInterruption = container.querySelector('#include-interruption').checked;\n    \n    const workerSelect = container.querySelector('#worker-select');\n    const selectedWorkerIds = Array.from(workerSelect.selectedOptions).map(opt => opt.value);\n    \n    const workItemSelect = container.querySelector('#work-item-select');\n    const selectedWorkItemIds = Array.from(workItemSelect.selectedOptions).map(opt => opt.value);\n\n    let filtered = [...allWorkRecords];\n\n    // 期間フィルタ\n    if (startDate && endDate) {\n      const start = new Date(startDate);\n      const end = new Date(endDate);\n      filtered = filtered.filter(record => {\n        const workDate = new Date(record.作業日);\n        return workDate >= start && workDate <= end;\n      });\n    }\n\n    // 作業員フィルタ\n    if (selectedWorkerIds.length > 0) {\n      filtered = filtered.filter(record => selectedWorkerIds.includes(record.作業員ID));\n    }\n\n    // 作業場所フィルタ\n    if (workLocation) {\n      filtered = filtered.filter(record => \n        record.作業場所 && record.作業場所.includes(workLocation)\n      );\n    }\n\n    // 異常値フィルタ\n    if (!includeAnomaly) {\n      const anomalyRecordIds = allAnomalies.map(a => a.検出対象レコードID);\n      filtered = filtered.filter(record => !anomalyRecordIds.includes(record.作業記録ID));\n    }\n\n    // 中断記録フィルタ\n    if (!includeInterruption) {\n      const interruptionRecordIds = allInterruptions.map(i => i.作業記録ID);\n      filtered = filtered.filter(record => !interruptionRecordIds.includes(record.作業記録ID));\n    }\n\n    return filtered;\n  }\n\n  // バリデーション\n  function validateConditions() {\n    const startDate = container.querySelector('#start-date').value;\n    const endDate = container.querySelector('#end-date').value;\n    const outputFormat = container.querySelector('#output-format').value;\n    const workerSelect = container.querySelector('#worker-select');\n    const selectedWorkers = Array.from(workerSelect.selectedOptions);\n\n    if (!startDate || !endDate) {\n      showError('抽出期間を指定してください');\n      return false;\n    }\n\n    if (new Date(startDate) > new Date(endDate)) {\n      showError('開始日は終了日より前の日付を入力してください');\n      return false;\n    }\n\n    if (selectedWorkers.length === 0) {\n      showError('作業員を選択してください');\n      return false;\n    }\n\n    if (!outputFormat) {\n      showError('出力形式を選択してください');\n      return false;\n    }\n\n    return true;\n  }\n\n  // CSV/Excel出力\n  function exportData(records, format) {\n    if (records.length === 0) {\n      showError('出力するデータがありません');\n      return;\n    }\n\n    // 最大件数チェック（10000件）\n    if (records.length > 10000) {\n      showError('抽出件数が上限（10,000件）を超えています。条件を絞り込んでください。');\n      return;\n    }\n\n    const headers = ['作業員名', '作業日', '作業開始時刻', '作業終了時刻', '作業時間', '作業場所', '作業種別', '作業内容', '進捗状況'];\n    \n    const csvData = records.map(record => {\n      const user = allUsers.find(u => u.ユーザーID === record.作業員ID);\n      const workDate = new Date(record.作業日).toLocaleDateString('ja-JP');\n      const startTime = record.作業開始時刻 ? new Date(record.作業開始時刻).toLocaleString('ja-JP') : '';\n      const endTime = record.作業終了時刻 ? new Date(record.作業終了時刻).toLocaleString('ja-JP') : '';\n      const workTime = record.作業時間 ? `${Math.floor(record.作業時間 / 60)}:${String(record.作業時間 % 60).padStart(2, '0')}` : '';\n      \n      return [\n        user?.氏名 || '不明',\n        workDate,\n        startTime,\n        endTime,\n        workTime,\n        record.作業場所 || '',\n        record.作業種別 || '',\n        record.作業内容 || '',\n        record.進捗状況 || ''\n      ];\n    });\n\n    const csvContent = [headers, ...csvData]\n      .map(row => row.map(cell => `\"${String(cell).replace(/\"/g, '\"\"')}\"`).join(','))\n      .join('\\n');\n\n    const bom = '\\uFEFF';\n    const blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    const url = URL.createObjectURL(blob);\n    link.setAttribute('href', url);\n    \n    const now = new Date();\n    const timestamp = now.toISOString().slice(0, 19).replace(/[:-]/g, '');\n    const filename = `工数記録データ_${timestamp}.${format}`;\n    \n    link.setAttribute('download', filename);\n    link.style.visibility = 'hidden';\n    document.body.appendChild(link);\n    link.click();\n    document.body.removeChild(link);\n  }\n\n  // 条件クリア\n  function clearConditions() {\n    container.querySelector('#start-date').value = '';\n    container.querySelector('#end-date').value = '';\n    container.querySelector('#output-format').value = '';\n    container.querySelector('#work-location').value = '';\n    container.querySelector('#include-anomaly').checked = false;\n    container.querySelector('#include-interruption').checked = false;\n    container.querySelector('#worker-select').selectedIndex = -1;\n    container.querySelector('#work-item-select').selectedIndex = -1;\n    \n    updateConditionPreview();\n    renderPreview([]);\n  }\n\n  // 初期データ読み込み\n  async function loadInitialData() {\n    try {\n      // 作業記録データ\n      const workRecords = await window.aivicApi.list(1);\n      if (workRecords) allWorkRecords = workRecords;\n\n      // ユーザーデータ\n      const users = await window.aivicApi.list(0);\n      if (users) allUsers = users;\n\n      // 作業項目マスタ\n      const workItems = await window.aivicApi.list(3);\n      if (workItems) allWorkItems = workItems;\n\n      // 中断記録\n      const interruptions = await window.aivicApi.list(2);\n      if (interruptions) allInterruptions = interruptions;\n\n      // 異常値検出ログ\n      const anomalies = await window.aivicApi.list(4);\n      if (anomalies) allAnomalies = anomalies;\n\n      // セレクトボックス初期化\n      const workerSelect = container.querySelector('#worker-select');\n      workerSelect.innerHTML = allUsers.map(user => \n        `<option value=\"${user.ユーザーID}\">${user.氏名}</option>`\n      ).join('');\n\n      const workItemSelect = container.querySelector('#work-item-select');\n      workItemSelect.innerHTML = allWorkItems\n        .filter(item => item.有効フラグ)\n        .sort((a, b) => (a.表示順序 || 0) - (b.表示順序 || 0))\n        .map(item => \n          `<option value=\"${item.作業項目ID}\">${item.作業項目名}</option>`\n        ).join('');\n\n    } catch (error) {\n      console.error('データ読み込みエラー:', error);\n    }\n  }\n\n  // イベントリスナー設定\n  container.querySelector('#start-date').addEventListener('change', updateConditionPreview);\n  container.querySelector('#end-date').addEventListener('change', updateConditionPreview);\n  container.querySelector('#output-format').addEventListener('change', updateConditionPreview);\n  container.querySelector('#work-location').addEventListener('input', updateConditionPreview);\n  container.querySelector('#include-anomaly').addEventListener('change', updateConditionPreview);\n  container.querySelector('#include-interruption').addEventListener('change', updateConditionPreview);\n  container.querySelector('#worker-select').addEventListener('change', updateConditionPreview);\n  container.querySelector('#work-item-select').addEventListener('change', updateConditionPreview);\n\n  // プレビューボタン\n  container.querySelector('#btn-preview').addEventListener('click', () => {\n    const filtered = filterData();\n    renderPreview(filtered);\n    updateConditionPreview();\n  });\n\n  // 抽出実行ボタン\n  container.querySelector('#btn-extract').addEventListener('click', () => {\n    if (!validateConditions()) return;\n    \n    const filtered = filterData();\n    const format = container.querySelector('#output-format').value;\n    \n    // タイムアウトシミュレーション（大量データの場合）\n    if (filtered.length > 50000) {\n      setTimeout(() => {\n        showError('処理がタイムアウトしました。条件を絞り込んで再実行してください。');\n      }, 30000);\n      return;\n    }\n    \n    exportData(filtered, format);\n  });\n\n  // 条件クリアボタン\n  container.querySelector('#btn-clear').addEventListener('click', clearConditions);\n\n  // 条件保存ボタン\n  container.querySelector('#btn-save-condition').addEventListener('click', () => {\n    const modal = container.querySelector('#save-condition-modal');\n    modal.style.display = 'flex';\n    container.querySelector('#condition-name').focus();\n  });\n\n  // 条件保存モーダル\n  container.querySelector('#btn-cancel-save').addEventListener('click', () => {\n    container.querySelector('#save-condition-modal').style.display = 'none';\n    container.querySelector('#condition-name').value = '';\n  });\n\n  container.querySelector('#btn-confirm-save').addEventListener('click', () => {\n    const conditionName = container.querySelector('#condition-name').value.trim();\n    if (!conditionName) {\n      showError('条件名を入力してください');\n      return;\n    }\n    \n    // 条件保存処理（実際の実装では保存APIを呼ぶ）\n    container.querySelector('#save-condition-modal').style.display = 'none';\n    container.querySelector('#condition-name').value = '';\n    \n    // 成功メッセージ表示\n    const successDiv = document.createElement('div');\n    successDiv.textContent = '条件が保存されました';\n    successDiv.style.cssText = 'position: fixed; top: 20px; right: 20px; background: var(--primary); color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 13px; z-index: 1001;';\n    document.body.appendChild(successDiv);\n    setTimeout(() => {\n      document.body.removeChild(successDiv);\n    }, 3000);\n  });\n\n  // 戻るボタン\n  container.querySelector('#btn-back').addEventListener('click', () => {\n    window.showScreen(\"scr-1778907145716\");\n  });\n\n  // 初期化\n  loadInitialData();\n  updateConditionPreview();\n}";

    <script>
        // リアルタイム時計

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
