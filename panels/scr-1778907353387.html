ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentData = [];\n  \n  // DOM要素の取得\n  const startDateInput = container.querySelector('#start-date');\n  const endDateInput = container.querySelector('#end-date');\n  const workerSelect = container.querySelector('#worker-select');\n  const workItemSelect = container.querySelector('#work-item-select');\n  const locationSelect = container.querySelector('#location-select');\n  const includeAnomalyCheckbox = container.querySelector('#include-anomaly');\n  const includeInterruptionCheckbox = container.querySelector('#include-interruption');\n  const conditionPreview = container.querySelector('#condition-preview');\n  const dataCount = container.querySelector('#data-count');\n  const errorMessage = container.querySelector('#error-message');\n  const processingIndicator = container.querySelector('#processing-indicator');\n  const previewTbody = container.querySelector('#preview-tbody');\n  \n  // 初期データの設定\n  function initializeData() {\n    // 作業員データの読み込み（ユーザーテーブル）\n    if (tables[0]) {\n      const users = tables[0].records || [];\n      users.forEach(user => {\n        const option = document.createElement('option');\n        option.value = user.ユーザーID || user.id;\n        option.textContent = user.氏名 || user.name || 'Unknown';\n        workerSelect.appendChild(option);\n      });\n    }\n    \n    // 作業項目データの読み込み（作業項目マスタ）\n    if (tables[3]) {\n      const workItems = tables[3].records || [];\n      workItems.forEach(item => {\n        const option = document.createElement('option');\n        option.value = item.作業項目ID || item.id;\n        option.textContent = item.作業項目名 || item.name || 'Unknown';\n        workItemSelect.appendChild(option);\n      });\n    }\n    \n    // 作業場所データの読み込み（作業記録から重複除去）\n    if (tables[1]) {\n      const workRecords = tables[1].records || [];\n      const locations = [...new Set(workRecords.map(r => r.作業場所).filter(Boolean))];\n      locations.forEach(location => {\n        const option = document.createElement('option');\n        option.value = location;\n        option.textContent = location;\n        locationSelect.appendChild(option);\n      });\n    }\n  }\n  \n  // プレビュー更新\n  function updatePreview() {\n    const startDate = startDateInput.value;\n    const endDate = endDateInput.value;\n    const selectedWorkers = Array.from(workerSelect.selectedOptions).map(o => o.textContent);\n    const selectedWorkItems = Array.from(workItemSelect.selectedOptions).map(o => o.textContent);\n    const selectedLocation = locationSelect.value;\n    const includeAnomaly = includeAnomalyCheckbox.checked;\n    const includeInterruption = includeInterruptionCheckbox.checked;\n    const outputFormat = container.querySelector('input[name=\"output-format\"]:checked')?.value;\n    \n    let previewText = '';\n    \n    if (startDate && endDate) {\n      previewText += `期間: ${startDate} ～ ${endDate}\\n`;\n    }\n    \n    if (selectedWorkers.length > 0) {\n      previewText += `作業員: ${selectedWorkers.join(', ')}\\n`;\n    }\n    \n    if (selectedWorkItems.length > 0) {\n      previewText += `作業項目: ${selectedWorkItems.join(', ')}\\n`;\n    }\n    \n    if (selectedLocation) {\n      previewText += `作業場所: ${selectedLocation}\\n`;\n    }\n    \n    if (includeAnomaly) {\n      previewText += `異常値データを含む\\n`;\n    }\n    \n    if (includeInterruption) {\n      previewText += `中断記録を含む\\n`;\n    }\n    \n    if (outputFormat) {\n      previewText += `出力形式: ${outputFormat.toUpperCase()}\\n`;\n    }\n    \n    conditionPreview.textContent = previewText || '条件を設定してください';\n  }\n  \n  // エラー表示\n  function showError(message) {\n    errorMessage.textContent = message;\n    errorMessage.style.display = 'block';\n    setTimeout(() => {\n      errorMessage.style.display = 'none';\n    }, 5000);\n  }\n  \n  // データ抽出とプレビュー表示\n  async function extractData() {\n    const startDate = startDateInput.value;\n    const endDate = endDateInput.value;\n    const selectedWorkerIds = Array.from(workerSelect.selectedOptions).map(o => o.value).filter(Boolean);\n    const selectedWorkItemIds = Array.from(workItemSelect.selectedOptions).map(o => o.value).filter(Boolean);\n    const selectedLocation = locationSelect.value;\n    const includeAnomaly = includeAnomalyCheckbox.checked;\n    const includeInterruption = includeInterruptionCheckbox.checked;\n    const outputFormat = container.querySelector('input[name=\"output-format\"]:checked')?.value;\n    \n    // バリデーション\n    if (!startDate || !endDate) {\n      showError('抽出期間を指定してください');\n      return;\n    }\n    \n    if (new Date(startDate) > new Date(endDate)) {\n      showError('開始日は終了日より前の日付を入力してください');\n      return;\n    }\n    \n    if (!outputFormat) {\n      showError('出力形式を選択してください');\n      return;\n    }\n    \n    processingIndicator.style.display = 'block';\n    \n    try {\n      // 作業記録データの取得\n      const workRecords = await window.aivicApi.list(1);\n      if (!workRecords) {\n        showError('データの取得に失敗しました');\n        return;\n      }\n      \n      // フィルタリング\n      let filteredData = workRecords.filter(record => {\n        const workDate = new Date(record.作業日 || record.date);\n        const start = new Date(startDate);\n        const end = new Date(endDate);\n        \n        if (workDate < start || workDate > end) return false;\n        \n        if (selectedWorkerIds.length > 0 && !selectedWorkerIds.includes(record.作業員ID)) return false;\n        \n        if (selectedLocation && record.作業場所 !== selectedLocation) return false;\n        \n        return true;\n      });\n      \n      // 異常値除外処理\n      if (!includeAnomaly) {\n        const anomalyLogs = await window.aivicApi.list(4);\n        if (anomalyLogs) {\n          const anomalyRecordIds = anomalyLogs.map(log => log.検出対象レコードID);\n          filteredData = filteredData.filter(record => !anomalyRecordIds.includes(record.作業記録ID || record.id));\n        }\n      }\n      \n      // 中断記録の処理\n      if (includeInterruption) {\n        const interruptionRecords = await window.aivicApi.list(2);\n        if (interruptionRecords) {\n          // 中断記録を含む場合の処理（実装は簡略化）\n        }\n      }\n      \n      currentData = filteredData;\n      dataCount.textContent = `${filteredData.length}件`;\n      \n      // プレビューテーブルの更新\n      if (filteredData.length === 0) {\n        previewTbody.innerHTML = '<tr><td colspan=\"4\" style=\"padding: 20px; text-align: center; color: var(--text-muted);\">該当するデータが見つかりませんでした</td></tr>';\n      } else {\n        const previewRows = filteredData.slice(0, 10).map(record => {\n          const workerName = tables[0]?.records?.find(u => u.ユーザーID === record.作業員ID)?.氏名 || 'Unknown';\n          return `\n            <tr>\n              <td style=\"padding: 6px 8px; color: var(--text);\">${workerName}</td>\n              <td style=\"padding: 6px 8px; color: var(--text);\">${record.作業日 || ''}</td>\n              <td style=\"padding: 6px 8px; color: var(--text);\">${record.作業時間 || 0}分</td>\n              <td style=\"padding: 6px 8px; color: var(--text);\">${(record.作業内容 || '').substring(0, 20)}...</td>\n            </tr>\n          `;\n        }).join('');\n        \n        previewTbody.innerHTML = previewRows;\n        \n        if (filteredData.length > 10) {\n          previewTbody.innerHTML += `<tr><td colspan=\"4\" style=\"padding: 6px 8px; text-align: center; color: var(--text-muted);\">...他${filteredData.length - 10}件</td></tr>`;\n        }\n      }\n      \n      // 大量データの警告\n      if (filteredData.length > 10000) {\n        showError('抽出データが大量です。条件を絞り込むことをお勧めします。');\n      }\n      \n    } catch (error) {\n      showError('データ抽出中にエラーが発生しました');\n      console.error('Extract error:', error);\n    } finally {\n      processingIndicator.style.display = 'none';\n    }\n  }\n  \n  // CSVダウンロード\n  function downloadCSV() {\n    if (currentData.length === 0) {\n      showError('抽出データがありません');\n      return;\n    }\n    \n    const headers = ['作業員名', '作業日', '作業開始時刻', '作業終了時刻', '作業時間', 'プロジェクト名', '作業場所', '作業種別', '作業内容', '進捗状況'];\n    const csvContent = '\\uFEFF' + headers.join(',') + '\\n' + \n      currentData.map(record => {\n        const workerName = tables[0]?.records?.find(u => u.ユーザーID === record.作業員ID)?.氏名 || 'Unknown';\n        return [\n          `\"${workerName}\"`,\n          `\"${record.作業日 || ''}\"`,\n          `\"${record.作業開始時刻 || ''}\"`,\n          `\"${record.作業終了時刻 || ''}\"`,\n          `\"${record.作業時間 || 0}\"`,\n          `\"${record.プロジェクト名 || ''}\"`,\n          `\"${record.作業場所 || ''}\"`,\n          `\"${record.作業種別 || ''}\"`,\n          `\"${(record.作業内容 || '').replace(/\"/g, '\"\"')}\"`,\n          `\"${record.進捗状況 || ''}\"`\n        ].join(',');\n      }).join('\\n');\n    \n    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `工数記録データ_${new Date().toISOString().split('T')[0]}.csv`;\n    link.click();\n  }\n  \n  // Excelダウンロード（CSV形式で代用）\n  function downloadExcel() {\n    if (currentData.length === 0) {\n      showError('抽出データがありません');\n      return;\n    }\n    \n    const headers = ['作業員名', '作業日', '作業開始時刻', '作業終了時刻', '作業時間', 'プロジェクト名', '作業場所', '作業種別', '作業内容', '進捗状況'];\n    const csvContent = '\\uFEFF' + headers.join(',') + '\\n' + \n      currentData.map(record => {\n        const workerName = tables[0]?.records?.find(u => u.ユーザーID === record.作業員ID)?.氏名 || 'Unknown';\n        return [\n          `\"${workerName}\"`,\n          `\"${record.作業日 || ''}\"`,\n          `\"${record.作業開始時刻 || ''}\"`,\n          `\"${record.作業終了時刻 || ''}\"`,\n          `\"${record.作業時間 || 0}\"`,\n          `\"${record.プロジェクト名 || ''}\"`,\n          `\"${record.作業場所 || ''}\"`,\n          `\"${record.作業種別 || ''}\"`,\n          `\"${(record.作業内容 || '').replace(/\"/g, '\"\"')}\"`,\n          `\"${record.進捗状況 || ''}\"`\n        ].join(',');\n      }).join('\\n');\n    \n    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `工数記録データ_${new Date().toISOString().split('T')[0]}.xlsx`;\n    link.click();\n  }\n  \n  // 条件クリア\n  function clearConditions() {\n    startDateInput.value = '';\n    endDateInput.value = '';\n    workerSelect.selectedIndex = -1;\n    workItemSelect.selectedIndex = -1;\n    locationSelect.selectedIndex = 0;\n    includeAnomalyCheckbox.checked = false;\n    includeInterruptionCheckbox.checked = false;\n    container.querySelectorAll('input[name=\"output-format\"]').forEach(radio => radio.checked = false);\n    \n    conditionPreview.textContent = '条件を設定してください';\n    dataCount.textContent = '0件';\n    previewTbody.innerHTML = '<tr><td colspan=\"4\" style=\"padding: 20px; text-align: center; color: var(--text-muted);\">データを抽出してください</td></tr>';\n    currentData = [];\n  }\n  \n  // 条件保存\n  function saveConditions() {\n    const conditions = {\n      startDate: startDateInput.value,\n      endDate: endDateInput.value,\n      workers: Array.from(workerSelect.selectedOptions).map(o => o.value),\n      workItems: Array.from(workItemSelect.selectedOptions).map(o => o.value),\n      location: locationSelect.value,\n      includeAnomaly: includeAnomalyCheckbox.checked,\n      includeInterruption: includeInterruptionCheckbox.checked,\n      outputFormat: container.querySelector('input[name=\"output-format\"]:checked')?.value\n    };\n    \n    const conditionName = prompt('条件名を入力してください:');\n    if (conditionName) {\n      localStorage.setItem(`extract_condition_${conditionName}`, JSON.stringify(conditions));\n      alert('条件が保存されました');\n    }\n  }\n  \n  // イベントリスナーの設定\n  startDateInput.addEventListener('change', updatePreview);\n  endDateInput.addEventListener('change', updatePreview);\n  workerSelect.addEventListener('change', updatePreview);\n  workItemSelect.addEventListener('change', updatePreview);\n  locationSelect.addEventListener('change', updatePreview);\n  includeAnomalyCheckbox.addEventListener('change', updatePreview);\n  includeInterruptionCheckbox.addEventListener('change', updatePreview);\n  container.querySelectorAll('input[name=\"output-format\"]').forEach(radio => {\n    radio.addEventListener('change', updatePreview);\n  });\n  \n  container.querySelector('#btn-extract').addEventListener('click', async () => {\n    await extractData();\n    \n    const outputFormat = container.querySelector('input[name=\"output-format\"]:checked')?.value;\n    if (outputFormat === 'csv') {\n      downloadCSV();\n    } else if (outputFormat === 'excel') {\n      downloadExcel();\n    }\n  });\n  \n  container.querySelector('#btn-clear').addEventListener('click', clearConditions);\n  container.querySelector('#btn-save-condition').addEventListener('click', saveConditions);\n  container.querySelector('#btn-back').addEventListener('click', () => {\n    window.showScreen(\"scr-1778907145716\");\n  });\n  \n  // 初期化\n  initializeData();\n  updatePreview();\n}";
</script>

  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
