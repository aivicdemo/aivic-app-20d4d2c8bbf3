<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工数記録システム</title>
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-hover: #0284c7;
            --primary-light: #e0f2fe;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-sidebar: #f1f5f9;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --text: #1e293b;
            --text-muted: #475569;
            --text-light: #64748b;
            --top-bar-bg: #ffffff;
            --top-bar-border: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: "⏱";
            font-size: 18px;
        }

        .nav-section {
            padding: 16px 0 8px 0;
        }

        .nav-section-title {
            padding: 0 16px 8px 16px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: block;
            padding: 8px 16px;
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: var(--bg-card);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: var(--primary-light);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 500;
        }

        .nav-item.nav-emergency {
            color: var(--danger);
            font-weight: 500;
        }

        .nav-item.nav-emergency:hover {
            background: #fef2f2;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .logout-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.15s ease;
        }

        .logout-link:hover {
            background: var(--border-light);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quick-action-btn {
            padding: 10px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quick-action-btn:hover {
            background: var(--primary-hover);
        }

        .quick-action-btn.secondary {
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .quick-action-btn.secondary:hover {
            background: var(--border-light);
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-height: 400px;
        }

        .nav-group {
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 4px;
            padding-bottom: 4px;
        }

        .nav-group:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
            
            .quick-actions {
                flex-wrap: wrap;
            }
        }

        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
            font-size: 12px;
        }
    </style>

ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type":"text","required":false,"description":"管理者による対応内容や備考"},{"name":"検出日時","type":"timestamp","required":true,"description":"異常値が検出された日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let workRecords = [];\n  let users = [];\n  let workItems = [];\n  let interruptions = [];\n  let anomalies = [];\n\n  // DOM要素の取得\n  const startDateInput = container.querySelector('#start-date');\n  const endDateInput = container.querySelector('#end-date');\n  const outputFormatSelect = container.querySelector('#output-format');\n  const workerSelect = container.querySelector('#worker-select');\n  const workItemSelect = container.querySelector('#work-item-select');\n  const workLocationSelect = container.querySelector('#work-location');\n  const includeAnomalyCheckbox = container.querySelector('#include-anomaly');\n  const includeInterruptionCheckbox = container.querySelector('#include-interruption');\n  const conditionPreview = container.querySelector('#condition-preview');\n  const dataCount = container.querySelector('#data-count');\n  const errorMessage = container.querySelector('#error-message');\n  const previewSection = container.querySelector('#preview-section');\n  const previewTbody = container.querySelector('#preview-tbody');\n  const processingOverlay = container.querySelector('#processing-overlay');\n  const progressBar = container.querySelector('#progress-bar');\n\n  // 初期データの読み込み\n  async function loadInitialData() {\n    try {\n      // 作業記録データ（tableIndex: 1）\n      const workRecordsData = await window.aivicApi.list(1);\n      if (workRecordsData) workRecords = workRecordsData;\n\n      // ユーザーデータ（tableIndex: 0）\n      const usersData = await window.aivicApi.list(0);\n      if (usersData) users = usersData;\n\n      // 作業項目マスタ（tableIndex: 3）\n      const workItemsData = await window.aivicApi.list(3);\n      if (workItemsData) workItems = workItemsData;\n\n      // 中断記録（tableIndex: 2）\n      const interruptionsData = await window.aivicApi.list(2);\n      if (interruptionsData) interruptions = interruptionsData;\n\n      // 異常値検出ログ（tableIndex: 4）\n      const anomaliesData = await window.aivicApi.list(4);\n      if (anomaliesData) anomalies = anomaliesData;\n\n      populateSelects();\n      updatePreview();\n    } catch (error) {\n      console.error('初期データの読み込みに失敗しました:', error);\n    }\n  }\n\n  // セレクトボックスの選択肢を設定\n  function populateSelects() {\n    // 作業員選択肢\n    workerSelect.innerHTML = '<option value=\"all\">全作業員</option>';\n    users.filter(u => u.有効フラグ).forEach(user => {\n      const option = document.createElement('option');\n      option.value = user.ユーザーID;\n      option.textContent = user.氏名;\n      workerSelect.appendChild(option);\n    });\n\n    // 作業項目選択肢\n    workItemSelect.innerHTML = '<option value=\"all\">全作業項目</option>';\n    workItems.filter(item => item.有効フラグ).forEach(item => {\n      const option = document.createElement('option');\n      option.value = item.作業項目ID;\n      option.textContent = item.作業項目名;\n      workItemSelect.appendChild(option);\n    });\n\n    // 作業場所選択肢\n    const locations = [...new Set(workRecords.map(r => r.作業場所).filter(Boolean))];\n    workLocationSelect.innerHTML = '<option value=\"\">全場所</option>';\n    locations.forEach(location => {\n      const option = document.createElement('option');\n      option.value = location;\n      option.textContent = location;\n      workLocationSelect.appendChild(option);\n    });\n  }\n\n  // 抽出条件プレビューの更新\n  function updatePreview() {\n    const conditions = [];\n    \n    if (startDateInput.value) {\n      conditions.push(`開始日: ${startDateInput.value}`);\n    }\n    if (endDateInput.value) {\n      conditions.push(`終了日: ${endDateInput.value}`);\n    }\n    \n    const selectedWorkers = Array.from(workerSelect.selectedOptions);\n    if (selectedWorkers.length > 0 && !selectedWorkers.some(opt => opt.value === 'all')) {\n      conditions.push(`作業員: ${selectedWorkers.map(opt => opt.textContent).join(', ')}`);\n    }\n    \n    const selectedItems = Array.from(workItemSelect.selectedOptions);\n    if (selectedItems.length > 0 && !selectedItems.some(opt => opt.value === 'all')) {\n      conditions.push(`作業項目: ${selectedItems.map(opt => opt.textContent).join(', ')}`);\n    }\n    \n    if (workLocationSelect.value) {\n      conditions.push(`作業場所: ${workLocationSelect.value}`);\n    }\n    \n    if (includeAnomalyCheckbox.checked) {\n      conditions.push('異常値データを含む');\n    }\n    \n    if (includeInterruptionCheckbox.checked) {\n      conditions.push('中断記録を含む');\n    }\n\n    conditionPreview.textContent = conditions.length > 0 ? conditions.join(' / ') : '条件を設定してください';\n    \n    // データ件数の更新\n    const filteredData = getFilteredData();\n    dataCount.textContent = filteredData.length;\n  }\n\n  // フィルタリングされたデータの取得\n  function getFilteredData() {\n    let filtered = [...workRecords];\n\n    // 期間フィルタ\n    if (startDateInput.value) {\n      const startDate = new Date(startDateInput.value);\n      filtered = filtered.filter(record => new Date(record.作業日) >= startDate);\n    }\n    if (endDateInput.value) {\n      const endDate = new Date(endDateInput.value);\n      filtered = filtered.filter(record => new Date(record.作業日) <= endDate);\n    }\n\n    // 作業員フィルタ\n    const selectedWorkers = Array.from(workerSelect.selectedOptions);\n    if (selectedWorkers.length > 0 && !selectedWorkers.some(opt => opt.value === 'all')) {\n      const workerIds = selectedWorkers.map(opt => opt.value);\n      filtered = filtered.filter(record => workerIds.includes(record.作業員ID));\n    }\n\n    // 作業場所フィルタ\n    if (workLocationSelect.value) {\n      filtered = filtered.filter(record => record.作業場所 === workLocationSelect.value);\n    }\n\n    // 異常値除外\n    if (!includeAnomalyCheckbox.checked) {\n      const anomalyRecordIds = anomalies.map(a => a.検出対象レコードID);\n      filtered = filtered.filter(record => !anomalyRecordIds.includes(record.作業記録ID));\n    }\n\n    // 中断記録除外\n    if (!includeInterruptionCheckbox.checked) {\n      filtered = filtered.filter(record => record.進捗状況 !== '中断');\n    }\n\n    return filtered;\n  }\n\n  // バリデーション\n  function validateConditions() {\n    hideError();\n\n    if (!startDateInput.value || !endDateInput.value) {\n      showError('抽出期間（開始日・終了日）を指定してください');\n      return false;\n    }\n\n    if (new Date(startDateInput.value) > new Date(endDateInput.value)) {\n      showError('開始日は終了日より前の日付を入力してください');\n      return false;\n    }\n\n    const selectedWorkers = Array.from(workerSelect.selectedOptions);\n    if (selectedWorkers.length === 0) {\n      showError('作業員を選択してください');\n      return false;\n    }\n\n    if (!outputFormatSelect.value) {\n      showError('出力形式を選択してください');\n      return false;\n    }\n\n    return true;\n  }\n\n  // エラー表示\n  function showError(message) {\n    errorMessage.textContent = message;\n    errorMessage.style.display = 'block';\n  }\n\n  // エラー非表示\n  function hideError() {\n    errorMessage.style.display = 'none';\n  }\n\n  // プレビュー表示\n  function showPreview() {\n    const filteredData = getFilteredData();\n    const previewData = filteredData.slice(0, 100); // 最大100件\n\n    if (previewData.length === 0) {\n      previewTbody.innerHTML = '<tr><td colspan=\"7\" style=\"text-align: center; padding: 20px; color: var(--text-muted);\">該当するデータが見つかりませんでした</td></tr>';\n    } else {\n      previewTbody.innerHTML = previewData.map(record => {\n        const worker = users.find(u => u.ユーザーID === record.作業員ID);\n        const workTime = record.作業時間 ? `${Math.floor(record.作業時間 / 60)}時間${record.作業時間 % 60}分` : '-';\n        \n        return `\n          <tr>\n            <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${record.作業日 || '-'}</td>\n            <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${worker?.氏名 || '-'}</td>\n            <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${record.プロジェクト名 || '-'}</td>\n            <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${record.作業場所 || '-'}</td>\n            <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${record.作業種別 || '-'}</td>\n            <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${workTime}</td>\n            <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${record.進捗状況 || '-'}</td>\n          </tr>\n        `;\n      }).join('');\n    }\n\n    previewSection.style.display = 'block';\n  }\n\n  // データ抽出実行\n  async function executeExtraction() {\n    if (!validateConditions()) return;\n\n    const filteredData = getFilteredData();\n    \n    if (filteredData.length === 0) {\n      showError('抽出条件に該当するデータがありません');\n      return;\n    }\n\n    // 最大件数チェック（10000件）\n    if (filteredData.length > 10000) {\n      showError('抽出データが最大件数（10,000件）を超えています。条件を絞り込んでください');\n      return;\n    }\n\n    // 処理中表示\n    showProcessing();\n\n    try {\n      // プログレスバー更新のシミュレーション\n      updateProgress(30);\n      await new Promise(resolve => setTimeout(resolve, 500));\n\n      // データの整形\n      const exportData = filteredData.map(record => {\n        const worker = users.find(u => u.ユーザーID === record.作業員ID);\n        return {\n          作業日: record.作業日 || '',\n          作業員: worker?.氏名 || '',\n          プロジェクト名: record.プロジェクト名 || '',\n          作業場所: record.作業場所 || '',\n          作業種別: record.作業種別 || '',\n          作業内容: record.作業内容 || '',\n          作業開始時刻: record.作業開始時刻 || '',\n          作業終了時刻: record.作業終了時刻 || '',\n          作業時間: record.作業時間 || '',\n          進捗状況: record.進捗状況 || '',\n          承認状態: record.承認状態 || '',\n          備考: record.備考 || ''\n        };\n      });\n\n      updateProgress(70);\n      await new Promise(resolve => setTimeout(resolve, 500));\n\n      // ファイル出力\n      if (outputFormatSelect.value === 'csv') {\n        exportToCSV(exportData);\n      } else if (outputFormatSelect.value === 'excel') {\n        exportToExcel(exportData);\n      }\n\n      updateProgress(100);\n      await new Promise(resolve => setTimeout(resolve, 300));\n\n    } catch (error) {\n      console.error('抽出処理でエラーが発生しました:', error);\n      showError('データ抽出中にエラーが発生しました');\n    } finally {\n      hideProcessing();\n    }\n  }\n\n  // CSV出力\n  function exportToCSV(data) {\n    if (data.length === 0) return;\n\n    const headers = Object.keys(data[0]);\n    const csvContent = [\n      headers.join(','),\n      ...data.map(row => \n        headers.map(header => {\n          const value = row[header] || '';\n          return value.toString().includes(',') ? `\"${value}\"` : value;\n        }).join(',')\n      )\n    ].join('\\n');\n\n    const blob = new Blob(['\\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `工数記録データ_${new Date().toISOString().split('T')[0]}.csv`;\n    link.click();\n  }\n\n  // Excel出力（CSV形式だが拡張子をxlsxに）\n  function exportToExcel(data) {\n    if (data.length === 0) return;\n\n    const headers = Object.keys(data[0]);\n    const csvContent = [\n      headers.join(','),\n      ...data.map(row => \n        headers.map(header => {\n          const value = row[header] || '';\n          return value.toString().includes(',') ? `\"${value}\"` : value;\n        }).join(',')\n      )\n    ].join('\\n');\n\n    const blob = new Blob(['\\uFEFF' + csvContent], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `工数記録データ_${new Date().toISOString().split('T')[0]}.xlsx`;\n    link.click();\n  }\n\n  // 処理中表示\n  function showProcessing() {\n    processingOverlay.style.display = 'flex';\n    updateProgress(0);\n  }\n\n  // 処理中非表示\n  function hideProcessing() {\n    processingOverlay.style.display = 'none';\n  }\n\n  // プログレスバー更新\n  function updateProgress(percent) {\n    progressBar.style.width = `${percent}%`;\n  }\n\n  // 条件保存\n  function saveCondition() {\n    const conditionName = prompt('条件名を入力してください:');\n    if (!conditionName) return;\n\n    const condition = {\n      name: conditionName,\n      startDate: startDateInput.value,\n      endDate: endDateInput.value,\n      workers: Array.from(workerSelect.selectedOptions).map(opt => opt.value),\n      workItems: Array.from(workItemSelect.selectedOptions).map(opt => opt.value),\n      workLocation: workLocationSelect.value,\n      includeAnomaly: includeAnomalyCheckbox.checked,\n      includeInterruption: includeInterruptionCheckbox.checked,\n      outputFormat: outputFormatSelect.value\n    };\n\n    // ローカルストレージに保存\n    const savedConditions = JSON.parse(localStorage.getItem('extractionConditions') || '[]');\n    savedConditions.push(condition);\n    localStorage.setItem('extractionConditions', JSON.stringify(savedConditions));\n\n    alert('条件が保存されました');\n  }\n\n  // 条件クリア\n  function clearConditions() {\n    startDateInput.value = '';\n    endDateInput.value = '';\n    outputFormatSelect.value = '';\n    workerSelect.selectedIndex = -1;\n    workItemSelect.selectedIndex = -1;\n    workLocationSelect.value = '';\n    includeAnomalyCheckbox.checked = false;\n    includeInterruptionCheckbox.checked = false;\n    \n    hideError();\n    previewSection.style.display = 'none';\n    updatePreview();\n  }\n\n  // イベントリスナーの設定\n  startDateInput.addEventListener('change', updatePreview);\n  endDateInput.addEventListener('change', updatePreview);\n  workerSelect.addEventListener('change', updatePreview);\n  workItemSelect.addEventListener('change', updatePreview);\n  workLocationSelect.addEventListener('change', updatePreview);\n  includeAnomalyCheckbox.addEventListener('change', updatePreview);\n  includeInterruptionCheckbox.addEventListener('change', updatePreview);\n\n  container.querySelector('#btn-preview').addEventListener('click', showPreview);\n  container.querySelector('#btn-extract').addEventListener('click', executeExtraction);\n  container.querySelector('#btn-save-condition').addEventListener('click', saveCondition);\n  container.querySelector     <script>

            'scr-1778907170814': '異常値検出ログ',

                titleElement.textContent = screenTitles[e.detail.screenId];

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();
