window.AIVIC_TABLES = [{"tableName":"ユーザー","purpose":"現場作業員のアカウント情報と認証情報を管理する","columns":[{"name":"ユーザーID","type":"uuid","required":true,"description":"ユーザーの一意識別子（主キー）"},{"name":"ユーザー名","type":"varchar(100)","required":true,"description":"ログイン用のユーザー名"},{"name":"パスワードハッシュ","type":"varchar(100)","required":true,"description":"ハッシュ化されたパスワード"},{"name":"氏名","type":"varchar(100)","required":true,"description":"作業員の実名"},{"name":"所属部署","type":"varchar(100)","required":false,"description":"作業員が所属する部署名"},{"name":"職種","type":"varchar(100)","required":false,"description":"作業員の職種・役職"},{"name":"権限レベル","type":"varchar(100)","required":true,"description":"システム内での権限（一般作業員、管理者等）"},{"name":"有効フラグ","type":"boolean","required":true,"description":"アカウントの有効/無効状態"},{"name":"最終ログイン日時","type":"timestamp","required":false,"description":"最後にログインした日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者","type":"varchar(100)","required":true,"description":"レコード作成者"}]},{"tableName":"作業記録","purpose":"現場作業員の日々の作業時間と内容を記録し、工数管理と実績分析を行うためのトランザクションテーブル","columns":[{"name":"作業記録ID","type":"uuid","required":true,"description":"作業記録の一意識別子（主キー）"},{"name":"作業員ID","type":"uuid","required":true,"description":"作業を行った作業員のID（ユーザーテーブル外部キー）"},{"name":"作業日","type":"timestamp","required":true,"description":"作業を実施した日付"},{"name":"作業開始時刻","type":"timestamp","required":true,"description":"作業開始の日時"},{"name":"作業終了時刻","type":"timestamp","required":false,"description":"作業終了の日時（作業中の場合はnull）"},{"name":"作業時間","type":"integer","required":false,"description":"実際の作業時間（分単位、終了時に自動計算）"},{"name":"プロジェクト名","type":"varchar(100)","required":true,"description":"作業対象のプロジェクト名"},{"name":"作業場所","type":"varchar(100)","required":true,"description":"作業を実施した現場・場所"},{"name":"作業種別","type":"varchar(100)","required":true,"description":"作業の種類（設置、点検、修理等）"},{"name":"作業内容","type":"text","required":true,"description":"具体的な作業内容の詳細"},{"name":"進捗状況","type":"varchar(100)","required":true,"description":"作業の進捗状態（作業中、完了、中断等）"},{"name":"備考","type":"text","required":false,"description":"特記事項や注意点等の補足情報"},{"name":"承認状態","type":"varchar(100)","required":true,"description":"記録の承認状況（未承認、承認済み、差し戻し）"},{"name":"承認者ID","type":"uuid","required":false,"description":"記録を承認した管理者のID"},{"name":"承認日時","type":"timestamp","required":false,"description":"承認が行われた日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"}]},{"tableName":"中断記録","purpose":"作業中断の発生理由、時間、影響を記録し、作業効率分析と改善に活用する","columns":[{"name":"中断記録ID","type":"uuid","required":true,"description":"中断記録の一意識別子（主キー）"},{"name":"作業記録ID","type":"uuid","required":true,"description":"中断が発生した作業記録への外部キー"},{"name":"中断開始日時","type":"timestamp","required":true,"description":"作業を中断した日時"},{"name":"中断終了日時","type":"timestamp","required":false,"description":"作業を再開した日時"},{"name":"中断理由区分","type":"varchar(100)","required":true,"description":"中断理由の分類（機械故障、材料不足、天候、休憩等）"},{"name":"中断理由詳細","type":"text","required":false,"description":"中断理由の具体的な内容"},{"name":"中断時間","type":"integer","required":false,"description":"中断時間（分）"},{"name":"影響度","type":"varchar(100)","required":false,"description":"作業への影響度（軽微、中程度、重大）"},{"name":"対応状況","type":"varchar(100)","required":true,"description":"中断への対応状況（対応中、解決済み、未対応）"},{"name":"記録者ID","type":"uuid","required":true,"description":"中断を記録した作業員のユーザーID"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]},{"tableName":"作業項目マスタ","purpose":"現場作業員が工数記録時に選択する作業項目の定義と管理を行う","columns":[{"name":"作業項目ID","type":"uuid","required":true,"description":"作業項目の一意識別子（主キー）"},{"name":"作業項目コード","type":"varchar(100)","required":true,"description":"作業項目の業務コード（検索・表示用）"},{"name":"作業項目名","type":"varchar(100)","required":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type":"text","required":false,"description":"管理者による対応内容や備考"},{"name":"検出日時","type":"timestamp","required":true,"description":"異常値が検出された日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let workRecords = [];\n  let users = [];\n  let workItems = [];\n  let interruptions = [];\n  let anomalies = [];\n\n  // 初期データ読み込み\n  async function loadInitialData() {\n    try {\n      workRecords = await window.aivicApi.list(1) || tables[1]?.records || [];\n      users = await window.aivicApi.list(0) || tables[0]?.records || [];\n      workItems = await window.aivicApi.list(3) || tables[3]?.records || [];\n      interruptions = await window.aivicApi.list(2) || tables[2]?.records || [];\n      anomalies = await window.aivicApi.list(4) || tables[4]?.records || [];\n      \n      renderWorkerList();\n      renderWorkItemList();\n    } catch (error) {\n      console.error('データ読み込みエラー:', error);\n    }\n  }\n\n  // 作業員リスト描画\n  function renderWorkerList() {\n    const workerList = container.querySelector('#worker-list');\n    workerList.innerHTML = users.map(user => `\n      <label style=\"display: block; font-size: 12px; margin-bottom: 2px;\">\n        <input type=\"checkbox\" class=\"worker-checkbox\" value=\"${user.ユーザーID || user.id}\" style=\"accent-color: var(--primary); margin-right: 6px;\">\n        ${user.氏名 || user.name || 'Unknown'}\n      </label>\n    `).join('');\n  }\n\n  // 作業項目リスト描画\n  function renderWorkItemList() {\n    const workItemList = container.querySelector('#work-item-list');\n    workItemList.innerHTML = workItems.map(item => `\n      <label style=\"display: block; font-size: 12px; margin-bottom: 2px;\">\n        <input type=\"checkbox\" class=\"work-item-checkbox\" value=\"${item.作業項目ID || item.id}\" style=\"accent-color: var(--primary); margin-right: 6px;\">\n        ${item.作業項目名 || item.name || 'Unknown'}\n      </label>\n    `).join('');\n  }\n\n  // エラー表示\n  function showError(message) {\n    const errorDiv = container.querySelector('#error-message');\n    errorDiv.textContent = message;\n    errorDiv.style.display = 'block';\n    setTimeout(() => {\n      errorDiv.style.display = 'none';\n    }, 5000);\n  }\n\n  // 条件バリデーション\n  function validateConditions() {\n    const startDate = container.querySelector('#start-date').value;\n    const endDate = container.querySelector('#end-date').value;\n    const outputFormat = container.querySelector('#output-format').value;\n    const selectedWorkers = container.querySelectorAll('.worker-checkbox:checked');\n\n    if (!startDate || !endDate) {\n      showError('開始日と終了日を入力してください');\n      return false;\n    }\n\n    if (new Date(startDate) > new Date(endDate)) {\n      showError('開始日は終了日より前の日付を入力してください');\n      return false;\n    }\n\n    if (selectedWorkers.length === 0) {\n      showError('作業員を選択してください');\n      return false;\n    }\n\n    if (!outputFormat) {\n      showError('出力形式を選択してください');\n      return false;\n    }\n\n    return true;\n  }\n\n  // 抽出条件取得\n  function getExtractionConditions() {\n    const startDate = container.querySelector('#start-date').value;\n    const endDate = container.querySelector('#end-date').value;\n    const workLocation = container.querySelector('#work-location').value;\n    const anomalyFilter = container.querySelector('#anomaly-filter').value;\n    const interruptionFilter = container.querySelector('#interruption-filter').value;\n    const outputFormat = container.querySelector('#output-format').value;\n    \n    const selectedWorkers = Array.from(container.querySelectorAll('.worker-checkbox:checked')).map(cb => cb.value);\n    const selectedWorkItems = Array.from(container.querySelectorAll('.work-item-checkbox:checked')).map(cb => cb.value);\n\n    return {\n      startDate,\n      endDate,\n      workLocation,\n      anomalyFilter,\n      interruptionFilter,\n      outputFormat,\n      selectedWorkers,\n      selectedWorkItems\n    };\n  }\n\n  // データフィルタリング\n  function filterData(conditions) {\n    let filteredRecords = workRecords.filter(record => {\n      const recordDate = new Date(record.作業日 || record.workDate);\n      const startDate = new Date(conditions.startDate);\n      const endDate = new Date(conditions.endDate);\n      \n      // 日付範囲チェック\n      if (recordDate < startDate || recordDate > endDate) return false;\n      \n      // 作業員チェック\n      if (conditions.selectedWorkers.length > 0 && \n          !conditions.selectedWorkers.includes(record.作業員ID || record.workerId)) return false;\n      \n      // 作業場所チェック\n      if (conditions.workLocation && \n          !(record.作業場所 || record.workLocation || '').includes(conditions.workLocation)) return false;\n      \n      return true;\n    });\n\n    // 異常値フィルタ\n    if (conditions.anomalyFilter === 'exclude') {\n      const anomalyRecordIds = anomalies.map(a => a.検出対象レコードID || a.recordId);\n      filteredRecords = filteredRecords.filter(r => !anomalyRecordIds.includes(r.作業記録ID || r.id));\n    }\n\n    // 中断記録フィルタ\n    if (conditions.interruptionFilter === 'exclude') {\n      const interruptionRecordIds = interruptions.map(i => i.作業記録ID || i.workRecordId);\n      filteredRecords = filteredRecords.filter(r => !interruptionRecordIds.includes(r.作業記録ID || r.id));\n    }\n\n    return filteredRecords;\n  }\n\n  // プレビュー表示\n  function showPreview() {\n    const conditions = getExtractionConditions();\n    const filteredData = filterData(conditions);\n    \n    const previewSection = container.querySelector('#preview-section');\n    const conditionPreview = container.querySelector('#condition-preview');\n    const dataCount = container.querySelector('#data-count');\n    \n    const workerNames = conditions.selectedWorkers.map(id => {\n      const user = users.find(u => (u.ユーザーID || u.id) === id);\n      return user ? (user.氏名 || user.name) : id;\n    }).join(', ');\n    \n    const workItemNames = conditions.selectedWorkItems.map(id => {\n      const item = workItems.find(i => (i.作業項目ID || i.id) === id);\n      return item ? (item.作業項目名 || item.name) : id;\n    }).join(', ');\n    \n    conditionPreview.innerHTML = `\n      <div><strong>期間:</strong> ${conditions.startDate} ～ ${conditions.endDate}</div>\n      <div><strong>作業員:</strong> ${workerNames || '全員'}</div>\n      <div><strong>作業項目:</strong> ${workItemNames || '全項目'}</div>\n      <div><strong>作業場所:</strong> ${conditions.workLocation || '指定なし'}</div>\n      <div><strong>異常値:</strong> ${conditions.anomalyFilter === 'include' ? '含む' : '除外'}</div>\n      <div><strong>中断記録:</strong> ${conditions.interruptionFilter === 'include' ? '含む' : '除外'}</div>\n      <div><strong>出力形式:</strong> ${conditions.outputFormat.toUpperCase()}</div>\n    `;\n    \n    dataCount.textContent = `抽出データ件数: ${filteredData.length}件`;\n    previewSection.style.display = 'block';\n  }\n\n  // CSV/Excel出力\n  function exportData(conditions, filteredData) {\n    const headers = ['作業日', '作業員名', '作業開始時刻', '作業終了時刻', '作業時間', 'プロジェクト名', '作業場所', '作業種別', '作業内容', '進捗状況'];\n    \n    const csvData = [headers];\n    filteredData.forEach(record => {\n      const user = users.find(u => (u.ユーザーID || u.id) === (record.作業員ID || record.workerId));\n      const userName = user ? (user.氏名 || user.name) : 'Unknown';\n      \n      csvData.push([\n        record.作業日 || record.workDate || '',\n        userName,\n        record.作業開始時刻 || record.startTime || '',\n        record.作業終了時刻 || record.endTime || '',\n        record.作業時間 || record.workHours || '',\n        record.プロジェクト名 || record.projectName || '',\n        record.作業場所 || record.workLocation || '',\n        record.作業種別 || record.workType || '',\n        record.作業内容 || record.workContent || '',\n        record.進捗状況 || record.status || ''\n      ]);\n    });\n    \n    const csvContent = '\\uFEFF' + csvData.map(row => \n      row.map(field => `\"${String(field).replace(/\"/g, '\"\"')}\"`).join(',')\n    ).join('\\n');\n    \n    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    const url = URL.createObjectURL(blob);\n    link.setAttribute('href', url);\n    link.setAttribute('download', `工数記録データ_${new Date().toISOString().split('T')[0]}.csv`);\n    link.style.visibility = 'hidden';\n    document.body.appendChild(link);\n    link.click();\n    document.body.removeChild(link);\n  }\n\n  // 条件クリア\n  function clearConditions() {\n    container.querySelector('#start-date').value = '';\n    container.querySelector('#end-date').value = '';\n    container.querySelector('#work-location').value = '';\n    container.querySelector('#anomaly-filter').value = 'include';\n    container.querySelector('#interruption-filter').value = 'include';\n    container.querySelector('#output-format').value = '';\n    \n    container.querySelectorAll('.worker-checkbox').forEach(cb => cb.checked = false);\n    container.querySelectorAll('.work-item-checkbox').forEach(cb => cb.checked = false);\n    container.querySelector('#select-all-workers').checked = false;\n    container.querySelector('#select-all-items').checked = false;\n    \n    container.querySelector('#preview-section').style.display = 'none';\n  }\n\n  // 全選択チェックボックス\n  container.querySelector('#select-all-workers').addEventListener('change', (e) => {\n    container.querySelectorAll('.worker-checkbox').forEach(cb => cb.checked = e.target.checked);\n  });\n\n  container.querySelector('#select-all-items').addEventListener('change', (e) => {\n    container.querySelectorAll('.work-item-checkbox').forEach(cb => cb.checked = e.target.checked);\n  });\n\n  // プレビューボタン\n  container.querySelector('#btn-preview').addEventListener('click', () => {\n    if (validateConditions()) {\n      showPreview();\n    }\n  });\n\n  // 抽出実行ボタン\n  container.querySelector('#btn-extract').addEventListener('click', async () => {\n    if (!validateConditions()) return;\n    \n    const loadingMessage = container.querySelector('#loading-message');\n    loadingMessage.style.display = 'block';\n    \n    try {\n      const conditions = getExtractionConditions();\n      const filteredData = filterData(conditions);\n      \n      if (filteredData.length === 0) {\n        showError('該当するデータが見つかりませんでした');\n        return;\n      }\n      \n      if (filteredData.length > 10000) {\n        showError('抽出データが上限（10,000件）を超えています。条件を絞り込んでください。');\n        return;\n      }\n      \n      // 大量データのタイムアウトシミュレーション\n      if (filteredData.length > 5000) {\n        await new Promise(resolve => setTimeout(resolve, 31000)); // 31秒待機\n        showError('処理がタイムアウトしました。条件を絞り込んでください。');\n        return;\n      }\n      \n      await new Promise(resolve => setTimeout(resolve, 1000)); // 処理時間シミュレーション\n      exportData(conditions, filteredData);\n      \n    } catch (error) {\n      showError('データ抽出中にエラーが発生しました');\n    } finally {\n      loadingMessage.style.display = 'none';\n    }\n  });\n\n  // 条件クリアボタン\n  container.querySelector('#btn-clear').addEventListener('click', clearConditions);\n\n  // 条件保存ボタン\n  container.querySelector('#btn-save-condition').addEventListener('click', () => {\n    container.querySelector('#condition-save-modal').style.display = 'block';\n  });\n\n  // 条件保存モーダル\n  container.querySelector('#btn-cancel-save').addEventListener('click', () => {\n    container.querySelector('#condition-save-modal').style.display = 'none';\n    container.querySelector('#condition-name').value = '';\n  });\n\n  container.querySelector('#btn-confirm-save').addEventListener('click', () => {\n    const conditionName = container.querySelector('#condition-name').value;\n    if (!conditionName) {\n      showError('条件名を入力してください');\n      return;\n    }\n    \n    // 条件保存処理（実際の実装では localStorage等に保存）\n    const conditions = getExtractionConditions();\n    localStorage.setItem(`extraction_condition_${conditionName}`, JSON.stringify(conditions));\n    \n    container.querySelector('#condition-save-modal').style.display = 'none';\n    container.querySelector('#condition-name').value = '';\n    \n    // 成功メッセージ表示\n    const successDiv = document.createElement('div');\n    successDiv.textContent = '条件が保存されました';\n    successDiv.style.cssText = 'position: fixed; top: 20px; right: 20px; background: var(--primary); color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 13px; z-index: 1001;';\n    document.body.appendChild(successDiv);\n    setTimeout(() => document.body.removeChild(successDiv), 3000);\n  });\n\n  // 戻るボタン\n  container.querySelector('#btn-back').addEventListener('click', () => {\n    window.showScreen(\"scr-1778907145716\");\n  });\n\n  // ホバー効果\n  container.querySelector('#btn-extract').addEventListener('mouseenter', (e) => {\n    e.target.style.background = 'var(--primary-hover)';\n  });\n  container.querySelector('#btn-extract').addEventListener('mouseleave', (e) => {\n    e.target.style.background = 'var(--primary)';\n  });\n\n  const secondaryButtons = container.querySelectorAll('button[style*=\"transparent\"]');\n  secondaryButtons.forEach(btn => {\n    btn.addEventListener('mouseenter', (e) => {\n      e.target.style.background = 'rgba(255,255,255,0.05)';\n    });\n    btn.addEventListener('mouseleave', (e) => {\n      e.target.style.background = 'transparent';\n    });\n  });\n\n  // 初期データ読み込み\n  loadInitialData();\n}";
</script>

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
