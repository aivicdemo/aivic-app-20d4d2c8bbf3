<!doctype html>
<html lang="ja">
<head>

    <style>
        :root {
            --primary: #4a9eff;
            --primary-hover: #3a8eef;
            --bg-main: #0f0f0f;
            --bg-card: #1a1a1a;
            --bg-sidebar: #141414;
            --border: #2a2a2a;
            --text: #e8e8e8;
            --text-muted: #9a9a9a;
            --top-bar-bg: #161616;
            --top-bar-border: #252525;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            height: 52px;
        }

        .logo {
            width: 24px;
            height: 24px;
            background: var(--primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: white;
        }

        .app-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-section {
            padding: 16px 12px 8px;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            padding: 0 8px;
        }

        .nav-item {
            display: block;
            padding: 8px 12px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 400;
            margin-bottom: 2px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        .nav-item.aivic-active {
            background: var(--primary);
            color: white;
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .breadcrumb-current {
            color: var(--text);
            font-weight: 500;
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .logout-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: color 0.15s ease;
        }

        .logout-link:hover {
            color: var(--text);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quick-action-btn {
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .quick-action-btn:hover {
            border-color: var(--primary);
            background: rgba(74, 158, 255, 0.1);
        }

        .quick-action-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .quick-action-btn.primary:hover {
            background: var(--primary-hover);
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-height: 400px;
            padding: 0;
        }

        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .nav-emergency {
            margin-top: auto;
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        .emergency-btn {
            width: 100%;
            padding: 10px 12px;
            background: var(--error);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        .emergency-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
            
            .quick-actions {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>

ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentPreviewData = [];\n  \n  // 初期化時に作業員と作業項目のオプションを設定\n  async function initializeOptions() {\n    try {\n      // 作業員データを取得\n      const users = await window.aivicApi.list(0);\n      const workersSelect = container.querySelector('#select-workers');\n      workersSelect.innerHTML = '';\n      if (users) {\n        users.forEach(user => {\n          if (user.有効フラグ) {\n            const option = document.createElement('option');\n            option.value = user.ユーザーID;\n            option.textContent = user.氏名;\n            workersSelect.appendChild(option);\n          }\n        });\n      }\n\n      // 作業項目データを取得\n      const workItems = await window.aivicApi.list(3);\n      const workItemsSelect = container.querySelector('#select-work-items');\n      workItemsSelect.innerHTML = '';\n      if (workItems) {\n        workItems.forEach(item => {\n          if (item.有効フラグ) {\n            const option = document.createElement('option');\n            option.value = item.作業項目ID;\n            option.textContent = item.作業項目名;\n            workItemsSelect.appendChild(option);\n          }\n        });\n      }\n    } catch (error) {\n      console.error('オプション初期化エラー:', error);\n    }\n  }\n\n  // エラーメッセージ表示\n  function showError(message) {\n    const errorDiv = container.querySelector('#error-message');\n    errorDiv.textContent = message;\n    errorDiv.style.display = 'block';\n    setTimeout(() => {\n      errorDiv.style.display = 'none';\n    }, 5000);\n  }\n\n  // 成功メッセージ表示\n  function showSuccess(message) {\n    const successDiv = container.querySelector('#success-message');\n    successDiv.textContent = message;\n    successDiv.style.display = 'block';\n    setTimeout(() => {\n      successDiv.style.display = 'none';\n    }, 3000);\n  }\n\n  // 条件バリデーション\n  function validateConditions() {\n    const startDate = container.querySelector('#input-start-date').value;\n    const endDate = container.querySelector('#input-end-date').value;\n    const outputFormat = container.querySelector('#select-output-format').value;\n    const selectedWorkers = Array.from(container.querySelector('#select-workers').selectedOptions);\n\n    if (!startDate || !endDate) {\n      showError('抽出期間（開始日・終了日）を指定してください');\n      return false;\n    }\n\n    if (new Date(startDate) > new Date(endDate)) {\n      showError('開始日は終了日より前の日付を入力してください');\n      return false;\n    }\n\n    if (!outputFormat) {\n      showError('出力形式を選択してください');\n      return false;\n    }\n\n    if (selectedWorkers.length === 0) {\n      showError('作業員を選択してください');\n      return false;\n    }\n\n    return true;\n  }\n\n  // プレビュー更新\n  async function updatePreview() {\n    const startDate = container.querySelector('#input-start-date').value;\n    const endDate = container.querySelector('#input-end-date').value;\n    const selectedWorkers = Array.from(container.querySelector('#select-workers').selectedOptions);\n    const selectedWorkItems = Array.from(container.querySelector('#select-work-items').selectedOptions);\n    const workLocation = container.querySelector('#input-work-location').value;\n    const includeAnomaly = container.querySelector('#checkbox-include-anomaly').checked;\n    const includeInterruption = container.querySelector('#checkbox-include-interruption').checked;\n    const outputFormat = container.querySelector('#select-output-format').value;\n\n    let previewText = '【抽出条件】\\n';\n    \n    if (startDate && endDate) {\n      previewText += `期間: ${startDate} ～ ${endDate}\\n`;\n    }\n    \n    if (selectedWorkers.length > 0) {\n      const workerNames = selectedWorkers.map(opt => opt.textContent).join(', ');\n      previewText += `作業員: ${workerNames}\\n`;\n    }\n    \n    if (selectedWorkItems.length > 0) {\n      const itemNames = selectedWorkItems.map(opt => opt.textContent).join(', ');\n      previewText += `作業項目: ${itemNames}\\n`;\n    }\n    \n    if (workLocation) {\n      previewText += `作業場所: ${workLocation}\\n`;\n    }\n    \n    previewText += `異常値データ: ${includeAnomaly ? '含む' : '除外'}\\n`;\n    previewText += `中断記録: ${includeInterruption ? '含む' : '除外'}\\n`;\n    \n    if (outputFormat) {\n      previewText += `出力形式: ${outputFormat.toUpperCase()}\\n`;\n    }\n\n    container.querySelector('#preview-content').textContent = previewText;\n\n    // データ件数を計算\n    try {\n      const workRecords = await window.aivicApi.list(1);\n      if (workRecords) {\n        let filteredRecords = workRecords.filter(record => {\n          const recordDate = new Date(record.作業日);\n          const start = startDate ? new Date(startDate) : null;\n          const end = endDate ? new Date(endDate) : null;\n          \n          if (start && recordDate < start) return false;\n          if (end && recordDate > end) return false;\n          \n          if (selectedWorkers.length > 0) {\n            const workerIds = selectedWorkers.map(opt => opt.value);\n            if (!workerIds.includes(record.作業員ID)) return false;\n          }\n          \n          if (workLocation && !record.作業場所.includes(workLocation)) return false;\n          \n          return true;\n        });\n\n        // 異常値フィルタリング\n        if (!includeAnomaly) {\n          const anomalyLogs = await window.aivicApi.list(4);\n          if (anomalyLogs) {\n            const anomalyRecordIds = anomalyLogs\n              .filter(log => log.検出対象テーブル === '作業記録')\n              .map(log => log.検出対象レコードID);\n            filteredRecords = filteredRecords.filter(record => \n              !anomalyRecordIds.includes(record.作業記録ID)\n            );\n          }\n        }\n\n        currentPreviewData = filteredRecords;\n        container.querySelector('#data-count').textContent = `${filteredRecords.length}件`;\n      }\n    } catch (error) {\n      console.error('データ件数計算エラー:', error);\n      container.querySelector('#data-count').textContent = '計算エラー';\n    }\n  }\n\n  // CSV/Excel出力\n  function exportData(format) {\n    if (currentPreviewData.length === 0) {\n      showError('抽出するデータがありません');\n      return;\n    }\n\n    const headers = ['作業日', '作業員名', '作業開始時刻', '作業終了時刻', '作業時間', 'プロジェクト名', '作業場所', '作業種別', '作業内容', '進捗状況'];\n    \n    if (format === 'csv') {\n      let csvContent = '\\uFEFF' + headers.join(',') + '\\n';\n      \n      currentPreviewData.forEach(record => {\n        const row = [\n          record.作業日 || '',\n          record.作業員名 || '',\n          record.作業開始時刻 || '',\n          record.作業終了時刻 || '',\n          record.作業時間 || '',\n          record.プロジェクト名 || '',\n          record.作業場所 || '',\n          record.作業種別 || '',\n          `\"${(record.作業内容 || '').replace(/\"/g, '\"\"')}\"`,\n          record.進捗状況 || ''\n        ];\n        csvContent += row.join(',') + '\\n';\n      });\n\n      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n      const link = document.createElement('a');\n      link.href = URL.createObjectURL(blob);\n      link.download = `工数記録データ_${new Date().toISOString().slice(0, 10)}.csv`;\n      link.click();\n      \n      showSuccess('CSVファイルをダウンロードしました');\n    } else if (format === 'excel') {\n      // 簡易Excel形式（実際にはCSVだが拡張子をxlsxに）\n      let csvContent = '\\uFEFF' + headers.join('\\t') + '\\n';\n      \n      currentPreviewData.forEach(record => {\n        const row = [\n          record.作業日 || '',\n          record.作業員名 || '',\n          record.作業開始時刻 || '',\n          record.作業終了時刻 || '',\n          record.作業時間 || '',\n          record.プロジェクト名 || '',\n          record.作業場所 || '',\n          record.作業種別 || '',\n          (record.作業内容 || '').replace(/\\t/g, ' '),\n          record.進捗状況 || ''\n        ];\n        csvContent += row.join('\\t') + '\\n';\n      });\n\n      const blob = new Blob([csvContent], { type: 'application/vnd.ms-excel;charset=utf-8;' });\n      const link = document.createElement('a');\n      link.href = URL.createObjectURL(blob);\n      link.download = `工数記録データ_${new Date().toISOString().slice(0, 10)}.xlsx`;\n      link.click();\n      \n      showSuccess('Excelファイルをダウンロードしました');\n    }\n  }\n\n  // 条件クリア\n  function clearConditions() {\n    container.querySelector('#input-start-date').value = '';\n    container.querySelector('#input-end-date').value = '';\n    container.querySelector('#select-output-format').value = '';\n    container.querySelector('#select-workers').selectedIndex = -1;\n    container.querySelector('#select-work-items').selectedIndex = -1;\n    container.querySelector('#input-work-location').value = '';\n    container.querySelector('#checkbox-include-anomaly').checked = false;\n    container.querySelector('#checkbox-include-interruption').checked = false;\n    container.querySelector('#input-condition-name').value = '';\n    container.querySelector('#preview-content').textContent = '条件を設定してプレビューボタンをクリックしてください';\n    container.querySelector('#data-count').textContent = '0件';\n    currentPreviewData = [];\n  }\n\n  // 条件保存\n  function saveConditions() {\n    const conditionName = container.querySelector('#input-condition-name').value;\n    if (!conditionName) {\n      showError('条件名を入力してください');\n      return;\n    }\n\n    const conditions = {\n      name: conditionName,\n      startDate: container.querySelector('#input-start-date').value,\n      endDate: container.querySelector('#input-end-date').value,\n      outputFormat: container.querySelector('#select-output-format').value,\n      selectedWorkers: Array.from(container.querySelector('#select-workers').selectedOptions).map(opt => opt.value),\n      selectedWorkItems: Array.from(container.querySelector('#select-work-items').selectedOptions).map(opt => opt.value),\n      workLocation: container.querySelector('#input-work-location').value,\n      includeAnomaly: container.querySelector('#checkbox-include-anomaly').checked,\n      includeInterruption: container.querySelector('#checkbox-include-interruption').checked,\n      savedAt: new Date().toISOString()\n    };\n\n    // ローカルストレージに保存\n    const savedConditions = JSON.parse(localStorage.getItem('extractionConditions') || '[]');\n    savedConditions.push(conditions);\n    localStorage.setItem('extractionConditions', JSON.stringify(savedConditions));\n    \n    showSuccess('抽出条件を保存しました');\n  }\n\n  // イベントリスナー設定\n  container.querySelector('#btn-back').addEventListener('click', () => {\n    window.showScreen(\"scr-1778907145716\");\n  });\n\n  container.querySelector('#btn-preview').addEventListener('click', updatePreview);\n\n  container.querySelector('#btn-clear-conditions').addEventListener('click', clearConditions);\n\n  container.querySelector('#btn-save-conditions').addEventListener('click', saveConditions);\n\n  container.querySelector('#btn-extract').addEventListener('click', async () => {\n    if (!validateConditions()) return;\n\n    const loadingIndicator = container.querySelector('#loading-indicator');\n    loadingIndicator.style.display = 'block';\n\n    try {\n      await updatePreview();\n      \n      setTimeout(() => {\n        loadingIndicator.style.display = 'none';\n        const outputFormat = container.querySelector('#select-output-format').value;\n        exportData(outputFormat);\n      }, 1500); // 処理時間をシミュレート\n      \n    } catch (error) {\n      loadingIndicator.style.display = 'none';\n      if (error.message.includes('timeout')) {\n        showError('大量データ抽出処理がタイムアウトしました。条件を絞り込んでください。');\n      } else {\n        showError('データ抽出中にエラーが発生しました');\n      }\n    }\n  });\n\n  // 初期化\n  initializeOptions();\n}";

        const screenTitles = {

            'scr-1778907170814': '異常値検出ログ',

            'scr-1778907199709': '工数記録終了',
            'scr-1778907212862': 'データ自動保存処理',

            'scr-1778907309324': '異常値検出処理',

        window.addEventListener('aivic:screen-changed', function(e) {
            const title = screenTitles[e.detail.screenId];
            if (title) {
                document.getElementById('current-screen-title').textContent = title;

        // 初期画面表示
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof window.showScreen === 'function') {
                window.showScreen('scr-1778907133295');

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
