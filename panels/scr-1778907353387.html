:"進捗状況","type":"varchar(100)","required":true,"description":"作業の進捗状態（作業中、完了、中断等）"},{"name":"備考","type":"text","required":false,"description":"特記事項や注意点等の補足情報"},{"name":"承認状態","type":"varchar(100)","required":true,"description":"記録の承認状況（未承認、承認済み、差し戻し）"},{"name":"承認者ID","type":"uuid","required":false,"description":"記録を承認した管理者のID"},{"name":"承認日時","type":"timestamp","required":false,"description":"承認が行われた日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"}]},{"tableName":"中断記録","purpose":"作業中断の発生理由、時間、影響を記録し、作業効率分析と改善に活用する","columns":[{"name":"中断記録ID","type":"uuid","required":true,"description":"中断記録の一意識別子（主キー）"},{"name":"作業記録ID","type":"uuid","required":true,"description":"中断が発生した作業記録への外部キー"},{"name":"中断開始日時","type":"timestamp","required":true,"description":"作業を中断した日時"},{"name":"中断終了日時","type":"timestamp","required":false,"description":"作業を再開した日時"},{"name":"中断理由区分","type":"varchar(100)","required":true,"description":"中断理由の分類（機械故障、材料不足、天候、休憩等）"},{"name":"中断理由詳細","type":"text","required":false,"description":"中断理由の具体的な内容"},{"name":"中断時間","type":"integer","required":false,"description":"中断時間（分）"},{"name":"影響度","type":"varchar(100)","required":false,"description":"作業への影響度（軽微、中程度、重大）"},{"name":"対応状況","type":"varchar(100)","required":true,"description":"中断への対応状況（対応中、解決済み、未対応）"},{"name":"記録者ID","type":"uuid","required":true,"description":"中断を記録した作業員のユーザーID"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]},{"tableName":"作業項目マスタ","purpose":"現場作業員が工数記録時に選択する作業項目の定義と管理を行う","columns":[{"name":"作業項目ID","type":"uuid","required":true,"description":"作業項目の一意識別子（主キー）"},{"name":"作業項目コード","type":"varchar(100)","required":true,"description":"作業項目の業務コード（検索・表示用）"},{"name":"作業項目名","type":"varchar(100)","required":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type":"text","required":false,"description":"管理者による対応内容や備考"},{"name":"検出日時","type":"timestamp","required":true,"description":"異常値が検出された日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]}];

window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックのインポート\n  const { calculateWorkDuration, calculateProgressRate, isWorkTimeValid, detectEfficiencyAnomaly, validateWorkRecordData, analyzeInterruptionPatterns } = window.workRecordCalc || {};\n  const { detectWorkTimeAnomalies, validateDataIntegrity, createAnomalyLog, validateWorkRecordComprehensive } = window.anomalyDetection || {};\n  const { validateRequiredFields, validateTimeSequence, validateWorkDuration } = window.validationCheck || {};\n  const { aggregateMonthlyHours, aggregateByCategory, calculateSiteProductivity, detectMissingData } = window.dataAggregation || {};\n  const { validateDataCompleteness, interpolateMissingData, detectAnomalies } = window.qualityAssurance || {};\n  const { calculateEffectMeasurement, generateBudgetVariance, createComparisonMetrics, detectAnomalousValues } = window.reportingCalc || {};\n\n  let currentResults = [];\n  \n  // DOM要素の取得\n  const startDateInput = container.querySelector('input[name=\"startDate\"]');\n  const endDateInput = container.querySelector('input[name=\"endDate\"]');\n  const outputFormatSelect = container.querySelector('select[name=\"outputFormat\"]');\n  const workerCheckboxes = container.querySelectorAll('input[name=\"workers\"]');\n  const extractItemCheckboxes = container.querySelectorAll('input[name=\"extractItems\"]');\n  const workLocationInput = container.querySelector('input[name=\"workLocation\"]');\n  const excludeAbnormalCheckbox = container.querySelector('input[name=\"excludeAbnormalValues\"]');\n  const includeBreakCheckbox = container.querySelector('input[name=\"includeBreakRecords\"]');\n  const workerSelect = container.querySelector('select[name=\"worker\"]');\n  const workTypeSelect = container.querySelector('select[name=\"workType\"]');\n  const extractButton = container.querySelector('button:has-text(\"抽出実行\")');\n  const dataExtractButton = container.querySelector('button:has-text(\"データ抽出\")');\n  const previewButton = container.querySelector('button:has-text(\"プレビュー\")');\n  const errorMessage = container.querySelector('.error-message');\n  const previewArea = container.querySelector('.preview-area');\n  const resultCount = container.querySelector('.result-count');\n  const extractionResults = container.querySelector('.extraction-results');\n\n  // 初期データの設定\n  function initializeSelects() {\n    // 作業員選択の初期化\n    const users = tables[0]?.records || [];\n    if (workerSelect) {\n      workerSelect.innerHTML = '<option value=\"\">全作業員</option>';\n      users.forEach(user => {\n        const option = document.createElement('option');\n        option.value = user.ユーザーID;\n        option.textContent = user.氏名;\n        workerSelect.appendChild(option);\n      });\n    }\n\n    // 作業項目選択の初期化\n    const workItems = tables[3]?.records || [];\n    if (workTypeSelect) {\n      workTypeSelect.innerHTML = '<option value=\"\">全作業項目</option>';\n      workItems.forEach(item => {\n        const option = document.createElement('option');\n        option.value = item.作業項目ID;\n        option.textContent = item.作業項目名;\n        workTypeSelect.appendChild(option);\n      });\n    }\n  }\n\n  // エラーメッセージ表示\n  function showError(message) {\n    if (errorMessage) {\n      errorMessage.textContent = message;\n      errorMessage.style.display = 'block';\n    }\n    window.aivicNotify?.error(message);\n  }\n\n  function hideError() {\n    if (errorMessage) {\n      errorMessage.style.display = 'none';\n    }\n  }\n\n  // 工数記録データ取得\n  async function fetchWorkRecords() {\n    try {\n      const response = await window.aivicApi.list('工数記録', {});\n      return response.records || [];\n    } catch (error) {\n      showError('工数記録データの取得に失敗しました');\n      return [];\n    }\n  }\n\n  // フィルター条件の取得\n  function getFilterConditions() {\n    const conditions = {\n      startDate: startDateInput?.value,\n      endDate: endDateInput?.value,\n      workers: Array.from(workerCheckboxes || []).filter(cb => cb.checked).map(cb => cb.value),\n      extractItems: Array.from(extractItemCheckboxes || []).filter(cb => cb.checked).map(cb => cb.value),\n      workLocation: workLocationInput?.value,\n      excludeAbnormal: excludeAbnormalCheckbox?.checked || false,\n      includeBreak: includeBreakCheckbox?.checked || false,\n      selectedWorker: workerSelect?.value,\n      selectedWorkType: workTypeSelect?.value\n    };\n    return conditions;\n  }\n\n  // データフィルタリング\n  function filterWorkRecords(records, conditions) {\n    let filtered = [...records];\n\n    // 期間フィルター\n    if (conditions.startDate && conditions.endDate) {\n      filtered = filtered.filter(record => {\n        const recordDate = new Date(record.作業日時);\n        return recordDate >= new Date(conditions.startDate) && recordDate <= new Date(conditions.endDate);\n      });\n    }\n\n    // 作業員フィルター\n    if (conditions.workers && conditions.workers.length > 0) {\n      filtered = filtered.filter(record => conditions.workers.includes(record.ユーザーID));\n    }\n\n    if (conditions.selectedWorker) {\n      filtered = filtered.filter(record => record.ユーザーID === conditions.selectedWorker);\n    }\n\n    // 作業項目フィルター\n    if (conditions.selectedWorkType) {\n      filtered = filtered.filter(record => record.作業項目ID === conditions.selectedWorkType);\n    }\n\n    // 作業場所フィルター\n    if (conditions.workLocation) {\n      filtered = filtered.filter(record => \n        record.作業場所 && record.作業場所.includes(conditions.workLocation)\n      );\n    }\n\n    // 異常値除外\n    if (conditions.excludeAbnormal && detectWorkTimeAnomalies) {\n      filtered = filtered.filter(record => {\n        const anomalies = detectWorkTimeAnomalies([record]);\n        return anomalies.length === 0;\n      });\n    }\n\n    // 中断記録フィルター\n    if (!conditions.includeBreak) {\n      filtered = filtered.filter(record => !record.中断フラグ);\n    }\n\n    return filtered;\n  }\n\n  // プレビュー表示\n  function showPreview() {\n    if (!previewArea) return;\n\n    const conditions = getFilterConditions();\n    const previewText = [];\n\n    if (conditions.startDate && conditions.endDate) {\n      const startDate = new Date(conditions.startDate).toLocaleDateString('ja-JP');\n      const endDate = new Date(conditions.endDate).toLocaleDateString('ja-JP');\n      previewText.push(`${startDate}～${endDate}`);\n    }\n\n    if (conditions.selectedWorker && workerSelect) {\n      const selectedOption = workerSelect.options[workerSelect.selectedIndex];\n      previewText.push(selectedOption.textContent);\n    }\n\n    if (conditions.selectedWorkType && workTypeSelect) {\n      const selectedOption = workTypeSelect.options[workTypeSelect.selectedIndex];\n      previewText.push(selectedOption.textContent);\n    }\n\n    previewArea.innerHTML = previewText.join('<br>');\n    previewArea.style.display = 'block';\n  }\n\n  // データ抽出実行\n  async function executeDataExtraction() {\n    try {\n      hideError();\n      \n      const records = await fetchWorkRecords();\n      const conditions = getFilterConditions();\n      \n      // バリデーション\n      if (validateRequiredFields && !validateRequiredFields(conditions)) {\n        showError('必須項目が入力されていません');\n        return;\n      }\n\n      // データフィルタリング\n      let filteredRecords = filterWorkRecords(records, conditions);\n\n      // データ品質チェック\n      if (validateDataIntegrity) {\n        const integrityResult = validateDataIntegrity(filteredRecords);\n        if (!integrityResult.isValid) {\n          showError(`データ整合性エラー: ${integrityResult.errors.join(', ')}`);\n          return;\n        }\n      }\n\n      // 異常値検出と除外\n      if (conditions.excludeAbnormal && detectAnomalousValues) {\n        const anomalies = detectAnomalousValues(filteredRecords);\n        filteredRecords = filteredRecords.filter(record => \n          !anomalies.some(anomaly => anomaly.recordId === record.ID)\n        );\n      }\n\n      currentResults = filteredRecords;\n\n      // 結果表示\n      displayResults(filteredRecords);\n      \n      // 件数表示\n      if (resultCount) {\n        resultCount.textContent = `${filteredRecords.length}件のデータが抽出されました`;\n      }\n\n    } catch (error) {\n      showError('データ抽出中にエラーが発生しました: ' + error.message);\n    }\n  }\n\n  // 結果表示\n  function displayResults(records) {\n    if (!extractionResults) return;\n\n    extractionResults.innerHTML = '';\n    \n    records.forEach(record => {\n      const row = document.createElement('div');\n      row.className = 'result-row';\n      \n      // 中断記録の場合はクラス追加\n      if (record.中断フラグ) {\n        row.classList.add('break-record');\n      }\n\n      // 工数時間の表示\n      const hoursSpan = document.createElement('span');\n      hoursSpan.className = 'work-hours-value';\n      hoursSpan.textContent = record.工数時間 || '0';\n      \n      row.innerHTML = `\n        <div>作業日時: ${record.作業日時}</div>\n        <div>作業内容: ${record.作業内容}</div>\n        <div>工数時間: ${hoursSpan.outerHTML}</div>\n        <div>作業場所: ${record.作業場所}</div>\n      `;\n      \n      extractionResults.appendChild(row);\n    });\n\n    extractionResults.style.display = 'block';\n  }\n\n  // ファイル出力\n  async function executeFileExtraction() {\n    try {\n      const conditions = getFilterConditions();\n      const format = outputFormatSelect?.value || 'csv';\n      \n      if (!conditions.startDate || !conditions.endDate) {\n        showError('開始日と終了日を入力してください');\n        return;\n      }\n\n      const records = await fetchWorkRecords();\n      const filteredRecords = filterWorkRecords(records, conditions);\n\n      // ファイル生成\n      let content, filename, mimeType;\n      \n      if (format === 'csv') {\n        content = generateCSV(filteredRecords);\n        filename = `工数記録_${conditions.startDate}_${conditions.endDate}.csv`;\n        mimeType = 'text/csv';\n      } else if (format === 'excel') {\n        content = generateExcel(filteredRecords);\n        filename = `工数記録_${conditions.startDate}_${conditions.endDate}.xlsx`;\n        mimeType = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';\n      }\n\n      // ダウンロード実行\n      const blob = new Blob([content], { type: mimeType });\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement('a');\n      a.href = url;\n      a.download = filename;\n      document.body.appendChild(a);\n      a.click();\n      document.body.removeChild(a);\n      URL.revokeObjectURL(url);\n\n    } catch (error) {\n      showError('ファイル出力中にエラーが発生しました: ' + error.message);\n    }\n  }\n\n  // CSV生成\n  function generateCSV(records) {\n    const headers = ['作業日時', '作業内容', '工数時間', '作業場所', '作業員'];\n    const rows = records.map(record => [\n      record.作業日時,\n      record.作業内容,\n      record.工数時間,\n      record.作業場所,\n      record.作業員名\n    ]);\n    \n    return [headers, ...rows].map(row => \n      row.map(cell => `\"${cell || ''}\"`).join(',')\n    ).join('\\n');\n  }\n\n  // Excel生成（簡易版）\n  function generateExcel(records) {\n    return generateCSV(records); // 実際の実装ではExcelライブラリを使用\n  }\n\n  // イベントリスナー設定\n  if (extractButton) {\n    extractButton.addEventListener('click', executeFileExtraction);\n  }\n\n  if (dataExtractButton) {\n    dataExtractButton.addEventListener('click', executeDataExtraction);\n  }\n\n  if (previewButton) {\n    previewButton.addEventListener('click', showPreview);\n  }\n\n  // 条件変更時のプレビュー自動更新\n  [startDateInput, endDateInput, workerSelect, workTypeSelect].forEach(element => {\n    if (element) {\n      element.addEventListener('change', showPreview);\n    }\n  });\n\n  // 初期化実行\n  initializeSelects();\n  hideError();\n}";
</script>

      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
