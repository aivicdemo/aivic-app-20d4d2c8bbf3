window.AIVIC_TABLES = [{"tableName":"ユーザー","purpose":"現場作業員のアカウント情報と認証情報を管理する","columns":[{"name":"ユーザーID","type":"uuid","required":true,"description":"ユーザーの一意識別子（主キー）"},{"name":"ユーザー名","type":"varchar(100)","required":true,"description":"ログイン用のユーザー名"},{"name":"パスワードハッシュ","type":"varchar(100)","required":true,"description":"ハッシュ化されたパスワード"},{"name":"氏名","type":"varchar(100)","required":true,"description":"作業員の実名"},{"name":"所属部署","type":"varchar(100)","required":false,"description":"作業員が所属する部署名"},{"name":"職種","type":"varchar(100)","required":false,"description":"作業員の職種・役職"},{"name":"権限レベル","type":"varchar(100)","required":true,"description":"システム内での権限（一般作業員、管理者等）"},{"name":"有効フラグ","type":"boolean","required":true,"description":"アカウントの有効/無効状態"},{"name":"最終ログイン日時","type":"timestamp","required":false,"description":"最後にログインした日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者","type":"varchar(100)","required":true,"description":"レコード作成者"}]},{"tableName":"作業記録","purpose":"現場作業員の日々の作業時間と内容を記録し、工数管理と実績分析を行うためのトランザクションテーブル","columns":[{"name":"作業記録ID","type":"uuid","required":true,"description":"作業記録の一意識別子（主キー）"},{"name":"作業員ID","type":"uuid","required":true,"description":"作業を行った作業員のID（ユーザーテーブル外部キー）"},{"name":"作業日","type":"timestamp","required":true,"description":"作業を実施した日付"},{"name":"作業開始時刻","type":"timestamp","required":true,"description":"作業開始の日時"},{"name":"作業終了時刻","type":"timestamp","required":false,"description":"作業終了の日時（作業中の場合はnull）"},{"name":"作業時間","type":"integer","required":false,"description":"実際の作業時間（分単位、終了時に自動計算）"},{"name":"プロジェクト名","type":"varchar(100)","required":true,"description":"作業対象のプロジェクト名"},{"name":"作業場所","type":"varchar(100)","required":true,"description":"作業を実施した現場・場所"},{"name":"作業種別","type":"varchar(100)","required":true,"description":"作業の種類（設置、点検、修理等）"},{"name":"作業内容","type":"text","required":true,"description":"具体的な作業内容の詳細"},{"name" ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type":"text","required":false,"description":"管理者による対応内容や備考"},{"name":"検出日時","type":"timestamp","required":true,"description":"異常値が検出された日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]}];

window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  let workRecords = [];\n  let users = [];\n  let workItems = [];\n  let interruptionRecords = [];\n  let anomalyLogs = [];\n\n  // テーブルインデックス定義\n  const TABLE_USERS = 0;\n  const TABLE_WORK_RECORDS = 1;\n  const TABLE_INTERRUPTIONS = 2;\n  const TABLE_WORK_ITEMS = 3;\n  const TABLE_ANOMALY_LOGS = 4;\n\n  // 業務ロジックモジュールのインポート\n  const { \n    aggregateDailyWorkData, \n    analyzeWorkPerformance, \n    calculateProductivityIndicators,\n    detectAnomalousValue,\n    saveToLocalStorage,\n    checkDataIntegrity,\n    generateWeeklyReport,\n    syncLocalDataToCloud\n  } = window.aivicLogic?.feature || {};\n\n  // 初期データ設定\n  users = tables[TABLE_USERS]?.records || [];\n  workRecords = tables[TABLE_WORK_RECORDS]?.records || [];\n  interruptionRecords = tables[TABLE_INTERRUPTIONS]?.records || [];\n  workItems = tables[TABLE_WORK_ITEMS]?.records || [];\n  anomalyLogs = tables[TABLE_ANOMALY_LOGS]?.records || [];\n\n  // 作業員リスト描画\n  function renderWorkerList() {\n    const workerListEl = container.querySelector('#worker-list');\n    if (!workerListEl) return;\n    \n    workerListEl.innerHTML = users.map(user => `\n      <label style=\"display: block; font-size: 12px; margin-bottom: 2px;\">\n        <input type=\"checkbox\" name=\"workers\" value=\"${user.ユーザーID}\" style=\"accent-color: var(--primary); margin-right: 6px;\">\n        ${user.氏名 || user.ユーザー名 || ''}\n      </label>\n    `).join('');\n  }\n\n  // 作業項目リスト描画\n  function renderWorkItemList() {\n    const itemListEl = container.querySelector('#item-list');\n    if (!itemListEl) return;\n    \n    itemListEl.innerHTML = workItems.map(item => `\n      <label style=\"display: block; font-size: 12px; margin-bottom: 2px;\">\n        <input type=\"checkbox\" name=\"extractItems\" value=\"${item.作業項目ID}\" style=\"accent-color: var(--primary); margin-right: 6px;\">\n        ${item.作業項目名 || ''}\n      </label>\n    `).join('');\n  }\n\n  // 作業場所選択肢描画\n  function renderWorkLocations() {\n    const locationEl = container.querySelector('select[name=\"workLocation\"]');\n    if (!locationEl) return;\n    \n    const locations = [...new Set(workRecords.map(r => r.作業場所).filter(Boolean))];\n    locationEl.innerHTML = '<option value=\"\">全て</option>' + \n      locations.map(loc => `<option value=\"${loc}\">${loc}</option>`).join('');\n  }\n\n  // 作業員選択肢描画\n  function renderWorkerSelect() {\n    const workerEl = container.querySelector('select[name=\"worker\"]');\n    if (!workerEl) return;\n    \n    workerEl.innerHTML = '<option value=\"\">全て</option>' + \n      users.map(user => `<option value=\"${user.ユーザーID}\">${user.氏名 || user.ユーザー名}</option>`).join('');\n  }\n\n  // 作業種別選択肢描画\n  function renderWorkTypeSelect() {\n    const workTypeEl = container.querySelector('select[name=\"workType\"]');\n    if (!workTypeEl) return;\n    \n    const workTypes = [...new Set(workItems.map(item => item.作業種別).filter(Boolean))];\n    workTypeEl.innerHTML = '<option value=\"\">全て</option>' + \n      workTypes.map(type => `<option value=\"${type}\">${type}</option>`).join('');\n  }\n\n  // フォーム値取得\n  function getFormValues() {\n    const startDate = container.querySelector('[data-testid=\"start-date\"]')?.value || '';\n    const endDate = container.querySelector('[data-testid=\"end-date\"]')?.value || '';\n    const outputFormat = container.querySelector('[data-testid=\"output-format\"]')?.value || 'csv';\n    const anomalyFilter = container.querySelector('[data-testid=\"anomaly-filter\"]')?.checked || false;\n    const interruptionFilter = container.querySelector('[data-testid=\"interruption-filter\"]')?.checked || false;\n    \n    const selectedWorkers = Array.from(container.querySelectorAll('[name=\"workers\"]:checked')).map(el => el.value);\n    const selectedItems = Array.from(container.querySelectorAll('[name=\"extractItems\"]:checked')).map(el => el.value);\n    \n    return {\n      startDate,\n      endDate,\n      outputFormat,\n      anomalyFilter,\n      interruptionFilter,\n      selectedWorkers,\n      selectedItems\n    };\n  }\n\n  // データフィルタリング\n  function filterData(conditions) {\n    let filteredRecords = [...workRecords];\n    \n    // 期間フィルタ\n    if (conditions.startDate) {\n      filteredRecords = filteredRecords.filter(r => r.作業日 >= conditions.startDate);\n    }\n    if (conditions.endDate) {\n      filteredRecords = filteredRecords.filter(r => r.作業日 <= conditions.endDate);\n    }\n    \n    // 作業員フィルタ\n    if (conditions.selectedWorkers.length > 0) {\n      filteredRecords = filteredRecords.filter(r => conditions.selectedWorkers.includes(r.ユーザーID));\n    }\n    \n    // 作業項目フィルタ\n    if (conditions.selectedItems.length > 0) {\n      filteredRecords = filteredRecords.filter(r => conditions.selectedItems.includes(r.作業項目ID));\n    }\n    \n    // 異常値除外フィルタ\n    if (conditions.anomalyFilter && detectAnomalousValue) {\n      filteredRecords = filteredRecords.filter(r => {\n        try {\n          return !detectAnomalousValue(r);\n        } catch (error) {\n          console.warn('異常値検出エラー:', error);\n          return true;\n        }\n      });\n    }\n    \n    return filteredRecords;\n  }\n\n  // CSV生成\n  function generateCSV(data) {\n    if (!data || data.length === 0) return '';\n    \n    const headers = Object.keys(data[0]);\n    const csvContent = [\n      headers.join(','),\n      ...data.map(row => headers.map(header => `\"${row[header] || ''}\"`).join(','))\n    ].join('\\n');\n    \n    return csvContent;\n  }\n\n  // Excel生成（簡易版）\n  function generateExcel(data) {\n    return generateCSV(data); // 実際のExcel生成は別途ライブラリが必要\n  }\n\n  // ファイルダウンロード\n  function downloadFile(content, filename, mimeType) {\n    const blob = new Blob([content], { type: mimeType });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url;\n    a.download = filename;\n    document.body.appendChild(a);\n    a.click();\n    document.body.removeChild(a);\n    URL.revokeObjectURL(url);\n  }\n\n  // データ件数表示更新\n  function updateDataCount(count) {\n    const dataCountEl = container.querySelector('[data-testid=\"data-count\"]');\n    if (dataCountEl) {\n      dataCountEl.textContent = `${count}件`;\n      dataCountEl.style.display = 'block';\n    }\n  }\n\n  // プレビュー表示\n  function showPreview(conditions, data) {\n    const previewSection = container.querySelector('[data-testid=\"preview-section\"]');\n    const previewContent = container.querySelector('[data-testid=\"preview-content\"]');\n    \n    if (!previewSection || !previewContent) return;\n    \n    const previewText = `\n      抽出期間: ${conditions.startDate} ～ ${conditions.endDate}\n      対象作業員: ${conditions.selectedWorkers.length > 0 ? conditions.selectedWorkers.length + '名' : '全員'}\n      対象作業項目: ${conditions.selectedItems.length > 0 ? conditions.selectedItems.length + '項目' : '全項目'}\n      異常値除外: ${conditions.anomalyFilter ? 'あり' : 'なし'}\n      中断記録含む: ${conditions.interruptionFilter ? 'あり' : 'なし'}\n      抽出件数: ${data.length}件\n    `;\n    \n    previewContent.textContent = previewText;\n    previewSection.style.display = 'block';\n  }\n\n  // 抽出実行\n  async function executeExtraction() {\n    try {\n      const conditions = getFormValues();\n      \n      if (!conditions.startDate || !conditions.endDate) {\n        window.aivicNotify?.error('開始日と終了日を入力してください');\n        return;\n      }\n      \n      let filteredData = filterData(conditions);\n      \n      // 中断記録を含む場合\n      if (conditions.interruptionFilter) {\n        const interruptionData = interruptionRecords.filter(r => {\n          return (!conditions.startDate || r.中断日時 >= conditions.startDate) &&\n                 (!conditions.endDate || r.中断日時 <= conditions.endDate);\n        });\n        filteredData = [...filteredData, ...interruptionData];\n      }\n      \n      updateDataCount(filteredData.length);\n      \n      if (filteredData.length === 0) {\n        window.aivicNotify?.error('抽出条件に該当するデータがありません');\n        return;\n      }\n      \n      // ファイル生成とダウンロード\n      const timestamp = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '');\n      let content, filename, mimeType;\n      \n      if (conditions.outputFormat === 'excel') {\n        content = generateExcel(filteredData);\n        filename = `工数記録_${timestamp}.xlsx`;\n        mimeType = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';\n      } else {\n        content = generateCSV(filteredData);\n        filename = `工数記録_${timestamp}.csv`;\n        mimeType = 'text/csv;charset=utf-8';\n      }\n      \n      downloadFile(content, filename, mimeType);\n      \n      // ローカルストレージに保存\n      if (saveToLocalStorage) {\n        try {\n          saveToLocalStorage('lastExtraction', {\n            conditions,\n            timestamp: new Date().toISOString(),\n            dataCount: filteredData.length\n          });\n        } catch (error) {\n          console.warn('ローカルストレージ保存エラー:', error);\n        }\n      }\n      \n      window.aivicNotify?.success(`${filteredData.length}件のデータを抽出しました`);\n      \n    } catch (error) {\n      console.error('抽出処理エラー:', error);\n      window.aivicNotify?.error('データ抽出中にエラーが発生しました');\n    }\n  }\n\n  // プレビュー実行\n  function executePreview() {\n    try {\n      const conditions = getFormValues();\n      \n      if (!conditions.startDate || !conditions.endDate) {\n        window.aivicNotify?.error('開始日と終了日を入力してください');\n        return;\n      }\n      \n      const filteredData = filterData(conditions);\n      showPreview(conditions, filteredData);\n      \n    } catch (error) {\n      console.error('プレビュー処理エラー:', error);\n      window.aivicNotify?.error('プレビュー表示中にエラーが発生しました');\n    }\n  }\n\n  // 条件保存\n  async function saveCondition() {\n    try {\n      const conditions = getFormValues();\n      const conditionNameEl = container.querySelector('[data-testid=\"condition-name\"]');\n      const conditionName = conditionNameEl?.value || '';\n      \n      if (!conditionName) {\n        window.aivicNotify?.error('条件名を入力してください');\n        return;\n      }\n      \n      const savedCondition = {\n        name: conditionName,\n        conditions,\n        createdAt: new Date().toISOString()\n      };\n      \n      if (saveToLocalStorage) {\n        const existingConditions = JSON.parse(localStorage.getItem('extractionConditions') || '[]');\n        existingConditions.push(savedCondition);\n        localStorage.setItem('extractionConditions', JSON.stringify(existingConditions));\n      }\n      \n      window.aivicNotify?.success('抽出条件を保存しました');\n      \n      if (conditionNameEl) {\n        conditionNameEl.value = '';\n      }\n      \n    } catch (error) {\n      console.error('条件保存エラー:', error);\n      window.aivicNotify?.error('条件保存中にエラーが発生しました');\n    }\n  }\n\n  // 全選択/全解除\n  function toggleSelectAll(targetName, checkboxTestId) {\n    const selectAllCheckbox = container.querySelector(`[data-testid=\"${checkboxTestId}\"]`);\n    const targetCheckboxes = container.querySelectorAll(`[name=\"${targetName}\"]`);\n    \n    if (!selectAllCheckbox) return;\n    \n    selectAllCheckbox.addEventListener('change', function() {\n      targetCheckboxes.forEach(checkbox => {\n        checkbox.checked = this.checked;\n      });\n    });\n  }\n\n  // イベントハンドラー設定\n  function setupEventHandlers() {\n    // 抽出ボタン\n    const extractButton = container.querySelector('[data-testid=\"extract-button\"]');\n    if (extractButton) {\n      extractButton.addEventListener('click', executeExtraction);\n    }\n    \n    // プレビューボタン\n    const previewButton = container.querySelector('[data-testid=\"preview-button\"]');\n    if (previewButton) {\n      previewButton.addEventListener('click', executePreview);\n    }\n    \n    // 条件保存ボタン\n    const saveConditionButton = container.querySelector('[data-testid=\"save-condition-button\"]');\n    if (saveConditionButton) {\n      saveConditionButton.addEventListener('click', saveCondition);\n    }\n    \n    // 条件保存確認ボタン\n    const confirmSaveButton = container.querySelector('[data-testid=\"confirm-save-button\"]');\n    if (confirmSaveButton) {\n      confirmSaveButton.addEventListener('click', saveCondition);\n    }\n    \n    // 全選択チェックボックス\n    toggleSelectAll('workers', 'select-all-workers');\n    toggleSelectAll('extractItems', 'select-all-items');\n  }\n\n  // 初期化処理\n  function initialize() {\n    try {\n      renderWorkerList();\n      renderWorkItemList();\n      renderWorkLocations();\n      renderWorkerSelect();\n      renderWorkTypeSelect();\n      setupEventHandlers();\n      \n      // デフォルト日付設定\n      const today = new Date();\n      const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);\n      const startDateEl = container.querySelector('[data-testid=\"start-date\"]');\n      const endDateEl = container.querySelector('[data-testid=\"end-date\"]');\n      \n      if (startDateEl && !startDateEl.value) {\n        startDateEl.value = firstDay.toISOString().slice(0, 10);\n      }\n      if (endDateEl && !endDateEl.value) {\n        endDateEl.value = today.toISOString().slice(0, 10);\n      }\n      \n    } catch (error) {\n      console.error('初期化エラー:', error);\n      window.aivicNotify?.error('画面の初期化中にエラーが発生しました');\n    }\n  }\n\n  // 初期化実行\n  initialize();\n}";
</script>

      display: flex;
      align-items: center;
      gap: 8px;
    }

      font-size: 18px;
    }

      padding: 16px 0 8px 0;
    }

      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 16px 8px 16px;
    }

    .nav-item {
      display: block;
      padding: 8px 16px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 400;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      border-radius: 0;
      position: relative;
    }

    .nav-item:hover {
      background: rgba(139, 0, 0, 0.1);
      color: var(--text);
    }

      background: rgba(139, 0, 0, 0.15);
      color: var(--primary);
      font-weight: 500;
    }

    .nav-item.aivic-active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--primary);
    }

    .main-content {
      flex: 1;
      margin-left: 220px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .top-bar {
      height: 52px;
      background: var(--top-bar-bg);
      border-bottom: 1px solid var(--top-bar-border);

      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 50;

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .breadcrumb {
      font-size: 13px;
      color: var(--text-muted);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(0, 170, 68, 0.1);
      color: var(--accent-green);
      border: 1px solid rgba(0, 170, 68, 0.2);
    }

    .status-indicator::before {
      content: "●";
      font-size: 8px;

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 12px;
    }

    .logout-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      transition: all 0.15s ease;
    }

    .logout-link:hover {
      background: var(--bg-card);
      color: var(--text);
    }

    .content-area {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
    }

    .panel-container {
      min-height: calc(100vh - 52px - 32px);
    }

    .emergency-alert {
      background: rgba(255, 68, 68, 0.1);
      border: 1px solid rgba(255, 68, 68, 0.3);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: none;

    .emergency-alert-title {
      font-size: 14px;
      font-weight: 600;

      margin-bottom: 4px;

    .emergency-alert-text {

      color: var(--text-muted);
    }

      .sidebar {

      }

        transform: translateX(0);
      }

      .main-content {

      }

      .top-bar {
        padding: 0 16px;
      }

      .content-area {

      }
    }

      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
