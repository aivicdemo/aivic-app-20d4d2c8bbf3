ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  let workRecords = [];\n  let users = [];\n  let workItems = [];\n  let interruptionRecords = [];\n  let anomalyLogs = [];\n\n  // テーブルインデックス定義\n  const TABLE_USERS = 0;\n  const TABLE_WORK_RECORDS = 1;\n  const TABLE_INTERRUPTIONS = 2;\n  const TABLE_WORK_ITEMS = 3;\n  const TABLE_ANOMALY_LOGS = 4;\n\n  // 業務ロジックモジュールのインポート\n  const { filterAnomalousRecords, detectAnomalousWorkDurations } = window.aivicLogic?.anomalyDetection || {};\n  const { aggregateByCategory, calculateProductivityIndex } = window.aivicLogic?.dataAggregation || {};\n  const { detectMissingData, validateDataCompleteness } = window.aivicLogic?.dataQuality || {};\n\n  // 初期データ設定\n  users = tables[TABLE_USERS]?.records || [];\n  workRecords = tables[TABLE_WORK_RECORDS]?.records || [];\n  interruptionRecords = tables[TABLE_INTERRUPTIONS]?.records || [];\n  workItems = tables[TABLE_WORK_ITEMS]?.records || [];\n  anomalyLogs = tables[TABLE_ANOMALY_LOGS]?.records || [];\n\n  // 作業員リスト描画\n  function renderWorkerList() {\n    const workerListEl = container.querySelector('#worker-list');\n    if (!workerListEl) return;\n    \n    workerListEl.innerHTML = users.map(user => `\n      <label style=\"display: block; font-size: 12px; margin-bottom: 2px;\">\n        <input type=\"checkbox\" name=\"workers\" value=\"${user.ユーザーID}\" style=\"accent-color: var(--primary); margin-right: 6px;\">\n        ${user.氏名 || user.ユーザー名 || ''}\n      </label>\n    `).join('');\n  }\n\n  // 作業項目リスト描画\n  function renderWorkItemList() {\n    const itemListEl = container.querySelector('#item-list');\n    if (!itemListEl) return;\n    \n    itemListEl.innerHTML = workItems.map(item => `\n      <label style=\"display: block; font-size: 12px; margin-bottom: 2px;\">\n        <input type=\"checkbox\" name=\"extractItems\" value=\"${item.作業項目ID}\" style=\"accent-color: var(--primary); margin-right: 6px;\">\n        ${item.作業項目名 || ''}\n      </label>\n    `).join('');\n  }\n\n  // 作業場所選択肢描画\n  function renderWorkLocations() {\n    const locationEl = container.querySelector('select[name=\"workLocation\"]');\n    if (!locationEl) return;\n    \n    const locations = [...new Set(workRecords.map(r => r.作業場所).filter(Boolean))];\n    locationEl.innerHTML = '<option value=\"\">全て</option>' + \n      locations.map(loc => `<option value=\"${loc}\">${loc}</option>`).join('');\n  }\n\n  // 作業員選択肢描画\n  function renderWorkerSelect() {\n    const workerEl = container.querySelector('select[name=\"worker\"]');\n    if (!workerEl) return;\n    \n    workerEl.innerHTML = '<option value=\"\">全て</option>' + \n      users.map(user => `<option value=\"${user.ユーザーID}\">${user.氏名 || user.ユーザー名}</option>`).join('');\n  }\n\n  // 作業種別選択肢描画\n  function renderWorkTypeSelect() {\n    const workTypeEl = container.querySelector('select[name=\"workType\"]');\n    if (!workTypeEl) return;\n    \n    const workTypes = [...new Set(workItems.map(item => item.作業種別).filter(Boolean))];\n    workTypeEl.innerHTML = '<option value=\"\">全て</option>' + \n      workTypes.map(type => `<option value=\"${type}\">${type}</option>`).join('');\n  }\n\n  // 条件バリデーション\n  function validateConditions() {\n    const startDate = container.querySelector('input[name=\"startDate\"]')?.value;\n    const endDate = container.querySelector('input[name=\"endDate\"]')?.value;\n\n    if (!startDate || !endDate) {\n      window.aivicNotify?.error('抽出期間を指定してください');\n      return false;\n    }\n\n    if (new Date(startDate) > new Date(endDate)) {\n      window.aivicNotify?.error('開始日は終了日より前の日付を入力してください');\n      return false;\n    }\n\n    return true;\n  }\n\n  // 抽出条件取得\n  function getExtractionConditions() {\n    const startDate = container.querySelector('input[name=\"startDate\"]')?.value;\n    const endDate = container.querySelector('input[name=\"endDate\"]')?.value;\n    const selectedWorkers = Array.from(container.querySelectorAll('input[name=\"workers\"]:checked')).map(cb => cb.value);\n    const selectedItems = Array.from(container.querySelectorAll('input[name=\"extractItems\"]:checked')).map(cb => cb.value);\n    const workLocation = container.querySelector('select[name=\"workLocation\"]')?.value;\n    const worker = container.querySelector('select[name=\"worker\"]')?.value;\n    const workType = container.querySelector('select[name=\"workType\"]')?.value;\n    const excludeAbnormal = container.querySelector('input[name=\"excludeAbnormalValues\"]')?.checked;\n    const includeBreaks = container.querySelector('input[name=\"includeBreakRecords\"]')?.checked;\n    const outputFormat = container.querySelector('select[name=\"outputFormat\"]')?.value;\n\n    return {\n      startDate,\n      endDate,\n      selectedWorkers,\n      selectedItems,\n      workLocation,\n      worker,\n      workType,\n      excludeAbnormal,\n      includeBreaks,\n      outputFormat\n    };\n  }\n\n  // データフィルタリング\n  function filterWorkRecords(conditions) {\n    let filtered = workRecords.filter(record => {\n      const recordDate = new Date(record.作業日時);\n      const start = new Date(conditions.startDate);\n      const end = new Date(conditions.endDate);\n      \n      if (recordDate < start || recordDate > end) return false;\n      \n      if (conditions.selectedWorkers.length > 0 && !conditions.selectedWorkers.includes(record.ユーザーID)) return false;\n      if (conditions.worker && record.ユーザーID !== conditions.worker) return false;\n      if (conditions.workLocation && record.作業場所 !== conditions.workLocation) return false;\n      if (conditions.workType) {\n        const workItem = workItems.find(item => item.作業項目ID === record.作業項目ID);\n        if (!workItem || workItem.作業種別 !== conditions.workType) return false;\n      }\n      \n      return true;\n    });\n\n    // 異常値除外\n    if (conditions.excludeAbnormal && filterAnomalousRecords) {\n      filtered = filterAnomalousRecords(filtered);\n    }\n\n    return filtered;\n  }\n\n  // 中断記録フィルタリング\n  function filterInterruptionRecords(conditions) {\n    if (!conditions.includeBreaks) return [];\n    \n    return interruptionRecords.filter(record => {\n      const recordDate = new Date(record.中断開始時刻);\n      const start = new Date(conditions.startDate);\n      const end = new Date(conditions.endDate);\n      \n      return recordDate >= start && recordDate <= end;\n    });\n  }\n\n  // 抽出結果表示\n  function displayExtractionResults(filteredRecords, interruptionData) {\n    const resultsEl = container.querySelector('.extraction-results');\n    if (!resultsEl) return;\n\n    resultsEl.innerHTML = `\n      <div class=\"result-count\">抽出件数: ${filteredRecords.length}件</div>\n      <div class=\"results-table\">\n        ${filteredRecords.map(record => `\n          <div class=\"result-row\">\n            <span class=\"work-hours-value\">${record.作業時間 || 0}</span>\n            <span>${record.作業内容 || ''}</span>\n            <span>${record.作業日時 || ''}</span>\n          </div>\n        `).join('')}\n      </div>\n      ${interruptionData.length > 0 ? `\n        <div class=\"break-records\">\n          <h3>中断記録</h3>\n          ${interruptionData.map(record => `\n            <div class=\"break-record\">\n              <span>${record.中断理由 || ''}</span>\n              <span>${record.中断時間 || 0}分</span>\n            </div>\n          `).join('')}\n        </div>\n      ` : ''}\n    `;\n    \n    resultsEl.style.display = 'block';\n  }\n\n  // プレビュー表示\n  function displayPreview(conditions) {\n    const previewEl = container.querySelector('.preview-area');\n    if (!previewEl) return;\n\n    const startDateFormatted = new Date(conditions.startDate).toLocaleDateString('ja-JP');\n    const endDateFormatted = new Date(conditions.endDate).toLocaleDateString('ja-JP');\n    const workerName = conditions.worker ? users.find(u => u.ユーザーID === conditions.worker)?.氏名 : '全員';\n\n    previewEl.innerHTML = `\n      <div>期間: ${startDateFormatted}～${endDateFormatted}</div>\n      <div>作業員: ${workerName}</div>\n      <div>作業種別: ${conditions.workType || '全て'}</div>\n      <div>作業場所: ${conditions.workLocation || '全て'}</div>\n    `;\n    previewEl.style.display = 'block';\n  }\n\n  // CSV出力\n  function exportToCsv(data, filename) {\n    const headers = ['作業日時', '作業員', '作業項目', '作業時間', '作業場所'];\n    const csvContent = [\n      headers.join(','),\n      ...data.map(record => [\n        record.作業日時 || '',\n        users.find(u => u.ユーザーID === record.ユーザーID)?.氏名 || '',\n        workItems.find(i => i.作業項目ID === record.作業項目ID)?.作業項目名 || '',\n        record.作業時間 || 0,\n        record.作業場所 || ''\n      ].join(','))\n    ].join('\\n');\n\n    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = filename;\n    link.click();\n  }\n\n  // Excel出力\n  function exportToExcel(data, filename) {\n    // 簡易的なExcel形式（実際にはライブラリが必要）\n    const csvContent = [\n      ['作業日時', '作業員', '作業項目', '作業時間', '作業場所'].join('\\t'),\n      ...data.map(record => [\n        record.作業日時 || '',\n        users.find(u => u.ユーザーID === record.ユーザーID)?.氏名 || '',\n        workItems.find(i => i.作業項目ID === record.作業項目ID)?.作業項目名 || '',\n        record.作業時間 || 0,\n        record.作業場所 || ''\n      ].join('\\t'))\n    ].join('\\n');\n\n    const blob = new Blob([csvContent], { type: 'application/vnd.ms-excel' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = filename;\n    link.click();\n  }\n\n  // イベントハンドラー設定\n  function setupEventHandlers() {\n    // データ抽出ボタン\n    const extractBtn = container.querySelector('button:has-text(\"データ抽出\")') || \n                      Array.from(container.querySelectorAll('button')).find(btn => btn.textContent.includes('データ抽出'));\n    if (extractBtn) {\n      extractBtn.addEventListener('click', () => {\n        if (!validateConditions()) return;\n        \n        const conditions = getExtractionConditions();\n        const filteredRecords = filterWorkRecords(conditions);\n        const interruptionData = filterInterruptionRecords(conditions);\n        \n        displayExtractionResults(filteredRecords, interruptionData);\n      });\n    }\n\n    // 抽出実行ボタン\n    const executeBtn = container.querySelector('button:has-text(\"抽出実行\")') || \n                      Array.from(container.querySelectorAll('button')).find(btn => btn.textContent.includes('抽出実行'));\n    if (executeBtn) {\n      executeBtn.addEventListener('click', () => {\n        if (!validateConditions()) return;\n        \n        const conditions = getExtractionConditions();\n        const filteredRecords = filterWorkRecords(conditions);\n        \n        if (!conditions.outputFormat) {\n          window.aivicNotify?.error('出力形式を選択してください');\n          return;\n        }\n\n        const timestamp = new Date().toISOString().slice(0, 10);\n        const filename = `工数記録_${timestamp}`;\n\n        if (conditions.outputFormat === 'csv') {\n          exportToCsv(filteredRecords, `${filename}.csv`);\n        } else if (conditions.outputFormat === 'excel') {\n          exportToExcel(filteredRecords, `${filename}.xlsx`);\n        }\n      });\n    }\n\n    // プレビューボタン\n    const previewBtn = container.querySelector('button:has-text(\"プレビュー\")') || \n                      Array.from(container.querySelectorAll('button')).find(btn => btn.textContent.includes('プレビュー'));\n    if (previewBtn) {\n      previewBtn.addEventListener('click', () => {\n        if (!validateConditions()) return;\n        \n        const conditions = getExtractionConditions();\n        displayPreview(conditions);\n      });\n    }\n  }\n\n  // 初期化処理\n  function initialize() {\n    renderWorkerList();\n    renderWorkItemList();\n    renderWorkLocations();\n    renderWorkerSelect();\n    renderWorkTypeSelect();\n    setupEventHandlers();\n\n    // 初期日付設定\n    const today = new Date();\n    const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);\n    const startDateInput = container.querySelector('input[name=\"startDate\"]');\n    const endDateInput = container.querySelector('input[name=\"endDate\"]');\n    \n    if (startDateInput) startDateInput.value = firstDay.toISOString().slice(0, 10);\n    if (endDateInput) endDateInput.value = today.toISOString().slice(0, 10);\n  }\n\n  // 初期化実行\n  initialize();\n}";
</script>

  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
