<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --primary: #0ea5e9;
            --primary-hover: #0284c7;
            --primary-light: #e0f2fe;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-sidebar: #f1f5f9;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --text: #1e293b;
            --text-muted: #475569;
            --text-light: #64748b;
            --top-bar-bg: #ffffff;
            --top-bar-border: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: "⏱";
            font-size: 18px;
        }

        .nav-section {
            padding: 16px 0 8px 0;
        }

        .nav-section-title {
            padding: 0 16px 8px 16px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: block;
            padding: 8px 16px;
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: var(--bg-card);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: var(--primary-light);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 500;
        }

        .nav-item.nav-emergency {
            color: var(--danger);
            font-weight: 500;
        }

        .nav-item.nav-emergency:hover {
            background: #fef2f2;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .logout-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.15s ease;
        }

        .logout-link:hover {
            background: var(--border-light);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quick-action-btn {
            padding: 10px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quick-action-btn:hover {
            background: var(--primary-hover);
        }

        .quick-action-btn.secondary {
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .quick-action-btn.secondary:hover {
            background: var(--border-light);
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-height: 400px;
        }

        .nav-group {
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 4px;
            padding-bottom: 4px;
        }

        .nav-group:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
            
            .quick-actions {
                flex-wrap: wrap;
            }
        }

        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
            font-size: 12px;
        }
    </style>

ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentWorkRecord = null;\n  let startTime = null;\n  let pauseStartTime = null;\n  let totalPauseTime = 0;\n  let timerInterval = null;\n  let workStatus = 'waiting'; // waiting, working, paused, completed\n\n  // 現在時刻更新\n  function updateCurrentTime() {\n    const now = new Date();\n    const timeStr = now.toLocaleString('ja-JP', {\n      year: 'numeric',\n      month: '2-digit',\n      day: '2-digit',\n      hour: '2-digit',\n      minute: '2-digit',\n      second: '2-digit'\n    });\n    container.querySelector('#current-time').textContent = timeStr;\n  }\n\n  // 経過時間更新\n  function updateElapsedTime() {\n    if (!startTime) return;\n    \n    const now = new Date();\n    let elapsed = now - startTime - totalPauseTime;\n    \n    if (workStatus === 'paused' && pauseStartTime) {\n      elapsed -= (now - pauseStartTime);\n    }\n    \n    const hours = Math.floor(elapsed / (1000 * 60 * 60));\n    const minutes = Math.floor((elapsed % (1000 * 60 * 60)) / (1000 * 60));\n    const seconds = Math.floor((elapsed % (1000 * 60)) / 1000);\n    \n    const timeStr = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;\n    container.querySelector('#elapsed-time').textContent = timeStr;\n  }\n\n  // 作業状態更新\n  function updateWorkStatus(status) {\n    workStatus = status;\n    const statusElement = container.querySelector('#work-status');\n    const startBtn = container.querySelector('#start-work-btn');\n    const pauseBtn = container.querySelector('#pause-work-btn');\n    const endBtn = container.querySelector('#end-work-btn');\n    \n    switch (status) {\n      case 'waiting':\n        statusElement.textContent = '待機中';\n        startBtn.disabled = false;\n        pauseBtn.disabled = true;\n        endBtn.disabled = true;\n        break;\n      case 'working':\n        statusElement.textContent = '作業中';\n        startBtn.disabled = true;\n        pauseBtn.disabled = false;\n        endBtn.disabled = false;\n        break;\n      case 'paused':\n        statusElement.textContent = '中断中';\n        startBtn.disabled = true;\n        pauseBtn.disabled = true;\n        endBtn.disabled = false;\n        break;\n      case 'completed':\n        statusElement.textContent = '完了';\n        startBtn.disabled = false;\n        pauseBtn.disabled = true;\n        endBtn.disabled = true;\n        break;\n    }\n  }\n\n  // 作業項目マスタ読み込み\n  async function loadWorkItems() {\n    const workItems = await window.aivicApi.list(3); // 作業項目マスタ\n    const select = container.querySelector('#work-item-select');\n    select.innerHTML = '<option value=\"\">選択してください</option>';\n    \n    if (workItems) {\n      workItems\n        .filter(item => item.有効フラグ)\n        .sort((a, b) => (a.表示順序 || 0) - (b.表示順序 || 0))\n        .forEach(item => {\n          const option = document.createElement('option');\n          option.value = item.作業項目ID;\n          option.textContent = `${item.作業項目コード} - ${item.作業項目名}`;\n          select.appendChild(option);\n        });\n    }\n  }\n\n  // 本日の作業履歴表示\n  function renderTodayHistory(records) {\n    const tbody = container.querySelector('#today-history-tbody');\n    const today = new Date().toDateString();\n    \n    const todayRecords = records.filter(record => {\n      const recordDate = new Date(record.作業日).toDateString();\n      return recordDate === today;\n    }).sort((a, b) => new Date(a.作業開始時刻) - new Date(b.作業開始時刻));\n    \n    tbody.innerHTML = todayRecords.map(record => {\n      const startTime = new Date(record.作業開始時刻).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });\n      const endTime = record.作業終了時刻 ? new Date(record.作業終了時刻).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) : '-';\n      const workHours = record.作業時間 ? `${Math.floor(record.作業時間 / 60)}:${(record.作業時間 % 60).toString().padStart(2, '0')}` : '-';\n      \n      return `\n        <tr data-id=\"${record.作業記録ID}\">\n          <td>${startTime}</td>\n          <td>${endTime}</td>\n          <td>${record.作業種別 || ''}</td>\n          <td>${record.作業場所 || ''}</td>\n          <td>${workHours}</td>\n          <td>${record.進捗状況 || ''}</td>\n          <td>\n            <button class=\"action-btn secondary edit-btn\" data-id=\"${record.作業記録ID}\" style=\"font-size: 11px; padding: 4px 8px;\">編集</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // 作業開始\n  async function startWork() {\n    const workItemId = container.querySelector('#work-item-select').value;\n    const workLocation = container.querySelector('#work-location').value.trim();\n    const workContent = container.querySelector('#work-content').value.trim();\n    \n    if (!workItemId) {\n      alert('作業項目を選択してください');\n      return;\n    }\n    \n    if (!workLocation) {\n      alert('作業場所を入力してください');\n      return;\n    }\n    \n    if (!workContent) {\n      alert('作業内容を入力してください');\n      return;\n    }\n    \n    const now = new Date();\n    startTime = now;\n    totalPauseTime = 0;\n    \n    // 作業記録を作成\n    const workRecord = {\n      作業員ID: 'current-user-id', // 実際の実装では認証済みユーザーIDを使用\n      作業日: now.toISOString(),\n      作業開始時刻: now.toISOString(),\n      作業終了時刻: null,\n      作業時間: null,\n      プロジェクト名: 'プロジェクト名', // 実際の実装では選択されたプロジェクト\n      作業場所: workLocation,\n      作業種別: container.querySelector('#work-item-select option:checked').textContent,\n      作業内容: workContent,\n      進捗状況: '作業中',\n      備考: container.querySelector('#work-memo').value.trim(),\n      承認状態: '未承認',\n      承認者ID: null,\n      承認日時: null,\n      作成日時: now.toISOString(),\n      更新日時: now.toISOString(),\n      作成者ID: 'current-user-id'\n    };\n    \n    currentWorkRecord = await window.aivicApi.save(1, workRecord); // 作業記録テーブル\n    if (currentWorkRecord) {\n      updateWorkStatus('working');\n      \n      // タイマー開始\n      timerInterval = setInterval(updateElapsedTime, 1000);\n      \n      // 履歴更新\n      const records = await window.aivicApi.list(1);\n      if (records) renderTodayHistory(records);\n    }\n  }\n\n  // 作業中断\n  function pauseWork() {\n    if (workStatus !== 'working') {\n      alert('作業が開始されていません');\n      return;\n    }\n    \n    container.querySelector('#pause-modal').style.display = 'block';\n  }\n\n  // 中断実行\n  async function executePause() {\n    const reasonCategory = container.querySelector('#pause-reason-category').value;\n    const reasonDetail = container.querySelector('#pause-reason-detail').value.trim();\n    \n    if (!reasonCategory) {\n      alert('中断理由区分を選択してください');\n      return;\n    }\n    \n    if (!reasonDetail) {\n      alert('中断理由を入力してください');\n      return;\n    }\n    \n    const now = new Date();\n    pauseStartTime = now;\n    \n    // 中断記録を作成\n    const pauseRecord = {\n      作業記録ID: currentWorkRecord.作業記録ID,\n      中断開始日時: now.toISOString(),\n      中断終了日時: null,\n      中断理由区分: reasonCategory,\n      中断理由詳細: reasonDetail,\n      中断時間: null,\n      影響度: '中程度',\n      対応状況: '対応中',\n      記録者ID: 'current-user-id',\n      作成日時: now.toISOString(),\n      更新日時: now.toISOString()\n    };\n    \n    const saved = await window.aivicApi.save(2, pauseRecord); // 中断記録テーブル\n    if (saved) {\n      updateWorkStatus('paused');\n      container.querySelector('#pause-modal').style.display = 'none';\n      \n      // フォームクリア\n      container.querySelector('#pause-reason-category').value = '';\n      container.querySelector('#pause-reason-detail').value = '';\n    }\n  }\n\n  // 作業終了\n  async function endWork() {\n    if (workStatus !== 'working' && workStatus !== 'paused') {\n      alert('作業が開始されていません');\n      return;\n    }\n    \n    const now = new Date();\n    \n    // 中断中の場合は中断時間を加算\n    if (workStatus === 'paused' && pauseStartTime) {\n      totalPauseTime += (now - pauseStartTime);\n    }\n    \n    const totalWorkTime = Math.floor((now - startTime - totalPauseTime) / (1000 * 60)); // 分単位\n    \n    // 作業記録を更新\n    const updatedRecord = await window.aivicApi.update(1, currentWorkRecord.作業記録ID, {\n      作業終了時刻: now.toISOString(),\n      作業時間: totalWorkTime,\n      進捗状況: '完了',\n      更新日時: now.toISOString()\n    });\n    \n    if (updatedRecord) {\n      updateWorkStatus('completed');\n      \n      // タイマー停止\n      if (timerInterval) {\n        clearInterval(timerInterval);\n        timerInterval = null;\n      }\n      \n      // リセット\n      startTime = null;\n      pauseStartTime = null;\n      totalPauseTime = 0;\n      currentWorkRecord = null;\n      \n      // 履歴更新\n      const records = await window.aivicApi.list(1);\n      if (records) renderTodayHistory(records);\n      \n      alert(`作業が完了しました。作業時間: ${Math.floor(totalWorkTime / 60)}時間${totalWorkTime % 60}分`);\n    }\n  }\n\n  // 保存\n  async function saveWork() {\n    const workItemId = container.querySelector('#work-item-select').value;\n    const workLocation = container.querySelector('#work-location').value.trim();\n    const workContent = container.querySelector('#work-content').value.trim();\n    const workMemo = container.querySelector('#work-memo').value.trim();\n    \n    if (!workItemId) {\n      alert('作業項目を選択してください');\n      return;\n    }\n    \n    if (!workLocation) {\n      alert('作業場所を入力してください');\n      return;\n    }\n    \n    if (!workContent) {\n      alert('作業内容を入力してください');\n      return;\n    }\n    \n    if (currentWorkRecord) {\n      // 作業中の記録を更新\n      const updated = await window.aivicApi.update(1, currentWorkRecord.作業記録ID, {\n        作業場所: workLocation,\n        作業内容: workContent,\n        備考: workMemo,\n        更新日時: new Date().toISOString()\n      });\n      \n      if (updated) {\n        alert('作業記録を更新しました');\n        const records = await window.aivicApi.list(1);\n        if (records) renderTodayHistory(records);\n      }\n    } else {\n      alert('作業記録を保存するには、まず作業を開始してください');\n    }\n  }\n\n  // キャンセル\n  function cancelWork() {\n    if (currentWorkRecord || workStatus !== 'waiting') {\n      if (!confirm('未保存の変更があります。キャンセルしますか？')) {\n        return;\n      }\n    }\n    \n    // フォームクリア\n    container.querySelector('#work-item-select').value = '';\n    container.querySelector('#work-location').value = '';\n    container.querySelector('#work-content').value = '';\n    container.querySelector('#work-memo').value = '';\n    \n    // 作業中の場合はリセット\n    if (currentWorkRecord) {\n      if (timerInterval) {\n        clearInterval(timerInterval);\n        timerInterval = null;\n      }\n      startTime = null;\n      pauseStartTime = null;\n      totalPauseTime = 0;\n      currentWorkRecord = null;\n      updateWorkStatus('waiting');\n      container.querySelector('#elapsed-time').textContent = '00:00:00';\n    }\n  }\n\n  // 文字数カウンター\n  function setupCharacterCounter(textareaId, counterId) {\n    const textarea = container.querySelector(`#${textareaId}`);\n    const counter = container.querySelector(`#${counterId}`);\n    \n    textarea.addEventListener('input', () => {\n      const length = textarea.value.length;\n      const maxLength = textarea.getAttribute('maxlength') || 500;\n      counter.textContent = `${length}/${maxLength}`;\n    });\n  }\n\n  // 初期化\n  updateCurrentTime();\n  setInterval(updateCurrentTime, 1000);\n  updateWorkStatus('waiting');\n  \n  // 作業項目マスタ読み込み\n  loadWorkItems();\n  \n  // 本日の作業履歴読み込み\n  window.aivicApi.list(1).then(records => {\n    if (records) renderTodayHistory(records);\n  });\n  \n  // 文字数カウンター設定\n  setupCharacterCounter('work-memo', 'memo-counter');\n  setupCharacterCounter('pause-reason-detail', 'pause-reason-counter');\n  \n  // イベントリスナー\n  container.querySelector('#start-work-btn').addEventListener('click', startWork);\n  container.querySelector('#pause-work-btn').addEventListener('click', pauseWork);\n  container.querySelector('#end-work-btn').addEventListener('click', endWork);\n  container.querySelector('#save-work-btn').addEventListener('click', saveWork);\n  container.querySelector('#cancel-work-btn').addEventListener('click', cancelWork);\n  \n  // 中断モーダル\n  container.querySelector('#pause-confirm-btn').addEventListener('click', executePause);\n  container.querySelector('#pause-cancel-btn').addEventListener('click', () => {\n    container.querySelector('#pause-modal').style.display = 'none';\n    container.querySelector('#pause-reason-category').value = '';\n    container.querySelector('#pause-reason-detail').value = '';\n  });\n  \n  // 編集ボタン\n  container.addEventListener('click', async (e) => {\n    const editBtn = e.target.closest('.edit-btn');\n    if (editBtn) {\n      const recordId = editBtn.dataset.id;\n      // 編集機能は別画面で実装される想定\n      alert('編集機能は作業履歴画面で実装されます');\n    }\n  });\n}";

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();
