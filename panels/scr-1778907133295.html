window.AIVIC_TABLES = [{"tableName":"ユーザー","purpose":"現場作業員のアカウント情報と認証情報を管理する","columns":[{"name":"ユーザーID","type":"uuid","required":true,"description":"ユーザーの一意識別子（主キー）"},{"name":"ユーザー名","type":"varchar(100)","required":true,"description":"ログイン用のユーザー名"},{"name":"パスワードハッシュ","type":"varchar(100)","required":true,"description":"ハッシュ化されたパスワード"},{"name":"氏名","type":"varchar(100)","required":true,"description":"作業員の実名"},{"name":"所属部署","type":"varchar(100)","required":false,"description":"作業員が所属する部署名"},{"name":"職種","type":"varchar(100)","required":false,"description":"作業員の職種・役職"},{"name":"権限レベル","type":"varchar(100)","required":true,"description":"システム内での権限（一般作業員、管理者等）"},{"name":"有効フラグ","type":"boolean","required":true,"description":"アカウントの有効/無効状態"},{"name":"最終ログイン日時","type":"timestamp","required":false,"description":"最後にログインした日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者","type":"varchar(100)","required":true,"description":"レコード作成者"}]},{"tableName":"作業記録","purpose":"現場作業員の日々の作業時間と内容を記録し、工数管理と実績分析を行うためのトランザクションテーブル","columns":[{"name":"作業記録ID","type":"uuid","required":true,"description":"作業記録の一意識別子（主キー）"},{"name":"作業員ID","type":"uuid","required":true,"description":"作業を行った作業員のID（ユーザーテーブル外部キー）"},{"name":"作業日","type":"timestamp","required":true,"description":"作業を実施した日付"},{"name":"作業開始時刻","type":"timestamp","required":true,"description":"作業開始の日時"},{"name":"作業終了時刻","type":"timestamp","required":false,"description":"作業終了の日時（作業中の場合はnull）"},{"name":"作業時間","type":"integer","required":false,"description":"実際の作業時間（分単位、終了時に自動計算）"},{"name":"プロジェクト名","type":"varchar(100)","required":true,"description":"作業対象のプロジェクト名"},{"name":"作業場所","type":"varchar(100)","required":true,"description":"作業を実施した現場・場所"},{"name":"作業種別","type":"varchar(100)","required":true,"description":"作業の種類（設置、点検、修理等）"},{"name":"作業内容","type":"text","required":true,"description":"具体的な作業内容の詳細"},{"name":"進捗状況","type":"varchar(100)","required":true,"description":"作業の進捗状態（作業中、完了、中断等）"},{"name":"備考","type":"text","required":false,"description":"特記事項や注意点等の補足情報"},{"name":"承認状態","type":"varchar(100)","required":true,"description":"記録の承認状況（未承認、承認済み、差し戻し）"},{"name":"承認者ID","type":"uuid","required":false,"description":"記録を承認した管理者のID"},{"name":"承認日時","type":"timestamp","required":false,"description":"承認が行われた日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"}]},{"tableName":"中断記録","purpose":"作業中断の発生理由、時間、影響を記録し、作業効率分析と改善に活用する","columns":[{"name":"中断記録ID","type":"uuid","required":true,"description":"中断記録の一意識別子（主キー）"},{"name":"作業記録ID","type":"uuid","required":true,"description":"中断が発生した作業記録への外部キー"},{"name":"中断開始日時","type":"timestamp","required":true,"description":"作業を中断した日時"},{"name":"中断終了日時","type":"timestamp","required":false,"description":"作業を再開した日時"},{"name":"中断理由区分","type":"varchar(100)","required":true,"description":"中断理由の分類（機械故障、材料不足、天候、休憩等）"},{"name":"中断理由詳細","type":"text","required":false,"description":"中断理由の具体的な内容"},{"name":"中断時間","type":"integer","required":false,"description":"中断時間（分）"},{"name":"影響度","type":"varchar(100)","required":false,"description":"作業への影響度（軽微、中程度、重大）"},{"name":"対応状況","type":"varchar(100)","required":true,"description":"中断への対応状況（対応中、解決済み、未対応）"},{"name":"記録者ID","type":"uuid","required":true,"description":"中断を記録した作業員のユーザーID"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]},{"tableName":"作業項目マスタ","purpose":"現場作業員が工数記録時に選択する作業項目の定義と管理を行う","columns":[{"name":"作業項目ID","type":"uuid","required":true,"description":"作業項目の一意識別子（主キー）"},{"name":"作業項目コード","type":"varchar(100)","required":true,"description":"作業項目の業務コード（検索・表示用）"},{"name":"作業項目名","type":"varchar(100)","required":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type":"text","required":false,"description":"管理者による対応内容や備考"},{"name":"検出日時","type":"timestamp","required":true,"description":"異常値が検出された日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]}];
window.AIVIC_PRESET_SEED = {};

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let workState = {\n    isWorking: false,\n    isPaused: false,\n    startTime: null,\n    pauseStartTime: null,\n    totalPauseTime: 0,\n    currentWorkId: null,\n    elapsedInterval: null\n  };\n\n  // 現在時刻更新\n  function updateCurrentTime() {\n    const now = new Date();\n    const timeStr = now.toLocaleString('ja-JP', {\n      year: 'numeric',\n      month: '2-digit',\n      day: '2-digit',\n      hour: '2-digit',\n      minute: '2-digit',\n      second: '2-digit'\n    });\n    container.querySelector('#current-datetime').textContent = timeStr;\n  }\n\n  // 経過時間更新\n  function updateElapsedTime() {\n    if (!workState.isWorking || !workState.startTime) return;\n    \n    const now = new Date();\n    let elapsed = now - workState.startTime - workState.totalPauseTime;\n    \n    if (workState.isPaused && workState.pauseStartTime) {\n      elapsed -= (now - workState.pauseStartTime);\n    }\n    \n    const hours = Math.floor(elapsed / (1000 * 60 * 60));\n    const minutes = Math.floor((elapsed % (1000 * 60 * 60)) / (1000 * 60));\n    const seconds = Math.floor((elapsed % (1000 * 60)) / 1000);\n    \n    const timeStr = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;\n    container.querySelector('#elapsed-time').textContent = timeStr;\n  }\n\n  // エラーメッセージ表示\n  function showError(message) {\n    const errorEl = container.querySelector('#error-message');\n    errorEl.textContent = message;\n    errorEl.classList.remove('hidden');\n    setTimeout(() => errorEl.classList.add('hidden'), 3000);\n  }\n\n  // 作業項目選択肢を読み込み\n  function loadWorkItems() {\n    const workItemsTable = tables.find(t => t.tableName === '作業項目マスタ');\n    if (workItemsTable) {\n      const select = container.querySelector('#work-item-select');\n      select.innerHTML = '<option value=\"\">選択してください</option>';\n      \n      workItemsTable.records\n        .filter(item => item.有効フラグ)\n        .sort((a, b) => (a.表示順序 || 0) - (b.表示順序 || 0))\n        .forEach(item => {\n          const option = document.createElement('option');\n          option.value = item.作業項目ID;\n          option.textContent = `${item.作業項目コード} - ${item.作業項目名}`;\n          select.appendChild(option);\n        });\n    }\n  }\n\n  // 本日の作業履歴を描画\n  function renderTodayHistory(records) {\n    const tbody = container.querySelector('#work-history-tbody');\n    const today = new Date().toISOString().split('T')[0];\n    \n    const todayRecords = records.filter(record => {\n      const recordDate = new Date(record.作業日).toISOString().split('T')[0];\n      return recordDate === today;\n    }).sort((a, b) => new Date(a.作業開始時刻) - new Date(b.作業開始時刻));\n\n    tbody.innerHTML = todayRecords.map(record => {\n      const startTime = new Date(record.作業開始時刻).toLocaleTimeString('ja-JP', {hour: '2-digit', minute: '2-digit'});\n      const endTime = record.作業終了時刻? new Date(record.作業終了時刻).toLocaleTimeString('ja-JP', {hour: '2-digit', minute: '2-digit'}) : '-';\n      const workHours = record.作業時間 ? `${Math.floor(record.作業時間 / 60)}:${(record.作業時間 % 60).toString().padStart(2, '0')}` : '-';\n      \n      return `\n        <tr data-id=\"${record.作業記録ID}\">\n          <td>${startTime}</td>\n          <td>${endTime}</td>\n          <td>${record.プロジェクト名 || '-'}</td>\n          <td>${workHours}</td>\n          <td>\n            <span style=\"padding: 2px 6px; border-radius: 4px; font-size: 11px; background: ${\n              record.進捗状況 === '完了' ? 'var(--primary)' : \n              record.進捗状況 === '作業中' ? '#28a745' : \n              record.進捗状況 === '中断' ? '#ffc107' : '#6c757d'\n            }; color: white;\">${record.進捗状況}</span>\n          </td>\n          <td style=\"max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">${record.作業内容 || record.備考 || '-'}</td>\n          <td>\n            <button class=\"action-btn secondary edit-btn\" data-id=\"${record.作業記録ID}\" style=\"font-size: 11px; padding: 4px 8px;\">編集</button>\n            <button class=\"action-btn secondary delete-btn\" data-id=\"${record.作業記録ID}\" style=\"font-size: 11px; padding: 4px 8px; margin-left: 4px;\">削除</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // 初期データ読み込み\n  loadWorkItems();\n  renderTodayHistory(tables[1]?.records || []);\n\n  // 定期更新開始\n  updateCurrentTime();\n  setInterval(updateCurrentTime, 1000);\n\n  // 文字数カウント\n  const memoTextarea = container.querySelector('#work-memo');\n  const memoCount = container.querySelector('#memo-count');\n  memoTextarea.addEventListener('input', () => {\n    memoCount.textContent = memoTextarea.value.length;\n  });\n\n  // 作業開始ボタン\n  container.querySelector('#start-work-btn').addEventListener('click', () => {\n    const workItemSelect = container.querySelector('#work-item-select');\n    if (!workItemSelect.value) {\n      showError('作業項目を選択してください');\n      return;\n    }\n\n    workState.isWorking = true;\n    workState.isPaused = false;\n    workState.startTime = new Date();\n    workState.totalPauseTime = 0;\n    \n    // ボタン状態更新\n    container.querySelector('#start-work-btn').disabled = true;\n    container.querySelector('#pause-work-btn').disabled = false;\n    container.querySelector('#end-work-btn').disabled = false;\n    \n    // 経過時間更新開始\n    workState.elapsedInterval = setInterval(updateElapsedTime, 1000);\n    updateElapsedTime();\n  });\n\n  // 中断ボタン\n  container.querySelector('#pause-work-btn').addEventListener('click', () => {\n    if (!workState.isWorking) {\n      showError('作業が開始されていません');\n      return;\n    }\n    \n    container.querySelector('#pause-reason-area').classList.remove('hidden');\n  });\n\n  // 中断確定ボタン\n  container.querySelector('#confirm-pause-btn').addEventListener('click', () => {\n    const pauseReason = container.querySelector('#pause-reason').value.trim();\n    if (!pauseReason) {\n      showError('中断理由を入力してください');\n      return;\n    }\n\n    workState.isPaused = true;\n    workState.pauseStartTime = new Date();\n    \n    container.querySelector('#pause-reason-area').classList.add('hidden');\n    container.querySelector('#pause-reason').value = '';\n    container.querySelector('#pause-work-btn').textContent = '再開';\n    container.querySelector('#pause-work-btn').onclick = () => {\n      // 再開処理\n      if (workState.pauseStartTime) {\n        workState.totalPauseTime += new Date() - workState.pauseStartTime;\n      }\n      workState.isPaused = false;\n      workState.pauseStartTime = null;\n      container.querySelector('#pause-work-btn').textContent = '中断';\n      container.querySelector('#pause-work-btn').onclick = null;\n      container.querySelector('#pause-work-btn').addEventListener('click', arguments.callee.caller);\n    };\n  });\n\n  // 中断キャンセルボタン\n  container.querySelector('#cancel-pause-btn').addEventListener('click', () => {\n    container.querySelector('#pause-reason-area').classList.add('hidden');\n    container.querySelector('#pause-reason').value = '';\n  });\n\n  // 作業終了ボタン\n  container.querySelector('#end-work-btn').addEventListener('click', () => {\n    if (!workState.isWorking) {\n      showError('作業が開始されていません');\n      return;\n    }\n\n    // 中断中の場合は中断時間を追加\n    if (workState.isPaused && workState.pauseStartTime) {\n      workState.totalPauseTime += new Date() - workState.pauseStartTime;\n    }\n\n    const endTime = new Date();\n    const totalWorkTime = Math.floor((endTime - workState.startTime - workState.totalPauseTime) / (1000 * 60));\n\n    // 作業記録を保存\n    const workItemSelect = container.querySelector('#work-item-select');\n    const selectedOption = workItemSelect.options[workItemSelect.selectedIndex];\n    const workItemName = selectedOption ? selectedOption.textContent.split(' - ')[1] : '';\n\n    const workRecord = {\n      作業員ID: 'current-user-id', // 実際の実装では現在のユーザーIDを使用\n      作業日: workState.startTime.toISOString(),\n      作業開始時刻: workState.startTime.toISOString(),\n      作業終了時刻: endTime.toISOString(),\n      作業時間: totalWorkTime,\n      プロジェクト名: workItemName,\n      作業場所: '現場A', // 実際の実装では選択可能にする\n      作業種別: '一般作業',\n      作業内容: container.querySelector('#work-memo').value,\n      進捗状況: '完了',\n      備考: '',\n      承認状態: '未承認',\n      作成者ID: 'current-user-id'\n    };\n\n    window.aivicApi.save(1, workRecord).then(saved => {\n      if (saved) {\n        // 状態リセット\n        workState.isWorking = false;\n        workState.isPaused = false;\n        workState.startTime = null;\n        workState.pauseStartTime = null;\n        workState.totalPauseTime = 0;\n        \n        if (workState.elapsedInterval) {\n          clearInterval(workState.elapsedInterval);\n          workState.elapsedInterval = null;\n        }\n\n        // UI リセット\n        container.querySelector('#start-work-btn').disabled = false;\n        container.querySelector('#pause-work-btn').disabled = true;\n        container.querySelector('#end-work-btn').disabled = true;\n        container.querySelector('#elapsed-time').textContent = '00:00:00';\n        container.querySelector('#work-memo').value = '';\n        container.querySelector('#memo-count').textContent = '0';\n        container.querySelector('#work-item-select').value = '';\n\n        // 履歴更新\n        window.aivicApi.list(1).then(records => {\n          if (records) renderTodayHistory(records);\n        });\n      }\n    });\n  });\n\n  // 保存ボタン\n  container.querySelector('#save-work-btn').addEventListener('click', () => {\n    const workItemSelect = container.querySelector('#work-item-select');\n    const memo = container.querySelector('#work-memo').value.trim();\n\n    if (!workItemSelect.value && !memo) {\n      showError('作業項目または作業メモを入力してください');\n      return;\n    }\n\n    // 手動記録として保存\n    const selectedOption = workItemSelect.options[workItemSelect.selectedIndex];\n    const workItemName = selectedOption ? selectedOption.textContent.split(' - ')[1] : '';\n\n    const workRecord = {\n      作業員ID: 'current-user-id',\n      作業日: new Date().toISOString(),\n      作業開始時刻: new Date().toISOString(),\n      作業終了時刻: null,\n      作業時間: null,\n      プロジェクト名: workItemName,\n      作業場所: '現場A',\n      作業種別: '一般作業',\n      作業内容: memo,\n      進捗状況: '記録のみ',\n      備考: '手動記録',\n      承認状態: '未承認',\n      作成者ID: 'current-user-id'\n    };\n\n    window.aivicApi.save(1, workRecord).then(saved => {\n      if (saved) {\n        container.querySelector('#work-memo').value = '';\n        container.querySelector('#memo-count').textContent = '0';\n        container.querySelector('#work-item-select').value = '';\n        \n        window.aivicApi.list(1).then(records => {\n          if (records) renderTodayHistory(records);\n        });\n      }\n    });\n  });\n\n  // キャンセルボタン\n  container.querySelector('#cancel-work-btn').addEventListener('click', () => {\n    if (workState.isWorking) {\n      if (!confirm('作業中です。キャンセルしますか？未保存のデータは失われます。')) {\n        return;\n      }\n      \n      // 作業状態リセット\n      workState.isWorking = false;\n      workState.isPaused = false;\n      workState.startTime = null;\n      workState.pauseStartTime = null;\n      workState.totalPauseTime = 0;\n      \n      if (workState.elapsedInterval) {\n        clearInterval(workState.elapsedInterval);\n        workState.elapsedInterval = null;\n      }\n\n      // ボタン状態リセット\n      container.querySelector('#start-work-btn').disabled = false;\n      container.querySelector('#pause-work-btn').disabled = true;\n      container.querySelector('#end-work-btn').disabled = true;\n      container.querySelector('#elapsed-time').textContent = '00:00:00';\n    }\n\n    // フォームクリア\n    container.querySelector('#work-memo').value = '';\n    container.querySelector('#memo-count').textContent = '0';\n    container.querySelector('#work-item-select').value = '';\n    container.querySelector('#pause-reason-area').classList.add('hidden');\n  });\n\n  // 行レベル操作（削除・編集）\n  container.addEventListener('click', async (e) => {\n    const deleteBtn = e.target.closest('.delete-btn');\n    const editBtn = e.target.closest('.edit-btn');\n\n    if (deleteBtn) {\n      if (!confirm('この作業記録を削除しますか？')) return;\n      \n      const success = await window.aivicApi.delete(1, deleteBtn.dataset.id);\n      if (success) {\n        const records = await window.aivicApi.list(1);\n        if (records) renderTodayHistory(records);\n      }\n    }\n\n    if (editBtn) {\n      // 編集機能は簡略化（実際の実装では編集フォームを表示）\n      alert('編集機能は作業履歴一覧画面で利用できます');\n    }\n  });\n}";
</script>

        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
