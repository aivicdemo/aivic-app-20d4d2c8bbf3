<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工数記録システム</title>
    <style>
        :root {
            --primary: #cc1f1f;
            --primary-hover: #a61a1a;
            --bg-main: #0d0d0d;
            --bg-card: #1a1010;
            --bg-sidebar: #151111;
            --border: #331a1a;
            --text: #e6e6e6;
            --text-muted: #999999;
            --top-bar-bg: #1f1515;
            --top-bar-border: #2d1a1a;
            --warning: #ff6b35;
            --error: #ff3333;
            --success: #28a745;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: "⚠";
            font-size: 18px;
        }

        .nav-section {
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }

        .nav-section:last-child {
            border-bottom: none;
            flex: 1;
        }

        .nav-title {
            padding: 0 16px 8px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: block;
            padding: 8px 16px;
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: rgba(204, 31, 31, 0.1);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: rgba(204, 31, 31, 0.15);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            margin-left: 220px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
        }

        .current-time {
            font-size: 12px;
            font-weight: 500;
            color: var(--primary);
            font-family: 'Courier New', monospace;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text);
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .user-menu:hover {
            background: var(--bg-sidebar);
            border-color: var(--primary);
        }

        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            min-height: calc(100vh - 132px);
        }

        .emergency-banner {
            background: linear-gradient(135deg, var(--error), var(--warning));
            color: white;
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            animation: flash 3s infinite;
        }

        @keyframes flash {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.7; }
        }

        .quick-actions {
            padding: 12px 16px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }

        .quick-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            margin-right: 8px;
            transition: all 0.15s ease;
        }

        .quick-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .quick-btn.secondary {
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
        }

        .quick-btn.secondary:hover {
            background: var(--border);
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .content-area {
                padding: 12px;
            }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(13, 13, 13, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentWorkRecord = null;\n  let startTime = null;\n  let elapsedTimer = null;\n  let pauseStartTime = null;\n  let totalPauseTime = 0;\n\n  // 作業項目マスタのテーブルインデックス\n  const WORK_ITEMS_TABLE = 3;\n  const WORK_RECORDS_TABLE = 1;\n  const PAUSE_RECORDS_TABLE = 2;\n\n  // DOM要素の取得\n  const workItemSelect = container.querySelector('#work-item-select');\n  const workLocationInput = container.querySelector('#work-location');\n  const workContentTextarea = container.querySelector('#work-content');\n  const workMemoTextarea = container.querySelector('#work-memo');\n  const memoCountSpan = container.querySelector('#memo-count');\n  const startWorkBtn = container.querySelector('#start-work-btn');\n  const pauseWorkBtn = container.querySelector('#pause-work-btn');\n  const endWorkBtn = container.querySelector('#end-work-btn');\n  const saveWorkBtn = container.querySelector('#save-work-btn');\n  const cancelWorkBtn = container.querySelector('#cancel-work-btn');\n  const workStatusDiv = container.querySelector('#work-status');\n  const elapsedTimeDiv = container.querySelector('#elapsed-time');\n  const currentTimeSpan = container.querySelector('#current-time');\n  const todayWorkListDiv = container.querySelector('#today-work-list');\n  const errorMessageDiv = container.querySelector('#error-message');\n  const pauseReasonSection = container.querySelector('#pause-reason-section');\n  const pauseReasonSelect = container.querySelector('#pause-reason-select');\n  const pauseReasonDetail = container.querySelector('#pause-reason-detail');\n  const confirmPauseBtn = container.querySelector('#confirm-pause-btn');\n  const cancelPauseBtn = container.querySelector('#cancel-pause-btn');\n\n  // エラーメッセージ表示\n  function showError(message) {\n    errorMessageDiv.textContent = message;\n    errorMessageDiv.style.display = 'block';\n    setTimeout(() => {\n      errorMessageDiv.style.display = 'none';\n    }, 5000);\n  }\n\n  // 現在時刻の更新\n  function updateCurrentTime() {\n    const now = new Date();\n    currentTimeSpan.textContent = now.toLocaleString('ja-JP');\n  }\n\n  // 経過時間の更新\n  function updateElapsedTime() {\n    if (!startTime) return;\n    \n    const now = new Date();\n    let elapsed = now - startTime - totalPauseTime;\n    \n    if (pauseStartTime) {\n      elapsed -= (now - pauseStartTime);\n    }\n    \n    const hours = Math.floor(elapsed / (1000 * 60 * 60));\n    const minutes = Math.floor((elapsed % (1000 * 60 * 60)) / (1000 * 60));\n    const seconds = Math.floor((elapsed % (1000 * 60)) / 1000);\n    \n    elapsedTimeDiv.textContent = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;\n  }\n\n  // 作業項目の読み込み\n  async function loadWorkItems() {\n    try {\n      const workItems = await window.aivicApi.list(WORK_ITEMS_TABLE);\n      if (workItems) {\n        workItemSelect.innerHTML = '<option value=\"\">選択してください</option>';\n        workItems\n          .filter(item => item.有効フラグ)\n          .sort((a, b) => (a.表示順序 || 0) - (b.表示順序 || 0))\n          .forEach(item => {\n            const option = document.createElement('option');\n            option.value = item.id;\n            option.textContent = `${item.作業項目コード} - ${item.作業項目名}`;\n            workItemSelect.appendChild(option);\n          });\n      }\n    } catch (error) {\n      console.error('作業項目の読み込みに失敗しました:', error);\n    }\n  }\n\n  // 本日の作業履歴の読み込み\n  async function loadTodayWorkHistory() {\n    try {\n      const workRecords = await window.aivicApi.list(WORK_RECORDS_TABLE);\n      if (workRecords) {\n        const today = new Date().toDateString();\n        const todayRecords = workRecords.filter(record => {\n          const recordDate = new Date(record.作業日).toDateString();\n          return recordDate === today;\n        }).sort((a, b) => new Date(a.作業開始時刻) - new Date(b.作業開始時刻));\n\n        if (todayRecords.length === 0) {\n          todayWorkListDiv.innerHTML = '<div style=\"font-size: 12px; color: var(--text-muted); text-align: center; padding: 20px;\">作業履歴がありません</div>';\n        } else {\n          todayWorkListDiv.innerHTML = todayRecords.map(record => {\n            const startTime = new Date(record.作業開始時刻).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });\n            const endTime = record.作業終了時刻? new Date(record.作業終了時刻).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) : '作業中';\n            const workTime = record.作業時間 ? `${Math.floor(record.作業時間 / 60)}:${(record.作業時間 % 60).toString().padStart(2, '0')}` : '-';\n            \n            return `\n              <div style=\"padding: 8px; margin-bottom: 8px; background: rgba(255,255,255,0.02); border-radius: 4px; border-left: 3px solid var(--primary);\">\n                <div style=\"font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 4px;\">${record.作業種別}</div>\n                <div style=\"font-size: 11px; color: var(--text-muted); margin-bottom: 2px;\">${startTime} - ${endTime}</div>\n                <div style=\"font-size: 11px; color: var(--text-muted);\">工数: ${workTime}</div>\n              </div>\n            `;\n          }).join('');\n        }\n      }\n    } catch (error) {\n      console.error('作業履歴の読み込みに失敗しました:', error);\n    }\n  }\n\n  // 作業開始\n  async function startWork() {\n    if (!workItemSelect.value) {\n      showError('作業項目を選択してください');\n      return;\n    }\n\n    if (!workLocationInput.value.trim()) {\n      showError('作業場所を入力してください');\n      return;\n    }\n\n    if (!workContentTextarea.value.trim()) {\n      showError('作業内容を入力してください');\n      return;\n    }\n\n    try {\n      startTime = new Date();\n      totalPauseTime = 0;\n      pauseStartTime = null;\n\n      const workRecord = {\n        作業員ID: 'current-user-id', // 実際の実装では認証されたユーザーIDを使用\n        作業日: startTime.toISOString(),\n        作業開始時刻: startTime.toISOString(),\n        作業終了時刻: null,\n        作業時間: null,\n        プロジェクト名: 'プロジェクト名', // 実際の実装では選択されたプロジェクト\n        作業場所: workLocationInput.value.trim(),\n        作業種別: workItemSelect.options[workItemSelect.selectedIndex].text.split(' - ')[1] || '',\n        作業内容: workContentTextarea.value.trim(),\n        進捗状況: '作業中',\n        備考: workMemoTextarea.value.trim(),\n        承認状態: '未承認',\n        承認者ID: null,\n        承認日時: null,\n        作成日時: startTime.toISOString(),\n        更新日時: startTime.toISOString(),\n        作成者ID: 'current-user-id'\n      };\n\n      currentWorkRecord = await window.aivicApi.save(WORK_RECORDS_TABLE, workRecord);\n      \n      if (currentWorkRecord) {\n        workStatusDiv.textContent = '作業中';\n        workStatusDiv.style.background = 'rgba(0,170,0,0.2)';\n        workStatusDiv.style.color = '#00aa00';\n        \n        startWorkBtn.disabled = true;\n        pauseWorkBtn.disabled = false;\n        endWorkBtn.disabled = false;\n\n        elapsedTimer = setInterval(updateElapsedTime, 1000);\n        updateElapsedTime();\n\n        await loadTodayWorkHistory();\n      }\n    } catch (error) {\n      showError('作業開始に失敗しました');\n      console.error('作業開始エラー:', error);\n    }\n  }\n\n  // 作業中断\n  function pauseWork() {\n    if (!currentWorkRecord) {\n      showError('作業が開始されていません');\n      return;\n    }\n\n    pauseReasonSection.style.display = 'block';\n  }\n\n  // 中断確定\n  async function confirmPause() {\n    if (!pauseReasonSelect.value) {\n      showError('中断理由を選択してください');\n      return;\n    }\n\n    try {\n      pauseStartTime = new Date();\n\n      const pauseRecord = {\n        作業記録ID: currentWorkRecord.id,\n        中断開始日時: pauseStartTime.toISOString(),\n        中断終了日時: null,\n        中断理由区分: pauseReasonSelect.value,\n        中断理由詳細: pauseReasonDetail.value.trim(),\n        中断時間: null,\n        影響度: '中程度',\n        対応状況: '対応中',\n        記録者ID: 'current-user-id',\n        作成日時: pauseStartTime.toISOString(),\n        更新日時: pauseStartTime.toISOString()\n      };\n\n      await window.aivicApi.save(PAUSE_RECORDS_TABLE, pauseRecord);\n\n      workStatusDiv.textContent = '中断中';\n      workStatusDiv.style.background = 'rgba(255,106,0,0.2)';\n      workStatusDiv.style.color = '#ff6a00';\n\n      pauseWorkBtn.textContent = '再開';\n      pauseReasonSection.style.display = 'none';\n      pauseReasonSelect.value = '';\n      pauseReasonDetail.value = '';\n\n    } catch (error) {\n      showError('中断記録に失敗しました');\n      console.error('中断記録エラー:', error);\n    }\n  }\n\n  // 中断キャンセル\n  function cancelPause() {\n    pauseReasonSection.style.display = 'none';\n    pauseReasonSelect.value = '';\n    pauseReasonDetail.value = '';\n  }\n\n  // 作業再開\n  function resumeWork() {\n    if (pauseStartTime) {\n      totalPauseTime += new Date() - pauseStartTime;\n      pauseStartTime = null;\n    }\n\n    workStatusDiv.textContent = '作業中';\n    workStatusDiv.style.background = 'rgba(0,170,0,0.2)';\n    workStatusDiv.style.color = '#00aa00';\n\n    pauseWorkBtn.textContent = '中断';\n  }\n\n  // 作業終了\n  async function endWork() {\n    if (!currentWorkRecord) {\n      showError('作業が開始されていません');\n      return;\n    }\n\n    try {\n      const endTime = new Date();\n      \n      if (pauseStartTime) {\n        totalPauseTime += endTime - pauseStartTime;\n        pauseStartTime = null;\n      }\n\n      const totalWorkTime = Math.floor((endTime - startTime - totalPauseTime) / (1000 * 60));\n\n      const updatedRecord = {\n        作業終了時刻: endTime.toISOString(),\n        作業時間: totalWorkTime,\n        進捗状況: '完了',\n        備考: workMemoTextarea.value.trim(),\n        更新日時: endTime.toISOString()\n      };\n\n      await window.aivicApi.update(WORK_RECORDS_TABLE, currentWorkRecord.id, updatedRecord);\n\n      // 状態リセット\n      currentWorkRecord = null;\n      startTime = null;\n      totalPauseTime = 0;\n      clearInterval(elapsedTimer);\n\n      workStatusDiv.textContent = '待機中';\n      workStatusDiv.style.background = 'rgba(128,128,128,0.2)';\n      workStatusDiv.style.color = 'var(--text)';\n     <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
