ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type":"text","required":false,"description":"管理者による対応内容や備考"},{"name":"検出日時","type":"timestamp","required":true,"description":"異常値が検出された日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentWorkRecord = null;\n  let startTime = null;\n  let elapsedTimer = null;\n  let isPaused = false;\n  let pauseStartTime = null;\n  let totalPauseTime = 0;\n  let hasUnsavedChanges = false;\n\n  // DOM要素の取得\n  const workItemSelect = container.querySelector('#work-item-select');\n  const startBtn = container.querySelector('#start-btn');\n  const endBtn = container.querySelector('#end-btn');\n  const pauseBtn = container.querySelector('#pause-btn');\n  const saveBtn = container.querySelector('#save-btn');\n  const cancelBtn = container.querySelector('#cancel-btn');\n  const elapsedTimeDisplay = container.querySelector('#elapsed-time');\n  const currentDatetime = container.querySelector('#current-datetime');\n  const workMemo = container.querySelector('#work-memo');\n  const pauseReason = container.querySelector('#pause-reason');\n  const pauseReasonSection = container.querySelector('#pause-reason-section');\n  const confirmPauseBtn = container.querySelector('#confirm-pause-btn');\n  const cancelPauseBtn = container.querySelector('#cancel-pause-button');\n  const historyTbody = container.querySelector('#history-tbody');\n  const errorMessage = container.querySelector('#error-message');\n  const workMemoCount = container.querySelector('#work-memo-count');\n  const pauseReasonCount = container.querySelector('#pause-reason-count');\n\n  // 作業項目マスタの読み込み\n  function loadWorkItems() {\n    window.aivicApi.list(3).then(items => {\n      if (items) {\n        workItemSelect.innerHTML = '<option value=\"\">選択してください</option>';\n        items.filter(item => item.有効フラグ).forEach(item => {\n          const option = document.createElement('option');\n          option.value = item.作業項目ID;\n          option.textContent = `${item.作業項目コード} - ${item.作業項目名}`;\n          workItemSelect.appendChild(option);\n        });\n        updateStartButtonState();\n      }\n    });\n  }\n\n  // 本日の作業履歴を描画\n  function renderTodayHistory(records) {\n    const today = new Date().toISOString().split('T')[0];\n    const todayRecords = records.filter(r => r.作業日 && r.作業日.startsWith(today));\n    \n    historyTbody.innerHTML = todayRecords.map(record => {\n      const startTime = record.作業開始時刻 ? new Date(record.作業開始時刻).toLocaleTimeString('ja-JP', {hour: '2-digit', minute: '2-digit'}) : '-';\n      const endTime = record.作業終了時刻 ? new Date(record.作業終了時刻).toLocaleTimeString('ja-JP', {hour: '2-digit', minute: '2-digit'}) : '-';\n      const workTime = record.作業時間 ? `${Math.floor(record.作業時間 / 60)}:${String(record.作業時間 % 60).padStart(2, '0')}` : '-';\n      \n      return `\n        <tr data-id=\"${record.作業記録ID}\">\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${startTime}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${endTime}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${record.作業種別 || '-'}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${workTime}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${record.進捗状況 || '-'}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            <button class=\"action-btn secondary delete-btn\" data-id=\"${record.作業記録ID}\">削除</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // 現在日時の更新\n  function updateCurrentTime() {\n    const now = new Date();\n    currentDatetime.textContent = now.toLocaleString('ja-JP');\n  }\n\n  // 経過時間の更新\n  function updateElapsedTime() {\n    if (!startTime) return;\n    \n    const now = new Date();\n    let elapsed = now - startTime;\n    \n    if (isPaused && pauseStartTime) {\n      elapsed -= (now - pauseStartTime);\n    }\n    elapsed -= totalPauseTime;\n    \n    const hours = Math.floor(elapsed / (1000 * 60 * 60));\n    const minutes = Math.floor((elapsed % (1000 * 60 * 60)) / (1000 * 60));\n    const seconds = Math.floor((elapsed % (1000 * 60)) / 1000);\n    \n    elapsedTimeDisplay.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;\n  }\n\n  // 開始ボタンの状態更新\n  function updateStartButtonState() {\n    startBtn.disabled = !workItemSelect.value || currentWorkRecord !== null;\n  }\n\n  // エラーメッセージの表示\n  function showError(message) {\n    errorMessage.textContent = message;\n    errorMessage.style.display = 'block';\n    setTimeout(() => {\n      errorMessage.style.display = 'none';\n    }, 5000);\n  }\n\n  // 文字数カウント更新\n  function updateCharCount(textarea, countElement) {\n    countElement.textContent = textarea.value.length;\n  }\n\n  // 未保存変更の検知\n  function markUnsaved() {\n    hasUnsavedChanges = true;\n  }\n\n  // 作業開始\n  startBtn.addEventListener('click', () => {\n    if (!workItemSelect.value) {\n      showError('作業項目を選択してください');\n      return;\n    }\n\n    startTime = new Date();\n    totalPauseTime = 0;\n    isPaused = false;\n    pauseStartTime = null;\n    \n    currentWorkRecord = {\n      作業員ID: 'current-user-id', // 実際の実装では認証済みユーザーIDを使用\n      作業日: startTime.toISOString(),\n      作業開始時刻: startTime.toISOString(),\n      作業種別: workItemSelect.options[workItemSelect.selectedIndex].text,\n      進捗状況: '作業中',\n      承認状態: '未承認'\n    };\n\n    startBtn.disabled = true;\n    endBtn.disabled = false;\n    pauseBtn.disabled = false;\n    workItemSelect.disabled = true;\n\n    elapsedTimer = setInterval(updateElapsedTime, 1000);\n    updateElapsedTime();\n    markUnsaved();\n  });\n\n  // 作業終了\n  endBtn.addEventListener('click', () => {\n    if (!currentWorkRecord) {\n      showError('作業が開始されていません');\n      return;\n    }\n\n    if (isPaused) {\n      showError('作業が中断中です。先に再開してください');\n      return;\n    }\n\n    const endTime = new Date();\n    const workTimeMinutes = Math.floor((endTime - startTime - totalPauseTime) / (1000 * 60));\n    \n    currentWorkRecord.作業終了時刻 = endTime.toISOString();\n    currentWorkRecord.作業時間 = workTimeMinutes;\n    currentWorkRecord.進捗状況 = '完了';\n    currentWorkRecord.作業内容 = workMemo.value;\n\n    clearInterval(elapsedTimer);\n    \n    startBtn.disabled = false;\n    endBtn.disabled = true;\n    pauseBtn.disabled = true;\n    saveBtn.disabled = false;\n    workItemSelect.disabled = false;\n    \n    updateStartButtonState();\n  });\n\n  // 中断\n  pauseBtn.addEventListener('click', () => {\n    if (!currentWorkRecord) {\n      showError('作業が開始されていません');\n      return;\n    }\n\n    if (isPaused) {\n      // 再開\n      const now = new Date();\n      totalPauseTime += (now - pauseStartTime);\n      isPaused = false;\n      pauseStartTime = null;\n      pauseBtn.textContent = '中断';\n      currentWorkRecord.進捗状況 = '作業中';\n    } else {\n      // 中断理由入力画面を表示\n      pauseReasonSection.style.display = 'block';\n      pauseReason.value = '';\n      updateCharCount(pauseReason, pauseReasonCount);\n    }\n  });\n\n  // 中断確定\n  confirmPauseBtn.addEventListener('click', () => {\n    if (!pauseReason.value.trim()) {\n      showError('中断理由を入力してください');\n      return;\n    }\n\n    pauseStartTime = new Date();\n    isPaused = true;\n    pauseBtn.textContent = '再開';\n    currentWorkRecord.進捗状況 = '中断';\n    \n    // 中断記録を保存\n    const pauseRecord = {\n      作業記録ID: currentWorkRecord.作業記録ID || 'temp-id',\n      中断開始日時: pauseStartTime.toISOString(),\n      中断理由区分: '作業中断',\n      中断理由詳細: pauseReason.value,\n      対応状況: '対応中',\n      記録者ID: 'current-user-id'\n    };\n\n    window.aivicApi.save(2, pauseRecord);\n    \n    pauseReasonSection.style.display = 'none';\n    markUnsaved();\n  });\n\n  // 中断キャンセル\n  cancelPauseBtn.addEventListener('click', () => {\n    pauseReasonSection.style.display = 'none';\n  });\n\n  // 保存\n  saveBtn.addEventListener('click', async () => {\n    if (!currentWorkRecord) {\n      showError('保存する作業記録がありません');\n      return;\n    }\n\n    const saved = await window.aivicApi.save(1, currentWorkRecord);\n    if (saved) {\n      currentWorkRecord = null;\n      startTime = null;\n      hasUnsavedChanges = false;\n      \n      // UI リセット\n      workItemSelect.value = '';\n      workMemo.value = '';\n      elapsedTimeDisplay.textContent = '00:00:00';\n      \n      startBtn.disabled = false;\n      endBtn.disabled = true;\n      pauseBtn.disabled = true;\n      saveBtn.disabled = true;\n      workItemSelect.disabled = false;\n      pauseBtn.textContent = '中断';\n      \n      updateStartButtonState();\n      \n      // 履歴を再読み込み\n      const records = await window.aivicApi.list(1);\n      if (records) renderTodayHistory(records);\n    }\n  });\n\n  // キャンセル\n  cancelBtn.addEventListener('click', () => {\n    if (hasUnsavedChanges && !confirm('未保存の変更があります。破棄してもよろしいですか？')) {\n      return;\n    }\n\n    // 作業中の場合は停止\n    if (elapsedTimer) {\n      clearInterval(elapsedTimer);\n    }\n\n    // 状態をリセット\n    currentWorkRecord = null;\n    startTime = null;\n    isPaused = false;\n    pauseStartTime = null;\n    totalPauseTime = 0;\n    hasUnsavedChanges = false;\n\n    // UI リセット\n    workItemSelect.value = '';\n    workMemo.value = '';\n    pauseReason.value = '';\n    elapsedTimeDisplay.textContent = '00:00:00';\n    pauseReasonSection.style.display = 'none';\n    \n    startBtn.disabled = false;\n    endBtn.disabled = true;\n    pauseBtn.disabled = true;\n    saveBtn.disabled = true;\n    workItemSelect.disabled = false;\n    pauseBtn.textContent = '中断';\n    \n    updateStartButtonState();\n    updateCharCount(workMemo, workMemoCount);\n    updateCharCount(pauseReason, pauseReasonCount);\n  });\n\n  // 作業項目選択時\n  workItemSelect.addEventListener('change', () => {\n    updateStartButtonState();\n    markUnsaved();\n  });\n\n  // 文字数カウント\n  workMemo.addEventListener('input', () => {\n    updateCharCount(workMemo, workMemoCount);\n    markUnsaved();\n  });\n\n  pauseReason.addEventListener('input', () => {\n    updateCharCount(pauseReason, pauseReasonCount);\n  });\n\n  // 削除ボタンのイベントデリゲーション\n  container.addEventListener('click', async (e) => {\n    const deleteBtn = e.target.closest('.delete-btn');\n    if (deleteBtn) {\n      if (!confirm('この作業記録を削除しますか？')) return;\n      \n      await window.aivicApi.delete(1, deleteBtn.dataset.id);\n      const records = await window.aivicApi.list(1);\n      if (records) renderTodayHistory(records);\n    }\n  });\n\n  // 初期化\n  loadWorkItems();\n  updateCurrentTime();\n  setInterval(updateCurrentTime, 1000);\n\n  // 初期データの読み込みと描画\n  window.aivicApi.list(1).then(records => {\n    if (records) renderTodayHistory(records);\n  });\n\n  updateCharCount(workMemo, workMemoCount);\n  updateCharCount(pauseReason, pauseReasonCount);\n}";
</script>

    function ensureContainer() {

      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");

      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }

      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },

      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
</body>
</html>
