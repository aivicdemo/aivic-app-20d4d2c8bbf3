ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentWorkRecord = null;\n  let startTime = null;\n  let elapsedTimer = null;\n  let pauseStartTime = null;\n  let totalPauseTime = 0;\n  let workState = 'stopped'; // 'stopped', 'working', 'paused'\n\n  // DOM要素の取得\n  const workerNameEl = container.querySelector('#worker-name');\n  const currentDatetimeEl = container.querySelector('#current-datetime');\n  const workItemSelect = container.querySelector('#work-item-select');\n  const elapsedTimeEl = container.querySelector('#elapsed-time');\n  const startBtn = container.querySelector('#start-btn');\n  const pauseBtn = container.querySelector('#pause-btn');\n  const endBtn = container.querySelector('#end-btn');\n  const pauseReasonSection = container.querySelector('#pause-reason-section');\n  const pauseReasonInput = container.querySelector('#pause-reason');\n  const confirmPauseBtn = container.querySelector('#confirm-pause-btn');\n  const cancelPauseBtn = container.querySelector('#cancel-pause-btn');\n  const workMemoInput = container.querySelector('#work-memo');\n  const memoCounter = container.querySelector('#memo-counter');\n  const historyTbody = container.querySelector('#history-tbody');\n  const saveBtn = container.querySelector('#save-btn');\n  const cancelBtn = container.querySelector('#cancel-btn');\n  const errorMessage = container.querySelector('#error-message');\n\n  // エラー表示関数\n  function showError(message) {\n    errorMessage.textContent = message;\n    errorMessage.style.display = 'block';\n    setTimeout(() => {\n      errorMessage.style.display = 'none';\n    }, 5000);\n  }\n\n  // 現在日時更新\n  function updateCurrentDateTime() {\n    const now = new Date();\n    currentDatetimeEl.textContent = now.toLocaleString('ja-JP');\n  }\n\n  // 経過時間更新\n  function updateElapsedTime() {\n    if (!startTime) return;\n    \n    const now = new Date();\n    let elapsed = now - startTime - totalPauseTime;\n    \n    if (workState === 'paused' && pauseStartTime) {\n      elapsed -= (now - pauseStartTime);\n    }\n    \n    const hours = Math.floor(elapsed / (1000 * 60 * 60));\n    const minutes = Math.floor((elapsed % (1000 * 60 * 60)) / (1000 * 60));\n    const seconds = Math.floor((elapsed % (1000 * 60)) / 1000);\n    \n    elapsedTimeEl.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;\n  }\n\n  // 作業項目マスタ読み込み\n  async function loadWorkItems() {\n    try {\n      const workItems = await window.aivicApi.list(3); // 作業項目マスタ\n      if (workItems) {\n        workItemSelect.innerHTML = '<option value=\"\">選択してください</option>';\n        workItems.filter(item => item.有効フラグ).forEach(item => {\n          const option = document.createElement('option');\n          option.value = item.id;\n          option.textContent = `${item.作業項目コード} - ${item.作業項目名}`;\n          workItemSelect.appendChild(option);\n        });\n      }\n    } catch (error) {\n      console.error('作業項目の読み込みに失敗しました:', error);\n    }\n  }\n\n  // 本日の作業履歴描画\n  function renderTodayHistory(records) {\n    const today = new Date().toDateString();\n    const todayRecords = records.filter(record => {\n      const recordDate = new Date(record.作業日).toDateString();\n      return recordDate === today;\n    });\n\n    historyTbody.innerHTML = todayRecords.map(record => {\n      const startTime = record.作業開始時刻 ? new Date(record.作業開始時刻).toLocaleTimeString('ja-JP', {hour: '2-digit', minute: '2-digit'}) : '';\n      const endTime = record.作業終了時刻 ? new Date(record.作業終了時刻).toLocaleTimeString('ja-JP', {hour: '2-digit', minute: '2-digit'}) : '';\n      const workHours = record.作業時間 ? `${Math.floor(record.作業時間 / 60)}:${String(record.作業時間 % 60).padStart(2, '0')}` : '';\n      \n      return `\n        <tr data-id=\"${record.id}\">\n          <td>${startTime}</td>\n          <td>${endTime}</td>\n          <td>${record.作業内容 || ''}</td>\n          <td>${workHours}</td>\n          <td>${record.進捗状況 || ''}</td>\n          <td>\n            <button class=\"action-btn secondary edit-btn\" data-id=\"${record.id}\" style=\"font-size: 11px; padding: 4px 8px;\">編集</button>\n            <button class=\"action-btn secondary delete-btn\" data-id=\"${record.id}\" style=\"font-size: 11px; padding: 4px 8px;\">削除</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // 初期データ読み込み\n  async function loadInitialData() {\n    try {\n      const workRecords = await window.aivicApi.list(1); // 作業記録\n      if (workRecords) {\n        renderTodayHistory(workRecords);\n      }\n    } catch (error) {\n      console.error('作業履歴の読み込みに失敗しました:', error);\n    }\n  }\n\n  // 作業開始\n  startBtn.addEventListener('click', () => {\n    if (!workItemSelect.value) {\n      showError('作業項目を選択してください');\n      return;\n    }\n\n    startTime = new Date();\n    totalPauseTime = 0;\n    workState = 'working';\n    \n    startBtn.disabled = true;\n    pauseBtn.disabled = false;\n    endBtn.disabled = false;\n    workItemSelect.disabled = true;\n\n    elapsedTimer = setInterval(updateElapsedTime, 1000);\n    updateElapsedTime();\n  });\n\n  // 作業中断\n  pauseBtn.addEventListener('click', () => {\n    if (workState !== 'working') {\n      showError('作業が開始されていません');\n      return;\n    }\n    \n    pauseReasonSection.style.display = 'block';\n    pauseReasonInput.focus();\n  });\n\n  // 中断確定\n  confirmPauseBtn.addEventListener('click', async () => {\n    if (!pauseReasonInput.value.trim()) {\n      showError('中断理由を入力してください');\n      return;\n    }\n\n    pauseStartTime = new Date();\n    workState = 'paused';\n    \n    pauseBtn.textContent = '再開';\n    pauseReasonSection.style.display = 'none';\n\n    // 中断記録を保存\n    try {\n      await window.aivicApi.save(2, {\n        作業記録ID: currentWorkRecord?.id || null,\n        中断開始日時: pauseStartTime.toISOString(),\n        中断理由区分: '作業中断',\n        中断理由詳細: pauseReasonInput.value.trim(),\n        対応状況: '対応中',\n        記録者ID: 'current-user-id'\n      });\n      pauseReasonInput.value = '';\n    } catch (error) {\n      console.error('中断記録の保存に失敗しました:', error);\n    }\n  });\n\n  // 中断キャンセル\n  cancelPauseBtn.addEventListener('click', () => {\n    pauseReasonSection.style.display = 'none';\n    pauseReasonInput.value = '';\n  });\n\n  // 再開処理\n  pauseBtn.addEventListener('click', () => {\n    if (workState === 'paused') {\n      const now = new Date();\n      totalPauseTime += (now - pauseStartTime);\n      pauseStartTime = null;\n      workState = 'working';\n      pauseBtn.textContent = '中断';\n    }\n  });\n\n  // 作業終了\n  endBtn.addEventListener('click', async () => {\n    if (workState === 'stopped') {\n      showError('作業が開始されていません');\n      return;\n    }\n\n    const endTime = new Date();\n    let workMinutes = Math.floor((endTime - startTime - totalPauseTime) / (1000 * 60));\n    \n    if (workState === 'paused' && pauseStartTime) {\n      workMinutes = Math.floor((pauseStartTime - startTime - totalPauseTime) / (1000 * 60));\n    }\n\n    // 作業記録を保存\n    try {\n      const workRecord = await window.aivicApi.save(1, {\n        作業員ID: 'current-user-id',\n        作業日: startTime.toISOString(),\n        作業開始時刻: startTime.toISOString(),\n        作業終了時刻: endTime.toISOString(),\n        作業時間: workMinutes,\n        プロジェクト名: 'プロジェクト名',\n        作業場所: '現場',\n        作業種別: '一般作業',\n        作業内容: workMemoInput.value || '作業完了',\n        進捗状況: '完了',\n        備考: workMemoInput.value,\n        承認状態: '未承認',\n        作成者ID: 'current-user-id'\n      });\n\n      if (workRecord) {\n        // 状態リセット\n        workState = 'stopped';\n        startTime = null;\n        totalPauseTime = 0;\n        pauseStartTime = null;\n        \n        startBtn.disabled = false;\n        pauseBtn.disabled = true;\n        endBtn.disabled = true;\n        workItemSelect.disabled = false;\n        workItemSelect.value = '';\n        workMemoInput.value = '';\n        \n        clearInterval(elapsedTimer);\n        elapsedTimeEl.textContent = '00:00:00';\n        \n        // 履歴を再読み込み\n        loadInitialData();\n      }\n    } catch (error) {\n      console.error('作業記録の保存に失敗しました:', error);\n      showError('作業記録の保存に失敗しました');\n    }\n  });\n\n  // 保存ボタン\n  saveBtn.addEventListener('click', async () => {\n    if (workState !== 'stopped') {\n      showError('作業を終了してから保存してください');\n      return;\n    }\n    \n    // 現在の状態を保存（メモなど）\n    loadInitialData();\n  });\n\n  // キャンセルボタン\n  cancelBtn.addEventListener('click', () => {\n    if (workState !== 'stopped') {\n      if (confirm('作業中ですが、本当にキャンセルしますか？入力した内容は保存されません。')) {\n        // 作業状態をリセット\n        workState = 'stopped';\n        startTime = null;\n        totalPauseTime = 0;\n        pauseStartTime = null;\n        \n        startBtn.disabled = false;\n        pauseBtn.disabled = true;\n        endBtn.disabled = true;\n        workItemSelect.disabled = false;\n        workItemSelect.value = '';\n        workMemoInput.value = '';\n        \n        clearInterval(elapsedTimer);\n        elapsedTimeEl.textContent = '00:00:00';\n        pauseReasonSection.style.display = 'none';\n      }\n    } else {\n      workItemSelect.value = '';\n      workMemoInput.value = '';\n      memoCounter.textContent = '0';\n    }\n  });\n\n  // メモ文字数カウンター\n  workMemoInput.addEventListener('input', () => {\n    memoCounter.textContent = workMemoInput.value.length;\n  });\n\n  // 中断理由文字数制限\n  pauseReasonInput.addEventListener('input', () => {\n    if (pauseReasonInput.value.length > 500) {\n      pauseReasonInput.value = pauseReasonInput.value.substring(0, 500);\n    }\n  });\n\n  // 行レベル操作（編集・削除）\n  container.addEventListener('click', async (e) => {\n    const deleteBtn = e.target.closest('.delete-btn');\n    const editBtn = e.target.closest('.edit-btn');\n    \n    if (deleteBtn) {\n      if (!confirm('この作業記録を削除しますか？')) return;\n      \n      try {\n        await window.aivicApi.delete(1, deleteBtn.dataset.id);\n        loadInitialData();\n      } catch (error) {\n        console.error('削除に失敗しました:', error);\n        showError('削除に失敗しました');\n      }\n    }\n    \n    if (editBtn) {\n      // 編集機能は簡易実装（実際のプロジェクトでは別画面に遷移）\n      const recordId = editBtn.dataset.id;\n      console.log('編集対象ID:', recordId);\n    }\n  });\n\n  // 初期化処理\n  updateCurrentDateTime();\n  setInterval(updateCurrentDateTime, 1000);\n  loadWorkItems();\n  loadInitialData();\n  \n  // 初期データがある場合は即座に描画\n  if (tables[1] && tables[1].records) {\n    renderTodayHistory(tables[1].records);\n  }\n}";
</script>

  <style>
    :root {

      padding: 0;

      overflow-x: hidden;

      display: flex;

      padding: 16px 0 8px 0;

      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
