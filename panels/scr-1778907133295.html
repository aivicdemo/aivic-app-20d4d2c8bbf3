<!doctype html>
<html lang="ja">
<head>

    <style>
        :root {
            --primary: #4a9eff;
            --primary-hover: #3a8eef;
            --bg-main: #0f0f0f;
            --bg-card: #1a1a1a;
            --bg-sidebar: #141414;
            --border: #2a2a2a;
            --text: #e8e8e8;
            --text-muted: #9a9a9a;
            --top-bar-bg: #161616;
            --top-bar-border: #252525;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            height: 52px;
        }

        .logo {
            width: 24px;
            height: 24px;
            background: var(--primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: white;
        }

        .app-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-section {
            padding: 16px 12px 8px;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            padding: 0 8px;
        }

        .nav-item {
            display: block;
            padding: 8px 12px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 400;
            margin-bottom: 2px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        .nav-item.aivic-active {
            background: var(--primary);
            color: white;
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .breadcrumb-current {
            color: var(--text);
            font-weight: 500;
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .logout-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: color 0.15s ease;
        }

        .logout-link:hover {
            color: var(--text);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quick-action-btn {
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .quick-action-btn:hover {
            border-color: var(--primary);
            background: rgba(74, 158, 255, 0.1);
        }

        .quick-action-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .quick-action-btn.primary:hover {
            background: var(--primary-hover);
        }

        .panel-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-height: 400px;
            padding: 0;
        }

        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .nav-emergency {
            margin-top: auto;
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        .emergency-btn {
            width: 100%;
            padding: 10px 12px;
            background: var(--error);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        .emergency-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
            
            .quick-actions {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>

ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentWorkRecord = null;\n  let startTime = null;\n  let elapsedTimer = null;\n  let pauseStartTime = null;\n  let totalPauseTime = 0;\n  let currentPauseRecord = null;\n\n  // 現在日時更新\n  function updateDateTime() {\n    const now = new Date();\n    const dateStr = now.toLocaleDateString('ja-JP', { \n      year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' \n    });\n    const timeStr = now.toLocaleTimeString('ja-JP', { \n      hour: '2-digit', minute: '2-digit', second: '2-digit' \n    });\n    \n    container.querySelector('#current-date').textContent = dateStr;\n    container.querySelector('#current-time').textContent = timeStr;\n  }\n\n  // 経過時間更新\n  function updateElapsedTime() {\n    if (!startTime) return;\n    \n    const now = new Date();\n    let elapsed = now - startTime - totalPauseTime;\n    \n    if (pauseStartTime) {\n      // 中断中は中断開始時点での経過時間を表示\n      elapsed = pauseStartTime - startTime - totalPauseTime;\n    }\n    \n    const hours = Math.floor(elapsed / (1000 * 60 * 60));\n    const minutes = Math.floor((elapsed % (1000 * 60 * 60)) / (1000 * 60));\n    const seconds = Math.floor((elapsed % (1000 * 60)) / 1000);\n    \n    const timeStr = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;\n    container.querySelector('#elapsed-time').textContent = timeStr;\n  }\n\n  // 作業項目読み込み\n  async function loadWorkItems() {\n    const workItems = await window.aivicApi.list(3); // 作業項目マスタ\n    const select = container.querySelector('#work-item-select');\n    \n    if (workItems) {\n      select.innerHTML = '<option value=\"\">選択してください</option>';\n      workItems\n        .filter(item => item.有効フラグ)\n        .sort((a, b) => (a.表示順序 || 0) - (b.表示順序 || 0))\n        .forEach(item => {\n          const option = document.createElement('option');\n          option.value = item.id;\n          option.textContent = `${item.作業項目コード} - ${item.作業項目名}`;\n          select.appendChild(option);\n        });\n    }\n  }\n\n  // 作業履歴描画\n  function renderHistory(records) {\n    const tbody = container.querySelector('#history-tbody');\n    const today = new Date().toDateString();\n    \n    const todayRecords = records.filter(record => {\n      const recordDate = new Date(record.作業日).toDateString();\n      return recordDate === today;\n    }).sort((a, b) => new Date(a.作業開始時刻) - new Date(b.作業開始時刻));\n\n    tbody.innerHTML = todayRecords.map(record => {\n      const startTime = new Date(record.作業開始時刻).toLocaleTimeString('ja-JP', { \n        hour: '2-digit', minute: '2-digit' \n      });\n      const endTime = record.作業終了時刻? \n        new Date(record.作業終了時刻).toLocaleTimeString('ja-JP', { \n          hour: '2-digit', minute: '2-digit' \n        }) : '-';\n      \n      const workHours = record.作業時間 ? \n        `${Math.floor(record.作業時間 / 60)}:${(record.作業時間 % 60).toString().padStart(2, '0')}` : '-';\n      \n      const statusBadge = record.進捗状況 === '作業中' ? \n        `<span style=\"background: var(--primary); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 10px;\">${record.進捗状況}</span>` :\n        record.進捗状況 === '中断' ?\n        `<span style=\"background: #ff6a00; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 10px;\">${record.進捗状況}</span>` :\n        `<span style=\"background: rgba(255,255,255,0.1); color: var(--text); padding: 2px 6px; border-radius: 4px; font-size: 10px;\">${record.進捗状況}</span>`;\n\n      return `\n        <tr data-id=\"${record.id}\" style=\"border-bottom: 1px solid rgba(255,255,255,0.05);\">\n          <td style=\"padding: 6px 8px; color: var(--text);\">${startTime}</td>\n          <td style=\"padding: 6px 8px; color: var(--text);\">${endTime}</td>\n          <td style=\"padding: 6px 8px; color: var(--text);\">${record.プロジェクト名 || '-'}</td>\n          <td style=\"padding: 6px 8px; text-align: right; color: var(--text);\">${workHours}</td>\n          <td style=\"padding: 6px 8px; text-align: center;\">${statusBadge}</td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // 初期データ読み込み\n  async function loadInitialData() {\n    updateDateTime();\n    await loadWorkItems();\n    \n    const records = await window.aivicApi.list(1); // 作業記録\n    if (records) {\n      renderHistory(records);\n    }\n  }\n\n  // 作業開始\n  container.querySelector('#btn-start-work').addEventListener('click', async () => {\n    const workItemId = container.querySelector('#work-item-select').value;\n    if (!workItemId) {\n      alert('作業項目を選択してください');\n      return;\n    }\n\n    const workItems = await window.aivicApi.list(3);\n    const selectedItem = workItems?.find(item => item.id === workItemId);\n    \n    const now = new Date();\n    const workRecord = {\n      作業員ID: 'current-user-id', // 実際の実装では認証されたユーザーIDを使用\n      作業日: now.toISOString().split('T')[0],\n      作業開始時刻: now.toISOString(),\n      プロジェクト名: selectedItem?.作業項目名|| '',\n      作業場所: '現場A', // 実際の実装では選択可能にする\n      作業種別: selectedItem?.カテゴリ || '',\n      作業内容: '',\n      進捗状況: '作業中',\n      承認状態: '未承認',\n      作成者ID: 'current-user-id'\n    };\n\n    const saved = await window.aivicApi.save(1, workRecord);\n    if (saved) {\n      currentWorkRecord = saved;\n      startTime = now;\n      totalPauseTime = 0;\n      pauseStartTime = null;\n      \n      container.querySelector('#btn-start-work').disabled = true;\n      container.querySelector('#btn-end-work').disabled = false;\n      container.querySelector('#btn-pause-work').disabled = false;\n      container.querySelector('#work-status').textContent = '作業中';\n      \n      elapsedTimer = setInterval(updateElapsedTime, 1000);\n      updateElapsedTime();\n      \n      const records = await window.aivicApi.list(1);\n      if (records) renderHistory(records);\n    }\n  });\n\n  // 作業終了\n  container.querySelector('#btn-end-work').addEventListener('click', async () => {\n    if (!currentWorkRecord) {\n      alert('作業が開始されていません');\n      return;\n    }\n\n    const now = new Date();\n    let workTime = Math.floor((now - startTime - totalPauseTime) / (1000 * 60));\n    \n    // 中断中の場合は中断時点までの時間\n    if (pauseStartTime) {\n      workTime = Math.floor((pauseStartTime - startTime - totalPauseTime) / (1000 * 60));\n    }\n\n    const memo = container.querySelector('#work-memo').value;\n    \n    const updated = await window.aivicApi.update(1, currentWorkRecord.id, {\n      作業終了時刻: now.toISOString(),\n      作業時間: workTime,\n      作業内容: memo,\n      進捗状況: '完了'\n    });\n\n    if (updated) {\n      // 中断記録がある場合は終了\n      if (currentPauseRecord) {\n        await window.aivicApi.update(2, currentPauseRecord.id, {\n          中断終了日時: now.toISOString(),\n          中断時間: Math.floor((now - new Date(currentPauseRecord.中断開始日時)) / (1000 * 60)),\n          対応状況: '解決済み'\n        });\n      }\n\n      currentWorkRecord = null;\n      startTime = null;\n      pauseStartTime = null;\n      currentPauseRecord = null;\n      totalPauseTime = 0;\n      \n      clearInterval(elapsedTimer);\n      \n      container.querySelector('#btn-start-work').disabled = false;\n      container.querySelector('#btn-end-work').disabled = true;\n      container.querySelector('#btn-pause-work').disabled = true;\n      container.querySelector('#work-status').textContent = '待機中';\n      container.querySelector('#elapsed-time').textContent = '00:00:00';\n      container.querySelector('#work-memo').value = '';\n      container.querySelector('#work-item-select').value = '';\n      \n      const records = await window.aivicApi.list(1);\n      if (records) renderHistory(records);\n    }\n  });\n\n  // 作業中断\n  container.querySelector('#btn-pause-work').addEventListener('click', () => {\n    if (!currentWorkRecord) {\n      alert('作業が開始されていません');\n      return;\n    }\n\n    container.querySelector('#pause-dialog').classList.remove('hidden');\n  });\n\n  // 中断ダイアログ - キャンセル\n  container.querySelector('#btn-pause-cancel').addEventListener('click', () => {\n    container.querySelector('#pause-dialog').classList.add('hidden');\n    container.querySelector('#pause-reason-category').value = '';\n    container.querySelector('#pause-reason-detail').value = '';\n  });\n\n  // 中断ダイアログ - 決定\n  container.querySelector('#btn-pause-confirm').addEventListener('click', async () => {\n    const category = container.querySelector('#pause-reason-category').value;\n    const detail = container.querySelector('#pause-reason-detail').value;\n    \n    if (!category) {\n      alert('中断理由を選択してください');\n      return;\n    }\n\n    const now = new Date();\n    const pauseRecord = {\n      作業記録ID: currentWorkRecord.id,\n      中断開始日時: now.toISOString(),\n      中断理由区分: category,\n      中断理由詳細: detail,\n      影響度: '中程度',\n      対応状況: '対応中',\n      記録者ID: 'current-user-id'\n    };\n\n    const saved = await window.aivicApi.save(2, pauseRecord);\n    if (saved) {\n      currentPauseRecord = saved;\n      pauseStartTime = now;\n      \n      await window.aivicApi.update(1, currentWorkRecord.id, {\n        進捗状況: '中断'\n      });\n\n      container.querySelector('#work-status').textContent = '中断中';\n      container.querySelector('#pause-dialog').classList.add('hidden');\n      container.querySelector('#pause-reason-category').value = '';\n      container.querySelector('#pause-reason-detail').value = '';\n      \n      const records = await window.aivicApi.list(1);\n      if (records) renderHistory(records);\n    }\n  });\n\n  // 履歴更新\n  container.querySelector('#btn-refresh-history').addEventListener('click', async () => {\n    const records = await window.aivicApi.list(1);\n    if (records) renderHistory(records);\n  });\n\n  // 保存\n  container.querySelector('#btn-save').addEventListener('click', async () => {\n    if (currentWorkRecord) {\n      const memo = container.querySelector('#work-memo').value;\n      await window.aivicApi.update(1, currentWorkRecord.id, {\n        作業内容: memo\n      });\n      alert('作業メモを保存しました');\n    } else {\n      alert('保存する作業記録がありません');\n    }\n  });\n\n  // キャンセル\n  container.querySelector('#btn-cancel').addEventListener('click', () => {\n    if (currentWorkRecord) {\n      if (confirm('作業中のデータが失われますが、よろしいですか？')) {\n        // 作業をキャンセル（実際の実装では作業記録を削除または無効化）\n        currentWorkRecord = null;\n        startTime = null;\n        pauseStartTime = null;\n        totalPauseTime = 0;\n        clearInterval(elapsedTimer);\n        \n        container.querySelector('#btn-start-work').disabled = false;\n        container.querySelector('#btn-end-work').disabled = true;\n        container.querySelector('#btn-pause-work').disabled = true;\n        container.querySelector('#work-status').textContent = '待機中';\n        container.querySelector('#elapsed-time').textContent = '00:00:00';\n        container.querySelector('#work-memo').value = '';\n        container.querySelector('#work-item-select').value = '';\n      }\n    }\n  });\n\n  // ナビゲーション\n  container.querySelector('#btn-work-record-start').addEventListener('click', () => {\n    window.showScreen(\"scr-1778907187615\");\n  });\n\n  container.querySelector('#btn-work-history').addEventListener('click', () => {\n    window.showScreen(\"scr-1778907145716\");\n  });\n\n  container.querySelector('#btn-emergency-report').addEventListener('click', () => {\n    window.showScreen(\"scr-1778907330826\");\n  });\n\n  // 文字数カウント\n  container.querySelector('#work-memo').addEventListener('input', (e) => {\n    container.querySelector('#memo-count').textContent = e.target.value.length;\n  });\n\n  container.querySelector('#pause-reason-detail').addEventListener('input', (e) => {\n    container.querySelector('#pause-detail-count').textContent = e.target.value.length;\n  });\n\n  // 定期更新\n  setInterval(updateDateTime, 1000);\n\n  // 初期化\n  loadInitialData();\n}";
</script>

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();
