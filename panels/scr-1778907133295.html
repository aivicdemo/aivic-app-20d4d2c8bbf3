tTime = null;\n  let elapsedTimer = null;\n  let pauseStartTime = null;\n  let totalPauseTime = 0;\n  let workState = 'stopped'; // 'stopped', 'working', 'paused'\n  let pausedRecords = [];\n\n  // DOM要素の取得\n  const workerNameEl = container.querySelector('#worker-name');\n  const currentDatetimeEl = container.querySelector('#current-datetime');\n  const workItemSelect = container.querySelector('[data-testid=\"work-item-select\"]') || container.querySelector('#work-item-select') || container.querySelector('select[name=\"task\"]');\n  const elapsedTimeEl = container.querySelector('#elapsed-time');\n  const startBtn = container.querySelector('[data-testid=\"start-button\"]') || container.querySelector('#start-btn');\n  const pauseBtn = container.querySelector('[data-testid=\"pause-button\"]') || container.querySelector('#pause-btn');\n  const endBtn = container.querySelector('[data-testid=\"end-button\"]') || container.querySelector('#end-btn');\n  const pauseReasonSection = container.querySelector('#pause-reason-section');\n  const pauseReasonInput = container.querySelector('[data-testid=\"pause-reason-input\"]') || container.querySelector('#pause-reason') || container.querySelector('select[name=\"pauseReason\"]');\n  const confirmPauseBtn = container.querySelector('[data-testid=\"confirm-pause-button\"]') || container.querySelector('#confirm-pause-btn');\n  const cancelPauseBtn = container.querySelector('#cancel-pause-btn');\n  const workMemoInput = container.querySelector('[data-testid=\"work-memo-input\"]') || container.querySelector('#work-memo') || container.querySelector('textarea[name=\"memo\"]');\n  const saveBtn = container.querySelector('[data-testid=\"save-button\"]') || container.querySelector('#save-btn');\n  const cancelBtn = container.querySelector('#cancel-btn');\n  const todayWorkHistoryEl = container.querySelector('[data-testid=\"today-work-history\"]') || container.querySelector('#today-work-history');\n  const historyTbodyEl = container.querySelector('#history-tbody');\n  const errorMessageEl = container.querySelector('[data-testid=\"error-message\"]') || container.querySelector('#error-message');\n  const resumeWorkBtn = container.querySelector('button:has-text(\"作業再開\")') || container.querySelector('[data-testid=\"resume-work-button\"]');\n\n  // 初期化処理\n  function init() {\n    updateCurrentDateTime();\n    setInterval(updateCurrentDateTime, 1000);\n    \n    // 作業者名の設定\n    if (workerNameEl) {\n      const userName = localStorage.getItem('userName') || 'ユーザー';\n      workerNameEl.textContent = userName;\n    }\n\n    // 作業項目の初期化\n    initWorkItems();\n    \n    // 本日の作業履歴を読み込み\n    loadTodayWorkHistory();\n    \n    // アクティブな作業記録をチェック\n    checkAndRestoreActiveWork();\n    \n    // UI状態の初期化\n    updateUIState();\n    \n    // 中断理由セクションを非表示\n    if (pauseReasonSection) {\n      pauseReasonSection.style.display = 'none';\n    }\n  }\n\n  // 現在日時の更新\n  function updateCurrentDateTime() {\n    if (currentDatetimeEl) {\n      const now = new Date();\n      currentDatetimeEl.textContent = now.toLocaleString('ja-JP');\n    }\n  }\n\n  // 作業項目の初期化\n  function initWorkItems() {\n    if (workItemSelect) {\n      const workItems = [\n        { value: '', text: '作業項目を選択してください' },\n        { value: 'inspection', text: '設備点検' },\n        { value: 'maintenance', text: '保守作業' },\n        { value: 'repair', text: '修理作業' },\n        { value: 'cleaning', text: '清掃作業' },\n        { value: 'other', text: 'その他' }\n      ];\n      \n      workItemSelect.innerHTML = '';\n      workItems.forEach(item => {\n        const option = document.createElement('option');\n        option.value = item.value;\n        option.textContent = item.text;\n        workItemSelect.appendChild(option);\n      });\n    }\n  }\n\n  // エラーメッセージの表示\n  function showError(message) {\n    if (errorMessageEl) {\n      errorMessageEl.textContent = message;\n      errorMessageEl.style.display = 'block';\n      setTimeout(() => {\n        errorMessageEl.style.display = 'none';\n      }, 5000);\n    }\n    if (window.aivicNotify) {\n      window.aivicNotify.error(message);\n    }\n  }\n\n  // 成功メッセージの表示\n  function showSuccess(message) {\n    if (window.aivicNotify) {\n      window.aivicNotify.success(message);\n    }\n  }\n\n  // 作業開始処理\n  function handleStartWork() {\n    try {\n      // 入力値の検証\n      const workItem = workItemSelect ? workItemSelect.value : '';\n      const validationResult = validateRequiredFields({ workItem });\n      \n      if (!validationResult.isValid) {\n        showError(validationResult.message || '作業項目を選択してください');\n        return;\n      }\n\n      // 業務ロジックによる開始処理\n      const startResult = startWorkRecord({\n        workItem,\n        startTime: new Date(),\n        workerId: localStorage.getItem('userId') || 'user1'\n      });\n\n      if (startResult.success) {\n        currentWorkRecord = startResult.record;\n        startTime = new Date();\n        workState = 'working';\n        totalPauseTime = 0;\n        \n        // GPS位置情報の記録\n        recordWorkStartTime({\n          recordId: currentWorkRecord.id,\n          startTime: startTime,\n          location: getCurrentLocation()\n        });\n        \n        startElapsedTimer();\n        updateUIState();\n        showSuccess('作業を開始しました');\n        \n        // ローカルストレージに保存\n        saveToLocalStorage('currentWorkRecord', currentWorkRecord);\n      } else {\n        showError(startResult.message || '作業開始に失敗しました');\n      }\n    } catch (error) {\n      console.error('作業開始エラー:', error);\n      showError('作業開始中にエラーが発生しました');\n    }\n  }\n\n  // 作業中断処理\n  function handlePauseWork() {\n    if (workState !== 'working') {\n      showError('作業が開始されていません');\n      return;\n    }\n    \n    if (pauseReasonSection) {\n      pauseReasonSection.style.display = 'block';\n    }\n  }\n\n  // 中断確認処理\n  function handleConfirmPause() {\n    try {\n      const pauseReason = pauseReasonInput ? pauseReasonInput.value.trim() : '';\n      \n      // 中断理由の検証\n      const validationResult = validateInterruptionReason({ reason: pauseReason });\n      if (!validationResult.isValid) {\n        showError('中断理由を入力してください');\n        return;\n      }\n\n      // 業務ロジックによる中断処理\n      const interruptionResult = recordInterruption({\n        recordId: currentWorkRecord.id,\n        reason: pauseReason,\n        pauseTime: new Date(),\n        workState: workState\n      });\n\n      if (interruptionResult.success) {\n        pauseStartTime = new Date();\n        workState = 'paused';\n        \n        stopElapsedTimer();\n        updateUIState();\n        \n        if (pauseReasonSection) {\n          pauseReasonSection.style.display = 'none';\n        }\n        if (pauseReasonInput) {\n          pauseReasonInput.value = '';\n        }\n        \n        showSuccess('作業を中断しました');\n        \n        // 中断記録をローカルストレージに保存\n        pausedRecords.push({\n          ...currentWorkRecord,\n          pauseReason,\n          pauseTime: pauseStartTime\n        });\n        saveToLocalStorage('pausedRecords', pausedRecords);\n      } else {\n        showError(interruptionResult.message || '作業中断に失敗しました');\n      }\n    } catch (error) {\n      console.error('作業中断エラー:', error);\n      showError('作業中断中にエラーが発生しました');\n    }\n  }\n\n  // 中断キャンセル処理\n  function handleCancelPause() {\n    if (pauseReasonSection) {\n      pauseReasonSection.style.display = 'none';\n    }\n    if (pauseReasonInput) {\n      pauseReasonInput.value = '';\n    }\n  }\n\n  // 作業終了処理\n  function handleEndWork() {\n    if (workState === 'stopped') {\n      showError('作業が開始されていません');\n      return;\n    }\n\n    try {\n      const endTime = new Date();\n      \n      // 中断中の場合は中断時間を計算\n      if (workState === 'paused' && pauseStartTime) {\n        totalPauseTime += (endTime - pauseStartTime);\n      }\n\n      // 業務ロジックによる終了処理\n      const workDuration = calculateWorkTime({\n        startTime,\n        endTime,\n        pauseTime: totalPauseTime\n      });\n\n      // 異常値検出\n      const anomalyResult = detectAnomalousValue({\n        duration: workDuration.totalMinutes,\n        workType: workItemSelect ? workItemSelect.value : ''\n      });\n\n      if (anomalyResult.isAnomalous) {\n        const confirmed = confirm(`作業時間が${anomalyResult.reason}です。このまま終了しますか？`);\n        if (!confirmed) {\n          return;\n        }\n      }\n\n      // GPS位置情報の記録\n      recordWorkEndTime({\n        recordId: currentWorkRecord.id,\n        endTime: endTime,\n        location: getCurrentLocation()\n      });\n\n      // 作業記録の更新\n      currentWorkRecord.endTime = endTime;\n      currentWorkRecord.duration = workDuration;\n      currentWorkRecord.status = 'completed';\n\n      stopElapsedTimer();\n      workState = 'stopped';\n      updateUIState();\n      \n      showSuccess('作業を終了しました。保存してください。');\n      \n    } catch (error) {\n      console.error('作業終了エラー:', error);\n      showError('作業終了中にエラーが発生しました');\n    }\n  }\n\n  // 作業保存処理\n  function handleSaveWork() {\n    if (!currentWorkRecord || !currentWorkRecord.endTime) {\n      showError('保存する作業記録がありません');\n      return;\n    }\n\n    try {\n      // メモの追加\n      const memo = workMemoInput ? workMemoInput.value.trim() : '';\n      currentWorkRecord.memo = memo;\n\n      // 業務ロジックによる保存処理\n      const saveResult = saveWorkDataToCloud(currentWorkRecord);\n      \n      if (saveResult.success) {\n        // ローカルストレージからも保存\n        saveToLocalStorage('workRecords', currentWorkRecord);\n        \n        // 本日の履歴を更新\n        addToTodayHistory(currentWorkRecord);\n        \n        // 状態をリセット\n        resetWorkState();\n        \n        showSuccess('作業記録を保存しました');\n      } else {\n        // オフライン時はローカルに保存\n        saveToLocalStorage('pendingRecords', currentWorkRecord);\n        showSuccess('オフラインのためローカルに保存しました');\n      }\n    } catch (error) {\n      console.error('作業保存エラー:', error);\n      showError('作業保存中にエラーが発生しました');\n    }\n  }\n\n  // 作業キャンセル処理\n  function handleCancelWork() {\n    if (currentWorkRecord && !currentWorkRecord.endTime) {\n      const confirmed = confirm('作業中の記録を破棄しますか？');\n      if (!confirmed) {\n        return;\n      }\n    }\n    \n    resetWorkState();\n    showSuccess('作業記録をキャンセルしました');\n  }\n\n  // 作業再開処理\n  function handleResumeWork() {\n    if (pausedRecords.length === 0) {\n      showError('中断中の作業がありません');\n      return;\n    }\n    \n    // 作業再開画面に遷移\n    window.showScreen('scr-1778907251446');\n  }\n\n  // 状態リセット\n  function resetWorkState() {\n    currentWorkRecord = null;\n    startTime = null;\n    pauseStartTime = null;\n    totalPauseTime = 0;\n    workState = 'stopped';\n    \n    stopElapsedTimer();\n    \n    if (workItemSelect) workItemSelect.value = '';\n    if (workMemoInput) workMemoInput.value = '';\n    if (elapsedTimeEl) elapsedTimeEl.textContent = '00:00:00';\n    \n    updateUIState();\n    \n    // ローカルストレージをクリア\n    localStorage.removeItem('currentWorkRecord');\n  }\n\n  // 経過時間タイマー開始\n  function startElapsedTimer() {\n    if (elapsedTimer) {\n      clearInterval(elapsedTimer);\n    }\n    \n    elapsedTimer = setInterval(() => {\n      updateElapsedTime();\n    }, 1000);\n  }\n\n  // 経過時間タイマー停止\n  function stopElapsedTimer() {\n    if (elapsedTimer) {\n      clearInterval(elapsedTimer);\n      elapsedTimer = null;\n    }\n  }\n\n  // 経過時間の更新\n  function updateElapsedTime() {\n    if (!startTime || !elapsedTimeEl) return;\n    \n    const now = new Date();\n    let elapsed = now - startTime - totalPauseTime;\n    \n    if (workState === 'paused' && pauseStartTime) {\n      elapsed -= (now - pauseStartTime);\n      elapsedTimeEl.textContent = formatTime(elapsed) + ' (中断中)';\n    } else {\n      elapsedTimeEl.textContent = formatTime(elapsed);\n    }\n  }\n\n  // 時間フォーマット\n  function formatTime(milliseconds) {\n    const seconds = Math.floor(milliseconds / 1000);\n    const hours = Math.floor(seconds / 3600);\n    const minutes = Math.floor((seconds % 3600) / 60);\n    const secs = seconds % 60;\n    \n    return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;\n  }\n\n  // UI状態の更新\n  function updateUIState() {\n    if (!startBtn || !pauseBtn || !endBtn || !saveBtn) return;\n    \n    switch (workState) {\n      case 'stopped':\n        startBtn.disabled = false;\n        pauseBtn.disabled = true;\n        endBtn.disabled = true;\n        saveBtn.disabled = !currentWorkRecord || !currentWorkRecord.endTime;\n        break;\n      case 'working':\n        startBtn.disabled = true;\n        pauseBtn.disabled = false;\n        endBtn.disabled = false;\n        saveBtn.disabled = true;\n        break;\n      case 'paused':\n        startBtn.disabled = true;\n        pauseBtn.disabled = true;\n        endBtn.disabled = false;\n        saveBtn.disabled = true;\n        break;\n    }\n    \n    // 作業再開ボタンの表示制御\n    if (resumeWorkBtn) {\n      resumeWorkBtn.style.display = pausedRecords.length > 0 ? 'inline-block' : 'none';\n    }\n  }\n\n  // 本日の作業履歴読み込み\n  function loadTodayWorkHistory() {\n    try {\n      const today = new Date().toDateString();\n      const savedRecords = JSON.parse(localStorage.getItem('workRecords') || '[]');\n      const todayRecords = savedRecords.filter(record => \n        new Date(record.startTime).toDateString() === today\n      );\n      \n      updateHistoryDisplay(todayRecords);\n    } catch (error) {\n      console.error('履歴読み込みエラー:', error);\n    }\n  }\n\n  // 履歴表示の更新\n  function updateHistoryDisplay(records) {\n    if (!historyTbodyEl) return;\n    \n    historyTbodyEl.innerHTML = '';\n    \n    records.forEach(record => {\n      const row = document.createElement('tr');\n      row.innerHTML = `\n        <td>${new Date(record.startTime).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}</td>\n        <td>${record.endTime ? new Date(record.endTime).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) : '-'}</td>\n        <td>${getWorkItemText(record.workItem)}</td>\n        <td>${record.duration ? formatTime(record.duration.totalMinutes * 60 * 1000) : '-'}</td>\n        <td>${record.memo || '-'}</td>\n      `;\n      historyTbodyEl.appendChild(row);\n    });\n  }\n\n  // 本日履歴に追加\n  function addToTodayHistory(record) {\n    try {\n      const savedRecords = JSON.parse(localStorage.getItem('workRecords') || '[]');\n      savedRecords.push(record);\n      localStorage.setItem('workRecords', JSON.stringify(savedRecords));\n      \n      loadTodayWorkHistory();\n    } catch (error) {\n      console.error('履歴追加エラー:', error);\n    }\n  }\n\n  // 作業項目テキスト取得\n  function getWorkItemText(value) {\n    const items = {\n      'inspection': '設備点検',\n      'maintenance': '保守作業',\n      'repair': '修理作業',\n      'cleaning': '清掃作業',\n      'other': 'その他'\n    };\n    return items[value] || value;\n  }\n\n  // アクティブな作業の復元\n  function checkAndRestoreActiveWork() {\n    try {\n      const saved = localStorage.getItem('currentWorkRecord');\n      if (saved) {\n        currentWorkRecord = JSON.parse(saved);\n        startTime = new Date(currentWorkRecord.startTime);\n        workState = currentWorkRecord.status === 'paused' ? 'paused' : 'working';\n        \n        if (workState === 'working') {\n          startElapsedTimer();\n        }\n        \n        updateUIState();\n      }\n      \n      const savedPaused = localStorage.getItem('pausedRecords');\n      if (savedPaused) {\n        pausedRecords = JSON.parse(savedPaused);\n      }\n    } catch (error) {\n      console.error('作業復元エラー:', error);\n    }\n  }\n\n  // GPS位置情報取得\n  function getCurrentLocation() {\n    return new Promise((resolve) => {\n      if (navigator.geolocation) {\n        navigator.geolocation.getCurrentPosition(\n          (position) => {\n            resolve({\n              latitude: position.coords.latitude,\n              longitude: position.coords.longitude\n            });\n          },\n          () => {\n            resolve(null);\n          }\n        );   <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
