window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックのインポート\n  const { calculateWorkDuration, calculateProgressRate, calculateDeviationRate, calculateInterruptionDuration, detectWorkTimeAnomaly, detectEfficiencyDecline, analyzeInterruptionPattern, evaluateROI, detectSeasonalAnomaly, calculateProductivityStats, classifyImprovementPriority } = require(\"../src/logic/work-record-calc\");\n  const { validateRequiredFields, validateTimeConsistency, validateDuplicateWork, isShortWorkWarning, isLongWorkAnomaly, validateWorkDuration, isInterruptionTimeAnomaly, validateWorkRecordCompleteness, detectAnomalousWorkDurations, createWorkRecordHistory } = require(\"../src/logic/work-validation\");\n  const { detectOvertimeAnomaly, detectNegativeValue, detectExcessiveInterruption, detectStatisticalAnomaly, calculateAnomalyScore, detectShortWorkAnomaly, detectLongWorkAnomaly, detectTimeSequenceAnomaly, detectProductivityAnomaly, detectEmergencyWorkAnomaly, filterAnomalousRecords, detectPlanDeviationAnomaly, detectExtremeAnomaly } = require(\"../src/logic/anomaly-detection\");\n\n  let currentWorkRecord = null;\n  let startTime = null;\n  let elapsedTimer = null;\n  let pauseStartTime = null;\n  let totalPauseTime = 0;\n  let workState = 'stopped'; // 'stopped', 'working', 'paused'\n\n  // DOM要素の取得\n  const workerNameEl = container.querySelector('#worker-name');\n  const currentDatetimeEl = container.querySelector('#current-datetime');\n  const workItemSelect = container.querySelector('select[name=\"task\"]');\n  const elapsedTimeEl = container.querySelector('#elapsed-time');\n  const startBtn = container.querySelector('button:has-text(\"開始\")') || container.querySelector('#start-btn');\n  const pauseBtn = container.querySelector('button:has-text(\"中断\")') || container.querySelector('#pause-btn');\n  const endBtn = container.querySelector('button:has-text(\"終了\")') || container.querySelector('#end-btn');\n  const pauseReasonSection = container.querySelector('#pause-reason-section');\n  const pauseReasonSelect = container.querySelector('select[name=\"pauseReason\"]');\n  const confirmPauseBtn = container.querySelector('button:has-text(\"中断確定\")') || container.querySelector('#confirm-pause-btn');\n  const cancelPauseBtn = container.querySelector('#cancel-pause-btn');\n  const workMemoInput = container.querySelector('textarea[name=\"memo\"]') || container.querySelector('textarea[name=\"content\"]');\n  const memoCounter = container.querySelector('#memo-counter');\n  const historyTbody = container.querySelector('#history-tbody');\n  const saveBtn = container.querySelector('button:has-text(\"保存\")') || container.querySelector('#save-btn');\n  const cancelBtn = container.querySelector('#cancel-btn');\n  const errorMessage = container.querySelector('.error-message');\n  const successMessage = container.querySelector('.success-message');\n  const workDateInput = container.querySelector('input[name=\"workDate\"]');\n  const startTimeInput = container.querySelector('input[name=\"startTime\"]');\n  const endTimeInput = container.querySelector('input[name=\"endTime\"]');\n  const workContentSelect = container.querySelector('select[name=\"workContent\"]');\n  const currentDateEl = container.querySelector('.current-date');\n\n  // エラー表示関数\n  function showError(message) {\n    if (errorMessage) {\n      errorMessage.textContent = message;\n      errorMessage.style.display = 'block';\n      setTimeout(() => {\n        errorMessage.style.display = 'none';\n      }, 5000);\n    }\n    if (window.aivicNotify) {\n      window.aivicNotify.error(message);\n    }\n  }\n\n  // 成功表示関数\n  function showSuccess(message) {\n    if (successMessage) {\n      successMessage.textContent = message;\n      successMessage.style.display = 'block';\n      setTimeout(() => {\n        successMessage.style.display = 'none';\n      }, 3000);\n    }\n    if (window.aivicNotify) {\n      window.aivicNotify.success(message);\n    }\n  }\n\n  // 現在日時更新\n  function updateCurrentDateTime() {\n    const now = new Date();\n    if (currentDatetimeEl) {\n      currentDatetimeEl.textContent = now.toLocaleString('ja-JP');\n    }\n    if (currentDateEl) {\n      currentDateEl.textContent = now.toLocaleDateString('ja-JP');\n    }\n  }\n\n  // 経過時間更新\n  function updateElapsedTime() {\n    if (!startTime || !elapsedTimeEl) return;\n    \n    const now = new Date();\n    let elapsed = now - startTime - totalPauseTime;\n    \n    if (workState === 'paused' && pauseStartTime) {\n      elapsed -= (now - pauseStartTime);\n    }\n    \n    const hours = Math.floor(elapsed / (1000 * 60 * 60));\n    const minutes = Math.floor((elapsed % (1000 * 60 * 60)) / (1000 * 60));\n    const seconds = Math.floor((elapsed % (1000 * 60)) / 1000);\n    \n    elapsedTimeEl.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;\n  }\n\n  // 作業項目マスタ読み込み\n  async function loadWorkItems() {\n    try {\n      const workItems = await window.aivicApi.list(3); // 作業項目マスタ\n      if (workItems && workItemSelect) {\n        workItemSelect.innerHTML = '<option value=\"\">選択してください</option>';\n        workItems.filter(item => item.有効フラグ).forEach(item => {\n          const option = document.createElement('option');\n          option.value = item.作業項目コード;\n          option.textContent = `${item.作業項目コード} - ${item.作業項目名}`;\n          workItemSelect.appendChild(option);\n        });\n      }\n      \n      // 他のセレクトボックスも同様に設定\n      if (workContentSelect) {\n        workContentSelect.innerHTML = '<option value=\"\">選択してください</option>';\n        const workContents = ['機械メンテナンス', '配管作業', '設備点検', '清掃作業', '修理作業'];\n        workContents.forEach(content => {\n          const option = document.createElement('option');\n          option.value = content;\n          option.textContent = content;\n          workContentSelect.appendChild(option);\n        });\n      }\n\n      if (pauseReasonSelect) {\n        pauseReasonSelect.innerHTML = '<option value=\"\">選択してください</option>';\n        const pauseReasons = ['休憩', '会議', '緊急対応', '材料待ち', 'その他'];\n        pauseReasons.forEach(reason => {\n          const option = document.createElement('option');\n          option.value = reason;\n          option.textContent = reason;\n          pauseReasonSelect.appendChild(option);\n        });\n      }\n    } catch (error) {\n      console.error('作業項目の読み込みに失敗しました:', error);\n      showError('作業項目の読み込みに失敗しました');\n    }\n  }\n\n  // 本日の作業履歴描画\n  async function renderTodayHistory() {\n    try {\n      const today = new Date().toISOString().split('T')[0];\n      const records = await window.aivicApi.list(1); // 工数記録テーブル\n      const todayRecords = records.filter(record => \n        record.作業日 === today && record.作業者ID === window.currentUser?.id\n      );\n\n      if (historyTbody) {\n        historyTbody.innerHTML = '';\n        todayRecords.forEach(record => {\n          const row = document.createElement('tr');\n          row.className = 'work-history-item';\n          row.innerHTML = `\n            <td class=\"start-time\">${record.開始時刻}</td>\n            <td class=\"end-time\">${record.終了時刻 || '作業中'}</td>\n            <td class=\"work-content\">${record.作業項目}</td>\n            <td class=\"work-hours\">${record.作業時間 || '-'}</td>\n          `;\n          historyTbody.appendChild(row);\n        });\n      }\n    } catch (error) {\n      console.error('作業履歴の読み込みに失敗しました:', error);\n    }\n  }\n\n  // 作業状態の更新\n  function updateWorkState(state) {\n    workState = state;\n    \n    // 状態表示の更新\n    const statusElements = container.querySelectorAll('.status-working, .status-paused, .status-stopped');\n    statusElements.forEach(el => el.style.display = 'none');\n    \n    const currentStatusEl = container.querySelector(`.status-${state}`);\n    if (currentStatusEl) {\n      currentStatusEl.style.display = 'block';\n    }\n\n    // ボタンの状態更新\n    if (startBtn) startBtn.disabled = (state !== 'stopped');\n    if (pauseBtn) pauseBtn.disabled = (state !== 'working');\n    if (endBtn) endBtn.disabled = (state === 'stopped');\n  }\n\n  // 作業開始処理\n  async function handleStartWork() {\n    try {\n      const selectedTask = workItemSelect?.value;\n      \n      // バリデーション\n      const validationResult = validateRequiredFields({\n        作業項目: selectedTask\n      });\n      \n      if (!validationResult.isValid) {\n        showError('作業項目を選択してください');\n        return;\n      }\n\n      startTime = new Date();\n      totalPauseTime = 0;\n      pauseStartTime = null;\n      \n      currentWorkRecord = {\n        作業日: new Date().toISOString().split('T')[0],\n        開始時刻: startTime.toTimeString().split(' ')[0],\n        作業項目: selectedTask,\n        作業者ID: window.currentUser?.id\n      };\n\n      updateWorkState('working');\n      \n      // タイマー開始\n      elapsedTimer = setInterval(updateElapsedTime, 1000);\n      \n      showSuccess('作業を開始しました');\n    } catch (error) {\n      console.error('作業開始エラー:', error);\n      showError('作業開始に失敗しました');\n    }\n  }\n\n  // 作業中断処理\n  async function handlePauseWork() {\n    try {\n      if (workState !== 'working') {\n        showError('作業が開始されていません');\n        return;\n      }\n\n      // 中断理由入力画面表示\n      if (pauseReasonSection) {\n        pauseReasonSection.style.display = 'block';\n      }\n    } catch (error) {\n      console.error('作業中断エラー:', error);\n      showError('作業中断に失敗しました');\n    }\n  }\n\n  // 中断確定処理\n  async function handleConfirmPause() {\n    try {\n      const pauseReason = pauseReasonSelect?.value;\n      \n      if (!pauseReason) {\n        showError('中断理由を入力してください');\n        return;\n      }\n\n      pauseStartTime = new Date();\n      updateWorkState('paused');\n      \n      if (pauseReasonSection) {\n        pauseReasonSection.style.display = 'none';\n      }\n      \n      showSuccess('作業を中断しました');\n    } catch (error) {\n      console.error('中断確定エラー:', error);\n      showError('中断確定に失敗しました');\n    }\n  }\n\n  // 作業再開処理\n  async function handleResumeWork() {\n    try {\n      if (workState !== 'paused') return;\n\n      if (pauseStartTime) {\n        const interruptionDuration = calculateInterruptionDuration(\n          pauseStartTime.toISOString(),\n          new Date().toISOString()\n        );\n        totalPauseTime += interruptionDuration;\n      }\n      \n      pauseStartTime = null;\n      updateWorkState('working');\n      \n      showSuccess('作業を再開しました');\n    } catch (error) {\n      console.error('作業再開エラー:', error);\n      showError('作業再開に失敗しました');\n    }\n  }\n\n  // 作業終了処理\n  async function handleEndWork() {\n    try {\n      if (workState === 'stopped') {\n        showError('作業が開始されていません');\n        return;\n      }\n\n      const endTime = new Date();\n      \n      if (workState === 'paused' && pauseStartTime) {\n        totalPauseTime += (endTime - pauseStartTime);\n      }\n\n      const workDuration = calculateWorkDuration(\n        startTime.toISOString(),\n        endTime.toISOString(),\n        totalPauseTime\n      );\n\n      currentWorkRecord.終了時刻 = endTime.toTimeString().split(' ')[0];\n      currentWorkRecord.作業時間 = workDuration;\n      currentWorkRecord.メモ = workMemoInput?.value || '';\n\n      // 異常検知\n      const anomalies = detectWorkTimeAnomaly({\n        duration: workDuration,\n        startTime: startTime.toISOString(),\n        endTime: endTime.toISOString()\n      });\n\n      if (anomalies.length > 0) {\n        console.warn('作業時間の異常を検出:', anomalies);\n      }\n\n      updateWorkState('stopped');\n      clearInterval(elapsedTimer);\n      \n      showSuccess('作業を終了しました');\n      await renderTodayHistory();\n    } catch (error) {\n      console.error('作業終了エラー:', error);\n      showError('作業終了に失敗しました');\n    }\n  }\n\n  // 保存処理\n  async function handleSave() {\n    try {\n      let recordToSave;\n\n      if (currentWorkRecord) {\n        recordToSave = currentWorkRecord;\n      } else {\n        // 手動入力の場合\n        const workDate = workDateInput?.value;\n        const startTimeValue = startTimeInput?.value;\n        const endTimeValue = endTimeInput?.value;\n        const workContent = workContentSelect?.value;\n        const memo = workMemoInput?.value;\n\n        const validationResult = validateRequiredFields({\n          作業日: workDate,\n          開始時刻: startTimeValue,\n          終了時刻: endTimeValue,\n          作業項目: workContent\n        });\n\n        if (!validationResult.isValid) {\n          showError('必須項目を入力してください');\n          return;\n        }\n\n        const timeValidation = validateTimeConsistency(startTimeValue, endTimeValue);\n        if (!timeValidation.isValid) {\n          showError('時刻の整合性に問題があります');\n          return;\n        }\n\n        const duration = calculateWorkDuration(\n          `${workDate}T${startTimeValue}`,\n          `${workDate}T${endTimeValue}`,\n          0\n        );\n\n        recordToSave = {\n          作業日: workDate,\n          開始時刻: startTimeValue,\n          終了時刻: endTimeValue,\n          作業項目: workContent,\n          作業時間: duration,\n          メモ: memo,\n          作業者ID: window.currentUser?.id\n        };\n      }\n\n      // 重複チェック\n      const duplicateCheck = await validateDuplicateWork(recordToSave);\n      if (!duplicateCheck.isValid) {\n        showError('同じ時間帯の作業記録が既に存在します');\n        return;\n      }\n\n      await window.aivicApi.save(1, recordToSave); // 工数記録テーブル\n      \n      // 確認画面表示\n      const confirmationScreen = container.querySelector('.confirmation-screen');\n      if (confirmationScreen) {\n        confirmationScreen.style.display = 'block';\n        const memoDisplay = confirmationScreen.querySelector('.memo-display');\n        if (memoDisplay) {\n          memoDisplay.textContent = recordToSave.メモ || '';\n        }\n      }\n\n      showSuccess('作業記録を保存しました');\n      currentWorkRecord = null;\n      await renderTodayHistory();\n    } catch (error) {\n      console.error('保存エラー:', error);\n      showError('保存に失敗しました');\n    }\n  }\n\n  // キャンセル処理\n  function handleCancel() {\n    if (currentWorkRecord || workMemoInput?.value) {\n      if (confirm('入力内容が失われますが、よろしいですか？')) {\n        currentWorkRecord = null;\n        if (workMemoInput) workMemoInput.value = '';\n        if (workDateInput) workDateInput.value = '';\n        if (startTimeInput) startTimeInput.value = '';\n        if (endTimeInput) endTimeInput.value = '';\n        if (workContentSelect) workContentSelect.value = '';\n        \n        updateWorkState('stopped');\n        clearInterval(elapsedTimer);\n        showSuccess('入力をキャンセルしました');\n      }\n    }\n  }\n\n  // イベントリスナーの設定\n  if (startBtn) {\n    startBtn.addEventListener('click', handleStartWork);\n  }\n\n  if (pauseBtn) {\n    pauseBtn.addEventListener('click', handlePauseWork);\n  }\n\n  if (confirmPauseBtn) {\n    confirmPauseBtn.addEventListener('click', handleConfirmPause);\n  }\n\n  if (cancelPauseBtn) {\n    cancelPauseBtn.addEventListener('click', () => {\n      if (pauseReasonSection) {\n        pauseReasonSection.style.display = 'none';\n      }\n    });\n  }\n\n  if (endBtn) {\n    endBtn.addEventListener('click', handleEndWork);\n  }\n\n  if (saveBtn) {\n    saveBtn.addEventListener('click', handleSave);\n  }\n\n  if (cancelBtn) {\n    cancelBtn.addEventListener('click', handleCancel);\n  }\n\n  // 再開ボタンの処理（中断状態で表示される）\n  const resumeBtn = container.querySelector('button:has-text(\"再開\")');\n  if (resumeBtn) {\n    resumeBtn.addEventListener('click', handleResumeWork);\n  }\n\n  // メモ文字数カウンター\n  if (workMemoInput && memoCounter) {\n    workMemoInput.addEventListener('input', () => {\n      const count = workMemoInput.value.length;\n      memoCounter.textContent = `${count}/500`;\n    });\n  }\n\n  // 初期化処理\n  async function initialize() {\n    try {\n      updateCurrentDateTime();\n      setInterval(updateCurrentDateTime, 1000);\n      \n      await loadWorkItems();\n      await renderTodayHistory();\n      \n      updateWorkState('stopped');\n      \n      // 今日の   <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
