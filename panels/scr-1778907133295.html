ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type":"text","required":false,"description":"管理者による対応内容や備考"},{"name":"検出日時","type":"timestamp","required":true,"description":"異常値が検出された日時"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentWorkRecord = null;\n  let startTime = null;\n  let elapsedInterval = null;\n  let pauseStartTime = null;\n  let totalPauseTime = 0;\n  let pauseRecords = [];\n\n  // 作業項目マスタのテーブルインデックス\n  const WORK_ITEMS_TABLE = 3;\n  const WORK_RECORDS_TABLE = 1;\n  const PAUSE_RECORDS_TABLE = 2;\n\n  // 現在時刻更新\n  function updateCurrentTime() {\n    const now = new Date();\n    const timeStr = now.toLocaleTimeString('ja-JP', { hour12: false });\n    container.querySelector('#current-time').textContent = timeStr;\n    \n    const dateStr = now.toLocaleDateString('ja-JP', { \n      year: 'numeric', \n      month: 'long', \n      day: 'numeric', \n      weekday: 'short' \n    });\n    container.querySelector('#current-date').textContent = dateStr;\n  }\n\n  // 経過時間更新\n  function updateElapsedTime() {\n    if (!startTime) return;\n    \n    const now = new Date();\n    let elapsed = now - startTime - totalPauseTime;\n    \n    if (pauseStartTime) {\n      // 中断中の場合は中断開始時点までの時間\n      elapsed = pauseStartTime - startTime - totalPauseTime;\n    }\n    \n    const hours = Math.floor(elapsed / (1000 * 60 * 60));\n    const minutes = Math.floor((elapsed % (1000 * 60 * 60)) / (1000 * 60));\n    const seconds = Math.floor((elapsed % (1000 * 60)) / 1000);\n    \n    const timeStr = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;\n    container.querySelector('#elapsed-time').textContent = timeStr;\n  }\n\n  // 作業状態更新\n  function updateWorkStatus(status, color = 'rgba(128,128,128,0.2)') {\n    const statusEl = container.querySelector('#work-status');\n    statusEl.textContent = status;\n    statusEl.style.background = color;\n  }\n\n  // エラーメッセージ表示\n  function showError(message) {\n    const errorEl = container.querySelector('#error-message');\n    errorEl.textContent = message;\n    errorEl.classList.remove('hidden');\n    setTimeout(() => errorEl.classList.add('hidden'), 5000);\n  }\n\n  // 作業項目読み込み\n  async function loadWorkItems() {\n    const workItems = await window.aivicApi.list(WORK_ITEMS_TABLE);\n    if (!workItems) return;\n    \n    const select = container.querySelector('#work-item-select');\n    select.innerHTML = '<option value=\"\">選択してください</option>';\n    \n    workItems\n      .filter(item => item.有効フラグ)\n      .sort((a, b) => (a.表示順序 || 0) - (b.表示順序 || 0))\n      .forEach(item => {\n        const option = document.createElement('option');\n        option.value = item.作業項目ID;\n        option.textContent = `${item.作業項目コード} - ${item.作業項目名}`;\n        select.appendChild(option);\n      });\n  }\n\n  // 本日の作業履歴表示\n  function renderTodayWorkList(records) {\n    const tbody = container.querySelector('#today-work-list');\n    const today = new Date().toISOString().split('T')[0];\n    \n    const todayRecords = records.filter(record => {\n      const recordDate = new Date(record.作業日).toISOString().split('T')[0];\n      return recordDate === today;\n    }).sort((a, b) => new Date(a.作業開始時刻) - new Date(b.作業開始時刻));\n    \n    if (todayRecords.length === 0) {\n      tbody.innerHTML = '<tr><td colspan=\"4\" style=\"text-align: center; padding: 16px; color: var(--text-muted);\">本日の作業履歴はありません</td></tr>';\n      return;\n    }\n    \n    tbody.innerHTML = todayRecords.map(record => {\n      const startTime = new Date(record.作業開始時刻).toLocaleTimeString('ja-JP', { hour12: false, hour: '2-digit', minute: '2-digit' });\n      const endTime = record.作業終了時刻? new Date(record.作業終了時刻).toLocaleTimeString('ja-JP', { hour12: false, hour: '2-digit', minute: '2-digit' }) : '作業中';\n      const workTime = record.作業時間 ? `${Math.floor(record.作業時間 / 60)}:${(record.作業時間 % 60).toString().padStart(2, '0')}` : '-';\n      \n      return `\n        <tr data-id=\"${record.作業記録ID}\">\n          <td style=\"padding: 6px 8px;\">${startTime}</td>\n          <td style=\"padding: 6px 8px;\">${endTime}</td>\n          <td style=\"padding: 6px 8px;\">${record.作業内容 || record.プロジェクト名 || '-'}</td>\n          <td style=\"padding: 6px 8px; text-align: right;\">${workTime}</td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // 作業開始\n  async function startWork() {\n    const workItemId = container.querySelector('#work-item-select').value;\n    if (!workItemId) {\n      showError('作業項目を選択してください');\n      return;\n    }\n\n    const workItems = await window.aivicApi.list(WORK_ITEMS_TABLE);\n    const selectedItem = workItems?.find(item => item.作業項目ID === workItemId);\n    \n    startTime = new Date();\n    totalPauseTime = 0;\n    pauseRecords = [];\n    pauseStartTime = null;\n    \n    // 作業記録を作成\n    const workRecord = {\n      作業員ID: 'current-user-id', // 実際の実装では認証情報から取得\n      作業日: startTime.toISOString(),\n      作業開始時刻: startTime.toISOString(),\n      プロジェクト名: selectedItem?.作業項目名|| '',\n      作業場所: '現場A', // 実際の実装では選択可能にする\n      作業種別: selectedItem?.カテゴリ || '一般作業',\n      作業内容: selectedItem?.作業項目名|| '',\n      進捗状況: '作業中',\n      承認状態: '未承認',\n      作成者ID: 'current-user-id'\n    };\n    \n    currentWorkRecord = await window.aivicApi.save(WORK_RECORDS_TABLE, workRecord);\n    if (!currentWorkRecord) {\n      showError('作業記録の作成に失敗しました');\n      return;\n    }\n    \n    // UI更新\n    updateWorkStatus('作業中', 'rgba(34,197,94,0.2)');\n    container.querySelector('#btn-start-work').disabled = true;\n    container.querySelector('#btn-end-work').disabled = false;\n    container.querySelector('#btn-pause-work').disabled = false;\n    container.querySelector('#work-item-select').disabled = true;\n    \n    // 経過時間更新開始\n    elapsedInterval = setInterval(updateElapsedTime, 1000);\n    updateElapsedTime();\n    \n    // 作業履歴を更新\n    const records = await window.aivicApi.list(WORK_RECORDS_TABLE);\n    if (records) renderTodayWorkList(records);\n  }\n\n  // 作業終了\n  async function endWork() {\n    if (!currentWorkRecord) {\n      showError('作業が開始されていません');\n      return;\n    }\n    \n    const endTime = new Date();\n    let totalWorkTime = endTime - startTime - totalPauseTime;\n    \n    // 中断中の場合は中断を終了\n    if (pauseStartTime) {\n      const pauseTime = endTime - pauseStartTime;\n      totalPauseTime += pauseTime;\n      \n      // 中断記録を保存\n      const pauseRecord = {\n        作業記録ID: currentWorkRecord.作業記録ID,\n        中断開始日時: pauseStartTime.toISOString(),\n        中断終了日時: endTime.toISOString(),\n        中断理由区分: '作業終了',\n        中断理由詳細: '作業終了のため中断終了',\n        中断時間: Math.floor(pauseTime / (1000 * 60)),\n        対応状況: '解決済み',\n        記録者ID: 'current-user-id'\n      };\n      \n      await window.aivicApi.save(PAUSE_RECORDS_TABLE, pauseRecord);\n      pauseStartTime = null;\n    }\n    \n    // 作業記録を更新\n    const workTimeMinutes = Math.floor(totalWorkTime / (1000 * 60));\n    const memo = container.querySelector('#work-memo').value;\n    \n    const updatedRecord = {\n      作業終了時刻: endTime.toISOString(),\n      作業時間: workTimeMinutes,\n      進捗状況: '完了',\n      備考: memo\n    };\n    \n    await window.aivicApi.update(WORK_RECORDS_TABLE, currentWorkRecord.作業記録ID, updatedRecord);\n    \n    // リセット\n    currentWorkRecord = null;\n    startTime = null;\n    totalPauseTime = 0;\n    pauseRecords = [];\n    \n    if (elapsedInterval) {\n      clearInterval(elapsedInterval);\n      elapsedInterval = null;\n    }\n    \n    // UI更新\n    updateWorkStatus('完了', 'rgba(59,130,246,0.2)');\n    container.querySelector('#btn-start-work').disabled = false;\n    container.querySelector('#btn-end-work').disabled = true;\n    container.querySelector('#btn-pause-work').disabled = true;\n    container.querySelector('#work-item-select').disabled = false;\n    container.querySelector('#elapsed-time').textContent = '00:00:00';\n    container.querySelector('#work-memo').value = '';\n    container.querySelector('#memo-count').textContent = '0';\n    \n    // 作業履歴を更新\n    const records = await window.aivicApi.list(WORK_RECORDS_TABLE);\n    if (records) renderTodayWorkList(records);\n  }\n\n  // 作業中断\n  function pauseWork() {\n    if (!currentWorkRecord) {\n      showError('作業が開始されていません');\n      return;\n    }\n    \n    if (pauseStartTime) {\n      showError('既に中断中です');\n      return;\n    }\n    \n    // 中断理由入力モーダルを表示\n    container.querySelector('#pause-modal').classList.remove('hidden');\n    container.querySelector('#pause-reason').value = '';\n    container.querySelector('#pause-reason').focus();\n  }\n\n  // 中断確定\n  async function confirmPause() {\n    const reason = container.querySelector('#pause-reason').value.trim();\n    if (!reason) {\n      showError('中断理由を入力してください');\n      return;\n    }\n    \n    if (reason.length > 500) {\n      showError('中断理由は500文字以内で入力してください');\n      return;\n    }\n    \n    pauseStartTime = new Date();\n    \n    // UI更新\n    updateWorkStatus('中断中', 'rgba(245,158,11,0.2)');\n    container.querySelector('#pause-modal').classList.add('hidden');\n    \n    // 中断記録を保存（開始のみ）\n    const pauseRecord = {\n      作業記録ID: currentWorkRecord.作業記録ID,\n      中断開始日時: pauseStartTime.toISOString(),\n      中断理由区分: '一般',\n      中断理由詳細: reason,\n      対応状況: '対応中',\n      記録者ID: 'current-user-id'\n    };\n    \n    const savedPauseRecord = await window.aivicApi.save(PAUSE_RECORDS_TABLE, pauseRecord);\n    if (savedPauseRecord) {\n      pauseRecords.push(savedPauseRecord);\n    }\n  }\n\n  // 作業再開\n  async function resumeWork() {\n    if (!pauseStartTime) return;\n    \n    const resumeTime = new Date();\n    const pauseTime = resumeTime - pauseStartTime;\n    totalPauseTime += pauseTime;\n    \n    // 最後の中断記録を更新\n    const lastPauseRecord = pauseRecords[pauseRecords.length - 1];\n    if (lastPauseRecord) {\n      await window.aivicApi.update(PAUSE_RECORDS_TABLE, lastPauseRecord.中断記録ID, {\n        中断終了日時: resumeTime.toISOString(),\n        中断時間: Math.floor(pauseTime / (1000 * 60)),\n        対応状況: '解決済み'\n      });\n    }\n    \n    pauseStartTime = null;\n    updateWorkStatus('作業中', 'rgba(34,197,94,0.2)');\n  }\n\n  // 保存\n  async function saveWork() {\n    const memo = container.querySelector('#work-memo').value;\n    \n    if (currentWorkRecord && memo) {\n      await window.aivicApi.update(WORK_RECORDS_TABLE, currentWorkRecord.作業記録ID, {\n        備考: memo\n      });\n    }\n    \n    // 作業履歴を更新\n    const records = await window.aivicApi.list(WORK_RECORDS_TABLE);\n    if (records) renderTodayWorkList(records);\n  }\n\n  // キャンセル\n  function cancelWork() {\n    if (currentWorkRecord) {\n      if (!confirm('作業中です。キャンセルしますか？未保存のデータは失われます。')) {\n        return;\n      }\n      \n      // 作業をリセット\n      if (elapsedInterval) {\n        clearInterval(elapsedInterval);\n        elapsedInterval = null;\n      }\n      \n      currentWorkRecord = null;\n      startTime = null;\n      totalPauseTime = 0;\n      pauseRecords = [];\n      pauseStartTime = null;\n      \n      // UI更新\n      updateWorkStatus('待機中', 'rgba(128,128,128,0.2)');\n      container.querySelector('#btn-start-work').disabled = false;\n      container.querySelector('#btn-end-work').disabled = true;\n      container.querySelector('#btn-pause-work').disabled = true;\n      container.querySelector('#work-item-select').disabled = false;\n      container.querySelector('#elapsed-time').textContent = '00:00:00';\n      container.querySelector('#work-memo').value = '';\n      container.querySelector('#memo-count').textContent = '0';\n    }\n  }\n\n  // メモ文字数カウント\n  function updateMemoCount() {\n    const memo = container.querySelector('#work-memo').value;\n    const count = memo.length;\n    container.querySelector('#memo-count').textContent = count;\n    \n    if (count > 500) {\n      container.querySelector('#work-memo').value = memo.substring(0, 500);\n      container.querySelector('#memo-count').textContent = '500';\n    }\n  }\n\n  // 初期化\n  async function init() {\n    // 現在時刻更新開始\n    updateCurrentTime();\n    setInterval(updateCurrentTime, 1000);\n    \n    // 作業項目読み込み\n    await loadWorkItems();\n    \n    // 本日の作業履歴表示\n    const records = await window.aivicApi.list(WORK_RECORDS_TABLE);\n    if (records) renderTodayWorkList(records);\n    \n    // イベントリスナー設定\n    container.querySelector('#btn-start-work').addEventListener('click', startWork);\n    container.querySelector('#btn-end-work').addEventListener('click', endWork);\n    container.querySelector('#btn-pause-work').addEventListener('click', pauseWork);\n    container.querySelector('#btn-confirm-pause').addEventListener('click', confirmPause);\n    container.querySelector('#btn-cancel-pause').addEventListener('click', () => {\n      container.querySelector('#pause-modal').classList.add('hidden');\n    });\n    container.querySelector('#btn-save').addEventListener('click', saveWork);\n    container.querySelector('#btn-cancel').addEventListener('click', cancelWork);\n    container.querySelector('#work-memo').addEventListener('input', updateMemoCount);\n    \n    // 画面遷移\n    container.querySelector('#btn-work-history').addEventListener('click', () => {\n      window.showScreen(\"scr-1778907145716\");\n    });\n    container.querySelector('#btn-emergency-report').addEventListener('click', () => {\n      window.showScreen(\"scr-1778907330826\");\n    });\n    \n    // 作業状態クリックで再開\n    container.querySelector('#work-status').addEventListener('click', () => {\n      if (pauseStartTime) {\n        resumeWork();\n      }\n    });\n    \n    // モーダル外クリックで閉じる\n    container.querySelector('#pause-modal').addEventListener('click', (e) => {\n      if (e.target.id === 'pause-modal') {\n        container.querySelector('#pause-modal').classList.add('hidden');\n      }\n    });\n  }\n\n  init();\n}";

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();

</script>
