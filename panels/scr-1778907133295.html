ired":true,"description":"作業項目の名称"},{"name":"作業項目説明","type":"text","required":false,"description":"作業項目の詳細説明"},{"name":"カテゴリ","type":"varchar(100)","required":false,"description":"作業項目の分類カテゴリ（絞り込み検索用）"},{"name":"標準工数時間","type":"integer","required":false,"description":"標準的な作業時間（分単位）"},{"name":"表示順序","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"作業項目の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"異常値検出ログ","purpose":"作業記録や中断記録の異常値を自動検出し、管理者への通知や確認を行うためのログテーブル","columns":[{"name":"異常値検出ログID","type":"uuid","required":true,"description":"異常値検出ログの一意識別子"},{"name":"検出対象テーブル","type":"varchar(100)","required":true,"description":"異常値が検出されたテーブル名（作業記録、中断記録等）"},{"name":"検出対象レコードID","type":"uuid","required":true,"description":"異常値が検出されたレコードのID"},{"name":"ユーザーID","type":"uuid","required":true,"description":"異常値を発生させた作業員のユーザーID"},{"name":"異常値種別","type":"varchar(100)","required":true,"description":"異常値の種類（長時間作業、頻繁中断、工数超過等）"},{"name":"検出項目","type":"varchar(100)","required":true,"description":"異常値が検出された項目名（作業時間、中断回数等）"},{"name":"検出値","type":"varchar(100)","required":true,"description":"実際に検出された異常値"},{"name":"閾値","type":"varchar(100)","required":true,"description":"異常判定の基準となる閾値"},{"name":"重要度","type":"varchar(100)","required":true,"description":"異常値の重要度レベル（高、中、低）"},{"name":"確認状況","type":"varchar(100)","required":true,"description":"管理者による確認状況（未確認、確認済み、対応済み）"},{"name":"通知送信フラグ","type":"boolean","required":true,"description":"管理者への通知が送信されたかのフラグ"},{"name":"確認者ID","type":"uuid","required":false,"description":"異常値を確認した管理者のユーザーID"},{"name":"確認日時","type":"timestamp","required":false,"description":"管理者が確認した日時"},{"name":"対応メモ","type": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentWorkRecord = null;\n  let startTime = null;\n  let pauseStartTime = null;\n  let totalPauseTime = 0;\n  let timerInterval = null;\n  let currentUser = { id: 'user-001', name: '田中 太郎', department: '設備保守部' };\n\n  // 現在時刻の更新\n  function updateCurrentTime() {\n    const now = new Date();\n    const timeStr = now.toLocaleString('ja-JP', {\n      year: 'numeric',\n      month: '2-digit',\n      day: '2-digit',\n      hour: '2-digit',\n      minute: '2-digit',\n      second: '2-digit'\n    });\n    container.querySelector('#current-time').textContent = timeStr;\n  }\n\n  // 経過時間の更新\n  function updateElapsedTime() {\n    if (!startTime) return;\n    \n    const now = new Date();\n    let elapsed = now - startTime - totalPauseTime;\n    \n    if (pauseStartTime) {\n      // 中断中の場合は中断開始時点までの時間\n      elapsed = pauseStartTime - startTime - totalPauseTime;\n    }\n    \n    const hours = Math.floor(elapsed / (1000 * 60 * 60));\n    const minutes = Math.floor((elapsed % (1000 * 60 * 60)) / (1000 * 60));\n    const seconds = Math.floor((elapsed % (1000 * 60)) / 1000);\n    \n    const timeStr = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;\n    container.querySelector('#elapsed-time').textContent = timeStr;\n  }\n\n  // 作業状態の更新\n  function updateWorkStatus(status, color = 'rgba(128,128,128,0.2)') {\n    const statusEl = container.querySelector('#work-status');\n    statusEl.textContent = status;\n    statusEl.style.background = color;\n  }\n\n  // ボタン状態の更新\n  function updateButtonStates(isWorking, isPaused = false) {\n    const startBtn = container.querySelector('#start-work-btn');\n    const pauseBtn = container.querySelector('#pause-work-btn');\n    const endBtn = container.querySelector('#end-work-btn');\n    \n    startBtn.disabled = isWorking;\n    pauseBtn.disabled = !isWorking || isPaused;\n    endBtn.disabled = !isWorking || isPaused;\n    \n    if (isPaused) {\n      pauseBtn.textContent = '再開';\n      pauseBtn.disabled = false;\n    } else {\n      pauseBtn.textContent = '中断';\n    }\n  }\n\n  // 本日の作業履歴を描画\n  function renderTodayHistory(records) {\n    const tbody = container.querySelector('#history-tbody');\n    const today = new Date().toISOString().split('T')[0];\n    \n    const todayRecords = records.filter(r => {\n      if (!r.作業日) return false;\n      const recordDate = new Date(r.作業日).toISOString().split('T')[0];\n      return recordDate === today && r.作業員ID === currentUser.id;\n    }).sort((a, b) => new Date(a.作業開始時刻) - new Date(b.作業開始時刻));\n    \n    tbody.innerHTML = todayRecords.map(r => {\n      const startTime = r.作業開始時刻 ? new Date(r.作業開始時刻).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) : '';\n      const endTime = r.作業終了時刻 ? new Date(r.作業終了時刻).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) : '';\n      const workHours = r.作業時間 ? `${Math.floor(r.作業時間 / 60)}:${(r.作業時間 % 60).toString().padStart(2, '0')}` : '';\n      \n      let statusBadge = '';\n      if (r.進捗状況 === '作業中') {\n        statusBadge = '<span style=\"padding: 2px 6px; border-radius: 3px; font-size: 10px; background: rgba(34, 197, 94, 0.2); color: #22c55e;\">作業中</span>';\n      } else if (r.進捗状況 === '完了') {\n        statusBadge = '<span style=\"padding: 2px 6px; border-radius: 3px; font-size: 10px; background: rgba(59, 130, 246, 0.2); color: #3b82f6;\">完了</span>';\n      } else if (r.進捗状況 === '中断') {\n        statusBadge = '<span style=\"padding: 2px 6px; border-radius: 3px; font-size: 10px; background: rgba(245, 158, 11, 0.2); color: #f59e0b;\">中断</span>';\n      }\n      \n      return `\n        <tr data-id=\"${r.id}\">\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${startTime}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${endTime}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${r.作業種別 || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${r.作業場所 || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${workHours}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${statusBadge}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            <button class=\"action-btn secondary edit-btn\" data-id=\"${r.id}\" style=\"font-size: 11px; padding: 4px 8px;\">編集</button>\n            <button class=\"action-btn secondary delete-btn\" data-id=\"${r.id}\" style=\"font-size: 11px; padding: 4px 8px;\">削除</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // 作業項目の読み込み\n  async function loadWorkItems() {\n    const workItems = await window.aivicApi.list(3); // 作業項目マスタ\n    const select = container.querySelector('#work-item-select');\n    \n    if (workItems) {\n      select.innerHTML = '<option value=\"\">選択してください</option>' + \n        workItems.filter(item => item.有効フラグ)\n          .sort((a, b) => (a.表示順序 || 0) - (b.表示順序 || 0))\n          .map(item => `<option value=\"${item.id}\">${item.作業項目名}</option>`)\n          .join('');\n    }\n  }\n\n  // 初期データの読み込みと描画\n  async function loadInitialData() {\n    const workRecords = await window.aivicApi.list(1); // 作業記録\n    if (workRecords) {\n      renderTodayHistory(workRecords);\n    }\n    await loadWorkItems();\n  }\n\n  // 文字数カウンターの更新\n  function updateCharCount(textarea, countElement) {\n    const count = textarea.value.length;\n    countElement.textContent = count;\n    if (count >= textarea.maxLength * 0.9) {\n      countElement.style.color = '#ef4444';\n    } else {\n      countElement.style.color = 'var(--text-muted)';\n    }\n  }\n\n  // 作業開始\n  async function startWork() {\n    const workItemId = container.querySelector('#work-item-select').value;\n    const workLocation = container.querySelector('#work-location-input').value.trim();\n    const workContent = container.querySelector('#work-content-textarea').value.trim();\n    \n    if (!workItemId) {\n      alert('作業項目を選択してください');\n      return;\n    }\n    \n    if (!workLocation) {\n      alert('作業場所を入力してください');\n      return;\n    }\n    \n    if (!workContent) {\n      alert('作業内容を入力してください');\n      return;\n    }\n    \n    const workItems = await window.aivicApi.list(3);\n    const selectedItem = workItems?.find(item => item.id === workItemId);\n    \n    const now = new Date();\n    const workRecord = {\n      作業員ID: currentUser.id,\n      作業日: now,\n      作業開始時刻: now,\n      プロジェクト名: selectedItem?.作業項目名|| '',\n      作業場所: workLocation,\n      作業種別: selectedItem?.作業項目名|| '',\n      作業内容: workContent,\n      進捗状況: '作業中',\n      承認状態: '未承認',\n      作成者ID: currentUser.id\n    };\n    \n    const saved = await window.aivicApi.save(1, workRecord);\n    if (saved) {\n      currentWorkRecord = saved;\n      startTime = now;\n      pauseStartTime = null;\n      totalPauseTime = 0;\n      \n      updateWorkStatus('作業中', 'rgba(34, 197, 94, 0.2)');\n      updateButtonStates(true, false);\n      \n      // タイマー開始\n      timerInterval = setInterval(updateElapsedTime, 1000);\n      \n      // 履歴を再読み込み\n      loadInitialData();\n    }\n  }\n\n  // 作業中断\n  function pauseWork() {\n    if (!currentWorkRecord) {\n      alert('作業が開始されていません');\n      return;\n    }\n    \n    if (pauseStartTime) {\n      // 再開処理\n      const now = new Date();\n      totalPauseTime += now - pauseStartTime;\n      pauseStartTime = null;\n      \n      updateWorkStatus('作業中', 'rgba(34, 197, 94, 0.2)');\n      updateButtonStates(true, false);\n    } else {\n      // 中断処理 - モーダル表示\n      container.querySelector('#pause-modal').classList.remove('hidden');\n    }\n  }\n\n  // 作業終了\n  async function endWork() {\n    if (!currentWorkRecord) {\n      alert('作業が開始されていません');\n      return;\n    }\n    \n    const now = new Date();\n    let workTime = Math.floor((now - startTime - totalPauseTime) / (1000 * 60)); // 分単位\n    \n    if (pauseStartTime) {\n      // 中断中の場合は中断開始時点までの時間\n      workTime = Math.floor((pauseStartTime - startTime - totalPauseTime) / (1000 * 60));\n    }\n    \n    const updated = await window.aivicApi.update(1, currentWorkRecord.id, {\n      作業終了時刻: now,\n      作業時間: workTime,\n      進捗状況: '完了'\n    });\n    \n    if (updated) {\n      currentWorkRecord = null;\n      startTime = null;\n      pauseStartTime = null;\n      totalPauseTime = 0;\n      \n      if (timerInterval) {\n        clearInterval(timerInterval);\n        timerInterval = null;\n      }\n      \n      updateWorkStatus('待機中', 'rgba(128,128,128,0.2)');\n      updateButtonStates(false, false);\n      container.querySelector('#elapsed-time').textContent = '00:00:00';\n      \n      // フォームクリア\n      container.querySelector('#work-item-select').value = '';\n      container.querySelector('#work-location-input').value = '';\n      container.querySelector('#work-content-textarea').value = '';\n      container.querySelector('#work-memo-textarea').value = '';\n      updateCharCount(container.querySelector('#work-memo-textarea'), container.querySelector('#memo-count'));\n      \n      // 履歴を再読み込み\n      loadInitialData();\n    }\n  }\n\n  // 保存処理\n  async function saveWork() {\n    const workMemo = container.querySelector('#work-memo-textarea').value.trim();\n    \n    if (currentWorkRecord && workMemo) {\n      await window.aivicApi.update(1, currentWorkRecord.id, {\n        備考: workMemo\n      });\n    }\n    \n    alert('保存しました');\n  }\n\n  // キャンセル処理\n  function cancelWork() {\n    if (currentWorkRecord) {\n      if (!confirm('作業中です。キャンセルしますか？')) {\n        return;\n      }\n      \n      // 作業中の記録を削除\n      window.aivicApi.delete(1, currentWorkRecord.id);\n      \n      currentWorkRecord = null;\n      startTime = null;\n      pauseStartTime = null;\n      totalPauseTime = 0;\n      \n      if (timerInterval) {\n        clearInterval(timerInterval);\n        timerInterval = null;\n      }\n      \n      updateWorkStatus('待機中', 'rgba(128,128,128,0.2)');\n      updateButtonStates(false, false);\n      container.querySelector('#elapsed-time').textContent = '00:00:00';\n    }\n    \n    // フォームクリア\n    container.querySelector('#work-item-select').value = '';\n    container.querySelector('#work-location-input').value = '';\n    container.querySelector('#work-content-textarea').value = '';\n    container.querySelector('#work-memo-textarea').value = '';\n    updateCharCount(container.querySelector('#work-memo-textarea'), container.querySelector('#memo-count'));\n    \n    loadInitialData();\n  }\n\n  // 中断確定処理\n  async function confirmPause() {\n    const category = container.querySelector('#pause-reason-category').value;\n    const detail = container.querySelector('#pause-reason-detail').value.trim();\n    \n    if (!category) {\n      alert('中断理由を選択してください');\n      return;\n    }\n    \n    if (!detail) {\n      alert('中断理由の詳細を入力してください');\n      return;\n    }\n    \n    const now = new Date();\n    pauseStartTime = now;\n    \n    // 中断記録を保存\n    const pauseRecord = {\n      作業記録ID: currentWorkRecord.id,\n      中断開始日時: now,\n      中断理由区分: category,\n      中断理由詳細: detail,\n      対応状況: '対応中',\n      記録者ID: currentUser.id\n    };\n    \n    await window.aivicApi.save(2, pauseRecord);\n    \n    updateWorkStatus('中断中', 'rgba(245, 158, 11, 0.2)');\n    updateButtonStates(true, true);\n    \n    // モーダルを閉じる\n    container.querySelector('#pause-modal').classList.add('hidden');\n    container.querySelector('#pause-reason-category').value = '';\n    container.querySelector('#pause-reason-detail').value = '';\n    updateCharCount(container.querySelector('#pause-reason-detail'), container.querySelector('#pause-reason-count'));\n  }\n\n  // イベントリスナーの設定\n  container.querySelector('#start-work-btn').addEventListener('click', startWork);\n  container.querySelector('#pause-work-btn').addEventListener('click', pauseWork);\n  container.querySelector('#end-work-btn').addEventListener('click', endWork);\n  container.querySelector('#save-btn').     <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 重要: 「同じ画面 ID」なら no-op にする。
  // AI シェルが旧 SPA runtime の習慣で load 時に showScreen(firstScreenId) を呼ぶケースが
  // あり、マルチページ版ではこれが「自分のページへ navigate」= 無限リロードループになる。
  // window.AIVIC_PAGE_SCREEN_ID と一致したら遷移しない防御策を入れる。
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    window.location.href = './' + encodeURIComponent(screenId) + '.html';
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
    });
  });
})();
